name: ci

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev bubblewrap
      - name: Verify Linux sandbox support
        if: runner.os == 'Linux'
        run: |
          # The disposable Ubuntu runner restricts capabilities inside user namespaces.
          # Allow bwrap to construct them; the tests still enforce filesystem/network isolation.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / --unshare-pid --unshare-ipc --unshare-uts --unshare-net -- /usr/bin/true
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast -- --nocapture
        timeout-minutes: 5
      - run: python3 -m unittest discover -s benchmarks -p 'test_*.py'
      - run: python3 benchmarks/bench.py validate
      - run: python3 benchmarks/bench.py validate-anchors
      - run: cargo xtask dashboard --check
