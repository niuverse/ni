name: release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type publish-niucode to publish 0.1.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: inputs.confirm == 'publish-niucode'
    runs-on: ubuntu-latest
    environment: crates-io
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Check release prerequisites
        run: ./scripts/publish-niucode.sh --check
      - name: Publish crates in order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: ./scripts/publish-niucode.sh --execute
