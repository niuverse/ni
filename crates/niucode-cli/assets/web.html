<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>niucode · session</title>
<style>
:root { color-scheme: dark; --bg:#0d1117; --panel:#161b22; --text:#e6edf3; --dim:#8b949e; --accent:#58a6ff; --err:#ff7b72; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
header { position:sticky; top:0; z-index:2; background:var(--panel); border-bottom:1px solid #30363d; padding:12px 18px; display:flex; gap:12px; align-items:center; }
header b { color:var(--accent); }
main { max-width:900px; margin:0 auto; padding:24px 18px 140px; }
aside { position:fixed; top:53px; bottom:70px; left:0; width:260px; overflow:auto; border-right:1px solid #30363d; padding:14px; background:#10151c; display:none; }
aside h4 { margin:14px 0 4px; color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.08em; }
aside p { margin:2px 0; font-size:12px; color:var(--text); overflow-wrap:anywhere; white-space:pre-wrap; }
aside input { width:100%; margin:0 0 10px; background:#0d1117; color:var(--text); border:1px solid #30363d; border-radius:6px; padding:6px 8px; font:12px ui-monospace,monospace; }
.ctx-section { border-bottom:1px solid #21262d; padding:4px 0; }
.ctx-section summary { cursor:pointer; color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.08em; padding:4px 0; }
.ctx-section summary span { float:right; }
.ctx-empty { color:var(--dim); font-size:12px; }
@media (min-width: 980px) { aside { display:block; } main { margin-left:280px; } footer { padding-left:280px; } }
.msg { border-left:3px solid #30363d; padding:8px 14px; margin:14px 0; white-space:pre-wrap; overflow-wrap:anywhere; }
.msg.user { border-color:var(--accent); }
.msg.assistant { border-color:#3fb950; }
.msg.assistant h1,.msg.assistant h2,.msg.assistant h3 { margin:12px 0 6px; line-height:1.25; }
.msg.assistant p { margin:8px 0; }
.msg.assistant ul,.msg.assistant ol { padding-left:22px; margin:8px 0; }
.msg.assistant blockquote { border-left:3px solid #30363d; margin:8px 0; padding-left:12px; color:var(--dim); }
.msg.assistant table { border-collapse:collapse; margin:10px 0; display:block; overflow-x:auto; }
.msg.assistant th,.msg.assistant td { border:1px solid #30363d; padding:5px 9px; text-align:left; }
.msg.assistant th { background:#161b22; }
.msg.assistant pre { position:relative; background:#010409; border:1px solid #30363d; border-radius:6px; padding:10px; overflow-x:auto; }
.copy-code { position:absolute; top:6px; right:6px; padding:2px 7px; font-size:11px; border:1px solid #30363d; border-radius:5px; background:#161b22; color:var(--dim); cursor:pointer; opacity:.75; }
.copy-code:hover { opacity:1; color:var(--text); }
.msg.assistant code { background:#161b22; border-radius:4px; padding:1px 4px; }
.msg.assistant pre code { background:none; padding:0; }
.msg.assistant math { font-size:1.05em; }
.tok-keyword { color:#ff7b72; } .tok-string { color:#a5d6ff; } .tok-comment { color:#8b949e; font-style:italic; }
.tok-number { color:#79c0ff; } .tok-function { color:#d2a8ff; }
.tool-card { border:1px solid #30363d; border-radius:6px; margin:8px 0; background:#0d1117; overflow:hidden; }
.tool-card summary { cursor:pointer; padding:6px 10px; color:var(--dim); font:12px/1.4 ui-monospace,monospace; }
.tool-card.ok summary { color:#3fb950; } .tool-card.err summary { color:var(--err); }
.tool-card pre { margin:0; padding:8px 10px; border-top:1px solid #21262d; color:var(--text); max-height:240px; overflow:auto; }
.msg.tool { border-color:#8b949e; color:var(--dim); font-family:ui-monospace,monospace; font-size:13px; white-space:pre-wrap; }
.meta { color:var(--dim); font-size:12px; margin:2px 0 6px; }
.live { margin-left:auto; color:var(--dim); font-size:12px; } .live.on { color:#3fb950; }
.chip { border:1px solid #30363d; border-radius:999px; padding:1px 8px; font-size:11px; color:var(--dim); white-space:nowrap; }
#busy { color:var(--accent); }
#busy.working { border-color:var(--accent); }
aside.hidden { display:none !important; }
#toggle-context { cursor:pointer; background:none; }
#cwd { max-width:320px; overflow:hidden; text-overflow:ellipsis; }
@media (max-width: 760px) { #cwd, #mode { display:none; } }
details { margin:8px 0; } summary { cursor:pointer; color:var(--dim); }
input,button { font:inherit; }
footer { position:fixed; bottom:0; left:0; right:0; background:var(--panel); border-top:1px solid #30363d; padding:10px 18px; color:var(--dim); font-size:13px; }
form { display:flex; gap:8px; max-width:900px; margin:0 auto 8px; }
input, textarea { flex:1; background:#0d1117; color:var(--text); border:1px solid #30363d; border-radius:6px; padding:9px 12px; outline:none; font:inherit; }
input:focus, textarea:focus { border-color:var(--accent); }
textarea { resize:none; min-height:42px; max-height:160px; overflow-y:auto; line-height:1.4; }
button { background:var(--accent); color:#07111f; border:0; border-radius:6px; padding:9px 16px; font-weight:600; cursor:pointer; }
button:disabled { opacity:.5; cursor:default; }
#status { max-width:900px; margin:0 auto; min-height:1.2em; }
code { font-family:ui-monospace,monospace; color:#79c0ff; }
.approval { border:1px solid #d29922; border-radius:8px; padding:12px; margin:14px 0; background:#1c1710; }
.approval h3 { margin:0 0 6px; color:#d29922; font-size:14px; }
.approval pre { white-space:pre-wrap; color:var(--dim); font-size:12px; }
.preview { border:1px solid #30363d; border-radius:6px; margin:8px 0; overflow:auto; max-height:360px; background:#0d1117; }
.diff-file { border-bottom:1px solid #21262d; }
.diff-head { padding:5px 8px; color:var(--dim); font-size:12px; background:#161b22; }
.diff-line { display:flex; gap:8px; font:12px/1.45 ui-monospace,monospace; white-space:pre; padding:0 8px; }
.diff-line.add { background:#12261a; color:#aff5b4; }
.diff-line.remove { background:#2d1214; color:#ffb3ba; }
.diff-num { color:#6e7681; min-width:3ch; text-align:right; user-select:none; }
.approval button { margin-right:8px; } .deny { background:#30363d; color:var(--text); }
</style>
</head>
<body>
<header><button id="toggle-context" class="chip" title="Toggle context">☰</button><b id="brand">niucode</b><span id="model" class="chip">model…</span><span id="cwd" class="chip">cwd…</span><span id="mode" class="chip">policy…</span><span id="busy" class="chip">idle</span><span id="id" class="meta">loading…</span><span id="live" class="live">○ connecting</span></header>
<aside id="context"><input id="ctx-filter" placeholder="Filter context…" autocomplete="off"><div id="ctx-body"><div class="ctx-empty">loading context…</div></div></aside>
<main id="log"></main>
<footer><form id="composer"><textarea id="prompt" rows="1" autocomplete="off" placeholder="Ask for a task…"></textarea><button id="send">Send</button></form><div id="status">Enter to send · Shift+Enter for a newline · ↑ history · bind 127.0.0.1</div></footer>
<script>
const log = document.getElementById('log');
const id = document.getElementById('id');
const live = document.getElementById('live');
function node(tag, cls, text) { const e=document.createElement(tag); if(cls)e.className=cls; if(text)e.textContent=text; return e; }
function add(cls, text) { const d=node('div','msg '+cls,text); log.appendChild(d); return d; }
let count = 0, streaming = null, streamText = '';
let turnStart = null, turnTimer = null, turnPhase = 'working';
function beginTurn(phase) {
  if (phase) turnPhase = phase;
  if (turnStart === null) {
    turnStart = Date.now();
    turnTimer = setInterval(() => {
      const elapsed = ((Date.now() - turnStart) / 1000).toFixed(1);
      document.getElementById('busy').textContent = turnPhase + ' ' + elapsed + 's';
    }, 200);
  }
  const busy = document.getElementById('busy');
  busy.textContent = turnPhase + ' 0.0s';
  busy.classList.add('working');
}
function endTurn() {
  if (turnTimer) { clearInterval(turnTimer); turnTimer = null; }
  const elapsed = turnStart === null ? 0 : (Date.now() - turnStart) / 1000;
  turnStart = null;
  const busy = document.getElementById('busy');
  busy.textContent = 'idle';
  busy.classList.remove('working');
  return elapsed.toFixed(1);
}
function render(e) {
  count += 1;
  id.textContent = count + ' events';
  if (e.type === 'session_start') add('meta','session · '+e.cwd);
  else if (e.type === 'user_message') add('user', e.text);
  else if (e.type === 'assistant_message') {
    if (streaming) {
      if (e.html) streaming.innerHTML = e.html; else streaming.textContent = e.text || streamText;
      streaming = null; streamText = ''; return;
    }
    const d = add('assistant', '');
    if (e.html) { d.innerHTML = e.html; addCopyButtons(d); } else d.textContent = e.text || '';
    if (e.tool_calls && e.tool_calls.length) {
      const det = node('details'); det.appendChild(node('summary',null,e.tool_calls.length+' tool call(s)'));
      for (const c of e.tool_calls) det.appendChild(node('div','meta',c.name+' '+JSON.stringify(c.input)));
      d.appendChild(det);
    }
  }
  else if (e.type === 'text_delta') {
    if (!streaming) { streaming = add('assistant',''); streamText = ''; }
    streamText += e.text || '';
    if (e.html) streaming.innerHTML = e.html; else streaming.textContent = streamText;
  }
  else if (e.type === 'tool_call') renderToolCall(e);
  else if (e.type === 'tool_result') renderToolResult(e);
  else if (e.type === 'context_changed') loadContext();
  else if (e.type === 'approval') { beginTurn('approval'); renderApproval(e); }
  else if (e.type === 'phase') { if (e.phase === 'done') endTurn(); else beginTurn(e.phase); }
  else if (e.type === 'turn_end') { const elapsed = endTurn(); add('meta','turn · '+elapsed+'s · '+JSON.stringify(e.usage)); setTimeout(loadContext, 600); }
}
function addCopyButtons(root) {
  for (const pre of root.querySelectorAll('pre.code')) {
    if (pre.querySelector('.copy-code')) continue;
    const button = node('button','copy-code','Copy');
    button.onclick = async () => {
      const code = pre.querySelector('code');
      const text = code ? code.innerText : pre.innerText;
      try {
        await navigator.clipboard.writeText(text);
        button.textContent = 'Copied';
        setTimeout(() => { button.textContent = 'Copy'; }, 1200);
      } catch (_) { button.textContent = 'Copy failed'; }
    };
    pre.appendChild(button);
  }
}

function renderToolCall(e) {
  const card = node('details','tool-card');
  card.appendChild(node('summary',null,'→ '+e.name+' '+JSON.stringify(e.input||{}).slice(0,140)));
  if (e.input) card.appendChild(node('pre',null,JSON.stringify(e.input,null,2)));
  log.appendChild(card);
}
function renderToolResult(e) {
  const card = node('details','tool-card '+(e.ok?'ok':'err'));
  card.appendChild(node('summary',null,(e.ok?'✓ ':'✗ ')+(e.name||'tool')+' · '+(e.summary||'')));
  card.appendChild(node('pre',null,e.output||e.summary||''));
  log.appendChild(card);
}

function renderPreview(preview) {
  const box = node('div','preview');
  if (!preview || !preview.body) { box.appendChild(node('div','meta','preview unavailable')); return box; }
  const body = preview.body;
  if (body.kind === 'command') {
    const pre = node('pre'); pre.textContent = body.command || ''; box.appendChild(pre); return box;
  }
  if (body.kind === 'note') { box.appendChild(node('div','meta', body.message || '')); return box; }
  if (body.kind !== 'diff') { box.appendChild(node('div','meta','preview unavailable')); return box; }
  let lines = 0;
  for (const file of body.files || []) {
    const section = node('div','diff-file');
    const head = node('div','diff-head');
    head.textContent = (file.is_new ? 'new ' : '') + file.path + '  +' + file.added + ' −' + file.removed;
    section.appendChild(head);
    for (const hunk of file.hunks || []) {
      for (const line of hunk.lines || []) {
        if (lines++ > 200) break;
        const row = node('div','diff-line ' + (line.kind || 'context'));
        const old = node('span','diff-num', line.old_line == null ? '' : String(line.old_line));
        const neu = node('span','diff-num', line.new_line == null ? '' : String(line.new_line));
        const mark = node('span',null, line.kind === 'add' ? '+' : line.kind === 'remove' ? '−' : ' ');
        const text = node('span',null,line.text || '');
        row.append(old, neu, mark, text); section.appendChild(row);
      }
    }
    box.appendChild(section);
  }
  if (preview.warning) box.appendChild(node('div','meta',preview.warning));
  return box;
}

function renderApproval(e) {
  const card = node('div','approval');
  card.appendChild(node('h3',null,'Approval · '+e.tool));
  card.appendChild(node('div','meta',e.summary || ''));
  if (e.preview) card.appendChild(renderPreview(e.preview));
  const allow = node('button',null,'Allow');
  const deny = node('button','deny','Deny');
  const finish = async allowed => {
    allow.disabled = deny.disabled = true;
    try {
      const r = await fetch('/api/approval', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id:e.id, allowed})});
      if (!r.ok) throw new Error('approval failed');
      card.appendChild(node('div','meta', allowed ? 'allowed' : 'denied'));
    } catch (err) { card.appendChild(node('div','meta','error: '+err.message)); }
  };
  allow.onclick = () => finish(true); deny.onclick = () => finish(false);
  card.appendChild(allow); card.appendChild(deny);
  log.appendChild(card);
}
async function refreshStatus() {
  try {
    const status = await fetch('/api/status').then(r=>r.json());
    document.getElementById('model').textContent = status.model || status.provider || 'model';
    document.getElementById('cwd').textContent = status.cwd || '';
    document.getElementById('mode').textContent = (status.sandbox || '') + ' / ' + (status.approval || '');
    if (turnStart === null) document.getElementById('busy').textContent = status.busy ? 'working' : 'idle';
  } catch (_) {}
}
refreshStatus(); setInterval(refreshStatus, 2500);
const CTX_KEY = 'niucode.context.collapsed';
function collapsedSections() {
  try { return JSON.parse(localStorage.getItem(CTX_KEY) || '{}'); } catch (_) { return {}; }
}
async function loadContext() {
  try {
    const ctx = await fetch('/api/context').then(r=>r.json());
    if (ctx.brand) document.getElementById('brand').textContent = ctx.brand;
    if (ctx.title) document.title = ctx.title;
    const body = document.getElementById('ctx-body');
    body.textContent = '';
    if (!ctx.sections || !ctx.sections.length) {
      body.appendChild(node('div','ctx-empty','no product context'));
      return;
    }
    const collapsed = collapsedSections();
    for (const section of ctx.sections) {
      const title = section.title || '';
      const details = node('details','ctx-section');
      details.dataset.title = title;
      details.open = !collapsed[title];
      const summary = node('summary',null,title);
      summary.appendChild(node('span',null,String((section.lines || []).length)));
      details.appendChild(summary);
      for (const line of section.lines || []) details.appendChild(node('p',null,line));
      details.addEventListener('toggle', () => {
        const state = collapsedSections();
        if (details.open) delete state[title]; else state[title] = true;
        try { localStorage.setItem(CTX_KEY, JSON.stringify(state)); } catch (_) {}
      });
      body.appendChild(details);
    }
    filterContext();
  } catch (_) {}
}
loadContext();
setInterval(loadContext, 15000);
function filterContext() {
  const query = document.getElementById('ctx-filter').value.trim().toLowerCase();
  for (const section of document.querySelectorAll('.ctx-section')) {
    section.hidden = !!query && !section.textContent.toLowerCase().includes(query);
  }
}
document.getElementById('ctx-filter').addEventListener('input', filterContext);
document.getElementById('toggle-context').onclick = () => {
  document.getElementById('context').classList.toggle('hidden');
};
const source = new EventSource('/api/events');
source.onopen = () => { live.textContent = '● live'; live.className = 'live on'; };
source.onerror = () => { live.textContent = '○ reconnecting'; live.className = 'live'; };
source.onmessage = event => { try { render(JSON.parse(event.data)); } catch (_) {} };
const form = document.getElementById('composer');
const input = document.getElementById('prompt');
const send = document.getElementById('send');
const HISTORY_KEY = 'niucode.prompt.history';
let history = [];
let historyIndex = -1;
try { history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch (_) { history = []; }
function rememberPrompt(prompt) {
  if (!prompt) return;
  history = [prompt, ...history.filter(item => item !== prompt)].slice(0, 50);
  historyIndex = -1;
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); } catch (_) {}
}
function recallHistory() {
  if (!history.length) return;
  if (historyIndex === -1) historyIndex = 0;
  else historyIndex = Math.min(historyIndex + 1, history.length - 1);
  input.value = history[historyIndex];
  growComposer();
}
function newerHistory() {
  if (historyIndex === -1) return;
  if (historyIndex === 0) { historyIndex = -1; input.value = ''; }
  else { historyIndex -= 1; input.value = history[historyIndex]; }
  growComposer();
}
function growComposer() {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 160) + 'px';
}
input.addEventListener('input', growComposer);
input.addEventListener('keydown', event => {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    form.requestSubmit();
  } else if (event.key === 'ArrowUp' && input.selectionStart === 0 && !input.value.includes('\n')) {
    event.preventDefault();
    recallHistory();
  } else if (event.key === 'ArrowDown' && historyIndex !== -1) {
    event.preventDefault();
    newerHistory();
  }
});
const status = document.getElementById('status');
form.onsubmit = async event => {
  event.preventDefault();
  const prompt = input.value.trim();
  if (!prompt) return;
  rememberPrompt(prompt);
  const command = prompt.split(/\s+/)[0];
  if (command === '/help') {
    add('meta','commands: /help · /status · /report · anything else goes to the agent');
    input.value = ''; growComposer(); status.textContent = 'local command'; return;
  }
  if (command === '/status') {
    try {
      const s = await fetch('/api/status').then(r => r.json());
      add('meta', 'model ' + (s.model || '?') + ' · ' + (s.cwd || '?') + ' · ' + (s.sandbox || '?') + ' / ' + (s.approval || '?') + ' · net ' + (s.network || '?'));
      input.value = ''; growComposer(); status.textContent = 'local command';
    } catch (error) { status.textContent = 'status failed: ' + error.message; }
    return;
  }
  if (command === '/report') {
    document.getElementById('ctx-filter').value = 'report';
    await loadContext();
    status.textContent = 'local command · report shown in context';
    input.value = ''; growComposer(); return;
  }
  if (command.startsWith('/')) {
    add('meta','unknown command ' + command + ' · /help');
    input.value = ''; growComposer(); status.textContent = 'local command'; return;
  }
  send.disabled = true; status.textContent = 'sending…'; beginTurn('sending');
  try {
    const response = await fetch('/api/prompt', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({prompt}) });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || response.statusText);
    input.value = ''; growComposer(); status.textContent = 'turn running…';
  } catch (error) { status.textContent = 'error: ' + error.message; }
  finally { send.disabled = false; }
};
</script>
</body>
</html>
