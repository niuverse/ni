<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>niucode · session</title>
<style>
:root { color-scheme: dark; --bg:#0d1117; --panel:#161b22; --text:#e6edf3; --dim:#8b949e; --accent:#58a6ff; --err:#ff7b72; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
header { position:sticky; top:0; z-index:2; background:var(--panel); border-bottom:1px solid #30363d; padding:12px 18px; display:flex; gap:12px; align-items:center; }
header b { color:var(--accent); }
main { max-width:900px; margin:0 auto; padding:24px 18px 140px; }
aside { position:fixed; top:53px; bottom:70px; left:0; width:260px; overflow:auto; border-right:1px solid #30363d; padding:14px; background:#10151c; display:none; }
aside h4 { margin:14px 0 4px; color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.08em; }
aside p { margin:2px 0; font-size:12px; color:var(--text); overflow-wrap:anywhere; white-space:pre-wrap; }
.ctx-empty { color:var(--dim); font-size:12px; }
@media (min-width: 980px) { aside { display:block; } main { margin-left:280px; } footer { padding-left:280px; } }
.msg { border-left:3px solid #30363d; padding:8px 14px; margin:14px 0; white-space:pre-wrap; overflow-wrap:anywhere; }
.msg.user { border-color:var(--accent); }
.msg.assistant { border-color:#3fb950; }
.msg.assistant h1,.msg.assistant h2,.msg.assistant h3 { margin:12px 0 6px; line-height:1.25; }
.msg.assistant p { margin:8px 0; }
.msg.assistant ul,.msg.assistant ol { padding-left:22px; margin:8px 0; }
.msg.assistant blockquote { border-left:3px solid #30363d; margin:8px 0; padding-left:12px; color:var(--dim); }
.msg.assistant table { border-collapse:collapse; margin:10px 0; display:block; overflow-x:auto; }
.msg.assistant th,.msg.assistant td { border:1px solid #30363d; padding:5px 9px; text-align:left; }
.msg.assistant th { background:#161b22; }
.msg.assistant pre { background:#010409; border:1px solid #30363d; border-radius:6px; padding:10px; overflow-x:auto; }
.msg.assistant code { background:#161b22; border-radius:4px; padding:1px 4px; }
.msg.assistant pre code { background:none; padding:0; }
.msg.assistant math { font-size:1.05em; }
.tok-keyword { color:#ff7b72; } .tok-string { color:#a5d6ff; } .tok-comment { color:#8b949e; font-style:italic; }
.tok-number { color:#79c0ff; } .tok-function { color:#d2a8ff; }
.msg.tool { border-color:#8b949e; color:var(--dim); font-family:ui-monospace,monospace; font-size:13px; white-space:pre-wrap; }
.meta { color:var(--dim); font-size:12px; margin:2px 0 6px; }
.live { margin-left:auto; color:var(--dim); font-size:12px; } .live.on { color:#3fb950; }
.chip { border:1px solid #30363d; border-radius:999px; padding:1px 8px; font-size:11px; color:var(--dim); white-space:nowrap; }
#busy { color:var(--accent); }
#busy.working { border-color:var(--accent); }
aside.hidden { display:none !important; }
#toggle-context { cursor:pointer; background:none; }
#cwd { max-width:320px; overflow:hidden; text-overflow:ellipsis; }
@media (max-width: 760px) { #cwd, #mode { display:none; } }
details { margin:8px 0; } summary { cursor:pointer; color:var(--dim); }
input,button { font:inherit; }
footer { position:fixed; bottom:0; left:0; right:0; background:var(--panel); border-top:1px solid #30363d; padding:10px 18px; color:var(--dim); font-size:13px; }
form { display:flex; gap:8px; max-width:900px; margin:0 auto 8px; }
input { flex:1; background:#0d1117; color:var(--text); border:1px solid #30363d; border-radius:6px; padding:9px 12px; outline:none; }
input:focus { border-color:var(--accent); }
button { background:var(--accent); color:#07111f; border:0; border-radius:6px; padding:9px 16px; font-weight:600; cursor:pointer; }
button:disabled { opacity:.5; cursor:default; }
#status { max-width:900px; margin:0 auto; min-height:1.2em; }
code { font-family:ui-monospace,monospace; color:#79c0ff; }
.approval { border:1px solid #d29922; border-radius:8px; padding:12px; margin:14px 0; background:#1c1710; }
.approval h3 { margin:0 0 6px; color:#d29922; font-size:14px; }
.approval pre { white-space:pre-wrap; color:var(--dim); font-size:12px; }
.approval button { margin-right:8px; } .deny { background:#30363d; color:var(--text); }
</style>
</head>
<body>
<header><button id="toggle-context" class="chip" title="Toggle context">☰</button><b id="brand">niucode</b><span id="model" class="chip">model…</span><span id="cwd" class="chip">cwd…</span><span id="mode" class="chip">policy…</span><span id="busy" class="chip">idle</span><span id="id" class="meta">loading…</span><span id="live" class="live">○ connecting</span></header>
<aside id="context"><div class="ctx-empty">loading context…</div></aside>
<main id="log"></main>
<footer><form id="composer"><input id="prompt" autocomplete="off" placeholder="Ask for a read-only task…"><button id="send">Send</button></form><div id="status">Read-only local chat · bind 127.0.0.1</div></footer>
<script>
const log = document.getElementById('log');
const id = document.getElementById('id');
const live = document.getElementById('live');
function node(tag, cls, text) { const e=document.createElement(tag); if(cls)e.className=cls; if(text)e.textContent=text; return e; }
function add(cls, text) { const d=node('div','msg '+cls,text); log.appendChild(d); return d; }
let count = 0, streaming = null, streamText = '';
let turnStart = null, turnTimer = null, turnPhase = 'working';
function beginTurn(phase) {
  if (phase) turnPhase = phase;
  if (turnStart === null) {
    turnStart = Date.now();
    turnTimer = setInterval(() => {
      const elapsed = ((Date.now() - turnStart) / 1000).toFixed(1);
      document.getElementById('busy').textContent = turnPhase + ' ' + elapsed + 's';
    }, 200);
  }
  const busy = document.getElementById('busy');
  busy.textContent = turnPhase + ' 0.0s';
  busy.classList.add('working');
}
function endTurn() {
  if (turnTimer) { clearInterval(turnTimer); turnTimer = null; }
  const elapsed = turnStart === null ? 0 : (Date.now() - turnStart) / 1000;
  turnStart = null;
  const busy = document.getElementById('busy');
  busy.textContent = 'idle';
  busy.classList.remove('working');
  return elapsed.toFixed(1);
}
function render(e) {
  count += 1;
  id.textContent = count + ' events';
  if (e.type === 'session_start') add('meta','session · '+e.cwd);
  else if (e.type === 'user_message') add('user', e.text);
  else if (e.type === 'assistant_message') {
    if (streaming) {
      if (e.html) streaming.innerHTML = e.html; else streaming.textContent = e.text || streamText;
      streaming = null; streamText = ''; return;
    }
    const d = add('assistant', '');
    if (e.html) d.innerHTML = e.html; else d.textContent = e.text || '';
    if (e.tool_calls && e.tool_calls.length) {
      const det = node('details'); det.appendChild(node('summary',null,e.tool_calls.length+' tool call(s)'));
      for (const c of e.tool_calls) det.appendChild(node('div','meta',c.name+' '+JSON.stringify(c.input)));
      d.appendChild(det);
    }
  }
  else if (e.type === 'text_delta') {
    if (!streaming) { streaming = add('assistant',''); streamText = ''; }
    streamText += e.text || ''; streaming.textContent = streamText;
  }
  else if (e.type === 'tool_call') add('tool','→ '+e.name+' '+JSON.stringify(e.input||{}));
  else if (e.type === 'tool_result') { const det=node('details'); det.appendChild(node('summary',null,(e.ok?'✓ ':'✗ ')+'tool result')); det.appendChild(node('div','msg tool',e.output||e.summary||'')); add('tool','').appendChild(det); }
  else if (e.type === 'approval') { beginTurn('approval'); renderApproval(e); }
  else if (e.type === 'phase') { if (e.phase === 'done') endTurn(); else beginTurn(e.phase); }
  else if (e.type === 'turn_end') { const elapsed = endTurn(); add('meta','turn · '+elapsed+'s · '+JSON.stringify(e.usage)); }
}
function renderApproval(e) {
  const card = node('div','approval');
  card.appendChild(node('h3',null,'Approval · '+e.tool));
  card.appendChild(node('div','meta',e.summary || ''));
  if (e.preview) card.appendChild(node('pre',null,JSON.stringify(e.preview, null, 2).slice(0, 4000)));
  const allow = node('button',null,'Allow');
  const deny = node('button','deny','Deny');
  const finish = async allowed => {
    allow.disabled = deny.disabled = true;
    try {
      const r = await fetch('/api/approval', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id:e.id, allowed})});
      if (!r.ok) throw new Error('approval failed');
      card.appendChild(node('div','meta', allowed ? 'allowed' : 'denied'));
    } catch (err) { card.appendChild(node('div','meta','error: '+err.message)); }
  };
  allow.onclick = () => finish(true); deny.onclick = () => finish(false);
  card.appendChild(allow); card.appendChild(deny);
  log.appendChild(card);
}
async function refreshStatus() {
  try {
    const status = await fetch('/api/status').then(r=>r.json());
    document.getElementById('model').textContent = status.model || status.provider || 'model';
    document.getElementById('cwd').textContent = status.cwd || '';
    document.getElementById('mode').textContent = (status.sandbox || '') + ' / ' + (status.approval || '');
    if (turnStart === null) document.getElementById('busy').textContent = status.busy ? 'working' : 'idle';
  } catch (_) {}
}
refreshStatus(); setInterval(refreshStatus, 2500);
fetch('/api/context').then(r=>r.json()).then(ctx=>{
  if (ctx.brand) document.getElementById('brand').textContent = ctx.brand;
  if (ctx.title) document.title = ctx.title;
  const aside = document.getElementById('context');
  aside.textContent = '';
  if (!ctx.sections || !ctx.sections.length) {
    aside.appendChild(node('div','ctx-empty','no product context'));
    return;
  }
  for (const section of ctx.sections) {
    aside.appendChild(node('h4',null,section.title || ''));
    for (const line of section.lines || []) aside.appendChild(node('p',null,line));
  }
}).catch(()=>{});
document.getElementById('toggle-context').onclick = () => {
  document.getElementById('context').classList.toggle('hidden');
};
const source = new EventSource('/api/events');
source.onopen = () => { live.textContent = '● live'; live.className = 'live on'; };
source.onerror = () => { live.textContent = '○ reconnecting'; live.className = 'live'; };
source.onmessage = event => { try { render(JSON.parse(event.data)); } catch (_) {} };
const form = document.getElementById('composer');
const input = document.getElementById('prompt');
const send = document.getElementById('send');
const status = document.getElementById('status');
form.onsubmit = async event => {
  event.preventDefault();
  const prompt = input.value.trim();
  if (!prompt) return;
  send.disabled = true; status.textContent = 'sending…'; beginTurn('sending');
  try {
    const response = await fetch('/api/prompt', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({prompt}) });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || response.statusText);
    input.value = ''; status.textContent = 'turn running…';
  } catch (error) { status.textContent = 'error: ' + error.message; }
  finally { send.disabled = false; }
};
</script>
</body>
</html>
