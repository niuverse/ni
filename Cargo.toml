[workspace]
resolver = "2"
members = [
    "crates/niucode-core",
    "crates/niucode-auth",
    "crates/niucode-provider",
    "crates/niucode-tools",
    "crates/niucode-agent",
    "crates/niucode-cli",
    "crates/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
repository = "https://github.com/niuverse/niucode"

[workspace.dependencies]
anyhow = "1.0"
async-stream = "0.3"
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
globset = "0.4"
ignore = "0.4"
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
rpassword = "7.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "charset", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
similar = "2"
serde_json = "1.0"
thiserror = "2.0"
tokio-util = { version = "0.7", features = ["codec", "io-util"] }
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "process", "signal"] }
toml = "0.8"
walkdir = "2.5"
