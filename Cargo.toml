[workspace]
resolver = "2"
members = [
    "crates/niucode-core",
    "crates/niucode-auth",
    "crates/niucode-provider",
    "crates/niucode-tools",
    "crates/niucode-agent",
    "crates/niucode-extension",
    "crates/niucode-cli",
    "crates/xtask",
    "benchmarks/gateway",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.88"
repository = "https://github.com/niuverse/niucode"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
async-stream = "0.3"
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
globset = "0.4"
ignore = "0.4"
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.29", features = ["use-dev-tty"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
rpassword = "7.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "charset", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
similar = "2"
sha2 = "0.10"
tempfile = "3"
serde_json = "1.0"
thiserror = "2.0"
tokio-util = { version = "0.7", features = ["codec", "io-util"] }
# M6-018: 1.54.0 drops elapsed interval timers without driver synchronization.
# Keep pinned until a fixed release passes the timer and repeated TUI regressions.
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "process", "signal", "fs"] }
toml = "0.8"
unicode-width = "0.2"
unicode-segmentation = "1.12"
walkdir = "2.5"
