<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="ni project dashboard: board, architecture, documents, timeline.">
<title>ni · project dashboard</title>
<style>
:root {
  --bg: #f4f2ee;
  --surface: #fbfaf7;
  --surface-2: #eeece6;
  --ink: #1d1c19;
  --muted: #6c675e;
  --faint: #969084;
  --line: #ded9cf;
  --line-strong: #c8c1b4;
  --accent: #2f5d50;
  --accent-soft: rgba(47, 93, 80, 0.12);
  --shadow: 0 1px 2px rgba(29, 28, 25, 0.05), 0 8px 24px rgba(29, 28, 25, 0.04);
  --code-bg: #1e1d1a;
  --code-ink: #e7e1d5;
  --code-line: #302d28;
  --code-muted: #6f6a5f;
  --st-backlog: #8c8478;
  --st-ready: #3f6f9f;
  --st-doing: #b7791f;
  --st-review: #6f5aa8;
  --st-done: #3f7d4f;
  --st-blocked: #b42318;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}

[data-theme="dark"] {
  --bg: #141412;
  --surface: #1b1a17;
  --surface-2: #23211d;
  --ink: #eae6de;
  --muted: #a8a094;
  --faint: #8a8275;
  --line: #2d2a25;
  --line-strong: #4a453c;
  --accent: #8fbfae;
  --accent-soft: rgba(143, 191, 174, 0.12);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.18);
  --code-bg: #0e0e0d;
  --code-ink: #ddd7ca;
  --code-line: #2b2924;
  --code-muted: #5f5a50;
  --st-backlog: #9a9285;
  --st-ready: #76a6d8;
  --st-doing: #d3a04a;
  --st-review: #a78fe0;
  --st-done: #78b98a;
  --st-blocked: #e06c61;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  height: 100%;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 13px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
}

button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
}

a {
  color: inherit;
  text-decoration: none;
}

input {
  font: inherit;
}

::selection {
  background: var(--accent-soft);
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

* {
  scrollbar-width: thin;
  scrollbar-color: var(--line-strong) transparent;
}

*::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

*::-webkit-scrollbar-thumb {
  background: var(--line);
  border: 2px solid transparent;
  border-radius: 99px;
  background-clip: padding-box;
}

/* ---------- top bar ---------- */

.topbar {
  height: 58px;
  display: flex;
  align-items: center;
  gap: 22px;
  padding: 0 18px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
  position: relative;
  z-index: 30;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.brand-mark {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  background: var(--ink);
  color: var(--bg);
  display: grid;
  place-items: center;
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: -0.06em;
  flex: none;
}

.brand-tag {
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.tabs {
  display: flex;
  gap: 2px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 3px;
  flex: none;
}

.tab {
  padding: 5px 11px;
  border-radius: 6px;
  font-size: 11.5px;
  color: var(--muted);
  white-space: nowrap;
  transition: color 0.12s ease, background 0.12s ease;
}

.tab:hover {
  color: var(--ink);
}

.tab.active {
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
}

.top-actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 9px;
}

.search {
  display: flex;
  align-items: center;
  gap: 7px;
  width: 205px;
  height: 30px;
  padding: 0 9px;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 7px;
  transition: border-color 0.12s ease, box-shadow 0.12s ease;
}

.search:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.search-key {
  width: 16px;
  height: 16px;
  border: 1px solid var(--line);
  border-radius: 4px;
  display: grid;
  place-items: center;
  font-family: var(--mono);
  font-size: 9px;
  color: var(--faint);
  background: var(--surface-2);
  flex: none;
}

.search input {
  width: 100%;
  border: 0;
  outline: 0;
  background: none;
  color: var(--ink);
  font-size: 11.5px;
}

.search input::placeholder {
  color: var(--faint);
}

.search input::-webkit-search-cancel-button {
  display: none;
}

.status-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 30px;
  padding: 0 10px;
  border: 1px solid var(--line);
  border-radius: 7px;
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
  white-space: nowrap;
}

.status-chip::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
}

.icon-button {
  width: 30px;
  height: 30px;
  border: 1px solid var(--line);
  border-radius: 7px;
  display: grid;
  place-items: center;
  color: var(--muted);
  background: var(--surface);
  transition: background 0.12s ease, color 0.12s ease;
}

.icon-button:hover {
  background: var(--surface-2);
  color: var(--ink);
}

/* ---------- shell ---------- */

.shell {
  height: calc(100vh - 58px);
  display: grid;
  grid-template-columns: 224px minmax(0, 1fr) 380px;
}

.rail {
  border-right: 1px solid var(--line);
  background: var(--surface);
  padding: 16px 12px 12px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 18px;
  min-width: 0;
}

.rail-section {
  min-width: 0;
}

.rail-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding: 0 6px 7px;
}

.rail-head h2 {
  margin: 0;
  font-size: 9.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--faint);
}

.rail-head span {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--faint);
}

.milestone-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.milestone {
  width: 100%;
  text-align: left;
  padding: 7px 6px 8px;
  border-radius: 6px;
  border: 1px solid transparent;
  transition: background 0.12s ease, border-color 0.12s ease;
}

.milestone:hover {
  background: var(--surface-2);
}

.milestone.active {
  background: var(--surface-2);
  border-color: var(--line);
}

.milestone-top {
  display: flex;
  align-items: center;
  gap: 7px;
}

.ms-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--st-backlog);
  flex: none;
}

.ms-dot.active {
  background: var(--st-doing);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--st-doing) 16%, transparent);
}

.ms-dot.done {
  background: var(--st-done);
}

.ms-id {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--muted);
}

.ms-title {
  margin-left: auto;
  font-size: 11.5px;
  font-weight: 500;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.ms-meta {
  display: flex;
  justify-content: space-between;
  margin: 5px 0 5px 14px;
  font-family: var(--mono);
  font-size: 9px;
  color: var(--faint);
}

.progress {
  display: block;
  height: 4px;
  border-radius: 99px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  overflow: hidden;
}

.progress > i {
  display: block;
  height: 100%;
  background: var(--accent);
  border-radius: 99px;
  transition: width 0.25s ease;
}

.milestone .progress {
  margin-left: 14px;
}

.progress.wide {
  height: 5px;
}

.layer-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.layer-row {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 3px 6px;
  font-size: 11px;
  color: var(--muted);
}

.layer-dot {
  width: 6px;
  height: 6px;
  border-radius: 2px;
  background: var(--c, var(--faint));
  flex: none;
}

.layer-name {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.layer-count {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--faint);
}

.rail-doc-list {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.rail-doc {
  display: flex;
  align-items: center;
  gap: 7px;
  width: 100%;
  min-width: 0;
  text-align: left;
  padding: 5px 6px;
  border-radius: 5px;
}

.rail-doc:hover,
.rail-doc.active {
  background: var(--surface-2);
}

.rd-kind {
  flex: none;
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--faint);
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 1px 3px;
}

.rd-title {
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.rail-doc.active .rd-title {
  color: var(--ink);
}

.rail-foot {
  margin-top: auto;
  padding: 12px 6px 0;
  border-top: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 3px;
  font-family: var(--mono);
  font-size: 9px;
  color: var(--faint);
}

/* ---------- canvas ---------- */

.canvas {
  overflow: auto;
  padding: 22px 24px 48px;
  background: var(--bg);
  min-width: 0;
}

.view-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 18px;
}

.kicker {
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--faint);
}

.view-title {
  margin: 4px 0 5px;
  font-size: 26px;
  font-weight: 650;
  line-height: 1.1;
  letter-spacing: -0.035em;
}

.view-sub {
  max-width: 680px;
  margin: 0;
  font-size: 12px;
  line-height: 1.55;
  color: var(--muted);
}

.stats {
  display: flex;
  align-items: center;
  gap: 14px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--muted);
  white-space: nowrap;
}

.stats strong {
  color: var(--ink);
  font-weight: 600;
}

.stats .sep {
  color: var(--faint);
}

/* ---------- board ---------- */

.board {
  display: grid;
  grid-template-columns: repeat(5, minmax(152px, 1fr));
  gap: 10px;
  min-width: 840px;
  align-items: start;
}

.column {
  background: color-mix(in srgb, var(--surface-2) 55%, transparent);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 7px;
  min-height: 120px;
}

.column-head {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 3px 4px 8px;
  font-size: 9.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
}

.col-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--c, var(--st-backlog));
}

.col-count {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 9px;
  color: var(--faint);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 99px;
  padding: 0 5px;
}

.col-count.warn {
  color: var(--st-doing);
  border-color: color-mix(in srgb, var(--st-doing) 40%, var(--line));
}

.cards {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-height: 40px;
}

.column.empty .cards::after {
  content: "No cards";
  display: block;
  padding: 10px 4px;
  font-family: var(--mono);
  font-size: 9px;
  color: var(--faint);
}

.card {
  width: 100%;
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 8px 9px 7px;
  transition: border-color 0.12s ease, transform 0.12s ease, box-shadow 0.12s ease;
}

.card:hover {
  border-color: var(--line-strong);
  transform: translateY(-1px);
  box-shadow: var(--shadow);
}

.card.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-soft);
}

.card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-family: var(--mono);
  font-size: 8.5px;
  letter-spacing: 0.02em;
  color: var(--faint);
}

.card-title {
  display: block;
  margin: 5px 0 7px;
  font-size: 12px;
  font-weight: 500;
  line-height: 1.38;
  color: var(--ink);
}

.card-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: 9.5px;
  color: var(--faint);
}

.card-foot span:first-child {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.card.done {
  opacity: 0.68;
}

.card.done .card-title {
  color: var(--muted);
}

.card.blocked {
  border-left: 2px solid var(--st-blocked);
}

.size {
  font-family: var(--mono);
  font-size: 8px;
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 0 3px;
  color: var(--faint);
}

.blocked-strip {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  border: 1px dashed color-mix(in srgb, var(--st-blocked) 45%, var(--line));
  background: color-mix(in srgb, var(--st-blocked) 5%, transparent);
  border-radius: 9px;
  padding: 9px 10px;
  margin-bottom: 14px;
}

.blocked-label {
  padding-top: 6px;
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--st-blocked);
  white-space: nowrap;
}

.blocked-cards {
  display: flex;
  flex: 1;
  flex-wrap: wrap;
  gap: 6px;
}

.blocked-cards .card {
  width: 210px;
  background: var(--surface);
}

/* ---------- architecture ---------- */

.arch-canvas {
  position: relative;
  min-width: 760px;
  padding: 8px 10px 18px 0;
  border-radius: 10px;
  background-image: radial-gradient(circle, color-mix(in srgb, var(--ink) 7%, transparent) 0.7px, transparent 0.8px);
  background-size: 18px 18px;
}

.edges {
  position: absolute;
  left: 0;
  top: 0;
  overflow: visible;
  pointer-events: none;
  z-index: 0;
}

.edge {
  fill: none;
  stroke: var(--line-strong);
  stroke-width: 1.15;
  opacity: 0.7;
}

.edge-active {
  stroke: var(--accent);
  stroke-width: 1.6;
  opacity: 1;
}

.edge-label {
  fill: var(--faint);
  font-family: var(--mono);
  font-size: 8.5px;
  paint-order: stroke;
  stroke: var(--bg);
  stroke-width: 3px;
  stroke-linejoin: round;
}

.arrow-head {
  fill: var(--line-strong);
}

.arrow-head-active {
  fill: var(--accent);
}

.edge-label-active {
  fill: var(--accent);
}

.arch-layer {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: 132px minmax(0, 1fr);
  gap: 22px;
  padding: 15px 0 18px;
  border-bottom: 1px dashed var(--line);
}

.arch-layer:first-child {
  padding-top: 4px;
}

.arch-layer:last-child {
  border-bottom: 0;
}

.layer-label {
  padding-top: 2px;
  text-align: right;
}

.layer-index {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--faint);
}

.layer-label h2 {
  margin: 1px 0 3px;
  font-size: 13px;
  letter-spacing: -0.01em;
}

.layer-label p {
  margin: 0;
  font-size: 10px;
  line-height: 1.45;
  color: var(--faint);
}

.layer-cards {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  gap: 10px;
}

.module-card {
  position: relative;
  width: 220px;
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--line);
  border-top: 2px solid var(--module-color, var(--faint));
  border-radius: 7px;
  padding: 9px 11px 10px;
  transition: border-color 0.12s ease, transform 0.12s ease, box-shadow 0.12s ease;
}

.module-card:hover {
  border-color: var(--line-strong);
  transform: translateY(-1px);
  box-shadow: var(--shadow);
}

.module-card.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-soft);
}

.module-card.planned {
  background: color-mix(in srgb, var(--surface) 62%, transparent);
  border-style: dashed;
  border-top-style: solid;
}

.module-card.planned .module-summary {
  color: var(--faint);
}

.module-card.dim {
  opacity: 0.22;
  pointer-events: none;
}

.module-card.muted {
  opacity: 0.24;
}

.module-card.related {
  border-color: color-mix(in srgb, var(--accent) 35%, var(--line));
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 10%, transparent);
}

.arch-canvas.has-focus .edge:not(.edge-active) {
  opacity: 0.12;
}

.module-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--faint);
}

.module-status {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.module-status::before {
  content: "";
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--module-color, var(--faint));
}

.module-title {
  display: block;
  margin: 5px 0 3px;
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.module-summary {
  display: block;
  margin: 0 0 7px;
  font-size: 10.5px;
  line-height: 1.45;
  color: var(--muted);
}

.module-path {
  display: block;
  font-family: var(--mono);
  font-size: 8.5px;
  color: var(--faint);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ---------- docs ---------- */

.doc-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 10px;
}

.doc-card {
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px 13px;
  transition: border-color 0.12s ease, transform 0.12s ease, box-shadow 0.12s ease;
}

.doc-card:hover {
  border-color: var(--line-strong);
  transform: translateY(-1px);
  box-shadow: var(--shadow);
}

.doc-card.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-soft);
}

.doc-top {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 8px;
}

.doc-kind {
  font-family: var(--mono);
  font-size: 8px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 1px 4px;
  color: var(--faint);
}

.doc-status {
  font-family: var(--mono);
  font-size: 8px;
  color: var(--st-done);
}

.doc-title {
  display: block;
  margin: 0 0 5px;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.doc-excerpt {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow: hidden;
  margin: 0 0 10px;
  font-size: 11px;
  line-height: 1.5;
  color: var(--muted);
}

.doc-path {
  display: block;
  font-family: var(--mono);
  font-size: 8.5px;
  color: var(--faint);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ---------- timeline ---------- */

.timeline {
  position: relative;
  max-width: 780px;
  padding-left: 16px;
}

.timeline::before {
  content: "";
  position: absolute;
  left: 4px;
  top: 6px;
  bottom: 0;
  width: 1px;
  background: var(--line);
}

.tl-item {
  position: relative;
  padding: 0 0 22px 14px;
}

.tl-item::before {
  content: "";
  position: absolute;
  left: -15px;
  top: 5px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--surface);
  border: 1.5px solid var(--line-strong);
}

.tl-date {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.03em;
  color: var(--faint);
}

.tl-kind {
  margin-left: 8px;
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--faint);
}

.tl-title {
  margin: 3px 0 4px;
  font-size: 13px;
  font-weight: 600;
}

.tl-detail {
  max-width: 640px;
  margin: 0 0 7px;
  font-size: 11.5px;
  line-height: 1.55;
  color: var(--muted);
}

.tl-refs {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.ref-chip {
  font-family: var(--mono);
  font-size: 8.5px;
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 1px 4px;
  color: var(--faint);
}

button.ref-chip:hover {
  color: var(--ink);
  border-color: var(--line-strong);
}

/* ---------- details ---------- */

.details {
  border-left: 1px solid var(--line);
  background: var(--surface);
  padding: 18px 20px 48px;
  overflow-y: auto;
  min-width: 0;
}

.details-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.close {
  width: 26px;
  height: 26px;
  border: 1px solid var(--line);
  border-radius: 6px;
  display: grid;
  place-items: center;
  color: var(--muted);
  font-size: 15px;
  line-height: 1;
}

.close:hover {
  background: var(--surface-2);
  color: var(--ink);
}

.details-title {
  margin: 2px 0 8px;
  font-size: 21px;
  font-weight: 650;
  line-height: 1.2;
  letter-spacing: -0.03em;
}

.badges {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 6px;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--mono);
  font-size: 8.5px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  border: 1px solid var(--line);
  border-radius: 99px;
  padding: 2px 7px;
  color: var(--muted);
}

.badge .dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: currentColor;
}

.badge-backlog { color: var(--st-backlog); }
.badge-ready { color: var(--st-ready); }
.badge-doing { color: var(--st-doing); }
.badge-review { color: var(--st-review); }
.badge-done { color: var(--st-done); }
.badge-blocked { color: var(--st-blocked); }
.badge-planned { color: var(--faint); }
.badge-active { color: var(--st-doing); }

.meta-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px 12px;
  margin: 10px 0 16px;
  padding: 11px 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.meta-k {
  margin-bottom: 1px;
  font-size: 8.5px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--faint);
}

.meta-v {
  font-size: 11px;
  line-height: 1.4;
  color: var(--ink);
}

.mono {
  font-family: var(--mono);
  font-size: 10px;
}

.detail-section {
  margin: 18px 0;
}

.detail-section h2 {
  margin: 0 0 7px;
  font-size: 9.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--faint);
}

.detail-section p {
  margin: 0 0 7px;
  font-size: 11.5px;
  line-height: 1.6;
  color: var(--muted);
}

.notes {
  display: flex;
  flex-direction: column;
  gap: 5px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.notes li {
  position: relative;
  padding-left: 10px;
  font-size: 10.5px;
  line-height: 1.5;
  color: var(--muted);
}

.notes li::before {
  content: "";
  position: absolute;
  left: 0;
  top: 6px;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: var(--line-strong);
}

.path-list {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.path-chip {
  width: 100%;
  padding: 3px 6px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--surface-2);
  font-family: var(--mono);
  font-size: 9px;
  color: var(--muted);
  text-align: left;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.inline-link {
  font-size: 11px;
  color: var(--accent);
  text-decoration: underline;
  text-decoration-color: color-mix(in srgb, var(--accent) 35%, transparent);
  text-underline-offset: 2px;
}

.relation-list {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.relation {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 2px 0;
  font-size: 10px;
  color: var(--muted);
}

.relation .arrow {
  font-family: var(--mono);
  color: var(--faint);
}

.relation button {
  font-size: 10px;
  color: var(--ink);
  text-decoration: underline;
  text-decoration-color: var(--line-strong);
  text-underline-offset: 2px;
}

.callout {
  margin: 10px 0;
  padding: 8px 10px;
  border: 1px solid color-mix(in srgb, var(--st-blocked) 35%, var(--line));
  border-radius: 6px;
  background: color-mix(in srgb, var(--st-blocked) 5%, transparent);
  font-size: 10.5px;
  line-height: 1.5;
  color: var(--st-blocked);
}

.source-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin: 8px 0 6px;
}

.source-tab {
  max-width: 100%;
  padding: 3px 6px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--surface-2);
  color: var(--muted);
  font-family: var(--mono);
  font-size: 8.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.source-tab.active {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--bg);
}

.source-box {
  max-height: 420px;
  padding: 8px 0;
  border: 1px solid var(--code-line);
  border-radius: 7px;
  background: var(--code-bg);
  overflow: auto;
}

.source-line {
  display: flex;
  font-family: var(--mono);
  font-size: 9.5px;
  line-height: 1.55;
  color: var(--code-ink);
  white-space: pre;
}

.source-line .ln {
  flex: 0 0 3.2em;
  padding-right: 9px;
  text-align: right;
  color: var(--code-muted);
  user-select: none;
}

.source-line .lc {
  padding-right: 12px;
}

.hint {
  margin: 5px 0 0;
  font-family: var(--mono);
  font-size: 9.5px;
  color: var(--faint);
}

.empty {
  padding: 16px;
  border: 1px dashed var(--line-strong);
  border-radius: 7px;
  color: var(--faint);
  font-size: 11px;
  line-height: 1.5;
}

.overview-block {
  margin: 10px 0;
  padding: 11px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--bg);
}

.overview-block h3 {
  margin: 0 0 4px;
  font-size: 11px;
}

.overview-block p {
  margin: 0 0 7px;
  font-size: 10.5px;
  line-height: 1.5;
  color: var(--muted);
}

.overview-stats {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
  margin: 14px 0;
}

.overview-stat strong {
  display: block;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.03em;
}

.overview-stat span {
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--faint);
}

/* ---------- markdown ---------- */

.md {
  font-size: 12.5px;
  line-height: 1.68;
  color: var(--ink);
  overflow-wrap: break-word;
}

.md > :first-child {
  margin-top: 0;
}

.md h1,
.md h2,
.md h3 {
  line-height: 1.3;
  letter-spacing: -0.015em;
}

.md h1 {
  margin: 20px 0 8px;
  font-size: 17px;
}

.md h2 {
  margin: 22px 0 7px;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--line);
  font-size: 14.5px;
}

.md h3 {
  margin: 16px 0 5px;
  font-size: 12.5px;
}

.md p {
  margin: 0 0 10px;
}

.md ul,
.md ol {
  margin: 0 0 11px;
  padding-left: 17px;
}

.md li {
  margin: 3px 0;
}

.md li::marker {
  color: var(--faint);
}

.md a {
  color: var(--accent);
  text-decoration: underline;
  text-decoration-color: color-mix(in srgb, var(--accent) 35%, transparent);
  text-underline-offset: 2px;
}

.md code {
  padding: 1px 4px;
  border: 1px solid var(--line);
  border-radius: 3px;
  background: var(--surface-2);
  font-family: var(--mono);
  font-size: 10.5px;
}

.md pre {
  margin: 11px 0;
  padding: 11px 13px;
  border: 1px solid var(--code-line);
  border-radius: 7px;
  background: var(--code-bg);
  color: var(--code-ink);
  overflow: auto;
}

.md pre code {
  padding: 0;
  border: 0;
  background: none;
  color: inherit;
  font-size: 10.5px;
  line-height: 1.55;
}

.md blockquote {
  margin: 11px 0;
  padding: 1px 11px;
  border-left: 2px solid var(--accent);
  color: var(--muted);
}

.md table {
  width: 100%;
  margin: 11px 0;
  border-collapse: collapse;
  font-size: 11px;
}

.md th,
.md td {
  padding: 5px 7px;
  border: 1px solid var(--line);
  text-align: left;
  vertical-align: top;
}

.md th {
  background: var(--surface-2);
  font-weight: 600;
}

.md hr {
  margin: 16px 0;
  border: 0;
  border-top: 1px solid var(--line);
}

.md input[type="checkbox"] {
  margin: 0 5px 0 0;
  accent-color: var(--accent);
}

/* ---------- architecture-first ---------- */

.map-nav {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.map-layer {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.map-layer-head {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 6px 4px;
  color: var(--faint);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.map-layer-dot {
  width: 5px;
  height: 5px;
  border-radius: 2px;
  background: var(--c, var(--faint));
  flex: none;
}

.map-layer-n {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 8.5px;
  letter-spacing: 0;
  color: var(--faint);
}

.map-module {
  display: flex;
  align-items: center;
  gap: 7px;
  width: 100%;
  padding: 4px 6px;
  border: 1px solid transparent;
  border-radius: 5px;
  text-align: left;
}

.map-module:hover {
  background: var(--surface-2);
}

.map-module.active {
  background: var(--surface-2);
  border-color: var(--line);
}

.map-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--faint);
  flex: none;
}

.map-dot.active,
.map-dot.done {
  background: var(--st-done);
}

.map-dot.planned {
  background: transparent;
  border: 1px solid var(--faint);
}

.map-title {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 11px;
  color: var(--muted);
}

.map-module.active .map-title {
  color: var(--ink);
}


.focus-block {
  padding: 0 6px 10px;
}

.focus-kicker {
  margin-bottom: 4px;
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--faint);
}

.focus-card {
  display: flex;
  flex-direction: column;
  gap: 2px;
  width: 100%;
  padding: 7px 8px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--surface-2);
  text-align: left;
}

.focus-card:hover {
  border-color: var(--line-strong);
}

.focus-id {
  font-family: var(--mono);
  font-size: 8.5px;
  color: var(--faint);
}

.focus-title {
  font-size: 10.5px;
  line-height: 1.35;
  color: var(--ink);
}

.focus-empty {
  font-size: 10px;
  line-height: 1.45;
  color: var(--muted);
}

.rail-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  font-family: var(--mono);
  font-size: 8.5px;
  color: var(--faint);
}

.filters {
  display: flex;
  gap: 3px;
  margin: -4px 0 14px;
}

.filter {
  padding: 4px 8px;
  border: 1px solid var(--line);
  border-radius: 99px;
  background: var(--surface);
  color: var(--muted);
  font-family: var(--mono);
  font-size: 9px;
}

.filter:hover {
  border-color: var(--line-strong);
  color: var(--ink);
}

.filter.active {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--bg);
}

.focus-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: -4px 0 14px;
}

.focus-label {
  color: var(--faint);
  font-family: var(--mono);
  font-size: 8.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.focus-chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 3px 8px;
  border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--line));
  border-radius: 99px;
  background: color-mix(in srgb, var(--accent) 6%, transparent);
  color: var(--accent);
  font-size: 10px;
}

.focus-chip:hover {
  background: color-mix(in srgb, var(--accent) 11%, transparent);
}

.section-title {
  margin: 26px 0 10px;
  color: var(--faint);
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.section-title:first-of-type {
  margin-top: 0;
}

/* ---------- responsive ---------- */

@media (max-width: 1280px) {
  .shell {
    grid-template-columns: 210px minmax(0, 1fr) 344px;
  }

  .brand-tag {
    display: none;
  }

  .details {
    padding: 16px 16px 40px;
  }

  .module-card {
    width: 196px;
  }

  .arch-canvas {
    min-width: 0;
  }

  .board {
    min-width: 660px;
    grid-template-columns: repeat(5, minmax(120px, 1fr));
  }
}

@media (max-width: 1040px) {
  .shell {
    grid-template-columns: 200px minmax(0, 1fr);
  }

  .details {
    display: none;
  }

  .top-actions .status-chip {
    display: none;
  }
}

@media (max-width: 760px) {
  body {
    overflow: auto;
  }

  .shell {
    height: auto;
    min-height: calc(100vh - 58px);
    grid-template-columns: 1fr;
  }

  .rail {
    display: none;
  }

  .canvas {
    padding: 16px 14px 32px;
  }

  .brand-tag {
    display: none;
  }

  .tabs .tab {
    padding: 5px 7px;
    font-size: 10.5px;
  }

  .search {
    width: 140px;
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}

.md li:has(> input[type="checkbox"]) {
  list-style: none;
  margin-left: -17px;
}

.md li input[type="checkbox"] {
  width: 11px;
  height: 11px;
  margin-right: 6px;
  vertical-align: -1px;
}

</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/arch" data-view="arch" aria-label="ni dashboard">
    <span class="brand-mark">ni</span>
    <span class="brand-tag">minimal, observable coding agent</span>
  </a>

  <nav class="tabs" aria-label="Views">
    <button class="tab" type="button" data-view="arch">Architecture</button>
    <button class="tab" type="button" data-view="work">Work</button>
    <button class="tab" type="button" data-view="docs">Docs</button>
    <button class="tab" type="button" data-view="decisions">Decisions</button>
  </nav>

  <div class="top-actions">
    <label class="search" aria-label="Filter current view">
      <span class="search-key">/</span>
      <input id="search" type="search" autocomplete="off" spellcheck="false" placeholder="Filter">
    </label>
    <span class="status-chip" id="project-status"></span>
    <button class="icon-button" id="theme-toggle" type="button" title="Toggle theme" aria-label="Toggle theme">◐</button>
  </div>
</header>

<main class="shell">
  <aside class="rail" aria-label="Project navigation">
    <section class="rail-section rail-map">
      <div class="rail-head"><h2>Architecture</h2><span id="module-count"></span></div>
      <div id="map-nav" class="map-nav"></div>
    </section>

    <section class="rail-section rail-docs">
      <div class="rail-head"><h2>Documents</h2><span id="doc-count"></span></div>
      <div id="rail-docs" class="rail-doc-list"></div>
    </section>

    <div class="rail-foot" id="rail-foot"></div>
  </aside>

  <section class="canvas" id="canvas" aria-label="Project view" tabindex="-1"></section>
  <aside class="details" id="details" aria-label="Details"></aside>
</main>

<noscript>

<script id="ni-data" type="application/json">{"project":{"name":"ni","title":"ni","tagline":"minimal, observable coding agent","summary":"一个围绕 append-only 事件日志、薄 provider 适配层和锋利工具面构建的最小 agent harness。看板是架构、决策与迭代的维护面，不是运行时监控。","status":"M0 · Bootstrap","repo":"niuverse/ni","language":"Rust"},"milestones":[{"id":"M0","title":"Bootstrap","status":"active","goal":"跑通 headless 闭环：一个 provider、六个工具、可恢复的会话。","exit":["ni exec 能修复一个真实小 bug","session 可 resume，坏尾行不丢历史","loop / tools 有离线 fixture 测试"]},{"id":"M1","title":"Interaction","status":"planned","goal":"把审批、沙箱和流式交互补齐，让 harness 可以放心跑长任务。","exit":["TUI 流式输出与 diff 预览","sandbox / approval / network 三轴生效","Ctrl-C 取消并杀掉工具进程组"]},{"id":"M2","title":"Context","status":"planned","goal":"让长会话稳定且便宜：压缩、分层指令、缓存可观测。","exit":["compaction 生成可执行 handoff","AGENTS.md 按目录分层发现","cached token 命中率可见"]},{"id":"M3","title":"Scale","status":"planned","goal":"多会话、回放与子代理。","exit":["exec --json 成为稳定协议","fork / replay 可用","subagent 有独立日志并可汇总"]}],"layers":[{"id":"interface","name":"Interface","note":"CLI、TUI、事件流"},{"id":"engine","name":"Engine","note":"turn loop 与上下文投影"},{"id":"adapters","name":"Adapters","note":"模型、工具、沙箱"},{"id":"state","name":"State","note":"append-only 事件日志"},{"id":"engineering","name":"Engineering","note":"构建、看板、测试"}],"modules":[{"id":"cli","title":"CLI","layer":"interface","status":"active","summary":"解析参数、组装 session 与 loop，提供 headless 入口。","contract":"ni exec \u003cprompt\u003e 启动一次运行；ni session 管理日志。不持有对话状态。","paths":["crates/ni-cli/src/main.rs"],"notes":["CLI 只做参数与生命周期，不实现 turn 逻辑。","输出模式分 human 与 --json，后者从第一天就稳定。"],"sources":[{"path":"crates/ni-cli/src/main.rs","language":"rust","text":"use std::path::PathBuf;\n\nuse anyhow::Result;\nuse clap::{Parser, Subcommand};\nuse ni_core::{now_ms, Event, SessionLog};\n\n#[derive(Debug, Parser)]\n#[command(name = \"ni\", version, about = \"Minimal, observable coding agent\")]\nstruct Cli {\n    #[command(subcommand)]\n    command: Option\u003cCommand\u003e,\n}\n\n#[derive(Debug, Subcommand)]\nenum Command {\n    /// Inspect and create append-only session logs\n    Session {\n        #[command(subcommand)]\n        command: SessionCommand,\n    },\n}\n\n#[derive(Debug, Subcommand)]\nenum SessionCommand {\n    /// Create a session and print its path\n    New {\n        /// Directory for the session file\n        #[arg(long)]\n        dir: Option\u003cPathBuf\u003e,\n    },\n    /// Print the events in a session file\n    Show {\n        /// Path to a .jsonl session file\n        path: PathBuf,\n    },\n    /// List session files\n    List {\n        /// Directory containing session files\n        #[arg(long)]\n        dir: Option\u003cPathBuf\u003e,\n    },\n}\n\nfn main() -\u003e Result\u003c()\u003e {\n    let cli = Cli::parse();\n    match cli.command {\n        Some(Command::Session { command }) =\u003e run_session(command),\n        None =\u003e {\n            print_banner();\n            Ok(())\n        }\n    }\n}\n\nfn run_session(command: SessionCommand) -\u003e Result\u003c()\u003e {\n    match command {\n        SessionCommand::New { dir } =\u003e {\n            let dir = dir.unwrap_or_else(default_sessions_dir);\n            let mut log = SessionLog::create(\u0026dir)?;\n            log.append(\u0026Event::SessionStart {\n                id: log.id().to_string(),\n                cwd: std::env::current_dir()?.display().to_string(),\n                model: \"unset\".into(),\n                ts: now_ms(),\n            })?;\n            println!(\"{}\", log.path().display());\n            Ok(())\n        }\n        SessionCommand::Show { path } =\u003e {\n            let loaded = ni_core::load(\u0026path)?;\n            println!(\"session  {}\", path.display());\n            println!(\"events   {}\", loaded.events.len());\n            println!(\"warnings {}\", loaded.warnings.len());\n            for warning in \u0026loaded.warnings {\n                eprintln!(\"warning: {warning}\");\n            }\n            for event in \u0026loaded.events {\n                println!(\"{:\u003e13}  {}\", event.ts(), event.kind());\n            }\n            Ok(())\n        }\n        SessionCommand::List { dir } =\u003e {\n            let dir = dir.unwrap_or_else(default_sessions_dir);\n            for path in ni_core::session::list(\u0026dir)? {\n                println!(\"{}\", path.display());\n            }\n            Ok(())\n        }\n    }\n}\n\nfn default_sessions_dir() -\u003e PathBuf {\n    if let Ok(home) = std::env::var(\"NI_HOME\") {\n        return PathBuf::from(home).join(\"sessions\");\n    }\n    if let Ok(home) = std::env::var(\"HOME\") {\n        return PathBuf::from(home).join(\".ni\").join(\"sessions\");\n    }\n    PathBuf::from(\".ni\").join(\"sessions\")\n}\n\nfn print_banner() {\n    println!(\n        \"ni {} · minimal, observable coding agent\",\n        env!(\"CARGO_PKG_VERSION\")\n    );\n    println!();\n    println!(\"status   M0 · bootstrap\");\n    println!(\"docs     docs/index.html\");\n    println!(\"sessions {}\", default_sessions_dir().display());\n    println!();\n    println!(\"next     ni session new\");\n    println!(\"         cargo xtask dashboard\");\n}\n","truncated":false}]},{"id":"tui","title":"TUI","layer":"interface","status":"planned","summary":"流式渲染、审批提示、diff 展示；只消费事件流。","contract":"不 import loop 内部；通过事件通道与 core 解耦。","paths":["crates/ni-tui/src/lib.rs"],"notes":["TUI 最后做；先把 headless 跑通。","diff 展示是审批体验的核心，不是装饰。"],"sources":[]},{"id":"loop","title":"Agent Loop","layer":"engine","status":"planned","summary":"唯一的 turn 引擎：project → stream → dispatch → append。","contract":"run(session, input, signal) -\u003e Result\u003cOutcome\u003e；不关心 provider wire format。","paths":["crates/ni-core/src/loop.rs"],"notes":["只读工具可并发，写操作串行。","重试只能在 turn 边界，工具执行后不重放。"],"sources":[]},{"id":"context","title":"Context","layer":"engine","status":"planned","summary":"把全量日志投影成模型上下文：预算、裁剪、compaction。","contract":"project(log, budget) -\u003e Context；有损但不修改日志。","paths":["crates/ni-core/src/context.rs"],"notes":["日志是全量，上下文是投影；压缩只影响投影。","保持前缀稳定以命中 provider prompt cache。"],"sources":[]},{"id":"providers","title":"Providers","layer":"adapters","status":"planned","summary":"把 OpenAI / Anthropic 的流式响应归一化成 StreamEvent。","contract":"Provider::stream(ctx, tools, signal) -\u003e EventStream；错误分可重试、致命、上下文溢出。","paths":["crates/ni-provider/src/lib.rs"],"notes":["适配层要薄，不抹平 provider 的所有怪癖。","usage 必须包含 cached / reasoning tokens。"],"sources":[]},{"id":"tools","title":"Tools","layer":"adapters","status":"planned","summary":"read / write / edit / grep / glob / bash 六个工具与注册表。","contract":"JSON Schema 输入；输出截断并给出续读指针；写操作串行。","paths":["crates/ni-tools/src/lib.rs"],"notes":["edit 用精确字符串替换，要求唯一匹配。","read-before-write 是策略，不是提示词。"],"sources":[]},{"id":"sandbox","title":"Sandbox","layer":"adapters","status":"planned","summary":"sandbox / approval / network 三轴策略。","contract":"执行前返回 allow / ask / deny；bash 必须经过进程组与超时包装。","paths":["crates/ni-sandbox/src/lib.rs"],"notes":["进程内路径校验不是安全边界，bash 能绕过。","没有真沙箱时，变更型 bash 强制审批。"],"sources":[]},{"id":"session","title":"Session Log","layer":"state","status":"active","summary":"append-only JSONL 事件日志，resume 与 fork 的基础。","contract":"SessionLog::append 只追加；load 容忍坏尾行并报告 warning；日志是唯一真相。","paths":["crates/ni-core/src/session.rs","crates/ni-core/src/event.rs"],"notes":["每条事件立即 flush，进程崩溃最多丢最后一行。","内存状态是日志的 fold，不维护第二份真相。"],"sources":[{"path":"crates/ni-core/src/session.rs","language":"rust","text":"//! Append-only JSONL session storage.\n//!\n//! A session is a file of one JSON event per line. Appends are flushed\n//! immediately; loading tolerates a corrupt tail instead of discarding the\n//! whole session.\n\nuse std::fs::{self, File, OpenOptions};\nuse std::io::{BufRead, BufReader, BufWriter, Write};\nuse std::path::{Path, PathBuf};\nuse std::sync::atomic::{AtomicU64, Ordering};\n\nuse anyhow::{Context, Result};\n\nuse crate::event::{now_ms, Event};\n\nstatic SESSION_SEQ: AtomicU64 = AtomicU64::new(0);\n\n#[derive(Debug)]\npub struct LoadedSession {\n    pub events: Vec\u003cEvent\u003e,\n    /// Lines that could not be decoded. The rest of the session is still valid.\n    pub warnings: Vec\u003cString\u003e,\n}\n\n#[derive(Debug)]\npub struct SessionLog {\n    id: String,\n    path: PathBuf,\n    writer: BufWriter\u003cFile\u003e,\n}\n\nimpl SessionLog {\n    /// Create a new session file under `dir`.\n    pub fn create(dir: \u0026Path) -\u003e Result\u003cSelf\u003e {\n        fs::create_dir_all(dir)\n            .with_context(|| format!(\"create session directory {}\", dir.display()))?;\n\n        let seq = SESSION_SEQ.fetch_add(1, Ordering::Relaxed);\n        let id = format!(\"{}-{}-{}\", now_ms(), std::process::id(), seq);\n        let path = dir.join(format!(\"{id}.jsonl\"));\n        let file = OpenOptions::new()\n            .create_new(true)\n            .append(true)\n            .open(\u0026path)\n            .with_context(|| format!(\"create session file {}\", path.display()))?;\n\n        Ok(Self {\n            id,\n            path,\n            writer: BufWriter::new(file),\n        })\n    }\n\n    pub fn id(\u0026self) -\u003e \u0026str {\n        \u0026self.id\n    }\n\n    pub fn path(\u0026self) -\u003e \u0026Path {\n        \u0026self.path\n    }\n\n    /// Append one event and flush it to disk.\n    pub fn append(\u0026mut self, event: \u0026Event) -\u003e Result\u003c()\u003e {\n        serde_json::to_writer(\u0026mut self.writer, event).context(\"serialize session event\")?;\n        self.writer\n            .write_all(b\"\\n\")\n            .context(\"write session event\")?;\n        self.writer.flush().context(\"flush session event\")?;\n        Ok(())\n    }\n}\n\n/// Read a session, reporting undecodable lines as warnings.\npub fn load(path: \u0026Path) -\u003e Result\u003cLoadedSession\u003e {\n    let file = File::open(path).with_context(|| format!(\"open session file {}\", path.display()))?;\n    let reader = BufReader::new(file);\n\n    let mut events = Vec::new();\n    let mut warnings = Vec::new();\n\n    for (index, line) in reader.lines().enumerate() {\n        let line = line.with_context(|| format!(\"read line {}\", index + 1))?;\n        if line.trim().is_empty() {\n            continue;\n        }\n        match serde_json::from_str::\u003cEvent\u003e(\u0026line) {\n            Ok(event) =\u003e events.push(event),\n            Err(error) =\u003e warnings.push(format!(\"line {}: {error}\", index + 1)),\n        }\n    }\n\n    Ok(LoadedSession { events, warnings })\n}\n\n/// List session files in `dir`, sorted by name.\npub fn list(dir: \u0026Path) -\u003e Result\u003cVec\u003cPathBuf\u003e\u003e {\n    if !dir.is_dir() {\n        return Ok(Vec::new());\n    }\n\n    let mut paths = Vec::new();\n    for entry in\n        fs::read_dir(dir).with_context(|| format!(\"read session directory {}\", dir.display()))?\n    {\n        let entry = entry?;\n        let path = entry.path();\n        if path.extension().is_some_and(|ext| ext == \"jsonl\") {\n            paths.push(path);\n        }\n    }\n    paths.sort();\n    Ok(paths)\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use crate::event::{Event, ToolCall, Usage};\n\n    fn temp_dir(tag: \u0026str) -\u003e PathBuf {\n        static COUNTER: AtomicU64 = AtomicU64::new(0);\n        let n = COUNTER.fetch_add(1, Ordering::Relaxed);\n        let dir = std::env::temp_dir().join(format!(\"ni-core-{tag}-{}-{n}\", now_ms()));\n        let _ = fs::remove_dir_all(\u0026dir);\n        fs::create_dir_all(\u0026dir).expect(\"create temp dir\");\n        dir\n    }\n\n    #[test]\n    fn round_trip_preserves_events() {\n        let dir = temp_dir(\"roundtrip\");\n        let mut log = SessionLog::create(\u0026dir).expect(\"create log\");\n        let ts = now_ms();\n\n        let events = vec![\n            Event::SessionStart {\n                id: log.id().to_string(),\n                cwd: \"/tmp/project\".into(),\n                model: \"test-model\".into(),\n                ts,\n            },\n            Event::UserMessage {\n                text: \"fix the failing test\".into(),\n                ts,\n            },\n            Event::AssistantMessage {\n                text: \"reading the test\".into(),\n                reasoning: Some(\"need the failure output first\".into()),\n                tool_calls: vec![ToolCall {\n                    id: \"call-1\".into(),\n                    name: \"read\".into(),\n                    input: serde_json::json!({\"path\": \"src/lib.rs\"}),\n                }],\n                ts,\n            },\n            Event::ToolResult {\n                call_id: \"call-1\".into(),\n                ok: true,\n                output: \"fn main() {}\".into(),\n                ts,\n            },\n            Event::TurnEnd {\n                usage: Usage {\n                    input_tokens: 120,\n                    output_tokens: 30,\n                    cached_tokens: 80,\n                    reasoning_tokens: 10,\n                },\n                ts,\n            },\n        ];\n\n        for event in \u0026events {\n            log.append(event).expect(\"append\");\n        }\n\n        let loaded = load(log.path()).expect(\"load\");\n        assert_eq!(loaded.events, events);\n        assert!(loaded.warnings.is_empty());\n        assert_eq!(list(\u0026dir).expect(\"list\"), vec![log.path().to_path_buf()]);\n\n        fs::remove_dir_all(dir).expect(\"cleanup\");\n    }\n\n    #[test]\n    fn corrupt_tail_is_a_warning_not_a_failure() {\n        let dir = temp_dir(\"corrupt\");\n        let path = dir.join(\"session.jsonl\");\n        let good = serde_json::to_string(\u0026Event::UserMessage {\n            text: \"hello\".into(),\n            ts: 1,\n        })\n        .expect(\"serialize\");\n        fs::write(\u0026path, format!(\"{good}\\n{{ not json }}\\n\")).expect(\"write fixture\");\n\n        let loaded = load(\u0026path).expect(\"load\");\n        assert_eq!(loaded.events.len(), 1);\n        assert_eq!(loaded.warnings.len(), 1);\n        assert!(loaded.warnings[0].starts_with(\"line 2:\"));\n\n","truncated":true},{"path":"crates/ni-core/src/event.rs","language":"rust","text":"//! Durable session events.\n//!\n//! Events are the only representation of a session that survives the process.\n//! The in-memory conversation is a projection of these events; if something is\n//! not appended here, it does not exist after the process exits.\n\nuse std::time::{SystemTime, UNIX_EPOCH};\n\nuse serde::{Deserialize, Serialize};\n\n/// Milliseconds since the Unix epoch.\npub type Timestamp = u64;\n\n#[derive(Debug, Clone, PartialEq, Serialize, Deserialize)]\npub struct ToolCall {\n    pub id: String,\n    pub name: String,\n    #[serde(default)]\n    pub input: serde_json::Value,\n}\n\n#[derive(Debug, Clone, Default, PartialEq, Serialize, Deserialize)]\npub struct Usage {\n    #[serde(default)]\n    pub input_tokens: u64,\n    #[serde(default)]\n    pub output_tokens: u64,\n    #[serde(default)]\n    pub cached_tokens: u64,\n    #[serde(default)]\n    pub reasoning_tokens: u64,\n}\n\n#[derive(Debug, Clone, PartialEq, Serialize, Deserialize)]\n#[serde(tag = \"type\", rename_all = \"snake_case\")]\npub enum Event {\n    SessionStart {\n        id: String,\n        cwd: String,\n        model: String,\n        ts: Timestamp,\n    },\n    UserMessage {\n        text: String,\n        ts: Timestamp,\n    },\n    AssistantMessage {\n        #[serde(default)]\n        text: String,\n        #[serde(default, skip_serializing_if = \"Option::is_none\")]\n        reasoning: Option\u003cString\u003e,\n        #[serde(default)]\n        tool_calls: Vec\u003cToolCall\u003e,\n        ts: Timestamp,\n    },\n    ToolResult {\n        call_id: String,\n        ok: bool,\n        output: String,\n        ts: Timestamp,\n    },\n    TurnEnd {\n        #[serde(default)]\n        usage: Usage,\n        ts: Timestamp,\n    },\n    Compaction {\n        summary: String,\n        /// Number of events replaced by this compaction.\n        upto: u64,\n        ts: Timestamp,\n    },\n    SessionEnd {\n        ts: Timestamp,\n    },\n}\n\nimpl Event {\n    /// Stable name used in logs and tests.\n    pub fn kind(\u0026self) -\u003e \u0026'static str {\n        match self {\n            Self::SessionStart { .. } =\u003e \"session_start\",\n            Self::UserMessage { .. } =\u003e \"user_message\",\n            Self::AssistantMessage { .. } =\u003e \"assistant_message\",\n            Self::ToolResult { .. } =\u003e \"tool_result\",\n            Self::TurnEnd { .. } =\u003e \"turn_end\",\n            Self::Compaction { .. } =\u003e \"compaction\",\n            Self::SessionEnd { .. } =\u003e \"session_end\",\n        }\n    }\n\n    pub fn ts(\u0026self) -\u003e Timestamp {\n        match self {\n            Self::SessionStart { ts, .. }\n            | Self::UserMessage { ts, .. }\n            | Self::AssistantMessage { ts, .. }\n            | Self::ToolResult { ts, .. }\n            | Self::TurnEnd { ts, .. }\n            | Self::Compaction { ts, .. }\n            | Self::SessionEnd { ts } =\u003e *ts,\n        }\n    }\n}\n\npub fn now_ms() -\u003e Timestamp {\n    SystemTime::now()\n        .duration_since(UNIX_EPOCH)\n        .unwrap_or_default()\n        .as_millis() as Timestamp\n}\n","truncated":false}]},{"id":"dashboard","title":"Dashboard","layer":"engineering","status":"active","summary":"从 project.json、模块、卡片和 Markdown 生成 architecture-first 的离线单文件看板。","contract":"默认 Architecture；Work / Docs / Decisions 为二级视图；cargo xtask dashboard 可重复构建，--check 保证生成物不过期。","paths":["crates/xtask/src/main.rs","docs/dashboard/app.js","docs/dashboard/style.css","docs/dashboard/template.html"],"notes":["架构视图不显示进度装饰；模块状态只表示落地程度。","浏览器只读；改状态走仓库，避免第二个真相源。","不引入前端框架；单文件离线是硬约束。"],"sources":[{"path":"crates/xtask/src/main.rs","language":"rust","text":"mod load;\nmod model;\nmod render;\nmod validate;\n\nuse std::path::PathBuf;\n\nuse anyhow::{bail, Result};\n\nfn main() -\u003e Result\u003c()\u003e {\n    let mut args = std::env::args().skip(1);\n\n    match args.next().as_deref() {\n        Some(\"dashboard\") =\u003e {\n            let mut check = false;\n            for arg in args {\n                match arg.as_str() {\n                    \"--check\" =\u003e check = true,\n                    other =\u003e bail!(\"unknown argument `{other}`\\n\\n{}\", help_text()),\n                }\n            }\n            let root = find_root()?;\n            let dashboard = load::build(\u0026root)?;\n            render::write_dashboard(\u0026root, \u0026dashboard, check)\n        }\n        Some(\"-h\") | Some(\"--help\") | None =\u003e {\n            println!(\"{}\", help_text());\n            Ok(())\n        }\n        Some(other) =\u003e bail!(\"unknown xtask `{other}`\\n\\n{}\", help_text()),\n    }\n}\n\nfn find_root() -\u003e Result\u003cPathBuf\u003e {\n    let mut dir = std::env::current_dir()?;\n    loop {\n        if dir.join(\"docs/dashboard/project.json\").is_file() {\n            return Ok(dir);\n        }\n        if !dir.pop() {\n            bail!(\"could not find workspace root (docs/dashboard/project.json)\");\n        }\n    }\n}\n\nfn help_text() -\u003e String {\n    [\n        \"xtask\",\n        \"\",\n        \"  cargo xtask dashboard          build docs/index.html\",\n        \"  cargo xtask dashboard --check  fail if generated files are stale\",\n    ]\n    .join(\"\\n\")\n}\n","truncated":false},{"path":"docs/dashboard/app.js","language":"javascript","text":"(() =\u003e {\n  'use strict';\n\n  const DATA = JSON.parse(document.getElementById('ni-data').textContent);\n\n  const VIEWS = ['arch', 'work', 'docs', 'decisions'];\n  const VIEW_ALIASES = { board: 'work', timeline: 'decisions' };\n  const STATUS_COLUMNS = ['backlog', 'ready', 'doing', 'review', 'done'];\n  const STATUS_LABEL = {\n    backlog: 'Backlog',\n    ready: 'Ready',\n    doing: 'Doing',\n    review: 'Review',\n    done: 'Done',\n    blocked: 'Blocked',\n    planned: 'Planned',\n    active: 'Active',\n  };\n  const STATUS_COLORS = {\n    backlog: '#8c8478',\n    ready: '#3f6f9f',\n    doing: '#b7791f',\n    review: '#6f5aa8',\n    done: '#3f7d4f',\n    blocked: '#b42318',\n  };\n  const LAYER_COLORS = {\n    interface: '#4c7bd9',\n    engine: '#b57436',\n    adapters: '#8768bf',\n    state: '#5c8f4a',\n    engineering: '#8a8175',\n  };\n  const KIND_LABEL = { adr: 'ADR', doc: 'Doc', guide: 'Guide' };\n\n  const canvas = document.getElementById('canvas');\n  const details = document.getElementById('details');\n  const search = document.getElementById('search');\n  const themeButton = document.getElementById('theme-toggle');\n\n  const cardById = new Map(DATA.cards.map((card) =\u003e [card.id, card]));\n  const moduleById = new Map(DATA.modules.map((module) =\u003e [module.id, module]));\n  const docById = new Map(DATA.docs.map((doc) =\u003e [doc.id, doc]));\n  const milestoneById = new Map(DATA.milestones.map((milestone) =\u003e [milestone.id, milestone]));\n  const layerById = new Map(DATA.layers.map((layer) =\u003e [layer.id, layer]));\n\n  const state = {\n    view: 'arch',\n    milestone: currentMilestoneId(),\n    selection: null,\n    query: '',\n    sourceIndex: 0,\n  };\n\n  let edgeFrame = 0;\n\n  function currentMilestoneId() {\n    const active = DATA.milestones.find((milestone) =\u003e milestone.status === 'active');\n    return active ? active.id : 'all';\n  }\n\n  function normalizeView(view) {\n    return VIEW_ALIASES[view] || view;\n  }\n\n  function esc(value) {\n    return String(value ?? '').replace(/[\u0026\u003c\u003e\"']/g, (character) =\u003e ({\n      '\u0026': '\u0026amp;',\n      '\u003c': '\u0026lt;',\n      '\u003e': '\u0026gt;',\n      '\"': '\u0026quot;',\n      \"'\": '\u0026#39;',\n    }[character]));\n  }\n\n  function fmtDate(value) {\n    return value ? value.slice(5) : '—';\n  }\n\n  function docKind(kind) {\n    return KIND_LABEL[kind] || String(kind || 'doc').toUpperCase();\n  }\n\n  function layerColor(id) {\n    return LAYER_COLORS[id] || '#8a8175';\n  }\n\n  function layerName(id) {\n    const layer = layerById.get(id);\n    return layer ? layer.name : id;\n  }\n\n  function moduleTitle(id) {\n    const module = moduleById.get(id);\n    return module ? module.title : id;\n  }\n\n  function isCardSelected(id) {\n    return state.selection?.type === 'card' \u0026\u0026 state.selection.id === id;\n  }\n\n  function isModuleSelected(id) {\n    return state.selection?.type === 'module' \u0026\u0026 state.selection.id === id;\n  }\n\n  function isDocSelected(id) {\n    return state.selection?.type === 'doc' \u0026\u0026 state.selection.id === id;\n  }\n\n  function statusBadge(status) {\n    const label = STATUS_LABEL[status] || status;\n    return `\u003cspan class=\"badge badge-${esc(status)}\"\u003e\u003cspan class=\"dot\"\u003e\u003c/span\u003e${esc(label)}\u003c/span\u003e`;\n  }\n\n  function currentFocus() {\n    const milestone = DATA.milestones.find((item) =\u003e item.status === 'active');\n    if (!milestone) return null;\n    const cards = DATA.cards.filter((card) =\u003e card.milestone === milestone.id \u0026\u0026 card.status !== 'done');\n    const card = cards.find((item) =\u003e item.status === 'doing')\n      || cards.find((item) =\u003e item.status === 'ready')\n      || cards.find((item) =\u003e item.status === 'review')\n      || cards.find((item) =\u003e item.status === 'backlog');\n    return { milestone, card };\n  }\n\n  function relatedModules(id) {\n    const related = new Set();\n    DATA.relations.forEach((relation) =\u003e {\n      if (relation.from === id) related.add(relation.to);\n      if (relation.to === id) related.add(relation.from);\n    });\n    return related;\n  }\n\n  function cardMatches(card, query) {\n    if (!query) return true;\n    return [card.id, card.title, card.module, card.status, card.priority]\n      .filter(Boolean)\n      .join(' ')\n      .toLowerCase()\n      .includes(query);\n  }\n\n  function moduleMatches(module, query) {\n    if (!query) return true;\n    return [module.id, module.title, module.summary, module.layer, module.status]\n      .filter(Boolean)\n      .join(' ')\n      .toLowerCase()\n      .includes(query);\n  }\n\n  function docMatches(doc, query) {\n    if (!query) return true;\n    return [doc.id, doc.title, doc.kind, doc.status, doc.summary, doc.excerpt, doc.path]\n      .filter(Boolean)\n      .join(' ')\n      .toLowerCase()\n      .includes(query);\n  }\n\n  function eventMatches(event, query) {\n    if (!query) return true;\n    return [event.date, event.kind, event.title, event.detail, ...(event.refs || [])]\n      .filter(Boolean)\n      .join(' ')\n      .toLowerCase()\n      .includes(query);\n  }\n\n  function viewHead(kicker, title, subtitle, stats) {\n    return `\u003cdiv class=\"view-head\"\u003e\n      \u003cdiv\u003e\n        \u003cdiv class=\"kicker\"\u003e${esc(kicker)}\u003c/div\u003e\n        \u003ch1 class=\"view-title\"\u003e${esc(title)}\u003c/h1\u003e\n        ${subtitle ? `\u003cp class=\"view-sub\"\u003e${esc(subtitle)}\u003c/p\u003e` : ''}\n      \u003c/div\u003e\n      ${stats ? `\u003cdiv class=\"stats\"\u003e${stats}\u003c/div\u003e` : ''}\n    \u003c/div\u003e`;\n  }\n\n  function compareCards(a, b) {\n    const priority = { P0: 0, P1: 1, P2: 2 };\n    const pa = priority[a.priority] ?? 9;\n    const pb = priority[b.priority] ?? 9;\n    return pa - pb || a.id.localeCompare(b.id);\n  }\n\n  function renderTabs() {\n    document.querySelectorAll('.tab').forEach((tab) =\u003e {\n      const active = tab.dataset.view === state.view;\n      tab.classList.toggle('active', active);\n      if (active) tab.setAttribute('aria-current', 'page');\n      else tab.removeAttribute('aria-current');\n    });\n  }\n\n  function renderChrome() {\n    document.getElementById('project-status').textContent = DATA.project.status;\n    document.getElementById('module-count').textContent = DATA.modules.length;\n","truncated":true},{"path":"docs/dashboard/style.css","language":"css","text":":root {\n  --bg: #f4f2ee;\n  --surface: #fbfaf7;\n  --surface-2: #eeece6;\n  --ink: #1d1c19;\n  --muted: #6c675e;\n  --faint: #969084;\n  --line: #ded9cf;\n  --line-strong: #c8c1b4;\n  --accent: #2f5d50;\n  --accent-soft: rgba(47, 93, 80, 0.12);\n  --shadow: 0 1px 2px rgba(29, 28, 25, 0.05), 0 8px 24px rgba(29, 28, 25, 0.04);\n  --code-bg: #1e1d1a;\n  --code-ink: #e7e1d5;\n  --code-line: #302d28;\n  --code-muted: #6f6a5f;\n  --st-backlog: #8c8478;\n  --st-ready: #3f6f9f;\n  --st-doing: #b7791f;\n  --st-review: #6f5aa8;\n  --st-done: #3f7d4f;\n  --st-blocked: #b42318;\n  --sans: -apple-system, BlinkMacSystemFont, \"Segoe UI\", \"Noto Sans SC\", \"PingFang SC\", \"Hiragino Sans GB\", sans-serif;\n  --mono: ui-monospace, SFMono-Regular, \"SF Mono\", Menlo, Consolas, \"Liberation Mono\", monospace;\n}\n\n[data-theme=\"dark\"] {\n  --bg: #141412;\n  --surface: #1b1a17;\n  --surface-2: #23211d;\n  --ink: #eae6de;\n  --muted: #a8a094;\n  --faint: #8a8275;\n  --line: #2d2a25;\n  --line-strong: #4a453c;\n  --accent: #8fbfae;\n  --accent-soft: rgba(143, 191, 174, 0.12);\n  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.18);\n  --code-bg: #0e0e0d;\n  --code-ink: #ddd7ca;\n  --code-line: #2b2924;\n  --code-muted: #5f5a50;\n  --st-backlog: #9a9285;\n  --st-ready: #76a6d8;\n  --st-doing: #d3a04a;\n  --st-review: #a78fe0;\n  --st-done: #78b98a;\n  --st-blocked: #e06c61;\n}\n\n*,\n*::before,\n*::after {\n  box-sizing: border-box;\n}\n\nhtml,\nbody {\n  margin: 0;\n  height: 100%;\n}\n\nbody {\n  background: var(--bg);\n  color: var(--ink);\n  font-family: var(--sans);\n  font-size: 13px;\n  line-height: 1.5;\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n  overflow: hidden;\n}\n\nbutton {\n  font: inherit;\n  color: inherit;\n  background: none;\n  border: 0;\n  padding: 0;\n  cursor: pointer;\n}\n\na {\n  color: inherit;\n  text-decoration: none;\n}\n\ninput {\n  font: inherit;\n}\n\n::selection {\n  background: var(--accent-soft);\n}\n\n:focus-visible {\n  outline: 2px solid var(--accent);\n  outline-offset: 2px;\n}\n\n* {\n  scrollbar-width: thin;\n  scrollbar-color: var(--line-strong) transparent;\n}\n\n*::-webkit-scrollbar {\n  width: 8px;\n  height: 8px;\n}\n\n*::-webkit-scrollbar-thumb {\n  background: var(--line);\n  border: 2px solid transparent;\n  border-radius: 99px;\n  background-clip: padding-box;\n}\n\n/* ---------- top bar ---------- */\n\n.topbar {\n  height: 58px;\n  display: flex;\n  align-items: center;\n  gap: 22px;\n  padding: 0 18px;\n  border-bottom: 1px solid var(--line);\n  background: var(--surface);\n  position: relative;\n  z-index: 30;\n}\n\n.brand {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  min-width: 0;\n}\n\n.brand-mark {\n  width: 30px;\n  height: 30px;\n  border-radius: 8px;\n  background: var(--ink);\n  color: var(--bg);\n  display: grid;\n  place-items: center;\n  font-family: var(--mono);\n  font-size: 12px;\n  font-weight: 700;\n  letter-spacing: -0.06em;\n  flex: none;\n}\n\n.brand-tag {\n  font-size: 11px;\n  color: var(--muted);\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n}\n\n.tabs {\n  display: flex;\n  gap: 2px;\n  background: var(--surface-2);\n  border: 1px solid var(--line);\n  border-radius: 8px;\n  padding: 3px;\n  flex: none;\n}\n\n.tab {\n  padding: 5px 11px;\n  border-radius: 6px;\n  font-size: 11.5px;\n  color: var(--muted);\n  white-space: nowrap;\n  transition: color 0.12s ease, background 0.12s ease;\n}\n\n.tab:hover {\n  color: var(--ink);\n}\n\n.tab.active {\n  background: var(--surface);\n  color: var(--ink);\n  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);\n}\n\n.top-actions {\n  margin-left: auto;\n  display: flex;\n  align-items: center;\n  gap: 9px;\n}\n\n.search {\n  display: flex;\n  align-items: center;\n","truncated":true},{"path":"docs/dashboard/template.html","language":"html","text":"\u003c!doctype html\u003e\n\u003chtml lang=\"zh-CN\" data-theme=\"light\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\u003e\n\u003cmeta name=\"color-scheme\" content=\"light dark\"\u003e\n\u003cmeta name=\"description\" content=\"ni project dashboard: board, architecture, documents, timeline.\"\u003e\n\u003ctitle\u003eni · project dashboard\u003c/title\u003e\n\u003cstyle\u003e\n{{STYLE}}\n\u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\u003cheader class=\"topbar\"\u003e\n  \u003ca class=\"brand\" href=\"#/arch\" data-view=\"arch\" aria-label=\"ni dashboard\"\u003e\n    \u003cspan class=\"brand-mark\"\u003eni\u003c/span\u003e\n    \u003cspan class=\"brand-tag\"\u003eminimal, observable coding agent\u003c/span\u003e\n  \u003c/a\u003e\n\n  \u003cnav class=\"tabs\" aria-label=\"Views\"\u003e\n    \u003cbutton class=\"tab\" type=\"button\" data-view=\"arch\"\u003eArchitecture\u003c/button\u003e\n    \u003cbutton class=\"tab\" type=\"button\" data-view=\"work\"\u003eWork\u003c/button\u003e\n    \u003cbutton class=\"tab\" type=\"button\" data-view=\"docs\"\u003eDocs\u003c/button\u003e\n    \u003cbutton class=\"tab\" type=\"button\" data-view=\"decisions\"\u003eDecisions\u003c/button\u003e\n  \u003c/nav\u003e\n\n  \u003cdiv class=\"top-actions\"\u003e\n    \u003clabel class=\"search\" aria-label=\"Filter current view\"\u003e\n      \u003cspan class=\"search-key\"\u003e/\u003c/span\u003e\n      \u003cinput id=\"search\" type=\"search\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"Filter\"\u003e\n    \u003c/label\u003e\n    \u003cspan class=\"status-chip\" id=\"project-status\"\u003e\u003c/span\u003e\n    \u003cbutton class=\"icon-button\" id=\"theme-toggle\" type=\"button\" title=\"Toggle theme\" aria-label=\"Toggle theme\"\u003e◐\u003c/button\u003e\n  \u003c/div\u003e\n\u003c/header\u003e\n\n\u003cmain class=\"shell\"\u003e\n  \u003caside class=\"rail\" aria-label=\"Project navigation\"\u003e\n    \u003csection class=\"rail-section rail-map\"\u003e\n      \u003cdiv class=\"rail-head\"\u003e\u003ch2\u003eArchitecture\u003c/h2\u003e\u003cspan id=\"module-count\"\u003e\u003c/span\u003e\u003c/div\u003e\n      \u003cdiv id=\"map-nav\" class=\"map-nav\"\u003e\u003c/div\u003e\n    \u003c/section\u003e\n\n    \u003csection class=\"rail-section rail-docs\"\u003e\n      \u003cdiv class=\"rail-head\"\u003e\u003ch2\u003eDocuments\u003c/h2\u003e\u003cspan id=\"doc-count\"\u003e\u003c/span\u003e\u003c/div\u003e\n      \u003cdiv id=\"rail-docs\" class=\"rail-doc-list\"\u003e\u003c/div\u003e\n    \u003c/section\u003e\n\n    \u003cdiv class=\"rail-foot\" id=\"rail-foot\"\u003e\u003c/div\u003e\n  \u003c/aside\u003e\n\n  \u003csection class=\"canvas\" id=\"canvas\" aria-label=\"Project view\" tabindex=\"-1\"\u003e\u003c/section\u003e\n  \u003caside class=\"details\" id=\"details\" aria-label=\"Details\"\u003e\u003c/aside\u003e\n\u003c/main\u003e\n\n\u003cnoscript\u003e\n  \u003cp style=\"padding:24px;font-family:monospace\"\u003eThis dashboard needs JavaScript. Source files live in docs/dashboard/.\u003c/p\u003e\n\u003c/noscript\u003e\n\n\u003cscript id=\"ni-data\" type=\"application/json\"\u003e{{DATA}}\u003c/script\u003e\n\u003cscript\u003e\n{{APP}}\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n","truncated":false}]}],"relations":[{"from":"cli","to":"loop","label":"run"},{"from":"tui","to":"loop","label":"run"},{"from":"loop","to":"context","label":"project"},{"from":"loop","to":"providers","label":"stream"},{"from":"loop","to":"tools","label":"dispatch"},{"from":"loop","to":"session","label":"append"},{"from":"context","to":"session","label":"read"},{"from":"tools","to":"sandbox","label":"guard"}],"cards":[{"id":"M0-001","title":"Cargo workspace 与工具链","status":"done","milestone":"M0","module":null,"size":"S","priority":"P0","updated":"2026-10-20","completed":"2026-10-20","depends_on":[],"docs":[],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e三个 crate：\u003ccode\u003eni-core\u003c/code\u003e、\u003ccode\u003eni-cli\u003c/code\u003e、\u003ccode\u003extask\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e统一 edition、依赖版本和 workspace lint 入口。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ecargo xtask dashboard\u003c/code\u003e 作为仓库工具入口。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ecargo test --workspace\u003c/code\u003e 全绿。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ecargo xtask dashboard\u003c/code\u003e 可重复执行。\u003c/li\u003e\n\u003cli\u003e核心 crate 不依赖 CLI 或 UI。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003e先保持三个 crate。等 provider、tools、sandbox 真正落地后再拆，避免空 crate。\u003c/p\u003e\n","path":"docs/board/M0-001-workspace.md"},{"id":"M0-002","title":"事件模型与 JSONL 会话日志","status":"done","milestone":"M0","module":"session","size":"M","priority":"P0","updated":"2026-10-20","completed":"2026-10-20","depends_on":[],"docs":["adr-0002"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eEvent\u003c/code\u003e 枚举覆盖 session、user、assistant、tool result、turn end、compaction。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eSessionLog\u003c/code\u003e 只追加，每条事件立即 flush。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eload\u003c/code\u003e 逐行解码，坏行变成 warning，不丢整份历史。\u003c/li\u003e\n\u003cli\u003e单测覆盖 round-trip、坏尾行、空行。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n写入后重新加载，事件序列完全一致。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n最后一行损坏时，前面的历史仍可读。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003eni session show\u003c/code\u003e 能打印事件类型和数量。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003e时间戳统一为 Unix 毫秒。\u003ccode\u003ecompaction\u003c/code\u003e 记录被替换的事件数量，后续 resume 用它判断投影边界。\u003c/p\u003e\n","path":"docs/board/M0-002-session-log.md"},{"id":"M0-003","title":"离线项目看板 v0","status":"done","milestone":"M0","module":"dashboard","size":"L","priority":"P1","updated":"2026-10-20","completed":"2026-10-20","depends_on":["M0-001"],"docs":["readme"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e三栏壳：里程碑导航 / 画布 / 详情。\u003c/li\u003e\n\u003cli\u003e四个视图：Board、Architecture、Docs、Timeline。\u003c/li\u003e\n\u003cli\u003e数据源：\u003ccode\u003edocs/dashboard/project.json\u003c/code\u003e + 一卡一文件的 TOML frontmatter。\u003c/li\u003e\n\u003cli\u003e构建为单个 \u003ccode\u003edocs/index.html\u003c/code\u003e，无 CDN、无运行时 fetch，\u003ccode\u003efile://\u003c/code\u003e 可开。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e--check\u003c/code\u003e 校验引用、状态和生成物是否过期。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n双击 \u003ccode\u003edocs/index.html\u003c/code\u003e 能看到真实 M0 卡片。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n架构图展示模块状态和依赖箭头。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nADR 与架构文档能在右栏渲染。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003ecargo xtask dashboard --check\u003c/code\u003e 在生成物过期时失败。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003e浏览器只读，不提供拖拽回写。状态变更走仓库，避免看板变成第二个真相源。后续由 \u003ccode\u003eM0-010\u003c/code\u003e 改为 Architecture 优先。\u003c/p\u003e\n","path":"docs/board/M0-003-dashboard.md"},{"id":"M0-004","title":"CLI 骨架与会话命令","status":"done","milestone":"M0","module":"cli","size":"S","priority":"P0","updated":"2026-10-20","completed":"2026-10-20","depends_on":["M0-001","M0-002"],"docs":[],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eni\u003c/code\u003e 无参数时打印版本、状态、会话目录和下一步。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eni session new\u003c/code\u003e 创建会话并写入 \u003ccode\u003esession_start\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eni session show\u003c/code\u003e 打印事件时间线，\u003ccode\u003eni session list\u003c/code\u003e 列出文件。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003eni session new\u003c/code\u003e 输出可直接被脚本消费的路径。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003eni session show \u0026lt;path\u0026gt;\u003c/code\u003e 显示事件数与 warning。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n默认目录支持 \u003ccode\u003eNI_HOME\u003c/code\u003e / \u003ccode\u003eHOME\u003c/code\u003e 覆盖。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003eexec\u003c/code\u003e 子命令等 loop 落地后再加，避免先有一个假入口。\u003c/p\u003e\n","path":"docs/board/M0-004-cli.md"},{"id":"M0-005","title":"Provider trait 与流式适配","status":"ready","milestone":"M0","module":"providers","size":"L","priority":"P0","updated":"2026-10-20","completed":null,"depends_on":["M0-002"],"docs":["architecture"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e内部统一的 \u003ccode\u003eStreamEvent\u003c/code\u003e：text / reasoning / tool call / usage / done / error。\u003c/li\u003e\n\u003cli\u003e一个真实 provider 的 SSE 适配，优先 OpenAI-compatible。\u003c/li\u003e\n\u003cli\u003e错误分类：可重试、致命、上下文溢出。\u003c/li\u003e\n\u003cli\u003eusage 归一化，保留 cached 与 reasoning tokens。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e录制的 SSE fixture 能解析出完整 turn。\u003c/li\u003e\n\u003cli\u003e429 / 5xx 在 turn 边界重试，工具执行后不重放。\u003c/li\u003e\n\u003cli\u003e上下文溢出返回可识别错误，交给 compaction 处理。\u003c/li\u003e\n\u003cli\u003eprovider 模块不依赖 tools 或 TUI。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003e先做一个 provider。第二个 provider 等协议稳定后再加，避免过早抽象。\u003c/p\u003e\n","path":"docs/board/M0-005-provider.md"},{"id":"M0-006","title":"文件工具：read / write / edit / grep / glob","status":"backlog","milestone":"M0","module":"tools","size":"L","priority":"P0","updated":"2026-10-20","completed":null,"depends_on":["M0-001"],"docs":["architecture"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e五个文件工具 + 一个注册表；JSON Schema 描述输入。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eread\u003c/code\u003e 返回行号，单次上限 2000 行 / 50KB，截断时给出续读方式。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eedit\u003c/code\u003e 用精确字符串替换，要求唯一匹配，返回小 diff。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003egrep\u003c/code\u003e / \u003ccode\u003eglob\u003c/code\u003e 结果有上限，并报告总数。\u003c/li\u003e\n\u003cli\u003eread-before-write 策略：未读过的文件拒绝写。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e非唯一 \u003ccode\u003eold_string\u003c/code\u003e 被拒绝，并提示增加上下文。\u003c/li\u003e\n\u003cli\u003e未读文件 \u003ccode\u003ewrite\u003c/code\u003e / \u003ccode\u003eedit\u003c/code\u003e 返回可操作的错误。\u003c/li\u003e\n\u003cli\u003e超大文件读取被截断，模型能按 offset 继续。\u003c/li\u003e\n\u003cli\u003e工具错误信息包含下一步建议，而不是裸错误码。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003e工具描述也是 prompt 表面，描述里写清楚何时用、何时不用、边界和示例。\u003c/p\u003e\n","path":"docs/board/M0-006-tools.md"},{"id":"M0-007","title":"Bash 工具：超时、进程组与输出预算","status":"backlog","milestone":"M0","module":"sandbox","size":"M","priority":"P0","updated":"2026-10-20","completed":null,"depends_on":["M0-006"],"docs":[],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e在工作目录执行命令，默认超时 120s。\u003c/li\u003e\n\u003cli\u003e启动时 \u003ccode\u003edetached\u003c/code\u003e，取消/超时对进程组发信号，不留孤儿。\u003c/li\u003e\n\u003cli\u003e只回尾部 20KB，完整输出写临时文件并把路径给模型。\u003c/li\u003e\n\u003cli\u003e变更型命令先过 approval 策略（M0 可以是占位实现）。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e超时后子进程及其派生的 \u003ccode\u003esleep\u003c/code\u003e 都被终止。\u003c/li\u003e\n\u003cli\u003e大输出不会撑爆上下文，模型能拿到完整输出路径。\u003c/li\u003e\n\u003cli\u003eCtrl-C 能中断正在跑的命令。\u003c/li\u003e\n\u003cli\u003e非零退出码、stderr 和超时是可区分的三种结果。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003ebash 是能力上限也是风险上限。没有真沙箱时，所有变更型 bash 强制审批。\u003c/p\u003e\n","path":"docs/board/M0-007-bash.md"},{"id":"M0-008","title":"Turn loop 与 ni exec","status":"backlog","milestone":"M0","module":"loop","size":"L","priority":"P0","updated":"2026-10-20","completed":null,"depends_on":["M0-005","M0-006","M0-007"],"docs":["architecture"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e一个 turn：project → stream → dispatch tools → append events。\u003c/li\u003e\n\u003cli\u003e循环直到无 tool call、达到 max steps、被取消或 fatal error。\u003c/li\u003e\n\u003cli\u003e只读工具可并发，写工具串行。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eni exec \"\u0026lt;prompt\u0026gt;\"\u003c/code\u003e headless 入口，输出最终文本和 usage。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e用 scripted provider 修掉 fixture 仓库里的一个失败测试。\u003c/li\u003e\n\u003cli\u003e达到 max steps 时返回明确原因，不静默退出。\u003c/li\u003e\n\u003cli\u003e取消后不再发起 provider 请求或工具调用。\u003c/li\u003e\n\u003cli\u003e每个 turn 的 usage 落在 \u003ccode\u003eturn_end\u003c/code\u003e 事件里。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003eloop 不关心 provider wire format，也不实现工具逻辑。它只编排和记录。\u003c/p\u003e\n","path":"docs/board/M0-008-loop.md"},{"id":"M0-009","title":"Resume 与录制回放测试","status":"backlog","milestone":"M0","module":"session","size":"M","priority":"P1","updated":"2026-10-20","completed":null,"depends_on":["M0-008"],"docs":["adr-0002"],"blocked_
