e/model\u003c/code\u003e 直接打开模型下拉；↑↓/鼠标选择，Enter 填入，再 Enter 执行；只允许当前 provider。\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003e/compact\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e立即生成确定性 handoff 并写入 compaction 事件；下一次 turn 使用压缩后的投影。\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003e/permissions [profile]\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e输入 \u003ccode\u003e/permissions\u003c/code\u003e 直接打开 profile 下拉；切换 ask/review/full-access/ci。\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003e/plan\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e进入只读 plan mode；\u003ccode\u003e/plan off\u003c/code\u003e / \u003ccode\u003e/plan approve\u003c/code\u003e 退出；\u003ccode\u003e/plan status\u003c/code\u003e 查看。\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003e/goal \u0026lt;condition\u0026gt;\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e设置目标并立即启动 goal run（最多 6 轮）；\u003ccode\u003e/goal\u003c/code\u003e 查看；\u003ccode\u003e/goal run\u003c/code\u003e 重新启动；\u003ccode\u003e/goal stop\u003c/code\u003e 停止；\u003ccode\u003e/goal clear\u003c/code\u003e 清除。\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003e/fork [event-id]\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e复制当前 session 的前缀到新 session 并切换过去；默认 fork 到最后一个事件。\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003e/status\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e显示 model、cwd、sandbox、context budget、session、事件数、turn / compaction / instruction / subagent / extension 计数和累计 cache。\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003e/session\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e显示当前 session 路径、事件数和 turn 数。\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003e/last\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e重新打印最近一次工具输出。\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003e/help\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e显示命令表。\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003e/exit\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e退出。\u003c/td\u003e\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e细节：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003e/init\u003c/code\u003e 根据 \u003ccode\u003eCargo.toml\u003c/code\u003e / \u003ccode\u003epackage.json\u003c/code\u003e / \u003ccode\u003epyproject.toml\u003c/code\u003e / \u003ccode\u003ego.mod\u003c/code\u003e 选择测试、构建、lint 命令；未知项目保留占位注释。它只写 \u003ccode\u003e\u0026lt;cwd\u0026gt;/AGENTS.md\u003c/code\u003e，不跟随已存在的 symlink。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e/plan\u003c/code\u003e 不改变 profile，只把 tool allowlist 收窄到 \u003ccode\u003eread/grep/glob\u003c/code\u003e 并注入只读计划指令；\u003ccode\u003e/plan approve\u003c/code\u003e 只退出模式，不自动执行。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e/goal\u003c/code\u003e 不改变权限；active goal 进入 system prompt，并写入 \u003ccode\u003egoal_set\u003c/code\u003e / \u003ccode\u003egoal_cleared\u003c/code\u003e 事件。\u003c/li\u003e\n\u003cli\u003esession 默认写入 \u003ccode\u003e~/.niucode/projects/\u0026lt;key\u0026gt;/sessions/\u003c/code\u003e；项目根不创建 \u003ccode\u003e.niucode\u003c/code\u003e。\u003ccode\u003e/clear\u003c/code\u003e 继承当前 model、cwd 和 sandbox 配置，写入新的 \u003ccode\u003esession_start\u003c/code\u003e / \u003ccode\u003epolicy\u003c/code\u003e 事件；保留 plan mode 与 goal（重新写入事件），停止 goal run，保留输入历史。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e/reset\u003c/code\u003e 是更强的重置：新 session + plan off + goal 清空 + pending/输入历史清空 + 重新读取 AGENTS.md；extension host 仍按 session 生命周期挂载，不重启进程。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e/resume\u003c/code\u003e 切换 append-only session：重新投影 history 和 UI 状态，停止当前 goal run；无参数进入上下选择 picker（标题取首条 user message），\u003ccode\u003e/resume --all\u003c/code\u003e 跨项目；非 TTY 回退文本列表；cwd/model 不一致会警告。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e/reload\u003c/code\u003e 只重读 AGENTS.md 指令；扩展 manifest 在 session 启动时挂载，重新加载需要重启 TUI。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e/model\u003c/code\u003e 是运行时模型选择：canonical \u003ccode\u003eprovider/model\u003c/code\u003e；写入 \u003ccode\u003emodel_change { provider, model }\u003c/code\u003e，\u003ccode\u003e/resume\u003c/code\u003e 恢复，\u003ccode\u003e/clear\u003c/code\u003e 保留，\u003ccode\u003e/reset\u003c/code\u003e 清除。provider 由 \u003ccode\u003eProviderFactory\u003c/code\u003e 惰性解析凭据并构造；切换发生在 turn 边界。请求仍然走同一个 endpoint/auth，下一次 turn 使用新 model；切换 turn 可能失去 prompt cache。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e/model\u003c/code\u003e 和 \u003ccode\u003e/permissions\u003c/code\u003e 直接打开参数下拉：输入命令后→↑↓/鼠标选择（或 Tab 选第一项）→Enter 填入→再 Enter 执行；直接 Enter 显示当前值，不误改配置。建议列表来自 \u003ccode\u003eNIUCODE_MODEL_CHOICES\u003c/code\u003e（逗号分隔）或内置的 deepseek/openai 小列表；这是 Pi 式“选择 vs 实际请求模型”的简化版，不含 virtual model/router。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e/permissions\u003c/code\u003e 只映射已有 policy 字段：\u003ccode\u003eask\u003c/code\u003e = workspace-write/off/ask，\u003ccode\u003ereview\u003c/code\u003e = workspace-write/off/on-failure，\u003ccode\u003efull-access\u003c/code\u003e = full-access/on/never，\u003ccode\u003eci\u003c/code\u003e = read-only/off/never。写入 \u003ccode\u003epermission_change\u003c/code\u003e 事件；\u003ccode\u003e/resume\u003c/code\u003e 恢复，\u003ccode\u003e/clear\u003c/code\u003e 保留，\u003ccode\u003e/reset\u003c/code\u003e 清除。\u003ccode\u003e/plan\u003c/code\u003e 仍然是独立 mode。\u003c/li\u003e\n\u003cli\u003efull-access 会打印隔离关闭警告；profile 变更只在下一个 turn 生效。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e/status\u003c/code\u003e 显示生效 provider/model、sandbox/network/approval、permission profile、auto context budget 和鼠标模式；tmux 下会提示 \u003ccode\u003etmux set -g mouse on\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e/fork\u003c/code\u003e 调用与 \u003ccode\u003eniucode fork\u003c/code\u003e 相同的逻辑：只读源文件、复制前缀、追加 \u003ccode\u003efork\u003c/code\u003e 溯源事件，然后重新投影 history 并切换过去。非法 event ID 会报错并保留当前 session。\u003c/li\u003e\n\u003cli\u003e未知 \u003ccode\u003e/foo\u003c/code\u003e 显示 \u003ccode\u003eunknown command\u003c/code\u003e，不会发给模型；命令参数错误显示 usage。\u003c/li\u003e\n\u003cli\u003e所有 slash 输出走 stdout，warning / error 走 stderr。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e视觉与可访问性\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eTTY 宽度 ≥ 62 列时显示 6 行块字 \u003ccode\u003eNIUCODE\u003c/code\u003e logo；窄终端退化为单行 wordmark。\u003c/li\u003e\n\u003cli\u003e颜色只在 TTY 开启；\u003ccode\u003eNO_COLOR\u003c/code\u003e、\u003ccode\u003eCLICOLOR=0\u003c/code\u003e、\u003ccode\u003eTERM=dumb\u003c/code\u003e 或重定向输出时自动退化为纯文本。\u003c/li\u003e\n\u003cli\u003e符号使用单列宽的 UTF-8 字符，不依赖 Nerd Font 或外部字体。\u003c/li\u003e\n\u003cli\u003e审批 pager 的 header / footer 反色条也遵循同一套主题开关。\u003c/li\u003e\n\u003cli\u003e所有文件内容、工具输出和路径在进入终端前都会清洗控制字符，避免 ANSI 注入。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e审批\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003e--approval ask\u003c/code\u003e 时，每个 \u003ccode\u003ewrite\u003c/code\u003e / \u003ccode\u003eedit\u003c/code\u003e / \u003ccode\u003ebash\u003c/code\u003e 前暂停。\u003ccode\u003ewrite\u003c/code\u003e / \u003ccode\u003eedit\u003c/code\u003e 会先展示本次修改的完整 unified diff：\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003e approval · edit src/main.rs · +1 -1\n▎ src/main.rs                                                    +1 -1\n@@ -12,3 +12,3 @@\n  12  12 │   fn main() {\n  13     │ -     println!(\"old\");\n      13 │ +     println!(\"new\");\n  14  14 │   }\n\n file 1/1 · 1-7/7   a allow · d deny · s session · j/k scroll · n/p file\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003epager 按键：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ea\u003c/code\u003e 允许本次。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ed\u003c/code\u003e / Esc / \u003ccode\u003eq\u003c/code\u003e 拒绝本次。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003es\u003c/code\u003e 本次 session 内自动允许后续变更型工具。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ej\u003c/code\u003e / \u003ccode\u003ek\u003c/code\u003e 或方向键逐行滚动；PageUp / PageDown / 空格翻页；\u003ccode\u003eg\u003c/code\u003e / \u003ccode\u003eG\u003c/code\u003e 跳到顶部 / 底部。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003en\u003c/code\u003e / \u003ccode\u003ep\u003c/code\u003e（或 \u003ccode\u003e]\u003c/code\u003e / \u003ccode\u003e[\u003c/code\u003e）在多个文件之间跳转。\u003c/li\u003e\n\u003cli\u003e终端 resize 会按新宽度重新布局；窄于 40 列或低于 6 行时退回纯文本预览。\u003c/li\u003e\n\u003cli\u003e终端不是 TTY 时退化为逐行 \u003ccode\u003ea/d/s\u003c/code\u003e 输入，方便管道测试。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ebash\u003c/code\u003e 没有文件 diff，审批只显示命令摘要和按键提示。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003ediff 使用工具层读取的真实文件内容，包含行号、hunk 和上下文。\u003ccode\u003ewrite\u003c/code\u003e 新文件显示全部新增行；已有文件显示修改前后的 diff；二进制文件或无法读取的文件会显示说明而不是伪造 diff。预览与真正执行之间文件可能变化，执行时会重新校验。\u003c/p\u003e\n\u003ch2\u003e上下文压缩\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003eniucode tui\u003c/code\u003e 与 \u003ccode\u003eniucode exec\u003c/code\u003e 共用 \u003ccode\u003eniucode-agent\u003c/code\u003e 的预算检查。默认上下文预算 64k，到 75% 时触发 compaction；默认保留最近 3 个 user turn 原文，其余事件生成确定性 handoff。\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-sh\"\u003eniucode tui --context-budget 128000 --keep-recent-turns 4\nniucode tui --max-steps 40\n\u003c/code\u003e\u003c/pre\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ecompaction.upto\u003c/code\u003e 是绝对事件下标；最后一个 compaction 生效，原始事件不删除。\u003c/li\u003e\n\u003cli\u003e压缩成功才追加事件；\u003ccode\u003ecompacted\u003c/code\u003e 行显示替换的事件数和估算 token 变化。\u003c/li\u003e\n\u003cli\u003e没有安全 cutoff、handoff 不收缩或写入失败时，保留原上下文并提示，不丢历史。\u003c/li\u003e\n\u003cli\u003e压缩结果会在下一次请求和 resume 时投影为 system handoff，与压缩时的模型上下文一致。\u003c/li\u003e\n\u003cli\u003e真实 token 成本仍以 provider 的 \u003ccode\u003eturn usage\u003c/code\u003e 为准；预算检查用字符估算是保守近似。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e指令与缓存\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e每次 run 从 cwd 向上发现 \u003ccode\u003eAGENTS.md\u003c/code\u003e，近者优先，追加在稳定 base system prompt 之后；修改后下一次用户 turn 生效。\u003c/li\u003e\n\u003cli\u003e加载来源与 digest 写入 \u003ccode\u003einstructions\u003c/code\u003e 事件；\u003ccode\u003esession show\u003c/code\u003e 可查。\u003c/li\u003e\n\u003cli\u003e缓存命中率来自 provider 返回的 usage，按 turn 显示 \u003ccode\u003ecache N%\u003c/code\u003e，\u003ccode\u003edone\u003c/code\u003e 行显示总命中率。\u003c/li\u003e\n\u003cli\u003e不写单独 metrics 文件；运行时 Runs 视图留给后续 runtime viewer（ADR-0009）。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e取消与事件\u003c/h2\u003e\n\u003cp\u003eTUI 调用与 headless 相同的 \u003ccode\u003erun_with_history\u003c/code\u003e，只消费 \u003ccode\u003eAgentEvent\u003c/code\u003e，不 import loop 内部。\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e取消会 drop provider stream 和工具 future；bash 的进程组由 \u003ccode\u003eProcessGroupGuard\u003c/code\u003e 清理。\u003c/li\u003e\n\u003cli\u003e取消后 session 追加 \u003ccode\u003esession_end\u003c/code\u003e，已完成的事件保留。\u003c/li\u003e\n\u003cli\u003e每次运行仍有 \u003ccode\u003epolicy\u003c/code\u003e / \u003ccode\u003eapproval\u003c/code\u003e / \u003ccode\u003einstructions\u003c/code\u003e / \u003ccode\u003etool_result\u003c/code\u003e 审计。\u003c/li\u003e\n\u003cli\u003e同一进程内复用 session 与 history；每次 turn 后从日志重新投影，避免 UI 自己维护第二份对话状态。\u003c/li\u003e\n\u003cli\u003e工具输出折叠只影响呈现；\u003ccode\u003etool_result\u003c/code\u003e 事件和 session 日志保留完整 output。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e边界\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e会话本身仍是线性输出；审批 diff 是 alternate-screen overlay，没有常驻滚动区、面板和鼠标。\u003c/li\u003e\n\u003cli\u003e审批时 Ctrl-C 按拒绝处理，不是取消整轮。\u003c/li\u003e\n\u003cli\u003e输出折叠只对工具结果生效；模型流式文本直接输出。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e:last\u003c/code\u003e 只记录当前进程的最近一次工具结果，不跨重启；需要历史时读 session JSONL。\u003c/li\u003e\n\u003cli\u003e当前 \u003ccode\u003ewrite\u003c/code\u003e / \u003ccode\u003eedit\u003c/code\u003e 每次只改一个文件；pager 已支持多文件跳转，等后续 patch 工具接入。\u003c/li\u003e\n\u003cli\u003e大 diff 会在进入 pager 时完整布局；极端大文件后续需要预算或分页。\u003c/li\u003e\n\u003cli\u003e大输出仍受 bash 20KB 尾部预算约束。\u003c/li\u003e\n\u003cli\u003e上下文预算是估算值，不替代模型真实 tokenizer。\u003c/li\u003e\n\u003cli\u003e指令在一次 run 内保持稳定；长 run 中途修改 \u003ccode\u003eAGENTS.md\u003c/code\u003e 需要下一次用户 turn 才生效。\u003c/li\u003e\n\u003cli\u003e命令补全只覆盖 slash 命令名，不做文件路径补全；避免把输入行变成第二套 shell。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003esubagent\u003c/code\u003e 子运行只读且并行，完整 transcript 在独立子 session 日志里；TUI 只显示摘要和路径。\u003c/li\u003e\n\u003c/ul\u003e\n","path":"docs/tui.md","excerpt":"niucode tui：ratatui inline 输入层、原生 transcript scrollback、审批 diff pager、工具状态与缓存命中率。"},{"id":"adr-0013","title":"ADR-0013：小内核 + 外置 capability 插件","kind":"adr","status":"accepted","order":40,"summary":"内置工具、loop、context、policy、auth、session 留在内核；external tools/commands 走 session 级 sidecar host；WASM 只做纯计算 tier。","body_html":"\u003ch2\u003e状态\u003c/h2\u003e\n\u003cp\u003eAccepted · 2026-10-20\u003c/p\u003e\n\u003ch2\u003e背景\u003c/h2\u003e\n\u003cp\u003eM4 要让 niucode 可扩展，同时不牺牲事件日志、replay、安全和可观察性。Pi 的同进程 TypeScript extension 和 DSH/Cordis 的 everything-is-plugin 都提供了很好的扩展点，但一个把信任边界交给同进程，一个把整个 runtime 变成插件树。niucode 的体量不需要平台级 runtime，但需要能力级扩展。\u003c/p\u003e\n\u003ch2\u003e决策\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e内核保持特权且小\u003c/strong\u003e：\u003ccode\u003eniucode-core\u003c/code\u003e 的 Event/SessionLog、context 投影与 compaction、turn loop、tool dispatch、subagent 编排、policy/sandbox/approval、auth、内置工具、extension supervisor 都不插件化。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e只插件化两类代码\u003c/strong\u003e：external tools 和 plugin commands。skills/AGENTS/command metadata/provider presets 是声明式扩展，不是代码插件。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e内置工具留在内核\u003c/strong\u003e：它们定义最小闭环、安全边界和 subagent allowlist；外部工具走同一 \u003ccode\u003eTool\u003c/code\u003e 接口，但属于低信任 tier。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003esession 级 host\u003c/strong\u003e：一个 session 一个 \u003ccode\u003eExtensionHost\u003c/code\u003e；一个插件一个 sidecar 进程（可带 worker pool）。进程数按插件计，不按 subagent 计；subagent 共享 host 和 provider pool。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003etransport 用 stdio JSON-RPC\u003c/strong\u003e：manifest + \u003ccode\u003einitialize\u003c/code\u003e 握手 + capability negotiation + \u003ccode\u003etools/call\u003c/code\u003e / \u003ccode\u003ecommands/call\u003c/code\u003e + \u003ccode\u003eshutdown\u003c/code\u003e；语言无关，agent 可用 Python/JS/Rust 写插件。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e生命周期在 turn 边界\u003c/strong\u003e：\u003ccode\u003eDISCOVERED → VALIDATED → MOUNTED → RUNNING → STOPPING → STOPPED/FAILED\u003c/code\u003e；工具 schema 来自 manifest，进程可懒启动；注册项带 generation，可逆回收；超时/取消 kill 进程组。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e能力边界\u003c/strong\u003e：插件默认无凭证、无网络、只能通过宿主能力访问文件/网络/子进程；manifest 声明 capabilities；高风险能力需要显式授权。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eWASM 是第二 tier\u003c/strong\u003e：只用于纯计算/不可信 transform（parser、linter、policy predicate、codec）；AOT 缓存、fuel/memory 限制；不要求所有插件 WASM。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e事件 provenance\u003c/strong\u003e：父 session 追加 \u003ccode\u003eextension_mount\u003c/code\u003e / \u003ccode\u003eextension_unmount\u003c/code\u003e / \u003ccode\u003eextension_error\u003c/code\u003e，包含 id/version/digest/capabilities；子 session 记录自己的 tool calls；resume 对比 digest。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e不做\u003c/strong\u003e：plugin-owned event schema、plugin-owned durable state、plugin loop、plugin UI 直接操作终端、递归 subagent 插件。\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003eImplementation note\u003c/h2\u003e\n\u003cp\u003eM4-002 v1 先落本地可信 sidecar：manifest、initialize、tools/call、shutdown、timeout、env scrub 和 mount events。worker pool、bwrap 网络/能力隔离、subagent 共享 host 统一放 M4-007，避免把未实现的能力写成已完成。\u003c/p\u003e\n\u003ch2\u003e后果\u003c/h2\u003e\n\u003ch3\u003e正向\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e扩展能力（内部 API、数据库、MCP、搜索、部署）不必进内核。\u003c/li\u003e\n\u003cli\u003e插件崩溃/超时不会带走父 session；凭证不进入插件进程。\u003c/li\u003e\n\u003cli\u003e内置工具无需插件即可工作；subagent 高并发不复制插件进程。\u003c/li\u003e\n\u003cli\u003e事件日志仍是唯一持久真相；插件只产生 tool result/audit。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e负向\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eIPC、manifest、supervisor、capability broker 都是新代码。\u003c/li\u003e\n\u003cli\u003e插件进程有内存/启动开销；需要 lazy start、worker pool、idle timeout。\u003c/li\u003e\n\u003cli\u003e外部 mutating tool 没有内置 write/edit 的 diff 审批；必须按 capability/effect 分级。\u003c/li\u003e\n\u003cli\u003e插件工具描述会占用 prompt；需要 allowlist 和数量上限。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e备选方案\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003ePi 式同进程 TS\u003c/strong\u003e：DX 最好，但 Rust 内核无法安全卸载，插件可触达凭证和进程内存。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCordis/DSH 式 everything-plugin\u003c/strong\u003e：生命周期最强，但 100+ 包、配置/事件契约和平台复杂度不适合当前体量。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eWASM-first\u003c/strong\u003e：隔离强，但 OS/网络/子进程能力弱，agent 写 Rust/WASM 迭代慢。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e每 subagent 一套插件\u003c/strong\u003e：进程数 S×P，直接拒绝。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eRevisit 条件\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e需要插件在 turn 内动态注册/注销，或需要 loop/context 级 hook。\u003c/li\u003e\n\u003cli\u003e外部 mutating tool 成为主流需求，需要统一 side-effect 审批/回滚。\u003c/li\u003e\n\u003cli\u003e插件数量/并发超过进程模型承受范围，引入 worker pool 调度或 WASM compute tier。\u003c/li\u003e\n\u003cli\u003e需要远程 sandbox（E2B/AgentENV 式）时，ExtensionHost 增加 proxy 模式。\u003c/li\u003e\n\u003c/ol\u003e\n","path":"docs/adr/0013-extension-host.md","excerpt":"内置工具、loop、context、policy、auth、session 留在内核；external tools/commands 走 session 级 sidecar host；WASM 只做纯计算 tier。"},{"id":"adr-0014","title":"ADR-0014：Profile、Plan mode 与 Goal 的目标分离","kind":"adr","status":"accepted","order":41,"summary":"用户只看 profile（ask/review/full-access/ci）；plan 是运行时 mode；goal 是会话目标标签；access/approval/reviewer/risk 留在实现层。","body_html":"\u003ch2\u003e状态\u003c/h2\u003e\n\u003cp\u003eAccepted · 2026-10-20\u003c/p\u003e\n\u003ch2\u003e背景\u003c/h2\u003e\n\u003cp\u003e把 access、approval、reviewer、risk 四个轴直接暴露给用户会产生 3×4 种组合，难以理解；而 Codex/Claude Code/Gemini CLI 都用 mode/profile 包装底层策略。plan 是工作流状态，不是权限档位；goal 是目标，不是权限。\u003c/p\u003e\n\u003ch2\u003e决策\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e用户只选 profile\u003c/strong\u003e：\u003ccode\u003e:ask\u003c/code\u003e（workspace + 人工审批，默认）、\u003ccode\u003e:review\u003c/code\u003e（workspace + auto-review）、\u003ccode\u003e:full-access\u003c/code\u003e（无沙箱，显式开启）、\u003ccode\u003e:ci\u003c/code\u003e（workspace + never）。\u003cstrong\u003e没有 \u003ccode\u003e:plan\u003c/code\u003e。\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eprofile 是 preset\u003c/strong\u003e：底层仍是 access + approval + reviewer + risk；高级用户可以 \u003ccode\u003e--access\u003c/code\u003e / \u003ccode\u003e--approval\u003c/code\u003e / \u003ccode\u003e--reviewer\u003c/code\u003e 覆盖，TUI \u003ccode\u003e/permissions\u003c/code\u003e 显示 effective policy。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\u003ccode\u003e/plan\u003c/code\u003e 是运行时 mode\u003c/strong\u003e：进入后 \u003ccode\u003eeffective_access = min(base_access, read-only)\u003c/code\u003e，写/命令/联网被阻止或询问；生成 plan artifact；\u003ccode\u003e/plan off\u003c/code\u003e 或 \u003ccode\u003e/plan approve\u003c/code\u003e 退出并恢复 base profile。plan 只收紧，不放宽。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\u003ccode\u003e/goal\u003c/code\u003e 是目标标签\u003c/strong\u003e：一个 session 一个 active goal；写入 \u003ccode\u003egoal_set\u003c/code\u003e / \u003ccode\u003egoal_cleared\u003c/code\u003e 事件；进入 context；resume 恢复；不改变权限。\u003ccode\u003e/goal run\u003c/code\u003e evaluator loop 是 backlog。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003esubagent capability profiles\u003c/strong\u003e：Explore = read-only + 只读插件 allowlist；Worker = workspace + write/edit/bash + 只读插件 allowlist；两者都不默认 full-access。C（full inheritance）是 backlog。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eW1 写入隔离\u003c/strong\u003e：Worker 与主 session 共享 workspace；全局写锁串行；write/edit 有 path scope；bash 串行。worktree 是 backlog。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003erisk 是工具元数据\u003c/strong\u003e：\u003ccode\u003elow/medium/high/unknown\u003c/code\u003e，用于 auto-review 和 subagent 授权；用户不直接配置。高风险默认只在主 session/人工确认；unknown 按高风险处理。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eauto-review 是 profile 行为\u003c/strong\u003e：\u003ccode\u003e:review\u003c/code\u003e 使用独立 reviewer，无工具权限，只能 allow/deny/escalate；不能改 access mode；高风险/unknown 升级给人。\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003eImplementation note\u003c/h2\u003e\n\u003cp\u003eM4-005 调整了 \u003ccode\u003e/goal\u003c/code\u003e 的 TUI 交互：\u003ccode\u003e/goal \u0026lt;condition\u0026gt;\u003c/code\u003e 现在设置目标并\u003cstrong\u003e立即启动\u003c/strong\u003e goal run（最多 6 轮），\u003ccode\u003e/goal run\u003c/code\u003e 用于重新启动已有目标。目标仍然是事件日志里的标签，goal run 不改变 permission profile；headless \u003ccode\u003eexec --goal\u003c/code\u003e 仍在 M4-008。这里更新的是交互默认值，不是权限模型。\u003c/p\u003e\n\u003ch2\u003e后果\u003c/h2\u003e\n\u003ch3\u003e正向\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e用户只需要理解 4 个 profile 和 2 个命令（\u003ccode\u003e/plan\u003c/code\u003e、\u003ccode\u003e/goal\u003c/code\u003e）。\u003c/li\u003e\n\u003cli\u003eplan 不会和权限 profile 混在一起；goal 不会改变权限。\u003c/li\u003e\n\u003cli\u003e高级用户仍有完整表达力；审计事件记录 effective policy。\u003c/li\u003e\n\u003cli\u003esubagent 能查只读插件、能写代码，但默认不接触 full-access/destructive 外部操作。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e负向\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eprofile 隐藏了底层组合，出错时需要 \u003ccode\u003e/permissions\u003c/code\u003e 解释。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e/plan\u003c/code\u003e 是模式，不是安全边界本身；必须配合 allowed_tools/sandbox 才可靠。\u003c/li\u003e\n\u003cli\u003eauto-review 有 reviewer 被 prompt injection 影响的风险；需要独立 context、无工具、日志和升级规则。\u003c/li\u003e\n\u003cli\u003eC/\u003ccode\u003e/goal run\u003c/code\u003e/worktree 都留了 backlog，短期能力有限。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e备选方案\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e两轴直接暴露\u003c/strong\u003e：表达力强，但用户认知成本高。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e只用一个 risk 档位\u003c/strong\u003e：无法表达 read-only/workspace/full-access 的能力差异。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\u003ccode\u003e:plan\u003c/code\u003e 作为 profile\u003c/strong\u003e：和 \u003ccode\u003e/plan\u003c/code\u003e mode 重复，且 plan 结束要恢复原 profile，不适合做静态档位。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\u003ccode\u003e/goal\u003c/code\u003e 立即自动循环\u003c/strong\u003e：容易意外烧 token；先做标签，loop 单独开关。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eRevisit 条件\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ccode\u003e/goal run\u003c/code\u003e 需要 evaluator 模型、预算、暂停/恢复和 no-progress 检测。\u003c/li\u003e\n\u003cli\u003eWorker 并行写需求增加，引入 worktree 或 overlay。\u003c/li\u003e\n\u003cli\u003eProfile 数量继续增长，需要用户自定义 profile 文件。\u003c/li\u003e\n\u003cli\u003eauto-review 的误判/注入风险需要更强隔离或 human-only 高风险策略。\u003c/li\u003e\n\u003c/ol\u003e\n","path":"docs/adr/0014-profiles-plan-goal.md","excerpt":"用户只看 profile（ask/review/full-access/ci）；plan 是运行时 mode；goal 是会话目标标签；access/approval/reviewer/risk 留在实现层。"},{"id":"adr-0015","title":"ADR-0015：运行时 model 与 permission 选择","kind":"adr","status":"accepted","order":42,"summary":"/model 是当前 provider 内的运行时模型选择；/permissions 映射 ask/review/full-access/ci 到既有 sandbox/network/approval；两者事件化、下一 turn 生效。","body_html":"\u003ch1\u003eADR-0015: Runtime model and permission selection\u003c/h1\u003e\n\u003cul\u003e\n\u003cli\u003eStatus: accepted\u003c/li\u003e\n\u003cli\u003eDate: 2026-10-20\u003c/li\u003e\n\u003cli\u003eSupersedes: none\u003c/li\u003e\n\u003cli\u003eRelated: ADR-0006 (sandbox), ADR-0014 (profiles/plan/goal)\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eContext\u003c/h2\u003e\n\u003cp\u003eInteractive sessions are long-lived. Restarting the TUI to try another model\nloses conversation state, and users need to see/change the effective sandbox\nwithout editing CLI flags. Pi records a model selection separately from the\nmodel that actually handles each request, and resumes the selection from the\nsession. niucode needs a small version of that behavior without a full model\ncatalog or virtual routing.\u003c/p\u003e\n\u003ch2\u003eDecision\u003c/h2\u003e\n\u003ch3\u003eModel\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003e/model\u003c/code\u003e shows the effective model plus optional suggestions.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e/model \u0026lt;name\u0026gt;\u003c/code\u003e is a runtime override for subsequent turns. It is recorded as\na \u003ccode\u003emodel_change\u003c/code\u003e event and restored by \u003ccode\u003e/resume\u003c/code\u003e; \u003ccode\u003e/clear\u003c/code\u003e carries it forward,\n\u003ccode\u003e/reset\u003c/code\u003e drops it.\u003c/li\u003e\n\u003cli\u003eSwitches stay on the current provider preset. Cross-provider switching needs\na new process (\u003ccode\u003e--preset\u003c/code\u003e), because credentials/endpoints are bound at startup.\u003c/li\u003e\n\u003cli\u003eThe override is applied to \u003ccode\u003eCompletionRequest.model\u003c/code\u003e; the provider's endpoint\nand auth stay unchanged. Each \u003ccode\u003emodel_change\u003c/code\u003e is a turn boundary; switching\nmay miss the prompt cache.\u003c/li\u003e\n\u003cli\u003eSuggestions come from \u003ccode\u003eNIUCODE_MODEL_CHOICES\u003c/code\u003e or a small built-in list. This\nis deliberately not a model registry and has no virtual-model routing in v1.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003ePermissions\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ccode\u003e/permissions\u003c/code\u003e shows the current effective sandbox/network/approval and the\nfour named profiles.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ccode\u003e/permissions ask|review|full-access|ci\u003c/code\u003e records a \u003ccode\u003epermission_change\u003c/code\u003e event\nand applies the profile before the next turn.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eProfiles map to existing policy fields; they do not add a second enforcement\nlayer:\u003c/p\u003e\n\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eprofile\u003c/th\u003e\u003cth\u003esandbox\u003c/th\u003e\u003cth\u003enetwork\u003c/th\u003e\u003cth\u003eapproval\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\n\u003ctr\u003e\u003ctd\u003eask\u003c/td\u003e\u003ctd\u003eworkspace-write\u003c/td\u003e\u003ctd\u003eoff\u003c/td\u003e\u003ctd\u003eask\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003ereview\u003c/td\u003e\u003ctd\u003eworkspace-write\u003c/td\u003e\u003ctd\u003eoff\u003c/td\u003e\u003ctd\u003eon-failure\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003efull-access\u003c/td\u003e\u003ctd\u003efull-access\u003c/td\u003e\u003ctd\u003eon\u003c/td\u003e\u003ctd\u003enever\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eci\u003c/td\u003e\u003ctd\u003eread-only\u003c/td\u003e\u003ctd\u003eoff\u003c/td\u003e\u003ctd\u003enever\u003c/td\u003e\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ccode\u003e/plan\u003c/code\u003e remains a runtime mode and narrows the tool allowlist; it is not a\npermission profile. Profile changes take effect on the next turn, never\nmid-turn.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003efull-access prints an explicit warning because it disables sandbox/network\nisolation.\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eConsequences\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eModel and permission choices are event-sourced, resume correctly, and are\nvisible in \u003ccode\u003e/status\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eThe provider architecture does not gain a catalog/router abstraction.\u003c/li\u003e\n\u003cli\u003eA future model registry or virtual models can replace the suggestion list\nwithout changing the \u003ccode\u003emodel_change\u003c/code\u003e contract.\u003c/li\u003e\n\u003cli\u003eCross-provider switching, per-tool rules, and reviewer-backed \u003ccode\u003ereview\u003c/code\u003e remain\nbacklog.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eReferences\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003ePi interactive mode: \u003ca href=\"https://mintlify.wiki/pt-act/pi-mono/guides/interactive-mode\"\u003ehttps://mintlify.wiki/pt-act/pi-mono/guides/interactive-mode\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003ePi virtual models: \u003ca href=\"https://github.com/earendil-works/pi/blob/main/packages/coding-agent/docs/virtual-models.md\"\u003ehttps://github.com/earendil-works/pi/blob/main/packages/coding-agent/docs/virtual-models.md\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n","path":"docs/adr/0015-runtime-model-permissions.md","excerpt":"/model 是当前 provider 内的运行时模型选择；/permissions 映射 ask/review/full-access/ci 到既有 sandbox/network/approval；两者事件化、下一 turn 生效。"},{"id":"adr-0016","title":"ADR-0016：Provider 重试、无硬 turn 上限与手动 compact","kind":"adr","status":"accepted","order":43,"summary":"只在流尚未产生事件时重试 network/decode/retryable HTTP；上下文溢出强制 compact 后重试；默认 max-steps=0（256 安全上限）；/compact 手动压缩。","body_html":"\u003ch2\u003e状态\u003c/h2\u003e\n\u003cp\u003eAccepted · 2026-10-20\u003c/p\u003e\n\u003ch2\u003e背景\u003c/h2\u003e\n\u003cp\u003e一次 4 个 subagent 并行请求遇到 DeepSeek 的 \u003ccode\u003estream decode error\u003c/code\u003e 和 network\nerror。旧 loop 在 stream 首次错误时直接失败，且 \u003ccode\u003eDecode\u003c/code\u003e 被标记为不可重试；\n24 turn 的默认上限也会在长任务中途截断。上下文预算已有 75% 自动 compaction，\n但缺少手动入口和溢出后的恢复路径。\u003c/p\u003e\n\u003ch2\u003e决策\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e请求级重试只在安全点发生\u003c/strong\u003e：\u003ccode\u003eNetwork\u003c/code\u003e、\u003ccode\u003eDecode\u003c/code\u003e、retryable HTTP\n（408/425/429/5xx）最多重试 3 次，指数退避 + \u003ccode\u003eRetry-After\u003c/code\u003e 上限 10s。\n只有当本轮 stream 尚未发出任何 TextDelta/Reasoning/ToolCall/Usage 时才重试；\n已经输出后不重放，避免重复文本和工具调用。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e上下文溢出恢复\u003c/strong\u003e：provider 返回 \u003ccode\u003eContextOverflow\u003c/code\u003e 时，强制运行一次\ncompaction（不受 75% 阈值限制），成功则用新投影重试本轮；没有收缩则返回原错误。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e默认无硬 turn 上限\u003c/strong\u003e：\u003ccode\u003emax_steps=0\u003c/code\u003e 表示不设用户级上限，保留 256 的\n安全 turn cap；需要预算时显式 \u003ccode\u003e--max-steps N\u003c/code\u003e。终止仍由模型 final answer\n或用户取消决定。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\u003ccode\u003e/compact\u003c/code\u003e\u003c/strong\u003e：TUI 手动触发确定性 handoff；写入 compaction 事件，下一次\nprojection 生效。自动 compaction 仍在每 turn 前按 75% 触发。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003esubagent 共享同一重试策略\u003c/strong\u003e，因为重试在 agent loop 的 provider 调用处，\n不在 subagent 之外另写一套。\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e后果\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e4 个并发 subagent 的短暂网络/上游 SSE 抖动可以自愈；永久错误仍逐任务报告。\u003c/li\u003e\n\u003cli\u003e已输出流不会因为重试产生重复工具调用。\u003c/li\u003e\n\u003cli\u003e长任务不会因为 24 turn 被截断；上下文仍由预算 + compaction 控制。\u003c/li\u003e\n\u003cli\u003e无上限时 token 成本由用户取消/模型完成/256 安全 cap 控制，不提供 token 计费硬预算。\u003c/li\u003e\n\u003cli\u003e真实 SSE 中途断开仍会失败（无法安全恢复半条 assistant message）。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e备选方案\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e所有错误无限重试\u003c/strong\u003e：会在鉴权/参数错误上死循环，也会在已有输出后重复工具调用。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e保留 24 turn 上限\u003c/strong\u003e：与长任务冲突；用户需要显式预算而不是默认截断。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e每次 compaction 调模型总结\u003c/strong\u003e：更强但更贵、更慢；当前确定性 handoff 已足够。\u003c/li\u003e\n\u003c/ul\u003e\n","path":"docs/adr/0016-provider-resilience-compaction.md","excerpt":"只在流尚未产生事件时重试 network/decode/retryable HTTP；上下文溢出强制 compact 后重试；默认 max-steps=0（256 安全上限）；/compact 手动压缩。"},{"id":"adr-0017","title":"ADR-0017：Provider seam 与跨 provider model catalog","kind":"adr","status":"accepted","order":44,"summary":"provider/model 是 canonical 选择；catalog 代码内置；凭据惰性解析；model_change 原子记录 provider+model；context budget 由模型窗口派生。","body_html":"\u003ch2\u003e状态\u003c/h2\u003e\n\u003cp\u003eAccepted · 2026-10-20\u003c/p\u003e\n\u003ch2\u003e背景\u003c/h2\u003e\n\u003cp\u003eM4 的 \u003ccode\u003e/model\u003c/code\u003e 只能在启动 preset 内切换；跨 provider 需要重启。Pi 的 selection/dispatch 分离说明模型选择应该独立于一次请求；niucode 需要一个小而可测试的 seam，而不是完整 model router。\u003c/p\u003e\n\u003ch2\u003e决策\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003ecanonical \u003ccode\u003eprovider/model\u003c/code\u003e\u003c/strong\u003e：选择、CLI、事件统一这个形式；裸 model 只解析到当前 provider。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ecatalog 在 \u003ccode\u003eniucode-provider\u003c/code\u003e 内静态声明\u003c/strong\u003e：provider id、label、API key env、base URL、default model，以及 model 的 context window / max output / tools / reasoning。未知 model 回退 64k + unknown limits。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eprovider 切换惰性\u003c/strong\u003e：只有真正选择/构造 provider 时才解析凭据；catalog 本身不接触 keyring。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e原子事件\u003c/strong\u003e：\u003ccode\u003emodel_change { provider, model }\u003c/code\u003e；旧事件 provider 为空时按当前 config provider 解释。一次选择不会出现 provider/model 分裂。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003econtext budget 从 catalog 派生\u003c/strong\u003e：\u003ccode\u003e--context-budget 0\u003c/code\u003e（默认）= \u003ccode\u003ewindow - 15% reserve\u003c/code\u003e，显式值优先；TUI 切换模型时重新计算。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e范围\u003c/strong\u003e：M5-001 只做 provider seam；Tool/Loop seam 不混入完成定义。\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e后果\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003e/model\u003c/code\u003e 可跨 DeepSeek/OpenAI，无需重启；resume 可恢复选择。\u003c/li\u003e\n\u003cli\u003e静态 catalog 需要随新模型更新；未知模型可用但限制保守。\u003c/li\u003e\n\u003cli\u003e跨 provider 切换是 turn 边界；prompt cache 可能失效。\u003c/li\u003e\n\u003cli\u003e项目级自定义 endpoint、远程 catalog、pricing/vision 留给后续。\u003c/li\u003e\n\u003c/ul\u003e\n","path":"docs/adr/0017-provider-seam.md","excerpt":"provider/model 是 canonical 选择；catalog 代码内置；凭据惰性解析；model_change 原子记录 provider+model；context budget 由模型窗口派生。"},{"id":"adr-0018","title":"ADR-0018：全局 per-project 工作区，项目根零状态","kind":"adr","status":"accepted","order":45,"summary":"所有 niucode 状态在 ~/.niucode/projects/\u003ckey\u003e/；项目根不创建 .niucode；session 按项目分组；旧路径硬切不读；默认不自动回收。","body_html":"\u003ch2\u003e状态\u003c/h2\u003e\n\u003cp\u003eAccepted · 2026-10-20\u003c/p\u003e\n\u003ch2\u003e背景\u003c/h2\u003e\n\u003cp\u003e项目级 \u003ccode\u003e.niucode\u003c/code\u003e 会让每个仓库变脏，尤其 sessions/cache/proposals 这类运行时状态。Codex 式工作区更适合放在用户 home；项目根只保留 \u003ccode\u003eAGENTS.md\u003c/code\u003e 和用户自己创建的 \u003ccode\u003e.agents/skills\u003c/code\u003e。\u003c/p\u003e\n\u003ch2\u003e决策\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e全局根 \u003ccode\u003e~/.niucode/\u003c/code\u003e\u003c/strong\u003e；\u003ccode\u003eNIUCODE_HOME\u003c/code\u003e 可覆盖。\u003c/li\u003e\n\u003cli\u003e项目目录 \u003ccode\u003e~/.niucode/projects/\u0026lt;basename\u0026gt;-\u0026lt;fnv-hash\u0026gt;/\u003c/code\u003e，\u003ccode\u003eproject.toml\u003c/code\u003e 记录 canonical cwd / first_seen / last_seen。\u003c/li\u003e\n\u003cli\u003e项目根\u003cstrong\u003e不创建\u003c/strong\u003e \u003ccode\u003e.niucode\u003c/code\u003e；扩展、sessions、proposals、backups、cache、worktrees 都在全局项目目录。\u003c/li\u003e\n\u003cli\u003esession 默认只列当前项目；\u003ccode\u003e/resume --all\u003c/code\u003e 跨项目。标题从第一条 \u003ccode\u003euser_message\u003c/code\u003e 派生，回退 goal / session id。\u003c/li\u003e\n\u003cli\u003e默认\u003cstrong\u003e不自动删除\u003c/strong\u003e任何数据；\u003ccode\u003eniucode gc\u003c/code\u003e 默认 dry-run，\u003ccode\u003e--apply\u003c/code\u003e 只清派生数据，\u003ccode\u003e--prune-sessions --yes\u003c/code\u003e 才碰 session。\u003c/li\u003e\n\u003cli\u003e单条 ToolResult 上限 1 MiB（head/tail + marker），避免单次输出撑爆 session。\u003c/li\u003e\n\u003cli\u003e旧 \u003ccode\u003e~/.niucode/sessions/*.jsonl\u003c/code\u003e 与项目 \u003ccode\u003e.niucode/extensions\u003c/code\u003e \u003cstrong\u003e硬切不读\u003c/strong\u003e；不提供隐式迁移。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e~/.niucode/config.toml\u003c/code\u003e 只放非敏感默认值 provider/model/context；CLI 显式参数优先，凭据仍走 auth store。\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e后果\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e项目干净，session 天然按项目隔离。\u003c/li\u003e\n\u003cli\u003e项目移动会生成新 project-key；旧 session 仍可按路径显式 resume，但不自动聚合。\u003c/li\u003e\n\u003cli\u003e没有自动 GC；用户需要看 \u003ccode\u003eniucode gc\u003c/code\u003e 并显式清理。\u003c/li\u003e\n\u003cli\u003e团队无法通过 git 提交项目扩展；未来若要版本化，走显式导出而不是自动创建项目 \u003ccode\u003e.niucode\u003c/code\u003e。\u003c/li\u003e\n\u003c/ul\u003e\n","path":"docs/adr/0018-global-project-workspace.md","excerpt":"所有 niucode 状态在 ~/.niucode/projects/\u003ckey\u003e/；项目根不创建 .niucode；session 按项目分组；旧路径硬切不读；默认不自动回收。"},{"id":"adr-0019","title":"ADR-0019：inline ratatui 输入层，保留原生 transcript","kind":"adr","status":"accepted","order":46,"summary":"ratatui 只接管底部输入/picker/footer；不进入 alternate screen；鼠标捕获只在 picker；transcript 仍走终端 scrollback。","body_html":"\u003ch2\u003e状态\u003c/h2\u003e\n\u003cp\u003eAccepted · 2026-10-20\u003c/p\u003e\n\u003ch2\u003e背景\u003c/h2\u003e\n\u003cp\u003e线性 TUI 的排版由手写 crossterm 拼装，输入、菜单、状态分散在 3k 行里。全屏 ratatui 能解决排版，但会失去终端原生 scrollback、鼠标选择/复制；用户明确要求自然复制。\u003c/p\u003e\n\u003ch2\u003e决策\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e引入 ratatui，但只使用 \u003cstrong\u003einline viewport\u003c/strong\u003e，不切换 alternate screen。\u003c/li\u003e\n\u003cli\u003etranscript 仍是普通终端输出；ratatui 只负责底部 picker/help、input、footer。\u003c/li\u003e\n\u003cli\u003e鼠标捕获只在 picker 打开时开启；普通输入和 transcript 保留原生选择/复制。\u003c/li\u003e\n\u003cli\u003e不引入 tui-textarea/markdown 等第二套 UI 框架；输入/候选自己维护。\u003c/li\u003e\n\u003cli\u003e默认使用 inline；保留 linear 仅作为 cursor-position 不可用时的 capability fallback。\u003c/li\u003e\n\u003cli\u003e全屏 ratatui + copy mode 作为未来可选，不作为默认。\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e后果\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e排版/状态栏可以独立演进，transcript 的复制/scrollback 不回归。\u003c/li\u003e\n\u003cli\u003einline viewport 的高度、光标、picker 命中测试需要自己处理。\u003c/li\u003e\n\u003cli\u003elinear 仅保留为 fallback；产品默认是 inline。\u003c/li\u003e\n\u003c/ul\u003e\n","path":"docs/adr/0019-inline-ratatui.md","excerpt":"ratatui 只接管底部输入/picker/footer；不进入 alternate screen；鼠标捕获只在 picker；transcript 仍走终端 scrollback。"},{"id":"adr-0020","title":"ADR-0020：/init 隔离生成 + 显式 apply","kind":"adr","status":"accepted","order":47,"summary":"init 在独立只读 session 中扫描/生成；完整 proposal 写入事件；/init apply 才经 Toolbox 写 AGENTS.md，并备份到全局 project。","body_html":"\u003ch2\u003e状态\u003c/h2\u003e\n\u003cp\u003eAccepted · 2026-10-20\u003c/p\u003e\n\u003ch2\u003e背景\u003c/h2\u003e\n\u003cp\u003e静态模板无法生成项目特定的命令、架构和边界。让主 session 直接写 AGENTS.md 又会让生成过程污染对话、跳过审批/策略，并可能覆盖人工内容。\u003c/p\u003e\n\u003ch2\u003e决策\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ccode\u003e/init\u003c/code\u003e 在独立 session 中跑模型：\n\u003cul\u003e\n\u003cli\u003etools 仅 \u003ccode\u003eread/grep/glob\u003c/code\u003e；\u003c/li\u003e\n\u003cli\u003esandbox read-only，network off；\u003c/li\u003e\n\u003cli\u003e8 turns，120s timeout；\u003c/li\u003e\n\u003cli\u003e无 subagent、无 extension；\u003c/li\u003e\n\u003cli\u003e固定章节：Purpose / Commands / Architecture / Workflow / Guardrails / Current focus。\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e最终 assistant 消息就是完整文件；不做额外写工具。\u003c/li\u003e\n\u003cli\u003e完整 proposal 写入父 session 的 \u003ccode\u003einit_proposal { content, path }\u003c/code\u003e 事件；resume 可恢复。\u003c/li\u003e\n\u003cli\u003e首次只预览，必须 \u003ccode\u003e/init apply\u003c/code\u003e 才写；apply 走 Toolbox 的 read-before-write/sandbox policy。\u003c/li\u003e\n\u003cli\u003e覆盖已有 AGENTS.md 前备份到 \u003ccode\u003e~/.niucode/projects/\u0026lt;key\u0026gt;/backups/AGENTS-\u0026lt;ts\u0026gt;.md\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003eplan mode 只生成，不 apply；read-only sandbox 同样只能生成。\u003c/li\u003e\n\u003cli\u003e超过 100 行 / 6 KiB 只警告，不截断。\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e后果\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003egeneration 与 mutation 分离；proposal 可 review、重试、跨 resume。\u003c/li\u003e\n\u003cli\u003e模型不可用/输出缺章节时回退到确定性 scan 模板。\u003c/li\u003e\n\u003cli\u003eproposal 只保存在事件日志；项目根不出现 \u003ccode\u003e.proposed\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e现有 AGENTS.md 通过 prompt + fallback 合并，人工内容优先。\u003c/li\u003e\n\u003c/ul\u003e\n","path":"docs/adr/0020-init-proposal.md","excerpt":"init 在独立只读 session 中扫描/生成；完整 proposal 写入事件；/init apply 才经 Toolbox 写 AGENTS.md，并备份到全局 project。"},{"id":"adr-0021","title":"ADR-0021：默认紧凑 inline 区，reasoning 可见","kind":"adr","status":"accepted","order":48,"summary":"无 picker 时底部占 3 行；打开 picker 才扩到 6 行；reasoning 流以 dim 文本实时显示，不再只显示 thinking 标签。","body_html":"\u003ch2\u003e状态\u003c/h2\u003e\n\u003cp\u003eAccepted · 2026-10-20\u003c/p\u003e\n\u003ch2\u003e背景\u003c/h2\u003e\n\u003cp\u003einline v1 固定 8 行（4 help/picker + 3 input + footer），即使没有 picker 也长期占满底部；help 文案重复，输入区显得拥挤。reasoning 事件只打印一次 “thinking…”，用户看不到实际思考内容，主观上像被隐藏。\u003c/p\u003e\n\u003ch2\u003e决策\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e输入区高度动态：\n\u003cul\u003e\n\u003cli\u003e无 picker：3 行（2 行输入 + 1 行 footer）；\u003c/li\u003e\n\u003cli\u003e打开 picker：6 行（3 行候选 + 2 行输入 + footer）；\u003c/li\u003e\n\u003cli\u003e通过重建 inline viewport 实现，关闭 picker 后回到 3 行。\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e移除常驻 help 墙；slash/@ 提示收进 footer。\u003c/li\u003e\n\u003cli\u003ereasoning 以 \u003ccode\u003e◇ thinking\u003c/code\u003e 标签 + dim 流式文本显示；保留换行，不把 reasoning 拼成一行。\u003c/li\u003e\n\u003cli\u003eanswer/tool/compaction 开始时关闭 reasoning 行，避免串行。\u003c/li\u003e\n\u003cli\u003e不默认隐藏 reasoning；后续需要时再加 \u003ccode\u003e/reasoning\u003c/code\u003e 开关。\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e后果\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e默认 transcript 获得更多空间，底部不再长期拥挤。\u003c/li\u003e\n\u003cli\u003epicker 展开有一次性 viewport 重建，但不在 Drop 里做 cursor 跳转；tmux 抓屏验证提交前后无覆盖。\u003c/li\u003e\n\u003cli\u003ereasoning 会增加屏幕输出；长 reasoning 仍完整显示，暂不做折叠。\u003c/li\u003e\n\u003c/ul\u003e\n","path":"docs/adr/0021-tui-density-reasoning.md","excerpt":"无 picker 时底部占 3 行；打开 picker 才扩到 6 行；reasoning 流以 dim 文本实时显示，不再只显示 thinking 标签。"},{"id":"adr-0022","title":"ADR-0022：Ghostty 等终端先用 linear fallback","kind":"adr","status":"accepted","order":49,"summary":"inline ratatui 在 Ghostty 上仍有覆盖/坐标问题；Ghostty 默认回退 linear，inline 仅在显式 opt-in 或其他终端使用，直到有终端级回归测试。","body_html":"\u003ch2\u003e状态\u003c/h2\u003e\n\u003cp\u003eAccepted · 2026-10-20\u003c/p\u003e\n\u003ch2\u003e背景\u003c/h2\u003e\n\u003cp\u003einline viewport 依赖 cursor-position 查询和终端 clear 语义。tmux 抓屏验证后，Ghostty 1.3.1 仍出现输入区覆盖/错位；继续在默认路径上试布局会反复打断用户。\u003c/p\u003e\n\u003ch2\u003e决策\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eGhostty（\u003ccode\u003eTERM_PROGRAM=ghostty\u003c/code\u003e、\u003ccode\u003eTERM=*ghostty*\u003c/code\u003e 或 \u003ccode\u003eGHOSTTY_RESOURCES_DIR\u003c/code\u003e）默认使用稳定 linear editor。\u003c/li\u003e\n\u003cli\u003e其他终端继续 inline；\u003ccode\u003eNIUCODE_TUI_LINEAR=1\u003c/code\u003e 强制 linear。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eNIUCODE_TUI_INLINE=1\u003c/code\u003e 可强制 inline，用于复现/验证，不是默认承诺。\u003c/li\u003e\n\u003cli\u003e在 M5-006 完成 Ghostty 屏幕级回归测试前，不把 inline 重新设为 Ghostty 默认。\u003c/li\u003e\n\u003cli\u003ereasoning 可见性不受 fallback 影响：两种 editor 都显示 \u003ccode\u003e◇ thinking\u003c/code\u003e + dim 流式文本。\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e后果\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eGhostty 用户先得到无覆盖的稳定交互；代价是暂时没有 inline 紧凑布局。\u003c/li\u003e\n\u003cli\u003einline 代码保留但状态为 review，不作为完成承诺。\u003c/li\u003e\n\u003cli\u003e需要真实 Ghostty/tmux 抓屏测试，而不是只用 ANSI 解析器。\u003c/li\u003e\n\u003c/ul\u003e\n","path":"docs/adr/0022-ghostty-linear-fallback.md","excerpt":"inline ratatui 在 Ghostty 上仍有覆盖/坐标问题；Ghostty 默认回退 linear，inline 仅在显式 opt-in 或其他终端使用，直到有终端级回归测试。"},{"id":"adr-0023","title":"ADR-0023：headless goal loop 与稳定退出码","kind":"adr","status":"accepted","order":50,"summary":"exec --goal 复用 actor/evaluator；met=0、budget=2、impossible=3、cancel=130、evaluator/actor error=1；JSON 输出 goal_verdict/goal_done。","body_html":"\u003ch2\u003e状态\u003c/h2\u003e\n\u003cp\u003eAccepted · 2026-10-20\u003c/p\u003e\n\u003ch2\u003e背景\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003e/goal run\u003c/code\u003e 已在 TUI 可用，但 CI/脚本需要无 TUI 的同一 evaluator loop，并能从退出码判断结果。\u003c/p\u003e\n\u003ch2\u003e决策\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ccode\u003eexec --goal \u0026lt;condition\u0026gt; --max-goal-turns N\u003c/code\u003e：先跑 actor，再调用无工具 evaluator；\u003ccode\u003enot_met\u003c/code\u003e 且预算未耗尽时用投影 history 继续 actor。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e--max-goal-turns\u003c/code\u003e 计 actor 轮数，默认 6；0 非法。\u003c/li\u003e\n\u003cli\u003e退出码：\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003e0\u003c/code\u003e met\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e1\u003c/code\u003e actor/evaluator/基础设施错误\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e2\u003c/code\u003e budget exhausted\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e3\u003c/code\u003e impossible\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e130\u003c/code\u003e Ctrl-C cancelled\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eJSON（\u003ccode\u003e--json\u003c/code\u003e）逐行输出 \u003ccode\u003egoal_verdict {status,reason}\u003c/code\u003e；终止输出 \u003ccode\u003egoal_done {status:\"budget\"|\"impossible\"}\u003c/code\u003e 或普通 \u003ccode\u003edone\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003eGoalSet/GoalVerdict/GoalCleared 写入 session；replay/resume 可审计。\u003c/li\u003e\n\u003cli\u003eevaluator 仍是无工具、独立 context、30s timeout。\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e后果\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eCI 可直接用退出码分流，不需要解析 stdout。\u003c/li\u003e\n\u003cli\u003eactor 每轮从事件日志重新投影 history，避免维护第二份对话状态。\u003c/li\u003e\n\u003cli\u003e预算按 actor 轮数，不按 token；token 预算仍由 provider/context 控制。\u003c/li\u003e\n\u003c/ul\u003e\n","path":"docs/adr/0023-headless-goal.md","excerpt":"exec --goal 复用 actor/evaluator；met=0、budget=2、impossible=3、cancel=130、evaluator/actor error=1；JSON 输出 goal_verdict/goal_done。"},{"id":"adr-0024","title":"ADR-0024：Codex 兼容 SKILL.md 与 digest 信任","kind":"adr","status":"accepted","order":51,"summary":"skills 是声明式 prompt 扩展；~/.agents/skills 默认可信，项目 .agents/skills 需 canonical cwd+digest 绑定；$name 只注入激活块/路径，正文按需 read。","body_html":"\u003ch2\u003e状态\u003c/h2\u003e\n\u003cp\u003eAccepted · 2026-10-20\u003c/p\u003e\n\u003ch2\u003e决策\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e路径只认 \u003ccode\u003e~/.agents/skills\u003c/code\u003e 与项目 \u003ccode\u003e.agents/skills\u003c/code\u003e；不创建 \u003ccode\u003e.niucode/skills\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e每个 skill 是目录下的 \u003ccode\u003eSKILL.md\u003c/code\u003e（也接受单个 \u003ccode\u003e.md\u003c/code\u003e），frontmatter 只维护 \u003ccode\u003ename\u003c/code\u003e/\u003ccode\u003edescription\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e全局 skills 默认可信；项目 skills 默认禁用，\u003ccode\u003e/skills trust \u0026lt;name\u0026gt;\u003c/code\u003e 显式写入 digest 到全局 project 的 \u003ccode\u003eskills-trust.json\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e$name\u003c/code\u003e 激活时只把名称/描述/绝对路径加入 system prompt；正文由 agent 用 \u003ccode\u003eread\u003c/code\u003e 按需读取。\u003c/li\u003e\n\u003cli\u003e为支持全局 skill，Toolbox 增加只读 roots；write/edit 仍严格限制在 workspace。\u003c/li\u003e\n\u003cli\u003e不自动执行 skill 内的脚本；skills 不是代码插件。\u003c/li\u003e\n\u003cli\u003e项目 skill 信任写入在 M4-007 安全 gate 完成前保持 review。\u003c/li\u003e\n\u003c/ol\u003e\n","path":"docs/adr/0024-skills.md","excerpt":"skills 是声明式 prompt 扩展；~/.agents/skills 默认可信，项目 .agents/skills 需 canonical cwd+digest 绑定；$name 只注入激活块/路径，正文按需 read。"},{"id":"adr-0025","title":"ADR-0025：extension capability sandbox 与 worker pool","kind":"adr","status":"accepted","order":52,"summary":"sidecar 默认跑在 bwrap 内：无网络、workspace 只读、fs_write/network 必须显式 capability；每插件 1-8 个 worker，mount 记录 capabilities/digest。","body_html":"\u003ch2\u003e状态\u003c/h2\u003e\n\u003cp\u003eAccepted · 2026-10-20\u003c/p\u003e\n\u003ch2\u003e决策\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003emanifest 增加 \u003ccode\u003ecapabilities = [\"fs_read\"|\"fs_write\"|\"network\"|\"subprocess\"]\u003c/code\u003e，未知 capability 拒绝挂载。\u003c/li\u003e\n\u003cli\u003e默认 \u003ccode\u003enetwork off\u003c/code\u003e、workspace read-only；\u003ccode\u003efs_write\u003c/code\u003e 才 bind rw，\u003ccode\u003enetwork\u003c/code\u003e 才取消 \u003ccode\u003e--unshare-net\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003esidecar 一律经 bwrap：只 bind 系统目录与 workspace，\u003ccode\u003e/tmp\u003c/code\u003e tmpfs，\u003ccode\u003e/dev\u003c/code\u003e/\u003ccode\u003e/proc\u003c/code\u003e，env clear + minimal setenv。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eworkers\u003c/code\u003e 1-8；每个 worker 独立进程、独立初始化；host round-robin 调度，单 worker 串行。\u003c/li\u003e\n\u003cli\u003eMountInfo/event 记录 capabilities、digest、workers；主 session 打印审计信息。\u003c/li\u003e\n\u003cli\u003esubagent 共享同一个 ExtensionHost，不按 subagent 复制进程。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003esubprocess\u003c/code\u003e 目前是审计声明，bwrap PID namespace 不等价于禁止子进程；后续再收紧。\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e后果\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e扩展不再默认获得网络/写权限；缺失 bwrap 时挂载失败，不静默降级。\u003c/li\u003e\n\u003cli\u003eworker pool 提升并发，但每个 worker 有进程/内存成本。\u003c/li\u003e\n\u003cli\u003ebwrap 只 bind 系统目录，Python 等解释器可用；依赖特殊路径的插件需要显式扩展 bind 策略（后续）。\u003c/li\u003e\n\u003c/ul\u003e\n","path":"docs/adr/0025-extension-capability-sandbox.md","excerpt":"sidecar 默认跑在 bwrap 内：无网络、workspace 只读、fs_write/network 必须显式 capability；每插件 1-8 个 worker，mount 记录 capabilities/digest。"},{"id":"adr-0026","title":"ADR-0026：Worker 可选 git worktree 与 patch 回传","kind":"adr","status":"accepted","order":53,"summary":"Worker 可声明 worktree=true，在全局 worktrees 下建 detached git worktree；写互不干扰，结束后产出 patch；主 session 显式 `niucode worktree apply`，非 git 回退共享 W1。","body_html":"\u003ch2\u003e状态\u003c/h2\u003e\n\u003cp\u003eAccepted · 2026-10-20\u003c/p\u003e\n\u003ch2\u003e决策\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ccode\u003esubagent\u003c/code\u003e task 增加 \u003ccode\u003eworktree: bool\u003c/code\u003e，仅 Worker profile 可用。\u003c/li\u003e\n\u003cli\u003eworktree 根在全局 \u003ccode\u003e~/.niucode/projects/\u0026lt;key\u0026gt;/worktrees/\u003c/code\u003e；每个任务独立 detached worktree。\u003c/li\u003e\n\u003cli\u003eworktree 内 Worker 不共享主 workspace 的 W1 写锁，因为目录隔离；结束时 \u003ccode\u003egit add -N .\u003c/code\u003e + \u003ccode\u003egit diff --binary\u003c/code\u003e 生成 patch。\u003c/li\u003e\n\u003cli\u003e结果摘要首行给出 patch 路径；worktree 移除，patch 保留。\u003c/li\u003e\n\u003cli\u003e主 session 不自动改写工作区；用户 review 后显式 \u003ccode\u003eniucode worktree apply --patch \u0026lt;path\u0026gt;\u003c/code\u003e（可 \u003ccode\u003e--check\u003c/code\u003e）。\u003c/li\u003e\n\u003cli\u003e非 git / 无 HEAD / worktree 创建失败时回退到共享 workspace + W1 串行写，并打印 warning。\u003c/li\u003e\n\u003cli\u003e不做自动 merge/冲突解决；patch 是显式 review 边界。\u003c/li\u003e\n\u003c/ol\u003e\n","path":"docs/adr/0026-worker-worktrees.md","excerpt":"Worker 可声明 worktree=true，在全局 worktrees 下建 detached git worktree；写互不干扰，结束后产出 patch；主 session 显式 `niucode worktree apply`，非 git 回退共享 W1。"},{"id":"adr-0027","title":"ADR-0027：工具 risk/effect metadata 与 LoopPhase","kind":"adr","status":"accepted","order":54,"summary":"内置工具声明 low/medium/high risk 与 read/write/execute/delegate effect；unknown 按 high 处理；loop 以 LoopPhase 事件暴露 project/request/stream/tool/turn/done。","body_html":"\u003ch2\u003e状态\u003c/h2\u003e\n\u003cp\u003eAccepted · 2026-10-20\u003c/p\u003e\n\u003ch2\u003e决策\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ccode\u003eniucode-tools\u003c/code\u003e 提供静态 \u003ccode\u003eToolMetadata { risk, effect, read_only }\u003c/code\u003e；未知/外部工具由调用方按 unknown/high 处理。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e/tools\u003c/code\u003e 展示内置工具与已挂载 extension 的元数据，便于审计。\u003c/li\u003e\n\u003cli\u003eAgent loop 通过 \u003ccode\u003eAgentEvent::Phase(LoopPhase)\u003c/code\u003e 暴露 \u003ccode\u003eproject/request/stream/tool/turn/done\u003c/code\u003e；UI 可选择消费或忽略。\u003c/li\u003e\n\u003cli\u003emetadata 先作为观察/授权输入，不替换现有 sandbox/approval；后续 auto-review 和 subagent 授权可复用。\u003c/li\u003e\n\u003cli\u003eLoopPhase 不写入 session 事件日志，避免每 turn 噪声；它是 observer seam。\u003c/li\u003e\n\u003c/ol\u003e\n","path":"docs/adr/0027-tool-metadata-loop-phases.md","excerpt":"内置工具声明 low/medium/high risk 与 read/write/execute/delegate effect；unknown 按 high 处理；loop 以 LoopPhase 事件暴露 project/request/stream/tool/turn/done。"},{"id":"readme","title":"看板维护指南","kind":"guide","status":null,"order":90,"summary":"docs/ 的源文件、构建命令、architecture-first 视图与每次迭代的更新仪式。","body_html":"\u003ch2\u003e这是什么\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003edocs/index.html\u003c/code\u003e 是项目唯一的架构阅读面：Architecture / Work / Docs / Decisions 共享一个三栏壳。它由仓库里的源文件生成，离线可开，不依赖服务端。\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-sh\"\u003ecargo xtask dashboard          # 生成 docs/index.html + model.json + receipt.json\ncargo xtask dashboard --check  # CI：生成物过期、引用断开时失败\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e构建是确定性的：相同输入生成相同 HTML。\u003ccode\u003ereceipt.json\u003c/code\u003e 记录构建时间、git revision 和输入清单，但不参与过期判断，也不入库。\u003c/p\u003e\n\u003ch2\u003e四个视图\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eArchitecture（默认）\u003c/strong\u003e：按语义层排列模块，显示依赖关系、模块状态、contract、owned paths 和源码。选中模块会聚焦它的关系，弱化无关节点；不提供 zoom/pan。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eWork\u003c/strong\u003e：卡片和状态列，可按里程碑筛选。它是 agent 的 handoff 面，不是进度仪表盘；不显示完成率、进度条、WIP 数字或卡片计数。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDocs\u003c/strong\u003e：Markdown 文档索引，右栏阅读，支持 \u003ccode\u003e#/docs/adr-0001\u003c/code\u003e 深链。组件与学习路径见 \u003ccode\u003eroadmap.md\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDecisions\u003c/strong\u003e：ADR 卡片 + \u003ccode\u003ekind = \"decision\"\u003c/code\u003e 的决策日志。这里不放“某张卡完成”的流水账。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e进度信息仍然存在于 \u003ccode\u003edocs/board/\u003c/code\u003e 和 git 里；只是不再占据第一屏。\u003c/p\u003e\n\u003ch2\u003e源文件\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003edocs/\n  index.html                  # 生成物，提交，file:// 可开\n  dashboard/\n    project.json              # 项目、里程碑、层、模块、关系、决策事件\n    template.html             # 单文件壳\n    style.css                 # 三栏与四个视图的样式\n    app.js                    # 无框架渲染\n    model.json                # 生成物：解析后的完整模型\n    receipt.json              # 本地审计信息，gitignore，不入库\n  board/\n    M0-001-workspace.md       # 一张卡一个文件\n  adr/\n    0001-rust-core.md\n    0002-event-log.md\n    0003-architecture-first-dashboard.md\n    0004-session-runtime.md\n    0005-auth.md\n    0006-sandbox.md\n    0007-diff-preview.md\n    0008-compaction.md\n    0009-instructions-metrics.md\n    0010-event-ids-replay-fork.md\n    0011-subagents.md\n    0012-exec-json.md\n    0013-extension-host.md\n    0014-profiles-plan-goal.md\n  architecture.md\n  auth.md\n  exec.md\n  provider.md\n  roadmap.md\n  tui.md\n  README.md\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003e唯一真相\u003c/strong\u003e：\u003ccode\u003eproject.json\u003c/code\u003e + \u003ccode\u003eboard/*.md\u003c/code\u003e + 其余 Markdown。\u003ccode\u003eindex.html\u003c/code\u003e、\u003ccode\u003emodel.json\u003c/code\u003e、\u003ccode\u003ereceipt.json\u003c/code\u003e 永不手改。\u003c/p\u003e\n\u003ch2\u003e卡片格式\u003c/h2\u003e\n\u003cp\u003e卡片 frontmatter 用 TOML，正文是给详情栏读的 Markdown：\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-toml\"\u003e+++\nid = \"M0-005\"\ntitle = \"Provider trait 与流式适配\"\nstatus = \"ready\"          # backlog | ready | doing | review | done | blocked\nmilestone = \"M0\"\nmodule = \"providers\"      # 可省略；必须是 project.json 里的模块 id\nsize = \"L\"                # S | M | L\npriority = \"P0\"           # 可省略；P0 | P1 | P2\nupdated = \"2026-10-20\"\ncompleted = \"2026-10-20\"  # done 必填\ndepends_on = [\"M0-002\"]\ndocs = [\"architecture\"]   # 可选；必须是文档 id\nblocked_reason = \"\"       # blocked 必填\n+++\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e正文建议四段：\u003ccode\u003e## 范围\u003c/code\u003e、\u003ccode\u003e## 验收\u003c/code\u003e、\u003ccode\u003e## 记录\u003c/code\u003e，需要时加 \u003ccode\u003e## 开放问题\u003c/code\u003e。验收写成可执行的检查，不写“体验良好”。\u003c/p\u003e\n\u003ch2\u003e文档格式\u003c/h2\u003e\n\u003cp\u003e所有 \u003ccode\u003edocs/**/*.md\u003c/code\u003e（\u003ccode\u003eboard/\u003c/code\u003e 和 \u003ccode\u003edashboard/\u003c/code\u003e 除外）必须有 frontmatter：\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-toml\"\u003e+++\nid = \"adr-0003\"\ntitle = \"ADR-0003：...\"\nkind = \"adr\"              # adr | doc | guide\nstatus = \"accepted\"       # ADR 必填：proposed | accepted | superseded | rejected | draft\norder = 30\nsummary = \"一句话，显示在文档卡片上。\"\n+++\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e文档 id 用于深链：\u003ccode\u003e#/docs/adr-0001\u003c/code\u003e。卡片里的 \u003ccode\u003edocs\u003c/code\u003e 引用按 id 校验。\u003c/p\u003e\n\u003ch2\u003e架构模型\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003eproject.json\u003c/code\u003e 里手工维护，不从文件名推断：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003emilestones\u003c/code\u003e：M0–M3，状态 \u003ccode\u003eplanned | active | done\u003c/code\u003e，同一时间最多一个 active。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003elayers\u003c/code\u003e：语义分层，不是目录树。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003emodules\u003c/code\u003e：职责、公开契约、拥有的路径、备注。\u003ccode\u003eactive\u003c/code\u003e / \u003ccode\u003edone\u003c/code\u003e 至少有一个路径真实存在。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003erelations\u003c/code\u003e：\u003ccode\u003efrom\u003c/code\u003e / \u003ccode\u003eto\u003c/code\u003e / \u003ccode\u003elabel\u003c/code\u003e，两端必须是模块 id。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eevents\u003c/code\u003e：决策与里程碑事件；\u003ccode\u003erefs\u003c/code\u003e 可以指向卡片或文档 id。只有 \u003ccode\u003ekind = \"decision\"\u003c/code\u003e 会进入 Decisions 视图。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e更新仪式\u003c/h2\u003e\n\u003cp\u003e每次任务结束，按顺序做：\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e更新对应卡片的 \u003ccode\u003estatus\u003c/code\u003e、\u003ccode\u003eupdated\u003c/code\u003e、必要的 \u003ccode\u003ecompleted\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e有架构决策就加一篇 ADR，并在 \u003ccode\u003eproject.json\u003c/code\u003e 的 \u003ccode\u003eevents\u003c/code\u003e 里加一条 \u003ccode\u003edecision\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e如果模块边界、契约或路径变了，更新 \u003ccode\u003eproject.json\u003c/code\u003e 的 modules / relations。\u003c/li\u003e\n\u003cli\u003e跑 \u003ccode\u003ecargo fmt --all \u0026amp;\u0026amp; cargo test --workspace\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e跑 \u003ccode\u003ecargo xtask dashboard\u003c/code\u003e，把 \u003ccode\u003edocs/index.html\u003c/code\u003e 一起提交。\u003c/li\u003e\n\u003cli\u003e在 \u003ccode\u003eAGENTS.md\u003c/code\u003e 的 definition of done 里确认这一步没有被跳过。\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e状态必须反映现实：没有 \u003ccode\u003edoing\u003c/code\u003e 的卡就不要写 \u003ccode\u003edoing\u003c/code\u003e；\u003ccode\u003edone\u003c/code\u003e 必须有完成日期和可验证的验收项。\u003c/p\u003e\n\u003ch2\u003e校验规则\u003c/h2\u003e\n\u003cp\u003e构建时会失败的情况：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eschema version 不是 1；id 重复；里程碑 / 模块 / 文档引用不存在。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003edone\u003c/code\u003e 没有 \u003ccode\u003ecompleted\u003c/code\u003e；\u003ccode\u003eblocked\u003c/code\u003e 没有 \u003ccode\u003eblocked_reason\u003c/code\u003e；日期格式错误。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eactive\u003c/code\u003e / \u003ccode\u003edone\u003c/code\u003e 模块的路径一个都不存在。\u003c/li\u003e\n\u003cli\u003eADR 的 status 不在允许集合。\u003c/li\u003e\n\u003cli\u003e关系端点不是模块。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e--check\u003c/code\u003e 时生成物与源不一致。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e视觉约定\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e暖纸色底、墨色文字、一个深绿强调色；状态色只用于状态。\u003c/li\u003e\n\u003cli\u003e层色只用于模块导航、模块卡顶部细线和图例，不铺满背景。\u003c/li\u003e\n\u003cli\u003e架构图是主角；文档区控制阅读宽度，不做满屏卡片墙。\u003c/li\u003e\n\u003cli\u003e数字、ID、路径用等宽字体；正文用系统无衬线。\u003c/li\u003e\n\u003cli\u003e不引 CDN、不引外部字体，保证 \u003ccode\u003efile://\u003c/code\u003e 和离线环境一致。\u003c/li\u003e\n\u003cli\u003e动效只用于聚焦和状态切换，不做装饰性动画。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e不要擅自加的东西\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e前端框架、Vite/Node 构建链：会破坏单文件和确定性构建。需要时先写 ADR。\u003c/li\u003e\n\u003cli\u003e图表库、zoom/pan、拖拽编辑：模块少于 30 个时属于过度设计。\u003c/li\u003e\n\u003cli\u003e进度仪表盘、完成率、WIP 数字：进度属于 Work / git，不属于 Architecture 第一屏。\u003c/li\u003e\n\u003c/ul\u003e\n","path":"docs/README.md","excerpt":"docs/ 的源文件、构建命令、architecture-first 视图与每次迭代的更新仪式。"}],"events":[{"date":"2026-10-20","kind":"decision","title":"选择 Rust 作为核心语言","detail":"性能优先，且需要单二进制、低内存和原生沙箱。开发迭代的编译成本用 workspace 拆分和 fixture 测试抵消。","refs":["adr-0001"]},{"date":"2026-10-20","kind":"decision","title":"事件日志作为唯一真相","detail":"内存状态只是日志的 fold；resume、fork、replay 都从日志派生，压缩只改变投影。","refs":["adr-0002"]},{"date":"2026-10-20","kind":"milestone","title":"M0 开工：workspace、看板与会话日志","detail":"落地 cargo workspace、离线看板 v0、SessionLog 与 CLI 骨架。","refs":["M0-001","M0-002","M0-003","M0-004"]},{"date":"2026-10-20","kind":"decision","title":"Dashboard 以架构为第一屏","detail":"默认 Architecture，Work 降为二级；进度装饰移除，Decisions 只收决策。ADR-0003。","refs":["adr-0003"]},{"date":"2026-10-20","kind":"decision","title":"Interface 抽象会话，不抽象界面","detail":"SessionRuntime 以 Command/Event 为边界；CLI/TUI 进程内消费，Web 先做只读 viewer。ADR-0004。","refs":["adr-0004"]},{"date":"2026-10-20","kind":"decision","title":"Provider 先做 OpenAI-compatible Chat Completions","detail":"DeepSeek 与 OpenAI 共用一套 SSE 适配；先不引入多 provider 抽象，验证 loop 后再扩展。","refs":["M0-005","provider"]},{"date":"2026-10-20","kind":"decision","title":"凭证解析：env → keyring → 0600 file","detail":"不打印密钥；keyring 不可用时回退文件；不支持网页账号 cookie。","refs":["M0-011","auth","adr-0005"]},{"date":"2026-10-20","kind":"milestone","title":"最小 niucode exec 闭环打通","detail":"真实 DeepSeek 文本与 read tool call 验证通过；本地 mock 覆盖 text/tool 两条路径。","refs":["M0-012","exec"]},{"date":"2026-10-20","kind":"milestone","title":"六工具与 loop 加固完成","detail":"grep/glob、bash 进程组与超时、Ctrl-C 取消、fixture 修复测试都已落地。","refs":["M0-006","M0-007","M0-008"]},{"date":"2026-10-20","kind":"milestone","title":"M0 完成：可恢复、可回放的 exec 闭环","detail":"resume、record/replay fixture、golden transcript 与六工具加固都已落地。","refs":["M0-009","exec"]},{"date":"2026-10-20","kind":"decision","title":"Linux 沙箱首选 bwrap，landlock/seccomp 后置","detail":"三轴策略独立；bwrap 提供文件系统与网络隔离，缺少 bwrap 时显式降级到逐工具审批。","refs":["adr-0006","M1-002"]},{"d
