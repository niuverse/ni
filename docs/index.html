                        for old_index in op.old_range() {\n                            removed += 1;\n                            lines.push(PreviewLine {\n                                kind: LineKind::Remove,\n                                old_line: Some(old_index + 1),\n                                new_line: None,\n                                text: line_text(diff.old_slices()[old_index]),\n                            });\n                        }\n                        for new_index in op.new_range() {\n                            added += 1;\n                            lines.push(PreviewLine {\n                                kind: LineKind::Add,\n                                old_line: None,\n                                new_line: Some(new_index + 1),\n                                text: line_text(diff.new_slices()[new_index]),\n                            });\n                        }\n                    }\n                }\n            }\n\n            hunks.push(PreviewHunk {\n                old_start,\n                old_len,\n                new_start,\n                new_len,\n                lines,\n            });\n        }\n\n        Self {\n            path: path.into(),\n            is_new,\n            added,\n            removed,\n            hunks,\n        }\n    }\n}\n\n#[derive(Debug, Clone, PartialEq, Eq)]\npub enum PreviewBody {\n    Diff { files: Vec\u003cFilePreview\u003e },\n    Command { command: String },\n    Note { message: String },\n}\n\n#[derive(Debug, Clone, PartialEq, Eq)]\npub struct ChangePreview {\n    pub body: PreviewBody,\n    pub added: usize,\n    pub removed: usize,\n    /// A problem the client should show without hiding the diff.\n    pub warning: Option\u003cString\u003e,\n}\n\nimpl ChangePreview {\n    pub fn note(message: impl Into\u003cString\u003e) -\u003e Self {\n        Self {\n            body: PreviewBody::Note {\n                message: message.into(),\n            },\n            added: 0,\n            removed: 0,\n            warning: None,\n        }\n    }\n\n    pub fn command(command: impl Into\u003cString\u003e) -\u003e Self {\n        Self {\n            body: PreviewBody::Command {\n                command: command.into(),\n            },\n            added: 0,\n            removed: 0,\n            warning: None,\n        }\n    }\n\n    pub fn diff(files: Vec\u003cFilePreview\u003e) -\u003e Self {\n        let added = files.iter().map(|file| file.added).sum();\n        let removed = files.iter().map(|file| file.removed).sum();\n        Self {\n            body: PreviewBody::Diff { files },\n            added,\n            removed,\n            warning: None,\n        }\n    }\n\n    pub fn with_warning(mut self, warning: impl Into\u003cString\u003e) -\u003e Self {\n        self.warning = Some(warning.into());\n        self\n    }\n\n    pub fn is_diff(\u0026self) -\u003e bool {\n        matches!(\u0026self.body, PreviewBody::Diff { files } if !files.is_empty())\n","truncated":true}]},{"id":"sandbox","title":"Sandbox","layer":"adapters","status":"active","summary":"三轴策略：read-only / workspace-write / full-access，network on/off，approval ask/on-failure/never；Linux 用 bwrap。","contract":"SandboxPolicy 决定文件工具权限与 bash 包装；审批由 loop 在变更型工具前调用；每次运行写 policy/approval 事件。","paths":["crates/niucode-tools/src/lib.rs"],"notes":["bwrap 只读根 + cwd bind；network=off 用 network namespace。","无 bwrap 时 never 启动失败，on-failure/ask 降级到逐工具审批。","workspace-write 目前只允许写 cwd；cargo 缓存等 writable roots 后续补。"],"sources":[{"path":"crates/niucode-tools/src/lib.rs","language":"rust","text":"//! Workspace tools exposed to the model.\n//!\n//! The tool surface is deliberately small: `read`, `write`, `edit`, `grep`,\n//! `glob`, and `bash`. All file paths are resolved inside the working\n//! directory; `write`/`edit` require the file to have been observed by `read`\n//! first.\n\nuse std::collections::HashSet;\nuse std::fs;\nuse std::path::{Path, PathBuf};\nuse std::process::{Command as StdCommand, Stdio};\nuse std::sync::Mutex;\nuse std::time::{Duration, SystemTime, UNIX_EPOCH};\n\nuse anyhow::{bail, Context, Result};\nuse globset::GlobBuilder;\nuse ignore::WalkBuilder;\nuse niucode_provider::ToolSpec;\nuse regex::Regex;\nuse serde_json::{json, Value};\nuse similar::TextDiff;\nuse tokio::io::{AsyncRead, AsyncReadExt};\nuse tokio::process::Command;\nuse tokio::time::timeout;\n\nmod preview;\n\npub use preview::{\n    ChangePreview, FilePreview, LineKind, PreviewBody, PreviewHunk, PreviewLine,\n    PREVIEW_CONTEXT_LINES,\n};\n\nconst READ_MAX_LINES: usize = 2_000;\nconst READ_MAX_BYTES: usize = 50_000;\nconst BASH_MAX_BYTES: usize = 20_000;\nconst BASH_DEFAULT_TIMEOUT: u64 = 120;\nconst BASH_MAX_TIMEOUT: u64 = 600;\nconst BASH_CAPTURE_BYTES: usize = 8 * 1024 * 1024;\nconst SEARCH_MAX_RESULTS: usize = 200;\n\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum SandboxMode {\n    ReadOnly,\n    WorkspaceWrite,\n    FullAccess,\n}\n\nimpl SandboxMode {\n    pub fn as_str(self) -\u003e \u0026'static str {\n        match self {\n            Self::ReadOnly =\u003e \"read-only\",\n            Self::WorkspaceWrite =\u003e \"workspace-write\",\n            Self::FullAccess =\u003e \"full-access\",\n        }\n    }\n}\n\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum NetworkMode {\n    On,\n    Off,\n}\n\nimpl NetworkMode {\n    pub fn as_str(self) -\u003e \u0026'static str {\n        match self {\n            Self::On =\u003e \"on\",\n            Self::Off =\u003e \"off\",\n        }\n    }\n}\n\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub struct SandboxPolicy {\n    pub mode: SandboxMode,\n    pub network: NetworkMode,\n}\n\nimpl Default for SandboxPolicy {\n    fn default() -\u003e Self {\n        Self {\n            mode: SandboxMode::WorkspaceWrite,\n            network: NetworkMode::Off,\n        }\n    }\n}\n\nimpl SandboxPolicy {\n    pub fn new(mode: SandboxMode, network: NetworkMode) -\u003e Self {\n        Self { mode, network }\n    }\n\n    pub fn backend(self) -\u003e \u0026'static str {\n        if self.mode == SandboxMode::FullAccess \u0026\u0026 self.network == NetworkMode::On {\n            \"none\"\n        } else if sandbox_available() {\n            \"bwrap\"\n        } else {\n            \"unavailable\"\n        }\n    }\n}\n\npub fn sandbox_available() -\u003e bool {\n    StdCommand::new(\"bwrap\")\n        .arg(\"--version\")\n        .output()\n        .map(|output| output.status.success())\n        .unwrap_or(false)\n}\n\npub struct Toolbox {\n    cwd: PathBuf,\n    observed: Mutex\u003cHashSet\u003cPathBuf\u003e\u003e,\n    policy: SandboxPolicy,\n    allow_unsandboxed: bool,\n    read_roots: Vec\u003cPathBuf\u003e,\n}\n\nimpl Toolbox {\n    pub fn new(cwd: impl AsRef\u003cPath\u003e) -\u003e Result\u003cSelf\u003e {\n        Self::with_policy(cwd, SandboxPolicy::default())\n    }\n\n    pub fn with_policy(cwd: impl AsRef\u003cPath\u003e, policy: SandboxPolicy) -\u003e Result\u003cSelf\u003e {\n        Self::with_policy_and_fallback(cwd, policy, false)\n    }\n\n    pub fn with_policy_and_fallback(\n        cwd: impl AsRef\u003cPath\u003e,\n        policy: SandboxPolicy,\n        allow_unsandboxed: bool,\n    ) -\u003e Result\u003cSelf\u003e {\n        Self::with_policy_and_roots(cwd, policy, allow_unsandboxed, Vec::new())\n    }\n\n    pub fn with_policy_and_roots(\n        cwd: impl AsRef\u003cPath\u003e,\n        policy: SandboxPolicy,\n        allow_unsandboxed: bool,\n        read_roots: Vec\u003cPathBuf\u003e,\n    ) -\u003e Result\u003cSelf\u003e {\n        let cwd = cwd.as_ref().canonicalize().with_context(|| {\n            format!(\"canonicalize working directory {}\", cwd.as_ref().display())\n        })?;\n        if !cwd.is_dir() {\n            bail!(\"working directory is not a directory: {}\", cwd.display());\n        }\n\n        Ok(Self {\n            cwd,\n            observed: Mutex::new(HashSet::new()),\n            policy,\n            allow_unsandboxed,\n            read_roots,\n        })\n    }\n\n    pub fn cwd(\u0026self) -\u003e \u0026Path {\n        \u0026self.cwd\n    }\n\n    pub fn policy(\u0026self) -\u003e SandboxPolicy {\n        self.policy\n    }\n\n    pub fn allows_unsandboxed(\u0026self) -\u003e bool {\n        self.allow_unsandboxed\n    }\n\n    pub fn specs() -\u003e Vec\u003cToolSpec\u003e {\n        vec![\n            ToolSpec::function(\n                \"read\",\n                \"Read a UTF-8 text file inside the workspace. Returns line numbers. Read a file before editing or overwriting it.\",\n                json!({\n                    \"type\": \"object\",\n                    \"properties\": {\n                        \"path\": {\"type\": \"string\", \"description\": \"Workspace-relative path\"},\n                        \"offset\": {\"type\": \"integer\", \"description\": \"1-based first line to return\", \"minimum\": 1},\n                        \"limit\": {\"type\": \"integer\", \"description\": \"Maximum lines to return\", \"minimum\": 1, \"maximum\": READ_MAX_LINES}\n                    },\n                    \"required\": [\"path\"]\n                }),\n            ),\n            ToolSpec::function(\n                \"write\",\n                \"Create or fully overwrite a text file inside the workspace. Reading an existing file first is required.\",\n                json!({\n                    \"type\": \"object\",\n                    \"properties\": {\n                        \"path\": {\"type\": \"string\"},\n                        \"content\": {\"type\": \"string\"}\n                    },\n                    \"required\": [\"path\", \"content\"]\n                }),\n            ),\n            ToolSpec::function(\n                \"edit\",\n                \"Replace one exact, unique string in a file after reading it. Fails if the old string is missing or appears more than once.\",\n","truncated":true}]},{"id":"session","title":"Session Log","layer":"state","status":"active","summary":"append-only JSONL 事件日志，稳定事件序号、resume、replay 与 fork 的基础；记录 policy、approval、instructions、compaction、fork 等审计事件。","contract":"SessionLog::append 只追加；load 容忍坏尾行并报告 warning；事件 ID 是解码事件序号；日志是唯一真相。","paths":["crates/niucode-core/src/session.rs","crates/niucode-core/src/event.rs"],"notes":["每条事件立即 flush，进程崩溃最多丢最后一行。","内存状态是日志的 fold，不维护第二份真相。","事件 ID 是解码事件序号，不写入事件内容。"],"sources":[{"path":"crates/niucode-core/src/session.rs","language":"rust","text":"//! Append-only JSONL session storage.\n//!\n//! A session is a file of one JSON event per line. Appends are flushed\n//! immediately; loading tolerates a corrupt tail instead of discarding the\n//! whole session.\n\nuse std::fs::{self, File, OpenOptions};\nuse std::io::{BufRead, BufReader, BufWriter, Write};\nuse std::path::{Path, PathBuf};\nuse std::sync::atomic::{AtomicU64, Ordering};\n\nuse anyhow::{Context, Result};\n\nuse crate::event::{now_ms, Event};\n\nstatic SESSION_SEQ: AtomicU64 = AtomicU64::new(0);\n\n#[derive(Debug)]\npub struct LoadedSession {\n    pub events: Vec\u003cEvent\u003e,\n    /// Lines that could not be decoded. The rest of the session is still valid.\n    pub warnings: Vec\u003cString\u003e,\n}\n\n#[derive(Debug)]\npub struct SessionLog {\n    id: String,\n    path: PathBuf,\n    writer: BufWriter\u003cFile\u003e,\n}\n\nimpl SessionLog {\n    /// Create a new session file under `dir`.\n    pub fn create(dir: \u0026Path) -\u003e Result\u003cSelf\u003e {\n        fs::create_dir_all(dir)\n            .with_context(|| format!(\"create session directory {}\", dir.display()))?;\n\n        let seq = SESSION_SEQ.fetch_add(1, Ordering::Relaxed);\n        let id = format!(\"{}-{}-{}\", now_ms(), std::process::id(), seq);\n        let path = dir.join(format!(\"{id}.jsonl\"));\n        let file = OpenOptions::new()\n            .create_new(true)\n            .append(true)\n            .open(\u0026path)\n            .with_context(|| format!(\"create session file {}\", path.display()))?;\n\n        Ok(Self {\n            id,\n            path,\n            writer: BufWriter::new(file),\n        })\n    }\n\n    /// Open an existing session for appending.\n    pub fn open(path: impl AsRef\u003cPath\u003e) -\u003e Result\u003cSelf\u003e {\n        let path = path.as_ref().to_path_buf();\n        let file = OpenOptions::new()\n            .append(true)\n            .open(\u0026path)\n            .with_context(|| format!(\"open session for append {}\", path.display()))?;\n        let id = path\n            .file_stem()\n            .and_then(|stem| stem.to_str())\n            .unwrap_or(\"session\")\n            .to_string();\n\n        Ok(Self {\n            id,\n            path,\n            writer: BufWriter::new(file),\n        })\n    }\n\n    pub fn id(\u0026self) -\u003e \u0026str {\n        \u0026self.id\n    }\n\n    pub fn path(\u0026self) -\u003e \u0026Path {\n        \u0026self.path\n    }\n\n    /// Append one event and flush it to disk.\n    pub fn append(\u0026mut self, event: \u0026Event) -\u003e Result\u003c()\u003e {\n        serde_json::to_writer(\u0026mut self.writer, event).context(\"serialize session event\")?;\n        self.writer\n            .write_all(b\"\\n\")\n            .context(\"write session event\")?;\n        self.writer.flush().context(\"flush session event\")?;\n        Ok(())\n    }\n}\n\n/// Read a session, reporting undecodable lines as warnings.\npub fn load(path: \u0026Path) -\u003e Result\u003cLoadedSession\u003e {\n    let file = File::open(path).with_context(|| format!(\"open session file {}\", path.display()))?;\n    let reader = BufReader::new(file);\n\n    let mut events = Vec::new();\n    let mut warnings = Vec::new();\n\n    for (index, line) in reader.lines().enumerate() {\n        let line = line.with_context(|| format!(\"read line {}\", index + 1))?;\n        if line.trim().is_empty() {\n            continue;\n        }\n        match serde_json::from_str::\u003cEvent\u003e(\u0026line) {\n            Ok(event) =\u003e events.push(event),\n            Err(error) =\u003e warnings.push(format!(\"line {}: {error}\", index + 1)),\n        }\n    }\n\n    Ok(LoadedSession { events, warnings })\n}\n\n/// List session files in `dir`, sorted by name.\npub fn list(dir: \u0026Path) -\u003e Result\u003cVec\u003cPathBuf\u003e\u003e {\n    if !dir.is_dir() {\n        return Ok(Vec::new());\n    }\n\n    let mut paths = Vec::new();\n    for entry in\n        fs::read_dir(dir).with_context(|| format!(\"read session directory {}\", dir.display()))?\n    {\n        let entry = entry?;\n        let path = entry.path();\n        if path.extension().is_some_and(|ext| ext == \"jsonl\") {\n            paths.push(path);\n        }\n    }\n    paths.sort();\n    Ok(paths)\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use crate::event::{Event, ToolCall, Usage};\n\n    fn temp_dir(tag: \u0026str) -\u003e PathBuf {\n        static COUNTER: AtomicU64 = AtomicU64::new(0);\n        let n = COUNTER.fetch_add(1, Ordering::Relaxed);\n        let dir = std::env::temp_dir().join(format!(\"niucode-core-{tag}-{}-{n}\", now_ms()));\n        let _ = fs::remove_dir_all(\u0026dir);\n        fs::create_dir_all(\u0026dir).expect(\"create temp dir\");\n        dir\n    }\n\n    #[test]\n    fn round_trip_preserves_events() {\n        let dir = temp_dir(\"roundtrip\");\n        let mut log = SessionLog::create(\u0026dir).expect(\"create log\");\n        let ts = now_ms();\n\n        let events = vec![\n            Event::SessionStart {\n                id: log.id().to_string(),\n                cwd: \"/tmp/project\".into(),\n                model: \"test-model\".into(),\n                provider: \"deepseek\".into(),\n                ts,\n            },\n            Event::UserMessage {\n                text: \"fix the failing test\".into(),\n                ts,\n            },\n            Event::AssistantMessage {\n                text: \"reading the test\".into(),\n                reasoning: Some(\"need the failure output first\".into()),\n                tool_calls: vec![ToolCall {\n                    id: \"call-1\".into(),\n                    name: \"read\".into(),\n                    input: serde_json::json!({\"path\": \"src/lib.rs\"}),\n                }],\n                ts,\n            },\n            Event::ToolResult {\n                call_id: \"call-1\".into(),\n                ok: true,\n                output: \"fn main() {}\".into(),\n                ts,\n            },\n            Event::TurnEnd {\n                usage: Usage {\n                    input_tokens: 120,\n                    output_tokens: 30,\n                    cached_tokens: 80,\n                    reasoning_tokens: 10,\n                },\n                ts,\n            },\n        ];\n\n        for event in \u0026events {\n            log.append(event).expect(\"append\");\n        }\n\n        let loaded = load(log.path()).expect(\"load\");\n        assert_eq!(loaded.events, events);\n        assert!(loaded.warnings.is_empty());\n","truncated":true},{"path":"crates/niucode-core/src/event.rs","language":"rust","text":"//! Durable session events.\n//!\n//! Events are the only representation of a session that survives the process.\n//! The in-memory conversation is a projection of these events; if something is\n//! not appended here, it does not exist after the process exits.\n\nuse std::fmt;\nuse std::time::{SystemTime, UNIX_EPOCH};\n\nuse serde::{Deserialize, Serialize};\n\n/// Milliseconds since the Unix epoch.\npub type Timestamp = u64;\n\n/// Stable, positional event identifier.\n///\n/// The log is append-only, so the ordinal of a decoded event never changes.\n/// Corrupt lines are skipped by `load`, and ordinals count decoded events.\n#[derive(Debug, Clone, Copy, PartialEq, Eq, PartialOrd, Ord, Hash, Serialize, Deserialize)]\n#[serde(transparent)]\npub struct EventId(u64);\n\nimpl EventId {\n    pub fn from_index(index: usize) -\u003e Self {\n        Self(index as u64 + 1)\n    }\n\n    /// Zero-based index into the decoded event list.\n    pub fn index(self) -\u003e usize {\n        self.0.saturating_sub(1) as usize\n    }\n\n    pub fn parse(input: \u0026str) -\u003e Result\u003cSelf, String\u003e {\n        let input = input.trim();\n        if input.is_empty() {\n            return Err(\"event id is empty; use e000012\".to_string());\n        }\n        let digits = input\n            .strip_prefix('e')\n            .or_else(|| input.strip_prefix('E'))\n            .unwrap_or(input);\n        if digits.is_empty() || !digits.chars().all(|character| character.is_ascii_digit()) {\n            return Err(format!(\"invalid event id {input:?}; use e000012\"));\n        }\n        let value: u64 = digits\n            .parse()\n            .map_err(|_| format!(\"event id {input:?} is out of range\"))?;\n        if value == 0 {\n            return Err(\"event ids are 1-based; e000000 is invalid\".to_string());\n        }\n        Ok(Self(value))\n    }\n}\n\nimpl fmt::Display for EventId {\n    fn fmt(\u0026self, formatter: \u0026mut fmt::Formatter\u003c'_\u003e) -\u003e fmt::Result {\n        write!(formatter, \"e{:06}\", self.0)\n    }\n}\n\n#[derive(Debug, Clone, PartialEq, Serialize, Deserialize)]\npub struct ToolCall {\n    pub id: String,\n    pub name: String,\n    #[serde(default)]\n    pub input: serde_json::Value,\n}\n\n#[derive(Debug, Clone, Default, PartialEq, Serialize, Deserialize)]\npub struct Usage {\n    #[serde(default)]\n    pub input_tokens: u64,\n    #[serde(default)]\n    pub output_tokens: u64,\n    #[serde(default)]\n    pub cached_tokens: u64,\n    #[serde(default)]\n    pub reasoning_tokens: u64,\n}\n\nimpl Usage {\n    /// Cached input tokens as a percentage of all input tokens.\n    pub fn cache_hit_percent(\u0026self) -\u003e u64 {\n        self.cached_tokens\n            .saturating_mul(100)\n            .checked_div(self.input_tokens)\n            .unwrap_or(0)\n    }\n}\n\n#[derive(Debug, Clone, PartialEq, Serialize, Deserialize)]\n#[serde(tag = \"type\", rename_all = \"snake_case\")]\npub enum Event {\n    SessionStart {\n        id: String,\n        cwd: String,\n        model: String,\n        #[serde(default)]\n        provider: String,\n        ts: Timestamp,\n    },\n    UserMessage {\n        text: String,\n        ts: Timestamp,\n    },\n    AssistantMessage {\n        #[serde(default)]\n        text: String,\n        #[serde(default, skip_serializing_if = \"Option::is_none\")]\n        reasoning: Option\u003cString\u003e,\n        #[serde(default)]\n        tool_calls: Vec\u003cToolCall\u003e,\n        ts: Timestamp,\n    },\n    ToolResult {\n        call_id: String,\n        ok: bool,\n        output: String,\n        ts: Timestamp,\n    },\n    TurnEnd {\n        #[serde(default)]\n        usage: Usage,\n        ts: Timestamp,\n    },\n    Compaction {\n        summary: String,\n        /// Absolute event index replaced by this summary: `events[..upto]`.\n        ///\n        /// The compaction event itself is appended at the end of the log; the\n        /// projection inserts its summary at this cutoff.\n        upto: u64,\n        /// Approximate context size before compaction, in tokens.\n        #[serde(default)]\n        before_tokens: u64,\n        /// Approximate context size after compaction, in tokens.\n        #[serde(default)]\n        after_tokens: u64,\n        ts: Timestamp,\n    },\n    /// Effective sandbox/approval/network policy for this run.\n    Policy {\n        sandbox: String,\n        approval: String,\n        network: String,\n        backend: String,\n        ts: Timestamp,\n    },\n    /// Human approval decision for a mutating tool call.\n    Approval {\n        tool: String,\n        allowed: bool,\n        ts: Timestamp,\n    },\n    /// Provenance for a session created by `niucode fork`.\n    Fork {\n        parent: String,\n        parent_event: String,\n        ts: Timestamp,\n    },\n    /// A read-only subagent was spawned from this session.\n    SubagentSpawn {\n        id: String,\n        call_id: String,\n        task: String,\n        #[serde(default)]\n        profile: String,\n        session: String,\n        max_steps: u64,\n        timeout_secs: u64,\n        context_budget: u64,\n        ts: Timestamp,\n    },\n    /// A subagent finished, failed, or timed out.\n    SubagentResult {\n        id: String,\n        call_id: String,\n        ok: bool,\n        summary: String,\n        session: String,\n        turns: u64,\n        #[serde(default)]\n        usage: Usage,\n        ts: Timestamp,\n    },\n    /// Plan mode was enabled or disabled for the session.\n    PlanMode {\n        active: bool,\n        ts: Timestamp,\n    },\n    /// Active session goal / completion condition.\n    GoalSet {\n        text: String,\n        ts: Timestamp,\n    },\n    /// Active session goal was cleared.\n    GoalCleared {\n        ts: Timestamp,\n    },\n    /// Evaluator verdict for a /goal run turn.\n","truncated":true}]},{"id":"dashboard","title":"Dashboard","layer":"engineering","status":"active","summary":"离线单文件看板：niuverse 组织 logo/favicon、dark-first orbital console 视觉、架构/Work/Docs/Decisions 四视图。","contract":"默认 Architecture；Work / Docs / Decisions 为二级视图；cargo xtask dashboard 可重复构建，--check 保证生成物不过期。","paths":["crates/xtask/src/main.rs","docs/dashboard/app.js","docs/dashboard/style.css","docs/dashboard/template.html","docs/dashboard/logo.png","docs/dashboard/favicon.png"],"notes":["架构视图不显示进度装饰；模块状态只表示落地程度。","浏览器只读；改状态走仓库，避免第二个真相源。","不引入前端框架；单文件离线是硬约束。","品牌 mark/favicon 来自 niuverse 组织头像，构建时内嵌为 data URI，保持单文件离线。","默认 dark，支持 localStorage 与 ?theme=light|dark；不引入外部字体或图片。"],"sources":[{"path":"crates/xtask/src/main.rs","language":"rust","text":"mod load;\nmod model;\nmod render;\nmod validate;\n\nuse std::path::PathBuf;\n\nuse anyhow::{bail, Result};\n\nfn main() -\u003e Result\u003c()\u003e {\n    let mut args = std::env::args().skip(1);\n\n    match args.next().as_deref() {\n        Some(\"dashboard\") =\u003e {\n            let mut check = false;\n            for arg in args {\n                match arg.as_str() {\n                    \"--check\" =\u003e check = true,\n                    other =\u003e bail!(\"unknown argument `{other}`\\n\\n{}\", help_text()),\n                }\n            }\n            let root = find_root()?;\n            let dashboard = load::build(\u0026root)?;\n            render::write_dashboard(\u0026root, \u0026dashboard, check)\n        }\n        Some(\"-h\") | Some(\"--help\") | None =\u003e {\n            println!(\"{}\", help_text());\n            Ok(())\n        }\n        Some(other) =\u003e bail!(\"unknown xtask `{other}`\\n\\n{}\", help_text()),\n    }\n}\n\nfn find_root() -\u003e Result\u003cPathBuf\u003e {\n    let mut dir = std::env::current_dir()?;\n    loop {\n        if dir.join(\"docs/dashboard/project.json\").is_file() {\n            return Ok(dir);\n        }\n        if !dir.pop() {\n            bail!(\"could not find workspace root (docs/dashboard/project.json)\");\n        }\n    }\n}\n\nfn help_text() -\u003e String {\n    [\n        \"xtask\",\n        \"\",\n        \"  cargo xtask dashboard          build docs/index.html\",\n        \"  cargo xtask dashboard --check  fail if generated files are stale\",\n    ]\n    .join(\"\\n\")\n}\n","truncated":false},{"path":"docs/dashboard/app.js","language":"javascript","text":"(() =\u003e {\n  'use strict';\n\n  const DATA = JSON.parse(document.getElementById('niucode-data').textContent);\n\n  const VIEWS = ['arch', 'work', 'docs', 'decisions'];\n  const VIEW_ALIASES = { board: 'work', timeline: 'decisions' };\n  const STATUS_COLUMNS = ['backlog', 'ready', 'doing', 'review', 'done'];\n  const STATUS_LABEL = {\n    backlog: 'Backlog',\n    ready: 'Ready',\n    doing: 'Doing',\n    review: 'Review',\n    done: 'Done',\n    blocked: 'Blocked',\n    planned: 'Planned',\n    active: 'Active',\n  };\n  const STATUS_COLORS = {\n    backlog: 'var(--st-backlog)',\n    ready: 'var(--st-ready)',\n    doing: 'var(--st-doing)',\n    review: 'var(--st-review)',\n    done: 'var(--st-done)',\n    blocked: 'var(--st-blocked)',\n  };\n  const LAYER_COLORS = {\n    interface: 'var(--layer-interface)',\n    engine: 'var(--layer-engine)',\n    adapters: 'var(--layer-adapters)',\n    state: 'var(--layer-state)',\n    engineering: 'var(--layer-engineering)',\n  };\n  const KIND_LABEL = { adr: 'ADR', doc: 'Doc', guide: 'Guide' };\n\n  const canvas = document.getElementById('canvas');\n  const details = document.getElementById('details');\n  const search = document.getElementById('search');\n  const themeButton = document.getElementById('theme-toggle');\n\n  const cardById = new Map(DATA.cards.map((card) =\u003e [card.id, card]));\n  const moduleById = new Map(DATA.modules.map((module) =\u003e [module.id, module]));\n  const docById = new Map(DATA.docs.map((doc) =\u003e [doc.id, doc]));\n  const milestoneById = new Map(DATA.milestones.map((milestone) =\u003e [milestone.id, milestone]));\n  const layerById = new Map(DATA.layers.map((layer) =\u003e [layer.id, layer]));\n\n  const state = {\n    view: 'arch',\n    milestone: currentMilestoneId(),\n    selection: null,\n    hoverModule: null,\n    query: '',\n    sourceIndex: 0,\n  };\n\n  let edgeFrame = 0;\n\n  function currentMilestoneId() {\n    const active = DATA.milestones.find((milestone) =\u003e milestone.status === 'active');\n    return active ? active.id : 'all';\n  }\n\n  function normalizeView(view) {\n    return VIEW_ALIASES[view] || view;\n  }\n\n  function esc(value) {\n    return String(value ?? '').replace(/[\u0026\u003c\u003e\"']/g, (character) =\u003e ({\n      '\u0026': '\u0026amp;',\n      '\u003c': '\u0026lt;',\n      '\u003e': '\u0026gt;',\n      '\"': '\u0026quot;',\n      \"'\": '\u0026#39;',\n    }[character]));\n  }\n\n  function fmtDate(value) {\n    return value ? value.slice(5) : '—';\n  }\n\n  function docKind(kind) {\n    return KIND_LABEL[kind] || String(kind || 'doc').toUpperCase();\n  }\n\n  function layerColor(id) {\n    return LAYER_COLORS[id] || 'var(--layer-engineering)';\n  }\n\n  function layerName(id) {\n    const layer = layerById.get(id);\n    return layer ? layer.name : id;\n  }\n\n  function moduleTitle(id) {\n    const module = moduleById.get(id);\n    return module ? module.title : id;\n  }\n\n  function isCardSelected(id) {\n    return state.selection?.type === 'card' \u0026\u0026 state.selection.id === id;\n  }\n\n  function isModuleSelected(id) {\n    return state.selection?.type === 'module' \u0026\u0026 state.selection.id === id;\n  }\n\n  function isDocSelected(id) {\n    return state.selection?.type === 'doc' \u0026\u0026 state.selection.id === id;\n  }\n\n  function statusBadge(status) {\n    const label = STATUS_LABEL[status] || status;\n    return `\u003cspan class=\"badge badge-${esc(status)}\"\u003e\u003cspan class=\"dot\"\u003e\u003c/span\u003e${esc(label)}\u003c/span\u003e`;\n  }\n\n  function currentFocus() {\n    const milestone = DATA.milestones.find((item) =\u003e item.status === 'active');\n    if (!milestone) return null;\n    const cards = DATA.cards.filter((card) =\u003e card.milestone === milestone.id \u0026\u0026 card.status !== 'done');\n    const card = cards.find((item) =\u003e item.status === 'doing')\n      || cards.find((item) =\u003e item.status === 'ready')\n      || cards.find((item) =\u003e item.status === 'review')\n      || cards.find((item) =\u003e item.status === 'backlog');\n    return { milestone, card };\n  }\n\n  function relatedModules(id) {\n    const related = new Set();\n    DATA.relations.forEach((relation) =\u003e {\n      if (relation.from === id) related.add(relation.to);\n      if (relation.to === id) related.add(relation.from);\n    });\n    return related;\n  }\n\n  function cardMatches(card, query) {\n    if (!query) return true;\n    return [card.id, card.title, card.module, card.status, card.priority]\n      .filter(Boolean)\n      .join(' ')\n      .toLowerCase()\n      .includes(query);\n  }\n\n  function moduleMatches(module, query) {\n    if (!query) return true;\n    return [module.id, module.title, module.summary, module.layer, module.status]\n      .filter(Boolean)\n      .join(' ')\n      .toLowerCase()\n      .includes(query);\n  }\n\n  function docMatches(doc, query) {\n    if (!query) return true;\n    return [doc.id, doc.title, doc.kind, doc.status, doc.summary, doc.excerpt, doc.path]\n      .filter(Boolean)\n      .join(' ')\n      .toLowerCase()\n      .includes(query);\n  }\n\n  function eventMatches(event, query) {\n    if (!query) return true;\n    return [event.date, event.kind, event.title, event.detail, ...(event.refs || [])]\n      .filter(Boolean)\n      .join(' ')\n      .toLowerCase()\n      .includes(query);\n  }\n\n  function viewHead(kicker, title, subtitle, stats) {\n    return `\u003cdiv class=\"view-head\"\u003e\n      \u003cdiv class=\"view-head-main\"\u003e\n        \u003cdiv class=\"kicker\"\u003e${esc(kicker)}\u003c/div\u003e\n        \u003ch1 class=\"view-title\"\u003e${esc(title)}\u003c/h1\u003e\n        ${subtitle ? `\u003cp class=\"view-sub\"\u003e${esc(subtitle)}\u003c/p\u003e` : ''}\n      \u003c/div\u003e\n      ${stats ? `\u003cdiv class=\"stats\"\u003e${stats}\u003c/div\u003e` : ''}\n    \u003c/div\u003e`;\n  }\n\n  function compareCards(a, b) {\n    const priority = { P0: 0, P1: 1, P2: 2 };\n    const pa = priority[a.priority] ?? 9;\n    const pb = priority[b.priority] ?? 9;\n    return pa - pb || a.id.localeCompare(b.id);\n  }\n\n  function renderTabs() {\n    document.querySelectorAll('.tab').forEach((tab) =\u003e {\n      const active = tab.dataset.view === state.view;\n      tab.classList.toggle('active', active);\n      if (active) tab.setAttribute('aria-current', 'page');\n      else tab.removeAttribute('aria-current');\n    });\n  }\n\n  function renderChrome() {\n    document.getElementById('project-status').textContent = DATA.project.status;\n","truncated":true},{"path":"docs/dashboard/style.css","language":"css","text":"/* ==========================================================================\n   niucode · precision architecture workbench\n   Single-source stylesheet. No external fonts, no CDN, offline-first.\n   ========================================================================== */\n\n:root {\n  --bg: #f6f5f1;\n  --bg-subtle: #efede7;\n  --surface: #ffffff;\n  --surface-2: #f1efe9;\n  --surface-3: #e6e3db;\n  --ink: #14171a;\n  --ink-secondary: #333940;\n  --muted: #555d66;\n  --faint: #7c848e;\n  --line: rgba(20, 23, 26, 0.09);\n  --line-strong: rgba(20, 23, 26, 0.18);\n  --accent: #18684e;\n  --accent-2: #245d88;\n  --accent-soft: rgba(24, 104, 78, 0.10);\n  --accent-border: rgba(24, 104, 78, 0.36);\n  --shadow-sm: 0 1px 2px rgba(16, 20, 24, 0.04), 0 3px 10px rgba(16, 20, 24, 0.03);\n  --shadow-md: 0 4px 16px rgba(16, 20, 24, 0.07), 0 1px 3px rgba(16, 20, 24, 0.04);\n\n  --code-bg: #111418;\n  --code-head: #171b21;\n  --code-ink: #e4e9ef;\n  --code-line: #232932;\n  --code-muted: #687382;\n\n  --st-backlog: #737d87;\n  --st-ready: #2e72a6;\n  --st-doing: #b86e14;\n  --st-review: #6e54b5;\n  --st-done: #237853;\n  --st-blocked: #c9372c;\n\n  --layer-interface: #386fd4;\n  --layer-engine: #c26d27;\n  --layer-adapters: #7a58c7;\n  --layer-state: #2c865b;\n  --layer-engineering: #667380;\n\n  --sans: \"Inter\", -apple-system, BlinkMacSystemFont, \"SF Pro Text\", \"Segoe UI\",\n    \"PingFang SC\", \"HarmonyOS Sans SC\", \"MiSans\", \"Hiragino Sans GB\",\n    \"Noto Sans CJK SC\", \"Noto Sans SC\", \"Microsoft YaHei UI\", system-ui, sans-serif;\n  --mono: \"JetBrains Mono\", \"SF Mono\", ui-monospace, SFMono-Regular,\n    \"Cascadia Code\", Menlo, Monaco, Consolas, \"Liberation Mono\",\n    \"Noto Sans Mono CJK SC\", monospace;\n}\n\n[data-theme=\"dark\"] {\n  --bg: #090b0e;\n  --bg-subtle: #0c0f14;\n  --surface: #10141b;\n  --surface-2: #161b24;\n  --surface-3: #1d2430;\n  --ink: #eef2f6;\n  --ink-secondary: #ced6e0;\n  --muted: #97a3b1;\n  --faint: #677483;\n  --line: rgba(226, 236, 248, 0.08);\n  --line-strong: rgba(226, 236, 248, 0.16);\n  --accent: #38d399;\n  --accent-2: #58a6ff;\n  --accent-soft: rgba(56, 211, 153, 0.11);\n  --accent-border: rgba(56, 211, 153, 0.42);\n  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.32), 0 4px 12px rgba(0, 0, 0, 0.22);\n  --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.42), 0 2px 6px rgba(0, 0, 0, 0.28);\n\n  --code-bg: #080a0d;\n  --code-head: #0d1016;\n  --code-ink: #dfe6ee;\n  --code-line: #1b222c;\n  --code-muted: #586575;\n\n  --st-backlog: #7e8b98;\n  --st-ready: #58a6ff;\n  --st-doing: #e39c3b;\n  --st-review: #a88bfa;\n  --st-done: #3fb980;\n  --st-blocked: #f4665c;\n\n  --layer-interface: #5899f8;\n  --layer-engine: #e08b44;\n  --layer-adapters: #9d7ef2;\n  --layer-state: #46bd84;\n  --layer-engineering: #8291a0;\n}\n\n*,\n*::before,\n*::after {\n  box-sizing: border-box;\n}\n\nhtml,\nbody {\n  margin: 0;\n  height: 100%;\n  background: var(--bg);\n}\n\nbody {\n  color: var(--ink);\n  font-family: var(--sans);\n  font-size: 13px;\n  line-height: 1.55;\n  font-feature-settings: \"cv02\", \"cv03\", \"cv04\", \"cv11\";\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  text-rendering: optimizeLegibility;\n  overflow: hidden;\n}\n\nbutton {\n  font: inherit;\n  color: inherit;\n  background: none;\n  border: 0;\n  padding: 0;\n  cursor: pointer;\n}\n\na {\n  color: inherit;\n  text-decoration: none;\n}\n\ninput {\n  font: inherit;\n}\n\n::selection {\n  background: var(--accent-soft);\n  color: var(--ink);\n}\n\n:focus-visible {\n  outline: 2px solid var(--accent);\n  outline-offset: 2px;\n}\n\n* {\n  scrollbar-width: thin;\n  scrollbar-color: var(--line-strong) transparent;\n}\n\n*::-webkit-scrollbar {\n  width: 6px;\n  height: 6px;\n}\n\n*::-webkit-scrollbar-track {\n  background: transparent;\n}\n\n*::-webkit-scrollbar-thumb {\n  background: var(--line-strong);\n  border-radius: 99px;\n}\n\n/* ---------- topbar ---------- */\n\n.topbar {\n  height: 52px;\n  display: flex;\n  align-items: center;\n  gap: 20px;\n  padding: 0 18px;\n  border-bottom: 1px solid var(--line);\n  background: var(--surface);\n  position: relative;\n  z-index: 30;\n}\n\n.brand {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  min-width: 0;\n}\n\n.brand-badge {\n  width: 30px;\n  height: 30px;\n  flex: none;\n  display: grid;\n  place-items: center;\n  overflow: hidden;\n  border-radius: 8px;\n  border: 1px solid var(--line-strong);\n  background: #080a0e;\n}\n\n.brand-badge img {\n  width: 100%;\n  height: 100%;\n  display: block;\n  object-fit: cover;\n","truncated":true},{"path":"docs/dashboard/template.html","language":"html","text":"\u003c!doctype html\u003e\n\u003chtml lang=\"zh-CN\" data-theme=\"dark\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\u003e\n\u003cmeta name=\"color-scheme\" content=\"dark light\"\u003e\n\u003cmeta name=\"theme-color\" content=\"#080a0f\"\u003e\n\u003cmeta name=\"description\" content=\"niucode project dashboard: board, architecture, documents, timeline.\"\u003e\n\u003clink rel=\"icon\" type=\"image/png\" href=\"{{FAVICON}}\"\u003e\n\u003clink rel=\"apple-touch-icon\" href=\"{{FAVICON}}\"\u003e\n\u003ctitle\u003eniucode · project dashboard\u003c/title\u003e\n\u003cstyle\u003e\n{{STYLE}}\n\u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\u003cheader class=\"topbar\"\u003e\n  \u003ca class=\"brand\" href=\"#/arch\" data-view=\"arch\" aria-label=\"niucode dashboard\"\u003e\n    \u003cspan class=\"brand-badge\"\u003e\u003cimg src=\"{{LOGO}}\" alt=\"niuverse\" width=\"36\" height=\"36\"\u003e\u003c/span\u003e\n    \u003cspan class=\"brand-text\"\u003e\n      \u003cspan class=\"brand-name\"\u003eniucode\u003c/span\u003e\n      \u003cspan class=\"brand-sub\"\u003eby niuverse\u003c/span\u003e\n    \u003c/span\u003e\n    \u003cspan class=\"brand-divider\" aria-hidden=\"true\"\u003e\u003c/span\u003e\n    \u003cspan class=\"brand-tag\"\u003eminimal, observable coding agent\u003c/span\u003e\n  \u003c/a\u003e\n\n  \u003cnav class=\"tabs\" aria-label=\"Views\"\u003e\n    \u003cbutton class=\"tab\" type=\"button\" data-view=\"arch\"\u003eArchitecture\u003c/button\u003e\n    \u003cbutton class=\"tab\" type=\"button\" data-view=\"work\"\u003eWork\u003c/button\u003e\n    \u003cbutton class=\"tab\" type=\"button\" data-view=\"docs\"\u003eDocs\u003c/button\u003e\n    \u003cbutton class=\"tab\" type=\"button\" data-view=\"decisions\"\u003eDecisions\u003c/button\u003e\n  \u003c/nav\u003e\n\n  \u003cdiv class=\"top-actions\"\u003e\n    \u003clabel class=\"search\" aria-label=\"Filter current view\"\u003e\n      \u003cspan class=\"search-key\"\u003e/\u003c/span\u003e\n      \u003cinput id=\"search\" type=\"search\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"Filter\"\u003e\n    \u003c/label\u003e\n    \u003cspan class=\"status-chip\" id=\"project-status\"\u003e\u003c/span\u003e\n    \u003cbutton class=\"icon-button theme-toggle\" id=\"theme-toggle\" type=\"button\" title=\"Toggle theme\" aria-label=\"Toggle theme\"\u003e\n      \u003cspan class=\"theme-icon theme-sun\" aria-hidden=\"true\"\u003e☀\u003c/span\u003e\n      \u003cspan class=\"theme-icon theme-moon\" aria-hidden=\"true\"\u003e☾\u003c/span\u003e\n    \u003c/button\u003e\n  \u003c/div\u003e\n\u003c/header\u003e\n\n\u003cmain class=\"shell\"\u003e\n  \u003caside class=\"rail\" aria-label=\"Project navigation\"\u003e\n    \u003csection class=\"rail-section rail-map\"\u003e\n      \u003cdiv class=\"rail-head\"\u003e\u003ch2\u003eArchitecture\u003c/h2\u003e\u003cspan id=\"module-count\"\u003e\u003c/span\u003e\u003c/div\u003e\n      \u003cdiv id=\"map-nav\" class=\"map-nav\"\u003e\u003c/div\u003e\n    \u003c/section\u003e\n\n    \u003csection class=\"rail-section rail-docs\"\u003e\n      \u003cdiv class=\"rail-head\"\u003e\u003ch2\u003eDocuments\u003c/h2\u003e\u003cspan id=\"doc-count\"\u003e\u003c/span\u003e\u003c/div\u003e\n      \u003cdiv id=\"rail-docs\" class=\"rail-doc-list\"\u003e\u003c/div\u003e\n    \u003c/section\u003e\n\n    \u003cdiv class=\"rail-foot\" id=\"rail-foot\"\u003e\u003c/div\u003e\n  \u003c/aside\u003e\n\n  \u003csection class=\"canvas\" id=\"canvas\" aria-label=\"Project view\" tabindex=\"-1\"\u003e\u003c/section\u003e\n  \u003caside class=\"details\" id=\"details\" aria-label=\"Details\"\u003e\u003c/aside\u003e\n\u003c/main\u003e\n\n\u003cnoscript\u003e\n  \u003cp style=\"padding:24px;font-family:monospace\"\u003eThis dashboard needs JavaScript. Source files live in docs/dashboard/.\u003c/p\u003e\n\u003c/noscript\u003e\n\n\u003cscript id=\"niucode-data\" type=\"application/json\"\u003e{{DATA}}\u003c/script\u003e\n\u003cscript\u003e\n{{APP}}\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n","truncated":false}]},{"id":"auth","title":"Auth","layer":"adapters","status":"active","summary":"凭证解析与安全存储：env → OS keyring → 0600 file。","contract":"AuthStore::resolve 只返回值与来源；不打印 key；provider 保持凭证无关。","paths":["crates/niucode-auth/src/lib.rs","crates/niucode-auth/src/file.rs","crates/niucode-auth/src/keyring_store.rs","crates/niucode-auth/src/error.rs"],"notes":["环境变量优先；keyring 不可用时回退 0600 文件。","文件写入使用 0600，状态会提示 insecure 权限。","不支持网页账号 cookie；账号 OAuth 需要独立 ADR。"],"sources":[{"path":"crates/niucode-auth/src/lib.rs","language":"rust","text":"//! Credential resolution for niucode.\n//!\n//! Resolution order is deliberately small: environment variable, then OS\n//! keyring, then a 0600 credentials file. Commands never print the secret.\n\nmod error;\nmod file;\nmod keyring_store;\n\npub use error::AuthError;\n\nuse std::env;\nuse std::fmt;\nuse std::path::{Path, PathBuf};\n\nuse file::FileStore;\n\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum Source {\n    Env,\n    Keyring,\n    File,\n}\n\nimpl Source {\n    pub fn as_str(self) -\u003e \u0026'static str {\n        match self {\n            Self::Env =\u003e \"env\",\n            Self::Keyring =\u003e \"keyring\",\n            Self::File =\u003e \"file\",\n        }\n    }\n}\n\nimpl fmt::Display for Source {\n    fn fmt(\u0026self, formatter: \u0026mut fmt::Formatter\u003c'_\u003e) -\u003e fmt::Result {\n        formatter.write_str(self.as_str())\n    }\n}\n\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum Storage {\n    Keyring,\n    File,\n}\n\nimpl fmt::Display for Storage {\n    fn fmt(\u0026self, formatter: \u0026mut fmt::Formatter\u003c'_\u003e) -\u003e fmt::Result {\n        match self {\n            Self::Keyring =\u003e formatter.write_str(\"OS keyring\"),\n            Self::File =\u003e formatter.write_str(\"0600 credentials file\"),\n        }\n    }\n}\n\n#[derive(Clone, PartialEq, Eq)]\npub struct SecretKey(String);\n\nimpl SecretKey {\n    pub fn expose(\u0026self) -\u003e \u0026str {\n        \u0026self.0\n    }\n}\n\nimpl fmt::Debug for SecretKey {\n    fn fmt(\u0026self, formatter: \u0026mut fmt::Formatter\u003c'_\u003e) -\u003e fmt::Result {\n        formatter.write_str(\"SecretKey(***)\")\n    }\n}\n\n#[derive(Debug)]\npub struct Resolved {\n    pub key: SecretKey,\n    pub source: Source,\n}\n\n#[derive(Debug, Clone)]\npub struct AuthStatus {\n    pub provider: String,\n    pub env: bool,\n    pub keyring: bool,\n    pub file: bool,\n    pub file_private: bool,\n    pub effective: Option\u003cSource\u003e,\n}\n\npub struct AuthStore {\n    file: FileStore,\n    keyring_enabled: bool,\n}\n\nimpl AuthStore {\n    pub fn new() -\u003e Result\u003cSelf, AuthError\u003e {\n        let directory = config_dir()?;\n        let keyring_enabled =\n            !matches!(env::var(\"NIUCODE_AUTH_DISABLE_KEYRING\").as_deref(), Ok(\"1\"));\n\n        Ok(Self {\n            file: FileStore::new(directory.join(\"credentials.toml\")),\n            keyring_enabled,\n        })\n    }\n\n    /// Test/local helper: use a specific config directory and skip the keyring.\n    pub fn at(directory: \u0026Path) -\u003e Self {\n        Self {\n            file: FileStore::new(directory.join(\"credentials.toml\")),\n            keyring_enabled: false,\n        }\n    }\n\n    pub fn credentials_path(\u0026self) -\u003e \u0026Path {\n        self.file.path()\n    }\n\n    pub fn resolve(\u0026self, provider: \u0026str) -\u003e Result\u003cOption\u003cResolved\u003e, AuthError\u003e {\n        let env_value = env_var(provider).and_then(|name| env::var(name).ok());\n        self.resolve_with(provider, env_value)\n    }\n\n    pub fn resolve_with(\n        \u0026self,\n        provider: \u0026str,\n        env_value: Option\u003cString\u003e,\n    ) -\u003e Result\u003cOption\u003cResolved\u003e, AuthError\u003e {\n        if let Some(value) = env_value\n            .map(|value| value.trim().to_string())\n            .filter(|value| !value.is_empty())\n        {\n            return Ok(Some(Resolved {\n                key: SecretKey(value),\n                source: Source::Env,\n            }));\n        }\n\n        if self.keyring_enabled {\n            if let Some(value) = keyring_store::get(provider) {\n                return Ok(Some(Resolved {\n                    key: SecretKey(value),\n                    source: Source::Keyring,\n                }));\n            }\n        }\n\n        if let Some(value) = self.file.get(provider)? {\n            return Ok(Some(Resolved {\n                key: SecretKey(value),\n                source: Source::File,\n            }));\n        }\n\n        Ok(None)\n    }\n\n    pub fn status(\u0026self, provider: \u0026str) -\u003e Result\u003cAuthStatus, AuthError\u003e {\n        let env_value = env_var(provider).and_then(|name| env::var(name).ok());\n        self.status_with(provider, env_value)\n    }\n\n    pub fn status_with(\n        \u0026self,\n        provider: \u0026str,\n        env_value: Option\u003cString\u003e,\n    ) -\u003e Result\u003cAuthStatus, AuthError\u003e {\n        let env = env_value\n            .as_deref()\n            .map(|value| !value.trim().is_empty())\n            .unwrap_or(false);\n        let keyring = if self.keyring_enabled {\n            keyring_store::get(provider).is_some()\n        } else {\n            false\n        };\n        let file = self.file.get(provider)?.is_some();\n        let file_private = if file { self.file.is_private() } else { true };\n\n        let effective = if env {\n            Some(Source::Env)\n        } else if keyring {\n            Some(Source::Keyring)\n        } else if file {\n            Some(Source::File)\n        } else {\n            None\n        };\n\n        Ok(AuthStatus {\n            provider: provider.to_string(),\n            env,\n            keyring,\n            file,\n            file_private,\n            effective,\n        })\n    }\n\n    /// Store the key in the OS keyring, falling back to a 0600 file.\n    pub fn set(\u0026self, provider: \u0026str, api_key: \u0026str) -\u003e Result\u003cStorage, AuthError\u003e {\n        let api_key = api_key.trim();\n        if api_key.is_empty() {\n","truncated":true},{"path":"crates/niucode-auth/src/file.rs","language":"rust","text":"use std::collections::BTreeMap;\nuse std::fs;\nuse std::path::{Path, PathBuf};\n\nuse serde::{Deserialize, Serialize};\n\nuse crate::AuthError;\n\n#[derive(Debug, Default, Serialize, Deserialize)]\nstruct Credentials {\n    #[serde(default)]\n    providers: BTreeMap\u003cString, ProviderEntry\u003e,\n}\n\n#[derive(Debug, Serialize, Deserialize)]\nstruct ProviderEntry {\n    api_key: String,\n}\n\npub(crate) struct FileStore {\n    path: PathBuf,\n}\n\nimpl FileStore {\n    pub(crate) fn new(path: PathBuf) -\u003e Self {\n        Self { path }\n    }\n\n    pub(crate) fn path(\u0026self) -\u003e \u0026Path {\n        \u0026self.path\n    }\n\n    pub(crate) fn get(\u0026self, provider: \u0026str) -\u003e Result\u003cOption\u003cString\u003e, AuthError\u003e {\n        let credentials = self.read()?;\n        Ok(credentials\n            .providers\n            .get(provider)\n            .map(|entry| entry.api_key.trim().to_string())\n            .filter(|key| !key.is_empty()))\n    }\n\n    pub(crate) fn set(\u0026self, provider: \u0026str, api_key: \u0026str) -\u003e Result\u003c(), AuthError\u003e {\n        let mut credentials = self.read()?;\n        credentials.providers.insert(\n            provider.to_string(),\n            ProviderEntry {\n                api_key: api_key.to_string(),\n            },\n        );\n        self.write(\u0026credentials)\n    }\n\n    pub(crate) fn remove(\u0026self, provider: \u0026str) -\u003e Result\u003cbool, AuthError\u003e {\n        let mut credentials = self.read()?;\n        let removed = credentials.providers.remove(provider).is_some();\n        if removed {\n            self.write(\u0026credentials)?;\n        }\n        Ok(removed)\n    }\n\n    pub(crate) fn is_private(\u0026self) -\u003e bool {\n        #[cfg(unix)]\n        {\n            use std::os::unix::fs::PermissionsExt;\n            self.path\n                .metadata()\n                .map(|metadata| metadata.permissions().mode() \u0026 0o077 == 0)\n                .unwrap_or(true)\n        }\n        #[cfg(not(unix))]\n        {\n            true\n        }\n    }\n\n    fn read(\u0026self) -\u003e Result\u003cCredentials, AuthError\u003e {\n        if !self.path.exists() {\n            return Ok(Credentials::default());\n        }\n\n        let raw = fs::read_to_string(\u0026self.path)?;\n        if raw.trim().is_empty() {\n            return Ok(Credentials::default());\n        }\n\n        toml::from_str(\u0026raw).map_err(|_| AuthError::CorruptCredentials)\n    }\n\n    fn write(\u0026self, credentials: \u0026Credentials) -\u003e Result\u003c(), AuthError\u003e {\n        let parent = self.path.parent().ok_or(AuthError::NoConfigDir)?;\n        let existed = parent.exists();\n        fs::create_dir_all(parent)?;\n\n        #[cfg(unix)]\n        {\n            use std::os::unix::fs::PermissionsExt;\n            if !existed {\n                fs::set_permissions(parent, fs::Permissions::from_mode(0o700))?;\n            }\n        }\n\n        let data = toml::to_string_pretty(credentials).map_err(|_| AuthError::Serialize)?;\n        let temporary = self.path.with_extension(\"toml.tmp\");\n        fs::write(\u0026temporary, data)?;\n\n        #[cfg(unix)]\n        {\n            use std::os::unix::fs::PermissionsExt;\n            fs::set_permissions(\u0026temporary, fs::Permissions::from_mode(0o600))?;\n        }\n\n        fs::rename(\u0026temporary, \u0026self.path)?;\n\n        #[cfg(unix)]\n        {\n            use std::os::unix::fs::PermissionsExt;\n            fs::set_permissions(\u0026self.path, fs::Permissions::from_mode(0o600))?;\n        }\n\n        Ok(())\n    }\n}\n","truncated":false},{"path":"crates/niucode-auth/src/keyring_store.rs","language":"rust","text":"use keyring::Entry;\n\nconst SERVICE: \u0026str = \"niucode\";\n\npub(crate) fn get(provider: \u0026str) -\u003e Option\u003cString\u003e {\n    let entry = Entry::new(SERVICE, provider).ok()?;\n    entry\n        .get_password()\n        .ok()\n        .map(|value| value.trim().to_string())\n        .filter(|value| !value.is_empty())\n}\n\npub(crate) fn set(provider: \u0026str, api_key: \u0026str) -\u003e bool {\n    Entry::new(SERVICE, provider)\n        .and_then(|entry| entry.set_password(api_key))\n        .is_ok()\n}\n\npub(crate) fn delete(provider: \u0026str) -\u003e bool {\n    Entry::new(SERVICE, provider)\n        .and_then(|entry| entry.delete_credential())\n        .is_ok()\n}\n","truncated":false},{"path":"crates/niucode-auth/src/error.rs","language":"rust","text":"use thiserror::Error;\n\n#[derive(Debug, Error)]\npub enum AuthError {\n    #[error(\"cannot determine a config directory; set NIUCODE_CONFIG_DIR or HOME\")]\n    NoConfigDir,\n    #[error(\"cannot store an empty API key\")]\n    EmptyKey,\n    #[error(\"credentials file I/O failed: {0}\")]\n    Io(#[from] std::io::Error),\n    #[error(\"credentials file is not valid TOML\")]\n    CorruptCredentials,\n    #[error(\"could not serialize credentials\")]\n    Serialize,\n}\n","truncated":false}]},{"id":"extensions","title":"Extension Host","layer":"adapters","status":"active","summary":"session 级 sidecar host：发现 .niucode/extensions/*.toml，JSON-RPC initialize/tools/call/shutdown，把外部工具并入 agent tool specs。","contract":"discover(workspace, reserved) -\u003e host；host.specs(); host.execute(name, input); host.shutdown()。不拥有 session 或 loop。","paths":["crates/niucode-extension/src/lib.rs"],"notes":["一插件一进程；v1 每插件串行调用。","env_clear：sidecar 不继承 API key。","mount/unmount/error 写入父 session 事件。","capability sandbox、worker pool、subagent 共享在 M4-007。"],"sources":[{"path":"crates/niucode-extension/src/lib.rs","language":"rust","text":"//! Sidecar extension host.\n//!\n//! A plugin is a local process speaking line-delimited JSON-RPC over stdio.\n//! Tools are discovered during `initialize`; calls are serialized per plugin\n//! for now (the manifest does not yet declare a concurrency model).\n\nuse std::collections::{HashMap, HashSet};\nuse std::path::{Path, PathBuf};\nuse std::process::Stdio;\nuse std::sync::atomic::{AtomicUsize, Ordering};\nuse std::sync::Arc;\nuse std::time::Duration;\n\nuse anyhow::{bail, Context, Result};\nuse niucode_provider::ToolSpec;\nuse niucode_tools::ToolResult;\nuse serde::Deserialize;\nuse serde_json::{json, Value};\nuse tokio::io::{AsyncBufReadExt, AsyncWriteExt, BufReader, BufWriter};\nuse tokio::process::{Child, ChildStdin, ChildStdout, Command};\nuse tokio::sync::Mutex;\nuse tokio::time::timeout;\n\nconst PROTOCOL_VERSION: u64 = 1;\nconst DEFAULT_TIMEOUT_SECS: u64 = 30;\n\n#[derive(Debug, Clone)]\npub struct MountInfo {\n    pub name: String,\n    pub version: String,\n    pub tools: Vec\u003cString\u003e,\n    pub manifest: PathBuf,\n    /// Read-only plugins may be exposed to subagent Explore/Worker profiles.\n    pub read_only: bool,\n    pub capabilities: Vec\u003cString\u003e,\n    pub digest: String,\n    pub workers: usize,\n}\n\npub struct MountReport {\n    pub host: ExtensionHost,\n    pub errors: Vec\u003cString\u003e,\n}\n\n/// Discover `.niucode/extensions/*.toml` under the workspace, spawn each\n/// sidecar, and register its tools. Reserved tool names (usually built-ins)\n/// are rejected rather than shadowed.\npub async fn discover(workspace: \u0026Path, reserved: \u0026[String]) -\u003e MountReport {\n    let directory = workspace.join(\".niucode/extensions\");\n    discover_in(\u0026directory, workspace, reserved).await\n}\n\n/// Discover manifests from an explicit directory while resolving relative\n/// command paths against `workspace`. The CLI uses the global per-project\n/// extension store; tests can point at a temp directory directly.\npub async fn discover_in(directory: \u0026Path, workspace: \u0026Path, reserved: \u0026[String]) -\u003e MountReport {\n    let mut host = ExtensionHost::default();\n    let mut errors = Vec::new();\n    let mut reserved = reserved.iter().cloned().collect::\u003cHashSet\u003c_\u003e\u003e();\n\n    if !directory.is_dir() {\n        return MountReport { host, errors };\n    }\n\n    let mut manifests = match std::fs::read_dir(directory) {\n        Ok(entries) =\u003e entries\n            .filter_map(Result::ok)\n            .map(|entry| entry.path())\n            .filter(|path| {\n                path.extension()\n                    .is_some_and(|extension| extension == \"toml\")\n            })\n            .collect::\u003cVec\u003c_\u003e\u003e(),\n        Err(error) =\u003e {\n            errors.push(format!(\"read {}: {error}\", directory.display()));\n            return MountReport { host, errors };\n        }\n    };\n    manifests.sort();\n\n    for path in manifests {\n        match mount_one(\u0026path, workspace).await {\n            Ok((pool, info)) =\u003e {\n                let mut collision = None;\n                for tool in \u0026info.tools {\n                    if !reserved.insert(tool.clone()) {\n                        collision = Some(tool.clone());\n                        break;\n                    }\n                }\n                if let Some(tool) = collision {\n                    errors.push(format!(\n                        \"{}: tool {tool:?} collides with a built-in or another extension\",\n                        info.name\n                    ));\n                    continue;\n                }\n                host.register(pool, info);\n            }\n            Err(error) =\u003e errors.push(format!(\"{}: {error:#}\", path.display())),\n        }\n    }\n\n    MountReport { host, errors }\n}\n\nstruct Capabilities {\n    fs_write: bool,\n    network: bool,\n    subprocess: bool,\n}\n\nimpl Capabilities {\n    fn parse(values: \u0026[String]) -\u003e Result\u003cSelf\u003e {\n        let mut capabilities = Self {\n            fs_write: false,\n            network: false,\n            subprocess: false,\n        };\n        for value in values {\n            match value.as_str() {\n                \"fs_read\" =\u003e {}\n                \"fs_write\" =\u003e capabilities.fs_write = true,\n                \"network\" =\u003e capabilities.network = true,\n                \"subprocess\" =\u003e capabilities.subprocess = true,\n                other =\u003e bail!(\"unknown extension capability {other:?}\"),\n            }\n        }\n        Ok(capabilities)\n    }\n}\n\nasync fn mount_one(path: \u0026Path, workspace: \u0026Path) -\u003e Result\u003c(Pool, MountInfo)\u003e {\n    let text = std::fs::read_to_string(path).with_context(|| format!(\"read {}\", path.display()))?;\n    let manifest: Manifest =\n        toml::from_str(\u0026text).with_context(|| format!(\"parse {}\", path.display()))?;\n    validate_name(\u0026manifest.name)?;\n    if manifest.command.trim().is_empty() {\n        bail!(\"manifest command is empty\");\n    }\n    if manifest.protocol != PROTOCOL_VERSION {\n        bail!(\n            \"unsupported extension protocol {} (host supports {PROTOCOL_VERSION})\",\n            manifest.protocol\n        );\n    }\n    let capabilities = Capabilities::parse(\u0026manifest.capabilities)?;\n    let workers = manifest.workers.clamp(1, 8);\n    let read_only = manifest.read_only \u0026\u0026 !capabilities.fs_write;\n    let digest = digest(\u0026format!(\n        \"{}:{}:{}:{}:{}\",\n        manifest.name,\n        manifest.command,\n        manifest.args.join(\"\\u{1f}\"),\n        manifest.capabilities.join(\",\"),\n        manifest.workers\n    ));\n\n    let mut plugins = Vec::new();\n    let mut first: Option\u003c(String, Vec\u003cToolSpec\u003e, Vec\u003cString\u003e)\u003e = None;\n    for worker in 0..workers {\n        let mut plugin = spawn_plugin(\u0026manifest, workspace, \u0026capabilities, worker)?;\n        let initialized = initialize_plugin(\u0026mut plugin).await?;\n        if let Some((version, specs, _names)) = \u0026first {\n            if specs.len() != initialized.1.len()\n                || specs\n                    .iter()\n                    .zip(\u0026initialized.1)\n                    .any(|(left, right)| left.function.name != right.function.name)\n            {\n                bail!(\n                    \"extension {} declared inconsistent tools across workers\",\n                    manifest.name\n                );\n            }\n            if version != \u0026initialized.0 {\n                bail!(\"extension {} reported inconsistent versions\", manifest.name);\n            }\n        } else {\n            first = Some(initialized.clone());\n        }\n        plugins.push(plugin);\n    }\n    let (version, specs, names) = first.context(\"extension worker pool is empty\")?;\n    Ok((\n        Pool::new(plugins, specs.clone()),\n        MountInfo {\n            name: manifest.name,\n            version,\n            tools: names,\n            manifest: path.to_path_buf(),\n            read_only,\n            capabilities: manifest.capabilities,\n            digest,\n            workers,\n        },\n    ))\n}\n\nfn spawn_plugin(\n","truncated":true}]},{"id":"workspace","title":"Workspace","layer":"state","status":"active","summary":"全局 per-project 工作区：project key、sessions、proposals、backups、extensions、cache、worktrees、config、gc。","contract":"不创建项目 .niucode；session/title 由事件日志派生；GC 默认 dry-run。","paths":["crates/niucode-cli/src/workspace.rs","crates/niucode-cli/src/tui.rs"],"notes":["项目根零状态；旧 flat sessions/extensions 硬切。","ToolResult 1 MiB 预算。"],"sources":[{"path":"crates/niucode-cli/src/workspace.rs","language":"rust","text":"//! Global per-project workspace layout.\n//!\n//! niucode intentionally does not create a `.niucode` directory in the project\n//! root. All state lives under `~/.niucode/projects/\u003ckey\u003e/`.\n\nuse std::fs;\nuse std::path::{Path, PathBuf};\n\nuse anyhow::{bail, Context, Result};\nuse niucode_core::now_ms;\nuse serde::{Deserialize, Serialize};\n\nconst SCHEMA_VERSION: u32 = 1;\n\n#[derive(Debug, Clone)]\npub struct Workspace {\n    pub project_key: String,\n    pub project_dir: PathBuf,\n    pub cwd: PathBuf,\n    pub sessions: PathBuf,\n    pub proposals: PathBuf,\n    pub backups: PathBuf,\n    pub extensions: PathBuf,\n    pub cache: PathBuf,\n    pub worktrees: PathBuf,\n    pub config: PathBuf,\n}\n\n#[derive(Debug, Clone, Default, Serialize, Deserialize)]\npub struct GlobalConfig {\n    #[serde(default)]\n    pub defaults: ConfigDefaults,\n}\n\n#[derive(Debug, Clone, Default, Serialize, Deserialize)]\npub struct ConfigDefaults {\n    pub provider: Option\u003cString\u003e,\n    pub model: Option\u003cString\u003e,\n    pub context_budget: Option\u003cusize\u003e,\n}\n\n#[derive(Debug, Serialize, Deserialize)]\nstruct ProjectMeta {\n    schema_version: u32,\n    cwd: String,\n    first_seen: u64,\n    last_seen: u64,\n}\n\nimpl Workspace {\n    pub fn discover(cwd: \u0026Path) -\u003e Result\u003cSelf\u003e {\n        let cwd = cwd\n            .canonicalize()\n            .with_context(|| format!(\"resolve workspace cwd {}\", cwd.display()))?;\n        let root = global_root()?;\n        Self::from_root(root, cwd)\n    }\n\n    fn from_root(root: PathBuf, cwd: PathBuf) -\u003e Result\u003cSelf\u003e {\n        let project_key = project_key(\u0026cwd);\n        let project_dir = root.join(\"projects\").join(\u0026project_key);\n        let config = root.join(\"config.toml\");\n        let workspace = Self {\n            sessions: project_dir.join(\"sessions\"),\n            proposals: project_dir.join(\"proposals\"),\n            backups: project_dir.join(\"backups\"),\n            extensions: project_dir.join(\"extensions\"),\n            cache: project_dir.join(\"cache\"),\n            worktrees: project_dir.join(\"worktrees\"),\n            config,\n            project_key,\n            project_dir,\n            cwd,\n        };\n        workspace.ensure()?;\n        Ok(workspace)\n    }\n\n    fn ensure(\u0026self) -\u003e Result\u003c()\u003e {\n        for directory in [\n            \u0026self.project_dir,\n            \u0026self.sessions,\n            \u0026self.proposals,\n            \u0026self.backups,\n            \u0026self.extensions,\n            \u0026self.cache,\n            \u0026self.worktrees,\n        ] {\n            fs::create_dir_all(directory)\n                .with_context(|| format!(\"create workspace directory {}\", directory.display()))?;\n        }\n        if !self.config.is_file() {\n            fs::write(\n                \u0026self.config,\n                \"# niucode global defaults; CLI flags override.\\n[defaults]\\n# provider = \\\"deepseek\\\"\\n# model = \\\"deepseek-flash\\\"\\n# context_budget = 0\\n\",\n            )\n            .with_context(|| format!(\"write {}\", self.config.display()))?;\n        }\n        let meta_path = self.project_dir.join(\"project.toml\");\n        let previous = fs::read_to_string(\u0026meta_path)\n            .ok()\n            .and_then(|text| toml::from_str::\u003cProjectMeta\u003e(\u0026text).ok());\n        let now = now_ms();\n        let meta = ProjectMeta {\n            schema_version: SCHEMA_VERSION,\n            cwd: self.cwd.display().to_string(),\n            first_seen: previous.as_ref().map(|meta| meta.first_seen).unwrap_or(now),\n            last_seen: now,\n        };\n        let text = toml::to_string(\u0026meta).context(\"serialize project.toml\")?;\n        fs::write(\u0026meta_path, text)\n            .with_context(|| format!(\"write project metadata {}\", meta_path.display()))?;\n        Ok(())\n    }\n\n    pub fn extension_workspace(\u0026self) -\u003e \u0026Path {\n        \u0026self.cwd\n    }\n}\n\npub fn load_config() -\u003e Result\u003cGlobalConfig\u003e {\n    let path = global_root()?.join(\"config.toml\");\n    if !path.is_file() {\n        return Ok(GlobalConfig::default());\n    }\n    let text =\n        fs::read_to_string(\u0026path).with_context(|| format!(\"read config {}\", path.display()))?;\n    toml::from_str(\u0026text).with_context(|| format!(\"parse config {}\", path.display()))\n}\n\npub(crate) fn global_root() -\u003e Result\u003cPathBuf\u003e {\n    if let Ok(home) = std::env::var(\"NIUCODE_HOME\") {\n        if !home.trim().is_empty() {\n            return Ok(PathBuf::from(home));\n        }\n    }\n    let Some(home) = std::env::var_os(\"HOME\") else {\n        bail!(\"cannot determine niucode workspace: HOME is not set (set NIUCODE_HOME)\");\n    };\n    Ok(PathBuf::from(home).join(\".niucode\"))\n}\n\nfn project_key(cwd: \u0026Path) -\u003e String {\n    let basename = cwd\n        .file_name()\n        .and_then(|name| name.to_str())\n        .filter(|name| !name.is_empty())\n        .unwrap_or(\"project\");\n    let mut safe = String::new();\n    for character in basename.chars().take(40) {\n        if character.is_ascii_alphanumeric() || matches!(character, '-' | '_') {\n            safe.push(character);\n        } else {\n            safe.push('-');\n        }\n    }\n    if safe.is_empty() {\n        safe.push_str(\"project\");\n    }\n    let mut hash = 0xcbf2_9ce4_8422_2325_u64;\n    for byte in cwd.as_os_str().to_string_lossy().as_bytes() {\n        hash ^= u64::from(*byte);\n        hash = hash.wrapping_mul(0x0000_0100_0000_01b3);\n    }\n    format!(\"{safe}-{hash:08x}\")\n}\n\n#[cfg(test)]\nmod tests {\n    use std::time::{SystemTime, UNIX_EPOCH};\n\n    use super::*;\n\n    fn temp_dir(tag: \u0026str) -\u003e PathBuf {\n        let stamp = SystemTime::now()\n            .duration_since(UNIX_EPOCH)\n            .unwrap_or_default()\n            .as_nanos();\n        let path = std::env::temp_dir().join(format!(\"niucode-workspace-{tag}-{stamp}\"));\n        let _ = fs::remove_dir_all(\u0026path);\n        fs::create_dir_all(\u0026path).expect(\"temp dir\");\n        path\n    }\n\n    #[test]\n    fn project_keys_are_stable_and_readable() {\n        let path = Path::new(\"/tmp/My Project\");\n        let key = project_key(path);\n        assert!(key.starts_with(\"My-Project-\"));\n        assert_eq!(key, project_key(path));\n        assert_ne!(key, project_key(Path::new(\"/tmp/My-Project\")));\n    }\n\n    #[test]\n    fn workspace_never_creates_a_project_local_directory() {\n        let root = temp_dir(\"root\");\n        let cwd = temp_dir(\"project\");\n        let workspace = Workspace::from_root(root.clone(), cwd.clone()).expect(\"workspace\");\n        assert!(!cwd.join(\".niucode\").exists());\n        assert!(workspace.sessions.starts_with(root.join(\"projects\")));\n","truncated":true},{"path":"crates/niucode-cli/src/tui.rs","language":"rust","text":"//! Linear in-process TUI.\n//!\n//! It only consumes `AgentEvent`s and calls the same `run_with_history` entry\n//! point as headless exec. No loop internals are imported here.\n\nuse std::fs::File;\nuse std::io::{BufRead, BufReader, IsTerminal, Write};\nuse std::path::{Path, PathBuf};\nuse std::sync::Arc;\nuse std::time::{Duration, Instant, UNIX_EPOCH};\n\nuse anyhow::{bail, Context, Result};\nuse crossterm::cursor::{MoveTo, Show};\nuse crossterm::event::{\n    self, DisableBracketedPaste, DisableMouseCapture, Event as TerminalEvent, KeyCode, KeyEvent,\n    KeyModifiers,\n};\nuse crossterm::execute;\nuse crossterm::terminal::{self, Clear, ClearType, EnterAlternateScreen, LeaveAlternateScreen};\nuse niucode_agent::{\n    build_handoff, estimate_context, project_history, run_with_history, AgentConfig, AgentEvent,\n    ApprovalMode, ApprovalRequest, RunOutcome,\n};\nuse niucode_core::{load, now_ms, Event, EventId, SessionLog, Usage};\nuse niucode_provider::{ChatMessage, ModelSelection, Provider};\nuse niucode_tools::{NetworkMode, SandboxMode, SandboxPolicy, Toolbox};\nuse similar::TextDiff;\n\nuse crate::diff::{clean_text, render_plain};\nuse crate::editor::{mouse_events_seen, Input, LineEditor};\nuse crate::goal::{self, GoalStatus, MAX_GOAL_TURNS};\nuse crate::inline::InlineEditor;\nuse crate::provider_factory::{available_model_choices, provider_choices, ProviderFactory};\nuse crate::review::{review_diff, ApprovalChoice};\nuse crate::session_ops;\nuse crate::skills;\nuse crate::slash::{\n    self, Command as SlashCommand, CommandRegistry, GoalAction, Parsed as SlashParsed, PlanAction,\n};\nuse crate::theme::{self, Theme, Tone};\nuse crate::workspace::Workspace;\n\nconst TOOL_OUTPUT_FOLD_LINES: usize = 12;\nconst TOOL_OUTPUT_FOLD_BYTES: usize = 2_000;\nconst WIDE_BANNER: usize = 62;\n\nconst LOGO: [\u0026str; 6] = [\n    \"███╗   ██╗██╗██╗   ██╗ ██████╗ ██████╗ ██████╗ ███████╗\",\n    \"████╗  ██║██║██║   ██║██╔════╝██╔═══██╗██╔══██╗██╔════╝\",\n    \"██╔██╗ ██║██║██║   ██║██║     ██║   ██║██║  ██║█████╗\",\n    \"██║╚██╗██║██║██║   ██║██║     ██║   ██║██║  ██║██╔══╝\",\n    \"██║ ╚████║██║╚██████╔╝╚██████╗╚██████╔╝██████╔╝███████╗\",\n    \"╚═╝  ╚═══╝╚═╝ ╚═════╝  ╚═════╝ ╚═════╝ ╚═════╝ ╚══════╝\",\n];\n\nenum PromptEditor {\n    Linear(LineEditor),\n    Inline(InlineEditor),\n}\n\nimpl PromptEditor {\n    fn read_line(\n        \u0026mut self,\n        raw_prompt: \u0026str,\n        styled_prompt: \u0026str,\n        footer: \u0026str,\n        theme: Theme,\n    ) -\u003e std::io::Result\u003cInput\u003e {\n        match self {\n            Self::Linear(editor) =\u003e editor.read_line(raw_prompt, styled_prompt, theme),\n            Self::Inline(editor) =\u003e editor.read_line(raw_prompt, styled_prompt, footer, theme),\n        }\n    }\n\n    fn set_models(\u0026mut self, models: Vec\u003cString\u003e) {\n        match self {\n            Self::Linear(editor) =\u003e editor.set_models(models),\n            Self::Inline(editor) =\u003e editor.set_models(models),\n        }\n    }\n\n    fn set_current_model(\u0026mut self, model: impl Into\u003cString\u003e) {\n        match self {\n            Self::Linear(editor) =\u003e editor.set_current_model(model),\n            Self::Inline(editor) =\u003e editor.set_current_model(model),\n        }\n    }\n\n    fn set_cwd(\u0026mut self, cwd: PathBuf) {\n        match self {\n            Self::Linear(_) =\u003e {}\n            Self::Inline(editor) =\u003e editor.set_cwd(cwd),\n        }\n    }\n\n    fn set_permissions(\u0026mut self, permissions: Vec\u003c(String, String)\u003e) {\n        match self {\n            Self::Linear(editor) =\u003e editor.set_permissions(permissions),\n            Self::Inline(editor) =\u003e editor.set_permissions(permissions),\n        }\n    }\n\n    fn set_skills(\u0026mut self, skills: Vec\u003cString\u003e) {\n        match self {\n            Self::Linear(editor) =\u003e editor.set_skills(skills),\n            Self::Inline(editor) =\u003e editor.set_skills(skills),\n        }\n    }\n\n    fn clear_history(\u0026mut self) {\n        match self {\n            Self::Linear(editor) =\u003e editor.clear_history(),\n            Self::Inline(editor) =\u003e editor.clear_history(),\n        }\n    }\n}\n\nstruct ToolEcho {\n    name: String,\n    summary: String,\n    output: String,\n}\n\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\nenum PermissionProfile {\n    Ask,\n    Review,\n    FullAccess,\n    Ci,\n}\n\nimpl PermissionProfile {\n    const ALL: [Self; 4] = [Self::Ask, Self::Review, Self::FullAccess, Self::Ci];\n\n    fn as_str(self) -\u003e \u0026'static str {\n        match self {\n            Self::Ask =\u003e \"ask\",\n            Self::Review =\u003e \"review\",\n            Self::FullAccess =\u003e \"full-access\",\n            Self::Ci =\u003e \"ci\",\n        }\n    }\n\n    fn parse(value: \u0026str) -\u003e Option\u003cSelf\u003e {\n        match value\n            .trim()\n            .trim_start_matches(':')\n            .to_ascii_lowercase()\n            .as_str()\n        {\n            \"ask\" =\u003e Some(Self::Ask),\n            \"review\" =\u003e Some(Self::Review),\n            \"full-access\" | \"full\" =\u003e Some(Self::FullAccess),\n            \"ci\" =\u003e Some(Self::Ci),\n            _ =\u003e None,\n        }\n    }\n\n    fn apply(self, config: \u0026mut AgentConfig) {\n        match self {\n            Self::Ask =\u003e {\n                config.sandbox = SandboxPolicy::new(SandboxMode::WorkspaceWrite, NetworkMode::Off);\n                config.approval = ApprovalMode::Ask;\n                config.allow_unsandboxed = false;\n            }\n            Self::Review =\u003e {\n                config.sandbox = SandboxPolicy::new(SandboxMode::WorkspaceWrite, NetworkMode::Off);\n                config.approval = ApprovalMode::OnFailure;\n                config.allow_unsandboxed = false;\n            }\n            Self::FullAccess =\u003e {\n                config.sandbox = SandboxPolicy::new(SandboxMode::FullAccess, NetworkMode::On);\n                config.approval = ApprovalMode::Never;\n                config.allow_unsandboxed = false;\n            }\n            Self::Ci =\u003e {\n                config.sandbox = SandboxPolicy::new(SandboxMode::ReadOnly, NetworkMode::Off);\n                config.approval = ApprovalMode::Never;\n                config.allow_unsandboxed = false;\n            }\n        }\n    }\n\n    fn description(self) -\u003e \u0026'static str {\n        match self {\n            Self::Ask =\u003e \"workspace-write · network off · ask before risk\",\n            Self::Review =\u003e \"workspace-write · network off · review failures\",\n            Self::FullAccess =\u003e \"full-access · network on · no approval\",\n            Self::Ci =\u003e \"read-only · network off · no approval\",\n        }\n    }\n}\n\n#[derive(Debug, Clone, Default)]\nstruct SessionUiState {\n    plan_mode: bool,\n    goal: Option\u003cString\u003e,\n    goal_run: bool,\n    goal_turns: usize,\n    pending_prompt: Option\u003cString\u003e,\n","truncated":true}]}],"relations":[{"from":"cli","to":"loop","label":"run"},{"from":"tui","to":"loop","label":"run"},{"from":"tui","to":"tools","label":"preview"},{"from":"loop","to":"context","label":"project / compact"},{"from":"loop","to":"providers","label":"stream"},{"from":"loop","to":"tools","label":"dispatch"},{"from":"loop","to":"session","label":"append"},{"from":"context","to":"session","label":"read"},{"from":"tools","to":"sandbox","label":"guard"},{"from":"cli","to":"auth","label":"resolve"},{"from":"loop","to":"extensions","label":"external tools"},{"from":"cli","to":"extensions","label":"mount"},{"from":"tui","to":"extensions","label":"mount"},{"from":"cli","to":"workspace","label":"resolve"}],"cards":[{"id":"M0-001","title":"Cargo workspace 与工具链","status":"done","milestone":"M0","module":null,"size":"S","priority":"P0","updated":"2026-10-20","completed":"2026-10-20","depends_on":[],"docs":[],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e三个 crate：\u003ccode\u003eniucode-core\u003c/code\u003e、\u003ccode\u003eniucode-cli\u003c/code\u003e、\u003ccode\u003extask\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e统一 edition、依赖版本和 workspace lint 入口。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ecargo xtask dashboard\u003c/code\u003e 作为仓库工具入口。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ecargo test --workspace\u003c/code\u003e 全绿。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ecargo xtask dashboard\u003c/code\u003e 可重复执行。\u003c/li\u003e\n\u003cli\u003e核心 crate 不依赖 CLI 或 UI。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003e先保持三个 crate。等 provider、tools、sandbox 真正落地后再拆，避免空 crate。\u003c/p\u003e\n","path":"docs/board/M0-001-workspace.md"},{"id":"M0-002","title":"事件模型与 JSONL 会话日志","status":"done","milestone":"M0","module":"session","size":"M","priority":"P0","updated":"2026-10-20","completed":"2026-10-20","depends_on":[],"docs":["adr-0002"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eEvent\u003c/code\u003e 枚举覆盖 session、user、assistant、tool result、turn end、compaction。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eSessionLog\u003c/code\u003e 只追加，每条事件立即 flush。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eload\u003c/code\u003e 逐行解码，坏行变成 warning，不丢整份历史。\u003c/li\u003e\n\u003cli\u003e单测覆盖 round-trip、坏尾行、空行。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n写入后重新加载，事件序列完全一致。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n最后一行损坏时，前面的历史仍可读。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003eniucode session show\u003c/code\u003e 能打印事件类型和数量。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003e时间戳统一为 Unix 毫秒。\u003ccode\u003ecompaction\u003c/code\u003e 记录被替换的事件数量，后续 resume 用它判断投影边界。\u003c/p\u003e\n","path":"docs/board/M0-002-session-log.md"},{"id":"M0-003","title":"离线项目看板 v0","status":"done","milestone":"M0","module":"dashboard","size":"L","priority":"P1","updated":"2026-10-20","completed":"2026-10-20","depends_on":["M0-001"],"docs":["readme"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e三栏壳：里程碑导航 / 画布 / 详情。\u003c/li\u003e\n\u003cli\u003e四个视图：Board、Architecture、Docs、Timeline。\u003c/li\u003e\n\u003cli\u003e数据源：\u003ccode\u003edocs/dashboard/project.json\u003c/code\u003e + 一卡一文件的 TOML frontmatter。\u003c/li\u003e\n\u003cli\u003e构建为单个 \u003ccode\u003edocs/index.html\u003c/code\u003e，无 CDN、无运行时 fetch，\u003ccode\u003efile://\u003c/code\u003e 可开。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e--check\u003c/code\u003e 校验引用、状态和生成物是否过期。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n双击 \u003ccode\u003edocs/index.html\u003c/code\u003e 能看到真实 M0 卡片。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n架构图展示模块状态和依赖箭头。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nADR 与架构文档能在右栏渲染。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003ecargo xtask dashboard --check\u003c/code\u003e 在生成物过期时失败。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003e浏览器只读，不提供拖拽回写。状态变更走仓库，避免看板变成第二个真相源。后续由 \u003ccode\u003eM0-010\u003c/code\u003e 改为 Architecture 优先。\u003c/p\u003e\n","path":"docs/board/M0-003-dashboard.md"},{"id":"M0-004","title":"CLI 骨架与会话命令","status":"done","milestone":"M0","module":"cli","size":"S","priority":"P0","updated":"2026-10-20","completed":"2026-10-20","depends_on":["M0-001","M0-002"],"docs":[],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eniucode\u003c/code\u003e 无参数时打印版本、状态、会话目录和下一步。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eniucode session new\u003c/code\u003e 创建会话并写入 \u003cc
