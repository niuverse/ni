":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003e~/.agents/skills\u003c/code\u003e + 项目 \u003ccode\u003e.agents/skills\u003c/code\u003e 的 \u003ccode\u003eSKILL.md\u003c/code\u003e 发现。\u003c/li\u003e\n\u003cli\u003e最小 YAML frontmatter parser。\u003c/li\u003e\n\u003cli\u003e全局默认可信；项目 digest 信任。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e/skills\u003c/code\u003e 列表与 trust/untrust。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e$name\u003c/code\u003e 激活块 + 只读 roots，正文按需 read。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n发现/解析/排序；无项目 \u003ccode\u003e.niucode/skills\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n项目 skill 未信任时不激活。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003e/skills trust|untrust\u003c/code\u003e 写 digest；全局无需信任。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003e$name\u003c/code\u003e 只注入路径/描述；read roots 允许读 SKILL.md。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n项目信任经过 M4-007 capability gate 对应的显式信任流程。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003e$\u003c/code\u003e 输入补全（linear + inline，按信任过滤）。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eskills.rs\u003c/code\u003e 负责 discovery/YAML/digest/trust store。\u003c/li\u003e\n\u003cli\u003eToolbox \u003ccode\u003eread_roots\u003c/code\u003e 只放宽 read；write 仍 workspace 严格。\u003c/li\u003e\n\u003cli\u003e单测覆盖项目未信任/信任后激活与 read roots；M4-007 已提供扩展隔离。\u003c/li\u003e\n\u003c/ul\u003e\n","path":"docs/board/M5-007-skills.md"},{"id":"M5-008","title":"Tool metadata and loop phase seam","status":"done","milestone":"M5","module":"tools","size":"S","priority":"P1","updated":"2026-10-20","completed":"2026-10-20","depends_on":["M4-007"],"docs":["adr-0027","architecture"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e内置工具 risk/effect/read_only metadata。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e/tools\u003c/code\u003e 审计视图。\u003c/li\u003e\n\u003cli\u003eLoopPhase observer 事件。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nread/grep/glob low/read；write/edit medium/write；bash/subagent high。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003e/tools\u003c/code\u003e 显示内置与 extension 未知风险。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nLoopPhase 覆盖 project/request/stream/tool/turn/done。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nmetadata 单测。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003emetadata 先观察，不改变 approval/sandbox。\u003c/li\u003e\n\u003cli\u003eLoopPhase 只在 AgentEvent 流中，不写 session。\u003c/li\u003e\n\u003c/ul\u003e\n","path":"docs/board/M5-008-tool-metadata.md"},{"id":"M5-009","title":"Interactive /resume picker","status":"done","milestone":"M5","module":"tui","size":"S","priority":"P1","updated":"2026-10-20","completed":"2026-10-20","depends_on":["M5-002"],"docs":["tui"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003e/resume\u003c/code\u003e 无参数时进入上下选择列表，而不是只打印文本。\u003c/li\u003e\n\u003cli\u003e非 TTY 保留文本列表。\u003c/li\u003e\n\u003cli\u003e临时 alternate screen，退出恢复 transcript。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n↑↓/j/k 选择，Enter 恢复，Esc 取消。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n标题/provider/model/相对时间。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003e/resume --all\u003c/code\u003e 仍跨项目。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n非 TTY 回退文本列表。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\ntmux 抓屏验证列表对齐（raw mode 下使用 \u003ccode\u003e\\r\\n\u003c/code\u003e）。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003epicker 使用 alternate screen；不污染 transcript 光标。\u003c/li\u003e\n\u003cli\u003e非 TTY 路径不做交互。\u003c/li\u003e\n\u003c/ul\u003e\n","path":"docs/board/M5-009-resume-picker.md"}],"docs":[{"id":"architecture","title":"架构","kind":"doc","status":"living","order":10,"summary":"niucode 的边界、数据流、事件生命周期与明确不做的事。","body_html":"\u003ch2\u003e一句话\u003c/h2\u003e\n\u003cp\u003eniucode 是一个围绕 \u003cstrong\u003eappend-only 事件日志\u003c/strong\u003e 构建的最小 coding agent harness：一个 turn 引擎、一层薄 provider 适配、工具面、三条安全轴。当前最小闭环已有六个基础工具和一个只读 subagent 编排工具，Linux bash 默认走 bwrap 沙箱。\u003c/p\u003e\n\u003ch2\u003e设计约束\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e日志是唯一真相。\u003c/strong\u003e 内存里的对话是日志的投影。任何不落盘的状态，进程退出即不存在。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e上下文是产品。\u003c/strong\u003e 模型看到什么、按什么顺序看到、何时压缩，决定了 agent 的上限。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e工具少而锋利。\u003c/strong\u003e 每多一个工具，就多一份 schema、一类失败模式和一段 prompt。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eprovider 层要薄。\u003c/strong\u003e 只归一化够用的部分，不试图抹平所有 wire format 怪癖。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e安全边界要诚实。\u003c/strong\u003e 进程内路径校验不是沙箱；bash 能绕过的东西，不能假装它不能。\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e数据流\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003euser input\n   │\n   ▼\n CLI ──► loop ──► context.project(log, budget) ──► provider.stream\n            │                                          │\n            │                                     StreamEvent\n            │                                          ▼\n            │                                   assistant message\n            │                                          │\n            ├────────────── tool calls ◄───────────────┘\n            │                   │\n            │                   ├──► sandbox.guard\n            │                   └──► tools.dispatch (read-only 并发，写串行)\n            │\n            └──► session.append(every event, flush)\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e一个 turn 的边界是 \u003ccode\u003euser_message\u003c/code\u003e 到 \u003ccode\u003eturn_end\u003c/code\u003e。loop 只做四件事：投影、请求、派发、追加。它不解析 SSE，不实现工具，不渲染 UI。\u003c/p\u003e\n\u003ch2\u003e事件生命周期\u003c/h2\u003e\n\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e事件\u003c/th\u003e\u003cth\u003e何时写入\u003c/th\u003e\u003cth\u003e关键字段\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003esession_start\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e创建会话\u003c/td\u003e\u003ctd\u003eid、cwd、model\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003euser_message\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e用户输入\u003c/td\u003e\u003ctd\u003etext\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eassistant_message\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e一次模型响应结束\u003c/td\u003e\u003ctd\u003etext、reasoning、tool_calls\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003etool_result\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e每个工具执行完\u003c/td\u003e\u003ctd\u003ecall_id、ok、output\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eturn_end\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e一个 turn 结束\u003c/td\u003e\u003ctd\u003eusage（含 cached / reasoning）\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003einit_proposal\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003e/init\u003c/code\u003e 生成完整提案\u003c/td\u003e\u003ctd\u003econtent、path\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003einstructions\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e每次 run 发现 AGENTS.md\u003c/td\u003e\u003ctd\u003esources、digest\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003efork\u003c/code\u003e\u003c/td\u003e\u003ctd\u003efork 出新 session\u003c/td\u003e\u003ctd\u003eparent、parent_event\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003esubagent_spawn\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e父 session 启动只读子任务\u003c/td\u003e\u003ctd\u003eid、call_id、task、session、预算\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003esubagent_result\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e子任务结束\u003c/td\u003e\u003ctd\u003eid、ok、summary、session、turns、usage\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eplan_mode\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eplan mode 开关\u003c/td\u003e\u003ctd\u003eactive\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003egoal_set\u003c/code\u003e / \u003ccode\u003egoal_cleared\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e会话目标\u003c/td\u003e\u003ctd\u003etext / 清除\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003egoal_verdict\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003e/goal run\u003c/code\u003e evaluator 结论\u003c/td\u003e\u003ctd\u003estatus、reason\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003emodel_change\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e运行时模型选择\u003c/td\u003e\u003ctd\u003eprovider、model\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003epermission_change\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e运行时权限 profile\u003c/td\u003e\u003ctd\u003eprofile、sandbox、approval、network\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eextension_mount\u003c/code\u003e / \u003ccode\u003eextension_unmount\u003c/code\u003e\u003c/td\u003e\u003ctd\u003esidecar 挂载/卸载\u003c/td\u003e\u003ctd\u003ename、version、tools、capabilities、digest、workers\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eextension_error\u003c/code\u003e\u003c/td\u003e\u003ctd\u003esidecar 挂载/调用失败\u003c/td\u003e\u003ctd\u003ename、message\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003ecompaction\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e上下文压缩\u003c/td\u003e\u003ctd\u003esummary、upto、before/after tokens\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003esession_end\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e正常退出\u003c/td\u003e\u003ctd\u003ets\u003c/td\u003e\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e\u003ccode\u003ecompaction.upto\u003c/code\u003e 是事件日志的绝对下标：摘要替换 \u003ccode\u003eevents[..upto]\u003c/code\u003e。compaction 事件本身追加在日志末尾，但投影时在 \u003ccode\u003eupto\u003c/code\u003e 处插入摘要。resume 只使用最后一个 compaction；原始事件永远保留。\u003c/p\u003e\n\u003cp\u003e事件 ID 是解码事件的 1-based 序号（\u003ccode\u003ee000012\u003c/code\u003e），不写进事件内容；append-only 保证稳定，坏行不制造 ID。\u003ccode\u003ereplay\u003c/code\u003e 按 user turn 重建投影，不调用模型；\u003ccode\u003efork\u003c/code\u003e 复制前缀并在末尾追加 \u003ccode\u003efork\u003c/code\u003e 事件，前缀下标和 \u003ccode\u003ecompaction.upto\u003c/code\u003e 不变。见 ADR-0010。\u003c/p\u003e\n\u003ch2\u003e模块边界\u003c/h2\u003e\n\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e层\u003c/th\u003e\u003cth\u003e模块\u003c/th\u003e\u003cth\u003e职责\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\n\u003ctr\u003e\u003ctd\u003eInterface\u003c/td\u003e\u003ctd\u003eCLI / TUI\u003c/td\u003e\u003ctd\u003e参数、生命周期、渲染；不持有对话状态\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eEngine\u003c/td\u003e\u003ctd\u003eLoop / Context\u003c/td\u003e\u003ctd\u003e编排、投影、压缩；不碰 wire format\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eAdapters\u003c/td\u003e\u003ctd\u003eProviders / Tools / Sandbox / Auth\u003c/td\u003e\u003ctd\u003e外部世界与凭证的适配；不依赖 UI\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eState\u003c/td\u003e\u003ctd\u003eSession\u003c/td\u003e\u003ctd\u003e追加、加载、容错；不解释业务\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eEngineering\u003c/td\u003e\u003ctd\u003eDashboard\u003c/td\u003e\u003ctd\u003e架构阅读面（默认 Architecture）；不参与运行时\u003c/td\u003e\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e依赖方向只能向下：Interface → Engine → Adapters / State。\u003ccode\u003eniucode-core\u003c/code\u003e 不依赖 \u003ccode\u003eniucode-cli\u003c/code\u003e，TUI 不 import loop 内部。\u003c/p\u003e\n\u003ch2\u003e工具面\u003c/h2\u003e\n\u003cp\u003e六个基础工具：\u003ccode\u003eread\u003c/code\u003e、\u003ccode\u003ewrite\u003c/code\u003e、\u003ccode\u003eedit\u003c/code\u003e、\u003ccode\u003egrep\u003c/code\u003e、\u003ccode\u003eglob\u003c/code\u003e、\u003ccode\u003ebash\u003c/code\u003e；M3 增加一个只读 \u003ccode\u003esubagent\u003c/code\u003e 编排工具。\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eread\u003c/code\u003e 带行号，单次上限约 2000 行 / 50KB，截断时给出续读方式。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eedit\u003c/code\u003e 用精确字符串替换，要求唯一匹配，返回小 diff；行号会漂移，不用行号。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ebash\u003c/code\u003e 只回尾部约 20KB，完整输出落临时文件；超时杀进程组，不留孤儿。\u003c/li\u003e\n\u003cli\u003e工具错误是 prompt 的一部分：写清楚\"为什么失败、下一步怎么做\"。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003ccode\u003ewrite\u003c/code\u003e / \u003ccode\u003eedit\u003c/code\u003e 前必须读过目标文件。这是策略层强制，不是提示词建议。\u003c/p\u003e\n\u003cp\u003e审批前由 \u003ccode\u003eToolbox::preview\u003c/code\u003e 读取真实文件，生成结构化 unified diff（文件、hunk、行号、增删行）。loop 只转发 \u003ccode\u003eChangePreview\u003c/code\u003e，TUI 与 headless 各自渲染；UI 不复制路径策略，预览也不修改工作区。决策见 ADR-0007。\u003c/p\u003e\n\u003ch2\u003eSubagent\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003esubagent\u003c/code\u003e 是第七个工具，也是唯一的编排工具：接收 1–4 个任务，并行运行，每个任务一个独立 session 日志。\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eprofile: explore\u003c/code\u003e（默认）：\u003ccode\u003eread\u003c/code\u003e / \u003ccode\u003egrep\u003c/code\u003e / \u003ccode\u003eglob\u003c/code\u003e + 只读 external tools；sandbox read-only + network off；没有 write/edit/bash，也没有 \u003ccode\u003esubagent\u003c/code\u003e，不能递归。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eprofile: worker\u003c/code\u003e：\u003ccode\u003eread\u003c/code\u003e / \u003ccode\u003ewrite\u003c/code\u003e / \u003ccode\u003eedit\u003c/code\u003e / \u003ccode\u003egrep\u003c/code\u003e / \u003ccode\u003eglob\u003c/code\u003e / \u003ccode\u003ebash\u003c/code\u003e + 只读 external tools；继承父 sandbox；\u003ccode\u003ewrite_scope\u003c/code\u003e 约束 write/edit 路径。\u003c/li\u003e\n\u003cli\u003eW1：父和所有 Worker 共享一个全局 write lock；write/edit/bash 串行。bash 不受 path scope 约束。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eprofile: inherit\u003c/code\u003e 需要显式 \u003ccode\u003e--allow-subagent-inheritance\u003c/code\u003e；复制父工具面，但剥离 \u003ccode\u003esubagent\u003c/code\u003e，不能递归。\u003c/li\u003e\n\u003cli\u003emutating external tools 和 full-access 不默认下放给子 agent。\u003c/li\u003e\n\u003cli\u003e父 session 记录 \u003ccode\u003esubagent_spawn\u003c/code\u003e（含 profile）/ \u003ccode\u003esubagent_result\u003c/code\u003e，包含子 session 路径；子 \u003ccode\u003esession_start.id\u003c/code\u003e 等于 spawn id。\u003c/li\u003e\n\u003cli\u003e父模型只收到一条 tool_result：每个任务的摘要 + 日志路径；完整 transcript 留在子日志里。\u003c/li\u003e\n\u003cli\u003e每个任务有独立 \u003ccode\u003emax_steps\u003c/code\u003e、\u003ccode\u003etimeout_secs\u003c/code\u003e 和 context budget；超时/失败返回 \u003ccode\u003eok=false\u003c/code\u003e，父 agent 继续。决策见 ADR-0011/0014。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003ePlan mode 与 Goal\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003e/plan\u003c/code\u003e 是运行时 mode，不是 profile：进入后 tool allowlist 收窄到 \u003ccode\u003eread/grep/glob\u003c/code\u003e，system prompt 注入只读计划指令；退出恢复原 profile。\u003ccode\u003e/goal \u0026lt;condition\u0026gt;\u003c/code\u003e 在 TUI 中设置目标并立即启动 goal run（最多 6 轮）；\u003ccode\u003e/goal run\u003c/code\u003e 重新启动已有目标，\u003ccode\u003e/goal stop\u003c/code\u003e / \u003ccode\u003e/goal clear\u003c/code\u003e 停止。每轮结束用独立无工具 evaluator 写 \u003ccode\u003egoal_verdict\u003c/code\u003e；goal 不改变权限。headless \u003ccode\u003eexec --goal\u003c/code\u003e 是 M4-008。决策见 ADR-0014。\u003c/p\u003e\n\u003ch2\u003eExternal tools\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003eniucode-extension\u003c/code\u003e 是一个 session 级 sidecar host。它在 \u003ccode\u003e\u0026lt;workspace\u0026gt;/.niucode/extensions/*.toml\u003c/code\u003e 发现 manifest，spawn 本地进程，通过 line-delimited JSON-RPC 完成 \u003ccode\u003einitialize\u003c/code\u003e / \u003ccode\u003etools/call\u003c/code\u003e / \u003ccode\u003eshutdown\u003c/code\u003e。工具在 \u003ccode\u003einitialize\u003c/code\u003e 时注册，合并进 agent 的 tool specs；调用按插件串行（M4-002 的并发模型是保守的）。sidecar 启动时 \u003ccode\u003eenv_clear\u003c/code\u003e，不继承 API key；超时/崩溃返回 tool error。父 session 追加 \u003ccode\u003eextension_mount\u003c/code\u003e / \u003ccode\u003eextension_unmount\u003c/code\u003e / \u003ccode\u003eextension_error\u003c/code\u003e。没有 manifest 时不产生任何进程。capability sandbox、worker pool、subagent 共享 host 是 M4-007。决策见 ADR-0013。\u003c/p\u003e\n\u003ch2\u003eJSONL 协议\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003eniucode exec --json\u003c/code\u003e 在 stdout 输出一行一个 JSON 事件，第一行 \u003ccode\u003estart\u003c/code\u003e 带 \u003ccode\u003eprotocol: 1\u003c/code\u003e。事件类型与 \u003ccode\u003eAgentEvent\u003c/code\u003e 同构，另有 \u003ccode\u003estart\u003c/code\u003e / \u003ccode\u003edone\u003c/code\u003e / \u003ccode\u003ecancelled\u003c/code\u003e / \u003ccode\u003eerror\u003c/code\u003e。\u003ccode\u003etool_result\u003c/code\u003e 只含 summary，完整 output 在 session 日志。stderr 保留人类诊断；\u003ccode\u003e--approval ask\u003c/code\u003e 在 JSON 模式下被拒绝。决策见 ADR-0012。\u003c/p\u003e\n\u003ch2\u003e上下文与压缩\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eproject_history(events)\u003c/code\u003e 是全量日志到模型上下文的有损投影；\u003ccode\u003ecompaction\u003c/code\u003e 在 cutoff 处插入一条 system handoff。\u003c/li\u003e\n\u003cli\u003esystem + tools + 历史前缀保持稳定，易变内容放末尾，以命中 provider 的 prompt cache。\u003c/li\u003e\n\u003cli\u003e每次 run 从 cwd 向上发现 \u003ccode\u003eAGENTS.md\u003c/code\u003e，近者优先，追加在稳定 base system prompt 之后；修改后下一次用户 turn 生效。加载结果记录为 \u003ccode\u003einstructions\u003c/code\u003e 事件（sources + digest），用于定位 prompt cache 前缀变化。\u003c/li\u003e\n\u003cli\u003e到估算预算 75% 触发 compaction：默认保留最近 3 个 user turn 原文，其余生成确定性 handoff：目标、上一次请求、已完成、改动文件、最近助手状态、近期失败、约束、下一步。\u003c/li\u003e\n\u003cli\u003e单个 turn 很长时，回退到该 turn 内安全的 assistant 边界，保留尾部；tool call 和 tool result 不会被切开。\u003c/li\u003e\n\u003cli\u003e先构造候选投影并确认 token 估算下降，才把 \u003ccode\u003ecompaction\u003c/code\u003e 事件落盘；失败保留原上下文并提示。\u003c/li\u003e\n\u003cli\u003e压缩结果落成事件，不修改历史。token 估算见 ADR-0008。\u003c/li\u003e\n\u003cli\u003e缓存命中率由 \u003ccode\u003eturn_end.usage\u003c/code\u003e 的 cached / input 派生，TUI、exec 与 \u003ccode\u003esession show\u003c/code\u003e 直接显示；不写第二份 metrics 文件。见 ADR-0009。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e安全\u003c/h2\u003e\n\u003cp\u003e三条正交的轴，不要揉成一个开关：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003esandbox\u003c/strong\u003e：read-only / workspace-write / full-access。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eapproval\u003c/strong\u003e：ask / on-failure / never。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003enetwork\u003c/strong\u003e：on / off。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eLinux 第一后端用 bwrap namespace：只读根 + workspace bind，network off 用独立 net namespace。没有 bwrap 时，\u003ccode\u003enever\u003c/code\u003e 启动失败，\u003ccode\u003eon-failure\u003c/code\u003e / \u003ccode\u003eask\u003c/code\u003e 降级为逐工具审批并提示网络策略未执行。landlock/seccomp 与 macOS seatbelt 是后续后端，见 ADR-0006。\u003c/p\u003e\n\u003cp\u003e路径策略与 shell 隔离分开：文件工具在进程内 canonicalize；bash 的外部隔离由 bwrap 提供。两者都不是 VM，工作区外文件默认可读。\u003c/p\u003e\n\u003ch2\u003e明确不做\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e不做通用 agent framework，不为未知用例抽象。\u003c/li\u003e\n\u003cli\u003e不做通用 everything-is-plugin、MCP 全家桶、多 provider 全家桶、通用多 agent 框架；M4 只做 capability 级 external tools/commands（ADR-0013），loop/context/policy/auth 仍在 kernel。\u003c/li\u003e\n\u003cli\u003e不在离线项目看板里加运行时 Runs / metrics 视图；那属于未来的 runtime viewer（ADR-0009）。\u003c/li\u003e\n\u003cli\u003e不做浏览器里可编辑的看板；状态变更走仓库。\u003c/li\u003e\n\u003cli\u003e不在 loop 里做 prompt 字符串拼接；prompt 是独立、可版本化的输入。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e开放问题\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ccode\u003eassistant_message\u003c/code\u003e 是否要保留 reasoning 原文，还是只保留摘要？不同 provider 的回传要求不同。\u003c/li\u003e\n\u003cli\u003e确定性 handoff 在什么任务上开始丢意图？需要模型生成 handoff 时，如何限制额外调用成本？\u003c/li\u003e\n\u003cli\u003e工具并行度：只读并发之外，是否允许不同文件的写并发？\u003c/li\u003e\n\u003cli\u003e事件 schema 的演进策略：加字段兼容，还是显式版本迁移？\u003c/li\u003e\n\u003c/ol\u003e\n","path":"docs/architecture.md","excerpt":"niucode 的边界、数据流、事件生命周期与明确不做的事。"},{"id":"roadmap","title":"Roadmap 与学习路径","kind":"doc","status":"living","order":15,"summary":"从 M0 到可用 coding harness：组件地图、自研/用库边界，以及每个阶段应该真正学会的东西。","body_html":"\u003ch2\u003e目标\u003c/h2\u003e\n\u003cp\u003e不是“所有 agent 功能”，而是一个\u003cstrong\u003e可靠的单 agent coding harness\u003c/strong\u003e：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e给一个真实 repo 和一个 issue，agent 能定位、修改、跑测试、给出 diff；失败能 resume；同一 fixture 可以离线回归。\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e平台层（MCP、插件、subagent、多 provider、长期记忆）不是“完整”的必要条件；先证明单 agent 闭环。\u003c/p\u003e\n\u003ch2\u003e组件地图\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eRuntime / loop\u003c/strong\u003e（M0-008）— 自研 Command/Event 与 turn 状态机；用 tokio。学会：画出命令/事件生命周期，说明取消发生在哪。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eProvider\u003c/strong\u003e（M0-005）— 自研流式归一化、SSE 映射、错误分类；用 reqwest。学会：解释重试边界和 token 账本。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eTools\u003c/strong\u003e（M0-006/007）— 自研注册表与六个工具；用 serde_json / ignore / globset。学会：证明工具输出不会撑爆上下文。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eContext\u003c/strong\u003e（M2-001/002）— 自研 projection、compaction、AGENTS.md 合并。学会：解释“日志全量、上下文有损”。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eState\u003c/strong\u003e（M0-002/009）— 自研 Event、JSONL、resume、fork；用 serde_json。学会：离线回放一次真实 turn。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eAuth\u003c/strong\u003e（M0-011）— 自研 env → keyring → 0600 文件的解析与回退；用 OS keyring。学会：解释密钥为什么不能进日志，以及 keyring 失败时如何安全降级。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSafety\u003c/strong\u003e（M1-002）— 自研策略与审批链；用 landlock/seccomp 或 bubblewrap。学会：演示一次拒绝写入/联网。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eClients\u003c/strong\u003e（M0-004 / M1-001 / M1.5）— 自研 CLI 命令和事件到视图的映射；用 clap / ratatui。学会：同一事件流渲染两种界面。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eObservability\u003c/strong\u003e（M2-002）— 自研 usage 事件、metrics JSONL。学会：定位一次慢 turn。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eEvaluation\u003c/strong\u003e（M0-009）— 自研 scripted provider、fixture、golden transcript。学会：同一输入两次回放行为一致。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e自研 / 用库的边界\u003c/h2\u003e\n\u003cp\u003e判断标准：\u003cstrong\u003e“这部分决定 agent 的行为质量吗？”\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e决定 → 自己写：loop、context、tool protocol、event log、approval、eval。\u003c/li\u003e\n\u003cli\u003e不决定 → 用库：HTTP、async runtime、CLI 解析、TUI 渲染、diff、glob、Markdown。\u003c/li\u003e\n\u003cli\u003e安全 → 策略自己写，OS 原语用库；不要手写 syscall。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e顺序\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003eM0   CLI 骨架 / 事件日志 / auth / dashboard / minimal exec\n     └─ M0-005 provider（scripted + OpenAI-compatible SSE）\n     └─ M0-006 文件工具\n     └─ M0-007 bash（超时、进程组、输出预算）\n     └─ M0-008 loop + niucode exec（SessionRuntime 边界）\n     └─ M0-009 resume + fixture\nM1   TUI / approval / sandbox / diff\nM1.5 只读 Web Session Viewer（JSONL → turn/tool/diff）\nM2   compaction / AGENTS.md / cache 指标 / Runs 视图\nM3   replay / fork / subagent（视需要）\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e每个阶段都必须能离线测试，不能依赖真实 API 才能验证 loop。\u003c/p\u003e\n\u003ch2\u003e学习检查点\u003c/h2\u003e\n\u003cp\u003e完成一个阶段时，应该能回答：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eProvider\u003c/strong\u003e：SSE 的 delta 如何合并成一条 assistant message？什么错误可以在 turn 边界重试，什么不能？\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eTools\u003c/strong\u003e：工具输出如何截断？read-before-write 为什么必须是策略而不是提示词？两个写工具并发会发生什么？\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eLoop\u003c/strong\u003e：取消发生在 provider 流、工具执行、日志写入三个位置时，分别怎么处理？\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eEval\u003c/strong\u003e：如何在不烧 token 的情况下复现一个 turn？回放和真实调用差在哪？\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSandbox\u003c/strong\u003e：路径校验、shell 隔离、网络关闭分别能防住什么，防不住什么？\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eContext\u003c/strong\u003e：压缩后模型看到的历史和日志里的历史为什么可以不同？cache 前缀为什么不能随手改？\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eObservability\u003c/strong\u003e：一个 turn 变慢时，如何区分模型、工具和 harness 自身？\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eM0 完成定义\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eniucode exec \"\u0026lt;task\u0026gt;\"\u003c/code\u003e 能在真实 repo 里完成一个小修改并跑测试。\u003c/li\u003e\n\u003cli\u003esession 可 resume；坏尾行不丢历史。\u003c/li\u003e\n\u003cli\u003e工具有输出上限；bash 能超时杀进程组。\u003c/li\u003e\n\u003cli\u003e至少一个 scripted provider 的离线回归测试。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ecargo xtask dashboard --check\u003c/code\u003e 通过，架构图和 ADR 反映当前实现。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e明确后置\u003c/h2\u003e\n\u003cp\u003eMCP、插件系统、多 provider 全家桶、长期记忆、调度器、多人协作、Web 编辑架构图。等出现真实需求，再写 ADR。\u003c/p\u003e\n","path":"docs/roadmap.md","excerpt":"从 M0 到可用 coding harness：组件地图、自研/用库边界，以及每个阶段应该真正学会的东西。"},{"id":"adr-0001","title":"ADR-0001：Rust 作为核心语言","kind":"adr","status":"accepted","order":20,"summary":"性能优先不等于 loop 快几毫秒；Rust 换来的是启动、内存、分发和原生沙箱。","body_html":"\u003ch2\u003e状态\u003c/h2\u003e\n\u003cp\u003eAccepted · 2026-10-20\u003c/p\u003e\n\u003ch2\u003e背景\u003c/h2\u003e\n\u003cp\u003eniucode 是一个单二进制 CLI：长会话、流式子进程、沙箱、可能的多子代理。语言选型要在两端做取舍：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e运行时\u003c/strong\u003e：harness 自身耗时（SSE 解析、JSON、日志、调度）通常只占一个 turn 的 1–5ms，而模型 TTFT + 生成是 1–3s。换语言不会让 agent 明显变快。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e工程形态\u003c/strong\u003e：冷启动、常驻内存、单二进制分发、进程组/信号控制、原生沙箱，这些是 Rust 的真实优势。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e开发迭代\u003c/strong\u003e：Rust 的编译反馈和 async 设计摩擦，会让早期功能吞吐慢 1.5–2x；这是\"写功能慢\"，不是\"运行时慢\"。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e决策\u003c/h2\u003e\n\u003cp\u003e核心使用 Rust，workspace 拆分小 crate：\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003ecrates/\n  niucode-core/       # 事件、会话、loop、context\n  niucode-cli/        # 参数与生命周期\n  niucode-provider/   # 后续：wire adapters\n  niucode-tools/      # 后续：工具\n  niucode-sandbox/    # 后续：策略与平台隔离\n  xtask/         # 仓库工具（看板构建）\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2\u003e后果\u003c/h2\u003e\n\u003ch3\u003e正向\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e单静态二进制，启动 2–10ms，无 runtime 依赖。\u003c/li\u003e\n\u003cli\u003e常驻内存低，多 session / 子代理时线性成本可控。\u003c/li\u003e\n\u003cli\u003e进程组、超时、信号、fd 管理语义明确，取消链路可靠。\u003c/li\u003e\n\u003cli\u003elandlock / seccomp / seatbelt 可直接调用，不需要 native addon 或外部包装进程。\u003c/li\u003e\n\u003cli\u003e事件、状态机、工具 schema 适合强类型，后期重构成本低。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e负向\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e编译反馈比 TS 慢一个数量级。\u003c/li\u003e\n\u003cli\u003easync 流式状态机在接口未定型时摩擦大。\u003c/li\u003e\n\u003cli\u003eOpenAI / Anthropic 的 Rust SDK 不如 TS/Python 成熟，SSE 和事件映射要自己写。\u003c/li\u003e\n\u003cli\u003eTUI 迭代比 Ink/React 慢。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e缓解\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eworkspace 拆小 crate，\u003ccode\u003eniucode-core\u003c/code\u003e 不依赖 CLI / TUI，增量编译范围小。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ebacon\u003c/code\u003e / \u003ccode\u003ecargo-watch\u003c/code\u003e + \u003ccode\u003ecargo check\u003c/code\u003e 作为内循环；链接器用 mold/lld。\u003c/li\u003e\n\u003cli\u003e控制 proc-macro 依赖，provider 边界允许 \u003ccode\u003eserde_json::Value\u003c/code\u003e，内部强类型。\u003c/li\u003e\n\u003cli\u003eheadless first，TUI last；loop / tools 用 scripted provider 离线测试。\u003c/li\u003e\n\u003cli\u003econtext 逻辑写成纯函数 + fixture，改 prompt 策略不需要重编译整个 workspace。\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e备选方案\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eTypeScript / Bun\u003c/strong\u003e：迭代最快，官方 SDK 最全，TUI 生态好。运行时足够，但单二进制、内存和原生沙箱弱。若接下来数周的主要目标是高频试 context 策略，这是更快的选择。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eRust core + TS TUI（JSON-RPC）\u003c/strong\u003e：长期可行，但 v0 多一套协议、进程生命周期和错误映射，违背 minimal。等事件协议稳定后再考虑拆分。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePython\u003c/strong\u003e：原型最快，但分发、并发、类型约束和长会话内存都不占优。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e备注\u003c/h2\u003e\n\u003cp\u003e\"Rust 慢一倍\"指的是开发迭代速度，不是运行时。性能优先应当优化 prompt cache、工具输出体积、并行工具和 compaction，而不是期待换语言让模型响应变快。\u003c/p\u003e\n","path":"docs/adr/0001-rust-core.md","excerpt":"性能优先不等于 loop 快几毫秒；Rust 换来的是启动、内存、分发和原生沙箱。"},{"id":"adr-0002","title":"ADR-0002：事件日志是唯一真相","kind":"adr","status":"accepted","order":21,"summary":"内存状态只是 JSONL 日志的 fold；resume、fork、replay 和 compaction 都从日志派生。","body_html":"\u003ch2\u003e状态\u003c/h2\u003e\n\u003cp\u003eAccepted · 2026-10-20\u003c/p\u003e\n\u003ch2\u003e背景\u003c/h2\u003e\n\u003cp\u003eAgent 进程会崩溃、被取消、被重启。如果对话只存在内存里，一次崩溃就丢掉全部上下文；如果另外维护一份\"session 快照\"，它和内存状态迟早不一致。\u003c/p\u003e\n\u003ch2\u003e决策\u003c/h2\u003e\n\u003cp\u003e每个 session 是一个 append-only JSONL 文件，一行一个 \u003ccode\u003eEvent\u003c/code\u003e。内存状态是日志的 fold：\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003estate = fold(events)\n\u003c/code\u003e\u003c/pre\u003e\n\u003cul\u003e\n\u003cli\u003e写入：\u003ccode\u003eSessionLog::append\u003c/code\u003e 序列化一行、flush，不改旧行。\u003c/li\u003e\n\u003cli\u003e读取：\u003ccode\u003eload\u003c/code\u003e 逐行解码；坏行变成 warning，不丢整份历史。\u003c/li\u003e\n\u003cli\u003e恢复：\u003ccode\u003eresume\u003c/code\u003e 从日志重建，而不是从快照恢复。\u003c/li\u003e\n\u003cli\u003e分叉：\u003ccode\u003efork\u003c/code\u003e 复制某个前缀，生成新 session。\u003c/li\u003e\n\u003cli\u003e压缩：\u003ccode\u003ecompaction\u003c/code\u003e 事件记录摘要和 \u003ccode\u003eupto\u003c/code\u003e；只影响投影，不删原始事件。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e后果\u003c/h2\u003e\n\u003ch3\u003e正向\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eresume / replay / fork 共用一套机制，测试可离线回放。\u003c/li\u003e\n\u003cli\u003e崩溃最多丢最后一行（未 flush），不会出现\"内存与磁盘不一致\"。\u003c/li\u003e\n\u003cli\u003e审计简单：每个决策、工具调用、usage 都有时间线。\u003c/li\u003e\n\u003cli\u003e压缩是投影变换，可回滚、可对比。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e负向\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e日志会增长；长会话需要 compaction 和归档策略。\u003c/li\u003e\n\u003cli\u003e事件 schema 演进需要兼容策略（新增字段可默认，删除/改义要迁移）。\u003c/li\u003e\n\u003cli\u003e日志可能包含敏感内容（文件内容、命令输出），需要权限和清理策略。\u003c/li\u003e\n\u003cli\u003e每次 append 都 flush，吞吐低于批量写；对 agent 的写入频率足够。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e投影规则\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e原始事件永远保留。\u003c/li\u003e\n\u003cli\u003e最后一个 \u003ccode\u003ecompaction\u003c/code\u003e 的 \u003ccode\u003eupto\u003c/code\u003e 之前的事件不进入模型上下文，替换为摘要；\u003ccode\u003eupto\u003c/code\u003e 是绝对事件下标，精确语义见 ADR-0008。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003etool_result\u003c/code\u003e 必须和对应 \u003ccode\u003eassistant_message.tool_calls\u003c/code\u003e 成对出现；日志里缺失 result（例如取消）时，投影补一条 cancelled tool result。\u003c/li\u003e\n\u003cli\u003ereasoning 是否进入上下文由 provider 适配层决定，日志始终保留原文。\u003c/li\u003e\n\u003cli\u003e投影是纯函数：相同日志 + 相同预算 → 相同上下文。\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e备选方案\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e内存 messages + 退出时快照\u003c/strong\u003e：实现简单，但崩溃丢上下文，且快照与内存双真相。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e数据库（SQLite）\u003c/strong\u003e：查询和并发更好，但 v0 引入 schema、迁移和依赖；JSONL 可 grep、可 diff、可直接回放。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e只存模型可见的投影\u003c/strong\u003e：省空间，但丢掉审计和 fork 能力，压缩不可逆。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e风险与缓解\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e日志过大：按 session 归档，支持 \u003ccode\u003ecompact --archive\u003c/code\u003e；看板 Runs 视图只读聚合指标。\u003c/li\u003e\n\u003cli\u003e敏感信息：session 目录默认 \u003ccode\u003e0700\u003c/code\u003e；提供 \u003ccode\u003eniucode session redact\u003c/code\u003e 的后续入口。\u003c/li\u003e\n\u003cli\u003e坏行：加载时 warning + 行号；\u003ccode\u003e--strict\u003c/code\u003e 模式用于 CI。\u003c/li\u003e\n\u003c/ul\u003e\n","path":"docs/adr/0002-event-log.md","excerpt":"内存状态只是 JSONL 日志的 fold；resume、fork、replay 和 compaction 都从日志派生。"},{"id":"adr-0003","title":"ADR-0003：Dashboard 以架构为第一屏","kind":"adr","status":"accepted","order":22,"summary":"看板不再以进度为主叙事；默认 Architecture，Work 降为二级，进度装饰从架构视图移除。","body_html":"\u003ch2\u003e状态\u003c/h2\u003e\n\u003cp\u003eAccepted · 2026-10-20\u003c/p\u003e\n\u003ch2\u003e背景\u003c/h2\u003e\n\u003cp\u003e项目看板最初照搬了任务看板的默认视图：打开就是 Board、里程碑进度条、完成率和卡片计数。这个结构回答的是\"做到哪了\"，但项目真正需要反复阅读的是\"系统由哪些边界组成、依赖往哪流、为什么这样切\"。\u003c/p\u003e\n\u003cp\u003e进度信息还有两个问题：它和 git、session log 重复；为了看起来完整，会诱导维护者不断更新百分比和统计数字，而不是更新架构和决策。卡片本身仍然是 agent 的 handoff 面，值得保留，但不应该占据第一屏。\u003c/p\u003e\n\u003ch2\u003e决策\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e默认视图改为 Architecture\u003c/strong\u003e，导航固定为 Architecture / Work / Docs / Decisions。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eWork 降为二级视图\u003c/strong\u003e：保留卡片、状态列和里程碑筛选，但移除进度条、完成率、WIP 数字和卡片计数。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eArchitecture 只保留结构信息\u003c/strong\u003e：层、模块、关系、owned paths、contract、源码；\u003ccode\u003eplanned / active / done\u003c/code\u003e 是模块状态，不是完成率。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDecisions 只收决策\u003c/strong\u003e：ADR 和 \u003ccode\u003ekind = \"decision\"\u003c/code\u003e 事件；不展示\"某张卡完成\"的流水账。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e不上前端框架\u003c/strong\u003e：继续原生 JS/CSS，保持单文件、离线、\u003ccode\u003ecargo xtask dashboard\u003c/code\u003e 确定性构建。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e视觉方向为 technical field guide\u003c/strong\u003e：暖纸、墨色、深绿强调、低饱和层色；架构图是主角；不做 zoom/pan 和拖拽编辑。\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e后果\u003c/h2\u003e\n\u003ch3\u003e正向\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e第一屏直接回答\"系统长什么样\"，而不是\"完成了几张卡\"。\u003c/li\u003e\n\u003cli\u003e进度回到 git / session log / Work 视图，减少看板变成第二真相源的压力。\u003c/li\u003e\n\u003cli\u003e单文件、零构建、离线可用；页面大约维持在当前体量。\u003c/li\u003e\n\u003cli\u003e模块聚焦会弱化无关节点，复杂架构图仍然可读。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e负向\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e想快速看进度的人需要多点一次 Work。\u003c/li\u003e\n\u003cli\u003e卡片状态仍然需要维护；只是不再用进度条装饰它。\u003c/li\u003e\n\u003cli\u003e没有 zoom/pan，超过约 30 个模块后需要重新评估图导航。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e备选方案\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e保留 Board 优先\u003c/strong\u003e：改动最小，但与架构阅读的目标冲突。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e删除 Work，进度交给 GitHub Issues\u003c/strong\u003e：最纯粹，但会破坏当前 \u003ccode\u003eAGENTS.md\u003c/code\u003e 依赖卡片做 handoff 的流程，并引入第二套状态源。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e引入 React/Svelte + 图编辑器\u003c/strong\u003e：当前 9 个模块、8 条关系，框架 runtime 比数据还大；等真的需要编辑/拖拽/多人协作时再做。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eRevisit 条件\u003c/h2\u003e\n\u003cp\u003e出现以下任一情况时重新评估：\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e模块数量超过 30，或关系超过 60，当前分层图不可读。\u003c/li\u003e\n\u003cli\u003e需要在浏览器里编辑架构或卡片，而不只是阅读。\u003c/li\u003e\n\u003cli\u003e出现多个并发读者/写者，需要真正的服务端状态。\u003c/li\u003e\n\u003c/ol\u003e\n","path":"docs/adr/0003-architecture-first-dashboard.md","excerpt":"看板不再以进度为主叙事；默认 Architecture，Work 降为二级，进度装饰从架构视图移除。"},{"id":"adr-0004","title":"ADR-0004：SessionRuntime 以 Command/Event 为边界","kind":"adr","status":"accepted","order":23,"summary":"抽象会话而不是界面：CLI/TUI 进程内消费 Command/Event，Web 以后只是另一个 client。","body_html":"\u003ch2\u003e状态\u003c/h2\u003e\n\u003cp\u003eAccepted · 2026-10-20\u003c/p\u003e\n\u003ch2\u003e背景\u003c/h2\u003e\n\u003cp\u003e上层会出现 CLI、TUI 和 Web 三种交互界面。直觉做法是定义一个 \u003ccode\u003eFrontend\u003c/code\u003e trait，让 loop 调用 \u003ccode\u003erender()\u003c/code\u003e / \u003ccode\u003eapprove()\u003c/code\u003e；但这样 loop 会知道“展示”，Web 需要桥接，\u003ccode\u003e--json\u003c/code\u003e 和多客户端也会变别扭。\u003c/p\u003e\n\u003cp\u003e三个界面真正共享的是\u003cstrong\u003e命令与事件的语义\u003c/strong\u003e，不是屏幕布局或 widget。\u003c/p\u003e\n\u003ch2\u003e决策\u003c/h2\u003e\n\u003cp\u003e定义 transport-neutral 的 \u003ccode\u003eSessionRuntime\u003c/code\u003e：\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003eClient ──► Runtime\n\n  Submit { text }\n  Approve { call_id, decision }\n  Cancel { turn_id }\n  Resume { session_id }\n  Configure { model, budget, approval }\n\nRuntime ──► Client\n\n  RuntimeEvent =\n    Durable(Event)          // 与 JSONL 日志一致\n  | Delta { kind, text }    // 瞬时，不落盘\n  | ApprovalRequest { ... } // 需要客户端决策\n  | Status { ... }          // 运行状态\n\u003c/code\u003e\u003c/pre\u003e\n\u003cul\u003e\n\u003cli\u003eCLI 和 TUI 现在\u003cstrong\u003e进程内\u003c/strong\u003e消费同一个 runtime。\u003c/li\u003e\n\u003cli\u003eWeb 第一版是只读 Session Viewer，直接读 JSONL；完整客户端以后通过 WebSocket/SSE 接同一个 contract。\u003c/li\u003e\n\u003cli\u003e不做 \u003ccode\u003eFrontend\u003c/code\u003e trait，不共享 widget 层。\u003c/li\u003e\n\u003cli\u003e不在 M0 做 daemon/JSON-RPC；等出现多客户端、远程访问或崩溃隔离需求再拆。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e后果\u003c/h2\u003e\n\u003ch3\u003e正向\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eloop 不依赖展示层；headless \u003ccode\u003e--json\u003c/code\u003e、TUI、Web 共用一套语义。\u003c/li\u003e\n\u003cli\u003eapproval / cancel / usage 是协议的一部分，不会漏在某个 UI 里。\u003c/li\u003e\n\u003cli\u003e未来拆 daemon 只需要给 runtime 包一层 transport，不重写 loop。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e负向\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e需要定义事件的生命周期：哪些是 durable、哪些是瞬时、断线后如何恢复。\u003c/li\u003e\n\u003cli\u003e进程内 runtime 和未来 daemon 之间会有一段适配代码。\u003c/li\u003e\n\u003cli\u003eCommand 的幂等性和重放语义需要明确（尤其 \u003ccode\u003eApprove\u003c/code\u003e 与 \u003ccode\u003eCancel\u003c/code\u003e）。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e备选方案\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e\u003ccode\u003eFrontend\u003c/code\u003e trait\u003c/strong\u003e：简单，但把展示耦合进 loop，Web 和多客户端会变复杂。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e现在做 daemon + JSON-RPC\u003c/strong\u003e：对 Web 最干净，但在 loop 尚未跑通时预付协议、认证、背压和进程生命周期成本。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e每个 UI 各自调用 loop\u003c/strong\u003e：最快，但会出现三套取消、审批和错误处理，最终行为不一致。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eRevisit 条件\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e需要同时连接多个客户端，或从远程/移动端控制同一个 session。\u003c/li\u003e\n\u003cli\u003e需要把 agent 进程与 UI 进程隔离（崩溃恢复、资源限制）。\u003c/li\u003e\n\u003cli\u003eCommand/Event 需要版本化并对外发布。\u003c/li\u003e\n\u003c/ol\u003e\n","path":"docs/adr/0004-session-runtime.md","excerpt":"抽象会话而不是界面：CLI/TUI 进程内消费 Command/Event，Web 以后只是另一个 client。"},{"id":"adr-0005","title":"ADR-0005：凭证解析 env → keyring → 0600 file","kind":"adr","status":"accepted","order":24,"summary":"API key 由独立 niucode-auth 解析；keyring 优先，失败回退 0600 文件；不碰网页 cookie。","body_html":"\u003ch2\u003e状态\u003c/h2\u003e\n\u003cp\u003eAccepted · 2026-10-20\u003c/p\u003e\n\u003ch2\u003e背景\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003eniucode\u003c/code\u003e 已经有 OpenAI-compatible provider，但每次都要在命令行里传 \u003ccode\u003eDEEPSEEK_API_KEY\u003c/code\u003e，体验差且容易把 key 写进 shell history。目标是让 API key 像登录一样只配置一次。\u003c/p\u003e\n\u003cp\u003e同时要避免两个错误方向：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e把 DeepSeek / ChatGPT 的网页 cookie 当作 API；这不稳定、违反服务条款，也会把会话凭证暴露给 harness。\u003c/li\u003e\n\u003cli\u003e把 key 直接写进仓库配置或 session 事件；日志会被分享、提交、回放。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e决策\u003c/h2\u003e\n\u003cp\u003e新增独立 \u003ccode\u003eniucode-auth\u003c/code\u003e crate，统一解析凭证：\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003e环境变量\n  ↓ 没有\nOS keyring（service = \"niucode\", account = provider）\n  ↓ 不可用\n0600 credentials.toml\n\u003c/code\u003e\u003c/pre\u003e\n\u003cul\u003e\n\u003cli\u003e环境变量优先，方便 CI 和临时覆盖。\u003c/li\u003e\n\u003cli\u003ekeyring 可用时写入 OS keychain / Credential Manager / Secret Service。\u003c/li\u003e\n\u003cli\u003ekeyring 不可用时回退文件；Unix 上文件 \u003ccode\u003e0600\u003c/code\u003e，目录新建时 \u003ccode\u003e0700\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eniucode auth status\u003c/code\u003e 只显示来源，不打印 key；文件权限过宽时提示 \u003ccode\u003einsecure\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eniucode auth unset\u003c/code\u003e 同时清理 keyring 和文件。\u003c/li\u003e\n\u003cli\u003eProvider 不直接读环境变量；入口（CLI，未来 loop）通过 \u003ccode\u003eniucode-auth\u003c/code\u003e 拿 key。\u003c/li\u003e\n\u003cli\u003e不支持网页账号 cookie；ChatGPT 账号 OAuth（SIWC）是独立项目，不在本 ADR 范围。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e后果\u003c/h2\u003e\n\u003ch3\u003e正向\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e一次 \u003ccode\u003eniucode auth set deepseek\u003c/code\u003e 后，\u003ccode\u003eniucode provider test\u003c/code\u003e 和后续 loop 都不需要重复传 key。\u003c/li\u003e\n\u003cli\u003e密钥不会进入 session JSONL、日志或 \u003ccode\u003eDebug\u003c/code\u003e 输出。\u003c/li\u003e\n\u003cli\u003e无桌面环境仍然可用；keyring 失败不会阻塞。\u003c/li\u003e\n\u003cli\u003eprovider 保持凭证无关，便于未来接入不同 auth 方式。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e负向\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eLinux keyring 依赖 Secret Service / DBus；构建需要 \u003ccode\u003elibdbus-1-dev\u003c/code\u003e，最小容器需要设置 \u003ccode\u003eNIUCODE_AUTH_DISABLE_KEYRING=1\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e文件回退仍是明文（0600），无法防御同用户恶意进程。\u003c/li\u003e\n\u003cli\u003e目前没有 zeroize；key 在进程生命周期内存在。\u003c/li\u003e\n\u003cli\u003e每个入口都必须记得使用 \u003ccode\u003eniucode-auth\u003c/code\u003e，否则会出现第二套读取逻辑。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e备选方案\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e只读环境变量\u003c/strong\u003e：最简单，但每次都要配置，容易进 shell history。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e只写文件\u003c/strong\u003e：跨平台简单，但桌面用户失去 keychain 的保护。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e网页 cookie / 浏览器自动化\u003c/strong\u003e：不做；安全与稳定性都不可接受。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eChatGPT 账号 SIWC\u003c/strong\u003e：官方能力，但需要 OAuth + Responses API 和开源许可，作为后续独立 ADR。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eRevisit 条件\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eChatGPT SIWC 正式接入，需要新的 OAuth 凭证类型。\u003c/li\u003e\n\u003cli\u003e需要多用户/多租户，keyring 的 per-user 模型不够。\u003c/li\u003e\n\u003cli\u003e需要 zeroize 或硬件密钥（YubiKey/Passkey）。\u003c/li\u003e\n\u003c/ol\u003e\n","path":"docs/adr/0005-auth.md","excerpt":"API key 由独立 niucode-auth 解析；keyring 优先，失败回退 0600 文件；不碰网页 cookie。"},{"id":"adr-0006","title":"ADR-0006：Linux 沙箱首选 bwrap，landlock/seccomp 后置","kind":"adr","status":"accepted","order":25,"summary":"三轴策略独立；Linux 用 bubblewrap 提供文件系统与网络隔离，缺少 bwrap 时降级到逐工具审批。","body_html":"\u003ch2\u003e状态\u003c/h2\u003e\n\u003cp\u003eAccepted · 2026-10-20\u003c/p\u003e\n\u003ch2\u003e背景\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003eniucode exec\u003c/code\u003e 已经有 bash 进程组、超时和取消，但 bash 仍能写工作区外、访问网络。M1-002 需要把“能写哪、能连哪、什么时候问人”变成可执行策略，而不是文档承诺。\u003c/p\u003e\n\u003cp\u003e候选：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e手写 landlock + seccomp：零外部依赖，但需要自己处理 ABI、规则和 pre-exec/fork 安全；第一版风险高。\u003c/li\u003e\n\u003cli\u003ebubblewrap（bwrap）：成熟的 Linux namespace 沙箱，支持只读根、工作区 bind、网络 namespace；本机已安装并验证可用。\u003c/li\u003e\n\u003cli\u003e纯 approval：没有隔离，只能靠人。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e决策\u003c/h2\u003e\n\u003cp\u003e把三轴拆开：\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003esandbox:  read-only | workspace-write | full-access\nnetwork:  on | off\napproval: ask | on-failure | never\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eLinux 第一后端用 bwrap：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eread-only\u003c/code\u003e：\u003ccode\u003e--ro-bind / /\u003c/code\u003e，不 bind 工作区；文件工具也拒绝 write/edit。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eworkspace-write\u003c/code\u003e：只读根 + \u003ccode\u003e--bind \u0026lt;cwd\u0026gt; \u0026lt;cwd\u0026gt;\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003efull-access\u003c/code\u003e：不套 bwrap（\u003ccode\u003enetwork=on\u003c/code\u003e），或只套网络 namespace（\u003ccode\u003enetwork=off\u003c/code\u003e）。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003enetwork=off\u003c/code\u003e：\u003ccode\u003e--unshare-all\u003c/code\u003e；\u003ccode\u003enetwork=on\u003c/code\u003e 加 \u003ccode\u003e--share-net\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003ebash 仍走独立进程组；超时/取消杀整组。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e如果 bwrap 不可用：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eapproval=never\u003c/code\u003e：启动时直接失败。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eapproval=on-failure\u003c/code\u003e：提升为 \u003ccode\u003eask\u003c/code\u003e，每个变更型工具前询问；显式提示网络策略没有被执行。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eapproval=ask\u003c/code\u003e：同样逐工具询问。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003efull-access + network=on\u003c/code\u003e：不需要 bwrap，不存在降级。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e每次运行把有效策略写成 \u003ccode\u003epolicy\u003c/code\u003e 事件；人工审批写成 \u003ccode\u003eapproval\u003c/code\u003e 事件。拒绝执行的工具结果也落盘。\u003c/p\u003e\n\u003ch2\u003e后果\u003c/h2\u003e\n\u003ch3\u003e正向\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e默认 \u003ccode\u003eworkspace-write + network=off\u003c/code\u003e，不依赖人肉自觉。\u003c/li\u003e\n\u003cli\u003ebwrap 是成熟组件，避免第一版手写 seccomp 规则。\u003c/li\u003e\n\u003cli\u003e三轴是独立枚举，未来换 landlock/seccomp 后端不影响 CLI 和事件。\u003c/li\u003e\n\u003cli\u003e没有 bwrap 的平台有明确降级路径，不会假装安全。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e负向\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eLinux 运行需要安装 \u003ccode\u003ebubblewrap\u003c/code\u003e；最小容器可能没有。\u003c/li\u003e\n\u003cli\u003ebwrap 仍是同一内核上的 namespace 隔离，不是 VM；可读系统文件，内核攻击面仍在。\u003c/li\u003e\n\u003cli\u003e还没有 seccomp syscall 过滤；\u003ccode\u003elandlock\u003c/code\u003e 作为无 bwrap 依赖的后端后续补。\u003c/li\u003e\n\u003cli\u003emacOS seatbelt 未实现；目前会走审批降级。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eworkspace-write\u003c/code\u003e 只允许写 cwd，cargo registry / \u003ccode\u003e~/.cargo\u003c/code\u003e 等缓存写入会失败；需要后续加可配置 writable roots。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e备选方案\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003elandlock + seccomp 先行\u003c/strong\u003e：更轻，但实现和测试成本高；作为第二后端。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e只做 approval\u003c/strong\u003e：不满足“workspace-write 无法写外部”的验收。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e容器/VM\u003c/strong\u003e：隔离更强，但启动和分发成本不适合当前单二进制目标。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eRevisit 条件\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e需要无 bwrap 的静态二进制分发。\u003c/li\u003e\n\u003cli\u003e需要 syscall 级过滤或更细的 writable roots。\u003c/li\u003e\n\u003cli\u003emacOS 成为一等平台，需要 seatbelt profile。\u003c/li\u003e\n\u003c/ol\u003e\n","path":"docs/adr/0006-sandbox.md","excerpt":"三轴策略独立；Linux 用 bubblewrap 提供文件系统与网络隔离，缺少 bwrap 时降级到逐工具审批。"},{"id":"adr-0007","title":"ADR-0007：Diff 预览归工具层，渲染归客户端","kind":"adr","status":"accepted","order":26,"summary":"审批 diff 由工具层按真实文件生成结构化预览；loop 只转发，TUI 用宽度感知 pager 渲染。","body_html":"\u003ch2\u003e状态\u003c/h2\u003e\n\u003cp\u003eAccepted · 2026-10-20\u003c/p\u003e\n\u003ch2\u003e背景\u003c/h2\u003e\n\u003cp\u003eM1-001 的审批预览只是工具输入片段：\u003ccode\u003ewrite\u003c/code\u003e 把 \u003ccode\u003econtent\u003c/code\u003e 前 40 行加上 \u003ccode\u003e+\u003c/code\u003e，\u003ccode\u003eedit\u003c/code\u003e 把 \u003ccode\u003eold\u003c/code\u003e / \u003ccode\u003enew\u003c/code\u003e 各显示一行。它看不到文件原来的内容，不是 unified diff，也没有行号、hunk 和上下文。M1-003 要求在审批前看到本次写入的完整 diff，并且大 diff 不刷屏、能按文件跳转、终端宽度变化后可以重排。\u003c/p\u003e\n\u003cp\u003e问题在于谁来算 diff：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eloop 知道 tool call，但不知道工作区路径策略，也不应该读文件。\u003c/li\u003e\n\u003cli\u003eTUI 知道终端宽度，但不应该重新实现 path resolve 和 read-before-write，否则会出现第二套安全策略。\u003c/li\u003e\n\u003cli\u003e工具层已经拥有路径解析、沙箱判断和 \u003ccode\u003ewrite\u003c/code\u003e / \u003ccode\u003eedit\u003c/code\u003e 的真实语义。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e决策\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ccode\u003eToolbox::preview(name, input) -\u0026gt; ChangePreview\u003c/code\u003e 在工具层生成\u003cstrong\u003e无副作用\u003c/strong\u003e的结构化预览：文件、hunk、行号、增删行和 warning。它读取真实文件内容，但不修改 observed 集合或磁盘。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eApprovalRequest.preview: Option\u0026lt;ChangePreview\u0026gt;\u003c/code\u003e 携带预览；loop 不解析、不渲染、不拼接 diff 字符串。\u003c/li\u003e\n\u003cli\u003e渲染归客户端。TUI 的 \u003ccode\u003ediff\u003c/code\u003e 模块把预览布局成宽度感知的行；\u003ccode\u003ereview\u003c/code\u003e 模块只在审批时进入 alternate-screen pager，支持滚动、按文件跳转和 resize 重排。headless 用同一布局输出纯文本。\u003c/li\u003e\n\u003cli\u003epager 是审批 overlay，不把 TUI 改成常驻全屏应用；\u003ccode\u003ea\u003c/code\u003e / \u003ccode\u003ed\u003c/code\u003e / \u003ccode\u003es\u003c/code\u003e 决策后回到线性会话。\u003c/li\u003e\n\u003cli\u003e工具输出折叠留在 UI。\u003ccode\u003eAgentEvent::ToolResult\u003c/code\u003e 带完整 output，TUI 超过 12 行或 2 KB 只显示摘要和 \u003ccode\u003e:last\u003c/code\u003e 提示；session 日志仍保留完整 output。\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e后果\u003c/h2\u003e\n\u003ch3\u003e正向\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003ediff 与真实文件一致，审批看到的是将要发生的修改。\u003c/li\u003e\n\u003cli\u003e行号、标记和宽度处理只实现一次，headless 与 TUI 共享同一套布局。\u003c/li\u003e\n\u003cli\u003e工具层继续拥有路径和沙箱语义；UI 不复制安全逻辑。\u003c/li\u003e\n\u003cli\u003e大 diff 可导航，窄终端可以退化为纯文本预览。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e负向\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e预览与执行之间存在 TOCTOU：execution 会重新读取并校验，预览只代表审批时刻。\u003c/li\u003e\n\u003cli\u003e预览读取大文件会占用内存；当前接受，后续可以加预算或分页。\u003c/li\u003e\n\u003cli\u003epager 增加终端状态管理；用 guard 保证异常路径恢复。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eAgentEvent\u003c/code\u003e 携带完整 output，事件观察者需要自己决定折叠。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e备选方案\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eloop 生成 diff 字符串\u003c/strong\u003e：简单，但 loop 要读文件、处理路径，且无法按终端宽度渲染。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eUI 自己读文件\u003c/strong\u003e：能拿到宽度，但复制 path policy、read-before-write 和沙箱判断，容易与执行不一致。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e引入 ratatui 全屏 TUI\u003c/strong\u003e：长期可能，但 M1 的交互面还没稳定；先做审批 overlay，避免为 pager 重写整个会话界面。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e调用外部 diff / pager\u003c/strong\u003e：引入子进程和终端接管，离线和跨平台更复杂，也无法和审批按键整合。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eRevisit 条件\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e需要一次审批多个文件，或出现 rename / delete / patch 工具，预览模型要扩展。\u003c/li\u003e\n\u003cli\u003ediff 规模超过内存预算，需要分页读取或外部 diff。\u003c/li\u003e\n\u003cli\u003e线性 TUI 的滚动和历史检索成为瓶颈，考虑 ratatui 全屏。\u003c/li\u003e\n\u003cli\u003eheadless \u003ccode\u003e--json\u003c/code\u003e 需要把 preview 作为稳定协议字段。\u003c/li\u003e\n\u003c/ol\u003e\n","path":"docs/adr/0007-diff-preview.md","excerpt":"审批 diff 由工具层按真实文件生成结构化预览；loop 只转发，TUI 用宽度感知 pager 渲染。"},{"id":"adr-0008","title":"ADR-0008：Compaction 是事件日志上的确定性 handoff","kind":"adr","status":"accepted","order":27,"summary":"75% 预算触发；保留最近 N 轮，其余事件生成结构化 handoff；upto 是绝对事件下标，日志不重写。","body_html":"\u003ch2\u003e状态\u003c/h2\u003e\n\u003cp\u003eAccepted · 2026-10-20\u003c/p\u003e\n\u003ch2\u003e背景\u003c/h2\u003e\n\u003cp\u003eM1 结束时，loop 每轮把完整历史发给 provider。日志可以一直增长，但模型上下文不能。\u003ccode\u003eCompaction\u003c/code\u003e 事件已经在 core 里，但 \u003ccode\u003eupto\u003c/code\u003e 没有被投影使用，也没有触发、handoff 和回放规则。\u003c/p\u003e\n\u003cp\u003e需要同时满足三件事：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e长会话要能继续，不能因为上下文上限直接失败。\u003c/li\u003e\n\u003cli\u003e压缩必须可回放：同一份日志在 resume 后得到与压缩时一致的模型上下文。\u003c/li\u003e\n\u003cli\u003e日志是唯一真相，压缩不能删除或改写旧事件。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e另一个现实约束：当前没有 tokenizer，也没有额外的摘要模型调用。M2-001 先用确定性规则和近似 token 预算，把协议与回放做对。\u003c/p\u003e\n\u003ch2\u003e决策\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eContext 属于 Engine，不属于 core。\u003c/strong\u003e 投影和压缩放在 \u003ccode\u003ecrates/niucode-agent/src/context.rs\u003c/code\u003e；\u003ccode\u003eniucode-core\u003c/code\u003e 继续只拥有 \u003ccode\u003eEvent\u003c/code\u003e 和 \u003ccode\u003eSessionLog\u003c/code\u003e。这样 core 不依赖 provider 的 \u003ccode\u003eChatMessage\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e预算用近似 token。\u003c/strong\u003e ASCII 约 4 字符 1 token，非 ASCII 1 字符 1 token；加消息和工具 schema 的固定开销。默认预算 64k，到 75% 触发；CLI 暴露 \u003ccode\u003e--context-budget\u003c/code\u003e 和 \u003ccode\u003e--keep-recent-turns\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eM2-001 的 handoff 是确定性的，不额外调用模型。\u003c/strong\u003e 从日志生成目标、上一次请求、工具动作、成功写入的文件、最近助手状态、近期失败、约束和下一步。结构稳定，离线可测。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\u003ccode\u003ecompaction.upto\u003c/code\u003e 是绝对事件下标。\u003c/strong\u003e 摘要替换 \u003ccode\u003eevents[..upto]\u003c/code\u003e；compaction 事件本身追加在日志末尾，但投影时在 \u003ccode\u003eupto\u003c/code\u003e 处插入摘要，而不是在事件物理位置插入。最后一个 compaction 生效，旧 compaction 被忽略。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e保留最近 N 个 user turn 原文。\u003c/strong\u003e 多轮会话以第 N 个最近的 user message 为 cutoff。单个 turn 很长时，回退到该 turn 内安全的 assistant 边界，保留尾部，避免 tool call 和 tool result 被切开。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e压缩成功才落事件。\u003c/strong\u003e 先构造候选投影并估算 after；只有 after 小于 before 才追加 \u003ccode\u003ecompaction\u003c/code\u003e。追加失败或不收缩时保留原上下文，并通过 \u003ccode\u003eWarning\u003c/code\u003e 事件提示。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eToken 计数是审计元数据。\u003c/strong\u003e \u003ccode\u003ecompaction\u003c/code\u003e 事件新增 \u003ccode\u003ebefore_tokens\u003c/code\u003e / \u003ccode\u003eafter_tokens\u003c/code\u003e，带 \u003ccode\u003eserde(default)\u003c/code\u003e，旧日志可读。\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e后果\u003c/h2\u003e\n\u003ch3\u003e正向\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e压缩与 resume 共用 \u003ccode\u003eproject_history\u003c/code\u003e，不会出现 UI 和 loop 各自维护一份摘要。\u003c/li\u003e\n\u003cli\u003e日志保留全部原始事件，压缩事件只改变投影。\u003c/li\u003e\n\u003cli\u003e确定性 handoff 可以离线回放，不消耗额外 token，不会因为摘要模型失败而丢历史。\u003c/li\u003e\n\u003cli\u003e单 turn 长任务也有压缩路径，不会因为只有一条 user message 卡死。\u003c/li\u003e\n\u003cli\u003e预算、cutoff、token 估算都是显式配置，测试可以设得很小。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e负向\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e确定性 handoff 不如模型摘要擅长语义压缩；复杂任务可能丢掉细微意图。\u003c/li\u003e\n\u003cli\u003etoken 估算是启发式，可能过早或过晚触发；真实 usage 仍是账单依据。\u003c/li\u003e\n\u003cli\u003e单 turn 回退只能压缩 assistant 边界之前的内容；如果最新工具输出本身就是大头，压缩可能不收缩，此时会提示并保留上下文。\u003c/li\u003e\n\u003cli\u003e每次检查都从 JSONL 重新读日志；长会话的压缩检查有文件 I/O 成本。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e备选方案\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e模型生成摘要\u003c/strong\u003e：语义更好，但压缩本身要发一次请求，引入失败、成本和新的取消路径；M2-001 先不采用，等确定性 handoff 的质量边界清楚后再加可选模式。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e只截断旧消息\u003c/strong\u003e：实现最简单，但会丢掉原始目标和已完成工作，agent 容易重复劳动。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e改写或删除旧事件\u003c/strong\u003e：违反“日志是唯一真相”，不做。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e在 core 里做投影\u003c/strong\u003e：会让 core 依赖 provider 的消息类型，破坏依赖方向。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e用精确 tokenizer\u003c/strong\u003e：需要模型相关依赖和版本维护；先保留估算接口，后续可替换。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eRevisit 条件\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e确定性 handoff 在真实长任务中反复丢意图，需要模型生成或人可编辑的 handoff。\u003c/li\u003e\n\u003cli\u003e引入与模型匹配的 tokenizer，或 provider 返回更精确的上下文预算。\u003c/li\u003e\n\u003cli\u003e压缩检查的 JSONL 读取成为性能瓶颈，需要内存事件索引。\u003c/li\u003e\n\u003cli\u003e出现多文件 patch、subagent 或跨 session 合并，handoff 需要新的结构。\u003c/li\u003e\n\u003c/ol\u003e\n","path":"docs/adr/0008-compaction.md","excerpt":"75% 预算触发；保留最近 N 轮，其余事件生成结构化 handoff；upto 是绝对事件下标，日志不重写。"},{"id":"adr-0009","title":"ADR-0009：分层 AGENTS.md 与缓存指标留在事件日志","kind":"adr","status":"accepted","order":28,"summary":"AGENTS.md 每次 run 按 cwd 向上发现并追加到稳定前缀；缓存命中率从 turn_end.usage 派生，不引入 Runs 看板。","body_html":"\u003ch2\u003e状态\u003c/h2\u003e\n\u003cp\u003eAccepted · 2026-10-20\u003c/p\u003e\n\u003ch2\u003e背景\u003c/h2\u003e\n\u003cp\u003eM2-002 要解决两件事：子目录规范要能覆盖根目录规则，缓存命中率要能解释。原始卡片还提到“看板 Runs 视图读取 metrics JSONL”，但这与两条既有约束冲突：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e项目看板的导航固定为 Architecture / Work / Docs / Decisions，第一屏是架构，不是运行时监控。\u003c/li\u003e\n\u003cli\u003e事件日志是唯一持久真相；再写一份 metrics JSONL 会制造第二份可漂移的状态。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e同时，prompt cache 的前缀稳定性要求 system prompt 的结构可解释：稳定部分在前，容易变化的指令在后。\u003c/p\u003e\n\u003ch2\u003e决策\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e每次 run 从 cwd 向上发现 \u003ccode\u003eAGENTS.md\u003c/code\u003e。\u003c/strong\u003e 顺序是 cwd、父目录……根目录；近者先列，并明确说明近者优先。每个文件上限 32 KiB，总上限 64 KiB；超出时截断并 warning。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e指令追加在稳定 system prompt 之后。\u003c/strong\u003e base prompt 保持稳定前缀，\u003ccode\u003eAGENTS.md\u003c/code\u003e 内容放在末尾。每次 \u003ccode\u003erun_with_history\u003c/code\u003e 重新加载，所以修改文件后下一次用户 turn 生效，无需重启。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e记录 \u003ccode\u003einstructions\u003c/code\u003e 事件。\u003c/strong\u003e 事件包含加载的文件路径和合并文本的 FNV-1a digest；只有实际加载到文件时才写入。缓存命中率下降时，可以对照 digest 判断是否是指令变化导致前缀失效。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e缓存指标从 \u003ccode\u003eturn_end.usage\u003c/code\u003e 派生。\u003c/strong\u003e \u003ccode\u003eUsage::cache_hit_percent()\u003c/code\u003e 用 \u003ccode\u003ecached_tokens / input_tokens\u003c/code\u003e 计算；TUI、exec 和 \u003ccode\u003esession show\u003c/code\u003e 直接显示。不写独立 metrics JSONL。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eRuns 视图不进入离线项目看板。\u003c/strong\u003e 运行时的 runs / metrics 浏览属于未来 runtime viewer，和架构阅读面分离；看板继续只读、离线、四视图。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e不为每次 assistant turn 重载指令。\u003c/strong\u003e 指令在一次 run 内保持稳定，避免同一次任务中 prompt 前缀反复变化。\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e后果\u003c/h2\u003e\n\u003ch3\u003e正向\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e子目录规则按距离覆盖根目录规则，顺序可测试。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eAGENTS.md\u003c/code\u003e 修改在下一 turn 生效，不需要重启进程。\u003c/li\u003e\n\u003cli\u003einstructions digest 让“为什么 cache 命中率掉了”有可查的证据。\u003c/li\u003e\n\u003cli\u003e缓存命中率来自真实 usage 事件，不需要第二份指标文件。\u003c/li\u003e\n\u003cli\u003e看板保持 architecture-first，不引入运行时可变的进度/监控面。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e负向\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eAGENTS.md\u003c/code\u003e 一旦变化，system prompt 后缀变化，prompt cache 大概率失效；这是正确性优先的代价。\u003c/li\u003e\n\u003cli\u003e一次 run 内不会感知指令变化；超长 run 需要用户重新提交 turn。\u003c/li\u003e\n\u003cli\u003e还没有历史 Runs 视图，跨 session 的缓存趋势需要手工读 JSONL。\u003c/li\u003e\n\u003cli\u003eFNV-1a digest 只用于定位变化，不是密码学完整性校验。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e备选方案\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e写 metrics JSONL\u003c/strong\u003e：查询方便，但会引入第二份持久状态，且与 \u003ccode\u003eturn_end.usage\u003c/code\u003e 重复。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e在项目看板加 Runs 视图\u003c/strong\u003e：与 architecture-first 和固定导航冲突；真要做应放进 runtime viewer 并单独写 ADR。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e只读根目录 \u003ccode\u003eAGENTS.md\u003c/code\u003e\u003c/strong\u003e：实现简单，但不满足子目录规范覆盖根目录规则。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e每个 assistant turn 重载指令\u003c/strong\u003e：能更快感知修改，但会让 prompt 前缀在任务中途变化，破坏缓存。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e把指令放进 user message\u003c/strong\u003e：会混淆用户输入和仓库规范，也不利于稳定前缀。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eRevisit 条件\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e出现 runtime viewer，需要跨 session 的 Runs / metrics 视图。\u003c/li\u003e\n\u003cli\u003e需要更精细的缓存诊断（按 system / tools / history 分段统计）。\u003c/li\u003e\n\u003cli\u003e指令来源扩展到 include、工作区外配置或多仓库继承。\u003c/li\u003e\n\u003cli\u003edigest 需要密码学校验或跨机器比较，FNV-1a 不再够用。\u003c/li\u003e\n\u003c/ol\u003e\n","path":"docs/adr/0009-instructions-metrics.md","excerpt":"AGENTS.md 每次 run 按 cwd 向上发现并追加到稳定前缀；缓存命中率从 turn_end.usage 派生，不引入 Runs 看板。"},{"id":"adr-0010","title":"ADR-0010：事件 ID 用稳定序号，fork 复制前缀并追加溯源事件","kind":"adr","status":"accepted","order":29,"summary":"事件 ID 是解码事件的 1-based 序号；replay 只做投影；fork 复制前缀并在末尾追加 fork 溯源事件。","body_html":"\u003ch2\u003e状态\u003c/h2\u003e\n\u003cp\u003eAccepted · 2026-10-20\u003c/p\u003e\n\u003ch2\u003e背景\u003c/h2\u003e\n\u003cp\u003eM3-001 需要 \u003ccode\u003eniucode replay \u0026lt;session\u0026gt;\u003c/code\u003e 和 \u003ccode\u003eniucode fork \u0026lt;session\u0026gt; --at \u0026lt;event-id\u0026gt;\u003c/code\u003e。现有日志只有事件内容和时间戳，没有事件 ID；如果给每条事件加 UUID，会改动所有构造点和旧日志，而且回放不再确定。\u003c/p\u003e\n\u003cp\u003e日志是 append-only 的，因此“第几个解码事件”本身就是一个稳定标识。\u003ccode\u003eload\u003c/code\u003e 已经能跳过坏行并报告 warning；这正好可以作为 ID 的语义基础。\u003c/p\u003e\n\u003ch2\u003e决策\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e事件 ID 是解码事件的 1-based 序号。\u003c/strong\u003e 显示为 \u003ccode\u003ee000012\u003c/code\u003e，解析接受 \u003ccode\u003ee12\u003c/code\u003e、\u003ccode\u003eE12\u003c/code\u003e 或 \u003ccode\u003e12\u003c/code\u003e；\u003ccode\u003ee000000\u003c/code\u003e 非法。ID 不写进事件内容。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e坏行不制造 ID。\u003c/strong\u003e \u003ccode\u003eload\u003c/code\u003e 只把成功解码的事件计入序号，因此坏行不会让后续有效事件的 ID 漂移；这也意味着 ID 是“有效事件序号”，不是物理行号。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003efork 复制已验证的前缀。\u003c/strong\u003e \u003ccode\u003efork --at \u0026lt;id\u0026gt;\u003c/code\u003e 解析 ID、校验范围，复制 \u003ccode\u003eevents[0..=index]\u003c/code\u003e 到新 session，再在末尾追加一条 \u003ccode\u003efork\u003c/code\u003e 事件：\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003eFork { parent, parent_event, ts }\n\u003c/code\u003e\u003c/pre\u003e\n新文件通过 \u003ccode\u003eSessionLog::create\u003c/code\u003e 的 \u003ccode\u003ecreate_new\u003c/code\u003e 创建，不覆盖已有文件。源文件只读，不会被修改。复制的 \u003ccode\u003esession_start\u003c/code\u003e 保留父 session 的 id；新 session 的身份由文件名和末尾的 \u003ccode\u003efork\u003c/code\u003e 事件表达，避免重写前缀。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e复制保持事件顺序和下标。\u003c/strong\u003e \u003ccode\u003ecompaction.upto\u003c/code\u003e 是绝对事件下标，fork 不插入事件到前缀中，只在末尾追加溯源事件，因此旧 compaction 仍然有效。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ereplay 只做投影。\u003c/strong\u003e 对每个 \u003ccode\u003euser_message\u003c/code\u003e，投影到“下一个 assistant 消息之前”，把 compaction / instructions 等请求前追加的事件也算进去；不构造 provider，不调用模型。每 turn 输出消息数、估算 token 和投影 digest。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e冲突/错误处理。\u003c/strong\u003e 无法解析、越界或指向不存在事件的 ID 直接失败；目标文件名冲突由 \u003ccode\u003ecreate_new\u003c/code\u003e 拒绝；坏尾行作为 warning 输出，fork 只复制有效前缀。\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e后果\u003c/h2\u003e\n\u003ch3\u003e正向\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e不改变事件 schema，旧日志可以直接 replay/fork。\u003c/li\u003e\n\u003cli\u003eID 在 append-only 日志里稳定；fork 后前缀事件的 ID 与父 session 一致，便于追溯。\u003c/li\u003e\n\u003cli\u003efork 不重写源文件，compaction 下标不会被破坏。\u003c/li\u003e\n\u003cli\u003ereplay 完全离线，可用于检查投影和 token 预算。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e负向\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eID 不是内容哈希：如果手动编辑或重写日志，ID 可能指向不同内容。\u003c/li\u003e\n\u003cli\u003eID 不是全局唯一；跨 session 合并需要额外命名空间。\u003c/li\u003e\n\u003cli\u003efork 重新序列化事件，未来新增的未知字段在复制时可能丢失；当前 schema 已知，可接受。\u003c/li\u003e\n\u003cli\u003e物理行号和事件 ID 在坏行存在时不一致，排查时需要以 \u003ccode\u003esession show\u003c/code\u003e 的序号为准。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e备选方案\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e给每条事件加 UUID/ULID\u003c/strong\u003e：全局唯一，但要改所有构造点，回放不确定，旧日志还要迁移。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e内容哈希\u003c/strong\u003e：能检测篡改，但事件编辑后 ID 变化，fork 追溯会断。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e物理行号\u003c/strong\u003e：实现简单，但坏行或压缩空行会让序号漂移。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003efork 时插入新的 session_start\u003c/strong\u003e：能更新新 session 身份，但会移动后续事件下标，破坏 compaction.upto。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003efork 直接复制原始行\u003c/strong\u003e：保留格式，但坏行会一起复制，且未来字段兼容性更差。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eRevisit 条件\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e需要跨 session 合并或全局引用事件，引入 \u003ccode\u003esession_id:event_id\u003c/code\u003e 命名空间。\u003c/li\u003e\n\u003cli\u003e需要内容完整性校验，增加内容哈希字段而不是替换位置 ID。\u003c/li\u003e\n\u003cli\u003efork 需要保留未知/未来字段，改为复制原始 JSON 值。\u003c/li\u003e\n\u003cli\u003e需要按时间或语义选择 fork 点，提供时间戳/事件类型选择器。\u003c/li\u003e\n\u003c/ol\u003e\n","path":"docs/adr/0010-event-ids-replay-fork.md","excerpt":"事件 ID 是解码事件的 1-based 序号；replay 只做投影；fork 复制前缀并在末尾追加 fork 溯源事件。"},{"id":"adr-0011","title":"ADR-0011：Subagent 是带独立日志的只读子运行","kind":"adr","status":"accepted","order":30,"summary":"subagent 工具并行跑 1–4 个只读任务；每个任务独立 session 日志，父 session 只记录 spawn/result 和摘要路径。","body_html":"\u003ch2\u003e状态\u003c/h2\u003e\n\u003cp\u003eAccepted · 2026-10-20\u003c/p\u003e\n\u003ch2\u003e背景\u003c/h2\u003e\n\u003cp\u003eM3-002 需要并行只读探索，同时保持写操作串行、父子日志可追溯、父上下文不被子 agent 的完整 transcript 污染。直接复用主 agent 循环不够：子运行必须有独立的工具白名单、步数、token、超时和日志。\u003c/p\u003e\n\u003ch2\u003e决策\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e只加一个 \u003ccode\u003esubagent\u003c/code\u003e 工具。\u003c/strong\u003e 输入是 \u003ccode\u003etasks\u003c/code\u003e 数组（1–4 个），每个任务有 \u003ccode\u003eprompt\u003c/code\u003e 和可选的 \u003ccode\u003emax_steps\u003c/code\u003e、\u003ccode\u003etimeout_secs\u003c/code\u003e。不加多个 spawn/wait/kill 工具。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e子 agent 只读。\u003c/strong\u003e 工具规格和执行白名单都限制为 \u003ccode\u003eread\u003c/code\u003e、\u003ccode\u003egrep\u003c/code\u003e、\u003ccode\u003eglob\u003c/code\u003e；没有 \u003ccode\u003ewrite\u003c/code\u003e、\u003ccode\u003eedit\u003c/code\u003e、\u003ccode\u003ebash\u003c/code\u003e，也没有 \u003ccode\u003esubagent\u003c/code\u003e，所以不能递归。sandbox 设为 read-only + network off，作为第二道边界。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e每个任务独立 session。\u003c/strong\u003e 子日志放在父 session 旁的 \u003ccode\u003e\u0026lt;parent-stem\u0026gt;.subagents/\u003c/code\u003e 目录；子 \u003ccode\u003esession_start.id\u003c/code\u003e 等于父 spawn 事件的 id。父 session 追加：\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003esubagent_spawn { id, call_id, task, session, max_steps, timeout_secs, context_budget }\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003esubagent_result { id, call_id, ok, summary, session, turns, usage }\u003c/code\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e并行执行，父 session 串行写。\u003c/strong\u003e 任务用 \u003ccode\u003ejoin_all\u003c/code\u003e 并发跑；父 session 只在 spawn 前和 collect 后写入，不跨 future 共享 \u003ccode\u003e\u0026amp;mut SessionLog\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e父上下文只收到一条 tool_result。\u003c/strong\u003e 内容是每个任务的摘要 + 完整子日志路径，不包含子 agent 的 system prompt、tool 调用或完整 transcript。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e独立预算。\u003c/strong\u003e 默认 \u003ccode\u003emax_steps=6\u003c/code\u003e（上限 12），\u003ccode\u003etimeout_secs=120\u003c/code\u003e（上限 600），上下文预算为 \u003ccode\u003emin(parent_budget, 16k)\u003c/code\u003e；使用同一个 provider/model，但每个任务自己的 \u003ccode\u003eSessionLog\u003c/code\u003e 和 usage。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e失败隔离。\u003c/strong\u003e 子 agent 超时、provider 错误或 max steps 都变成 \u003ccode\u003eok=false\u003c/code\u003e 的 result，父 agent 继续。超时/失败后给子日志补 \u003ccode\u003esession_end\u003c/code\u003e；父 session 不受影响。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e工具面增加一个是显式取舍。\u003c/strong\u003e 并行只读探索无法由现有六个工具完成；子 agent 不增加新的写路径。\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e后果\u003c/h2\u003e\n\u003ch3\u003e正向\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e并行探索缩短大范围搜索的 wall-clock 时间。\u003c/li\u003e\n\u003cli\u003e父子日志分离，父上下文只增加一条摘要，不会被搜索细节撑爆。\u003c/li\u003e\n\u003cli\u003e每个结论都有子 session 路径，可回到原始 transcript。\u003c/li\u003e\n\u003cli\u003e写操作仍只在主 session，串行边界不变。\u003c/li\u003e\n\u003cli\u003e子 agent 不能递归、不能写、不能跑 shell，边界简单。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e负向\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eprovider 会同时收到多个请求；并发限流/配额需要 provider 侧配合。\u003c/li\u003e\n\u003cli\u003e子 agent 只有只读工具，复杂的验证仍需父 agent 自己做。\u003c/li\u003e\n\u003cli\u003e子日志不在 \u003ccode\u003esession list\u003c/code\u003e 的顶层目录里，需要看父事件里的路径。\u003c/li\u003e\n\u003cli\u003e超时直接 drop 子 future，可能留下不完整的子日志（已补 \u003ccode\u003esession_end\u003c/code\u003e，但没有 assistant 结果）。\u003c/li\u003e\n\u003cli\u003e父 tool_result 可能包含多个摘要，仍然是一条消息；摘要长度有上限。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e备选方案\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e多个工具（spawn/poll/wait）\u003c/strong\u003e：灵活，但会把调度和生命周期推给模型，prompt 和状态机都变复杂。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e子 agent 继承全部工具\u003c/strong\u003e：能写文件，但与“写操作仍由主 session 串行”冲突，审批和并发写风险都上升。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e递归 subagent\u003c/strong\u003e：可能无限展开，成本不可控；当前白名单直接排除。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e把完整子 transcript 塞回父上下文\u003c/strong\u003e：信息最全，但违背“父上下文只增加摘要”，也会让缓存和预算失控。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e独立进程/daemon\u003c/strong\u003e：隔离更强，但 M3 仍是单进程内并发，先证明日志和预算边界。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eRevisit 条件\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e子 agent 需要写操作，必须重新设计写串行、审批和冲突检测。\u003c/li\u003e\n\u003cli\u003e任务数超过 4 或需要层级子 agent，引入显式调度器/依赖图。\u003c/li\u003e\n\u003cli\u003eprovider 并发限流成为瓶颈，需要队列和背压。\u003c/li\u003e\n\u003cli\u003e需要在 \u003ccode\u003esession list\u003c/code\u003e / 看板中直接浏览子 session，增加索引或 runtime viewer。\u003c/li\u003e\n\u003c/ol\u003e\n","path":"docs/adr/0011-subagents.md","excerpt":"subagent 工具并行跑 1–4 个只读任务；每个任务独立 session 日志，父 session 只记录 spawn/result 和摘要路径。"},{"id":"provider","title":"Provider 与 DeepSeek 接入","kind":"doc","status":"living","order":30,"summary":"OpenAI-compatible SSE 的归一化、DeepSeek 参数、错误分类和重试边界。","body_html":"\u003ch2\u003e为什么先做 OpenAI-compatible\u003c/h2\u003e\n\u003cp\u003eDeepSeek 和 OpenAI 都提供 Chat Completions 风格接口：\u003ccode\u003ePOST /chat/completions\u003c/code\u003e，\u003ccode\u003estream: true\u003c/code\u003e 返回 SSE，工具调用使用 \u003ccode\u003etools\u003c/code\u003e / \u003ccode\u003etool_calls\u003c/code\u003e。先把这一种 wire format 做扎实，比同时维护多套协议更有价值。\u003c/p\u003e\n\u003cp\u003eProvider 层只做三件事：发请求、解析 SSE、归一化成 \u003ccode\u003eStreamEvent\u003c/code\u003e。它不知道工具如何执行，也不持有 session。\u003c/p\u003e\n\u003ch2\u003eCLI\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"language-sh\"\u003eniucode auth set deepseek\nniucode provider list\n\n# DeepSeek：默认模型 deepseek-flash，默认开启 thinking\nniucode provider test --preset deepseek\n\n# 指定模型 / 关闭 thinking\nniucode provider test --preset deepseek --model deepseek-v4-pro --no-thinking\n\n# OpenAI\nniucode auth set openai\nniucode provider test --preset openai\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2\u003e环境变量\u003c/h2\u003e\n\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e变量\u003c/th\u003e\u003cth\u003e默认值\u003c/th\u003e\u003cth\u003e说明\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eDEEPSEEK_API_KEY\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e必填或 \u003ccode\u003eniucode auth\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eDeepSeek API key\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eDEEPSEEK_BASE_URL\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003ehttps://api.deepseek.com\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e不要重复拼 \u003ccode\u003e/chat/completions\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eDEEPSEEK_MODEL\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003edeepseek-flash\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e也可用 \u003ccode\u003edeepseek-v4-pro\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eDEEPSEEK_THINKING\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003eenabled\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003eenabled\u003c/code\u003e / \u003ccode\u003edisabled\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eDEEPSEEK_REASONING_EFFORT\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eAPI 默认（high）\u003c/td\u003e\u003ctd\u003e\u003ccode\u003enone\u003c/code\u003e / \u003ccode\u003elow\u003c/code\u003e / \u003ccode\u003ehigh\u003c/code\u003e / \u003ccode\u003emax\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eOPENAI_API_KEY\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e必填或 \u003ccode\u003eniucode auth\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eOpenAI key\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eOPENAI_BASE_URL\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003ehttps://api.openai.com/v1\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e兼容网关可覆盖\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eOPENAI_MODEL\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003egpt-4o-mini\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e兼容网关可覆盖\u003c/td\u003e\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e模型名会变化。DeepSeek 当前推荐 \u003ccode\u003edeepseek-flash\u003c/code\u003e 与 \u003ccode\u003edeepseek-v4-pro\u003c/code\u003e，以 \u003ca href=\"https://api-docs.deepseek.com/zh-cn/\"\u003e官方文档\u003c/a\u003e 为准。\u003c/p\u003e\n\u003cp\u003e凭证解析顺序是 env → OS keyring → 0600 文件；详见 \u003ca href=\"auth.md\"\u003e凭证与 niucode auth\u003c/a\u003e。\u003c/p\u003e\n\u003ch2\u003e请求\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003estream: true\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003estream_options.include_usage: true\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003eDeepSeek：\u003ccode\u003ethinking: {\"type\": \"enabled\" | \"disabled\"}\u003c/code\u003e，可选 \u003ccode\u003ereasoning_effort\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e工具：\u003ccode\u003etools: [{ \"type\": \"function\", \"function\": { name, description, parameters } }]\u003c/code\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e响应是 SSE：\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003edata: {\"choices\":[{\"delta\":{\"reasoning_content\":\"...\"},\"finish_reason\":null}]}\n\ndata: {\"choices\":[{\"delta\":{\"content\":\"...\"},\"finish_reason\":null}]}\n\ndata: {\"choices\":[{\"delta\":{\"tool_calls\":[...]}}]}\n\ndata: {\"choices\":[{\"delta\":{},\"finish_reason\":\"stop\"}],\"usage\":{...}}\n\ndata: [DONE]\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2\u003e归一化事件\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eTextDelta\u003c/code\u003e：\u003ccode\u003edelta.content\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eReasoningDelta\u003c/code\u003e：\u003ccode\u003edelta.reasoning_content\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eToolCallDelta\u003c/code\u003e：\u003ccode\u003edelta.tool_calls[]\u003c/code\u003e，保留 \u003ccode\u003eindex\u003c/code\u003e、\u003ccode\u003eid\u003c/code\u003e、\u003ccode\u003ename\u003c/code\u003e、\u003ccode\u003earguments\u003c/code\u003e 片段；拼装由 loop 负责\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eUsage\u003c/code\u003e：\u003ccode\u003eprompt_tokens\u003c/code\u003e → input、\u003ccode\u003ecompletion_tokens\u003c/code\u003e → output、\u003ccode\u003eprompt_tokens_details.cached_tokens\u003c/code\u003e → cached、\u003ccode\u003ecompletion_tokens_details.reasoning_tokens\u003c/code\u003e → reasoning\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eDone\u003c/code\u003e：\u003ccode\u003e[DONE]\u003c/code\u003e 或流结束，带最后看到的 \u003ccode\u003efinish_reason\u003c/code\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eSSE 解析器按行缓冲，支持一个事件跨多个网络 chunk、多行 \u003ccode\u003edata:\u003c/code\u003e、注释/keepalive，以及没有 \u003ccode\u003e[DONE]\u003c/code\u003e 的流。\u003c/p\u003e\n\u003ch2\u003eDeepSeek 的思考模式\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e默认开启 thinking；\u003ccode\u003ereasoning_content\u003c/code\u003e 与 \u003ccode\u003econtent\u003c/code\u003e 同级。\u003c/li\u003e\n\u003cli\u003e请求携带 \u003ccode\u003etools\u003c/code\u003e 时，历史 assistant 消息里的 \u003ccode\u003ereasoning_content\u003c/code\u003e \u003cstrong\u003e必须回传\u003c/strong\u003e，否则 API 返回 400。\u003ccode\u003eChatMessage::assistant\u003c/code\u003e 保留该字段。\u003c/li\u003e\n\u003cli\u003e不携带 \u003ccode\u003etools\u003c/code\u003e 时，历史 reasoning 不需要回传。\u003c/li\u003e\n\u003cli\u003ethinking 模式下 \u003ccode\u003etemperature\u003c/code\u003e 等参数可能被忽略；不要依赖它们做确定性控制。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e错误与重试\u003c/h2\u003e\n\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e情况\u003c/th\u003e\u003cth\u003e分类\u003c/th\u003e\u003cth\u003e可重试\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\n\u003ctr\u003e\u003ctd\u003e401 / 403\u003c/td\u003e\u003ctd\u003e\u003ccode\u003eAuth\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e否\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e400 / 422 且提示 context length\u003c/td\u003e\u003ctd\u003e\u003ccode\u003eContextOverflow\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e否，交给 compaction\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e429 / 408 / 425 / 5xx\u003c/td\u003e\u003ctd\u003e\u003ccode\u003eHttp\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e是，读取 \u003ccode\u003eRetry-After\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e402 余额不足\u003c/td\u003e\u003ctd\u003e\u003ccode\u003eHttp\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e否\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e网络连接失败\u003c/td\u003e\u003ctd\u003e\u003ccode\u003eNetwork\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e是\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eSSE JSON 损坏 / 中途断流\u003c/td\u003e\u003ctd\u003e\u003ccode\u003eDecode\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e否（已产生部分输出，不能原地重放）\u003c/td\u003e\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003e重试边界在 turn 开始前\u003c/strong\u003e。一旦工具已经执行或流已经产生输出，不能把整个 turn 重放；应该记录失败并开新 turn。\u003c/p\u003e\n\u003ch2\u003e测试\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"language-sh\"\u003ecargo test -p niucode-provider\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e测试不访问网络：一个本地 TCP server 返回 SSE，验证流式解析；另外覆盖 429 \u003ccode\u003eRetry-After\u003c/code\u003e、context overflow 分类、reasoning/tool call 的序列化。\u003c/p\u003e\n\u003ch2\u003e当前限制\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e只支持 Chat Completions；不做 Responses API / Anthropic Messages。\u003c/li\u003e\n\u003cli\u003etool call 参数拼装、执行、审批在 loop/tools，不在 provider。\u003c/li\u003e\n\u003cli\u003e没有读超时和 per-chunk idle timeout；长流依赖取消信号。\u003c/li\u003e\n\u003cli\u003e没有音频/图像输入；v0 只处理文本。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e学习点\u003c/h2\u003e\n\u003cp\u003e写完这一层，应该能回答：SSE 的 \u003ccode\u003edata:\u003c/code\u003e 和空行如何分帧？一个 tool call 的参数为什么要按片段拼接？\u003ccode\u003ereasoning_content\u003c/code\u003e 为什么在带 tools 的历史里不能丢？429 和“流中途失败”为什么不能用同一种重试？\u003c/p\u003e\n","path":"docs/provider.md","excerpt":"OpenAI-compatible SSE 的归一化、DeepSeek 参数、错误分类和重试边界。"},{"id":"adr-0012","title":"ADR-0012：exec --json 是稳定的 JSONL 协议","kind":"adr","status":"accepted","order":31,"summary":"每行一个 JSON 事件；start 带 protocol=1；stdout 只放协议，stderr 放人类诊断；approval=ask 被拒绝。","body_html":"\u003ch2\u003e状态\u003c/h2\u003e\n\u003cp\u003eAccepted · 2026-10-20\u003c/p\u003e\n\u003ch2\u003e背景\u003c/h2\u003e\n\u003cp\u003eM3 的退出条件之一是 \u003ccode\u003eexec --json\u003c/code\u003e 成为稳定协议。现有 \u003ccode\u003eniucode exec\u003c/code\u003e 把模型文本写 stdout、状态写 stderr，适合人读，不适合脚本、editor 集成或 CI 判断。需要一个机器可读、增量流式、不会把完整工具输出重复塞进协议的接口。\u003c/p\u003e\n\u003ch2\u003e决策\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003estdout 是 JSONL，一行一个 JSON 对象。\u003c/strong\u003e stderr 继续放人类诊断（启动信息、错误、session 路径）；stdout 不混入普通文本。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\u003ccode\u003estart\u003c/code\u003e 带 \u003ccode\u003eprotocol: 1\u003c/code\u003e。\u003c/strong\u003e 客户端先读第一行，确认 \u003ccode\u003etype = \"start\"\u003c/code\u003e 和协议版本；后续只做加法兼容，不改变已有字段含义。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e事件类型固定为：\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003estart\u003c/code\u003e：session、model、provider、cwd、sandbox、network、approval、backend。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003etext_delta\u003c/code\u003e / \u003ccode\u003ereasoning_delta\u003c/code\u003e：增量文本。\u003c/li\u003e\n\u003cli\u003e\u
