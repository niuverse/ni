003ccode\u003etool_call\u003c/code\u003e：name、input。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003etool_result\u003c/code\u003e：name、ok、summary。\u003cstrong\u003e不包含完整 output\u003c/strong\u003e，完整内容在 session JSONL。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eturn_end\u003c/code\u003e：usage（input/output/cached/reasoning/cache percent）。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ecompaction\u003c/code\u003e：replaced_events、before/after token 估算。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ewarning\u003c/code\u003e：message。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003edone\u003c/code\u003e：turns、usage、session。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ecancelled\u003c/code\u003e / \u003ccode\u003eerror\u003c/code\u003e：终止状态；error 同时以非零退出码结束。\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\u003ccode\u003e--json\u003c/code\u003e 不交互。\u003c/strong\u003e \u003ccode\u003e--approval ask\u003c/code\u003e 直接拒绝；如果没有 bwrap 导致 \u003ccode\u003eon-failure\u003c/code\u003e 降级为 ask，也拒绝。防御性地，如果 JSON 模式下真的收到审批请求，输出一条 warning 并拒绝该工具，而不是阻塞读 stdin。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e退出码保持 shell 语义。\u003c/strong\u003e 成功和用户取消返回 0；模型/provider 错误返回非零，stdout 仍以 \u003ccode\u003eerror\u003c/code\u003e 事件结束。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e协议不重复 session 日志。\u003c/strong\u003e \u003ccode\u003etool_result\u003c/code\u003e 只给 summary；需要完整工具输出、reasoning 或事件历史时读 \u003ccode\u003esession\u003c/code\u003e 路径。这样 JSONL 的每行大小可控，也避免第二份真相。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\u003ccode\u003e--json\u003c/code\u003e 只属于 headless exec。\u003c/strong\u003e TUI 是交互界面，不提供该模式。\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e后果\u003c/h2\u003e\n\u003ch3\u003e正向\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e脚本和编辑器可以增量消费同一个事件流，不需要解析人类输出。\u003c/li\u003e\n\u003cli\u003e协议行大小可控；完整 output 在日志里，仍可追溯。\u003c/li\u003e\n\u003cli\u003e与 \u003ccode\u003eexec --record\u003c/code\u003e / \u003ccode\u003e--replay\u003c/code\u003e 兼容，离线测试不需要 API key。\u003c/li\u003e\n\u003cli\u003e事件类型与 \u003ccode\u003eAgentEvent\u003c/code\u003e 基本同构，CLI/TUI/JSON 三种 client 共享语义。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e负向\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e新增一个需要维护的对外 schema；字段只能加法演进。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003etool_result\u003c/code\u003e 不含完整 output，客户端需要额外读 session 文件。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e--approval ask\u003c/code\u003e 不可用，交互式审批只能走 TUI。\u003c/li\u003e\n\u003cli\u003estderr 仍是人类文本，纯机器消费者需要忽略它。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e备选方案\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e一次性 JSON 数组\u003c/strong\u003e：简单，但不是流式，长任务无法增量消费。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eNDJSON 中包含完整 tool output\u003c/strong\u003e：信息全，但 bash 20KB 输出会撑大每一行，且与 session 日志重复。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e复用 provider 原始 SSE\u003c/strong\u003e：泄漏 wire format，破坏 provider 薄边界。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e单独 metrics 文件\u003c/strong\u003e：又一份持久状态，和事件日志重复。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eTUI 也支持 --json\u003c/strong\u003e：TUI 本身是交互界面，混合模式会增加终端状态复杂度，不做。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eRevisit 条件\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e需要 editor/LSP 双向协议，而不只是单向事件流。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003etool_result\u003c/code\u003e 的 summary 不够，需要分页或按需拉取完整 output。\u003c/li\u003e\n\u003cli\u003e协议需要多版本并存，引入 \u003ccode\u003eprotocol: 2\u003c/code\u003e 和协商字段。\u003c/li\u003e\n\u003cli\u003e需要非交互审批（例如 policy server），引入审批事件/回调而不是 stdin。\u003c/li\u003e\n\u003c/ol\u003e\n","path":"docs/adr/0012-exec-json.md","excerpt":"每行一个 JSON 事件；start 带 protocol=1；stdout 只放协议，stderr 放人类诊断；approval=ask 被拒绝。"},{"id":"auth","title":"凭证与 niucode auth","kind":"doc","status":"living","order":31,"summary":"API key 的解析顺序、keyring/0600 文件回退、安全约束，以及为什么不做网页账号 cookie。","body_html":"\u003ch2\u003e命令\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"language-sh\"\u003eniucode auth set deepseek        # 隐藏输入\nniucode auth set openai\nprintf '%s\\n' \"$KEY\" | niucode auth set deepseek --stdin\n\nniucode auth status              # 只显示来源，不显示 key\nniucode auth unset deepseek\n\nniucode provider test --preset deepseek\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003eniucode auth set\u003c/code\u003e 会打印 key 的创建页面。key 本身不会回显，也不会写入 session log。\u003c/p\u003e\n\u003ch2\u003e解析顺序\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003eAuthStore::resolve\u003c/code\u003e 固定按以下顺序：\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e环境变量\u003c/strong\u003e：\u003ccode\u003eDEEPSEEK_API_KEY\u003c/code\u003e / \u003ccode\u003eOPENAI_API_KEY\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eOS keyring\u003c/strong\u003e：service \u003ccode\u003eniucode\u003c/code\u003e，account 是 provider id（\u003ccode\u003edeepseek\u003c/code\u003e / \u003ccode\u003eopenai\u003c/code\u003e）\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e0600 文件\u003c/strong\u003e：\u003ccode\u003e$NIUCODE_CONFIG_DIR/credentials.toml\u003c/code\u003e，否则 \u003ccode\u003e$XDG_CONFIG_HOME/niucode/credentials.toml\u003c/code\u003e，否则 \u003ccode\u003e~/.config/niucode/credentials.toml\u003c/code\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e环境变量永远优先，适合 CI 和临时覆盖。keyring 可用时写入 keyring；keyring 不可用（无桌面、容器、无 Secret Service）时回退文件。\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-sh\"\u003e# 强制文件回退，避免在 headless 环境触发 keyring\nNIUCODE_AUTH_DISABLE_KEYRING=1 niucode auth set deepseek\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2\u003e文件格式\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"language-toml\"\u003e[providers.deepseek]\napi_key = \"sk-...\"\n\u003c/code\u003e\u003c/pre\u003e\n\u003cul\u003e\n\u003cli\u003e目录不存在时创建为 \u003ccode\u003e0700\u003c/code\u003e；文件写入临时文件后 \u003ccode\u003erename\u003c/code\u003e，权限 \u003ccode\u003e0600\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eniucode auth status\u003c/code\u003e 在文件权限过宽时显示 \u003ccode\u003einsecure\u003c/code\u003e 并警告。\u003c/li\u003e\n\u003cli\u003e解析失败只返回“credentials file is not valid TOML”，不回显文件内容，避免错误信息泄露 key。\u003c/li\u003e\n\u003cli\u003e不支持把 key 写进仓库配置、session JSONL 或日志。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eLinux 依赖\u003c/h2\u003e\n\u003cp\u003eLinux 的 keyring 走 Secret Service（DBus）。构建需要 \u003ccode\u003elibdbus-1-dev\u003c/code\u003e；运行需要桌面 keyring 服务。两者都没有时，用 \u003ccode\u003eNIUCODE_AUTH_DISABLE_KEYRING=1\u003c/code\u003e 或让程序自动回退到文件。\u003c/p\u003e\n\u003cp\u003emacOS / Windows 使用系统 keychain / Credential Manager。\u003c/p\u003e\n\u003ch2\u003e为什么不做网页账号登录\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eDeepSeek 没有面向第三方客户端的公开账号 OAuth；官方接入是 API key。\u003c/li\u003e\n\u003cli\u003eChatGPT 账号登录有官方的 \u003ca href=\"https://developers.openai.com/siwc/quickstart\"\u003eSign in with ChatGPT\u003c/a\u003e，但需要 OAuth + Responses API，且面向本地开源/个人项目；它是独立的 provider/auth 项目，不是“复用网页 cookie”。\u003c/li\u003e\n\u003cli\u003e抓 cookie / 模拟网页请求会带来 ToS、封号、WAF、2FA 和密钥泄露风险，不作为 harness 的能力。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e详见 \u003ca href=\"#/docs/provider\"\u003eProvider 与 DeepSeek 接入\u003c/a\u003e 和 \u003ca href=\"#/docs/roadmap\"\u003eRoadmap\u003c/a\u003e。\u003c/p\u003e\n\u003ch2\u003e安全边界\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eSecretKey\u003c/code\u003e 的 \u003ccode\u003eDebug\u003c/code\u003e 输出是 \u003ccode\u003eSecretKey(***)\u003c/code\u003e；命令行只打印来源。\u003c/li\u003e\n\u003cli\u003e每次 \u003ccode\u003eniucode auth status\u003c/code\u003e 会查询 keyring；在锁屏/未解锁的桌面上可能触发系统解锁提示。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eniucode auth unset\u003c/code\u003e 同时删除 keyring 和文件；不会尝试猜测其他存储位置。\u003c/li\u003e\n\u003cli\u003e目前没有做内存 zeroize；key 在进程生命周期内存在。后续如果需要更强保证，再引入 \u003ccode\u003esecrecy\u003c/code\u003e/\u003ccode\u003ezeroize\u003c/code\u003e 并重新评估。\u003c/li\u003e\n\u003c/ul\u003e\n","path":"docs/auth.md","excerpt":"API key 的解析顺序、keyring/0600 文件回退、安全约束，以及为什么不做网页账号 cookie。"},{"id":"exec","title":"niucode exec 与最小闭环","kind":"doc","status":"living","order":32,"summary":"headless 任务入口、六个基础工具 + subagent + sidecar external tools、JSONL 协议、session 事件、上下文压缩、分层 AGENTS.md 与缓存指标。","body_html":"\u003ch2\u003e用法\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"language-sh\"\u003eniucode auth set deepseek\nniucode exec \"find the failing test and fix it\"\n\n# 更便宜/更快的验证\nniucode exec \"read a.txt and summarize it\" --no-thinking\n\n# 指定工作区和会话目录\nniucode exec \"fix the build\" \\\n  --cwd /path/to/repo \\\n  --session-dir /tmp/niucode-sessions\n\n# 换模型 / 限制轮数 / 上下文预算\nniucode exec \"...\" --model deepseek-v4-pro --max-steps 0\n\n# Headless goal loop（met=0 / budget=2 / impossible=3 / cancel=130）\nniucode exec \"fix the tests\" --goal \"cargo test passes\" --max-goal-turns 6 --json\n# sessions default to ~/.niucode/projects/\u0026lt;key\u0026gt;/sessions/\nniucode exec \"...\" --context-budget 128000 --keep-recent-turns 4\n\n# 机器可读的 JSONL 事件流\nniucode exec \"...\" --json \u0026gt; events.jsonl\n\n# 沙箱三轴\nniucode exec \"...\" --sandbox read-only --network off\nniucode exec \"...\" --sandbox workspace-write --approval ask\nniucode exec \"...\" --sandbox full-access --network on --approval never\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003eniucode exec\u003c/code\u003e 是 headless 入口：默认文本流到 stdout，工具调用和 usage 流到 stderr，session 写入 JSONL；加 \u003ccode\u003e--json\u003c/code\u003e 时 stdout 改为 JSONL 事件流。\u003c/p\u003e\n\u003cp\u003e凭证通过 \u003ccode\u003eniucode-auth\u003c/code\u003e 解析：环境变量 → OS keyring → 0600 文件。没有凭证时会提示：\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003eno credential for deepseek; run `niucode auth set deepseek` or set DEEPSEEK_API_KEY\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2\u003e闭环结构\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003esession_start\n  → policy\n  → user_message\n  → compaction (?)\n  → provider.stream\n  → assistant_message\n  → turn_end\n  → approval (?)\n  → tool_result (0..n)\n  → provider.stream (下一 turn)\n  → ...\n  → session_end\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e一个 turn 的事件顺序固定：assistant 消息先落盘，再落工具执行结果，然后进入下一轮。工具结果不会丢；resume 可以从同一份日志重建。\u003c/p\u003e\n\u003ch2\u003e工具\u003c/h2\u003e\n\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e工具\u003c/th\u003e\u003cth\u003e行为\u003c/th\u003e\u003cth\u003e约束\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eread\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e带行号读取文本\u003c/td\u003e\u003ctd\u003e最多 2000 行 / 50KB；支持 offset/limit\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003ewrite\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e新建或完整覆盖\u003c/td\u003e\u003ctd\u003e已存在的文件必须先 \u003ccode\u003eread\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eedit\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e精确字符串替换\u003c/td\u003e\u003ctd\u003e必须唯一匹配；先 \u003ccode\u003eread\u003c/code\u003e；返回 unified diff\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003egrep\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e正则搜索文本\u003c/td\u003e\u003ctd\u003e尊重 \u003ccode\u003e.gitignore\u003c/code\u003e；结果上限 200\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eglob\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eglob 列文件\u003c/td\u003e\u003ctd\u003e尊重 \u003ccode\u003e.gitignore\u003c/code\u003e；结果上限 200\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003ebash\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e在 cwd 执行命令\u003c/td\u003e\u003ctd\u003e独立进程组；默认 120s 超时；尾部 20KB + 临时输出路径\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003esubagent\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e并行只读探索\u003c/td\u003e\u003ctd\u003e1–4 个任务；仅 read/grep/glob；独立日志；返回摘要 + 路径\u003c/td\u003e\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e文件工具会把路径 canonicalize 到工作区内部；\u003ccode\u003e../\u003c/code\u003e 或绝对路径逃逸会被拒绝。\u003ccode\u003ebash\u003c/code\u003e 是逃生舱，不经过这层路径策略。\u003c/p\u003e\n\u003ch2\u003eResume 与录制回放\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"language-sh\"\u003e# 从已有 session 继续\nniucode exec \"continue from here\" --resume /path/to/session.jsonl\n\n# 录制归一化 provider turn\nniucode exec \"record this\" --record /tmp/fixture.json\n\n# 完全离线重放，不需要 API key\nniucode exec \"replay this\" --replay /tmp/fixture.json\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003e--resume\u003c/code\u003e 会从 \u003ccode\u003euser_message\u003c/code\u003e、\u003ccode\u003eassistant_message\u003c/code\u003e、\u003ccode\u003etool_result\u003c/code\u003e 重建历史，跳过 \u003ccode\u003eturn_end\u003c/code\u003e / \u003ccode\u003esession_end\u003c/code\u003e；如果存在 \u003ccode\u003ecompaction\u003c/code\u003e，按最后一个事件的 \u003ccode\u003eupto\u003c/code\u003e 在 cutoff 处插入 handoff system 消息。未指定 \u003ccode\u003e--cwd\u003c/code\u003e 时使用 \u003ccode\u003esession_start\u003c/code\u003e 里的 cwd；system prompt 会按当前 cwd 重新发现 AGENTS.md。\u003c/p\u003e\n\u003cp\u003eFixture 是归一化事件，不是原始 SSE：\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-json\"\u003e{\n  \"schema_version\": 1,\n  \"turns\": [\n    [\n      {\"type\": \"tool_call_delta\", \"index\": 0, \"id\": \"call_1\",\n       \"name\": \"read\", \"arguments\": \"{\\\"path\\\":\\\"a.txt\\\"}\"},\n      {\"type\": \"done\", \"finish_reason\": \"tool_calls\"}\n    ],\n    [\n      {\"type\": \"text_delta\", \"text\": \"read it\"},\n      {\"type\": \"done\", \"finish_reason\": \"stop\"}\n    ]\n  ]\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e离线回归：\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-sh\"\u003ecargo test -p niucode-agent --test golden\ncargo test -p niucode-provider fixture::tests\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2\u003eReplay 与 fork\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"language-sh\"\u003e# 不调用模型，按事件重建每个 user turn 的投影\nniucode replay /path/to/session.jsonl\n\n# 复制到指定事件为止的前缀，生成新 session\nniucode fork /path/to/session.jsonl --at e000012\n\n# 指定新 session 目录（默认与源文件同目录）\nniucode fork /path/to/session.jsonl --at e000012 --session-dir /tmp/forks\n\u003c/code\u003e\u003c/pre\u003e\n\u003cul\u003e\n\u003cli\u003e事件 ID 是解码事件的 1-based 序号，显示为 \u003ccode\u003ee000012\u003c/code\u003e，不是物理行号；坏行不制造 ID。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ereplay\u003c/code\u003e 不构造 provider。每个 \u003ccode\u003euser_message\u003c/code\u003e 投影到下一个 assistant 消息之前，包含请求前追加的 compaction / instructions，输出消息数、估算 token 和 digest。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003efork\u003c/code\u003e 只读源文件，复制 \u003ccode\u003eevents[0..=index]\u003c/code\u003e，再追加 \u003ccode\u003efork\u003c/code\u003e 溯源事件；源文件不变。\u003c/li\u003e\n\u003cli\u003efork 不向前缀插入事件，所以 \u003ccode\u003ecompaction.upto\u003c/code\u003e 仍然有效。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eload\u003c/code\u003e 的坏行 warning 会打印；fork 只复制有效前缀。非法、越界或指向不存在事件的 ID 会直接失败。\u003c/li\u003e\n\u003cli\u003e目标文件用 \u003ccode\u003ecreate_new\u003c/code\u003e 创建，不覆盖已有 session。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e决策见 ADR-0010。\u003c/p\u003e\n\u003ch2\u003e上下文与压缩\u003c/h2\u003e\n\u003cp\u003e每个 provider 请求前按估算 token 检查预算：默认 64k，到达 75% 触发 compaction。默认保留最近 3 个 user turn 原文；更早的事件生成确定性 handoff，包含目标、上一次请求、已完成工具动作、成功写入的文件、最近助手状态、近期失败、约束和下一步。\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-sh\"\u003eniucode exec \"long task\" --context-budget 128000 --keep-recent-turns 4\nniucode tui  --context-budget 128000 --keep-recent-turns 4\n\u003c/code\u003e\u003c/pre\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ecompaction.upto\u003c/code\u003e 是绝对事件下标；最后一个 compaction 生效，原始事件永远保留。\u003c/li\u003e\n\u003cli\u003e压缩成功才追加 \u003ccode\u003ecompaction\u003c/code\u003e 事件，并记录 \u003ccode\u003ebefore_tokens\u003c/code\u003e / \u003ccode\u003eafter_tokens\u003c/code\u003e 估算。\u003c/li\u003e\n\u003cli\u003e压缩不收缩、没有安全 cutoff 或写入失败时，保留原上下文并输出 warning。\u003c/li\u003e\n\u003cli\u003e估算是启发式（ASCII 约 4 字符/token，非 ASCII 1 字符/token）；真实成本仍看 \u003ccode\u003eturn_end.usage\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003eTUI / exec 在压缩后显示 \u003ccode\u003ecompacted: N events · ~before → ~after tokens\u003c/code\u003e；session 可以 resume 回放同一投影。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eniucode session show \u0026lt;path\u0026gt;\u003c/code\u003e 会打印 compaction 的 \u003ccode\u003eupto\u003c/code\u003e 和 before/after 估算。\u003c/li\u003e\n\u003cli\u003e单个 turn 很长且没有多余 user turn 时，cutoff 回退到该 turn 内安全的 assistant 边界，避免切开 tool call 和 tool result。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e实现决策见 ADR-0008。\u003c/p\u003e\n\u003ch2\u003eSubagent\u003c/h2\u003e\n\u003cp\u003e主模型可以调用 \u003ccode\u003esubagent\u003c/code\u003e 并行跑探索或 Worker 任务；任务不共享上下文，也不能递归：\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-json\"\u003e{\n  \"tasks\": [\n    {\"prompt\": \"find the failing test and report file:line\", \"profile\": \"explore\"},\n    {\"prompt\": \"implement the smallest fix in src/auth\", \"profile\": \"worker\", \"write_scope\": [\"src/auth\"]}\n  ]\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eprofile: explore\u003c/code\u003e（默认）：\u003ccode\u003eread/grep/glob\u003c/code\u003e + 只读 external tools；sandbox read-only + network off。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eprofile: worker\u003c/code\u003e：\u003ccode\u003eread/write/edit/grep/glob/bash\u003c/code\u003e + 只读 external tools；继承父 sandbox，写操作共享全局 write lock。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ewrite_scope\u003c/code\u003e 只约束 write/edit 路径；bash 不受路径 scope 约束，但会被同一个写锁串行化。\u003c/li\u003e\n\u003cli\u003e父 session 记录 \u003ccode\u003esubagent_spawn\u003c/code\u003e（含 profile）/ \u003ccode\u003esubagent_result\u003c/code\u003e；每个任务一个独立 session，默认在 \u003ccode\u003e\u0026lt;parent-stem\u0026gt;.subagents/\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e默认 \u003ccode\u003emax_steps=6\u003c/code\u003e（上限 12）、\u003ccode\u003etimeout_secs=120\u003c/code\u003e（上限 600）；context budget 为 \u003ccode\u003emin(parent, 16k)\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e父模型只收到一条 tool_result：每个任务的摘要 + 子日志路径；完整 transcript 不进入父上下文。\u003c/li\u003e\n\u003cli\u003e超时/provider 错误/max steps 都返回 \u003ccode\u003eok=false\u003c/code\u003e，父 agent 继续。\u003c/li\u003e\n\u003cli\u003emutating external tools 不进入 explore/worker；\u003ccode\u003efull-access\u003c/code\u003e 也不默认下放。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eprofile: inherit\u003c/code\u003e 需要显式 \u003ccode\u003e--allow-subagent-inheritance\u003c/code\u003e；它复制父工具面，但一定剥离 \u003ccode\u003esubagent\u003c/code\u003e，不能递归。决策见 ADR-0011/0014。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eExternal tools\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003eniucode exec\u003c/code\u003e / \u003ccode\u003eniucode tui\u003c/code\u003e 会扫描 \u003ccode\u003e\u0026lt;workspace\u0026gt;/.niucode/extensions/*.toml\u003c/code\u003e，为每个 manifest 启动一个本地 sidecar，把它在 \u003ccode\u003einitialize\u003c/code\u003e 中声明的工具并入 agent 的 tool specs。\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-toml\"\u003ename = \"demo\"\ncommand = \"python3\"\nargs = [\"sidecar.py\"]\ntimeout_secs = 30\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003esidecar 是 line-delimited JSON-RPC：\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-json\"\u003e{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"protocol\":1,\"client\":\"niucode\",\"cwd\":\"/repo\"}}\n{\"jsonrpc\":\"2.0\",\"id\":1,\"result\":{\"name\":\"demo\",\"version\":\"0.1.0\",\"tools\":[{\"name\":\"demo_echo\",\"description\":\"Echo text\",\"input_schema\":{\"type\":\"object\",\"properties\":{\"text\":{\"type\":\"string\"}}}}]}}\n{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"tools/call\",\"params\":{\"name\":\"demo_echo\",\"arguments\":{\"text\":\"hi\"}}}\n{\"jsonrpc\":\"2.0\",\"id\":2,\"result\":{\"ok\":true,\"output\":\"echo: hi\"}}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cul\u003e\n\u003cli\u003e工具名不能与内置工具或其他插件重名；重名会拒绝挂载。\u003c/li\u003e\n\u003cli\u003esidecar 启动时 \u003ccode\u003eenv_clear\u003c/code\u003e，只保留解释器启动所需的 PATH/HOME 等；不会继承 API key。\u003c/li\u003e\n\u003cli\u003ev1 是\u003cstrong\u003e可信本地 sidecar\u003c/strong\u003e：每插件串行调用，没有 worker pool、bwrap 网络/能力隔离、subagent 共享 host；这些在 M4-007。\u003c/li\u003e\n\u003cli\u003e父 session 记录 \u003ccode\u003eextension_mount\u003c/code\u003e / \u003ccode\u003eextension_unmount\u003c/code\u003e / \u003ccode\u003eextension_error\u003c/code\u003e；工具调用本身仍走 \u003ccode\u003etool_result\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e没有 manifest 时不产生任何进程。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eJSONL 协议\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003eniucode exec --json\u003c/code\u003e 把事件流写到 stdout，一行一个 JSON 对象；stderr 继续放人类诊断。第一行是带版本号的 \u003ccode\u003estart\u003c/code\u003e：\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-json\"\u003e{\"type\":\"start\",\"protocol\":1,\"session\":\"/path/session.jsonl\",\"model\":\"deepseek-flash\",\"provider\":\"openai\",\"cwd\":\"/repo\",\"sandbox\":\"workspace-write\",\"network\":\"off\",\"approval\":\"on-failure\",\"backend\":\"bwrap\"}\n{\"type\":\"text_delta\",\"text\":\"I will inspect the test.\"}\n{\"type\":\"tool_call\",\"name\":\"read\",\"input\":{\"path\":\"a.txt\"}}\n{\"type\":\"tool_result\",\"name\":\"read\",\"ok\":true,\"summary\":\"     1  hello\"}\n{\"type\":\"turn_end\",\"usage\":{\"input_tokens\":120,\"output_tokens\":16,\"cached_tokens\":80,\"reasoning_tokens\":0,\"cache_hit_percent\":66}}\n{\"type\":\"done\",\"turns\":2,\"usage\":{\"input_tokens\":240,\"output_tokens\":32,\"cached_tokens\":180,\"reasoning_tokens\":0,\"cache_hit_percent\":75},\"session\":\"/path/session.jsonl\"}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e事件类型：\u003ccode\u003estart\u003c/code\u003e、\u003ccode\u003etext_delta\u003c/code\u003e、\u003ccode\u003ereasoning_delta\u003c/code\u003e、\u003ccode\u003etool_call\u003c/code\u003e、\u003ccode\u003etool_result\u003c/code\u003e、\u003ccode\u003eturn_end\u003c/code\u003e、\u003ccode\u003ecompaction\u003c/code\u003e、\u003ccode\u003ewarning\u003c/code\u003e、\u003ccode\u003edone\u003c/code\u003e、\u003ccode\u003ecancelled\u003c/code\u003e、\u003ccode\u003eerror\u003c/code\u003e。\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003etool_result\u003c/code\u003e 只包含 \u003ccode\u003ename\u003c/code\u003e / \u003ccode\u003eok\u003c/code\u003e / \u003ccode\u003esummary\u003c/code\u003e；完整 output、reasoning 和事件历史在 \u003ccode\u003esession\u003c/code\u003e 指向的 JSONL 里。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e--json\u003c/code\u003e 不交互：\u003ccode\u003e--approval ask\u003c/code\u003e 会被拒绝；没有 bwrap 导致 \u003ccode\u003eon-failure\u003c/code\u003e 降级为 ask 时也会拒绝。TUI 仍是唯一交互审批入口。\u003c/li\u003e\n\u003cli\u003e成功/取消退出码为 0；provider/模型错误退出码非零，stdout 仍以 \u003ccode\u003eerror\u003c/code\u003e 事件结束。\u003c/li\u003e\n\u003cli\u003e协议只做加法兼容；已有字段含义不变。决策见 ADR-0012。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eAGENTS.md 与缓存指标\u003c/h2\u003e\n\u003cp\u003e每次 run 从 cwd 向上发现 \u003ccode\u003eAGENTS.md\u003c/code\u003e，按距离由近到远合并，近者优先，追加在稳定的 base system prompt 之后。修改文件后下一次用户 turn 生效，无需重启。\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e单文件上限 32 KiB，总上限 64 KiB；超出会截断并 warning。\u003c/li\u003e\n\u003cli\u003e加载来源与合并文本 digest 写入 \u003ccode\u003einstructions\u003c/code\u003e 事件；\u003ccode\u003esession show\u003c/code\u003e 会显示文件数和 digest。\u003c/li\u003e\n\u003cli\u003e缓存命中率由 \u003ccode\u003eturn_end.usage\u003c/code\u003e 的 cached / input 派生。TUI 与 exec 在每个 turn 和 \u003ccode\u003edone\u003c/code\u003e 行显示 \u003ccode\u003ecache N%\u003c/code\u003e；\u003ccode\u003esession show\u003c/code\u003e 显示每 turn 的 \u003ccode\u003ein/out/cached/cache\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e不写单独的 metrics JSONL；运行时 Runs / metrics 视图属于未来的 runtime viewer，不进入离线项目看板。决策见 ADR-0009。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e安全边界\u003c/h2\u003e\n\u003cp\u003e默认是 \u003ccode\u003eworkspace-write + network=off + approval=on-failure\u003c/code\u003e：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003esandbox\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eread-only\u003c/code\u003e：文件工具拒绝 write/edit；bash 用只读根。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eworkspace-write\u003c/code\u003e：只能写 cwd；\u003ccode\u003e/\u003c/code\u003e 以只读方式 bind。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003efull-access\u003c/code\u003e：不套 bwrap，必须显式选择。\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003enetwork\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eoff\u003c/code\u003e：bwrap \u003ccode\u003e--unshare-all\u003c/code\u003e，子进程无法建立连接。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eon\u003c/code\u003e：\u003ccode\u003e--share-net\u003c/code\u003e；只在需要时开启。\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eapproval\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eask\u003c/code\u003e：每个 write/edit/bash 前在终端询问；write/edit 展示真实文件的完整 unified diff。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eon-failure\u003c/code\u003e：沙箱可用时不问；bwrap 不可用时降级为逐工具询问。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003enever\u003c/code\u003e：不问；没有 bwrap 且需要隔离时启动直接失败。\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e审批渲染分两层：\u003ccode\u003eniucode-tools\u003c/code\u003e 生成结构化 \u003ccode\u003eChangePreview\u003c/code\u003e，headless 输出纯文本 unified diff，TUI 输出可滚动、可按文件跳转的 pager。预览本身不写事件；审批通过后实际执行的 \u003ccode\u003etool_result\u003c/code\u003e 才落盘，执行前会重新读取并校验文件。\u003c/p\u003e\n\u003cp\u003eLinux 第一后端是 bwrap，需要安装 \u003ccode\u003ebubblewrap\u003c/code\u003e。它仍是 namespace 隔离，不是 VM；工作区外文件默认可读。\u003ccode\u003eworkspace-write\u003c/code\u003e 目前只允许写 cwd，cargo registry / \u003ccode\u003e~/.cargo\u003c/code\u003e 等缓存目录会写入失败。\u003c/p\u003e\n\u003cp\u003e每次运行的策略写 \u003ccode\u003epolicy\u003c/code\u003e 事件，人工审批写 \u003ccode\u003eapproval\u003c/code\u003e 事件；拒绝的 tool_result 也落盘。\u003c/p\u003e\n\u003ch2\u003e当前能力\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e真实 DeepSeek \u003ccode\u003edeepseek-flash\u003c/code\u003e 文本 + read 工具调用已验证。\u003c/li\u003e\n\u003cli\u003ebwrap workspace-write 阻断工作区外写入；network off 阻断连接；read-only 阻断文件工具变更。\u003c/li\u003e\n\u003cli\u003e逐工具 approval 的允许/拒绝路径都有测试。\u003c/li\u003e\n\u003cli\u003e本地 mock SSE server 可以完整跑 text 与 tool 两条路径，不消耗 token。\u003c/li\u003e\n\u003cli\u003e脚本化 provider 的 agent 测试覆盖：无工具完成、工具后继续、max steps。\u003c/li\u003e\n\u003cli\u003e每次 turn 写 \u003ccode\u003eassistant_message\u003c/code\u003e、\u003ccode\u003eturn_end\u003c/code\u003e、\u003ccode\u003etool_result\u003c/code\u003e，usage 含 cached tokens。\u003c/li\u003e\n\u003cli\u003escripted provider 测试覆盖 read → edit → bash 修掉一个失败 fixture。\u003c/li\u003e\n\u003cli\u003eCtrl-C 会 drop provider stream 和工具 future；bash 的进程组会被清理。\u003c/li\u003e\n\u003cli\u003e审批前可查看完整 diff；大 diff 在 TUI 中分页，超出阈值的工具输出折叠为摘要。\u003c/li\u003e\n\u003cli\u003e上下文到 75% 预算触发 compaction；确定性 handoff 落成事件，resume 回放一致，失败保留原上下文。\u003c/li\u003e\n\u003cli\u003e分层 \u003ccode\u003eAGENTS.md\u003c/code\u003e 按 cwd 向上发现，近者优先；\u003ccode\u003einstructions\u003c/code\u003e 事件记录来源与 digest。\u003c/li\u003e\n\u003cli\u003e每个 turn 的缓存命中率可见，\u003ccode\u003esession show\u003c/code\u003e 可查历史 usage。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ereplay\u003c/code\u003e 可离线重建每个 user turn 的投影；\u003ccode\u003efork\u003c/code\u003e 可复制前缀并保留 compaction 下标。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eexec --json\u003c/code\u003e 提供带 \u003ccode\u003eprotocol: 1\u003c/code\u003e 的稳定 JSONL 事件流，适合脚本和编辑器集成。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003esubagent\u003c/code\u003e 并行只读探索，父 session 记录 spawn/result，父上下文只增加一条摘要。\u003c/li\u003e\n\u003cli\u003eexternal tools 通过 \u003ccode\u003e.niucode/extensions/*.toml\u003c/code\u003e 挂载，走同一 tool_result 事件。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e明确还没有\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003elandlock/seccomp 与 macOS seatbelt（ADR-0006 的后续后端）。\u003c/li\u003e\n\u003cli\u003e可配置 writable roots（cargo 缓存、\u003ccode\u003e/tmp\u003c/code\u003e）。\u003c/li\u003e\n\u003cli\u003e与模型匹配的精确 tokenizer；当前预算使用字符估算。\u003c/li\u003e\n\u003cli\u003e模型生成的语义摘要；当前 handoff 是确定性模板。\u003c/li\u003e\n\u003cli\u003e运行时 Runs / metrics viewer；当前缓存指标在 session 事件与 CLI / TUI 中。\u003c/li\u003e\n\u003cli\u003e并行工具；当前顺序执行。\u003c/li\u003e\n\u003cli\u003eSessionRuntime 的 Command/Event 通道；当前是函数边界。\u003c/li\u003e\n\u003cli\u003e运行时 subagent 的可视化面板；当前只看 tool 状态与摘要。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e调试\u003c/h2\u003e\n\u003cp\u003e不烧 token 的路径：\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-sh\"\u003ecargo test -p niucode-agent -p niucode-tools -p niucode-provider\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e本地 mock server：把 \u003ccode\u003eDEEPSEEK_BASE_URL\u003c/code\u003e 指向本地 SSE 服务，用假的 key 执行 \u003ccode\u003eniucode exec\u003c/code\u003e。provider 文档里有 SSE 格式和错误分类。\u003c/p\u003e\n","path":"docs/exec.md","excerpt":"headless 任务入口、六个基础工具 + subagent + sidecar external tools、JSONL 协议、session 事件、上下文压缩、分层 AGENTS.md 与缓存指标。"},{"id":"tui","title":"Inline TUI、Diff Pager 与审批","kind":"doc","status":"living","order":33,"summary":"niucode tui：ratatui inline 输入层、原生 transcript scrollback、审批 diff pager、工具状态与缓存命中率。","body_html":"\u003ch2\u003e用法\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"language-sh\"\u003eniucode                       # 直接进入 TUI\nniucode tui\nniucode tui --cwd /path/to/repo\nniucode tui --sandbox read-only --network off\nniucode tui --approval ask\nniucode tui --resume /path/to/session.jsonl\nniucode tui --replay /path/to/fixture.json\nniucode tui --context-budget 128000 --keep-recent-turns 4\nniucode tui --max-steps 40\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e默认策略与 \u003ccode\u003eniucode exec\u003c/code\u003e 相同：\u003ccode\u003eworkspace-write + network off + on-failure\u003c/code\u003e。\u003c/p\u003e\n\u003ch2\u003e交互\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003e███╗   ██╗██╗██╗   ██╗ ██████╗ ██████╗ ██████╗ ███████╗\n...\nminimal · observable · event-sourced · v0.1.0\ninline input · native scrollback · :help commands · Ctrl-C cancels the turn\n\nniucode ▸ find the failing test\n» bash {\"command\":\"cargo test\"}\n✓ bash exit: 1\n│ 12 lines · 1.8 KB · :last to expand\n╰─ turn 1 · in 1842 · out 96 · cache 42%\n◆ I found the failing case…\n╰─ turn 2 · in 2104 · out 120 · cache 61%\n✓ done · 2 turns · in 3946 · out 216 · cache 52%\n\nniucode ▸ :last\n╭─ last tool · bash · exit: 1\n│ ...\n╰─ end\n\nniucode ▸ exit\n\u003c/code\u003e\u003c/pre\u003e\n\u003cul\u003e\n\u003cli\u003e输入一行任务，Enter 提交；\u003ccode\u003eexit\u003c/code\u003e / \u003ccode\u003equit\u003c/code\u003e / \u003ccode\u003e/exit\u003c/code\u003e / \u003ccode\u003e:q\u003c/code\u003e 退出。\u003c/li\u003e\n\u003cli\u003e执行 turn 时 \u003ccode\u003eCtrl-C\u003c/code\u003e 取消当前 turn；2 秒内再次 \u003ccode\u003eCtrl-C\u003c/code\u003e 强制退出。输入行时 \u003ccode\u003eCtrl-C\u003c/code\u003e 清空当前行，\u003ccode\u003eCtrl-D\u003c/code\u003e 退出。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eTab\u003c/code\u003e 补全 slash 命令；多个匹配时显示带说明的候选列表。唯一前缀会显示灰色内联提示。\u003c/li\u003e\n\u003cli\u003e菜单关闭时，\u003ccode\u003e↑\u003c/code\u003e / \u003ccode\u003e↓\u003c/code\u003e 浏览当前进程内的输入历史；\u003ccode\u003eCtrl-R\u003c/code\u003e 用当前输入做反向历史搜索，重复按继续向前找。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eCtrl-N\u003c/code\u003e / \u003ccode\u003eCtrl-P\u003c/code\u003e 等同 \u003ccode\u003e↓\u003c/code\u003e / \u003ccode\u003e↑\u003c/code\u003e；\u003ccode\u003eCtrl-Left/Right\u003c/code\u003e 或 \u003ccode\u003eAlt-B/F\u003c/code\u003e 按词移动；\u003ccode\u003eCtrl-L\u003c/code\u003e 清屏；支持 bracketed paste。\u003c/li\u003e\n\u003cli\u003e非 Ghostty 终端默认 ratatui inline 输入层：无 picker 时 2 行输入 + footer（3 行），picker 打开时 3 候选 + 2 行输入 + footer（6 行）。Ghostty 当前默认回退 linear，\u003ccode\u003eNIUCODE_TUI_INLINE=1\u003c/code\u003e 可强制 inline；\u003ccode\u003eNIUCODE_TUI_LINEAR=1\u003c/code\u003e 只在终端不支持 cursor position 时作为 fallback。\u003c/li\u003e\n\u003cli\u003e鼠标捕获只在 picker 打开时启用，hover/click 用绝对屏幕坐标命中；菜单关闭后终端恢复原生复制/拖拽。退出、panic 或 Ctrl-C 都会经 \u003ccode\u003eTerminalGuard\u003c/code\u003e 释放 raw mode / bracketed paste / mouse capture。\u003c/li\u003e\n\u003cli\u003e启动时主动关闭残留的 mouse reporting / bracketed paste / alternate screen，修复上一次异常退出后“终端卡住、无法复制”的状态。\u003c/li\u003e\n\u003cli\u003e非 TTY（管道/脚本）自动退化为逐行输入，不启用行编辑。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e◆\u003c/code\u003e 标记 assistant 文本，\u003ccode\u003e◇\u003c/code\u003e 标记折叠后的 reasoning，\u003ccode\u003e»\u003c/code\u003e 标记工具调用。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003esubagent\u003c/code\u003e 调用会显示任务输入，完成后显示每个子任务的摘要和独立日志路径；父上下文只收到这一条 tool_result。\u003c/li\u003e\n\u003cli\u003e工具结果显示 \u003ccode\u003e✓\u003c/code\u003e / \u003ccode\u003e✗\u003c/code\u003e，短输出用 \u003ccode\u003e│\u003c/code\u003e 缩进；超过 12 行或 2 KB 时折叠为摘要和 \u003ccode\u003e:last to expand\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e╰─ turn N\u003c/code\u003e 在该 turn 的工具结果结束后打印，包含 input / output / cache 百分比。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e--max-steps\u003c/code\u003e 控制每个用户请求的最大模型 turn 数；默认 \u003ccode\u003e0\u003c/code\u003e 表示不设用户级上限（内部 256 安全 cap）。显式设置时达到上限会打印 \u003ccode\u003emax steps reached\u003c/code\u003e，已写入的项目文件保留。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e⇣ compacted · N events · ~before → ~after tokens\u003c/code\u003e 表示上下文压缩；失败显示 \u003ccode\u003e! warning: compaction skipped: ...\u003c/code\u003e 并保留原上下文。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e:last\u003c/code\u003e 重新打印最近一次工具输出；\u003ccode\u003e:help\u003c/code\u003e 显示可用命令。展开只保留在当前进程内，完整输出始终在 session JSONL 里。\u003c/li\u003e\n\u003cli\u003e文本增量直接写到 stdout，首 token 到达即渲染。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e行编辑与补全\u003c/h2\u003e\n\u003cp\u003eTTY 下使用 readline 风格的行编辑器：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e输入 \u003ccode\u003e/\u003c/code\u003e 后自动显示 slash 命令和说明；输入 \u003ccode\u003e/i\u003c/code\u003e 直接出现 \u003ccode\u003e/init\u003c/code\u003e 候选，不需要先按 Tab。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eTab\u003c/code\u003e / \u003ccode\u003eEnter\u003c/code\u003e 接受当前候选；\u003ccode\u003e↑\u003c/code\u003e / \u003ccode\u003e↓\u003c/code\u003e 选择；\
