<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="ni project dashboard: board, architecture, documents, timeline.">
<title>ni · project dashboard</title>
<style>
:root {
  --bg: #f4f2ee;
  --surface: #fbfaf7;
  --surface-2: #eeece6;
  --ink: #1d1c19;
  --muted: #6c675e;
  --faint: #969084;
  --line: #ded9cf;
  --line-strong: #c8c1b4;
  --accent: #2f5d50;
  --accent-soft: rgba(47, 93, 80, 0.12);
  --shadow: 0 1px 2px rgba(29, 28, 25, 0.05), 0 8px 24px rgba(29, 28, 25, 0.04);
  --code-bg: #1e1d1a;
  --code-ink: #e7e1d5;
  --code-line: #302d28;
  --code-muted: #6f6a5f;
  --st-backlog: #8c8478;
  --st-ready: #3f6f9f;
  --st-doing: #b7791f;
  --st-review: #6f5aa8;
  --st-done: #3f7d4f;
  --st-blocked: #b42318;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}

[data-theme="dark"] {
  --bg: #141412;
  --surface: #1b1a17;
  --surface-2: #23211d;
  --ink: #eae6de;
  --muted: #a8a094;
  --faint: #8a8275;
  --line: #2d2a25;
  --line-strong: #4a453c;
  --accent: #8fbfae;
  --accent-soft: rgba(143, 191, 174, 0.12);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.18);
  --code-bg: #0e0e0d;
  --code-ink: #ddd7ca;
  --code-line: #2b2924;
  --code-muted: #5f5a50;
  --st-backlog: #9a9285;
  --st-ready: #76a6d8;
  --st-doing: #d3a04a;
  --st-review: #a78fe0;
  --st-done: #78b98a;
  --st-blocked: #e06c61;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  height: 100%;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 13px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
}

button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
}

a {
  color: inherit;
  text-decoration: none;
}

input {
  font: inherit;
}

::selection {
  background: var(--accent-soft);
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

* {
  scrollbar-width: thin;
  scrollbar-color: var(--line-strong) transparent;
}

*::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

*::-webkit-scrollbar-thumb {
  background: var(--line);
  border: 2px solid transparent;
  border-radius: 99px;
  background-clip: padding-box;
}

/* ---------- top bar ---------- */

.topbar {
  height: 58px;
  display: flex;
  align-items: center;
  gap: 22px;
  padding: 0 18px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
  position: relative;
  z-index: 30;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.brand-mark {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  background: var(--ink);
  color: var(--bg);
  display: grid;
  place-items: center;
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: -0.06em;
  flex: none;
}

.brand-tag {
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.tabs {
  display: flex;
  gap: 2px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 3px;
  flex: none;
}

.tab {
  padding: 5px 11px;
  border-radius: 6px;
  font-size: 11.5px;
  color: var(--muted);
  white-space: nowrap;
  transition: color 0.12s ease, background 0.12s ease;
}

.tab:hover {
  color: var(--ink);
}

.tab.active {
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
}

.top-actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 9px;
}

.search {
  display: flex;
  align-items: center;
  gap: 7px;
  width: 205px;
  height: 30px;
  padding: 0 9px;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 7px;
  transition: border-color 0.12s ease, box-shadow 0.12s ease;
}

.search:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.search-key {
  width: 16px;
  height: 16px;
  border: 1px solid var(--line);
  border-radius: 4px;
  display: grid;
  place-items: center;
  font-family: var(--mono);
  font-size: 9px;
  color: var(--faint);
  background: var(--surface-2);
  flex: none;
}

.search input {
  width: 100%;
  border: 0;
  outline: 0;
  background: none;
  color: var(--ink);
  font-size: 11.5px;
}

.search input::placeholder {
  color: var(--faint);
}

.search input::-webkit-search-cancel-button {
  display: none;
}

.status-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 30px;
  padding: 0 10px;
  border: 1px solid var(--line);
  border-radius: 7px;
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
  white-space: nowrap;
}

.status-chip::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
}

.icon-button {
  width: 30px;
  height: 30px;
  border: 1px solid var(--line);
  border-radius: 7px;
  display: grid;
  place-items: center;
  color: var(--muted);
  background: var(--surface);
  transition: background 0.12s ease, color 0.12s ease;
}

.icon-button:hover {
  background: var(--surface-2);
  color: var(--ink);
}

/* ---------- shell ---------- */

.shell {
  height: calc(100vh - 58px);
  display: grid;
  grid-template-columns: 224px minmax(0, 1fr) 380px;
}

.rail {
  border-right: 1px solid var(--line);
  background: var(--surface);
  padding: 16px 12px 12px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 18px;
  min-width: 0;
}

.rail-section {
  min-width: 0;
}

.rail-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding: 0 6px 7px;
}

.rail-head h2 {
  margin: 0;
  font-size: 9.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--faint);
}

.rail-head span {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--faint);
}

.milestone-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.milestone {
  width: 100%;
  text-align: left;
  padding: 7px 6px 8px;
  border-radius: 6px;
  border: 1px solid transparent;
  transition: background 0.12s ease, border-color 0.12s ease;
}

.milestone:hover {
  background: var(--surface-2);
}

.milestone.active {
  background: var(--surface-2);
  border-color: var(--line);
}

.milestone-top {
  display: flex;
  align-items: center;
  gap: 7px;
}

.ms-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--st-backlog);
  flex: none;
}

.ms-dot.active {
  background: var(--st-doing);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--st-doing) 16%, transparent);
}

.ms-dot.done {
  background: var(--st-done);
}

.ms-id {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--muted);
}

.ms-title {
  margin-left: auto;
  font-size: 11.5px;
  font-weight: 500;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.ms-meta {
  display: flex;
  justify-content: space-between;
  margin: 5px 0 5px 14px;
  font-family: var(--mono);
  font-size: 9px;
  color: var(--faint);
}

.progress {
  display: block;
  height: 4px;
  border-radius: 99px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  overflow: hidden;
}

.progress > i {
  display: block;
  height: 100%;
  background: var(--accent);
  border-radius: 99px;
  transition: width 0.25s ease;
}

.milestone .progress {
  margin-left: 14px;
}

.progress.wide {
  height: 5px;
}

.layer-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.layer-row {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 3px 6px;
  font-size: 11px;
  color: var(--muted);
}

.layer-dot {
  width: 6px;
  height: 6px;
  border-radius: 2px;
  background: var(--c, var(--faint));
  flex: none;
}

.layer-name {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.layer-count {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--faint);
}

.rail-doc-list {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.rail-doc {
  display: flex;
  align-items: center;
  gap: 7px;
  width: 100%;
  min-width: 0;
  text-align: left;
  padding: 5px 6px;
  border-radius: 5px;
}

.rail-doc:hover,
.rail-doc.active {
  background: var(--surface-2);
}

.rd-kind {
  flex: none;
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--faint);
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 1px 3px;
}

.rd-title {
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.rail-doc.active .rd-title {
  color: var(--ink);
}

.rail-foot {
  margin-top: auto;
  padding: 12px 6px 0;
  border-top: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 3px;
  font-family: var(--mono);
  font-size: 9px;
  color: var(--faint);
}

/* ---------- canvas ---------- */

.canvas {
  overflow: auto;
  padding: 22px 24px 48px;
  background: var(--bg);
  min-width: 0;
}

.view-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 18px;
}

.kicker {
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--faint);
}

.view-title {
  margin: 4px 0 5px;
  font-size: 26px;
  font-weight: 650;
  line-height: 1.1;
  letter-spacing: -0.035em;
}

.view-sub {
  max-width: 680px;
  margin: 0;
  font-size: 12px;
  line-height: 1.55;
  color: var(--muted);
}

.stats {
  display: flex;
  align-items: center;
  gap: 14px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--muted);
  white-space: nowrap;
}

.stats strong {
  color: var(--ink);
  font-weight: 600;
}

.stats .sep {
  color: var(--faint);
}

/* ---------- board ---------- */

.board {
  display: grid;
  grid-template-columns: repeat(5, minmax(152px, 1fr));
  gap: 10px;
  min-width: 840px;
  align-items: start;
}

.column {
  background: color-mix(in srgb, var(--surface-2) 55%, transparent);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 7px;
  min-height: 120px;
}

.column-head {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 3px 4px 8px;
  font-size: 9.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
}

.col-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--c, var(--st-backlog));
}

.col-count {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 9px;
  color: var(--faint);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 99px;
  padding: 0 5px;
}

.col-count.warn {
  color: var(--st-doing);
  border-color: color-mix(in srgb, var(--st-doing) 40%, var(--line));
}

.cards {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-height: 40px;
}

.column.empty .cards::after {
  content: "No cards";
  display: block;
  padding: 10px 4px;
  font-family: var(--mono);
  font-size: 9px;
  color: var(--faint);
}

.card {
  width: 100%;
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 8px 9px 7px;
  transition: border-color 0.12s ease, transform 0.12s ease, box-shadow 0.12s ease;
}

.card:hover {
  border-color: var(--line-strong);
  transform: translateY(-1px);
  box-shadow: var(--shadow);
}

.card.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-soft);
}

.card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-family: var(--mono);
  font-size: 8.5px;
  letter-spacing: 0.02em;
  color: var(--faint);
}

.card-title {
  display: block;
  margin: 5px 0 7px;
  font-size: 12px;
  font-weight: 500;
  line-height: 1.38;
  color: var(--ink);
}

.card-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: 9.5px;
  color: var(--faint);
}

.card-foot span:first-child {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.card.done {
  opacity: 0.68;
}

.card.done .card-title {
  color: var(--muted);
}

.card.blocked {
  border-left: 2px solid var(--st-blocked);
}

.size {
  font-family: var(--mono);
  font-size: 8px;
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 0 3px;
  color: var(--faint);
}

.blocked-strip {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  border: 1px dashed color-mix(in srgb, var(--st-blocked) 45%, var(--line));
  background: color-mix(in srgb, var(--st-blocked) 5%, transparent);
  border-radius: 9px;
  padding: 9px 10px;
  margin-bottom: 14px;
}

.blocked-label {
  padding-top: 6px;
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--st-blocked);
  white-space: nowrap;
}

.blocked-cards {
  display: flex;
  flex: 1;
  flex-wrap: wrap;
  gap: 6px;
}

.blocked-cards .card {
  width: 210px;
  background: var(--surface);
}

/* ---------- architecture ---------- */

.arch-canvas {
  position: relative;
  min-width: 760px;
  padding: 8px 10px 18px 0;
  border-radius: 10px;
  background-image: radial-gradient(circle, color-mix(in srgb, var(--ink) 7%, transparent) 0.7px, transparent 0.8px);
  background-size: 18px 18px;
}

.edges {
  position: absolute;
  left: 0;
  top: 0;
  overflow: visible;
  pointer-events: none;
  z-index: 0;
}

.edge {
  fill: none;
  stroke: var(--line-strong);
  stroke-width: 1.15;
  opacity: 0.7;
}

.edge-active {
  stroke: var(--accent);
  stroke-width: 1.6;
  opacity: 1;
}

.edge-label {
  fill: var(--faint);
  font-family: var(--mono);
  font-size: 8.5px;
  paint-order: stroke;
  stroke: var(--bg);
  stroke-width: 3px;
  stroke-linejoin: round;
}

.arrow-head {
  fill: var(--line-strong);
}

.arrow-head-active {
  fill: var(--accent);
}

.edge-label-active {
  fill: var(--accent);
}

.arch-layer {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: 132px minmax(0, 1fr);
  gap: 22px;
  padding: 15px 0 18px;
  border-bottom: 1px dashed var(--line);
}

.arch-layer:first-child {
  padding-top: 4px;
}

.arch-layer:last-child {
  border-bottom: 0;
}

.layer-label {
  padding-top: 2px;
  text-align: right;
}

.layer-index {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--faint);
}

.layer-label h2 {
  margin: 1px 0 3px;
  font-size: 13px;
  letter-spacing: -0.01em;
}

.layer-label p {
  margin: 0;
  font-size: 10px;
  line-height: 1.45;
  color: var(--faint);
}

.layer-cards {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  gap: 10px;
}

.module-card {
  position: relative;
  width: 220px;
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--line);
  border-top: 2px solid var(--module-color, var(--faint));
  border-radius: 7px;
  padding: 9px 11px 10px;
  transition: border-color 0.12s ease, transform 0.12s ease, box-shadow 0.12s ease;
}

.module-card:hover {
  border-color: var(--line-strong);
  transform: translateY(-1px);
  box-shadow: var(--shadow);
}

.module-card.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-soft);
}

.module-card.planned {
  background: color-mix(in srgb, var(--surface) 62%, transparent);
  border-style: dashed;
  border-top-style: solid;
}

.module-card.planned .module-summary {
  color: var(--faint);
}

.module-card.dim {
  opacity: 0.22;
  pointer-events: none;
}

.module-card.muted {
  opacity: 0.24;
}

.module-card.related {
  border-color: color-mix(in srgb, var(--accent) 35%, var(--line));
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 10%, transparent);
}

.arch-canvas.has-focus .edge:not(.edge-active) {
  opacity: 0.12;
}

.module-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--faint);
}

.module-status {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.module-status::before {
  content: "";
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--module-color, var(--faint));
}

.module-title {
  display: block;
  margin: 5px 0 3px;
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.module-summary {
  display: block;
  margin: 0 0 7px;
  font-size: 10.5px;
  line-height: 1.45;
  color: var(--muted);
}

.module-path {
  display: block;
  font-family: var(--mono);
  font-size: 8.5px;
  color: var(--faint);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ---------- docs ---------- */

.doc-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 10px;
}

.doc-card {
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px 13px;
  transition: border-color 0.12s ease, transform 0.12s ease, box-shadow 0.12s ease;
}

.doc-card:hover {
  border-color: var(--line-strong);
  transform: translateY(-1px);
  box-shadow: var(--shadow);
}

.doc-card.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-soft);
}

.doc-top {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 8px;
}

.doc-kind {
  font-family: var(--mono);
  font-size: 8px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 1px 4px;
  color: var(--faint);
}

.doc-status {
  font-family: var(--mono);
  font-size: 8px;
  color: var(--st-done);
}

.doc-title {
  display: block;
  margin: 0 0 5px;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.doc-excerpt {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow: hidden;
  margin: 0 0 10px;
  font-size: 11px;
  line-height: 1.5;
  color: var(--muted);
}

.doc-path {
  display: block;
  font-family: var(--mono);
  font-size: 8.5px;
  color: var(--faint);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ---------- timeline ---------- */

.timeline {
  position: relative;
  max-width: 780px;
  padding-left: 16px;
}

.timeline::before {
  content: "";
  position: absolute;
  left: 4px;
  top: 6px;
  bottom: 0;
  width: 1px;
  background: var(--line);
}

.tl-item {
  position: relative;
  padding: 0 0 22px 14px;
}

.tl-item::before {
  content: "";
  position: absolute;
  left: -15px;
  top: 5px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--surface);
  border: 1.5px solid var(--line-strong);
}

.tl-date {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.03em;
  color: var(--faint);
}

.tl-kind {
  margin-left: 8px;
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--faint);
}

.tl-title {
  margin: 3px 0 4px;
  font-size: 13px;
  font-weight: 600;
}

.tl-detail {
  max-width: 640px;
  margin: 0 0 7px;
  font-size: 11.5px;
  line-height: 1.55;
  color: var(--muted);
}

.tl-refs {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.ref-chip {
  font-family: var(--mono);
  font-size: 8.5px;
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 1px 4px;
  color: var(--faint);
}

button.ref-chip:hover {
  color: var(--ink);
  border-color: var(--line-strong);
}

/* ---------- details ---------- */

.details {
  border-left: 1px solid var(--line);
  background: var(--surface);
  padding: 18px 20px 48px;
  overflow-y: auto;
  min-width: 0;
}

.details-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.close {
  width: 26px;
  height: 26px;
  border: 1px solid var(--line);
  border-radius: 6px;
  display: grid;
  place-items: center;
  color: var(--muted);
  font-size: 15px;
  line-height: 1;
}

.close:hover {
  background: var(--surface-2);
  color: var(--ink);
}

.details-title {
  margin: 2px 0 8px;
  font-size: 21px;
  font-weight: 650;
  line-height: 1.2;
  letter-spacing: -0.03em;
}

.badges {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 6px;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--mono);
  font-size: 8.5px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  border: 1px solid var(--line);
  border-radius: 99px;
  padding: 2px 7px;
  color: var(--muted);
}

.badge .dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: currentColor;
}

.badge-backlog { color: var(--st-backlog); }
.badge-ready { color: var(--st-ready); }
.badge-doing { color: var(--st-doing); }
.badge-review { color: var(--st-review); }
.badge-done { color: var(--st-done); }
.badge-blocked { color: var(--st-blocked); }
.badge-planned { color: var(--faint); }
.badge-active { color: var(--st-doing); }

.meta-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px 12px;
  margin: 10px 0 16px;
  padding: 11px 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.meta-k {
  margin-bottom: 1px;
  font-size: 8.5px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--faint);
}

.meta-v {
  font-size: 11px;
  line-height: 1.4;
  color: var(--ink);
}

.mono {
  font-family: var(--mono);
  font-size: 10px;
}

.detail-section {
  margin: 18px 0;
}

.detail-section h2 {
  margin: 0 0 7px;
  font-size: 9.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--faint);
}

.detail-section p {
  margin: 0 0 7px;
  font-size: 11.5px;
  line-height: 1.6;
  color: var(--muted);
}

.notes {
  display: flex;
  flex-direction: column;
  gap: 5px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.notes li {
  position: relative;
  padding-left: 10px;
  font-size: 10.5px;
  line-height: 1.5;
  color: var(--muted);
}

.notes li::before {
  content: "";
  position: absolute;
  left: 0;
  top: 6px;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: var(--line-strong);
}

.path-list {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.path-chip {
  width: 100%;
  padding: 3px 6px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--surface-2);
  font-family: var(--mono);
  font-size: 9px;
  color: var(--muted);
  text-align: left;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.inline-link {
  font-size: 11px;
  color: var(--accent);
  text-decoration: underline;
  text-decoration-color: color-mix(in srgb, var(--accent) 35%, transparent);
  text-underline-offset: 2px;
}

.relation-list {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.relation {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 2px 0;
  font-size: 10px;
  color: var(--muted);
}

.relation .arrow {
  font-family: var(--mono);
  color: var(--faint);
}

.relation button {
  font-size: 10px;
  color: var(--ink);
  text-decoration: underline;
  text-decoration-color: var(--line-strong);
  text-underline-offset: 2px;
}

.callout {
  margin: 10px 0;
  padding: 8px 10px;
  border: 1px solid color-mix(in srgb, var(--st-blocked) 35%, var(--line));
  border-radius: 6px;
  background: color-mix(in srgb, var(--st-blocked) 5%, transparent);
  font-size: 10.5px;
  line-height: 1.5;
  color: var(--st-blocked);
}

.source-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin: 8px 0 6px;
}

.source-tab {
  max-width: 100%;
  padding: 3px 6px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--surface-2);
  color: var(--muted);
  font-family: var(--mono);
  font-size: 8.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.source-tab.active {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--bg);
}

.source-box {
  max-height: 420px;
  padding: 8px 0;
  border: 1px solid var(--code-line);
  border-radius: 7px;
  background: var(--code-bg);
  overflow: auto;
}

.source-line {
  display: flex;
  font-family: var(--mono);
  font-size: 9.5px;
  line-height: 1.55;
  color: var(--code-ink);
  white-space: pre;
}

.source-line .ln {
  flex: 0 0 3.2em;
  padding-right: 9px;
  text-align: right;
  color: var(--code-muted);
  user-select: none;
}

.source-line .lc {
  padding-right: 12px;
}

.hint {
  margin: 5px 0 0;
  font-family: var(--mono);
  font-size: 9.5px;
  color: var(--faint);
}

.empty {
  padding: 16px;
  border: 1px dashed var(--line-strong);
  border-radius: 7px;
  color: var(--faint);
  font-size: 11px;
  line-height: 1.5;
}

.overview-block {
  margin: 10px 0;
  padding: 11px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--bg);
}

.overview-block h3 {
  margin: 0 0 4px;
  font-size: 11px;
}

.overview-block p {
  margin: 0 0 7px;
  font-size: 10.5px;
  line-height: 1.5;
  color: var(--muted);
}

.overview-stats {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
  margin: 14px 0;
}

.overview-stat strong {
  display: block;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.03em;
}

.overview-stat span {
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--faint);
}

/* ---------- markdown ---------- */

.md {
  font-size: 12.5px;
  line-height: 1.68;
  color: var(--ink);
  overflow-wrap: break-word;
}

.md > :first-child {
  margin-top: 0;
}

.md h1,
.md h2,
.md h3 {
  line-height: 1.3;
  letter-spacing: -0.015em;
}

.md h1 {
  margin: 20px 0 8px;
  font-size: 17px;
}

.md h2 {
  margin: 22px 0 7px;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--line);
  font-size: 14.5px;
}

.md h3 {
  margin: 16px 0 5px;
  font-size: 12.5px;
}

.md p {
  margin: 0 0 10px;
}

.md ul,
.md ol {
  margin: 0 0 11px;
  padding-left: 17px;
}

.md li {
  margin: 3px 0;
}

.md li::marker {
  color: var(--faint);
}

.md a {
  color: var(--accent);
  text-decoration: underline;
  text-decoration-color: color-mix(in srgb, var(--accent) 35%, transparent);
  text-underline-offset: 2px;
}

.md code {
  padding: 1px 4px;
  border: 1px solid var(--line);
  border-radius: 3px;
  background: var(--surface-2);
  font-family: var(--mono);
  font-size: 10.5px;
}

.md pre {
  margin: 11px 0;
  padding: 11px 13px;
  border: 1px solid var(--code-line);
  border-radius: 7px;
  background: var(--code-bg);
  color: var(--code-ink);
  overflow: auto;
}

.md pre code {
  padding: 0;
  border: 0;
  background: none;
  color: inherit;
  font-size: 10.5px;
  line-height: 1.55;
}

.md blockquote {
  margin: 11px 0;
  padding: 1px 11px;
  border-left: 2px solid var(--accent);
  color: var(--muted);
}

.md table {
  width: 100%;
  margin: 11px 0;
  border-collapse: collapse;
  font-size: 11px;
}

.md th,
.md td {
  padding: 5px 7px;
  border: 1px solid var(--line);
  text-align: left;
  vertical-align: top;
}

.md th {
  background: var(--surface-2);
  font-weight: 600;
}

.md hr {
  margin: 16px 0;
  border: 0;
  border-top: 1px solid var(--line);
}

.md input[type="checkbox"] {
  margin: 0 5px 0 0;
  accent-color: var(--accent);
}

/* ---------- architecture-first ---------- */

.map-nav {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.map-layer {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.map-layer-head {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 6px 4px;
  color: var(--faint);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.map-layer-dot {
  width: 5px;
  height: 5px;
  border-radius: 2px;
  background: var(--c, var(--faint));
  flex: none;
}

.map-layer-n {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 8.5px;
  letter-spacing: 0;
  color: var(--faint);
}

.map-module {
  display: flex;
  align-items: center;
  gap: 7px;
  width: 100%;
  padding: 4px 6px;
  border: 1px solid transparent;
  border-radius: 5px;
  text-align: left;
}

.map-module:hover {
  background: var(--surface-2);
}

.map-module.active {
  background: var(--surface-2);
  border-color: var(--line);
}

.map-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--faint);
  flex: none;
}

.map-dot.active,
.map-dot.done {
  background: var(--st-done);
}

.map-dot.planned {
  background: transparent;
  border: 1px solid var(--faint);
}

.map-title {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 11px;
  color: var(--muted);
}

.map-module.active .map-title {
  color: var(--ink);
}


.focus-block {
  padding: 0 6px 10px;
}

.focus-kicker {
  margin-bottom: 4px;
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--faint);
}

.focus-card {
  display: flex;
  flex-direction: column;
  gap: 2px;
  width: 100%;
  padding: 7px 8px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--surface-2);
  text-align: left;
}

.focus-card:hover {
  border-color: var(--line-strong);
}

.focus-id {
  font-family: var(--mono);
  font-size: 8.5px;
  color: var(--faint);
}

.focus-title {
  font-size: 10.5px;
  line-height: 1.35;
  color: var(--ink);
}

.focus-empty {
  font-size: 10px;
  line-height: 1.45;
  color: var(--muted);
}

.rail-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  font-family: var(--mono);
  font-size: 8.5px;
  color: var(--faint);
}

.filters {
  display: flex;
  gap: 3px;
  margin: -4px 0 14px;
}

.filter {
  padding: 4px 8px;
  border: 1px solid var(--line);
  border-radius: 99px;
  background: var(--surface);
  color: var(--muted);
  font-family: var(--mono);
  font-size: 9px;
}

.filter:hover {
  border-color: var(--line-strong);
  color: var(--ink);
}

.filter.active {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--bg);
}

.focus-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: -4px 0 14px;
}

.focus-label {
  color: var(--faint);
  font-family: var(--mono);
  font-size: 8.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.focus-chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 3px 8px;
  border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--line));
  border-radius: 99px;
  background: color-mix(in srgb, var(--accent) 6%, transparent);
  color: var(--accent);
  font-size: 10px;
}

.focus-chip:hover {
  background: color-mix(in srgb, var(--accent) 11%, transparent);
}

.section-title {
  margin: 26px 0 10px;
  color: var(--faint);
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.section-title:first-of-type {
  margin-top: 0;
}

/* ---------- responsive ---------- */

@media (min-width: 1400px) {
  body[data-view="docs"] .shell {
    grid-template-columns: 224px minmax(0, 1fr) 560px;
  }
}

@media (max-width: 1280px) {
  .shell {
    grid-template-columns: 210px minmax(0, 1fr) 344px;
  }

  .brand-tag {
    display: none;
  }

  .details {
    padding: 16px 16px 40px;
  }

  .module-card {
    width: 196px;
  }

  .arch-canvas {
    min-width: 0;
  }

  .board {
    min-width: 660px;
    grid-template-columns: repeat(5, minmax(120px, 1fr));
  }
}

@media (max-width: 1040px) {
  .shell {
    grid-template-columns: 200px minmax(0, 1fr);
  }

  .details {
    display: none;
  }

  .top-actions .status-chip {
    display: none;
  }
}

@media (max-width: 760px) {
  body {
    overflow: auto;
  }

  .shell {
    height: auto;
    min-height: calc(100vh - 58px);
    grid-template-columns: 1fr;
  }

  .rail {
    display: none;
  }

  .canvas {
    padding: 16px 14px 32px;
  }

  .brand-tag {
    display: none;
  }

  .tabs .tab {
    padding: 5px 7px;
    font-size: 10.5px;
  }

  .search {
    width: 140px;
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}

.md li:has(> input[type="checkbox"]) {
  list-style: none;
  margin-left: -17px;
}

.md li input[type="checkbox"] {
  width: 11px;
  height: 11px;
  margin-right: 6px;
  vertical-align: -1px;
}

.table-wrap {
  margin: 11px 0;
  overflow-x: auto;
}

.table-wrap table {
  min-width: 520px;
  margin: 0;
}

</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/arch" data-view="arch" aria-label="ni dashboard">
    <span class="brand-mark">ni</span>
    <span class="brand-tag">minimal, observable coding agent</span>
  </a>

  <nav class="tabs" aria-label="Views">
    <button class="tab" type="button" data-view="arch">Architecture</button>
    <button class="tab" type="button" data-view="work">Work</button>
    <button class="tab" type="button" data-view="docs">Docs</button>
    <button class="tab" type="button" data-view="decisions">Decisions</button>
  </nav>

  <div class="top-actions">
    <label class="search" aria-label="Filter current view">
      <span class="search-key">/</span>
      <input id="search" type="search" autocomplete="off" spellcheck="false" placeholder="Filter">
    </label>
    <span class="status-chip" id="project-status"></span>
    <button class="icon-button" id="theme-toggle" type="button" title="Toggle theme" aria-label="Toggle theme">◐</button>
  </div>
</header>

<main class="shell">
  <aside class="rail" aria-label="Project navigation">
    <section class="rail-section rail-map">
      <div class="rail-head"><h2>Architecture</h2><span id="module-count"></span></div>
      <div id="map-nav" class="map-nav"></div>
    </section>

    <section class="rail-section rail-docs">
      <div class="rail-head"><h2>Documents</h2><span id="doc-count"></span></div>
      <div id="rail-docs" class="rail-doc-list"></div>
    </section>

    <div class="rail-foot" id="rail-foot"></div>
  </aside>

  <section class="canvas" id="canvas" aria-label="Project view" tabindex="-1"></section>
  <aside class="details" id="details" aria-label="Details"></aside>
</main>

<noscript>

tionRequest, OpenAiConfig, OpenAiProvider, Preset, Provider, StreamEvent,\n    ThinkingMode,\n};\n\n#[derive(Debug, Parser)]\n#[command(name = \"ni\", version, about = \"Minimal, observable coding agent\")]\nstruct Cli {\n    #[command(subcommand)]\n    command: Option\u003cCommand\u003e,\n}\n\n#[derive(Debug, Subcommand)]\nenum Command {\n    /// Inspect and create append-only session logs\n    Session {\n        #[command(subcommand)]\n        command: SessionCommand,\n    },\n    /// Inspect and test model providers\n    Provider {\n        #[command(subcommand)]\n        command: ProviderCommand,\n    },\n    /// Store API keys in the OS keyring or a 0600 file\n    Auth {\n        #[command(subcommand)]\n        command: AuthCommand,\n    },\n    /// Run one coding task through the agent loop\n    Exec {\n        /// Task for the agent\n        prompt: String,\n        /// Provider preset: deepseek or openai\n        #[arg(long, default_value = \"deepseek\")]\n        preset: String,\n        /// Override the preset model\n        #[arg(long)]\n        model: Option\u003cString\u003e,\n        /// Maximum model turns\n        #[arg(long, default_value_t = 12)]\n        max_steps: usize,\n        /// Disable DeepSeek thinking mode\n        #[arg(long)]\n        no_thinking: bool,\n        /// Working directory (defaults to cwd)\n        #[arg(long)]\n        cwd: Option\u003cPathBuf\u003e,\n        /// Directory for the session JSONL (defaults to ~/.ni/sessions)\n        #[arg(long)]\n        session_dir: Option\u003cPathBuf\u003e,\n    },\n}\n\n#[derive(Debug, Subcommand)]\nenum SessionCommand {\n    /// Create a session and print its path\n    New {\n        /// Directory for the session file\n        #[arg(long)]\n        dir: Option\u003cPathBuf\u003e,\n    },\n    /// Print the events in a session file\n    Show {\n        /// Path to a .jsonl session file\n        path: PathBuf,\n    },\n    /// List session files\n    List {\n        /// Directory containing session files\n        #[arg(long)]\n        dir: Option\u003cPathBuf\u003e,\n    },\n}\n\n#[derive(Debug, Subcommand)]\nenum AuthCommand {\n    /// Store an API key (hidden prompt, or --stdin for scripts)\n    Set {\n        /// Provider: deepseek or openai\n        provider: String,\n        /// Read one line from stdin instead of prompting\n        #[arg(long)]\n        stdin: bool,\n    },\n    /// Show where each provider's credential comes from\n    Status,\n    /// Remove stored credentials for a provider\n    Unset {\n        /// Provider: deepseek or openai\n        provider: String,\n    },\n}\n\n#[derive(Debug, Subcommand)]\nenum ProviderCommand {\n    /// List built-in presets and whether their API key is present\n    List,\n    /// Stream one prompt through a provider\n    Test {\n        /// Preset: deepseek or openai\n        #[arg(long, default_value = \"deepseek\")]\n        preset: String,\n        /// Override the preset model\n        #[arg(long)]\n        model: Option\u003cString\u003e,\n        /// Prompt for the test request\n        #[arg(long)]\n        prompt: Option\u003cString\u003e,\n        /// Disable DeepSeek thinking mode\n        #[arg(long)]\n        no_thinking: bool,\n    },\n}\n\n#[tokio::main]\nasync fn main() -\u003e Result\u003c()\u003e {\n    let cli = Cli::parse();\n    match cli.command {\n        Some(Command::Session { command }) =\u003e run_session(command),\n        Some(Command::Provider { command }) =\u003e run_provider(command).await,\n        Some(Command::Auth { command }) =\u003e run_auth(command),\n        Some(Command::Exec {\n            prompt,\n            preset,\n            model,\n            max_steps,\n            no_thinking,\n            cwd,\n            session_dir,\n        }) =\u003e {\n            run_exec(\n                prompt,\n                preset,\n                model,\n                max_steps,\n                no_thinking,\n                cwd,\n                session_dir,\n            )\n            .await\n        }\n        None =\u003e {\n            print_banner();\n            Ok(())\n        }\n    }\n}\n\nfn run_session(command: SessionCommand) -\u003e Result\u003c()\u003e {\n    match command {\n        SessionCommand::New { dir } =\u003e {\n            let dir = dir.unwrap_or_else(default_sessions_dir);\n            let mut log = SessionLog::create(\u0026dir)?;\n            log.append(\u0026Event::SessionStart {\n                id: log.id().to_string(),\n                cwd: std::env::current_dir()?.display().to_string(),\n                model: \"unset\".into(),\n                ts: now_ms(),\n            })?;\n            println!(\"{}\", log.path().display());\n            Ok(())\n        }\n        SessionCommand::Show { path } =\u003e {\n            let loaded = ni_core::load(\u0026path)?;\n            println!(\"session  {}\", path.display());\n            println!(\"events   {}\", loaded.events.len());\n            println!(\"warnings {}\", loaded.warnings.len());\n            for warning in \u0026loaded.warnings {\n                eprintln!(\"warning: {warning}\");\n            }\n            for event in \u0026loaded.events {\n                println!(\"{:\u003e13}  {}\", event.ts(), event.kind());\n            }\n            Ok(())\n        }\n        SessionCommand::List { dir } =\u003e {\n            let dir = dir.unwrap_or_else(default_sessions_dir);\n            for path in ni_core::session::list(\u0026dir)? {\n                println!(\"{}\", path.display());\n            }\n            Ok(())\n        }\n    }\n}\n\n#[allow(clippy::too_many_arguments)]\nasync fn run_exec(\n    prompt: String,\n    preset: String,\n    model: Option\u003cString\u003e,\n","truncated":true}]},{"id":"tui","title":"TUI","layer":"interface","status":"planned","summary":"流式渲染、审批提示、diff 展示；只消费事件流。","contract":"不 import loop 内部；通过事件通道与 core 解耦。","paths":["crates/ni-tui/src/lib.rs"],"notes":["TUI 最后做；先把 headless 跑通。","diff 展示是审批体验的核心，不是装饰。"],"sources":[]},{"id":"loop","title":"Agent Loop","layer":"engine","status":"active","summary":"最小 turn loop：流式文本、tool call 聚合、工具派发、事件落盘。","contract":"run(provider, session, config, prompt, observer)；不解析 wire format，不实现工具。","paths":["crates/ni-agent/src/lib.rs"],"notes":["只读工具可并发/写操作串行是后续优化；当前顺序执行工具。","assistant 消息先落盘，再落 tool_result。","max steps 到达时停止并报错，不静默退出。"],"sources":[{"path":"crates/ni-agent/src/lib.rs","language":"rust","text":"//! Minimal turn loop.\n//!\n//! The loop owns the conversation order, tool dispatch, and session events. It\n//! does not know about wire formats or concrete tools; those live in\n//! `ni-provider` and `ni-tools`.\n\nuse std::collections::BTreeMap;\nuse std::path::PathBuf;\n\nuse anyhow::{bail, Result};\nuse futures_util::StreamExt;\nuse ni_core::{now_ms, Event, SessionLog, ToolCall, Usage};\nuse ni_provider::{ChatMessage, CompletionRequest, Provider, StreamEvent};\nuse ni_tools::Toolbox;\nuse serde_json::{json, Value};\n\npub struct AgentConfig {\n    pub model: String,\n    pub max_steps: usize,\n    pub system_prompt: String,\n    pub working_dir: PathBuf,\n}\n\nimpl AgentConfig {\n    pub fn new(model: impl Into\u003cString\u003e, working_dir: impl Into\u003cPathBuf\u003e) -\u003e Self {\n        let working_dir = working_dir.into();\n        let system_prompt = format!(\n            \"You are ni, a minimal coding agent working inside {}.\\n\\\n             Use the provided tools to inspect and modify files. Read a file before editing it.\\n\\\n             Prefer small, verifiable changes and run tests with bash when useful.\\n\\\n             When the task is complete, reply with a concise summary of what changed and any remaining issues.\\n\\\n             Do not claim success you have not verified.\",\n            working_dir.display()\n        );\n\n        Self {\n            model: model.into(),\n            max_steps: 12,\n            system_prompt,\n            working_dir,\n        }\n    }\n}\n\n#[derive(Debug, Clone)]\npub enum AgentEvent {\n    TextDelta(String),\n    ReasoningDelta(String),\n    ToolCall {\n        name: String,\n        input: Value,\n    },\n    ToolResult {\n        name: String,\n        ok: bool,\n        summary: String,\n    },\n    TurnEnd {\n        usage: Usage,\n    },\n}\n\n#[derive(Debug, Clone)]\npub struct RunOutcome {\n    pub turns: usize,\n    pub usage: Usage,\n    pub final_text: String,\n}\n\npub async fn run(\n    provider: \u0026dyn Provider,\n    session: \u0026mut SessionLog,\n    config: \u0026AgentConfig,\n    prompt: \u0026str,\n    observer: \u0026mut dyn FnMut(AgentEvent),\n) -\u003e Result\u003cRunOutcome\u003e {\n    if config.max_steps == 0 {\n        bail!(\"max_steps must be greater than zero\");\n    }\n\n    let toolbox = Toolbox::new(\u0026config.working_dir)?;\n    let tools = Toolbox::specs();\n    let mut messages = vec![\n        ChatMessage::system(config.system_prompt.clone()),\n        ChatMessage::user(prompt),\n    ];\n\n    session.append(\u0026Event::UserMessage {\n        text: prompt.to_string(),\n        ts: now_ms(),\n    })?;\n\n    let mut total_usage = Usage::default();\n\n    for turns in 1..=config.max_steps {\n        let mut request = CompletionRequest::new(config.model.clone());\n        request.messages = messages.clone();\n        request.tools = tools.clone();\n\n        let mut stream = provider.stream(request).await?;\n        let mut text = String::new();\n        let mut reasoning = String::new();\n        let mut pending = BTreeMap::\u003cu32, PendingCall\u003e::new();\n        let mut usage = None;\n\n        while let Some(event) = stream.next().await {\n            match event? {\n                StreamEvent::TextDelta(delta) =\u003e {\n                    observer(AgentEvent::TextDelta(delta.clone()));\n                    text.push_str(\u0026delta);\n                }\n                StreamEvent::ReasoningDelta(delta) =\u003e {\n                    observer(AgentEvent::ReasoningDelta(delta.clone()));\n                    reasoning.push_str(\u0026delta);\n                }\n                StreamEvent::ToolCallDelta(delta) =\u003e {\n                    let call = pending.entry(delta.index).or_default();\n                    if let Some(id) = delta.id {\n                        call.id = Some(id);\n                    }\n                    if let Some(name) = delta.name {\n                        call.name = Some(name);\n                    }\n                    call.arguments.push_str(\u0026delta.arguments);\n                }\n                StreamEvent::Usage(value) =\u003e usage = Some(value),\n                StreamEvent::Done { .. } =\u003e {}\n            }\n        }\n\n        let tool_calls = assemble_tool_calls(pending)?;\n\n        session.append(\u0026Event::AssistantMessage {\n            text: text.clone(),\n            reasoning: non_empty(reasoning.clone()),\n            tool_calls: tool_calls.clone(),\n            ts: now_ms(),\n        })?;\n\n        let turn_usage = usage.unwrap_or_default();\n        add_usage(\u0026mut total_usage, \u0026turn_usage);\n        session.append(\u0026Event::TurnEnd {\n            usage: turn_usage.clone(),\n            ts: now_ms(),\n        })?;\n        observer(AgentEvent::TurnEnd { usage: turn_usage });\n\n        messages.push(ChatMessage::assistant(\n            non_empty(text.clone()),\n            non_empty(reasoning),\n            tool_calls.clone(),\n        ));\n\n        if tool_calls.is_empty() {\n            session.append(\u0026Event::SessionEnd { ts: now_ms() })?;\n            return Ok(RunOutcome {\n                turns,\n                usage: total_usage,\n                final_text: text,\n            });\n        }\n\n        for call in tool_calls {\n            observer(AgentEvent::ToolCall {\n                name: call.name.clone(),\n                input: call.input.clone(),\n            });\n\n            let result = toolbox.execute(\u0026call.name, \u0026call.input).await;\n\n            session.append(\u0026Event::ToolResult {\n                call_id: call.id.clone(),\n                ok: result.ok,\n                output: result.output.clone(),\n                ts: now_ms(),\n            })?;\n\n            observer(AgentEvent::ToolResult {\n                name: call.name.clone(),\n                ok: result.ok,\n                summary: summary(\u0026result.output),\n            });\n\n            messages.push(ChatMessage::tool(call.id, result.output));\n        }\n    }\n\n    bail!(\n        \"max steps reached ({}); the task is not complete\",\n        config.max_steps\n    )\n}\n\n#[derive(Debug, Default)]\nstruct PendingCall {\n    id: Option\u003cString\u003e,\n    name: Option\u003cString\u003e,\n    arguments: String,\n}\n\n","truncated":true}]},{"id":"context","title":"Context","layer":"engine","status":"planned","summary":"把全量日志投影成模型上下文：预算、裁剪、compaction。","contract":"project(log, budget) -\u003e Context；有损但不修改日志。","paths":["crates/ni-core/src/context.rs"],"notes":["日志是全量，上下文是投影；压缩只影响投影。","保持前缀稳定以命中 provider prompt cache。"],"sources":[]},{"id":"providers","title":"Providers","layer":"adapters","status":"active","summary":"OpenAI-compatible SSE 适配；DeepSeek preset 支持 thinking、reasoning_content 与 usage。","contract":"Provider::stream(request) -\u003e StreamEvent；错误分 Auth / ContextOverflow / Http / Network / Decode；不依赖 tools 或 UI。","paths":["crates/ni-provider/src/lib.rs","crates/ni-provider/src/openai.rs","crates/ni-provider/src/sse.rs","crates/ni-provider/src/scripted.rs","crates/ni-provider/src/message.rs","crates/ni-provider/src/error.rs"],"notes":["SSE 解析器按行缓冲，支持跨 chunk、多行 data 和缺失 [DONE]。","DeepSeek 带 tools 时，历史 reasoning_content 必须回传。","重试只在 turn 边界；流中断后不原地重放。"],"sources":[{"path":"crates/ni-provider/src/lib.rs","language":"rust","text":"//! Provider boundary for ni.\n//!\n//! The loop talks to a provider through [`Provider`] and consumes a stream of\n//! normalized [`StreamEvent`]s. Wire formats stay in this crate; `ni-core`\n//! never sees SSE, HTTP, or provider-specific JSON.\n\nmod error;\nmod message;\nmod openai;\nmod scripted;\nmod sse;\n\npub use error::ProviderError;\npub use message::{\n    ChatMessage, CompletionRequest, FunctionSpec, Role, ToolSpec, WireFunction, WireToolCall,\n};\npub use openai::{OpenAiConfig, OpenAiProvider, Preset, ReasoningEffort, ThinkingMode};\npub use scripted::ScriptedProvider;\npub use sse::SseParser;\n\nuse std::pin::Pin;\n\nuse futures_util::Stream;\nuse ni_core::Usage;\n\n#[derive(Debug, Clone, PartialEq, Eq)]\npub struct ToolCallDelta {\n    pub index: u32,\n    pub id: Option\u003cString\u003e,\n    pub name: Option\u003cString\u003e,\n    pub arguments: String,\n}\n\n#[derive(Debug, Clone, PartialEq)]\npub enum StreamEvent {\n    TextDelta(String),\n    ReasoningDelta(String),\n    ToolCallDelta(ToolCallDelta),\n    Usage(Usage),\n    Done { finish_reason: Option\u003cString\u003e },\n}\n\npub type EventStream = Pin\u003cBox\u003cdyn Stream\u003cItem = Result\u003cStreamEvent, ProviderError\u003e\u003e + Send\u003e\u003e;\n\n#[async_trait::async_trait]\npub trait Provider: Send + Sync {\n    fn name(\u0026self) -\u003e \u0026str;\n    async fn stream(\u0026self, request: CompletionRequest) -\u003e Result\u003cEventStream, ProviderError\u003e;\n}\n","truncated":false},{"path":"crates/ni-provider/src/openai.rs","language":"rust","text":"use std::time::Duration;\n\nuse futures_util::{StreamExt, TryStreamExt};\nuse reqwest::header::{ACCEPT, RETRY_AFTER};\nuse serde::Serialize;\nuse serde_json::{json, Map, Value};\nuse tokio_util::codec::{FramedRead, LinesCodec};\nuse tokio_util::io::StreamReader;\n\nuse crate::message::{ChatMessage, CompletionRequest, ToolSpec};\nuse crate::sse::SseParser;\nuse crate::{EventStream, Provider, ProviderError};\n\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum ThinkingMode {\n    Enabled,\n    Disabled,\n}\n\nimpl ThinkingMode {\n    pub fn as_str(self) -\u003e \u0026'static str {\n        match self {\n            Self::Enabled =\u003e \"enabled\",\n            Self::Disabled =\u003e \"disabled\",\n        }\n    }\n\n    pub fn parse(value: \u0026str) -\u003e Option\u003cSelf\u003e {\n        match value.trim().to_ascii_lowercase().as_str() {\n            \"enabled\" | \"on\" | \"true\" =\u003e Some(Self::Enabled),\n            \"disabled\" | \"off\" | \"false\" =\u003e Some(Self::Disabled),\n            _ =\u003e None,\n        }\n    }\n}\n\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum ReasoningEffort {\n    None,\n    Low,\n    High,\n    Max,\n}\n\nimpl ReasoningEffort {\n    pub fn as_str(self) -\u003e \u0026'static str {\n        match self {\n            Self::None =\u003e \"none\",\n            Self::Low =\u003e \"low\",\n            Self::High =\u003e \"high\",\n            Self::Max =\u003e \"max\",\n        }\n    }\n\n    pub fn parse(value: \u0026str) -\u003e Option\u003cSelf\u003e {\n        match value.trim().to_ascii_lowercase().as_str() {\n            \"none\" =\u003e Some(Self::None),\n            \"minimal\" | \"low\" =\u003e Some(Self::Low),\n            \"medium\" | \"high\" | \"xhigh\" =\u003e Some(Self::High),\n            \"max\" | \"ultra\" =\u003e Some(Self::Max),\n            _ =\u003e None,\n        }\n    }\n}\n\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum Preset {\n    DeepSeek,\n    OpenAi,\n}\n\nimpl Preset {\n    pub const ALL: [Self; 2] = [Self::DeepSeek, Self::OpenAi];\n\n    pub fn as_str(self) -\u003e \u0026'static str {\n        match self {\n            Self::DeepSeek =\u003e \"deepseek\",\n            Self::OpenAi =\u003e \"openai\",\n        }\n    }\n\n    pub fn parse(value: \u0026str) -\u003e Option\u003cSelf\u003e {\n        match value.trim().to_ascii_lowercase().as_str() {\n            \"deepseek\" =\u003e Some(Self::DeepSeek),\n            \"openai\" =\u003e Some(Self::OpenAi),\n            _ =\u003e None,\n        }\n    }\n\n    pub fn api_key_env(self) -\u003e \u0026'static str {\n        match self {\n            Self::DeepSeek =\u003e \"DEEPSEEK_API_KEY\",\n            Self::OpenAi =\u003e \"OPENAI_API_KEY\",\n        }\n    }\n\n    pub fn default_base_url(self) -\u003e \u0026'static str {\n        match self {\n            Self::DeepSeek =\u003e \"https://api.deepseek.com\",\n            Self::OpenAi =\u003e \"https://api.openai.com/v1\",\n        }\n    }\n\n    pub fn default_model(self) -\u003e \u0026'static str {\n        match self {\n            Self::DeepSeek =\u003e \"deepseek-flash\",\n            Self::OpenAi =\u003e \"gpt-4o-mini\",\n        }\n    }\n}\n\n#[derive(Debug, Clone)]\npub struct OpenAiConfig {\n    pub base_url: String,\n    pub api_key: String,\n    pub model: String,\n    /// DeepSeek-specific `thinking` control; `None` for plain OpenAI-compatible\n    /// providers.\n    pub thinking: Option\u003cThinkingMode\u003e,\n    pub reasoning_effort: Option\u003cReasoningEffort\u003e,\n    pub connect_timeout: Duration,\n}\n\nimpl OpenAiConfig {\n    pub fn new(\n        base_url: impl Into\u003cString\u003e,\n        api_key: impl Into\u003cString\u003e,\n        model: impl Into\u003cString\u003e,\n    ) -\u003e Self {\n        Self {\n            base_url: base_url.into(),\n            api_key: api_key.into(),\n            model: model.into(),\n            thinking: None,\n            reasoning_effort: None,\n            connect_timeout: Duration::from_secs(10),\n        }\n    }\n\n    pub fn with_thinking(mut self, mode: ThinkingMode) -\u003e Self {\n        self.thinking = Some(mode);\n        self\n    }\n\n    pub fn with_reasoning_effort(mut self, effort: ReasoningEffort) -\u003e Self {\n        self.reasoning_effort = Some(effort);\n        self\n    }\n\n    pub fn with_connect_timeout(mut self, timeout: Duration) -\u003e Self {\n        self.connect_timeout = timeout;\n        self\n    }\n\n    pub fn from_preset(preset: Preset) -\u003e Result\u003cSelf, ProviderError\u003e {\n        let mut config = Self::preset_config(preset)?;\n        config.api_key = required_env(preset.api_key_env())?;\n        Ok(config)\n    }\n\n    /// Preset settings without a credential. Callers using `ni-auth` set\n    /// `api_key` after resolving env → keyring → file.\n    pub fn preset_config(preset: Preset) -\u003e Result\u003cSelf, ProviderError\u003e {\n        match preset {\n            Preset::DeepSeek =\u003e {\n                let base_url = std::env::var(\"DEEPSEEK_BASE_URL\")\n                    .ok()\n                    .filter(|value| !value.trim().is_empty())\n                    .unwrap_or_else(|| preset.default_base_url().into());\n                let model = std::env::var(\"DEEPSEEK_MODEL\")\n                    .ok()\n                    .filter(|value| !value.trim().is_empty())\n                    .unwrap_or_else(|| preset.default_model().into());\n                let thinking = match std::env::var(\"DEEPSEEK_THINKING\") {\n                    Ok(value) =\u003e Some(ThinkingMode::parse(\u0026value).ok_or_else(|| {\n                        ProviderError::Config(format!(\n                            \"DEEPSEEK_THINKING must be enabled or disabled, got {value:?}\"\n                        ))\n                    })?),\n                    Err(_) =\u003e Some(ThinkingMode::Enabled),\n                };\n                let reasoning_effort = match std::env::var(\"DEEPSEEK_REASONING_EFFORT\") {\n                    Ok(value) =\u003e Some(ReasoningEffort::parse(\u0026value).ok_or_else(|| {\n                        ProviderError::Config(format!(\n                            \"DEEPSEEK_REASONING_EFFORT must be none/low/high/max, got {value:?}\"\n                        ))\n                    })?),\n                    Err(_) =\u003e None,\n                };\n\n                Ok(Self {\n                    base_url,\n                    api_key: String::new(),\n                    model,\n                    thinking,\n                    reasoning_effort,\n                    connect_timeout: Duration::from_secs(10),\n                })\n            }\n            Preset::OpenAi =\u003e {\n","truncated":true},{"path":"crates/ni-provider/src/sse.rs","language":"rust","text":"use ni_core::Usage;\nuse serde::Deserialize;\n\nuse crate::{ProviderError, StreamEvent, ToolCallDelta};\n\n/// Incremental SSE decoder for OpenAI-compatible chat completion streams.\n///\n/// It accepts text chunks of arbitrary size, buffers partial lines, joins\n/// multi-line `data:` fields, ignores comments/keepalives, and turns each JSON\n/// payload into normalized [`StreamEvent`]s. `[DONE]` emits the final event.\n#[derive(Debug, Default)]\npub struct SseParser {\n    buffer: String,\n    data: Vec\u003cString\u003e,\n    finish_reason: Option\u003cString\u003e,\n    done: bool,\n}\n\nimpl SseParser {\n    pub fn push_str(\u0026mut self, chunk: \u0026str) -\u003e Result\u003cVec\u003cStreamEvent\u003e, ProviderError\u003e {\n        let mut events = Vec::new();\n        self.buffer.push_str(chunk);\n\n        while let Some(position) = self.buffer.find('\\n') {\n            let line = self.buffer[..position].trim_end_matches('\\r').to_string();\n            self.buffer.drain(..=position);\n            self.handle_line(\u0026line, \u0026mut events)?;\n        }\n\n        Ok(events)\n    }\n\n    /// Feed one complete line (without its trailing newline). Used by the\n    /// streaming HTTP path, which decodes lines before handing them over.\n    pub fn push_line(\u0026mut self, line: \u0026str) -\u003e Result\u003cVec\u003cStreamEvent\u003e, ProviderError\u003e {\n        let mut events = Vec::new();\n        self.handle_line(line.trim_end_matches('\\r'), \u0026mut events)?;\n        Ok(events)\n    }\n\n    /// Flush a trailing line and ensure a `Done` event is emitted exactly once.\n    pub fn finish(\u0026mut self) -\u003e Result\u003cVec\u003cStreamEvent\u003e, ProviderError\u003e {\n        let mut events = Vec::new();\n\n        if !self.buffer.is_empty() {\n            let line = std::mem::take(\u0026mut self.buffer);\n            self.handle_line(\u0026line, \u0026mut events)?;\n        }\n\n        self.dispatch(\u0026mut events)?;\n\n        if !self.done {\n            self.done = true;\n            events.push(StreamEvent::Done {\n                finish_reason: self.finish_reason.clone(),\n            });\n        }\n\n        Ok(events)\n    }\n\n    fn handle_line(\n        \u0026mut self,\n        line: \u0026str,\n        events: \u0026mut Vec\u003cStreamEvent\u003e,\n    ) -\u003e Result\u003c(), ProviderError\u003e {\n        if line.is_empty() {\n            self.dispatch(events)?;\n            return Ok(());\n        }\n\n        if line.starts_with(':') {\n            return Ok(());\n        }\n\n        if let Some(rest) = line.strip_prefix(\"data:\") {\n            let payload = rest.strip_prefix(' ').unwrap_or(rest);\n            if !payload.is_empty() {\n                self.data.push(payload.to_string());\n            }\n        }\n\n        // `event:`, `id:`, and `retry:` do not change the normalized payload.\n        Ok(())\n    }\n\n    fn dispatch(\u0026mut self, events: \u0026mut Vec\u003cStreamEvent\u003e) -\u003e Result\u003c(), ProviderError\u003e {\n        if self.data.is_empty() {\n            return Ok(());\n        }\n\n        let payload = self.data.join(\"\\n\");\n        self.data.clear();\n\n        if payload.trim() == \"[DONE]\" {\n            if !self.done {\n                self.done = true;\n                events.push(StreamEvent::Done {\n                    finish_reason: self.finish_reason.clone(),\n                });\n            }\n            return Ok(());\n        }\n\n        let chunk: WireChunk = serde_json::from_str(\u0026payload).map_err(|error| {\n            ProviderError::Decode(format!(\"{error}: {}\", truncate(\u0026payload, 240)))\n        })?;\n\n        if let Some(error) = chunk.error {\n            return Err(ProviderError::Decode(format!(\n                \"provider error: {}\",\n                truncate(\u0026error.message, 240)\n            )));\n        }\n\n        if let Some(usage) = chunk.usage {\n            events.push(StreamEvent::Usage(usage.into_usage()));\n        }\n\n        for choice in chunk.choices {\n            if let Some(reasoning) = choice.delta.reasoning_content {\n                if !reasoning.is_empty() {\n                    events.push(StreamEvent::ReasoningDelta(reasoning));\n                }\n            }\n\n            if let Some(content) = choice.delta.content {\n                if !content.is_empty() {\n                    events.push(StreamEvent::TextDelta(content));\n                }\n            }\n\n            if let Some(tool_calls) = choice.delta.tool_calls {\n                for (fallback, tool_call) in tool_calls.into_iter().enumerate() {\n                    let function = tool_call.function.unwrap_or_default();\n                    events.push(StreamEvent::ToolCallDelta(ToolCallDelta {\n                        index: tool_call.index.unwrap_or(fallback as u32),\n                        id: tool_call.id,\n                        name: function.name,\n                        arguments: function.arguments.unwrap_or_default(),\n                    }));\n                }\n            }\n\n            if let Some(reason) = choice.finish_reason {\n                self.finish_reason = Some(reason);\n            }\n        }\n\n        Ok(())\n    }\n}\n\n#[derive(Debug, Deserialize)]\nstruct WireChunk {\n    #[serde(default)]\n    choices: Vec\u003cWireChoice\u003e,\n    #[serde(default)]\n    usage: Option\u003cWireUsage\u003e,\n    #[serde(default)]\n    error: Option\u003cWireError\u003e,\n}\n\n#[derive(Debug, Deserialize)]\nstruct WireChoice {\n    #[serde(default)]\n    delta: WireDelta,\n    #[serde(default)]\n    finish_reason: Option\u003cString\u003e,\n}\n\n#[derive(Debug, Default, Deserialize)]\nstruct WireDelta {\n    #[serde(default)]\n    content: Option\u003cString\u003e,\n    #[serde(default)]\n    reasoning_content: Option\u003cString\u003e,\n    #[serde(default)]\n    tool_calls: Option\u003cVec\u003cWireToolCallDelta\u003e\u003e,\n}\n\n#[derive(Debug, Deserialize)]\nstruct WireToolCallDelta {\n    #[serde(default)]\n    index: Option\u003cu32\u003e,\n    #[serde(default)]\n    id: Option\u003cString\u003e,\n    #[serde(default)]\n    function: Option\u003cWireFunctionDelta\u003e,\n}\n\n#[derive(Debug, Default, Deserialize)]\nstruct WireFunctionDelta {\n    #[serde(default)]\n    name: Option\u003cString\u003e,\n    #[serde(default)]\n    arguments: Option\u003cString\u003e,\n}\n\n#[derive(Debug, Default, Deserialize)]\n","truncated":true},{"path":"crates/ni-provider/src/scripted.rs","language":"rust","text":"use std::collections::VecDeque;\nuse std::sync::Mutex;\n\nuse futures_util::stream;\n\nuse crate::{CompletionRequest, EventStream, Provider, ProviderError, StreamEvent};\n\n/// Deterministic provider for tests and offline loop development.\n///\n/// Each `stream` call consumes one scripted turn. A turn is a sequence of\n/// normalized events, typically ending with `Done`.\npub struct ScriptedProvider {\n    name: String,\n    turns: Mutex\u003cVecDeque\u003cVec\u003cResult\u003cStreamEvent, ProviderError\u003e\u003e\u003e\u003e,\n    requests: Mutex\u003cVec\u003cCompletionRequest\u003e\u003e,\n}\n\nimpl ScriptedProvider {\n    pub fn new(events: Vec\u003cStreamEvent\u003e) -\u003e Self {\n        Self::from_turns(vec![events])\n    }\n\n    pub fn from_turns(turns: Vec\u003cVec\u003cStreamEvent\u003e\u003e) -\u003e Self {\n        let turns = turns\n            .into_iter()\n            .map(|turn| turn.into_iter().map(Ok).collect())\n            .collect();\n        Self::from_results(turns)\n    }\n\n    pub fn with_results(events: Vec\u003cResult\u003cStreamEvent, ProviderError\u003e\u003e) -\u003e Self {\n        Self::from_results(vec![events])\n    }\n\n    pub fn from_results(turns: Vec\u003cVec\u003cResult\u003cStreamEvent, ProviderError\u003e\u003e\u003e) -\u003e Self {\n        Self {\n            name: \"scripted\".into(),\n            turns: Mutex::new(turns.into()),\n            requests: Mutex::new(Vec::new()),\n        }\n    }\n\n    pub fn requests(\u0026self) -\u003e Vec\u003cCompletionRequest\u003e {\n        self.requests.lock().expect(\"scripted request lock\").clone()\n    }\n}\n\n#[async_trait::async_trait]\nimpl Provider for ScriptedProvider {\n    fn name(\u0026self) -\u003e \u0026str {\n        \u0026self.name\n    }\n\n    async fn stream(\u0026self, request: CompletionRequest) -\u003e Result\u003cEventStream, ProviderError\u003e {\n        self.requests\n            .lock()\n            .expect(\"scripted request lock\")\n            .push(request);\n\n        let events = self\n            .turns\n            .lock()\n            .expect(\"scripted turn lock\")\n            .pop_front()\n            .unwrap_or_default();\n\n        Ok(Box::pin(stream::iter(events)))\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use futures_util::StreamExt;\n\n    use super::*;\n    use crate::ChatMessage;\n\n    #[tokio::test]\n    async fn replays_turns_and_records_requests() {\n        let provider = ScriptedProvider::from_turns(vec![\n            vec![\n                StreamEvent::TextDelta(\"first\".into()),\n                StreamEvent::Done {\n                    finish_reason: Some(\"stop\".into()),\n                },\n            ],\n            vec![\n                StreamEvent::TextDelta(\"second\".into()),\n                StreamEvent::Done {\n                    finish_reason: Some(\"stop\".into()),\n                },\n            ],\n        ]);\n\n        for expected in [\"first\", \"second\"] {\n            let request = CompletionRequest::new(\"test\").with_message(ChatMessage::user(\"hi\"));\n            let mut events = provider.stream(request).await.expect(\"stream\");\n            let mut seen = Vec::new();\n            while let Some(event) = events.next().await {\n                seen.push(event.expect(\"event\"));\n            }\n            assert_eq!(seen[0], StreamEvent::TextDelta(expected.into()));\n        }\n\n        assert_eq!(provider.requests().len(), 2);\n        assert_eq!(provider.requests()[0].model, \"test\");\n    }\n}\n","truncated":false},{"path":"crates/ni-provider/src/message.rs","language":"rust","text":"use ni_core::ToolCall;\nuse serde::{Deserialize, Serialize};\nuse serde_json::Value;\n\n#[derive(Debug, Clone, Copy, PartialEq, Eq, Serialize, Deserialize)]\n#[serde(rename_all = \"lowercase\")]\npub enum Role {\n    System,\n    User,\n    Assistant,\n    Tool,\n}\n\n#[derive(Debug, Clone, PartialEq, Serialize, Deserialize)]\npub struct ChatMessage {\n    pub role: Role,\n    #[serde(skip_serializing_if = \"Option::is_none\")]\n    pub content: Option\u003cString\u003e,\n    /// DeepSeek extension. Must be echoed back when the request carries tools.\n    #[serde(skip_serializing_if = \"Option::is_none\")]\n    pub reasoning_content: Option\u003cString\u003e,\n    #[serde(skip_serializing_if = \"Option::is_none\")]\n    pub tool_calls: Option\u003cVec\u003cWireToolCall\u003e\u003e,\n    #[serde(skip_serializing_if = \"Option::is_none\")]\n    pub tool_call_id: Option\u003cString\u003e,\n}\n\nimpl ChatMessage {\n    pub fn system(text: impl Into\u003cString\u003e) -\u003e Self {\n        Self {\n            role: Role::System,\n            content: Some(text.into()),\n            reasoning_content: None,\n            tool_calls: None,\n            tool_call_id: None,\n        }\n    }\n\n    pub fn user(text: impl Into\u003cString\u003e) -\u003e Self {\n        Self {\n            role: Role::User,\n            content: Some(text.into()),\n            reasoning_content: None,\n            tool_calls: None,\n            tool_call_id: None,\n        }\n    }\n\n    pub fn assistant(\n        text: Option\u003cString\u003e,\n        reasoning: Option\u003cString\u003e,\n        tool_calls: Vec\u003cToolCall\u003e,\n    ) -\u003e Self {\n        let tool_calls = if tool_calls.is_empty() {\n            None\n        } else {\n            Some(\n                tool_calls\n                    .iter()\n                    .map(WireToolCall::from_tool_call)\n                    .collect(),\n            )\n        };\n\n        Self {\n            role: Role::Assistant,\n            content: text.filter(|value| !value.is_empty()),\n            reasoning_content: reasoning.filter(|value| !value.is_empty()),\n            tool_calls,\n            tool_call_id: None,\n        }\n    }\n\n    pub fn tool(call_id: impl Into\u003cString\u003e, output: impl Into\u003cString\u003e) -\u003e Self {\n        Self {\n            role: Role::Tool,\n            content: Some(output.into()),\n            reasoning_content: None,\n            tool_calls: None,\n            tool_call_id: Some(call_id.into()),\n        }\n    }\n}\n\n#[derive(Debug, Clone, PartialEq, Serialize, Deserialize)]\npub struct WireToolCall {\n    pub id: String,\n    #[serde(rename = \"type\")]\n    pub kind: String,\n    pub function: WireFunction,\n}\n\n#[derive(Debug, Clone, PartialEq, Serialize, Deserialize)]\npub struct WireFunction {\n    pub name: String,\n    pub arguments: String,\n}\n\nimpl WireToolCall {\n    pub fn from_tool_call(call: \u0026ToolCall) -\u003e Self {\n        let arguments = if call.input.is_null() {\n            \"{}\".to_string()\n        } else {\n            serde_json::to_string(\u0026call.input).unwrap_or_else(|_| \"{}\".to_string())\n        };\n\n        Self {\n            id: call.id.clone(),\n            kind: \"function\".into(),\n            function: WireFunction {\n                name: call.name.clone(),\n                arguments,\n            },\n        }\n    }\n}\n\n#[derive(Debug, Clone, PartialEq, Serialize)]\npub struct ToolSpec {\n    #[serde(rename = \"type\")]\n    pub kind: String,\n    pub function: FunctionSpec,\n}\n\n#[derive(Debug, Clone, PartialEq, Serialize)]\npub struct FunctionSpec {\n    pub name: String,\n    pub description: String,\n    pub parameters: Value,\n}\n\nimpl ToolSpec {\n    pub fn function(\n        name: impl Into\u003cString\u003e,\n        description: impl Into\u003cString\u003e,\n        parameters: Value,\n    ) -\u003e Self {\n        Self {\n            kind: \"function\".into(),\n            function: FunctionSpec {\n                name: name.into(),\n                description: description.into(),\n                parameters,\n            },\n        }\n    }\n}\n\n#[derive(Debug, Clone)]\npub struct CompletionRequest {\n    pub model: String,\n    pub messages: Vec\u003cChatMessage\u003e,\n    pub tools: Vec\u003cToolSpec\u003e,\n    pub temperature: Option\u003cf32\u003e,\n    pub max_tokens: Option\u003cu32\u003e,\n}\n\nimpl CompletionRequest {\n    pub fn new(model: impl Into\u003cString\u003e) -\u003e Self {\n        Self {\n            model: model.into(),\n            messages: Vec::new(),\n            tools: Vec::new(),\n            temperature: None,\n            max_tokens: None,\n        }\n    }\n\n    pub fn with_message(mut self, message: ChatMessage) -\u003e Self {\n        self.messages.push(message);\n        self\n    }\n\n    pub fn with_tool(mut self, tool: ToolSpec) -\u003e Self {\n        self.tools.push(tool);\n        self\n    }\n}\n","truncated":false},{"path":"crates/ni-provider/src/error.rs","language":"rust","text":"use std::time::Duration;\n\nuse thiserror::Error;\n\n#[derive(Debug, Error)]\npub enum ProviderError {\n    #[error(\"missing API key for {provider}: set {env}\")]\n    MissingApiKey {\n        provider: \u0026'static str,\n        env: \u0026'static str,\n    },\n    #[error(\"provider config error: {0}\")]\n    Config(String),\n    #[error(\"authentication failed: {0}\")]\n    Auth(String),\n    #[error(\"context overflow: {0}\")]\n    ContextOverflow(String),\n    #[error(\"http {status}: {message}\")]\n    Http {\n        status: u16,\n        message: String,\n        retryable: bool,\n        retry_after: Option\u003cDuration\u003e,\n    },\n    #[error(\"network error: {0}\")]\n    Network(String),\n    #[error(\"stream decode error: {0}\")]\n    Decode(String),\n    #[error(\"provider cancelled\")]\n    Cancelled,\n}\n\nimpl ProviderError {\n    /// Whether the whole turn can be retried safely. Once a stream has started\n    /// producing output, retrying in place is not safe; the loop should start a\n    /// new turn instead.\n    pub fn is_retryable(\u0026self) -\u003e bool {\n        match self {\n            Self::Http { retryable, .. } =\u003e *retryable,\n            Self::Network(_) =\u003e true,\n            _ =\u003e false,\n        }\n    }\n\n    pub fn retry_after(\u0026self) -\u003e Option\u003cDuration\u003e {\n        match self {\n            Self::Http { retry_after, .. } =\u003e *retry_after,\n            _ =\u003e None,\n        }\n    }\n\n    pub fn is_context_overflow(\u0026self) -\u003e bool {\n        matches!(self, Self::ContextOverflow(_))\n    }\n}\n","truncated":false}]},{"id":"tools","title":"Tools","layer":"adapters","status":"active","summary":"最小四工具：read / write / edit / bash；路径限制、read-before-write、输出截断。","contract":"Toolbox::execute(name, input) -\u003e ToolResult；已有文件必须先 read；bash 默认 120s 超时。","paths":["crates/ni-tools/src/lib.rs"],"notes":["grep / glob 还没实现；可以先用 bash。","bash 是逃生舱，不经过文件路径策略。","输出截断保留尾部，避免撑爆上下文。"],"sources":[{"path":"crates/ni-tools/src/lib.rs","language":"rust","text":"//! Workspace tools exposed to the model.\n//!\n//! The first closed loop intentionally has four tools: `read`, `write`, `edit`,\n//! and `bash`. All file paths are resolved inside the working directory;\n//! `write`/`edit` require the file to have been observed by `read` first.\n\nuse std::collections::HashSet;\nuse std::fs;\nuse std::path::{Path, PathBuf};\nuse std::sync::Mutex;\nuse std::time::Duration;\n\nuse anyhow::{bail, Context, Result};\nuse ni_provider::ToolSpec;\nuse serde_json::{json, Value};\nuse tokio::process::Command;\nuse tokio::time::timeout;\n\nconst READ_MAX_LINES: usize = 2_000;\nconst READ_MAX_BYTES: usize = 50_000;\nconst BASH_MAX_BYTES: usize = 20_000;\nconst BASH_DEFAULT_TIMEOUT: u64 = 120;\nconst BASH_MAX_TIMEOUT: u64 = 600;\n\npub struct Toolbox {\n    cwd: PathBuf,\n    observed: Mutex\u003cHashSet\u003cPathBuf\u003e\u003e,\n}\n\nimpl Toolbox {\n    pub fn new(cwd: impl AsRef\u003cPath\u003e) -\u003e Result\u003cSelf\u003e {\n        let cwd = cwd.as_ref().canonicalize().with_context(|| {\n            format!(\"canonicalize working directory {}\", cwd.as_ref().display())\n        })?;\n        if !cwd.is_dir() {\n            bail!(\"working directory is not a directory: {}\", cwd.display());\n        }\n\n        Ok(Self {\n            cwd,\n            observed: Mutex::new(HashSet::new()),\n        })\n    }\n\n    pub fn cwd(\u0026self) -\u003e \u0026Path {\n        \u0026self.cwd\n    }\n\n    pub fn specs() -\u003e Vec\u003cToolSpec\u003e {\n        vec![\n            ToolSpec::function(\n                \"read\",\n                \"Read a UTF-8 text file inside the workspace. Returns line numbers. Read a file before editing or overwriting it.\",\n                json!({\n                    \"type\": \"object\",\n                    \"properties\": {\n                        \"path\": {\"type\": \"string\", \"description\": \"Workspace-relative path\"},\n                        \"offset\": {\"type\": \"integer\", \"description\": \"1-based first line to return\", \"minimum\": 1},\n                        \"limit\": {\"type\": \"integer\", \"description\": \"Maximum lines to return\", \"minimum\": 1, \"maximum\": READ_MAX_LINES}\n                    },\n                    \"required\": [\"path\"]\n                }),\n            ),\n            ToolSpec::function(\n                \"write\",\n                \"Create or fully overwrite a text file inside the workspace. Reading an existing file first is required.\",\n                json!({\n                    \"type\": \"object\",\n                    \"properties\": {\n                        \"path\": {\"type\": \"string\"},\n                        \"content\": {\"type\": \"string\"}\n                    },\n                    \"required\": [\"path\", \"content\"]\n                }),\n            ),\n            ToolSpec::function(\n                \"edit\",\n                \"Replace one exact, unique string in a file after reading it. Fails if the old string is missing or appears more than once.\",\n                json!({\n                    \"type\": \"object\",\n                    \"properties\": {\n                        \"path\": {\"type\": \"string\"},\n                        \"old\": {\"type\": \"string\", \"description\": \"Exact text to replace; must be unique\"},\n                        \"new\": {\"type\": \"string\", \"description\": \"Replacement text\"}\n                    },\n                    \"required\": [\"path\", \"old\", \"new\"]\n                }),\n            ),\n            ToolSpec::function(\n                \"bash\",\n                \"Run a shell command in the workspace. Returns the last 20KB of combined output and the exit code. Prefer this for tests and builds.\",\n                json!({\n                    \"type\": \"object\",\n                    \"properties\": {\n                        \"command\": {\"type\": \"string\"},\n                        \"timeout_secs\": {\"type\": \"integer\", \"minimum\": 1, \"maximum\": BASH_MAX_TIMEOUT}\n                    },\n                    \"required\": [\"command\"]\n                }),\n            ),\n        ]\n    }\n\n    pub async fn execute(\u0026self, name: \u0026str, input: \u0026Value) -\u003e ToolResult {\n        let result = match name {\n            \"read\" =\u003e self.read(input),\n            \"write\" =\u003e self.write(input),\n            \"edit\" =\u003e self.edit
