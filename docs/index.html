编译整个 workspace。\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e备选方案\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eTypeScript / Bun\u003c/strong\u003e：迭代最快，官方 SDK 最全，TUI 生态好。运行时足够，但单二进制、内存和原生沙箱弱。若接下来数周的主要目标是高频试 context 策略，这是更快的选择。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eRust core + TS TUI（JSON-RPC）\u003c/strong\u003e：长期可行，但 v0 多一套协议、进程生命周期和错误映射，违背 minimal。等事件协议稳定后再考虑拆分。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePython\u003c/strong\u003e：原型最快，但分发、并发、类型约束和长会话内存都不占优。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e备注\u003c/h2\u003e\n\u003cp\u003e\"Rust 慢一倍\"指的是开发迭代速度，不是运行时。性能优先应当优化 prompt cache、工具输出体积、并行工具和 compaction，而不是期待换语言让模型响应变快。\u003c/p\u003e\n","path":"docs/adr/0001-rust-core.md","excerpt":"性能优先不等于 loop 快几毫秒；Rust 换来的是启动、内存、分发和原生沙箱。"},{"id":"adr-0002","title":"ADR-0002：事件日志是唯一真相","kind":"adr","status":"accepted","order":21,"summary":"内存状态只是 JSONL 日志的 fold；resume、fork、replay 和 compaction 都从日志派生。","body_html":"\u003ch2\u003e状态\u003c/h2\u003e\n\u003cp\u003eAccepted · 2026-10-20\u003c/p\u003e\n\u003ch2\u003e背景\u003c/h2\u003e\n\u003cp\u003eAgent 进程会崩溃、被取消、被重启。如果对话只存在内存里，一次崩溃就丢掉全部上下文；如果另外维护一份\"session 快照\"，它和内存状态迟早不一致。\u003c/p\u003e\n\u003ch2\u003e决策\u003c/h2\u003e\n\u003cp\u003e每个 session 是一个 append-only JSONL 文件，一行一个 \u003ccode\u003eEvent\u003c/code\u003e。内存状态是日志的 fold：\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003estate = fold(events)\n\u003c/code\u003e\u003c/pre\u003e\n\u003cul\u003e\n\u003cli\u003e写入：\u003ccode\u003eSessionLog::append\u003c/code\u003e 序列化一行、flush，不改旧行。\u003c/li\u003e\n\u003cli\u003e读取：\u003ccode\u003eload\u003c/code\u003e 逐行解码；坏行变成 warning，不丢整份历史。\u003c/li\u003e\n\u003cli\u003e恢复：\u003ccode\u003eresume\u003c/code\u003e 从日志重建，而不是从快照恢复。\u003c/li\u003e\n\u003cli\u003e分叉：\u003ccode\u003efork\u003c/code\u003e 复制某个前缀，生成新 session。\u003c/li\u003e\n\u003cli\u003e压缩：\u003ccode\u003ecompaction\u003c/code\u003e 事件记录摘要和 \u003ccode\u003eupto\u003c/code\u003e；只影响投影，不删原始事件。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e后果\u003c/h2\u003e\n\u003ch3\u003e正向\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eresume / replay / fork 共用一套机制，测试可离线回放。\u003c/li\u003e\n\u003cli\u003e崩溃最多丢最后一行（未 flush），不会出现\"内存与磁盘不一致\"。\u003c/li\u003e\n\u003cli\u003e审计简单：每个决策、工具调用、usage 都有时间线。\u003c/li\u003e\n\u003cli\u003e压缩是投影变换，可回滚、可对比。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e负向\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e日志会增长；长会话需要 compaction 和归档策略。\u003c/li\u003e\n\u003cli\u003e事件 schema 演进需要兼容策略（新增字段可默认，删除/改义要迁移）。\u003c/li\u003e\n\u003cli\u003e日志可能包含敏感内容（文件内容、命令输出），需要权限和清理策略。\u003c/li\u003e\n\u003cli\u003e每次 append 都 flush，吞吐低于批量写；对 agent 的写入频率足够。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e投影规则\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e原始事件永远保留。\u003c/li\u003e\n\u003cli\u003e最后一个 \u003ccode\u003ecompaction\u003c/code\u003e 之前的消息不进入模型上下文，替换为摘要。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003etool_result\u003c/code\u003e 必须和对应 \u003ccode\u003eassistant_message.tool_calls\u003c/code\u003e 成对出现；缺失时投影报错，不猜。\u003c/li\u003e\n\u003cli\u003ereasoning 是否进入上下文由 provider 适配层决定，日志始终保留原文。\u003c/li\u003e\n\u003cli\u003e投影是纯函数：相同日志 + 相同预算 → 相同上下文。\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e备选方案\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e内存 messages + 退出时快照\u003c/strong\u003e：实现简单，但崩溃丢上下文，且快照与内存双真相。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e数据库（SQLite）\u003c/strong\u003e：查询和并发更好，但 v0 引入 schema、迁移和依赖；JSONL 可 grep、可 diff、可直接回放。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e只存模型可见的投影\u003c/strong\u003e：省空间，但丢掉审计和 fork 能力，压缩不可逆。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e风险与缓解\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e日志过大：按 session 归档，支持 \u003ccode\u003ecompact --archive\u003c/code\u003e；看板 Runs 视图只读聚合指标。\u003c/li\u003e\n\u003cli\u003e敏感信息：session 目录默认 \u003ccode\u003e0700\u003c/code\u003e；提供 \u003ccode\u003eni session redact\u003c/code\u003e 的后续入口。\u003c/li\u003e\n\u003cli\u003e坏行：加载时 warning + 行号；\u003ccode\u003e--strict\u003c/code\u003e 模式用于 CI。\u003c/li\u003e\n\u003c/ul\u003e\n","path":"docs/adr/0002-event-log.md","excerpt":"内存状态只是 JSONL 日志的 fold；resume、fork、replay 和 compaction 都从日志派生。"},{"id":"adr-0003","title":"ADR-0003：Dashboard 以架构为第一屏","kind":"adr","status":"accepted","order":22,"summary":"看板不再以进度为主叙事；默认 Architecture，Work 降为二级，进度装饰从架构视图移除。","body_html":"\u003ch2\u003e状态\u003c/h2\u003e\n\u003cp\u003eAccepted · 2026-10-20\u003c/p\u003e\n\u003ch2\u003e背景\u003c/h2\u003e\n\u003cp\u003e项目看板最初照搬了任务看板的默认视图：打开就是 Board、里程碑进度条、完成率和卡片计数。这个结构回答的是\"做到哪了\"，但项目真正需要反复阅读的是\"系统由哪些边界组成、依赖往哪流、为什么这样切\"。\u003c/p\u003e\n\u003cp\u003e进度信息还有两个问题：它和 git、session log 重复；为了看起来完整，会诱导维护者不断更新百分比和统计数字，而不是更新架构和决策。卡片本身仍然是 agent 的 handoff 面，值得保留，但不应该占据第一屏。\u003c/p\u003e\n\u003ch2\u003e决策\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e默认视图改为 Architecture\u003c/strong\u003e，导航固定为 Architecture / Work / Docs / Decisions。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eWork 降为二级视图\u003c/strong\u003e：保留卡片、状态列和里程碑筛选，但移除进度条、完成率、WIP 数字和卡片计数。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eArchitecture 只保留结构信息\u003c/strong\u003e：层、模块、关系、owned paths、contract、源码；\u003ccode\u003eplanned / active / done\u003c/code\u003e 是模块状态，不是完成率。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDecisions 只收决策\u003c/strong\u003e：ADR 和 \u003ccode\u003ekind = \"decision\"\u003c/code\u003e 事件；不展示\"某张卡完成\"的流水账。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e不上前端框架\u003c/strong\u003e：继续原生 JS/CSS，保持单文件、离线、\u003ccode\u003ecargo xtask dashboard\u003c/code\u003e 确定性构建。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e视觉方向为 technical field guide\u003c/strong\u003e：暖纸、墨色、深绿强调、低饱和层色；架构图是主角；不做 zoom/pan 和拖拽编辑。\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e后果\u003c/h2\u003e\n\u003ch3\u003e正向\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e第一屏直接回答\"系统长什么样\"，而不是\"完成了几张卡\"。\u003c/li\u003e\n\u003cli\u003e进度回到 git / session log / Work 视图，减少看板变成第二真相源的压力。\u003c/li\u003e\n\u003cli\u003e单文件、零构建、离线可用；页面大约维持在当前体量。\u003c/li\u003e\n\u003cli\u003e模块聚焦会弱化无关节点，复杂架构图仍然可读。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e负向\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e想快速看进度的人需要多点一次 Work。\u003c/li\u003e\n\u003cli\u003e卡片状态仍然需要维护；只是不再用进度条装饰它。\u003c/li\u003e\n\u003cli\u003e没有 zoom/pan，超过约 30 个模块后需要重新评估图导航。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e备选方案\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e保留 Board 优先\u003c/strong\u003e：改动最小，但与架构阅读的目标冲突。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e删除 Work，进度交给 GitHub Issues\u003c/strong\u003e：最纯粹，但会破坏当前 \u003ccode\u003eAGENTS.md\u003c/code\u003e 依赖卡片做 handoff 的流程，并引入第二套状态源。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e引入 React/Svelte + 图编辑器\u003c/strong\u003e：当前 9 个模块、8 条关系，框架 runtime 比数据还大；等真的需要编辑/拖拽/多人协作时再做。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eRevisit 条件\u003c/h2\u003e\n\u003cp\u003e出现以下任一情况时重新评估：\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e模块数量超过 30，或关系超过 60，当前分层图不可读。\u003c/li\u003e\n\u003cli\u003e需要在浏览器里编辑架构或卡片，而不只是阅读。\u003c/li\u003e\n\u003cli\u003e出现多个并发读者/写者，需要真正的服务端状态。\u003c/li\u003e\n\u003c/ol\u003e\n","path":"docs/adr/0003-architecture-first-dashboard.md","excerpt":"看板不再以进度为主叙事；默认 Architecture，Work 降为二级，进度装饰从架构视图移除。"},{"id":"adr-0004","title":"ADR-0004：SessionRuntime 以 Command/Event 为边界","kind":"adr","status":"accepted","order":23,"summary":"抽象会话而不是界面：CLI/TUI 进程内消费 Command/Event，Web 以后只是另一个 client。","body_html":"\u003ch2\u003e状态\u003c/h2\u003e\n\u003cp\u003eAccepted · 2026-10-20\u003c/p\u003e\n\u003ch2\u003e背景\u003c/h2\u003e\n\u003cp\u003e上层会出现 CLI、TUI 和 Web 三种交互界面。直觉做法是定义一个 \u003ccode\u003eFrontend\u003c/code\u003e trait，让 loop 调用 \u003ccode\u003erender()\u003c/code\u003e / \u003ccode\u003eapprove()\u003c/code\u003e；但这样 loop 会知道“展示”，Web 需要桥接，\u003ccode\u003e--json\u003c/code\u003e 和多客户端也会变别扭。\u003c/p\u003e\n\u003cp\u003e三个界面真正共享的是\u003cstrong\u003e命令与事件的语义\u003c/strong\u003e，不是屏幕布局或 widget。\u003c/p\u003e\n\u003ch2\u003e决策\u003c/h2\u003e\n\u003cp\u003e定义 transport-neutral 的 \u003ccode\u003eSessionRuntime\u003c/code\u003e：\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003eClient ──► Runtime\n\n  Submit { text }\n  Approve { call_id, decision }\n  Cancel { turn_id }\n  Resume { session_id }\n  Configure { model, budget, approval }\n\nRuntime ──► Client\n\n  RuntimeEvent =\n    Durable(Event)          // 与 JSONL 日志一致\n  | Delta { kind, text }    // 瞬时，不落盘\n  | ApprovalRequest { ... } // 需要客户端决策\n  | Status { ... }          // 运行状态\n\u003c/code\u003e\u003c/pre\u003e\n\u003cul\u003e\n\u003cli\u003eCLI 和 TUI 现在\u003cstrong\u003e进程内\u003c/strong\u003e消费同一个 runtime。\u003c/li\u003e\n\u003cli\u003eWeb 第一版是只读 Session Viewer，直接读 JSONL；完整客户端以后通过 WebSocket/SSE 接同一个 contract。\u003c/li\u003e\n\u003cli\u003e不做 \u003ccode\u003eFrontend\u003c/code\u003e trait，不共享 widget 层。\u003c/li\u003e\n\u003cli\u003e不在 M0 做 daemon/JSON-RPC；等出现多客户端、远程访问或崩溃隔离需求再拆。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e后果\u003c/h2\u003e\n\u003ch3\u003e正向\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eloop 不依赖展示层；headless \u003ccode\u003e--json\u003c/code\u003e、TUI、Web 共用一套语义。\u003c/li\u003e\n\u003cli\u003eapproval / cancel / usage 是协议的一部分，不会漏在某个 UI 里。\u003c/li\u003e\n\u003cli\u003e未来拆 daemon 只需要给 runtime 包一层 transport，不重写 loop。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e负向\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e需要定义事件的生命周期：哪些是 durable、哪些是瞬时、断线后如何恢复。\u003c/li\u003e\n\u003cli\u003e进程内 runtime 和未来 daemon 之间会有一段适配代码。\u003c/li\u003e\n\u003cli\u003eCommand 的幂等性和重放语义需要明确（尤其 \u003ccode\u003eApprove\u003c/code\u003e 与 \u003ccode\u003eCancel\u003c/code\u003e）。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e备选方案\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e\u003ccode\u003eFrontend\u003c/code\u003e trait\u003c/strong\u003e：简单，但把展示耦合进 loop，Web 和多客户端会变复杂。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e现在做 daemon + JSON-RPC\u003c/strong\u003e：对 Web 最干净，但在 loop 尚未跑通时预付协议、认证、背压和进程生命周期成本。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e每个 UI 各自调用 loop\u003c/strong\u003e：最快，但会出现三套取消、审批和错误处理，最终行为不一致。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eRevisit 条件\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e需要同时连接多个客户端，或从远程/移动端控制同一个 session。\u003c/li\u003e\n\u003cli\u003e需要把 agent 进程与 UI 进程隔离（崩溃恢复、资源限制）。\u003c/li\u003e\n\u003cli\u003eCommand/Event 需要版本化并对外发布。\u003c/li\u003e\n\u003c/ol\u003e\n","path":"docs/adr/0004-session-runtime.md","excerpt":"抽象会话而不是界面：CLI/TUI 进程内消费 Command/Event，Web 以后只是另一个 client。"},{"id":"adr-0005","title":"ADR-0005：凭证解析 env → keyring → 0600 file","kind":"adr","status":"accepted","order":24,"summary":"API key 由独立 ni-auth 解析；keyring 优先，失败回退 0600 文件；不碰网页 cookie。","body_html":"\u003ch2\u003e状态\u003c/h2\u003e\n\u003cp\u003eAccepted · 2026-10-20\u003c/p\u003e\n\u003ch2\u003e背景\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003eni\u003c/code\u003e 已经有 OpenAI-compatible provider，但每次都要在命令行里传 \u003ccode\u003eDEEPSEEK_API_KEY\u003c/code\u003e，体验差且容易把 key 写进 shell history。目标是让 API key 像登录一样只配置一次。\u003c/p\u003e\n\u003cp\u003e同时要避免两个错误方向：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e把 DeepSeek / ChatGPT 的网页 cookie 当作 API；这不稳定、违反服务条款，也会把会话凭证暴露给 harness。\u003c/li\u003e\n\u003cli\u003e把 key 直接写进仓库配置或 session 事件；日志会被分享、提交、回放。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e决策\u003c/h2\u003e\n\u003cp\u003e新增独立 \u003ccode\u003eni-auth\u003c/code\u003e crate，统一解析凭证：\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003e环境变量\n  ↓ 没有\nOS keyring（service = \"ni\", account = provider）\n  ↓ 不可用\n0600 credentials.toml\n\u003c/code\u003e\u003c/pre\u003e\n\u003cul\u003e\n\u003cli\u003e环境变量优先，方便 CI 和临时覆盖。\u003c/li\u003e\n\u003cli\u003ekeyring 可用时写入 OS keychain / Credential Manager / Secret Service。\u003c/li\u003e\n\u003cli\u003ekeyring 不可用时回退文件；Unix 上文件 \u003ccode\u003e0600\u003c/code\u003e，目录新建时 \u003ccode\u003e0700\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eni auth status\u003c/code\u003e 只显示来源，不打印 key；文件权限过宽时提示 \u003ccode\u003einsecure\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eni auth unset\u003c/code\u003e 同时清理 keyring 和文件。\u003c/li\u003e\n\u003cli\u003eProvider 不直接读环境变量；入口（CLI，未来 loop）通过 \u003ccode\u003eni-auth\u003c/code\u003e 拿 key。\u003c/li\u003e\n\u003cli\u003e不支持网页账号 cookie；ChatGPT 账号 OAuth（SIWC）是独立项目，不在本 ADR 范围。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e后果\u003c/h2\u003e\n\u003ch3\u003e正向\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e一次 \u003ccode\u003eni auth set deepseek\u003c/code\u003e 后，\u003ccode\u003eni provider test\u003c/code\u003e 和后续 loop 都不需要重复传 key。\u003c/li\u003e\n\u003cli\u003e密钥不会进入 session JSONL、日志或 \u003ccode\u003eDebug\u003c/code\u003e 输出。\u003c/li\u003e\n\u003cli\u003e无桌面环境仍然可用；keyring 失败不会阻塞。\u003c/li\u003e\n\u003cli\u003eprovider 保持凭证无关，便于未来接入不同 auth 方式。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e负向\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eLinux keyring 依赖 Secret Service / DBus；构建需要 \u003ccode\u003elibdbus-1-dev\u003c/code\u003e，最小容器需要设置 \u003ccode\u003eNI_AUTH_DISABLE_KEYRING=1\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e文件回退仍是明文（0600），无法防御同用户恶意进程。\u003c/li\u003e\n\u003cli\u003e目前没有 zeroize；key 在进程生命周期内存在。\u003c/li\u003e\n\u003cli\u003e每个入口都必须记得使用 \u003ccode\u003eni-auth\u003c/code\u003e，否则会出现第二套读取逻辑。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e备选方案\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e只读环境变量\u003c/strong\u003e：最简单，但每次都要配置，容易进 shell history。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e只写文件\u003c/strong\u003e：跨平台简单，但桌面用户失去 keychain 的保护。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e网页 cookie / 浏览器自动化\u003c/strong\u003e：不做；安全与稳定性都不可接受。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eChatGPT 账号 SIWC\u003c/strong\u003e：官方能力，但需要 OAuth + Responses API 和开源许可，作为后续独立 ADR。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eRevisit 条件\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eChatGPT SIWC 正式接入，需要新的 OAuth 凭证类型。\u003c/li\u003e\n\u003cli\u003e需要多用户/多租户，keyring 的 per-user 模型不够。\u003c/li\u003e\n\u003cli\u003e需要 zeroize 或硬件密钥（YubiKey/Passkey）。\u003c/li\u003e\n\u003c/ol\u003e\n","path":"docs/adr/0005-auth.md","excerpt":"API key 由独立 ni-auth 解析；keyring 优先，失败回退 0600 文件；不碰网页 cookie。"},{"id":"provider","title":"Provider 与 DeepSeek 接入","kind":"doc","status":"living","order":30,"summary":"OpenAI-compatible SSE 的归一化、DeepSeek 参数、错误分类和重试边界。","body_html":"\u003ch2\u003e为什么先做 OpenAI-compatible\u003c/h2\u003e\n\u003cp\u003eDeepSeek 和 OpenAI 都提供 Chat Completions 风格接口：\u003ccode\u003ePOST /chat/completions\u003c/code\u003e，\u003ccode\u003estream: true\u003c/code\u003e 返回 SSE，工具调用使用 \u003ccode\u003etools\u003c/code\u003e / \u003ccode\u003etool_calls\u003c/code\u003e。先把这一种 wire format 做扎实，比同时维护多套协议更有价值。\u003c/p\u003e\n\u003cp\u003eProvider 层只做三件事：发请求、解析 SSE、归一化成 \u003ccode\u003eStreamEvent\u003c/code\u003e。它不知道工具如何执行，也不持有 session。\u003c/p\u003e\n\u003ch2\u003eCLI\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"language-sh\"\u003eni auth set deepseek\nni provider list\n\n# DeepSeek：默认模型 deepseek-flash，默认开启 thinking\nni provider test --preset deepseek\n\n# 指定模型 / 关闭 thinking\nni provider test --preset deepseek --model deepseek-v4-pro --no-thinking\n\n# OpenAI\nni auth set openai\nni provider test --preset openai\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2\u003e环境变量\u003c/h2\u003e\n\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e变量\u003c/th\u003e\u003cth\u003e默认值\u003c/th\u003e\u003cth\u003e说明\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eDEEPSEEK_API_KEY\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e必填或 \u003ccode\u003eni auth\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eDeepSeek API key\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eDEEPSEEK_BASE_URL\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003ehttps://api.deepseek.com\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e不要重复拼 \u003ccode\u003e/chat/completions\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eDEEPSEEK_MODEL\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003edeepseek-flash\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e也可用 \u003ccode\u003edeepseek-v4-pro\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eDEEPSEEK_THINKING\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003eenabled\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003eenabled\u003c/code\u003e / \u003ccode\u003edisabled\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eDEEPSEEK_REASONING_EFFORT\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eAPI 默认（high）\u003c/td\u003e\u003ctd\u003e\u003ccode\u003enone\u003c/code\u003e / \u003ccode\u003elow\u003c/code\u003e / \u003ccode\u003ehigh\u003c/code\u003e / \u003ccode\u003emax\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eOPENAI_API_KEY\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e必填或 \u003ccode\u003eni auth\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eOpenAI key\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eOPENAI_BASE_URL\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003ehttps://api.openai.com/v1\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e兼容网关可覆盖\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eOPENAI_MODEL\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003egpt-4o-mini\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e兼容网关可覆盖\u003c/td\u003e\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e模型名会变化。DeepSeek 当前推荐 \u003ccode\u003edeepseek-flash\u003c/code\u003e 与 \u003ccode\u003edeepseek-v4-pro\u003c/code\u003e，以 \u003ca href=\"https://api-docs.deepseek.com/zh-cn/\"\u003e官方文档\u003c/a\u003e 为准。\u003c/p\u003e\n\u003cp\u003e凭证解析顺序是 env → OS keyring → 0600 文件；详见 \u003ca href=\"auth.md\"\u003e凭证与 ni auth\u003c/a\u003e。\u003c/p\u003e\n\u003ch2\u003e请求\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003estream: true\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003estream_options.include_usage: true\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003eDeepSeek：\u003ccode\u003ethinking: {\"type\": \"enabled\" | \"disabled\"}\u003c/code\u003e，可选 \u003ccode\u003ereasoning_effort\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e工具：\u003ccode\u003etools: [{ \"type\": \"function\", \"function\": { name, description, parameters } }]\u003c/code\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e响应是 SSE：\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003edata: {\"choices\":[{\"delta\":{\"reasoning_content\":\"...\"},\"finish_reason\":null}]}\n\ndata: {\"choices\":[{\"delta\":{\"content\":\"...\"},\"finish_reason\":null}]}\n\ndata: {\"choices\":[{\"delta\":{\"tool_calls\":[...]}}]}\n\ndata: {\"choices\":[{\"delta\":{},\"finish_reason\":\"stop\"}],\"usage\":{...}}\n\ndata: [DONE]\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2\u003e归一化事件\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eTextDelta\u003c/code\u003e：\u003ccode\u003edelta.content\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eReasoningDelta\u003c/code\u003e：\u003ccode\u003edelta.reasoning_content\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eToolCallDelta\u003c/code\u003e：\u003ccode\u003edelta.tool_calls[]\u003c/code\u003e，保留 \u003ccode\u003eindex\u003c/code\u003e、\u003ccode\u003eid\u003c/code\u003e、\u003ccode\u003ename\u003c/code\u003e、\u003ccode\u003earguments\u003c/code\u003e 片段；拼装由 loop 负责\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eUsage\u003c/code\u003e：\u003ccode\u003eprompt_tokens\u003c/code\u003e → input、\u003ccode\u003ecompletion_tokens\u003c/code\u003e → output、\u003ccode\u003eprompt_tokens_details.cached_tokens\u003c/code\u003e → cached、\u003ccode\u003ecompletion_tokens_details.reasoning_tokens\u003c/code\u003e → reasoning\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eDone\u003c/code\u003e：\u003ccode\u003e[DONE]\u003c/code\u003e 或流结束，带最后看到的 \u003ccode\u003efinish_reason\u003c/code\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eSSE 解析器按行缓冲，支持一个事件跨多个网络 chunk、多行 \u003ccode\u003edata:\u003c/code\u003e、注释/keepalive，以及没有 \u003ccode\u003e[DONE]\u003c/code\u003e 的流。\u003c/p\u003e\n\u003ch2\u003eDeepSeek 的思考模式\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e默认开启 thinking；\u003ccode\u003ereasoning_content\u003c/code\u003e 与 \u003ccode\u003econtent\u003c/code\u003e 同级。\u003c/li\u003e\n\u003cli\u003e请求携带 \u003ccode\u003etools\u003c/code\u003e 时，历史 assistant 消息里的 \u003ccode\u003ereasoning_content\u003c/code\u003e \u003cstrong\u003e必须回传\u003c/strong\u003e，否则 API 返回 400。\u003ccode\u003eChatMessage::assistant\u003c/code\u003e 保留该字段。\u003c/li\u003e\n\u003cli\u003e不携带 \u003ccode\u003etools\u003c/code\u003e 时，历史 reasoning 不需要回传。\u003c/li\u003e\n\u003cli\u003ethinking 模式下 \u003ccode\u003etemperature\u003c/code\u003e 等参数可能被忽略；不要依赖它们做确定性控制。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e错误与重试\u003c/h2\u003e\n\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e情况\u003c/th\u003e\u003cth\u003e分类\u003c/th\u003e\u003cth\u003e可重试\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\n\u003ctr\u003e\u003ctd\u003e401 / 403\u003c/td\u003e\u003ctd\u003e\u003ccode\u003eAuth\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e否\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e400 / 422 且提示 context length\u003c/td\u003e\u003ctd\u003e\u003ccode\u003eContextOverflow\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e否，交给 compaction\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e429 / 408 / 425 / 5xx\u003c/td\u003e\u003ctd\u003e\u003ccode\u003eHttp\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e是，读取 \u003ccode\u003eRetry-After\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e402 余额不足\u003c/td\u003e\u003ctd\u003e\u003ccode\u003eHttp\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e否\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e网络连接失败\u003c/td\u003e\u003ctd\u003e\u003ccode\u003eNetwork\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e是\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eSSE JSON 损坏 / 中途断流\u003c/td\u003e\u003ctd\u003e\u003ccode\u003eDecode\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e否（已产生部分输出，不能原地重放）\u003c/td\u003e\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003e重试边界在 turn 开始前\u003c/strong\u003e。一旦工具已经执行或流已经产生输出，不能把整个 turn 重放；应该记录失败并开新 turn。\u003c/p\u003e\n\u003ch2\u003e测试\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"language-sh\"\u003ecargo test -p ni-provider\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e测试不访问网络：一个本地 TCP server 返回 SSE，验证流式解析；另外覆盖 429 \u003ccode\u003eRetry-After\u003c/code\u003e、context overflow 分类、reasoning/tool call 的序列化。\u003c/p\u003e\n\u003ch2\u003e当前限制\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e只支持 Chat Completions；不做 Responses API / Anthropic Messages。\u003c/li\u003e\n\u003cli\u003etool call 参数拼装、执行、审批在 loop/tools，不在 provider。\u003c/li\u003e\n\u003cli\u003e没有读超时和 per-chunk idle timeout；长流依赖取消信号。\u003c/li\u003e\n\u003cli\u003e没有音频/图像输入；v0 只处理文本。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e学习点\u003c/h2\u003e\n\u003cp\u003e写完这一层，应该能回答：SSE 的 \u003ccode\u003edata:\u003c/code\u003e 和空行如何分帧？一个 tool call 的参数为什么要按片段拼接？\u003ccode\u003ereasoning_content\u003c/code\u003e 为什么在带 tools 的历史里不能丢？429 和“流中途失败”为什么不能用同一种重试？\u003c/p\u003e\n","path":"docs/provider.md","excerpt":"OpenAI-compatible SSE 的归一化、DeepSeek 参数、错误分类和重试边界。"},{"id":"auth","title":"凭证与 ni auth","kind":"doc","status":"living","order":31,"summary":"API key 的解析顺序、keyring/0600 文件回退、安全约束，以及为什么不做网页账号 cookie。","body_html":"\u003ch2\u003e命令\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"language-sh\"\u003eni auth set deepseek        # 隐藏输入\nni auth set openai\nprintf '%s\\n' \"$KEY\" | ni auth set deepseek --stdin\n\nni auth status              # 只显示来源，不显示 key\nni auth unset deepseek\n\nni provider test --preset deepseek\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003eni auth set\u003c/code\u003e 会打印 key 的创建页面。key 本身不会回显，也不会写入 session log。\u003c/p\u003e\n\u003ch2\u003e解析顺序\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003eAuthStore::resolve\u003c/code\u003e 固定按以下顺序：\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e环境变量\u003c/strong\u003e：\u003ccode\u003eDEEPSEEK_API_KEY\u003c/code\u003e / \u003ccode\u003eOPENAI_API_KEY\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eOS keyring\u003c/strong\u003e：service \u003ccode\u003eni\u003c/code\u003e，account 是 provider id（\u003ccode\u003edeepseek\u003c/code\u003e / \u003ccode\u003eopenai\u003c/code\u003e）\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e0600 文件\u003c/strong\u003e：\u003ccode\u003e$NI_CONFIG_DIR/credentials.toml\u003c/code\u003e，否则 \u003ccode\u003e$XDG_CONFIG_HOME/ni/credentials.toml\u003c/code\u003e，否则 \u003ccode\u003e~/.config/ni/credentials.toml\u003c/code\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e环境变量永远优先，适合 CI 和临时覆盖。keyring 可用时写入 keyring；keyring 不可用（无桌面、容器、无 Secret Service）时回退文件。\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-sh\"\u003e# 强制文件回退，避免在 headless 环境触发 keyring\nNI_AUTH_DISABLE_KEYRING=1 ni auth set deepseek\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2\u003e文件格式\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"language-toml\"\u003e[providers.deepseek]\napi_key = \"sk-...\"\n\u003c/code\u003e\u003c/pre\u003e\n\u003cul\u003e\n\u003cli\u003e目录不存在时创建为 \u003ccode\u003e0700\u003c/code\u003e；文件写入临时文件后 \u003ccode\u003erename\u003c/code\u003e，权限 \u003ccode\u003e0600\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eni auth status\u003c/code\u003e 在文件权限过宽时显示 \u003ccode\u003einsecure\u003c/code\u003e 并警告。\u003c/li\u003e\n\u003cli\u003e解析失败只返回“credentials file is not valid TOML”，不回显文件内容，避免错误信息泄露 key。\u003c/li\u003e\n\u003cli\u003e不支持把 key 写进仓库配置、session JSONL 或日志。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eLinux 依赖\u003c/h2\u003e\n\u003cp\u003eLinux 的 keyring 走 Secret Service（DBus）。构建需要 \u003ccode\u003elibdbus-1-dev\u003c/code\u003e；运行需要桌面 keyring 服务。两者都没有时，用 \u003ccode\u003eNI_AUTH_DISABLE_KEYRING=1\u003c/code\u003e 或让程序自动回退到文件。\u003c/p\u003e\n\u003cp\u003emacOS / Windows 使用系统 keychain / Credential Manager。\u003c/p\u003e\n\u003ch2\u003e为什么不做网页账号登录\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eDeepSeek 没有面向第三方客户端的公开账号 OAuth；官方接入是 API key。\u003c/li\u003e\n\u003cli\u003eChatGPT 账号登录有官方的 \u003ca href=\"https://developers.openai.com/siwc/quickstart\"\u003eSign in with ChatGPT\u003c/a\u003e，但需要 OAuth + Responses API，且面向本地开源/个人项目；它是独立的 provider/auth 项目，不是“复用网页 cookie”。\u003c/li\u003e\n\u003cli\u003e抓 cookie / 模拟网页请求会带来 ToS、封号、WAF、2FA 和密钥泄露风险，不作为 harness 的能力。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e详见 \u003ca href=\"#/docs/provider\"\u003eProvider 与 DeepSeek 接入\u003c/a\u003e 和 \u003ca href=\"#/docs/roadmap\"\u003eRoadmap\u003c/a\u003e。\u003c/p\u003e\n\u003ch2\u003e安全边界\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eSecretKey\u003c/code\u003e 的 \u003ccode\u003eDebug\u003c/code\u003e 输出是 \u003ccode\u003eSecretKey(***)\u003c/code\u003e；命令行只打印来源。\u003c/li\u003e\n\u003cli\u003e每次 \u003ccode\u003eni auth status\u003c/code\u003e 会查询 keyring；在锁屏/未解锁的桌面上可能触发系统解锁提示。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eni auth unset\u003c/code\u003e 同时删除 keyring 和文件；不会尝试猜测其他存储位置。\u003c/li\u003e\n\u003cli\u003e目前没有做内存 zeroize；key 在进程生命周期内存在。后续如果需要更强保证，再引入 \u003ccode\u003esecrecy\u003c/code\u003e/\u003ccode\u003ezeroize\u003c/code\u003e 并重新评估。\u003c/li\u003e\n\u003c/ul\u003e\n","path":"docs/auth.md","excerpt":"API key 的解析顺序、keyring/0600 文件回退、安全约束，以及为什么不做网页账号 cookie。"},{"id":"exec","title":"ni exec 与最小闭环","kind":"doc","status":"living","order":32,"summary":"headless 任务入口、四个工具、session 事件，以及当前闭环的能力与边界。","body_html":"\u003ch2\u003e用法\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"language-sh\"\u003eni auth set deepseek\nni exec \"find the failing test and fix it\"\n\n# 更便宜/更快的验证\nni exec \"read a.txt and summarize it\" --no-thinking\n\n# 指定工作区和会话目录\nni exec \"fix the build\" \\\n  --cwd /path/to/repo \\\n  --session-dir /tmp/ni-sessions\n\n# 换模型 / 限制轮数\nni exec \"...\" --model deepseek-v4-pro --max-steps 20\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003eni exec\u003c/code\u003e 是 headless 入口：文本流到 stdout，工具调用和 usage 流到 stderr，session 写入 JSONL。\u003c/p\u003e\n\u003cp\u003e凭证通过 \u003ccode\u003eni-auth\u003c/code\u003e 解析：环境变量 → OS keyring → 0600 文件。没有凭证时会提示：\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003eno credential for deepseek; run `ni auth set deepseek` or set DEEPSEEK_API_KEY\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2\u003e闭环结构\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003esession_start\n  → user_message\n  → provider.stream\n  → assistant_message\n  → turn_end\n  → tool_result (0..n)\n  → provider.stream (下一 turn)\n  → ...\n  → session_end\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e一个 turn 的事件顺序固定：assistant 消息先落盘，再落工具执行结果，然后进入下一轮。工具结果不会丢；resume 可以从同一份日志重建。\u003c/p\u003e\n\u003ch2\u003e工具\u003c/h2\u003e\n\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e工具\u003c/th\u003e\u003cth\u003e行为\u003c/th\u003e\u003cth\u003e约束\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eread\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e带行号读取文本\u003c/td\u003e\u003ctd\u003e最多 2000 行 / 50KB；支持 offset/limit\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003ewrite\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e新建或完整覆盖\u003c/td\u003e\u003ctd\u003e已存在的文件必须先 \u003ccode\u003eread\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eedit\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e精确字符串替换\u003c/td\u003e\u003ctd\u003e必须唯一匹配；先 \u003ccode\u003eread\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003ebash\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e在 cwd 执行命令\u003c/td\u003e\u003ctd\u003e默认 120s 超时；合并输出，只回尾部 20KB\u003c/td\u003e\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e文件工具会把路径 canonicalize 到工作区内部；\u003ccode\u003e../\u003c/code\u003e 或绝对路径逃逸会被拒绝。\u003ccode\u003ebash\u003c/code\u003e 是逃生舱，不经过这层路径策略。\u003c/p\u003e\n\u003ch2\u003e安全边界\u003c/h2\u003e\n\u003cp\u003e当前是最小闭环，不是安全沙箱：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ewrite\u003c/code\u003e / \u003ccode\u003eedit\u003c/code\u003e 会修改工作区文件。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ebash\u003c/code\u003e 可以执行任意命令，也可以访问工作区外路径。\u003c/li\u003e\n\u003cli\u003e没有 approval 提示、没有 OS 级 sandbox、没有 network 开关。\u003c/li\u003e\n\u003cli\u003e默认最大 12 个模型 turn；超过会报错并停止。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e因此只在可信仓库、临时工作区或容器里运行。真正的 sandbox / approval 是 M1-002。\u003c/p\u003e\n\u003ch2\u003e当前能力\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e真实 DeepSeek \u003ccode\u003edeepseek-flash\u003c/code\u003e 文本 + read 工具调用已验证。\u003c/li\u003e\n\u003cli\u003e本地 mock SSE server 可以完整跑 text 与 tool 两条路径，不消耗 token。\u003c/li\u003e\n\u003cli\u003e脚本化 provider 的 agent 测试覆盖：无工具完成、工具后继续、max steps。\u003c/li\u003e\n\u003cli\u003e每次 turn 写 \u003ccode\u003eassistant_message\u003c/code\u003e、\u003ccode\u003eturn_end\u003c/code\u003e、\u003ccode\u003etool_result\u003c/code\u003e，usage 含 cached tokens。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e明确还没有\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003egrep\u003c/code\u003e / \u003ccode\u003eglob\u003c/code\u003e（M0-006）。\u003c/li\u003e\n\u003cli\u003ebash 进程组 kill、输出全文指针（M0-007）。\u003c/li\u003e\n\u003cli\u003eresume / replay / compaction（M0-009、M2）。\u003c/li\u003e\n\u003cli\u003e并行工具、审批、sandbox、TUI。\u003c/li\u003e\n\u003cli\u003e上下文预算；长任务可能撞上下文上限。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e调试\u003c/h2\u003e\n\u003cp\u003e不烧 token 的路径：\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-sh\"\u003ecargo test -p ni-agent -p ni-tools -p ni-provider\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e本地 mock server：把 \u003ccode\u003eDEEPSEEK_BASE_URL\u003c/code\u003e 指向本地 SSE 服务，用假的 key 执行 \u003ccode\u003eni exec\u003c/code\u003e。provider 文档里有 SSE 格式和错误分类。\u003c/p\u003e\n","path":"docs/exec.md","excerpt":"headless 任务入口、四个工具、session 事件，以及当前闭环的能力与边界。"},{"id":"readme","title":"看板维护指南","kind":"guide","status":null,"order":90,"summary":"docs/ 的源文件、构建命令、architecture-first 视图与每次迭代的更新仪式。","body_html":"\u003ch2\u003e这是什么\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003edocs/index.html\u003c/code\u003e 是项目唯一的架构阅读面：Architecture / Work / Docs / Decisions 共享一个三栏壳。它由仓库里的源文件生成，离线可开，不依赖服务端。\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-sh\"\u003ecargo xtask dashboard          # 生成 docs/index.html + model.json + receipt.json\ncargo xtask dashboard --check  # CI：生成物过期、引用断开时失败\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e构建是确定性的：相同输入生成相同 HTML。\u003ccode\u003ereceipt.json\u003c/code\u003e 记录构建时间、git revision 和输入清单，但不参与过期判断，也不入库。\u003c/p\u003e\n\u003ch2\u003e四个视图\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eArchitecture（默认）\u003c/strong\u003e：按语义层排列模块，显示依赖关系、模块状态、contract、owned paths 和源码。选中模块会聚焦它的关系，弱化无关节点；不提供 zoom/pan。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eWork\u003c/strong\u003e：卡片和状态列，可按里程碑筛选。它是 agent 的 handoff 面，不是进度仪表盘；不显示完成率、进度条、WIP 数字或卡片计数。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDocs\u003c/strong\u003e：Markdown 文档索引，右栏阅读，支持 \u003ccode\u003e#/docs/adr-0001\u003c/code\u003e 深链。组件与学习路径见 \u003ccode\u003eroadmap.md\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDecisions\u003c/strong\u003e：ADR 卡片 + \u003ccode\u003ekind = \"decision\"\u003c/code\u003e 的决策日志。这里不放“某张卡完成”的流水账。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e进度信息仍然存在于 \u003ccode\u003edocs/board/\u003c/code\u003e 和 git 里；只是不再占据第一屏。\u003c/p\u003e\n\u003ch2\u003e源文件\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003edocs/\n  index.html                  # 生成物，提交，file:// 可开\n  dashboard/\n    project.json              # 项目、里程碑、层、模块、关系、决策事件\n    template.html             # 单文件壳\n    style.css                 # 三栏与四个视图的样式\n    app.js                    # 无框架渲染\n    model.json                # 生成物：解析后的完整模型\n    receipt.json              # 本地审计信息，gitignore，不入库\n  board/\n    M0-001-workspace.md       # 一张卡一个文件\n  adr/\n    0001-rust-core.md\n    0002-event-log.md\n    0003-architecture-first-dashboard.md\n    0004-session-runtime.md\n    0005-auth.md\n  architecture.md\n  auth.md\n  exec.md\n  provider.md\n  roadmap.md\n  README.md\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003e唯一真相\u003c/strong\u003e：\u003ccode\u003eproject.json\u003c/code\u003e + \u003ccode\u003eboard/*.md\u003c/code\u003e + 其余 Markdown。\u003ccode\u003eindex.html\u003c/code\u003e、\u003ccode\u003emodel.json\u003c/code\u003e、\u003ccode\u003ereceipt.json\u003c/code\u003e 永不手改。\u003c/p\u003e\n\u003ch2\u003e卡片格式\u003c/h2\u003e\n\u003cp\u003e卡片 frontmatter 用 TOML，正文是给详情栏读的 Markdown：\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-toml\"\u003e+++\nid = \"M0-005\"\ntitle = \"Provider trait 与流式适配\"\nstatus = \"ready\"          # backlog | ready | doing | review | done | blocked\nmilestone = \"M0\"\nmodule = \"providers\"      # 可省略；必须是 project.json 里的模块 id\nsize = \"L\"                # S | M | L\npriority = \"P0\"           # 可省略；P0 | P1 | P2\nupdated = \"2026-10-20\"\ncompleted = \"2026-10-20\"  # done 必填\ndepends_on = [\"M0-002\"]\ndocs = [\"architecture\"]   # 可选；必须是文档 id\nblocked_reason = \"\"       # blocked 必填\n+++\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e正文建议四段：\u003ccode\u003e## 范围\u003c/code\u003e、\u003ccode\u003e## 验收\u003c/code\u003e、\u003ccode\u003e## 记录\u003c/code\u003e，需要时加 \u003ccode\u003e## 开放问题\u003c/code\u003e。验收写成可执行的检查，不写“体验良好”。\u003c/p\u003e\n\u003ch2\u003e文档格式\u003c/h2\u003e\n\u003cp\u003e所有 \u003ccode\u003edocs/**/*.md\u003c/code\u003e（\u003ccode\u003eboard/\u003c/code\u003e 和 \u003ccode\u003edashboard/\u003c/code\u003e 除外）必须有 frontmatter：\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-toml\"\u003e+++\nid = \"adr-0003\"\ntitle = \"ADR-0003：...\"\nkind = \"adr\"              # adr | doc | guide\nstatus = \"accepted\"       # ADR 必填：proposed | accepted | superseded | rejected | draft\norder = 30\nsummary = \"一句话，显示在文档卡片上。\"\n+++\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e文档 id 用于深链：\u003ccode\u003e#/docs/adr-0001\u003c/code\u003e。卡片里的 \u003ccode\u003edocs\u003c/code\u003e 引用按 id 校验。\u003c/p\u003e\n\u003ch2\u003e架构模型\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003eproject.json\u003c/code\u003e 里手工维护，不从文件名推断：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003emilestones\u003c/code\u003e：M0–M3，状态 \u003ccode\u003eplanned | active | done\u003c/code\u003e，同一时间最多一个 active。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003elayers\u003c/code\u003e：语义分层，不是目录树。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003emodules\u003c/code\u003e：职责、公开契约、拥有的路径、备注。\u003ccode\u003eactive\u003c/code\u003e / \u003ccode\u003edone\u003c/code\u003e 至少有一个路径真实存在。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003erelations\u003c/code\u003e：\u003ccode\u003efrom\u003c/code\u003e / \u003ccode\u003eto\u003c/code\u003e / \u003ccode\u003elabel\u003c/code\u003e，两端必须是模块 id。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eevents\u003c/code\u003e：决策与里程碑事件；\u003ccode\u003erefs\u003c/code\u003e 可以指向卡片或文档 id。只有 \u003ccode\u003ekind = \"decision\"\u003c/code\u003e 会进入 Decisions 视图。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e更新仪式\u003c/h2\u003e\n\u003cp\u003e每次任务结束，按顺序做：\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e更新对应卡片的 \u003ccode\u003estatus\u003c/code\u003e、\u003ccode\u003eupdated\u003c/code\u003e、必要的 \u003ccode\u003ecompleted\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e有架构决策就加一篇 ADR，并在 \u003ccode\u003eproject.json\u003c/code\u003e 的 \u003ccode\u003eevents\u003c/code\u003e 里加一条 \u003ccode\u003edecision\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e如果模块边界、契约或路径变了，更新 \u003ccode\u003eproject.json\u003c/code\u003e 的 modules / relations。\u003c/li\u003e\n\u003cli\u003e跑 \u003ccode\u003ecargo fmt --all \u0026amp;\u0026amp; cargo test --workspace\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e跑 \u003ccode\u003ecargo xtask dashboard\u003c/code\u003e，把 \u003ccode\u003edocs/index.html\u003c/code\u003e 一起提交。\u003c/li\u003e\n\u003cli\u003e在 \u003ccode\u003eAGENTS.md\u003c/code\u003e 的 definition of done 里确认这一步没有被跳过。\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e状态必须反映现实：没有 \u003ccode\u003edoing\u003c/code\u003e 的卡就不要写 \u003ccode\u003edoing\u003c/code\u003e；\u003ccode\u003edone\u003c/code\u003e 必须有完成日期和可验证的验收项。\u003c/p\u003e\n\u003ch2\u003e校验规则\u003c/h2\u003e\n\u003cp\u003e构建时会失败的情况：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eschema version 不是 1；id 重复；里程碑 / 模块 / 文档引用不存在。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003edone\u003c/code\u003e 没有 \u003ccode\u003ecompleted\u003c/code\u003e；\u003ccode\u003eblocked\u003c/code\u003e 没有 \u003ccode\u003eblocked_reason\u003c/code\u003e；日期格式错误。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eactive\u003c/code\u003e / \u003ccode\u003edone\u003c/code\u003e 模块的路径一个都不存在。\u003c/li\u003e\n\u003cli\u003eADR 的 status 不在允许集合。\u003c/li\u003e\n\u003cli\u003e关系端点不是模块。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e--check\u003c/code\u003e 时生成物与源不一致。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e视觉约定\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e暖纸色底、墨色文字、一个深绿强调色；状态色只用于状态。\u003c/li\u003e\n\u003cli\u003e层色只用于模块导航、模块卡顶部细线和图例，不铺满背景。\u003c/li\u003e\n\u003cli\u003e架构图是主角；文档区控制阅读宽度，不做满屏卡片墙。\u003c/li\u003e\n\u003cli\u003e数字、ID、路径用等宽字体；正文用系统无衬线。\u003c/li\u003e\n\u003cli\u003e不引 CDN、不引外部字体，保证 \u003ccode\u003efile://\u003c/code\u003e 和离线环境一致。\u003c/li\u003e\n\u003cli\u003e动效只用于聚焦和状态切换，不做装饰性动画。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e不要擅自加的东西\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e前端框架、Vite/Node 构建链：会破坏单文件和确定性构建。需要时先写 ADR。\u003c/li\u003e\n\u003cli\u003e图表库、zoom/pan、拖拽编辑：模块少于 30 个时属于过度设计。\u003c/li\u003e\n\u003cli\u003e进度仪表盘、完成率、WIP 数字：进度属于 Work / git，不属于 Architecture 第一屏。\u003c/li\u003e\n\u003c/ul\u003e\n","path":"docs/README.md","excerpt":"docs/ 的源文件、构建命令、architecture-first 视图与每次迭代的更新仪式。"}],"events":[{"date":"2026-10-20","kind":"decision","title":"选择 Rust 作为核心语言","detail":"性能优先，且需要单二进制、低内存和原生沙箱。开发迭代的编译成本用 workspace 拆分和 fixture 测试抵消。","refs":["adr-0001"]},{"date":"2026-10-20","kind":"decision","title":"事件日志作为唯一真相","detail":"内存状态只是日志的 fold；resume、fork、replay 都从日志派生，压缩只改变投影。","refs":["adr-0002"]},{"date":"2026-10-20","kind":"milestone","title":"M0 开工：workspace、看板与会话日志","detail":"落地 cargo workspace、离线看板 v0、SessionLog 与 CLI 骨架。","refs":["M0-001","M0-002","M0-003","M0-004"]},{"date":"2026-10-20","kind":"decision","title":"Dashboard 以架构为第一屏","detail":"默认 Architecture，Work 降为二级；进度装饰移除，Decisions 只收决策。ADR-0003。","refs":["adr-0003"]},{"date":"2026-10-20","kind":"decision","title":"Interface 抽象会话，不抽象界面","detail":"SessionRuntime 以 Command/Event 为边界；CLI/TUI 进程内消费，Web 先做只读 viewer。ADR-0004。","refs":["adr-0004"]},{"date":"2026-10-20","kind":"decision","title":"Provider 先做 OpenAI-compatible Chat Completions","detail":"DeepSeek 与 OpenAI 共用一套 SSE 适配；先不引入多 provider 抽象，验证 loop 后再扩展。","refs":["M0-005","provider"]},{"date":"2026-10-20","kind":"decision","title":"凭证解析：env → keyring → 0600 file","detail":"不打印密钥；keyring 不可用时回退文件；不支持网页账号 cookie。","refs":["M0-011","auth","adr-0005"]},{"date":"2026-10-20","kind":"milestone","title":"最小 ni exec 闭环打通","detail":"真实 DeepSeek 文本与 read tool call 验证通过；本地 mock 覆盖 text/tool 两条路径。","refs":["M0-012","exec"]}],"meta":{"schema_version":1,"cards":19,"modules":10,"docs":11,"generator":"cargo xtask dashboard"}}</script>
<script>
(() => {
  'use strict';

  const DATA = JSON.parse(document.getElementById('ni-data').textContent);

  const VIEWS = ['arch', 'work', 'docs', 'decisions'];
  const VIEW_ALIASES = { board: 'work', timeline: 'decisions' };
  const STATUS_COLUMNS = ['backlog', 'ready', 'doing', 'review', 'done'];
  const STATUS_LABEL = {
    backlog: 'Backlog',
    ready: 'Ready',
    doing: 'Doing',
    review: 'Review',
    done: 'Done',
    blocked: 'Blocked',
    planned: 'Planned',
    active: 'Active',
  };
  const STATUS_COLORS = {
    backlog: '#8c8478',
    ready: '#3f6f9f',
    doing: '#b7791f',
    review: '#6f5aa8',
    done: '#3f7d4f',
    blocked: '#b42318',
  };
  const LAYER_COLORS = {
    interface: '#4c7bd9',
    engine: '#b57436',
    adapters: '#8768bf',
    state: '#5c8f4a',
    engineering: '#8a8175',
  };
  const KIND_LABEL = { adr: 'ADR', doc: 'Doc', guide: 'Guide' };

  const canvas = document.getElementById('canvas');
  const details = document.getElementById('details');
  const search = document.getElementById('search');
  const themeButton = document.getElementById('theme-toggle');

  const cardById = new Map(DATA.cards.map((card) => [card.id, card]));
  const moduleById = new Map(DATA.modules.map((module) => [module.id, module]));
  const docById = new Map(DATA.docs.map((doc) => [doc.id, doc]));
  const milestoneById = new Map(DATA.milestones.map((milestone) => [milestone.id, milestone]));
  const layerById = new Map(DATA.layers.map((layer) => [layer.id, layer]));

  const state = {
    view: 'arch',
    milestone: currentMilestoneId(),
    selection: null,
    query: '',
    sourceIndex: 0,
  };

  let edgeFrame = 0;

  function currentMilestoneId() {
    const active = DATA.milestones.find((milestone) => milestone.status === 'active');
    return active ? active.id : 'all';
  }

  function normalizeView(view) {
    return VIEW_ALIASES[view] || view;
  }

  function esc(value) {
    return String(value ?? '').replace(/[&<>"']/g, (character) => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;',
    }[character]));
  }

  function fmtDate(value) {
    return value ? value.slice(5) : '—';
  }

  function docKind(kind) {
    return KIND_LABEL[kind] || String(kind || 'doc').toUpperCase();
  }

  function layerColor(id) {
    return LAYER_COLORS[id] || '#8a8175';
  }

  function layerName(id) {
    const layer = layerById.get(id);
    return layer ? layer.name : id;
  }

  function moduleTitle(id) {
    const module = moduleById.get(id);
    return module ? module.title : id;
  }

  function isCardSelected(id) {
    return state.selection?.type === 'card' && state.selection.id === id;
  }

  function isModuleSelected(id) {
    return state.selection?.type === 'module' && state.selection.id === id;
  }

  function isDocSelected(id) {
    return state.selection?.type === 'doc' && state.selection.id === id;
  }

  function statusBadge(status) {
    const label = STATUS_LABEL[status] || status;
    return `<span class="badge badge-${esc(status)}"><span class="dot"></span>${esc(label)}</span>`;
  }

  function currentFocus() {
    const milestone = DATA.milestones.find((item) => item.status === 'active');
    if (!milestone) return null;
    const cards = DATA.cards.filter((card) => card.milestone === milestone.id && card.status !== 'done');
    const card = cards.find((item) => item.status === 'doing')
      || cards.find((item) => item.status === 'ready')
      || cards.find((item) => item.status === 'review')
      || cards.find((item) => item.status === 'backlog');
    return { milestone, card };
  }

  function relatedModules(id) {
    const related = new Set();
    DATA.relations.forEach((relation) => {
      if (relation.from === id) related.add(relation.to);
      if (relation.to === id) related.add(relation.from);
    });
    return related;
  }

  function cardMatches(card, query) {
    if (!query) return true;
    return [card.id, card.title, card.module, card.status, card.priority]
      .filter(Boolean)
      .join(' ')
      .toLowerCase()
      .includes(query);
  }

  function moduleMatches(module, query) {
    if (!query) return true;
    return [module.id, module.title, module.summary, module.layer, module.status]
      .filter(Boolean)
      .join(' ')
      .toLowerCase()
      .includes(query);
  }

  function docMatches(doc, query) {
    if (!query) return true;
    return [doc.id, doc.title, doc.kind, doc.status, doc.summary, doc.excerpt, doc.path]
      .filter(Boolean)
      .join(' ')
      .toLowerCase()
      .includes(query);
  }

  function eventMatches(event, query) {
    if (!query) return true;
    return [event.date, event.kind, event.title, event.detail, ...(event.refs || [])]
      .filter(Boolean)
      .join(' ')
      .toLowerCase()
      .includes(query);
  }

  function viewHead(kicker, title, subtitle, stats) {
    return `<div class="view-head">
      <div>
        <div class="kicker">${esc(kicker)}</div>
        <h1 class="view-title">${esc(title)}</h1>
        ${subtitle ? `<p class="view-sub">${esc(subtitle)}</p>` : ''}
      </div>
      ${stats ? `<div class="stats">${stats}</div>` : ''}
    </div>`;
  }

  function compareCards(a, b) {
    const priority = { P0: 0, P1: 1, P2: 2 };
    const pa = priority[a.priority] ?? 9;
    const pb = priority[b.priority] ?? 9;
    return pa - pb || a.id.localeCompare(b.id);
  }

  function renderTabs() {
    document.querySelectorAll('.tab').forEach((tab) => {
      const active = tab.dataset.view === state.view;
      tab.classList.toggle('active', active);
      if (active) tab.setAttribute('aria-current', 'page');
      else tab.removeAttribute('aria-current');
    });
  }

  function renderChrome() {
    document.getElementById('project-status').textContent = DATA.project.status;
    document.getElementById('module-count').textContent = DATA.modules.length;
    document.getElementById('doc-count').textContent = DATA.docs.length;

    const focus = currentFocus();
    let foot = '';
    if (focus?.card) {
      foot += `<div class="focus-block"><div class="focus-kicker">Current focus · ${esc(focus.milestone.id)}</div><button class="focus-card" type="button" data-card="${esc(focus.card.id)}"><span class="focus-id">${esc(focus.card.id)}</span><span class="focus-title">${esc(focus.card.title)}</span></button></div>`;
    } else if (focus) {
      foot += `<div class="focus-block"><div class="focus-kicker">Current focus · ${esc(focus.milestone.id)}</div><div class="focus-empty">${esc(focus.milestone.goal)}</div></div>`;
    }
    foot += `<div class="rail-meta"><span>${DATA.modules.length} modules · ${DATA.relations.length} relations</span><span>offline · schema v${DATA.meta.schema_version}</span></div>`;
    document.getElementById('rail-foot').innerHTML = foot;

    const placeholders = {
      arch: 'Filter modules',
      work: 'Filter cards',
      docs: 'Filter documents',
      decisions: 'Filter decisions',
    };
    search.placeholder = placeholders[state.view] || 'Filter';
  }

  function renderRail() {
    document.getElementById('map-nav').innerHTML = renderMapNav();
    document.getElementById('rail-docs').innerHTML = renderRailDocs();
  }

  function renderMapNav() {
    return DATA.layers.map((layer) => {
      const modules = DATA.modules.filter((module) => module.layer === layer.id);
      const rows = modules.map((module) => {
        const active = isModuleSelected(module.id);
        return `<button class="map-module${active ? ' active' : ''}" type="button" data-module="${esc(module.id)}" title="${esc(module.summary)}">
          <span class="map-dot ${esc(module.status)}"></span>
          <span class="map-title">${esc(module.title)}</span>
        </button>`;
      }).join('');
      return `<div class="map-layer">
        <div class="map-layer-head"><span class="map-layer-dot" style="--c:${layerColor(layer.id)}"></span><span>${esc(layer.name)}</span><span class="map-layer-n">${modules.length}</span></div>
        ${rows}
      </div>`;
    }).join('');
  }

  function renderRailDocs() {
    return DATA.docs.map((doc) => `<button class="rail-doc${isDocSelected(doc.id) ? ' active' : ''}" type="button" data-doc="${esc(doc.id)}" title="${esc(doc.title)}">
      <span class="rd-kind">${esc(docKind(doc.kind))}</span><span class="rd-title">${esc(doc.title)}</span>
    </button>`).join('');
  }

  function render() {
    document.body.dataset.view = state.view;
    renderTabs();
    renderChrome();
    renderRail();
    renderCanvas();
    renderDetails();
  }

  function renderCanvas() {
    const previousView = canvas.dataset.view || '';
    const previousScroll = canvas.scrollTop;
    let html = '';

    if (state.view === 'arch') html = archView();
    else if (state.view === 'work') html = workView();
    else if (state.view === 'docs') html = docsView();
    else html = decisionsView();

    canvas.innerHTML = html;
    canvas.dataset.view = state.view;
    canvas.scrollTop = previousView === state.view ? previousScroll : 0;

    if (state.view === 'arch') scheduleEdges();
  }

  function archView() {
    const query = state.query.toLowerCase();
    const selected = state.selection?.type === 'module' ? moduleById.get(state.selection.id) : null;
    const related = selected ? relatedModules(selected.id) : new Set();
    const stats = `<span><strong>${DATA.modules.length}</strong> modules</span><span class="sep">·</span><span>${DATA.layers.length} layers</span><span class="sep">·</span><span>${DATA.relations.length} relations</span>`;

    let html = viewHead(
      'Architecture',
      'How ni is shaped',
      '语义分层，不是目录树。选中模块聚焦它的依赖；状态只表示落地程度。',
      stats,
    );

    if (selected) {
      html += `<div class="focus-bar"><span class="focus-label">Focus</span><button class="focus-chip" type="button" data-close>${esc(selected.title)}<span aria-hidden="true">×</span></button></div>`;
    }

    html += `<div class="arch-canvas${selected ? ' has-focus' : ''}" id="arch-canvas"><svg class="edges" id="arch-edges" aria-hidden="true"></svg>`;

    DATA.layers.forEach((layer, index) => {
      const modules = DATA.modules.filter((module) => module.layer === layer.id);
      html += `<section class="arch-layer">
        <div class="layer-label"><div class="layer-index">${String(index + 1).padStart(2, '0')}</div><h2>${esc(layer.name)}</h2><p>${esc(layer.note)}</p></div>
        <div class="layer-cards">${modules.map((module) => moduleCard(module, query, selected?.id, related)).join('') || '<div class="empty">No modules yet.</div>'}</div>
      </section>`;
    });

    html += `</div>`;

    if (!DATA.modules.some((module) => moduleMatches(module, query))) {
      html += `<div class="empty" style="margin-top:12px">No modules match this filter.</div>`;
    }

    return html;
  }

  function moduleCard(module, query, selectedId, related) {
    const selected = module.id === selectedId;
    const isRelated = related.has(module.id);
    const muted = selectedId && !selected && !isRelated;
    const dim = query && !moduleMatches(module, query);
    const classes = [
      'module-card',
      module.status === 'planned' ? 'planned' : '',
      selected ? 'selected' : '',
      isRelated ? 'related' : '',
      muted ? 'muted' : '',
      dim ? 'dim' : '',
    ].filter(Boolean).join(' ');

    return `<button class="${classes}" type="button" data-module="${esc(module.id)}" style="--module-color:${layerColor(module.layer)}" aria-pressed="${selected}">
      <span class="module-head"><span>${esc(module.id)}</span><span class="module-status">${esc(STATUS_LABEL[module.status] || module.status)}</span></span>
      <span class="module-title">${esc(module.title)}</span>
      <span class="module-summary">${esc(module.summary)}</span>
      <span class="module-path">${esc(module.paths?.[0] || '—')}</span>
    </button>`;
  }

  function workView() {
    const query = state.query.toLowerCase();
    const cards = DATA.cards.filter((card) => {
      const inMilestone = state.milestone === 'all' || card.milestone === state.milestone;
      return inMilestone && cardMatches(card, query);
    });
    const blocked = cards.filter((card) => card.status === 'blocked');

    let html = viewHead(
      'Work',
      'Handoff, not a dashboard',
      '卡片是 agent 的交接面。进度在这里和 git 里，不在 Architecture 第一屏。',
    );

    html += `<div class="filters">${milestoneFilter()}</div>`;

    if (blocked.length) {
      html += `<div class="blocked-strip"><div class="blocked-label">Blocked</div><div class="blocked-cards">${blocked.map(cardHtml).join('')}</div></div>`;
    }

    html += `<div class="board">${STATUS_COLUMNS.map((status) => boardColumn(status, cards)).join('')}</div>`;

    if (!cards.length) {
      html += `<div class="empty" style="margin-top:12px">No cards match this filter.</div>`;
    }

    return html;
  }

  function milestoneFilter() {
    const items = [
      ...DATA.milestones.map((milestone) => ({ id: milestone.id, label: milestone.id, title: milestone.title })),
      { id: 'all', label: 'All', title: 'Every milestone' },
    ];
    return items.map((item) => `<button class="filter${state.milestone === item.id ? ' active' : ''}" type="button" data-milestone="${esc(item.id)}" title="${esc(item.title)}" aria-pressed="${state.milestone === item.id}">${esc(item.label)}</button>`).join('');
  }

  function boardColumn(status, cards) {
    const items = cards.filter((card) => card.status === status).sort(compareCards);
    return `<section class="column${items.length ? '' : ' empty'}">
      <div class="column-head"><span class="col-dot" style="--c:${STATUS_COLORS[status]}"></span>${esc(STATUS_LABEL[status])}</div>
      <div class="cards">${items.map(cardHtml).join('')}</div>
    </section>`;
  }

  function cardHtml(card) {
    const module = card.module ? moduleById.get(card.module) : null;
    const selected = isCardSelected(card.id);
    return `<button class="card${card.status === 'done' ? ' done' : ''}${card.status === 'blocked' ? ' blocked' : ''}${selected ? ' selected' : ''}" type="button" data-card="${esc(card.id)}" aria-pressed="${selected}">
      <span class="card-top"><span>${esc(card.id)}</span><span class="size">${esc(card.size)}</span></span>
      <span class="card-title">${esc(card.title)}</span>
      <span class="card-foot"><span>${module ? esc(module.title) : '—'}</span><span>${esc(fmtDate(card.updated))}</span></span>
    </button>`;
  }

  function docsView() {
    const query = state.query.toLowerCase();
    const docs = DATA.docs.filter((doc) => docMatches(doc, query));
    const adrCount = DATA.docs.filter((doc) => doc.kind === 'adr').length;
    const stats = `<span><strong>${DATA.docs.length}</strong> documents</span><span class="sep">·</span><span>${adrCount} ADRs</span>`;

    return viewHead(
      'Docs',
      'Source material',
      'ADR、架构说明和维护指南。点开在右栏阅读；深链可以直接分享。',
      stats,
    ) + `<div class="doc-grid">${docs.map(docCard).join('')}${docs.length ? '' : '<div class="empty">No documents match this filter.</div>'}</div>`;
  }

  function docCard(doc) {
    const selected = isDocSelected(doc.id);
    return `<button class="doc-card${selected ? ' selected' : ''}" type="button" data-doc="${esc(doc.id)}" aria-pressed="${selected}">
      <span class="doc-top"><span class="doc-kind">${esc(docKind(doc.kind))}</span>${doc.status ? `<span class="doc-status">${esc(doc.status)}</span>` : ''}</span>
      <span class="doc-title">${esc(doc.title)}</span>
      <span class="doc-excerpt">${esc(doc.excerpt)}</span>
      <span class="doc-path">${esc(doc.path)}</span>
    </button>`;
  }

  function decisionsView() {
    const query = state.query.toLowerCase();
    const adrs = DATA.docs.filter((doc) => doc.kind === 'adr' && docMatches(doc, query));
    const decisions = DATA.events
      .filter((event) => event.kind === 'decision' && eventMatches(event, query))
      .slice()
      .sort((a, b) => b.date.localeCompare(a.date));
    const stats = `<span><strong>${DATA.docs.filter((doc) => doc.kind === 'adr').length}</strong> ADRs</span><span class="sep">·</span><span>${DATA.events.filter((event) => event.kind === 'decision').length} decisions</span>`;

    let html = viewHead(
      'Decisions',
      'Why ni is shaped this way',
      'ADR 与关键决策。进度事件不进入这里。',
      stats,
    );

    html += `<h2 class="section-title">Architecture decision records</h2>`;
    html += `<div class="doc-grid">${adrs.map(docCard).join('')}${adrs.length ? '' : '<div class="empty">No ADRs match this filter.</div>'}</div>`;
    html += `<h2 class="section-title">Decision log</h2>`;
    html += `<div class="timeline">${decisions.map(decisionItem).join('')}${decisions.length ? '' : '<div class="empty">No decisions match this filter.</div>'}</div>`;

    return html;
  }

  function decisionItem(event) {
    const refs = (event.refs || []).map((ref) => {
      if (cardById.has(ref)) return `<button class="ref-chip" type="button" data-card="${esc(ref)}">${esc(ref)}</button>`;
      if (docById.has(ref)) return `<button class="ref-chip" type="button" data-doc="${esc(ref)}">${esc(ref)}</button>`;
      return `<span class="ref-chip">${esc(ref)}</span>`;
    }).join('');

    return `<article class="tl-item">
      <div><span class="tl-date">${esc(event.date)}</span><span class="tl-kind">${esc(event.kind)}</span></div>
      <h3 class="tl-title">${esc(event.title)}</h3>
      ${event.detail ? `<p class="tl-detail">${esc(event.detail)}</p>` : ''}
      ${refs ? `<div class="tl-refs">${refs}</div>` : ''}
    </article>`;
  }

  function detailsHead(kicker, closable = true) {
    return `<div class="details-head"><span class="kicker">${esc(kicker)}</span>${closable ? '<button class="close" type="button" data-close aria-label="Close details">×</button>' : ''}</div>`;
  }

  function metaItem(key, value) {
    return `<div class="meta-item"><div class="meta-k">${esc(key)}</div><div class="meta-v">${value}</div></div>`;
  }

  function renderDetails() {
    const key = state.selection ? `${state.selection.type}:${state.selection.id}` : 'overview';
    const changed = details.dataset.key !== key;
    let html = '';

    if (!state.selection) {
      html = overviewDetails();
    } else if (state.selection.type === 'card') {
      const card = cardById.get(state.selection.id);
      html = card ? cardDetails(card) : overviewDetails();
    } else if (state.selection.type === 'module') {
      const module = moduleById.get(state.selection.id);
      html = module ? moduleDetails(module) : overviewDetails();
    } else {
      const doc = docById.get(state.selection.id);
      html = doc ? docDetails(doc) : overviewDetails();
    }

    details.innerHTML = html;
    details.dataset.key = key;
    if (changed) details.scrollTop = 0;

    details.querySelectorAll('a[href^="http"]').forEach((link) => {
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
    });
  }

  function overviewDetails() {
    const focus = currentFocus();

    let html = detailsHead(`Project · ${DATA.project.name}`, false);
    html += `<h1 class="details-title">${esc(DATA.project.title)}</h1>`;
    html += `<p class="view-sub" style="font-size:12px">${esc(DATA.project.summary)}</p>`;
    html += `<div class="overview-stats">
      <div class="overview-stat"><strong>${DATA.modules.length}</strong><span>modules</span></div>
      <div class="overview-stat"><strong>${DATA.layers.length}</strong><span>layers</span></div>
      <div class="overview-stat"><strong>${DATA.relations.length}</strong><span>relations</span></div>
      <div class="overview-stat"><strong>${DATA.docs.length}</strong><span>docs</span></div>
    </div>`;

    html += `<div class="detail-section"><h2>How to read</h2><ul class="notes">
      <li>Architecture：先看层和依赖，再点模块看契约与源码。</li>
      <li>Work：需要接手任务时再看卡片；进度不在第一屏。</li>
      <li>Docs / Decisions：为什么这样切，以及被否决的方案。</li>
    </ul></div>`;

    if (focus?.card) {
      html += `<div class="detail-section"><h2>Current focus</h2><div class="path-list"><button class="path-chip" type="button" data-card="${esc(focus.card.id)}">${esc(focus.card.id)} · ${esc(focus.card.title)}</button></div></div>`;
    }

    html += `<div class="detail-section"><h2>Read next</h2><div class="path-list">
      <button class="path-chip" type="button" data-view="arch">Architecture map</button>
      <button class="path-chip" type="button" data-doc="architecture">Architecture doc</button>
      <button class="path-chip" type="button" data-doc="adr-0001">ADR-0001 · Rust</button>
      <button class="path-chip" type="button" data-doc="adr-0003">ADR-0003 · architecture-first</button>
    </div></div>`;

    return html;
  }

  function cardDetails(card) {
    const module = card.module ? moduleById.get(card.module) : null;
    const milestone = milestoneById.get(card.milestone);
    const docs = (card.docs || []).map((id) => docById.get(id)).filter(Boolean);

    let html = detailsHead(`Work · ${card.id}`);
    html += `<h1 class="details-title">${esc(card.title)}</h1>`;
    html += `<div class="badges">${statusBadge(card.status)}${card.priority ? `<span class="badge">${esc(card.priority)}</span>` : ''}<span class="badge">${esc(card.size)}</span></div>`;

    if (card.status === 'blocked' && card.blocked_reason) {
      html += `<div class="callout">Blocked · ${esc(card.blocked_reason)}</div>`;
    }

    html += `<div class="meta-grid">
      ${metaItem('Milestone', milestone ? `${esc(milestone.id)} · ${esc(milestone.title)}` : esc(card.milestone))}
      ${metaItem('Module', module ? `<button class="inline-link" type="button" data-module="${esc(module.id)}">${esc(module.title)}</button>` : '—')}
      ${metaItem('Updated', `<span class="mono">${esc(card.updated)}</span>`)}
      ${metaItem('Completed', card.completed ? `<span class="mono">${esc(card.completed)}</span>` : '—')}
    </div>`;

    if (card.depends_on?.length) {
      html += `<div class="detail-section"><h2>Depends on</h2><div class="path-list">${card.depends_on.map((id) => `<button class="path-chip" type="button" data-card="${esc(id)}">${esc(id)} · ${esc(cardById.get(id)?.title || '')}</button>`).join('')}</div></div>`;
    }

    html += `<div class="md">${card.body_html}</div>`;

    if (docs.length) {
      html += `<div class="detail-section"><h2>Documents</h2><div class="path-list">${docs.map((doc) => `<button class="path-chip" type="button" data-doc="${esc(doc.id)}">${esc(doc.title)}</button>`).join('')}</div></div>`;
    }

    html += `<p class="hint">${esc(card.path)}</p>`;
    return html;
  }

  function moduleDetails(module) {
    let html = detailsHead(`Module · ${module.id}`);
    html += `<h1 class="details-title">${esc(module.title)}</h1>`;
    html += `<div class="badges">${statusBadge(module.status)}<span class="badge">${esc(layerName(module.layer))}</span></div>`;
    html += `<p class="view-sub" style="font-size:12px">${esc(module.summary)}</p>`;

    if (module.contract) {
      html += `<div class="detail-section"><h2>Contract</h2><p>${esc(module.contract)}</p></div>`;
    }

    if (module.notes?.length) {
      html += `<div class="detail-section"><h2>Notes</h2><ul class="notes">${module.notes.map((note) => `<li>${esc(note)}</li>`).join('')}</ul></div>`;
    }

    const incoming = DATA.relations.filter((relation) => relation.to === module.id);
    const outgoing = DATA.relations.filter((relation) => relation.from === module.id);
    if (incoming.length || outgoing.length) {
      const rows = [
        ...incoming.map((relation) => relationRow(relation, 'in')),
        ...outgoing.map((relation) => relationRow(relation, 'out')),
      ].join('');
      html += `<div class="detail-section"><h2>Relations</h2><div class="relation-list">${rows}</div></div>`;
    }

    if (module.paths?.length) {
      html += `<div class="detail-section"><h2>Owned paths</h2><div class="path-list">${module.paths.map((path) => `<span class="path-chip">${esc(path)}</span>`).join('')}</div></div>`;
    }

    html += `<div class="detail-section"><h2>Source</h2>${sourceView(module)}</div>`;
    return html;
  }

  function relationRow(relation, direction) {
    const other = direction === 'out' ? relation.to : relation.from;
    return `<div class="relation"><span class="arrow">${direction === 'out' ? '→' : '←'}</span><button type="button" data-module="${esc(other)}">${esc(moduleTitle(other))}</button><span>${esc(relation.label || '')}</span></div>`;
  }

  function sourceView(module) {
    if (!module.sources?.length) {
      return '<div class="empty">Planned module — no source yet. The contract above is the source of truth.</div>';
    }

    const index = Math.min(state.sourceIndex, module.sources.length - 1);
    const source = module.sources[index];
    const tabs = module.sources.map((item, itemIndex) => `<button class="source-tab${itemIndex === index ? ' active' : ''}" type="button" data-source="${itemIndex}" title="${esc(item.path)}">${esc(item.path.split('/').pop())}</button>`).join('');
    return `<div class="source-tabs">${tabs}</div>${sourceBox(source)}`;
  }

  function sourceBox(source) {
    const lines = source.text.replace(/\n$/, '').split('\n');
    const body = lines.map((line, index) => `<span class="source-line"><span class="ln">${index + 1}</span><span class="lc">${esc(line) || ' '}</span></span>`).join('');
    return `<div class="source-box" role="region" aria-label="${esc(source.path)}">${body}</div>${source.truncated ? '<p class="hint">Truncated. Open the file in the repository for the full source.</p>' : ''}`;
  }

  function docDetails(doc) {
    let html = detailsHead(`${docKind(doc.kind)} · ${doc.id}`);
    html += `<h1 class="details-title">${esc(doc.title)}</h1>`;
    html += `<div class="badges">${doc.status ? `<span class="badge">${esc(doc.status)}</span>` : ''}<span class="badge">${esc(docKind(doc.kind))}</span></div>`;
    html += `<div class="md">${doc.body_html}</div>`;
    html += `<p class="hint">${esc(doc.path)}</p>`;
    return html;
  }

  function openCard(id) {
    const card = cardById.get(id);
    if (!card) return;
    state.view = 'work';
    state.milestone = card.milestone;
    state.selection = { type: 'card', id };
    state.query = '';
    search.value = '';
    render();
    syncHash();
  }

  function openModule(id) {
    if (!moduleById.has(id)) return;
    state.view = 'arch';
    state.selection = { type: 'module', id };
    state.sourceIndex = 0;
    state.query = '';
    search.value = '';
    render();
    syncHash();
  }

  function openDoc(id) {
    if (!docById.has(id)) return;
    state.view = 'docs';
    state.selection = { type: 'doc', id };
    state.query = '';
    search.value = '';
    render();
    syncHash();
  }

  function setView(view) {
    const normalized = normalizeView(view);
    if (!VIEWS.includes(normalized)) return;
    state.view = normalized;
    state.selection = null;
    state.query = '';
    search.value = '';
    render();
    syncHash();
  }

  function setMilestone(id) {
    state.view = 'work';
    state.milestone = id;
    state.selection = null;
    state.query = '';
    search.value = '';
    render();
    syncHash();
  }

  function clearSelection() {
    state.selection = null;
    render();
    syncHash();
  }

  function syncHash() {
    let hash = `#/${state.view}`;
    if (state.selection) hash += `/${encodeURIComponent(state.selection.id)}`;
    if (location.hash === hash) return;
    try {
      history.replaceState(null, '', hash);
    } catch {
      location.hash = hash;
    }
  }

  function applyHash() {
    const raw = location.hash.replace(/^#\/?/, '');
    if (!raw) {
      state.view = 'arch';
      state.selection = null;
      render();
      syncHash();
      return;
    }

    const parts = raw.split('/');
    const view = normalizeView(parts[0]);
    const id = parts.length > 1 ? decodeURIComponent(parts.slice(1).join('/')) : '';

    state.view = VIEWS.includes(view) ? view : 'arch';
    state.selection = null;

    if (id) {
      if (state.view === 'arch' && moduleById.has(id)) {
        state.selection = { type: 'module', id };
        state.sourceIndex = 0;
      } else if (state.view === 'work' && cardById.has(id)) {
        state.selection = { type: 'card', id };
        state.milestone = cardById.get(id).milestone;
      } else if (state.view === 'docs' && docById.has(id)) {
        state.selection = { type: 'doc', id };
      }
    }

    state.query = '';
    search.value = '';
    render();
    syncHash();
  }

  function scheduleEdges() {
    cancelAnimationFrame(edgeFrame);
    edgeFrame = requestAnimationFrame(() => {
      edgeFrame = requestAnimationFrame(drawEdges);
    });
  }

  function drawEdges() {
    const arch = document.getElementById('arch-canvas');
    const svg = document.getElementById('arch-edges');
    if (!arch || !svg) return;

    const rect = arch.getBoundingClientRect();
    const width = Math.max(arch.scrollWidth, arch.clientWidth);
    const height = Math.max(arch.scrollHeight, arch.clientHeight);
    svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
    svg.setAttribute('width', width);
    svg.setAttribute('height', height);

    const defs = '<defs><marker id="ni-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="arrow-head" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="ni-arrow-active" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="arrow-head-active" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs>';
    const parts = [defs];
    const selectedModule = state.selection?.type === 'module' ? state.selection.id : null;

    for (const relation of DATA.relations) {
      const source = arch.querySelector(`[data-module="${cssEscape(relation.from)}"]`);
      const target = arch.querySelector(`[data-module="${cssEscape(relation.to)}"]`);
      if (!source || !target || source.classList.contains('dim') || target.classList.contains('dim')) continue;

      const a = source.getBoundingClientRect();
      const b = target.getBoundingClientRect();
      if (a.width === 0 || b.width === 0) continue;

      let x1;
      let y1;
      let x2;
      let y2;
      let path;

      if (b.top > a.bottom + 6) {
        x1 = a.left + a.width / 2 - rect.left;
        y1 = a.bottom - rect.top;
        x2 = b.left + b.width / 2 - rect.left;
        y2 = b.top - rect.top;
        const midY = (y1 + y2) / 2;
        path = `M${x1},${y1} C${x1},${midY} ${x2},${midY} ${x2},${y2}`;
      } else if (b.bottom < a.top - 6) {
        x1 = a.left + a.width / 2 - rect.left;
        y1 = a.top - rect.top;
        x2 = b.left + b.width / 2 - rect.left;
        y2 = b.bottom - rect.top;
        const midY = (y1 + y2) / 2;
        path = `M${x1},${y1} C${x1},${midY} ${x2},${midY} ${x2},${y2}`;
      } else {
        const toRight = b.left >= a.left;
        x1 = (toRight ? a.right : a.left) - rect.left;
        y1 = a.top + a.height / 2 - rect.top;
        x2 = (toRight ? b.left : b.right) - rect.left;
        y2 = b.top + b.height / 2 - rect.top;
        const midX = (x1 + x2) / 2;
        path = `M${x1},${y1} C${midX},${y1} ${midX},${y2} ${x2},${y2}`;
      }

      const connected = selectedModule && (relation.from === selectedModule || relation.to === selectedModule);
      const className = connected ? 'edge edge-active' : 'edge';
      const marker = connected ? 'ni-arrow-active' : 'ni-arrow';
      const title = `${relation.from} → ${relation.to}${relation.label ? ` · ${relation.label}` : ''}`;
      parts.push(`<path class="${className}" d="${path}" marker-end="url(#${marker})"><title>${esc(title)}</title></path>`);

    }

    svg.innerHTML = parts.join('');
  }

  function cssEscape(value) {
    if (window.CSS?.escape) return CSS.escape(value);
    return String(value).replace(/["\\]/g, '\\$&');
  }

  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
  }

  function bindEvents() {
    document.addEventListener('click', (event) => {
      if (!(event.target instanceof Element)) return;
      const target = event.target.closest('[data-view],[data-milestone],[data-card],[data-module],[data-doc],[data-source],[data-close]');
      if (!target) return;

      if (target.dataset.view) {
        event.preventDefault();
        setView(target.dataset.view);
        return;
      }
      if (target.dataset.milestone) {
        setMilestone(target.dataset.milestone);
        return;
      }
      if (target.dataset.card) {
        openCard(target.dataset.card);
        return;
      }
      if (target.dataset.module) {
        openModule(target.dataset.module);
        return;
      }
      if (target.dataset.doc) {
        openDoc(target.dataset.doc);
        return;
      }
      if (target.hasAttribute('data-source')) {
        state.sourceIndex = Number(target.dataset.source) || 0;
        renderDetails();
        return;
      }
      if (target.hasAttribute('data-close')) {
        clearSelection();
      }
    });

    search.addEventListener('input', () => {
      state.query = search.value.trim().toLowerCase();
      renderCanvas();
    });

    themeButton.addEventListener('click', () => {
      const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      applyTheme(next);
      try {
        localStorage.setItem('ni-theme', next);
      } catch {
        /* file:// or private mode */
      }
      scheduleEdges();
    });

    document.addEventListener('keydown', (event) => {
      const typing = document.activeElement instanceof HTMLInputElement || document.activeElement instanceof HTMLTextAreaElement;

      if (event.key === '/' && !typing) {
        event.preventDefault();
        search.focus();
        search.select();
        return;
      }

      if (event.key === 'Escape') {
        if (document.activeElement === search) {
          search.value = '';
          state.query = '';
          search.blur();
          renderCanvas();
        } else if (state.selection) {
          clearSelection();
        }
        return;
      }

      if (!typing && ['1', '2', '3', '4'].includes(event.key)) {
        setView(VIEWS[Number(event.key) - 1]);
      }
    });

    window.addEventListener('hashchange', applyHash);
    window.addEventListener('resize', scheduleEdges);

    if (document.fonts?.ready) {
      document.fonts.ready.then(scheduleEdges).catch(() => {});
    }
  }

  function init() {
    const saved = (() => {
      try {
        return localStorage.getItem('ni-theme');
      } catch {
        return null;
      }
    })();
    const preferred = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    applyTheme(saved || preferred);
    bindEvents();

    if (location.hash) {
      applyHash();
    } else {
      render();
      syncHash();
    }
  }

  init();
})();

</script>
</body>
</html>
