reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eni exec --resume \u0026lt;session\u0026gt;\u003c/code\u003e 从日志重建上下文继续。\u003c/li\u003e\n\u003cli\u003escripted provider：按预设返回 tool call 序列，完全离线。\u003c/li\u003e\n\u003cli\u003e录制 / 回放 provider 响应的 fixture 目录。\u003c/li\u003e\n\u003cli\u003egolden transcript 测试 loop 行为。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e中断后 resume，模型看到的历史与中断前一致。\u003c/li\u003e\n\u003cli\u003e回放同一 fixture 两次，事件序列一致。\u003c/li\u003e\n\u003cli\u003e工具执行后不重放整个 turn。\u003c/li\u003e\n\u003cli\u003e测试不访问网络、不烧 token。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003e测试的价值不在覆盖率，而在让 context / loop 的修改可以离线验证。\u003c/p\u003e\n","path":"docs/board/M0-009-resume.md"},{"id":"M0-010","title":"Architecture-first dashboard 改造","status":"done","milestone":"M0","module":"dashboard","size":"M","priority":"P1","updated":"2026-10-20","completed":"2026-10-20","depends_on":["M0-003"],"docs":["adr-0003"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e默认视图改为 Architecture，导航改为 Architecture / Work / Docs / Decisions。\u003c/li\u003e\n\u003cli\u003e架构视图移除进度条、完成率和卡片计数；左栏改为按层分组的模块导航。\u003c/li\u003e\n\u003cli\u003eWork 保留卡片和里程碑筛选，但不再展示进度统计。\u003c/li\u003e\n\u003cli\u003eDecisions 只收 ADR 与 \u003ccode\u003ekind = \"decision\"\u003c/code\u003e 事件。\u003c/li\u003e\n\u003cli\u003e模块聚焦：选中后高亮相关边、弱化无关模块；不做 zoom/pan。\u003c/li\u003e\n\u003cli\u003e视觉继续走 technical field guide，不引入前端框架。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n打开 \u003ccode\u003edocs/index.html\u003c/code\u003e 第一屏是架构图。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nArchitecture 页没有进度条、完成率、Kanban 统计。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nWork 仍可筛选里程碑、打开卡片详情。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nDecisions 只显示决策事件和 ADR。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n模块聚焦、源码/ADR 联读、明暗主题正常。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n单文件离线，\u003ccode\u003ecargo xtask dashboard --check\u003c/code\u003e 通过。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003e进度信息不是被删除，而是从第一屏移走：卡片仍在 \u003ccode\u003edocs/board/\u003c/code\u003e，Work 仍可查。看板重新成为架构阅读面。\u003c/p\u003e\n","path":"docs/board/M0-010-architecture-first.md"},{"id":"M1-001","title":"流式 TUI 与取消","status":"backlog","milestone":"M1","module":"tui","size":"L","priority":"P1","updated":"2026-10-20","completed":null,"depends_on":["M0-008"],"docs":[],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e流式渲染文本、reasoning 折叠、工具调用状态。\u003c/li\u003e\n\u003cli\u003e审批提示：单键 allow / deny / allow-for-session。\u003c/li\u003e\n\u003cli\u003ediff 预览，先看再批。\u003c/li\u003e\n\u003cli\u003eCtrl-C 取消当前 turn，二次强制退出。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e首 token 到达即渲染，不等完整响应。\u003c/li\u003e\n\u003cli\u003e审批时终端不丢输入、不卡死。\u003c/li\u003e\n\u003cli\u003e取消后进程组被清理，session 留下明确事件。\u003c/li\u003e\n\u003cli\u003e窄终端（80 列）仍可读。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003eTUI 只消费事件流，不 import loop 内部。先做线性输出，再做花活。\u003c/p\u003e\n","path":"docs/board/M1-001-tui.md"},{"id":"M1-002","title":"Sandbox 三轴与原生隔离","status":"backlog","milestone":"M1","module":"sandbox","size":"L","priority":"P1","updated":"2026-10-20","completed":null,"depends_on":["M0-007"],"docs":[],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003esandbox\u003c/code\u003e：read-only / workspace-write / full-access。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eapproval\u003c/code\u003e：ask / on-failure / never。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003enetwork\u003c/code\u003e：on / off。\u003c/li\u003e\n\u003cli\u003eLinux 用 landlock + seccomp，macOS 用 seatbelt；先做一个平台。\u003c/li\u003e\n\u003cli\u003e路径策略与 shell 隔离分开实现，不假装进程内检查是安全边界。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eworkspace-write 下无法写工作区外路径。\u003c/li\u003e\n\u003cli\u003e网络关闭时子进程连接被拒绝。\u003c/li\u003e\n\u003cli\u003e逃逸尝试留下审计事件，而不是静默失败。\u003c/li\u003e\n\u003cli\u003e无沙箱平台明确降级到强制审批，并提示原因。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003e安全模型要能一句话解释清楚：能写哪、能连哪、什么时候问人。\u003c/p\u003e\n","path":"docs/board/M1-002-sandbox.md"},{"id":"M1-003","title":"Diff 预览与输出折叠","status":"backlog","milestone":"M1","module":"tui","size":"M","priority":"P2","updated":"2026-10-20","completed":null,"depends_on":["M1-001"],"docs":[],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e统一 diff 渲染：文件头、hunk、增删行、上下文折叠。\u003c/li\u003e\n\u003cli\u003e工具输出超过阈值时折叠，只显示摘要和\"展开\"提示。\u003c/li\u003e\n\u003cli\u003e审批前展示本次写入的完整 diff。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e大 diff 不刷屏，能按文件跳转。\u003c/li\u003e\n\u003cli\u003e行号与新增/删除标记对齐。\u003c/li\u003e\n\u003cli\u003e终端宽度变化后重排不破版。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003ediff 是审批体验的核心。模型说\"改好了\"不算，用户看到 diff 才算。\u003c/p\u003e\n","path":"docs/board/M1-003-diff.md"},{"id":"M2-001","title":"Compaction 与可执行 handoff","status":"backlog","milestone":"M2","module":"context","size":"L","priority":"P1","updated":"2026-10-20","completed":null,"depends_on":["M0-009"],"docs":["adr-0002"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e上下文到 75% 预算时触发压缩。\u003c/li\u003e\n\u003cli\u003e保留最近 N 轮原文和原始用户请求。\u003c/li\u003e\n\u003cli\u003e生成结构化 handoff：目标、已完成、改动文件、当前状态、下一步、约束。\u003c/li\u003e\n\u003cli\u003e压缩结果落成 \u003ccode\u003ecompaction\u003c/code\u003e 事件，resume 时按 \u003ccode\u003eupto\u003c/code\u003e 重建投影。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e压缩后继续任务，不重复已完成步骤。\u003c/li\u003e\n\u003cli\u003e压缩事件可回放，模型上下文与压缩时一致。\u003c/li\u003e\n\u003cli\u003e压缩失败时保留原上下文并提示，不丢历史。\u003c/li\u003e\n\u003cli\u003e长会话 token 成本可见地下降。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003e压缩不是\"总结对话\"，是给下一个 turn 或下一个 session 写可执行的交接单。\u003c/p\u003e\n","path":"docs/board/M2-001-compaction.md"},{"id":"M2-002","title":"AGENTS.md 分层发现与缓存指标","status":"backlog","milestone":"M2","module":"context","size":"M","priority":"P2","updated":"2026-10-20","completed":null,"depends_on":["M2-001"],"docs":[],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e从 cwd 向上发现 \u003ccode\u003eAGENTS.md\u003c/code\u003e，按距离合并，近者优先。\u003c/li\u003e\n\u003cli\u003esystem prompt 只保留稳定前缀；易变信息放末尾。\u003c/li\u003e\n\u003cli\u003e记录 cached / input tokens，按 turn 汇总命中率。\u003c/li\u003e\n\u003cli\u003e看板 Runs 视图读取 metrics JSONL。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e子目录规范能覆盖根目录规则。\u003c/li\u003e\n\u003cli\u003e修改 \u003ccode\u003eAGENTS.md\u003c/code\u003e 后下一 turn 生效，无需重启。\u003c/li\u003e\n\u003cli\u003e缓存命中率可在 session 事件里看到。\u003c/li\u003e\n\u003cli\u003e前缀变化导致缓存失效时能定位原因。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003e缓存命中率是 context 工程质量最直接的指标。没有指标就不要谈优化。\u003c/p\u003e\n","path":"docs/board/M2-002-agents-cache.md"},{"id":"M3-001","title":"Replay 与 fork","status":"backlog","milestone":"M3","module":"session","size":"M","priority":"P2","updated":"2026-10-20","completed":null,"depends_on":["M2-001"],"docs":["adr-0002"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eni replay \u0026lt;session\u0026gt;\u003c/code\u003e：按事件重建状态并校验投影。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eni fork \u0026lt;session\u0026gt; --at \u0026lt;event-id\u0026gt;\u003c/code\u003e：复制前缀，生成新 session。\u003c/li\u003e\n\u003cli\u003e事件 id 稳定，fork 后历史可追溯。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003ereplay 不调用模型，输出与原始 turn 的投影一致。\u003c/li\u003e\n\u003cli\u003efork 后原 session 不被修改。\u003c/li\u003e\n\u003cli\u003e坏尾行 fork 时被截断并提示。\u003c/li\u003e\n\u003cli\u003e事件 id 冲突检测。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003efork 是 subagent 和\"试另一条路\"的基础。先有可靠前缀复制，再谈并行。\u003c/p\u003e\n","path":"docs/board/M3-001-replay-fork.md"},{"id":"M3-002","title":"Subagent 与并行只读探索","status":"backlog","milestone":"M3","module":"loop","size":"L","priority":"P2","updated":"2026-10-20","completed":null,"depends_on":["M3-001","M1-002"],"docs":[],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e子 session 有独立日志，父 session 记录 spawn / result 事件。\u003c/li\u003e\n\u003cli\u003e只读探索可并行；写操作仍由主 session 串行。\u003c/li\u003e\n\u003cli\u003e子代理有独立步数、token 和超时预算。\u003c/li\u003e\n\u003cli\u003e结果返回摘要 + 完整日志路径，不把整个子上下文塞回父上下文。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e两个子代理并行跑互不污染事件日志。\u003c/li\u003e\n\u003cli\u003e子代理超时/失败不影响主 session 继续。\u003c/li\u003e\n\u003cli\u003e父上下文只增加一条结果摘要。\u003c/li\u003e\n\u003cli\u003e能追溯每个结论来自哪个子 session。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003esubagent 不是多 agent 框架，只是\"带独立日志的受限子运行\"。先证明单 agent 闭环可靠。\u003c/p\u003e\n","path":"docs/board/M3-002-subagents.md"}],"docs":[{"id":"architecture","title":"架构","kind":"doc","status":"living","order":10,"summary":"ni 的边界、数据流、事件生命周期与明确不做的事。","body_html":"\u003ch2\u003e一句话\u003c/h2\u003e\n\u003cp\u003eni 是一个围绕 \u003cstrong\u003eappend-only 事件日志\u003c/strong\u003e 构建的最小 coding agent harness：一个 turn 引擎、一层薄 provider 适配、六个工具、三条安全轴。其余都是外围。\u003c/p\u003e\n\u003ch2\u003e设计约束\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e日志是唯一真相。\u003c/strong\u003e 内存里的对话是日志的投影。任何不落盘的状态，进程退出即不存在。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e上下文是产品。\u003c/strong\u003e 模型看到什么、按什么顺序看到、何时压缩，决定了 agent 的上限。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e工具少而锋利。\u003c/strong\u003e 每多一个工具，就多一份 schema、一类失败模式和一段 prompt。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eprovider 层要薄。\u003c/strong\u003e 只归一化够用的部分，不试图抹平所有 wire format 怪癖。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e安全边界要诚实。\u003c/strong\u003e 进程内路径校验不是沙箱；bash 能绕过的东西，不能假装它不能。\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e数据流\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003euser input\n   │\n   ▼\n CLI ──► loop ──► context.project(log, budget) ──► provider.stream\n            │                                          │\n            │                                     StreamEvent\n            │                                          ▼\n            │                                   assistant message\n            │                                          │\n            ├────────────── tool calls ◄───────────────┘\n            │                   │\n            │                   ├──► sandbox.guard\n            │                   └──► tools.dispatch (read-only 并发，写串行)\n            │\n            └──► session.append(every event, flush)\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e一个 turn 的边界是 \u003ccode\u003euser_message\u003c/code\u003e 到 \u003ccode\u003eturn_end\u003c/code\u003e。loop 只做四件事：投影、请求、派发、追加。它不解析 SSE，不实现工具，不渲染 UI。\u003c/p\u003e\n\u003ch2\u003e事件生命周期\u003c/h2\u003e\n\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e事件\u003c/th\u003e\u003cth\u003e何时写入\u003c/th\u003e\u003cth\u003e关键字段\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003esession_start\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e创建会话\u003c/td\u003e\u003ctd\u003eid、cwd、model\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003euser_message\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e用户输入\u003c/td\u003e\u003ctd\u003etext\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eassistant_message\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e一次模型响应结束\u003c/td\u003e\u003ctd\u003etext、reasoning、tool_calls\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003etool_result\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e每个工具执行完\u003c/td\u003e\u003ctd\u003ecall_id、ok、output\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eturn_end\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e一个 turn 结束\u003c/td\u003e\u003ctd\u003eusage（含 cached / reasoning）\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003ecompaction\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e上下文压缩\u003c/td\u003e\u003ctd\u003esummary、upto\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003esession_end\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e正常退出\u003c/td\u003e\u003ctd\u003ets\u003c/td\u003e\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e\u003ccode\u003ecompaction.upto\u003c/code\u003e 表示被摘要替换的事件数量。resume 时先加载全量事件，再按最后一个 compaction 截断投影；原始事件永远保留。\u003c/p\u003e\n\u003ch2\u003e模块边界\u003c/h2\u003e\n\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e层\u003c/th\u003e\u003cth\u003e模块\u003c/th\u003e\u003cth\u003e职责\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\n\u003ctr\u003e\u003ctd\u003eInterface\u003c/td\u003e\u003ctd\u003eCLI / TUI\u003c/td\u003e\u003ctd\u003e参数、生命周期、渲染；不持有对话状态\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eEngine\u003c/td\u003e\u003ctd\u003eLoop / Context\u003c/td\u003e\u003ctd\u003e编排、投影、压缩；不碰 wire format\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eAdapters\u003c/td\u003e\u003ctd\u003eProviders / Tools / Sandbox\u003c/td\u003e\u003ctd\u003e外部世界的适配；不依赖 UI\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eState\u003c/td\u003e\u003ctd\u003eSession\u003c/td\u003e\u003ctd\u003e追加、加载、容错；不解释业务\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eEngineering\u003c/td\u003e\u003ctd\u003eDashboard\u003c/td\u003e\u003ctd\u003e架构阅读面（默认 Architecture）；不参与运行时\u003c/td\u003e\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e依赖方向只能向下：Interface → Engine → Adapters / State。\u003ccode\u003eni-core\u003c/code\u003e 不依赖 \u003ccode\u003eni-cli\u003c/code\u003e，TUI 不 import loop 内部。\u003c/p\u003e\n\u003ch2\u003e工具面\u003c/h2\u003e\n\u003cp\u003e第一版只有六个：\u003ccode\u003eread\u003c/code\u003e、\u003ccode\u003ewrite\u003c/code\u003e、\u003ccode\u003eedit\u003c/code\u003e、\u003ccode\u003egrep\u003c/code\u003e、\u003ccode\u003eglob\u003c/code\u003e、\u003ccode\u003ebash\u003c/code\u003e。\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eread\u003c/code\u003e 带行号，单次上限约 2000 行 / 50KB，截断时给出续读方式。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eedit\u003c/code\u003e 用精确字符串替换，要求唯一匹配，返回小 diff；行号会漂移，不用行号。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ebash\u003c/code\u003e 只回尾部约 20KB，完整输出落临时文件；超时杀进程组，不留孤儿。\u003c/li\u003e\n\u003cli\u003e工具错误是 prompt 的一部分：写清楚\"为什么失败、下一步怎么做\"。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003ccode\u003ewrite\u003c/code\u003e / \u003ccode\u003eedit\u003c/code\u003e 前必须读过目标文件。这是策略层强制，不是提示词建议。\u003c/p\u003e\n\u003ch2\u003e上下文与压缩\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eproject(log, budget)\u003c/code\u003e 是全量日志到模型上下文的有损投影。\u003c/li\u003e\n\u003cli\u003esystem + tools + 历史前缀保持稳定，易变内容放末尾，以命中 provider 的 prompt cache。\u003c/li\u003e\n\u003cli\u003e到预算 75% 触发 compaction，保留最近 N 轮原文和原始请求，生成结构化 handoff：目标、已完成、改动文件、当前状态、下一步、约束。\u003c/li\u003e\n\u003cli\u003e压缩结果落成事件，不修改历史。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e安全\u003c/h2\u003e\n\u003cp\u003e三条正交的轴，不要揉成一个开关：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003esandbox\u003c/strong\u003e：read-only / workspace-write / full-access。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eapproval\u003c/strong\u003e：ask / on-failure / never。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003enetwork\u003c/strong\u003e：on / off。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e沙箱用平台原生能力（Linux landlock + seccomp，macOS seatbelt）。没有真沙箱的平台，明确降级为\"变更型 bash 强制审批\"，并告诉用户原因。\u003c/p\u003e\n\u003ch2\u003e明确不做\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e不做通用 agent framework，不为未知用例抽象。\u003c/li\u003e\n\u003cli\u003ev0 不做 MCP、插件系统、多 provider 全家桶、subagent、Web UI。\u003c/li\u003e\n\u003cli\u003e不做浏览器里可编辑的看板；状态变更走仓库。\u003c/li\u003e\n\u003cli\u003e不在 loop 里做 prompt 字符串拼接；prompt 是独立、可版本化的输入。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e开放问题\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ccode\u003eassistant_message\u003c/code\u003e 是否要保留 reasoning 原文，还是只保留摘要？不同 provider 的回传要求不同。\u003c/li\u003e\n\u003cli\u003ecompaction 的 handoff 由模型生成还是模板生成？前者灵活，后者稳定。\u003c/li\u003e\n\u003cli\u003e工具并行度：只读并发之外，是否允许不同文件的写并发？\u003c/li\u003e\n\u003cli\u003e事件 schema 的演进策略：加字段兼容，还是显式版本迁移？\u003c/li\u003e\n\u003c/ol\u003e\n","path":"docs/architecture.md","excerpt":"ni 的边界、数据流、事件生命周期与明确不做的事。"},{"id":"adr-0001","title":"ADR-0001：Rust 作为核心语言","kind":"adr","status":"accepted","order":20,"summary":"性能优先不等于 loop 快几毫秒；Rust 换来的是启动、内存、分发和原生沙箱。","body_html":"\u003ch2\u003e状态\u003c/h2\u003e\n\u003cp\u003eAccepted · 2026-10-20\u003c/p\u003e\n\u003ch2\u003e背景\u003c/h2\u003e\n\u003cp\u003eni 是一个单二进制 CLI：长会话、流式子进程、沙箱、可能的多子代理。语言选型要在两端做取舍：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e运行时\u003c/strong\u003e：harness 自身耗时（SSE 解析、JSON、日志、调度）通常只占一个 turn 的 1–5ms，而模型 TTFT + 生成是 1–3s。换语言不会让 agent 明显变快。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e工程形态\u003c/strong\u003e：冷启动、常驻内存、单二进制分发、进程组/信号控制、原生沙箱，这些是 Rust 的真实优势。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e开发迭代\u003c/strong\u003e：Rust 的编译反馈和 async 设计摩擦，会让早期功能吞吐慢 1.5–2x；这是\"写功能慢\"，不是\"运行时慢\"。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e决策\u003c/h2\u003e\n\u003cp\u003e核心使用 Rust，workspace 拆分小 crate：\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003ecrates/\n  ni-core/       # 事件、会话、loop、context\n  ni-cli/        # 参数与生命周期\n  ni-provider/   # 后续：wire adapters\n  ni-tools/      # 后续：工具\n  ni-sandbox/    # 后续：策略与平台隔离\n  xtask/         # 仓库工具（看板构建）\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2\u003e后果\u003c/h2\u003e\n\u003ch3\u003e正向\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e单静态二进制，启动 2–10ms，无 runtime 依赖。\u003c/li\u003e\n\u003cli\u003e常驻内存低，多 session / 子代理时线性成本可控。\u003c/li\u003e\n\u003cli\u003e进程组、超时、信号、fd 管理语义明确，取消链路可靠。\u003c/li\u003e\n\u003cli\u003elandlock / seccomp / seatbelt 可直接调用，不需要 native addon 或外部包装进程。\u003c/li\u003e\n\u003cli\u003e事件、状态机、工具 schema 适合强类型，后期重构成本低。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e负向\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e编译反馈比 TS 慢一个数量级。\u003c/li\u003e\n\u003cli\u003easync 流式状态机在接口未定型时摩擦大。\u003c/li\u003e\n\u003cli\u003eOpenAI / Anthropic 的 Rust SDK 不如 TS/Python 成熟，SSE 和事件映射要自己写。\u003c/li\u003e\n\u003cli\u003eTUI 迭代比 Ink/React 慢。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e缓解\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eworkspace 拆小 crate，\u003ccode\u003eni-core\u003c/code\u003e 不依赖 CLI / TUI，增量编译范围小。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ebacon\u003c/code\u003e / \u003ccode\u003ecargo-watch\u003c/code\u003e + \u003ccode\u003ecargo check\u003c/code\u003e 作为内循环；链接器用 mold/lld。\u003c/li\u003e\n\u003cli\u003e控制 proc-macro 依赖，provider 边界允许 \u003ccode\u003eserde_json::Value\u003c/code\u003e，内部强类型。\u003c/li\u003e\n\u003cli\u003eheadless first，TUI last；loop / tools 用 scripted provider 离线测试。\u003c/li\u003e\n\u003cli\u003econtext 逻辑写成纯函数 + fixture，改 prompt 策略不需要重编译整个 workspace。\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e备选方案\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eTypeScript / Bun\u003c/strong\u003e：迭代最快，官方 SDK 最全，TUI 生态好。运行时足够，但单二进制、内存和原生沙箱弱。若接下来数周的主要目标是高频试 context 策略，这是更快的选择。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eRust core + TS TUI（JSON-RPC）\u003c/strong\u003e：长期可行，但 v0 多一套协议、进程生命周期和错误映射，违背 minimal。等事件协议稳定后再考虑拆分。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePython\u003c/strong\u003e：原型最快，但分发、并发、类型约束和长会话内存都不占优。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e备注\u003c/h2\u003e\n\u003cp\u003e\"Rust 慢一倍\"指的是开发迭代速度，不是运行时。性能优先应当优化 prompt cache、工具输出体积、并行工具和 compaction，而不是期待换语言让模型响应变快。\u003c/p\u003e\n","path":"docs/adr/0001-rust-core.md","excerpt":"性能优先不等于 loop 快几毫秒；Rust 换来的是启动、内存、分发和原生沙箱。"},{"id":"adr-0002","title":"ADR-0002：事件日志是唯一真相","kind":"adr","status":"accepted","order":21,"summary":"内存状态只是 JSONL 日志的 fold；resume、fork、replay 和 compaction 都从日志派生。","body_html":"\u003ch2\u003e状态\u003c/h2\u003e\n\u003cp\u003eAccepted · 2026-10-20\u003c/p\u003e\n\u003ch2\u003e背景\u003c/h2\u003e\n\u003cp\u003eAgent 进程会崩溃、被取消、被重启。如果对话只存在内存里，一次崩溃就丢掉全部上下文；如果另外维护一份\"session 快照\"，它和内存状态迟早不一致。\u003c/p\u003e\n\u003ch2\u003e决策\u003c/h2\u003e\n\u003cp\u003e每个 session 是一个 append-only JSONL 文件，一行一个 \u003ccode\u003eEvent\u003c/code\u003e。内存状态是日志的 fold：\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003estate = fold(events)\n\u003c/code\u003e\u003c/pre\u003e\n\u003cul\u003e\n\u003cli\u003e写入：\u003ccode\u003eSessionLog::append\u003c/code\u003e 序列化一行、flush，不改旧行。\u003c/li\u003e\n\u003cli\u003e读取：\u003ccode\u003eload\u003c/code\u003e 逐行解码；坏行变成 warning，不丢整份历史。\u003c/li\u003e\n\u003cli\u003e恢复：\u003ccode\u003eresume\u003c/code\u003e 从日志重建，而不是从快照恢复。\u003c/li\u003e\n\u003cli\u003e分叉：\u003ccode\u003efork\u003c/code\u003e 复制某个前缀，生成新 session。\u003c/li\u003e\n\u003cli\u003e压缩：\u003ccode\u003ecompaction\u003c/code\u003e 事件记录摘要和 \u003ccode\u003eupto\u003c/code\u003e；只影响投影，不删原始事件。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e后果\u003c/h2\u003e\n\u003ch3\u003e正向\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eresume / replay / fork 共用一套机制，测试可离线回放。\u003c/li\u003e\n\u003cli\u003e崩溃最多丢最后一行（未 flush），不会出现\"内存与磁盘不一致\"。\u003c/li\u003e\n\u003cli\u003e审计简单：每个决策、工具调用、usage 都有时间线。\u003c/li\u003e\n\u003cli\u003e压缩是投影变换，可回滚、可对比。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e负向\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e日志会增长；长会话需要 compaction 和归档策略。\u003c/li\u003e\n\u003cli\u003e事件 schema 演进需要兼容策略（新增字段可默认，删除/改义要迁移）。\u003c/li\u003e\n\u003cli\u003e日志可能包含敏感内容（文件内容、命令输出），需要权限和清理策略。\u003c/li\u003e\n\u003cli\u003e每次 append 都 flush，吞吐低于批量写；对 agent 的写入频率足够。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e投影规则\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e原始事件永远保留。\u003c/li\u003e\n\u003cli\u003e最后一个 \u003ccode\u003ecompaction\u003c/code\u003e 之前的消息不进入模型上下文，替换为摘要。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003etool_result\u003c/code\u003e 必须和对应 \u003ccode\u003eassistant_message.tool_calls\u003c/code\u003e 成对出现；缺失时投影报错，不猜。\u003c/li\u003e\n\u003cli\u003ereasoning 是否进入上下文由 provider 适配层决定，日志始终保留原文。\u003c/li\u003e\n\u003cli\u003e投影是纯函数：相同日志 + 相同预算 → 相同上下文。\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e备选方案\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e内存 messages + 退出时快照\u003c/strong\u003e：实现简单，但崩溃丢上下文，且快照与内存双真相。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e数据库（SQLite）\u003c/strong\u003e：查询和并发更好，但 v0 引入 schema、迁移和依赖；JSONL 可 grep、可 diff、可直接回放。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e只存模型可见的投影\u003c/strong\u003e：省空间，但丢掉审计和 fork 能力，压缩不可逆。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e风险与缓解\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e日志过大：按 session 归档，支持 \u003ccode\u003ecompact --archive\u003c/code\u003e；看板 Runs 视图只读聚合指标。\u003c/li\u003e\n\u003cli\u003e敏感信息：session 目录默认 \u003ccode\u003e0700\u003c/code\u003e；提供 \u003ccode\u003eni session redact\u003c/code\u003e 的后续入口。\u003c/li\u003e\n\u003cli\u003e坏行：加载时 warning + 行号；\u003ccode\u003e--strict\u003c/code\u003e 模式用于 CI。\u003c/li\u003e\n\u003c/ul\u003e\n","path":"docs/adr/0002-event-log.md","excerpt":"内存状态只是 JSONL 日志的 fold；resume、fork、replay 和 compaction 都从日志派生。"},{"id":"adr-0003","title":"ADR-0003：Dashboard 以架构为第一屏","kind":"adr","status":"accepted","order":22,"summary":"看板不再以进度为主叙事；默认 Architecture，Work 降为二级，进度装饰从架构视图移除。","body_html":"\u003ch2\u003e状态\u003c/h2\u003e\n\u003cp\u003eAccepted · 2026-10-20\u003c/p\u003e\n\u003ch2\u003e背景\u003c/h2\u003e\n\u003cp\u003e项目看板最初照搬了任务看板的默认视图：打开就是 Board、里程碑进度条、完成率和卡片计数。这个结构回答的是\"做到哪了\"，但项目真正需要反复阅读的是\"系统由哪些边界组成、依赖往哪流、为什么这样切\"。\u003c/p\u003e\n\u003cp\u003e进度信息还有两个问题：它和 git、session log 重复；为了看起来完整，会诱导维护者不断更新百分比和统计数字，而不是更新架构和决策。卡片本身仍然是 agent 的 handoff 面，值得保留，但不应该占据第一屏。\u003c/p\u003e\n\u003ch2\u003e决策\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e默认视图改为 Architecture\u003c/strong\u003e，导航固定为 Architecture / Work / Docs / Decisions。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eWork 降为二级视图\u003c/strong\u003e：保留卡片、状态列和里程碑筛选，但移除进度条、完成率、WIP 数字和卡片计数。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eArchitecture 只保留结构信息\u003c/strong\u003e：层、模块、关系、owned paths、contract、源码；\u003ccode\u003eplanned / active / done\u003c/code\u003e 是模块状态，不是完成率。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDecisions 只收决策\u003c/strong\u003e：ADR 和 \u003ccode\u003ekind = \"decision\"\u003c/code\u003e 事件；不展示\"某张卡完成\"的流水账。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e不上前端框架\u003c/strong\u003e：继续原生 JS/CSS，保持单文件、离线、\u003ccode\u003ecargo xtask dashboard\u003c/code\u003e 确定性构建。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e视觉方向为 technical field guide\u003c/strong\u003e：暖纸、墨色、深绿强调、低饱和层色；架构图是主角；不做 zoom/pan 和拖拽编辑。\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e后果\u003c/h2\u003e\n\u003ch3\u003e正向\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e第一屏直接回答\"系统长什么样\"，而不是\"完成了几张卡\"。\u003c/li\u003e\n\u003cli\u003e进度回到 git / session log / Work 视图，减少看板变成第二真相源的压力。\u003c/li\u003e\n\u003cli\u003e单文件、零构建、离线可用；页面大约维持在当前体量。\u003c/li\u003e\n\u003cli\u003e模块聚焦会弱化无关节点，复杂架构图仍然可读。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e负向\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e想快速看进度的人需要多点一次 Work。\u003c/li\u003e\n\u003cli\u003e卡片状态仍然需要维护；只是不再用进度条装饰它。\u003c/li\u003e\n\u003cli\u003e没有 zoom/pan，超过约 30 个模块后需要重新评估图导航。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e备选方案\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e保留 Board 优先\u003c/strong\u003e：改动最小，但与架构阅读的目标冲突。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e删除 Work，进度交给 GitHub Issues\u003c/strong\u003e：最纯粹，但会破坏当前 \u003ccode\u003eAGENTS.md\u003c/code\u003e 依赖卡片做 handoff 的流程，并引入第二套状态源。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e引入 React/Svelte + 图编辑器\u003c/strong\u003e：当前 9 个模块、8 条关系，框架 runtime 比数据还大；等真的需要编辑/拖拽/多人协作时再做。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eRevisit 条件\u003c/h2\u003e\n\u003cp\u003e出现以下任一情况时重新评估：\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e模块数量超过 30，或关系超过 60，当前分层图不可读。\u003c/li\u003e\n\u003cli\u003e需要在浏览器里编辑架构或卡片，而不只是阅读。\u003c/li\u003e\n\u003cli\u003e出现多个并发读者/写者，需要真正的服务端状态。\u003c/li\u003e\n\u003c/ol\u003e\n","path":"docs/adr/0003-architecture-first-dashboard.md","excerpt":"看板不再以进度为主叙事；默认 Architecture，Work 降为二级，进度装饰从架构视图移除。"},{"id":"readme","title":"看板维护指南","kind":"guide","status":null,"order":90,"summary":"docs/ 的源文件、构建命令、architecture-first 视图与每次迭代的更新仪式。","body_html":"\u003ch2\u003e这是什么\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003edocs/index.html\u003c/code\u003e 是项目唯一的架构阅读面：Architecture / Work / Docs / Decisions 共享一个三栏壳。它由仓库里的源文件生成，离线可开，不依赖服务端。\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-sh\"\u003ecargo xtask dashboard          # 生成 docs/index.html + model.json + receipt.json\ncargo xtask dashboard --check  # CI：生成物过期、引用断开时失败\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e构建是确定性的：相同输入生成相同 HTML。\u003ccode\u003ereceipt.json\u003c/code\u003e 记录构建时间、git revision 和输入清单，但不参与过期判断，也不入库。\u003c/p\u003e\n\u003ch2\u003e四个视图\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eArchitecture（默认）\u003c/strong\u003e：按语义层排列模块，显示依赖关系、模块状态、contract、owned paths 和源码。选中模块会聚焦它的关系，弱化无关节点；不提供 zoom/pan。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eWork\u003c/strong\u003e：卡片和状态列，可按里程碑筛选。它是 agent 的 handoff 面，不是进度仪表盘；不显示完成率、进度条、WIP 数字或卡片计数。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDocs\u003c/strong\u003e：Markdown 文档索引，右栏阅读，支持 \u003ccode\u003e#/docs/adr-0001\u003c/code\u003e 深链。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDecisions\u003c/strong\u003e：ADR 卡片 + \u003ccode\u003ekind = \"decision\"\u003c/code\u003e 的决策日志。这里不放“某张卡完成”的流水账。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e进度信息仍然存在于 \u003ccode\u003edocs/board/\u003c/code\u003e 和 git 里；只是不再占据第一屏。\u003c/p\u003e\n\u003ch2\u003e源文件\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003edocs/\n  index.html                  # 生成物，提交，file:// 可开\n  dashboard/\n    project.json              # 项目、里程碑、层、模块、关系、决策事件\n    template.html             # 单文件壳\n    style.css                 # 三栏与四个视图的样式\n    app.js                    # 无框架渲染\n    model.json                # 生成物：解析后的完整模型\n    receipt.json              # 本地审计信息，gitignore，不入库\n  board/\n    M0-001-workspace.md       # 一张卡一个文件\n  adr/\n    0001-rust-core.md\n    0002-event-log.md\n    0003-architecture-first-dashboard.md\n  architecture.md\n  README.md\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003e唯一真相\u003c/strong\u003e：\u003ccode\u003eproject.json\u003c/code\u003e + \u003ccode\u003eboard/*.md\u003c/code\u003e + 其余 Markdown。\u003ccode\u003eindex.html\u003c/code\u003e、\u003ccode\u003emodel.json\u003c/code\u003e、\u003ccode\u003ereceipt.json\u003c/code\u003e 永不手改。\u003c/p\u003e\n\u003ch2\u003e卡片格式\u003c/h2\u003e\n\u003cp\u003e卡片 frontmatter 用 TOML，正文是给详情栏读的 Markdown：\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-toml\"\u003e+++\nid = \"M0-005\"\ntitle = \"Provider trait 与流式适配\"\nstatus = \"ready\"          # backlog | ready | doing | review | done | blocked\nmilestone = \"M0\"\nmodule = \"providers\"      # 可省略；必须是 project.json 里的模块 id\nsize = \"L\"                # S | M | L\npriority = \"P0\"           # 可省略；P0 | P1 | P2\nupdated = \"2026-10-20\"\ncompleted = \"2026-10-20\"  # done 必填\ndepends_on = [\"M0-002\"]\ndocs = [\"architecture\"]   # 可选；必须是文档 id\nblocked_reason = \"\"       # blocked 必填\n+++\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e正文建议四段：\u003ccode\u003e## 范围\u003c/code\u003e、\u003ccode\u003e## 验收\u003c/code\u003e、\u003ccode\u003e## 记录\u003c/code\u003e，需要时加 \u003ccode\u003e## 开放问题\u003c/code\u003e。验收写成可执行的检查，不写“体验良好”。\u003c/p\u003e\n\u003ch2\u003e文档格式\u003c/h2\u003e\n\u003cp\u003e所有 \u003ccode\u003edocs/**/*.md\u003c/code\u003e（\u003ccode\u003eboard/\u003c/code\u003e 和 \u003ccode\u003edashboard/\u003c/code\u003e 除外）必须有 frontmatter：\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-toml\"\u003e+++\nid = \"adr-0003\"\ntitle = \"ADR-0003：...\"\nkind = \"adr\"              # adr | doc | guide\nstatus = \"accepted\"       # ADR 必填：proposed | accepted | superseded | rejected | draft\norder = 30\nsummary = \"一句话，显示在文档卡片上。\"\n+++\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e文档 id 用于深链：\u003ccode\u003e#/docs/adr-0001\u003c/code\u003e。卡片里的 \u003ccode\u003edocs\u003c/code\u003e 引用按 id 校验。\u003c/p\u003e\n\u003ch2\u003e架构模型\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003eproject.json\u003c/code\u003e 里手工维护，不从文件名推断：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003emilestones\u003c/code\u003e：M0–M3，状态 \u003ccode\u003eplanned | active | done\u003c/code\u003e，同一时间最多一个 active。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003elayers\u003c/code\u003e：语义分层，不是目录树。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003emodules\u003c/code\u003e：职责、公开契约、拥有的路径、备注。\u003ccode\u003eactive\u003c/code\u003e / \u003ccode\u003edone\u003c/code\u003e 至少有一个路径真实存在。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003erelations\u003c/code\u003e：\u003ccode\u003efrom\u003c/code\u003e / \u003ccode\u003eto\u003c/code\u003e / \u003ccode\u003elabel\u003c/code\u003e，两端必须是模块 id。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eevents\u003c/code\u003e：决策与里程碑事件；\u003ccode\u003erefs\u003c/code\u003e 可以指向卡片或文档 id。只有 \u003ccode\u003ekind = \"decision\"\u003c/code\u003e 会进入 Decisions 视图。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e更新仪式\u003c/h2\u003e\n\u003cp\u003e每次任务结束，按顺序做：\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e更新对应卡片的 \u003ccode\u003estatus\u003c/code\u003e、\u003ccode\u003eupdated\u003c/code\u003e、必要的 \u003ccode\u003ecompleted\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e有架构决策就加一篇 ADR，并在 \u003ccode\u003eproject.json\u003c/code\u003e 的 \u003ccode\u003eevents\u003c/code\u003e 里加一条 \u003ccode\u003edecision\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e如果模块边界、契约或路径变了，更新 \u003ccode\u003eproject.json\u003c/code\u003e 的 modules / relations。\u003c/li\u003e\n\u003cli\u003e跑 \u003ccode\u003ecargo fmt --all \u0026amp;\u0026amp; cargo test --workspace\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e跑 \u003ccode\u003ecargo xtask dashboard\u003c/code\u003e，把 \u003ccode\u003edocs/index.html\u003c/code\u003e 一起提交。\u003c/li\u003e\n\u003cli\u003e在 \u003ccode\u003eAGENTS.md\u003c/code\u003e 的 definition of done 里确认这一步没有被跳过。\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e状态必须反映现实：没有 \u003ccode\u003edoing\u003c/code\u003e 的卡就不要写 \u003ccode\u003edoing\u003c/code\u003e；\u003ccode\u003edone\u003c/code\u003e 必须有完成日期和可验证的验收项。\u003c/p\u003e\n\u003ch2\u003e校验规则\u003c/h2\u003e\n\u003cp\u003e构建时会失败的情况：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eschema version 不是 1；id 重复；里程碑 / 模块 / 文档引用不存在。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003edone\u003c/code\u003e 没有 \u003ccode\u003ecompleted\u003c/code\u003e；\u003ccode\u003eblocked\u003c/code\u003e 没有 \u003ccode\u003eblocked_reason\u003c/code\u003e；日期格式错误。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eactive\u003c/code\u003e / \u003ccode\u003edone\u003c/code\u003e 模块的路径一个都不存在。\u003c/li\u003e\n\u003cli\u003eADR 的 status 不在允许集合。\u003c/li\u003e\n\u003cli\u003e关系端点不是模块。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e--check\u003c/code\u003e 时生成物与源不一致。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e视觉约定\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e暖纸色底、墨色文字、一个深绿强调色；状态色只用于状态。\u003c/li\u003e\n\u003cli\u003e层色只用于模块导航、模块卡顶部细线和图例，不铺满背景。\u003c/li\u003e\n\u003cli\u003e架构图是主角；文档区控制阅读宽度，不做满屏卡片墙。\u003c/li\u003e\n\u003cli\u003e数字、ID、路径用等宽字体；正文用系统无衬线。\u003c/li\u003e\n\u003cli\u003e不引 CDN、不引外部字体，保证 \u003ccode\u003efile://\u003c/code\u003e 和离线环境一致。\u003c/li\u003e\n\u003cli\u003e动效只用于聚焦和状态切换，不做装饰性动画。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e不要擅自加的东西\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e前端框架、Vite/Node 构建链：会破坏单文件和确定性构建。需要时先写 ADR。\u003c/li\u003e\n\u003cli\u003e图表库、zoom/pan、拖拽编辑：模块少于 30 个时属于过度设计。\u003c/li\u003e\n\u003cli\u003e进度仪表盘、完成率、WIP 数字：进度属于 Work / git，不属于 Architecture 第一屏。\u003c/li\u003e\n\u003c/ul\u003e\n","path":"docs/README.md","excerpt":"docs/ 的源文件、构建命令、architecture-first 视图与每次迭代的更新仪式。"}],"events":[{"date":"2026-10-20","kind":"decision","title":"选择 Rust 作为核心语言","detail":"性能优先，且需要单二进制、低内存和原生沙箱。开发迭代的编译成本用 workspace 拆分和 fixture 测试抵消。","refs":["adr-0001"]},{"date":"2026-10-20","kind":"decision","title":"事件日志作为唯一真相","detail":"内存状态只是日志的 fold；resume、fork、replay 都从日志派生，压缩只改变投影。","refs":["adr-0002"]},{"date":"2026-10-20","kind":"milestone","title":"M0 开工：workspace、看板与会话日志","detail":"落地 cargo workspace、离线看板 v0、SessionLog 与 CLI 骨架。","refs":["M0-001","M0-002","M0-003","M0-004"]},{"date":"2026-10-20","kind":"decision","title":"Dashboard 以架构为第一屏","detail":"默认 Architecture，Work 降为二级；进度装饰移除，Decisions 只收决策。ADR-0003。","refs":["adr-0003"]}],"meta":{"schema_version":1,"cards":17,"modules":9,"docs":5,"generator":"cargo xtask dashboard"}}</script>
<script>
(() => {
  'use strict';

  const DATA = JSON.parse(document.getElementById('ni-data').textContent);

  const VIEWS = ['arch', 'work', 'docs', 'decisions'];
  const VIEW_ALIASES = { board: 'work', timeline: 'decisions' };
  const STATUS_COLUMNS = ['backlog', 'ready', 'doing', 'review', 'done'];
  const STATUS_LABEL = {
    backlog: 'Backlog',
    ready: 'Ready',
    doing: 'Doing',
    review: 'Review',
    done: 'Done',
    blocked: 'Blocked',
    planned: 'Planned',
    active: 'Active',
  };
  const STATUS_COLORS = {
    backlog: '#8c8478',
    ready: '#3f6f9f',
    doing: '#b7791f',
    review: '#6f5aa8',
    done: '#3f7d4f',
    blocked: '#b42318',
  };
  const LAYER_COLORS = {
    interface: '#4c7bd9',
    engine: '#b57436',
    adapters: '#8768bf',
    state: '#5c8f4a',
    engineering: '#8a8175',
  };
  const KIND_LABEL = { adr: 'ADR', doc: 'Doc', guide: 'Guide' };

  const canvas = document.getElementById('canvas');
  const details = document.getElementById('details');
  const search = document.getElementById('search');
  const themeButton = document.getElementById('theme-toggle');

  const cardById = new Map(DATA.cards.map((card) => [card.id, card]));
  const moduleById = new Map(DATA.modules.map((module) => [module.id, module]));
  const docById = new Map(DATA.docs.map((doc) => [doc.id, doc]));
  const milestoneById = new Map(DATA.milestones.map((milestone) => [milestone.id, milestone]));
  const layerById = new Map(DATA.layers.map((layer) => [layer.id, layer]));

  const state = {
    view: 'arch',
    milestone: currentMilestoneId(),
    selection: null,
    query: '',
    sourceIndex: 0,
  };

  let edgeFrame = 0;

  function currentMilestoneId() {
    const active = DATA.milestones.find((milestone) => milestone.status === 'active');
    return active ? active.id : 'all';
  }

  function normalizeView(view) {
    return VIEW_ALIASES[view] || view;
  }

  function esc(value) {
    return String(value ?? '').replace(/[&<>"']/g, (character) => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;',
    }[character]));
  }

  function fmtDate(value) {
    return value ? value.slice(5) : '—';
  }

  function docKind(kind) {
    return KIND_LABEL[kind] || String(kind || 'doc').toUpperCase();
  }

  function layerColor(id) {
    return LAYER_COLORS[id] || '#8a8175';
  }

  function layerName(id) {
    const layer = layerById.get(id);
    return layer ? layer.name : id;
  }

  function moduleTitle(id) {
    const module = moduleById.get(id);
    return module ? module.title : id;
  }

  function isCardSelected(id) {
    return state.selection?.type === 'card' && state.selection.id === id;
  }

  function isModuleSelected(id) {
    return state.selection?.type === 'module' && state.selection.id === id;
  }

  function isDocSelected(id) {
    return state.selection?.type === 'doc' && state.selection.id === id;
  }

  function statusBadge(status) {
    const label = STATUS_LABEL[status] || status;
    return `<span class="badge badge-${esc(status)}"><span class="dot"></span>${esc(label)}</span>`;
  }

  function currentFocus() {
    const milestone = DATA.milestones.find((item) => item.status === 'active');
    if (!milestone) return null;
    const cards = DATA.cards.filter((card) => card.milestone === milestone.id && card.status !== 'done');
    const card = cards.find((item) => item.status === 'doing')
      || cards.find((item) => item.status === 'ready')
      || cards.find((item) => item.status === 'review')
      || cards.find((item) => item.status === 'backlog');
    return { milestone, card };
  }

  function relatedModules(id) {
    const related = new Set();
    DATA.relations.forEach((relation) => {
      if (relation.from === id) related.add(relation.to);
      if (relation.to === id) related.add(relation.from);
    });
    return related;
  }

  function cardMatches(card, query) {
    if (!query) return true;
    return [card.id, card.title, card.module, card.status, card.priority]
      .filter(Boolean)
      .join(' ')
      .toLowerCase()
      .includes(query);
  }

  function moduleMatches(module, query) {
    if (!query) return true;
    return [module.id, module.title, module.summary, module.layer, module.status]
      .filter(Boolean)
      .join(' ')
      .toLowerCase()
      .includes(query);
  }

  function docMatches(doc, query) {
    if (!query) return true;
    return [doc.id, doc.title, doc.kind, doc.status, doc.summary, doc.excerpt, doc.path]
      .filter(Boolean)
      .join(' ')
      .toLowerCase()
      .includes(query);
  }

  function eventMatches(event, query) {
    if (!query) return true;
    return [event.date, event.kind, event.title, event.detail, ...(event.refs || [])]
      .filter(Boolean)
      .join(' ')
      .toLowerCase()
      .includes(query);
  }

  function viewHead(kicker, title, subtitle, stats) {
    return `<div class="view-head">
      <div>
        <div class="kicker">${esc(kicker)}</div>
        <h1 class="view-title">${esc(title)}</h1>
        ${subtitle ? `<p class="view-sub">${esc(subtitle)}</p>` : ''}
      </div>
      ${stats ? `<div class="stats">${stats}</div>` : ''}
    </div>`;
  }

  function compareCards(a, b) {
    const priority = { P0: 0, P1: 1, P2: 2 };
    const pa = priority[a.priority] ?? 9;
    const pb = priority[b.priority] ?? 9;
    return pa - pb || a.id.localeCompare(b.id);
  }

  function renderTabs() {
    document.querySelectorAll('.tab').forEach((tab) => {
      const active = tab.dataset.view === state.view;
      tab.classList.toggle('active', active);
      if (active) tab.setAttribute('aria-current', 'page');
      else tab.removeAttribute('aria-current');
    });
  }

  function renderChrome() {
    document.getElementById('project-status').textContent = DATA.project.status;
    document.getElementById('module-count').textContent = DATA.modules.length;
    document.getElementById('doc-count').textContent = DATA.docs.length;

    const focus = currentFocus();
    let foot = '';
    if (focus?.card) {
      foot += `<div class="focus-block"><div class="focus-kicker">Current focus · ${esc(focus.milestone.id)}</div><button class="focus-card" type="button" data-card="${esc(focus.card.id)}"><span class="focus-id">${esc(focus.card.id)}</span><span class="focus-title">${esc(focus.card.title)}</span></button></div>`;
    } else if (focus) {
      foot += `<div class="focus-block"><div class="focus-kicker">Current focus · ${esc(focus.milestone.id)}</div><div class="focus-empty">${esc(focus.milestone.goal)}</div></div>`;
    }
    foot += `<div class="rail-meta"><span>${DATA.modules.length} modules · ${DATA.relations.length} relations</span><span>offline · schema v${DATA.meta.schema_version}</span></div>`;
    document.getElementById('rail-foot').innerHTML = foot;

    const placeholders = {
      arch: 'Filter modules',
      work: 'Filter cards',
      docs: 'Filter documents',
      decisions: 'Filter decisions',
    };
    search.placeholder = placeholders[state.view] || 'Filter';
  }

  function renderRail() {
    document.getElementById('map-nav').innerHTML = renderMapNav();
    document.getElementById('rail-docs').innerHTML = renderRailDocs();
  }

  function renderMapNav() {
    return DATA.layers.map((layer) => {
      const modules = DATA.modules.filter((module) => module.layer === layer.id);
      const rows = modules.map((module) => {
        const active = isModuleSelected(module.id);
        return `<button class="map-module${active ? ' active' : ''}" type="button" data-module="${esc(module.id)}" title="${esc(module.summary)}">
          <span class="map-dot ${esc(module.status)}"></span>
          <span class="map-title">${esc(module.title)}</span>
        </button>`;
      }).join('');
      return `<div class="map-layer">
        <div class="map-layer-head"><span class="map-layer-dot" style="--c:${layerColor(layer.id)}"></span><span>${esc(layer.name)}</span><span class="map-layer-n">${modules.length}</span></div>
        ${rows}
      </div>`;
    }).join('');
  }

  function renderRailDocs() {
    return DATA.docs.map((doc) => `<button class="rail-doc${isDocSelected(doc.id) ? ' active' : ''}" type="button" data-doc="${esc(doc.id)}" title="${esc(doc.title)}">
      <span class="rd-kind">${esc(docKind(doc.kind))}</span><span class="rd-title">${esc(doc.title)}</span>
    </button>`).join('');
  }

  function render() {
    renderTabs();
    renderChrome();
    renderRail();
    renderCanvas();
    renderDetails();
  }

  function renderCanvas() {
    const previousView = canvas.dataset.view || '';
    const previousScroll = canvas.scrollTop;
    let html = '';

    if (state.view === 'arch') html = archView();
    else if (state.view === 'work') html = workView();
    else if (state.view === 'docs') html = docsView();
    else html = decisionsView();

    canvas.innerHTML = html;
    canvas.dataset.view = state.view;
    canvas.scrollTop = previousView === state.view ? previousScroll : 0;

    if (state.view === 'arch') scheduleEdges();
  }

  function archView() {
    const query = state.query.toLowerCase();
    const selected = state.selection?.type === 'module' ? moduleById.get(state.selection.id) : null;
    const related = selected ? relatedModules(selected.id) : new Set();
    const stats = `<span><strong>${DATA.modules.length}</strong> modules</span><span class="sep">·</span><span>${DATA.layers.length} layers</span><span class="sep">·</span><span>${DATA.relations.length} relations</span>`;

    let html = viewHead(
      'Architecture',
      'How ni is shaped',
      '语义分层，不是目录树。选中模块聚焦它的依赖；状态只表示落地程度。',
      stats,
    );

    if (selected) {
      html += `<div class="focus-bar"><span class="focus-label">Focus</span><button class="focus-chip" type="button" data-close>${esc(selected.title)}<span aria-hidden="true">×</span></button></div>`;
    }

    html += `<div class="arch-canvas${selected ? ' has-focus' : ''}" id="arch-canvas"><svg class="edges" id="arch-edges" aria-hidden="true"></svg>`;

    DATA.layers.forEach((layer, index) => {
      const modules = DATA.modules.filter((module) => module.layer === layer.id);
      html += `<section class="arch-layer">
        <div class="layer-label"><div class="layer-index">${String(index + 1).padStart(2, '0')}</div><h2>${esc(layer.name)}</h2><p>${esc(layer.note)}</p></div>
        <div class="layer-cards">${modules.map((module) => moduleCard(module, query, selected?.id, related)).join('') || '<div class="empty">No modules yet.</div>'}</div>
      </section>`;
    });

    html += `</div>`;

    if (!DATA.modules.some((module) => moduleMatches(module, query))) {
      html += `<div class="empty" style="margin-top:12px">No modules match this filter.</div>`;
    }

    return html;
  }

  function moduleCard(module, query, selectedId, related) {
    const selected = module.id === selectedId;
    const isRelated = related.has(module.id);
    const muted = selectedId && !selected && !isRelated;
    const dim = query && !moduleMatches(module, query);
    const classes = [
      'module-card',
      module.status === 'planned' ? 'planned' : '',
      selected ? 'selected' : '',
      isRelated ? 'related' : '',
      muted ? 'muted' : '',
      dim ? 'dim' : '',
    ].filter(Boolean).join(' ');

    return `<button class="${classes}" type="button" data-module="${esc(module.id)}" style="--module-color:${layerColor(module.layer)}" aria-pressed="${selected}">
      <span class="module-head"><span>${esc(module.id)}</span><span class="module-status">${esc(STATUS_LABEL[module.status] || module.status)}</span></span>
      <span class="module-title">${esc(module.title)}</span>
      <span class="module-summary">${esc(module.summary)}</span>
      <span class="module-path">${esc(module.paths?.[0] || '—')}</span>
    </button>`;
  }

  function workView() {
    const query = state.query.toLowerCase();
    const cards = DATA.cards.filter((card) => {
      const inMilestone = state.milestone === 'all' || card.milestone === state.milestone;
      return inMilestone && cardMatches(card, query);
    });
    const blocked = cards.filter((card) => card.status === 'blocked');

    let html = viewHead(
      'Work',
      'Handoff, not a dashboard',
      '卡片是 agent 的交接面。进度在这里和 git 里，不在 Architecture 第一屏。',
    );

    html += `<div class="filters">${milestoneFilter()}</div>`;

    if (blocked.length) {
      html += `<div class="blocked-strip"><div class="blocked-label">Blocked</div><div class="blocked-cards">${blocked.map(cardHtml).join('')}</div></div>`;
    }

    html += `<div class="board">${STATUS_COLUMNS.map((status) => boardColumn(status, cards)).join('')}</div>`;

    if (!cards.length) {
      html += `<div class="empty" style="margin-top:12px">No cards match this filter.</div>`;
    }

    return html;
  }

  function milestoneFilter() {
    const items = [
      ...DATA.milestones.map((milestone) => ({ id: milestone.id, label: milestone.id, title: milestone.title })),
      { id: 'all', label: 'All', title: 'Every milestone' },
    ];
    return items.map((item) => `<button class="filter${state.milestone === item.id ? ' active' : ''}" type="button" data-milestone="${esc(item.id)}" title="${esc(item.title)}" aria-pressed="${state.milestone === item.id}">${esc(item.label)}</button>`).join('');
  }

  function boardColumn(status, cards) {
    const items = cards.filter((card) => card.status === status).sort(compareCards);
    return `<section class="column${items.length ? '' : ' empty'}">
      <div class="column-head"><span class="col-dot" style="--c:${STATUS_COLORS[status]}"></span>${esc(STATUS_LABEL[status])}</div>
      <div class="cards">${items.map(cardHtml).join('')}</div>
    </section>`;
  }

  function cardHtml(card) {
    const module = card.module ? moduleById.get(card.module) : null;
    const selected = isCardSelected(card.id);
    return `<button class="card${card.status === 'done' ? ' done' : ''}${card.status === 'blocked' ? ' blocked' : ''}${selected ? ' selected' : ''}" type="button" data-card="${esc(card.id)}" aria-pressed="${selected}">
      <span class="card-top"><span>${esc(card.id)}</span><span class="size">${esc(card.size)}</span></span>
      <span class="card-title">${esc(card.title)}</span>
      <span class="card-foot"><span>${module ? esc(module.title) : '—'}</span><span>${esc(fmtDate(card.updated))}</span></span>
    </button>`;
  }

  function docsView() {
    const query = state.query.toLowerCase();
    const docs = DATA.docs.filter((doc) => docMatches(doc, query));
    const adrCount = DATA.docs.filter((doc) => doc.kind === 'adr').length;
    const stats = `<span><strong>${DATA.docs.length}</strong> documents</span><span class="sep">·</span><span>${adrCount} ADRs</span>`;

    return viewHead(
      'Docs',
      'Source material',
      'ADR、架构说明和维护指南。点开在右栏阅读；深链可以直接分享。',
      stats,
    ) + `<div class="doc-grid">${docs.map(docCard).join('')}${docs.length ? '' : '<div class="empty">No documents match this filter.</div>'}</div>`;
  }

  function docCard(doc) {
    const selected = isDocSelected(doc.id);
    return `<button class="doc-card${selected ? ' selected' : ''}" type="button" data-doc="${esc(doc.id)}" aria-pressed="${selected}">
      <span class="doc-top"><span class="doc-kind">${esc(docKind(doc.kind))}</span>${doc.status ? `<span class="doc-status">${esc(doc.status)}</span>` : ''}</span>
      <span class="doc-title">${esc(doc.title)}</span>
      <span class="doc-excerpt">${esc(doc.excerpt)}</span>
      <span class="doc-path">${esc(doc.path)}</span>
    </button>`;
  }

  function decisionsView() {
    const query = state.query.toLowerCase();
    const adrs = DATA.docs.filter((doc) => doc.kind === 'adr' && docMatches(doc, query));
    const decisions = DATA.events
      .filter((event) => event.kind === 'decision' && eventMatches(event, query))
      .slice()
      .sort((a, b) => b.date.localeCompare(a.date));
    const stats = `<span><strong>${DATA.docs.filter((doc) => doc.kind === 'adr').length}</strong> ADRs</span><span class="sep">·</span><span>${DATA.events.filter((event) => event.kind === 'decision').length} decisions</span>`;

    let html = viewHead(
      'Decisions',
      'Why ni is shaped this way',
      'ADR 与关键决策。进度事件不进入这里。',
      stats,
    );

    html += `<h2 class="section-title">Architecture decision records</h2>`;
    html += `<div class="doc-grid">${adrs.map(docCard).join('')}${adrs.length ? '' : '<div class="empty">No ADRs match this filter.</div>'}</div>`;
    html += `<h2 class="section-title">Decision log</h2>`;
    html += `<div class="timeline">${decisions.map(decisionItem).join('')}${decisions.length ? '' : '<div class="empty">No decisions match this filter.</div>'}</div>`;

    return html;
  }

  function decisionItem(event) {
    const refs = (event.refs || []).map((ref) => {
      if (cardById.has(ref)) return `<button class="ref-chip" type="button" data-card="${esc(ref)}">${esc(ref)}</button>`;
      if (docById.has(ref)) return `<button class="ref-chip" type="button" data-doc="${esc(ref)}">${esc(ref)}</button>`;
      return `<span class="ref-chip">${esc(ref)}</span>`;
    }).join('');

    return `<article class="tl-item">
      <div><span class="tl-date">${esc(event.date)}</span><span class="tl-kind">${esc(event.kind)}</span></div>
      <h3 class="tl-title">${esc(event.title)}</h3>
      ${event.detail ? `<p class="tl-detail">${esc(event.detail)}</p>` : ''}
      ${refs ? `<div class="tl-refs">${refs}</div>` : ''}
    </article>`;
  }

  function detailsHead(kicker, closable = true) {
    return `<div class="details-head"><span class="kicker">${esc(kicker)}</span>${closable ? '<button class="close" type="button" data-close aria-label="Close details">×</button>' : ''}</div>`;
  }

  function metaItem(key, value) {
    return `<div class="meta-item"><div class="meta-k">${esc(key)}</div><div class="meta-v">${value}</div></div>`;
  }

  function renderDetails() {
    const key = state.selection ? `${state.selection.type}:${state.selection.id}` : 'overview';
    const changed = details.dataset.key !== key;
    let html = '';

    if (!state.selection) {
      html = overviewDetails();
    } else if (state.selection.type === 'card') {
      const card = cardById.get(state.selection.id);
      html = card ? cardDetails(card) : overviewDetails();
    } else if (state.selection.type === 'module') {
      const module = moduleById.get(state.selection.id);
      html = module ? moduleDetails(module) : overviewDetails();
    } else {
      const doc = docById.get(state.selection.id);
      html = doc ? docDetails(doc) : overviewDetails();
    }

    details.innerHTML = html;
    details.dataset.key = key;
    if (changed) details.scrollTop = 0;

    details.querySelectorAll('a[href^="http"]').forEach((link) => {
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
    });
  }

  function overviewDetails() {
    const focus = currentFocus();

    let html = detailsHead(`Project · ${DATA.project.name}`, false);
    html += `<h1 class="details-title">${esc(DATA.project.title)}</h1>`;
    html += `<p class="view-sub" style="font-size:12px">${esc(DATA.project.summary)}</p>`;
    html += `<div class="overview-stats">
      <div class="overview-stat"><strong>${DATA.modules.length}</strong><span>modules</span></div>
      <div class="overview-stat"><strong>${DATA.layers.length}</strong><span>layers</span></div>
      <div class="overview-stat"><strong>${DATA.relations.length}</strong><span>relations</span></div>
      <div class="overview-stat"><strong>${DATA.docs.length}</strong><span>docs</span></div>
    </div>`;

    html += `<div class="detail-section"><h2>How to read</h2><ul class="notes">
      <li>Architecture：先看层和依赖，再点模块看契约与源码。</li>
      <li>Work：需要接手任务时再看卡片；进度不在第一屏。</li>
      <li>Docs / Decisions：为什么这样切，以及被否决的方案。</li>
    </ul></div>`;

    if (focus?.card) {
      html += `<div class="detail-section"><h2>Current focus</h2><div class="path-list"><button class="path-chip" type="button" data-card="${esc(focus.card.id)}">${esc(focus.card.id)} · ${esc(focus.card.title)}</button></div></div>`;
    }

    html += `<div class="detail-section"><h2>Read next</h2><div class="path-list">
      <button class="path-chip" type="button" data-view="arch">Architecture map</button>
      <button class="path-chip" type="button" data-doc="architecture">Architecture doc</button>
      <button class="path-chip" type="button" data-doc="adr-0001">ADR-0001 · Rust</button>
      <button class="path-chip" type="button" data-doc="adr-0003">ADR-0003 · architecture-first</button>
    </div></div>`;

    return html;
  }

  function cardDetails(card) {
    const module = card.module ? moduleById.get(card.module) : null;
    const milestone = milestoneById.get(card.milestone);
    const docs = (card.docs || []).map((id) => docById.get(id)).filter(Boolean);

    let html = detailsHead(`Work · ${card.id}`);
    html += `<h1 class="details-title">${esc(card.title)}</h1>`;
    html += `<div class="badges">${statusBadge(card.status)}${card.priority ? `<span class="badge">${esc(card.priority)}</span>` : ''}<span class="badge">${esc(card.size)}</span></div>`;

    if (card.status === 'blocked' && card.blocked_reason) {
      html += `<div class="callout">Blocked · ${esc(card.blocked_reason)}</div>`;
    }

    html += `<div class="meta-grid">
      ${metaItem('Milestone', milestone ? `${esc(milestone.id)} · ${esc(milestone.title)}` : esc(card.milestone))}
      ${metaItem('Module', module ? `<button class="inline-link" type="button" data-module="${esc(module.id)}">${esc(module.title)}</button>` : '—')}
      ${metaItem('Updated', `<span class="mono">${esc(card.updated)}</span>`)}
      ${metaItem('Completed', card.completed ? `<span class="mono">${esc(card.completed)}</span>` : '—')}
    </div>`;

    if (card.depends_on?.length) {
      html += `<div class="detail-section"><h2>Depends on</h2><div class="path-list">${card.depends_on.map((id) => `<button class="path-chip" type="button" data-card="${esc(id)}">${esc(id)} · ${esc(cardById.get(id)?.title || '')}</button>`).join('')}</div></div>`;
    }

    html += `<div class="md">${card.body_html}</div>`;

    if (docs.length) {
      html += `<div class="detail-section"><h2>Documents</h2><div class="path-list">${docs.map((doc) => `<button class="path-chip" type="button" data-doc="${esc(doc.id)}">${esc(doc.title)}</button>`).join('')}</div></div>`;
    }

    html += `<p class="hint">${esc(card.path)}</p>`;
    return html;
  }

  function moduleDetails(module) {
    let html = detailsHead(`Module · ${module.id}`);
    html += `<h1 class="details-title">${esc(module.title)}</h1>`;
    html += `<div class="badges">${statusBadge(module.status)}<span class="badge">${esc(layerName(module.layer))}</span></div>`;
    html += `<p class="view-sub" style="font-size:12px">${esc(module.summary)}</p>`;

    if (module.contract) {
      html += `<div class="detail-section"><h2>Contract</h2><p>${esc(module.contract)}</p></div>`;
    }

    if (module.notes?.length) {
      html += `<div class="detail-section"><h2>Notes</h2><ul class="notes">${module.notes.map((note) => `<li>${esc(note)}</li>`).join('')}</ul></div>`;
    }

    const incoming = DATA.relations.filter((relation) => relation.to === module.id);
    const outgoing = DATA.relations.filter((relation) => relation.from === module.id);
    if (incoming.length || outgoing.length) {
      const rows = [
        ...incoming.map((relation) => relationRow(relation, 'in')),
        ...outgoing.map((relation) => relationRow(relation, 'out')),
      ].join('');
      html += `<div class="detail-section"><h2>Relations</h2><div class="relation-list">${rows}</div></div>`;
    }

    if (module.paths?.length) {
      html += `<div class="detail-section"><h2>Owned paths</h2><div class="path-list">${module.paths.map((path) => `<span class="path-chip">${esc(path)}</span>`).join('')}</div></div>`;
    }

    html += `<div class="detail-section"><h2>Source</h2>${sourceView(module)}</div>`;
    return html;
  }

  function relationRow(relation, direction) {
    const other = direction === 'out' ? relation.to : relation.from;
    return `<div class="relation"><span class="arrow">${direction === 'out' ? '→' : '←'}</span><button type="button" data-module="${esc(other)}">${esc(moduleTitle(other))}</button><span>${esc(relation.label || '')}</span></div>`;
  }

  function sourceView(module) {
    if (!module.sources?.length) {
      return '<div class="empty">Planned module — no source yet. The contract above is the source of truth.</div>';
    }

    const index = Math.min(state.sourceIndex, module.sources.length - 1);
    const source = module.sources[index];
    const tabs = module.sources.map((item, itemIndex) => `<button class="source-tab${itemIndex === index ? ' active' : ''}" type="button" data-source="${itemIndex}" title="${esc(item.path)}">${esc(item.path.split('/').pop())}</button>`).join('');
    return `<div class="source-tabs">${tabs}</div>${sourceBox(source)}`;
  }

  function sourceBox(source) {
    const lines = source.text.replace(/\n$/, '').split('\n');
    const body = lines.map((line, index) => `<span class="source-line"><span class="ln">${index + 1}</span><span class="lc">${esc(line) || ' '}</span></span>`).join('');
    return `<div class="source-box" role="region" aria-label="${esc(source.path)}">${body}</div>${source.truncated ? '<p class="hint">Truncated. Open the file in the repository for the full source.</p>' : ''}`;
  }

  function docDetails(doc) {
    let html = detailsHead(`${docKind(doc.kind)} · ${doc.id}`);
    html += `<h1 class="details-title">${esc(doc.title)}</h1>`;
    html += `<div class="badges">${doc.status ? `<span class="badge">${esc(doc.status)}</span>` : ''}<span class="badge">${esc(docKind(doc.kind))}</span></div>`;
    html += `<div class="md">${doc.body_html}</div>`;
    html += `<p class="hint">${esc(doc.path)}</p>`;
    return html;
  }

  function openCard(id) {
    const card = cardById.get(id);
    if (!card) return;
    state.view = 'work';
    state.milestone = card.milestone;
    state.selection = { type: 'card', id };
    state.query = '';
    search.value = '';
    render();
    syncHash();
  }

  function openModule(id) {
    if (!moduleById.has(id)) return;
    state.view = 'arch';
    state.selection = { type: 'module', id };
    state.sourceIndex = 0;
    state.query = '';
    search.value = '';
    render();
    syncHash();
  }

  function openDoc(id) {
    if (!docById.has(id)) return;
    state.view = 'docs';
    state.selection = { type: 'doc', id };
    state.query = '';
    search.value = '';
    render();
    syncHash();
  }

  function setView(view) {
    const normalized = normalizeView(view);
    if (!VIEWS.includes(normalized)) return;
    state.view = normalized;
    state.selection = null;
    state.query = '';
    search.value = '';
    render();
    syncHash();
  }

  function setMilestone(id) {
    state.view = 'work';
    state.milestone = id;
    state.selection = null;
    state.query = '';
    search.value = '';
    render();
    syncHash();
  }

  function clearSelection() {
    state.selection = null;
    render();
    syncHash();
  }

  function syncHash() {
    let hash = `#/${state.view}`;
    if (state.selection) hash += `/${encodeURIComponent(state.selection.id)}`;
    if (location.hash === hash) return;
    try {
      history.replaceState(null, '', hash);
    } catch {
      location.hash = hash;
    }
  }

  function applyHash() {
    const raw = location.hash.replace(/^#\/?/, '');
    if (!raw) {
      state.view = 'arch';
      state.selection = null;
      render();
      syncHash();
      return;
    }

    const parts = raw.split('/');
    const view = normalizeView(parts[0]);
    const id = parts.length > 1 ? decodeURIComponent(parts.slice(1).join('/')) : '';

    state.view = VIEWS.includes(view) ? view : 'arch';
    state.selection = null;

    if (id) {
      if (state.view === 'arch' && moduleById.has(id)) {
        state.selection = { type: 'module', id };
        state.sourceIndex = 0;
      } else if (state.view === 'work' && cardById.has(id)) {
        state.selection = { type: 'card', id };
        state.milestone = cardById.get(id).milestone;
      } else if (state.view === 'docs' && docById.has(id)) {
        state.selection = { type: 'doc', id };
      }
    }

    state.query = '';
    search.value = '';
    render();
    syncHash();
  }

  function scheduleEdges() {
    cancelAnimationFrame(edgeFrame);
    edgeFrame = requestAnimationFrame(() => {
      edgeFrame = requestAnimationFrame(drawEdges);
    });
  }

  function drawEdges() {
    const arch = document.getElementById('arch-canvas');
    const svg = document.getElementById('arch-edges');
    if (!arch || !svg) return;

    const rect = arch.getBoundingClientRect();
    const width = Math.max(arch.scrollWidth, arch.clientWidth);
    const height = Math.max(arch.scrollHeight, arch.clientHeight);
    svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
    svg.setAttribute('width', width);
    svg.setAttribute('height', height);

    const defs = '<defs><marker id="ni-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="arrow-head" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="ni-arrow-active" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="arrow-head-active" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs>';
    const parts = [defs];
    const selectedModule = state.selection?.type === 'module' ? state.selection.id : null;

    for (const relation of DATA.relations) {
      const source = arch.querySelector(`[data-module="${cssEscape(relation.from)}"]`);
      const target = arch.querySelector(`[data-module="${cssEscape(relation.to)}"]`);
      if (!source || !target || source.classList.contains('dim') || target.classList.contains('dim')) continue;

      const a = source.getBoundingClientRect();
      const b = target.getBoundingClientRect();
      if (a.width === 0 || b.width === 0) continue;

      let x1;
      let y1;
      let x2;
      let y2;
      let path;

      if (b.top > a.bottom + 6) {
        x1 = a.left + a.width / 2 - rect.left;
        y1 = a.bottom - rect.top;
        x2 = b.left + b.width / 2 - rect.left;
        y2 = b.top - rect.top;
        const midY = (y1 + y2) / 2;
        path = `M${x1},${y1} C${x1},${midY} ${x2},${midY} ${x2},${y2}`;
      } else if (b.bottom < a.top - 6) {
        x1 = a.left + a.width / 2 - rect.left;
        y1 = a.top - rect.top;
        x2 = b.left + b.width / 2 - rect.left;
        y2 = b.bottom - rect.top;
        const midY = (y1 + y2) / 2;
        path = `M${x1},${y1} C${x1},${midY} ${x2},${midY} ${x2},${y2}`;
      } else {
        const toRight = b.left >= a.left;
        x1 = (toRight ? a.right : a.left) - rect.left;
        y1 = a.top + a.height / 2 - rect.top;
        x2 = (toRight ? b.left : b.right) - rect.left;
        y2 = b.top + b.height / 2 - rect.top;
        const midX = (x1 + x2) / 2;
        path = `M${x1},${y1} C${midX},${y1} ${midX},${y2} ${x2},${y2}`;
      }

      const connected = selectedModule && (relation.from === selectedModule || relation.to === selectedModule);
      const className = connected ? 'edge edge-active' : 'edge';
      const marker = connected ? 'ni-arrow-active' : 'ni-arrow';
      const title = `${relation.from} → ${relation.to}${relation.label ? ` · ${relation.label}` : ''}`;
      parts.push(`<path class="${className}" d="${path}" marker-end="url(#${marker})"><title>${esc(title)}</title></path>`);

    }

    svg.innerHTML = parts.join('');
  }

  function cssEscape(value) {
    if (window.CSS?.escape) return CSS.escape(value);
    return String(value).replace(/["\\]/g, '\\$&');
  }

  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
  }

  function bindEvents() {
    document.addEventListener('click', (event) => {
      if (!(event.target instanceof Element)) return;
      const target = event.target.closest('[data-view],[data-milestone],[data-card],[data-module],[data-doc],[data-source],[data-close]');
      if (!target) return;

      if (target.dataset.view) {
        event.preventDefault();
        setView(target.dataset.view);
        return;
      }
      if (target.dataset.milestone) {
        setMilestone(target.dataset.milestone);
        return;
      }
      if (target.dataset.card) {
        openCard(target.dataset.card);
        return;
      }
      if (target.dataset.module) {
        openModule(target.dataset.module);
        return;
      }
      if (target.dataset.doc) {
        openDoc(target.dataset.doc);
        return;
      }
      if (target.hasAttribute('data-source')) {
        state.sourceIndex = Number(target.dataset.source) || 0;
        renderDetails();
        return;
      }
      if (target.hasAttribute('data-close')) {
        clearSelection();
      }
    });

    search.addEventListener('input', () => {
      state.query = search.value.trim().toLowerCase();
      renderCanvas();
    });

    themeButton.addEventListener('click', () => {
      const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      applyTheme(next);
      try {
        localStorage.setItem('ni-theme', next);
      } catch {
        /* file:// or private mode */
      }
      scheduleEdges();
    });

    document.addEventListener('keydown', (event) => {
      const typing = document.activeElement instanceof HTMLInputElement || document.activeElement instanceof HTMLTextAreaElement;

      if (event.key === '/' && !typing) {
        event.preventDefault();
        search.focus();
        search.select();
        return;
      }

      if (event.key === 'Escape') {
        if (document.activeElement === search) {
          search.value = '';
          state.query = '';
          search.blur();
          renderCanvas();
        } else if (state.selection) {
          clearSelection();
        }
        return;
      }

      if (!typing && ['1', '2', '3', '4'].includes(event.key)) {
        setView(VIEWS[Number(event.key) - 1]);
      }
    });

    window.addEventListener('hashchange', applyHash);
    window.addEventListener('resize', scheduleEdges);

    if (document.fonts?.ready) {
      document.fonts.ready.then(scheduleEdges).catch(() => {});
    }
  }

  function init() {
    const saved = (() => {
      try {
        return localStorage.getItem('ni-theme');
      } catch {
        return null;
      }
    })();
    const preferred = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    applyTheme(saved || preferred);
    bindEvents();

    if (location.hash) {
      applyHash();
    } else {
      render();
      syncHash();
    }
  }

  init();
})();

</script>
</body>
</html>
