  --sans: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
    "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Hiragino Sans GB",
    "Noto Sans CJK SC", "Noto Sans SC", "Microsoft YaHei UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", "SF Mono", ui-monospace, SFMono-Regular,
    "Cascadia Code", Menlo, Monaco, Consolas, "Liberation Mono",
    "Noto Sans Mono CJK SC", monospace;
}

[data-theme="dark"] {
  --bg: #090b0e;
  --bg-subtle: #0c0f14;
  --surface: #10141b;
  --surface-2: #161b24;
  --surface-3: #1d2430;
  --ink: #eef2f6;
  --ink-secondary: #ced6e0;
  --muted: #97a3b1;
  --faint: #677483;
  --line: rgba(226, 236, 248, 0.08);
  --line-strong: rgba(226, 236, 248, 0.16);
  --accent: #38d399;
  --accent-2: #58a6ff;
  --accent-soft: rgba(56, 211, 153, 0.11);
  --accent-border: rgba(56, 211, 153, 0.42);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.32), 0 4px 12px rgba(0, 0, 0, 0.22);
  --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.42), 0 2px 6px rgba(0, 0, 0, 0.28);

  --code-bg: #080a0d;
  --code-head: #0d1016;
  --code-ink: #dfe6ee;
  --code-line: #1b222c;
  --code-muted: #586575;

  --st-backlog: #7e8b98;
  --st-ready: #58a6ff;
  --st-doing: #e39c3b;
  --st-review: #a88bfa;
  --st-done: #3fb980;
  --st-blocked: #f4665c;

  --layer-interface: #5899f8;
  --layer-engine: #e08b44;
  --layer-adapters: #9d7ef2;
  --layer-state: #46bd84;
  --layer-engineering: #8291a0;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  height: 100%;
  background: var(--bg);
}

body {
  color: var(--ink);
  font-family: var(--sans);
  font-size: 13px;
  line-height: 1.55;
  font-feature-settings: "cv02", "cv03", "cv04", "cv11";
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  overflow: hidden;
}

button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
}

a {
  color: inherit;
  text-decoration: none;
}

input {
  font: inherit;
}

::selection {
  background: var(--accent-soft);
  color: var(--ink);
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

* {
  scrollbar-width: thin;
  scrollbar-color: var(--line-strong) transparent;
}

*::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}

*::-webkit-scrollbar-track {
  background: transparent;
}

*::-webkit-scrollbar-thumb {
  background: var(--line-strong);
  border-radius: 99px;
}

/* ---------- topbar ---------- */

.topbar {
  height: 52px;
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 0 18px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
  position: relative;
  z-index: 30;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.brand-badge {
  width: 30px;
  height: 30px;
  flex: none;
  display: grid;
  place-items: center;
  overflow: hidden;
  border-radius: 8px;
  border: 1px solid var(--line-strong);
  background: #080a0e;
}

.brand-badge img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
}

.brand-text {
  display: flex;
  flex-direction: column;
  gap: 2px;
  line-height: 1.05;
}

.brand-name {
  font-size: 14px;
  font-weight: 650;
  letter-spacing: -0.025em;
  color: var(--ink);
}

.brand-sub {
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--faint);
}

.brand-divider {
  width: 1px;
  height: 18px;
  background: var(--line);
  margin: 0 2px;
}

.brand-tag {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.tabs {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface-2);
  flex: none;
}

.tab {
  position: relative;
  padding: 4px 12px;
  border-radius: 5px;
  font-size: 12px;
  font-weight: 500;
  color: var(--muted);
  white-space: nowrap;
  transition: color 0.14s ease, background 0.14s ease, box-shadow 0.14s ease;
}

.tab:hover {
  color: var(--ink);
}

.tab.active {
  background: var(--surface);
  color: var(--ink);
  font-weight: 600;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
}

.top-actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
}

.search {
  display: flex;
  align-items: center;
  gap: 7px;
  width: 210px;
  height: 30px;
  padding: 0 8px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--surface-2);
  transition: border-color 0.14s ease, box-shadow 0.14s ease, background 0.14s ease;
}

.search:focus-within {
  background: var(--surface);
  border-color: var(--accent-border);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.search-key {
  width: 17px;
  height: 17px;
  border: 1px solid var(--line-strong);
  border-radius: 4px;
  display: grid;
  place-items: center;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--faint);
  background: var(--surface);
  flex: none;
}

.search input {
  width: 100%;
  border: 0;
  outline: 0;
  background: none;
  color: var(--ink);
  font-size: 12px;
}

.search input::placeholder {
  color: var(--faint);
}

.search input::-webkit-search-cancel-button {
  display: none;
}

.status-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 30px;
  padding: 0 10px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--surface-2);
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: 0.03em;
  color: var(--ink-secondary);
  white-space: nowrap;
}

.status-chip::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
}

.icon-button {
  width: 30px;
  height: 30px;
  border: 1px solid var(--line);
  border-radius: 7px;
  display: grid;
  place-items: center;
  color: var(--muted);
  background: var(--surface-2);
  transition: background 0.14s ease, color 0.14s ease, border-color 0.14s ease;
}

.icon-button:hover {
  background: var(--surface-3);
  border-color: var(--line-strong);
  color: var(--ink);
}

.theme-icon {
  font-size: 13px;
  line-height: 1;
}

[data-theme="dark"] .theme-sun,
[data-theme="light"] .theme-moon {
  display: none;
}

/* ---------- shell ---------- */

.shell {
  height: calc(100vh - 52px);
  display: grid;
  grid-template-columns: 228px minmax(0, 1fr) 396px;
}

/* ---------- left rail ---------- */

.rail {
  border-right: 1px solid var(--line);
  background: var(--surface);
  padding: 14px 12px 12px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 18px;
  min-width: 0;
}

.rail-section {
  min-width: 0;
}

.rail-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 6px 6px;
}

.rail-head h2 {
  margin: 0;
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--faint);
}

.rail-head span {
  font-family: var(--mono);
  font-size: 10.5px;
  font-variant-numeric: tabular-nums;
  color: var(--faint);
}

.map-nav {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.map-layer {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.map-layer-head {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 6px 3px;
  color: var(--muted);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.04em;
}

.map-layer-dot {
  width: 6px;
  height: 6px;
  border-radius: 2px;
  background: var(--c, var(--faint));
  flex: none;
}

.map-layer-n {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 400;
  font-variant-numeric: tabular-nums;
  color: var(--faint);
}

.map-module {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 4.5px 8px;
  border: 1px solid transparent;
  border-radius: 6px;
  text-align: left;
  transition: background 0.12s ease, color 0.12s ease;
}

.map-module:hover {
  background: var(--surface-2);
}

.map-module.active {
  background: var(--surface-2);
  border-color: var(--line);
  box-shadow: inset 2px 0 0 var(--accent);
}

.map-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--faint);
  flex: none;
}

.map-dot.active,
.map-dot.done {
  background: var(--st-done);
}

.map-dot.planned {
  background: transparent;
  border: 1px solid var(--faint);
}

.map-title {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 12px;
  color: var(--muted);
}

.map-module:hover .map-title,
.map-module.active .map-title {
  color: var(--ink);
  font-weight: 500;
}

.rail-doc-list {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.rail-doc {
  display: flex;
  align-items: center;
  gap: 7px;
  width: 100%;
  min-width: 0;
  text-align: left;
  padding: 4.5px 6px;
  border-radius: 6px;
  transition: background 0.12s ease;
}

.rail-doc:hover {
  background: var(--surface-2);
}

.rail-doc.active {
  background: var(--surface-2);
  box-shadow: inset 2px 0 0 var(--accent);
}

.rd-kind {
  flex: none;
  font-family: var(--mono);
  font-size: 9.5px;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 0.5px 4.5px;
}

.rd-kind-adr {
  color: var(--accent);
  border-color: color-mix(in srgb, var(--accent) 28%, var(--line));
}

.rd-title {
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.rail-doc:hover .rd-title,
.rail-doc.active .rd-title {
  color: var(--ink);
  font-weight: 500;
}

.rail-foot {
  margin-top: auto;
  padding: 12px 4px 2px;
  border-top: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.focus-block {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.focus-kicker {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--faint);
}

.focus-card {
  display: flex;
  flex-direction: column;
  gap: 3px;
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-left: 2px solid var(--accent);
  border-radius: 6px;
  background: var(--surface-2);
  text-align: left;
  transition: border-color 0.14s ease, background 0.14s ease;
}

.focus-card:hover {
  border-color: var(--line-strong);
  border-left-color: var(--accent);
  background: var(--surface-3);
}

.focus-id {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--faint);
}

.focus-title {
  font-size: 11.5px;
  font-weight: 500;
  line-height: 1.35;
  color: var(--ink);
}

.focus-empty {
  font-size: 11.5px;
  line-height: 1.45;
  color: var(--muted);
}

.rail-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 0 2px;
  font-family: var(--mono);
  font-size: 10.5px;
  font-variant-numeric: tabular-nums;
  color: var(--faint);
}

/* ---------- center canvas ---------- */

.canvas {
  overflow-y: auto;
  overflow-x: hidden;
  padding: 16px 24px 32px;
  background: var(--bg);
  min-width: 0;
}

.view-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
  padding-bottom: 11px;
  margin-bottom: 12px;
  border-bottom: 1px solid var(--line);
}

.view-head-main {
  min-width: 0;
}

.kicker {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
}

.view-title {
  margin: 3px 0 4px;
  font-family: var(--sans);
  font-size: 21px;
  font-weight: 650;
  line-height: 1.25;
  letter-spacing: -0.025em;
  color: var(--ink);
}

.view-sub {
  max-width: 68ch;
  margin: 0;
  font-size: 12.5px;
  line-height: 1.5;
  color: var(--muted);
}

.stats {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 6px;
  flex: none;
}

.stats span {
  display: inline-flex;
  align-items: baseline;
  gap: 4px;
  padding: 3.5px 9px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--surface);
  font-family: var(--mono);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  color: var(--muted);
  white-space: nowrap;
}

.stats strong {
  color: var(--ink);
  font-weight: 600;
}

.stats .sep {
  display: none;
}

.section-title {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 24px 0 12px;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.section-title:first-of-type {
  margin-top: 0;
}

.section-title::before {
  content: "";
  width: 8px;
  height: 2px;
  border-radius: 1px;
  background: var(--accent);
}

/* ---------- architecture view ---------- */

.focus-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: -4px 0 12px;
}

.focus-label {
  color: var(--faint);
  font-family: var(--mono);
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.focus-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 9px;
  border: 1px solid var(--accent-border);
  border-radius: 6px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 11.5px;
  font-weight: 500;
}

.focus-chip:hover {
  background: color-mix(in srgb, var(--accent) 18%, transparent);
}

.arch-canvas {
  position: relative;
  min-width: 0;
  padding: 2px 0 12px;
}

.edges {
  position: absolute;
  left: 0;
  top: 0;
  overflow: visible;
  pointer-events: none;
  z-index: 0;
}

.edges-fg {
  z-index: 2;
}

.edge {
  fill: none;
  stroke: var(--line-strong);
  stroke-width: 1.25;
  opacity: 0.55;
  transition: opacity 0.15s ease, stroke 0.15s ease;
}

.edge-active {
  stroke: var(--accent);
  stroke-width: 1.75;
  opacity: 1;
}

.edge-badge-bg {
  fill: var(--surface-2);
  stroke: var(--accent-border);
  stroke-width: 1;
}

.edge-label {
  fill: var(--accent);
  font-family: var(--mono);
  font-size: 9.5px;
  font-weight: 600;
}

.arrow-head {
  fill: var(--line-strong);
}

.arrow-head-active {
  fill: var(--accent);
}

.arch-canvas.has-focus .edge:not(.edge-active) {
  opacity: 0.12;
}

.arch-layer {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: 132px minmax(0, 1fr);
  gap: 16px;
  padding: 8px 0 10px;
  border-bottom: 1px dashed var(--line);
}

.arch-layer:first-of-type {
  padding-top: 2px;
}

.arch-layer:last-of-type {
  border-bottom: 0;
  padding-bottom: 2px;
}

.layer-label {
  padding-top: 4px;
}

.layer-head-row {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-bottom: 4px;
}

.layer-index {
  display: inline-grid;
  place-items: center;
  padding: 1px 5px;
  border-radius: 4px;
  background: color-mix(in srgb, var(--layer-color, var(--faint)) 14%, transparent);
  border: 1px solid color-mix(in srgb, var(--layer-color, var(--faint)) 34%, transparent);
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--layer-color, var(--muted));
}

.layer-label h2 {
  margin: 0;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--ink);
}

.layer-label p {
  margin: 0;
  font-size: 11.5px;
  line-height: 1.45;
  color: var(--faint);
}

.layer-cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(186px, 1fr));
  gap: 8px;
  align-items: stretch;
}

.module-card {
  position: relative;
  width: 100%;
  display: flex;
  flex-direction: column;
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--line);
  border-top: 2px solid var(--module-color, var(--faint));
  border-radius: 8px;
  padding: 8px 11px 7px;
  box-shadow: var(--shadow-sm);
  transition: border-color 0.14s ease, transform 0.14s ease, box-shadow 0.14s ease, opacity 0.14s ease;
}

.module-card:hover {
  border-color: var(--line-strong);
  border-top-color: var(--module-color, var(--faint));
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}

.module-card.selected {
  border-color: var(--accent);
  border-top-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-soft), var(--shadow-md);
}

.module-card.related {
  border-color: color-mix(in srgb, var(--accent) 48%, var(--line));
  border-top-color: var(--module-color, var(--faint));
}

.module-card.planned {
  background: color-mix(in srgb, var(--surface) 65%, transparent);
  border-style: dashed;
  border-top-style: solid;
}

.module-card.dim {
  opacity: 0.2;
  pointer-events: none;
}

.module-card.muted {
  opacity: 0.32;
}

.module-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  color: var(--faint);
}

.module-status {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: var(--muted);
}

.module-status::before {
  content: "";
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--module-color, var(--faint));
}

.module-title {
  display: block;
  margin: 3px 0 2px;
  font-size: 13px;
  font-weight: 600;
  line-height: 1.25;
  letter-spacing: -0.01em;
  color: var(--ink);
}

.module-summary {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin: 0 0 6px;
  font-size: 11.5px;
  line-height: 1.44;
  color: var(--muted);
}

.module-path {
  display: block;
  margin-top: auto;
  padding-top: 5px;
  border-top: 1px solid var(--line);
  font-family: var(--mono);
  font-size: 10px;
  color: var(--faint);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ---------- work view ---------- */

.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: -2px 0 14px;
}

.filter {
  padding: 4.5px 11px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--surface);
  color: var(--muted);
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  transition: border-color 0.14s ease, color 0.14s ease, background 0.14s ease;
}

.filter:hover {
  border-color: var(--line-strong);
  color: var(--ink);
}

.filter.active {
  background: var(--accent-soft);
  border-color: var(--accent-border);
  color: var(--accent);
  font-weight: 600;
}

.blocked-strip {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  border: 1px solid color-mix(in srgb, var(--st-blocked) 38%, var(--line));
  background: color-mix(in srgb, var(--st-blocked) 6%, transparent);
  border-radius: 8px;
  padding: 10px 12px;
  margin-bottom: 14px;
}

.blocked-label {
  padding-top: 6px;
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--st-blocked);
  white-space: nowrap;
}

.blocked-cards {
  display: flex;
  flex: 1;
  flex-wrap: wrap;
  gap: 8px;
}

.blocked-cards .card {
  width: 220px;
}

.board {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  width: 100%;
  min-width: 0;
}

.column {
  flex: 1.35 1 0;
  min-width: 124px;
  background: color-mix(in srgb, var(--surface-2) 65%, transparent);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 8px;
  min-height: 140px;
}

.column.empty {
  flex: 0.72 1 0;
  min-width: 86px;
}

.column-head {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 2px 4px 8px;
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
}

.col-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--c, var(--st-backlog));
  flex: none;
}

.cards {
  display: flex;
  flex-direction: column;
  gap: 7px;
  min-height: 44px;
}

.column.empty .cards::after {
  content: "No cards";
  display: block;
  padding: 10px 4px;
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--faint);
}

.card {
  width: 100%;
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 9px 10px;
  box-shadow: var(--shadow-sm);
  transition: border-color 0.14s ease, transform 0.14s ease, box-shadow 0.14s ease;
}

.card:hover {
  border-color: var(--line-strong);
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}

.card.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-soft);
}

.card.done {
  opacity: 0.76;
}

.card.done .card-title {
  color: var(--ink-secondary);
}

.card.blocked {
  border-left: 2px solid var(--st-blocked);
}

.card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--faint);
}

.card-badges {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.prio,
.size {
  font-family: var(--mono);
  font-size: 9.5px;
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 0 4px;
  color: var(--muted);
  background: var(--surface-2);
}

.prio-p0 {
  color: var(--st-blocked);
  border-color: color-mix(in srgb, var(--st-blocked) 35%, var(--line));
}

.card-title {
  display: block;
  margin: 6px 0 8px;
  font-size: 12.5px;
  font-weight: 500;
  line-height: 1.42;
  color: var(--ink);
}

.card-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  font-family: var(--mono);
  font-size: 10px;
  font-variant-numeric: tabular-nums;
  color: var(--faint);
}

.card-foot span:first-child {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ---------- docs view ---------- */

.doc-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(256px, 1fr));
  gap: 10px;
}

.doc-card {
  display: flex;
  flex-direction: column;
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 13px 14px 11px;
  box-shadow: var(--shadow-sm);
  transition: border-color 0.14s ease, transform 0.14s ease, box-shadow 0.14s ease;
}

.doc-card:hover {
  border-color: var(--line-strong);
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}

.doc-card.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-soft), var(--shadow-md);
}

.doc-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  margin-bottom: 7px;
}

.doc-kind {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 1px 5px;
  color: var(--muted);
  background: var(--surface-2);
}

.doc-kind-adr {
  color: var(--accent);
  border-color: color-mix(in srgb, var(--accent) 30%, var(--line));
  background: var(--accent-soft);
}

.doc-status {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--st-done);
}

.doc-title {
  display: block;
  margin: 0 0 6px;
  font-size: 13.5px;
  font-weight: 600;
  line-height: 1.35;
  letter-spacing: -0.01em;
  color: var(--ink);
}

.doc-excerpt {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
  overflow: hidden;
  margin: 0 0 10px;
  font-size: 12px;
  line-height: 1.55;
  color: var(--muted);
}

.doc-path {
  display: block;
  margin-top: auto;
  padding-top: 7px;
  border-top: 1px solid var(--line);
  font-family: var(--mono);
  font-size: 10px;
  color: var(--faint);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ---------- decisions timeline ---------- */

.timeline {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-width: 820px;
  padding-left: 18px;
}

.timeline::before {
  content: "";
  position: absolute;
  left: 4px;
  top: 8px;
  bottom: 8px;
  width: 1px;
  background: var(--line-strong);
}

.tl-item {
  position: relative;
  padding: 13px 15px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  box-shadow: var(--shadow-sm);
}

.tl-item::before {
  content: "";
  position: absolute;
  left: -17.5px;
  top: 17px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 3px var(--bg);
}

.tl-head {
  display: flex;
  align-items: center;
  gap: 8px;
}

.tl-date {
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  color: var(--accent);
}

.tl-kind {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--faint);
}

.tl-title {
  margin: 5px 0 5px;
  font-size: 13.5px;
  font-weight: 600;
  line-height: 1.35;
  color: var(--ink);
}

.tl-detail {
  max-width: 68ch;
  margin: 0 0 9px;
  font-size: 12px;
  line-height: 1.6;
  color: var(--muted);
}

.tl-refs {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.ref-chip {
  font-family: var(--mono);
  font-size: 10.5px;
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 2px 7px;
  background: var(--surface-2);
  color: var(--muted);
  transition: border-color 0.12s ease, color 0.12s ease;
}

button.ref-chip:hover {
  color: var(--ink);
  border-color: var(--line-strong);
  background: var(--surface-3);
}

/* ---------- right details inspector ---------- */

.details {
  border-left: 1px solid var(--line);
  background: var(--surface);
  overflow-y: auto;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.details-head {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 44px;
  padding: 10px 20px;
  border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(12px);
}

.details-body {
  padding: 18px 20px 44px;
}

.close {
  width: 24px;
  height: 24px;
  border: 1px solid var(--line);
  border-radius: 6px;
  display: grid;
  place-items: center;
  color: var(--muted);
  background: var(--surface-2);
  font-size: 14px;
  line-height: 1;
  transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
}

.close:hover {
  background: var(--surface-3);
  border-color: var(--line-strong);
  color: var(--ink);
}

.details-title {
  margin: 0 0 8px;
  font-family: var(--sans);
  font-size: 18.5px;
  font-weight: 650;
  line-height: 1.3;
  letter-spacing: -0.02em;
  color: var(--ink);
}

.details-lead {
  margin: 0 0 14px;
  font-size: 12.5px;
  line-height: 1.62;
  color: var(--muted);
}

.badges {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 12px;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 2px 7px;
  background: var(--surface-2);
  color: var(--muted);
}

.badge .dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: currentColor;
}

.badge-backlog { color: var(--st-backlog); }
.badge-ready { color: var(--st-ready); }
.badge-doing,
.badge-active { color: var(--st-doing); }
.badge-review { color: var(--st-review); }
.badge-done,
.badge-accepted,
.badge-living { color: var(--st-done); }
.badge-blocked { color: var(--st-blocked); }
.badge-planned { color: var(--faint); }

.overview-stats {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 1px;
  margin: 14px 0 18px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--line);
  overflow: hidden;
}

.overview-stat {
  padding: 10px 10px;
  background: var(--surface-2);
}

.overview-stat strong {
  display: block;
  font-family: var(--mono);
  font-size: 17px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
  color: var(--ink);
}

.overview-stat span {
  font-family: var(--mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--faint);
}

.meta-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  margin: 12px 0 18px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--line);
  overflow: hidden;
}

.meta-item {
  padding: 9px 11px;
  background: var(--surface-2);
}

.meta-k {
  margin-bottom: 2px;
  font-family: var(--mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--faint);
}

.meta-v {
  font-size: 12px;
  line-height: 1.4;
  color: var(--ink);
}

.mono {
  font-family: var(--mono);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
}

.detail-section {
  margin: 18px 0;
}

.detail-section h2 {
  margin: 0 0 8px;
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--faint);
}

.detail-section p {
  margin: 0 0 8px;
  font-size: 12.5px;
  line-height: 1.62;
  color: var(--muted);
}

.contract-box {
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-left: 2px solid var(--accent);
  border-radius: 6px;
  background: var(--surface-2);
  font-family: var(--mono);
  font-size: 11.5px;
  line-height: 1.6;
  color: var(--ink-secondary);
  overflow-wrap: break-word;
}

.notes {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.notes li {
  position: relative;
  padding-left: 12px;
  font-size: 12px;
  line-height: 1.58;
  color: var(--muted);
}

.notes li strong {
  color: var(--ink);
  font-weight: 600;
}

.notes li::before {
  content: "";
  position: absolute;
  left: 0;
  top: 7px;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--accent);
}

.path-list {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.path-chip {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 6px 9px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--surface-2);
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-secondary);
  text-align: left;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: border-color 0.12s ease, background 0.12s ease, color 0.12s ease;
}

button.path-chip:hover {
  border-color: var(--line-strong);
  background: var(--surface-3);
  color: var(--ink);
}

.chip-id {
  flex: none;
  font-size: 10px;
  font-weight: 600;
  color: var(--accent);
}

.inline-link {
  font-size: 12px;
  font-weight: 500;
  color: var(--accent);
  text-decoration: underline;
  text-decoration-color: color-mix(in srgb, var(--accent) 40%, transparent);
  text-underline-offset: 2px;
}

.relation-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.relation {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 5.5px 9px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--surface-2);
  text-align: left;
  transition: border-color 0.12s ease, background 0.12s ease;
}

.relation:hover {
  border-color: var(--line-strong);
  background: var(--surface-3);
}

.rel-dir {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  color: var(--accent);
  flex: none;
}

.rel-dir-in {
  color: var(--accent-2);
}

.rel-target {
  font-size: 12px;
  font-weight: 500;
  color: var(--ink);
}

.rel-label {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--faint);
}

.callout {
  margin: 10px 0;
  padding: 9px 11px;
  border: 1px solid color-mix(in srgb, var(--st-blocked) 40%, var(--line));
  border-radius: 6px;
  background: color-mix(in srgb, var(--st-blocked) 7%, transparent);
  font-size: 12px;
  line-height: 1.5;
  color: var(--st-blocked);
}

.source-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin: 6px 0;
}

.source-tab {
  max-width: 100%;
  padding: 4px 8px;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: var(--surface-2);
  color: var(--muted);
  font-family: var(--mono);
  font-size: 10.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
}

.source-tab:hover {
  color: var(--ink);
  border-color: var(--line-strong);
}

.source-tab.active {
  background: var(--accent-soft);
  border-color: var(--accent-border);
  color: var(--accent);
  font-weight: 600;
}

.source-box {
  border: 1px solid var(--code-line);
  border-radius: 8px;
  background: var(--code-bg);
  overflow: hidden;
}

.source-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 6px 10px;
  border-bottom: 1px solid var(--code-line);
  background: var(--code-head);
  font-family: var(--mono);
  font-size: 10px;
  color: var(--code-muted);
}

.source-path {
  color: var(--code-ink);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.source-meta {
  flex: none;
  font-variant-numeric: tabular-nums;
}

.source-body {
  max-height: 400px;
  padding: 8px 0;
  overflow: auto;
}

.source-line {
  display: flex;
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.6;
  color: var(--code-ink);
  white-space: pre;
}

.source-line .ln {
  flex: 0 0 3.4em;
  padding-right: 10px;
  text-align: right;
  font-variant-numeric: tabular-nums;
  color: var(--code-muted);
  user-select: none;
}

.source-line .lc {
  padding-right: 14px;
}

.hint {
  margin: 12px 0 0;
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--faint);
}

.empty {
  padding: 16px;
  border: 1px dashed var(--line-strong);
  border-radius: 8px;
  color: var(--faint);
  font-size: 12px;
  line-height: 1.5;
}

/* ---------- markdown reader ---------- */

.md {
  font-size: 13px;
  line-height: 1.7;
  color: var(--ink-secondary);
  overflow-wrap: break-word;
}

.md > :first-child {
  margin-top: 0;
}

.md h1,
.md h2,
.md h3 {
  font-family: var(--sans);
  color: var(--ink);
  font-weight: 620;
  line-height: 1.35;
  letter-spacing: -0.015em;
}

.md h1 {
  margin: 20px 0 8px;
  font-size: 16.5px;
}

.md h2 {
  margin: 22px 0 8px;
  padding-bottom: 5px;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
}

.md h3 {
  margin: 16px 0 6px;
  font-size: 13px;
}

.md p {
  margin: 0 0 10px;
}

.md strong {
  color: var(--ink);
  font-weight: 600;
}

.md ul,
.md ol {
  margin: 0 0 12px;
  padding-left: 18px;
}

.md li {
  margin: 4px 0;
}

.md li::marker {
  color: var(--faint);
}

.md li:has(> input[type="checkbox"]) {
  list-style: none;
  margin-left: -18px;
}

.md li input[type="checkbox"] {
  width: 12px;
  height: 12px;
  margin: 0 6px 0 0;
  vertical-align: -1px;
  accent-color: var(--accent);
}

.md a {
  color: var(--accent);
  text-decoration: underline;
  text-decoration-color: color-mix(in srgb, var(--accent) 40%, transparent);
  text-underline-offset: 2px;
}

.md code {
  padding: 1.5px 5px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--surface-2);
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--ink);
}

.md pre {
  margin: 12px 0;
  padding: 10px 12px;
  border: 1px solid var(--code-line);
  border-radius: 8px;
  background: var(--code-bg);
  color: var(--code-ink);
  overflow: auto;
}

.md pre code {
  padding: 0;
  border: 0;
  background: none;
  color: inherit;
  font-size: 10.5px;
  line-height: 1.55;
}

.md blockquote {
  margin: 12px 0;
  padding: 4px 12px;
  border-left: 2px solid var(--accent);
  background: var(--surface-2);
  border-radius: 0 6px 6px 0;
  color: var(--muted);
}

.table-wrap {
  margin: 12px 0;
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: 7px;
}

.md table {
  width: 100%;
  min-width: 480px;
  margin: 0;
  border-collapse: collapse;
  font-size: 12px;
}

.md th,
.md td {
  padding: 6px 9px;
  border-bottom: 1px solid var(--line);
  border-right: 1px solid var(--line);
  text-align: left;
  vertical-align: top;
}

.md th:last-child,
.md td:last-child {
  border-right: 0;
}

.md tr:last-child td {
  border-bottom: 0;
}

.md th {
  background: var(--surface-2);
  color: var(--ink);
  font-weight: 600;
}

.md hr {
  margin: 18px 0;
  border: 0;
  border-top: 1px solid var(--line);
}

/* ---------- responsive ---------- */

@media (min-width: 1360px) {
  body[data-view="docs"] .shell,
  body[data-view="decisions"] .shell {
    grid-template-columns: 224px minmax(0, 1fr) 500px;
  }
}

@media (max-width: 1320px) {
  .shell {
    grid-template-columns: 210px minmax(0, 1fr) 356px;
  }

  .brand-tag,
  .brand-divider {
    display: none;
  }

  .canvas {
    padding: 18px 20px 36px;
  }
}

@media (max-width: 1080px) {
  .shell {
    grid-template-columns: 200px minmax(0, 1fr);
  }

  .details {
    display: none;
  }

  .status-chip {
    display: none;
  }
}

@media (max-width: 780px) {
  body {
    overflow: auto;
  }

  .topbar {
    height: auto;
    min-height: 52px;
    padding: 10px 14px;
    flex-wrap: wrap;
    gap: 8px 12px;
  }

  .brand {
    flex: 1;
  }

  .brand-tag,
  .brand-divider {
    display: none;
  }

  .tabs {
    order: 3;
    width: 100%;
    overflow-x: auto;
  }

  .search {
    width: 150px;
  }

  .shell {
    height: auto;
    min-height: calc(100vh - 96px);
    grid-template-columns: 1fr;
  }

  .rail {
    display: none;
  }

  .canvas {
    padding: 18px 14px 36px;
  }

  .view-head {
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
  }

  .stats {
    justify-content: flex-start;
  }

  .arch-layer {
    grid-template-columns: 1fr;
    gap: 10px;
  }

  .board {
    flex-direction: column;
  }

  .column,
  .column.empty {
    width: 100%;
    min-height: 0;
  }

  .doc-grid {
    grid-template-columns: 1fr;
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}

</style>

<script id="niucode-data" type="application/json">{"project":{"name":"niucode","title":"niucode","tagline":"minimal, observable coding agent","summary":"一个围绕 append-only 事件日志、薄 provider 适配层和锋利工具面构建的最小 agent harness。看板是架构、决策与迭代的维护面，不是运行时监控。","status":"M4 · Extensible","repo":"niuverse/niucode","language":"Rust"},"milestones":[{"id":"M0","title":"Bootstrap","status":"done","goal":"跑通 headless 闭环：一个 provider、六个工具、可恢复的会话。","exit":["niucode exec 能修复一个真实小 bug","session 可 resume，坏尾行不丢历史","loop / tools 有离线 fixture 测试"]},{"id":"M1","title":"Interaction","status":"done","goal":"把审批、沙箱和流式交互补齐，让 harness 可以放心跑长任务。","exit":["TUI 流式输出与 diff 预览","sandbox / approval / network 三轴生效","Ctrl-C 取消并杀掉工具进程组"]},{"id":"M2","title":"Context","status":"done","goal":"让长会话稳定且便宜：压缩、分层指令、缓存可观测。","exit":["compaction 生成可执行 handoff","AGENTS.md 按目录分层发现","cached token 命中率可见"]},{"id":"M3","title":"Scale","status":"done","goal":"多会话、回放与子代理。","exit":["exec --json 成为稳定协议","fork / replay 可用","subagent 有独立日志并可汇总"]},{"id":"M4","title":"Extensible","status":"done","goal":"在不破坏事件日志、replay 和安全边界的前提下，让 niucode 具备 capability 级扩展与更顺手的交互。","exit":["command registry 驱动 TUI 补全与帮助","/plan 是只读 mode，/goal 是可持久目标","external tools 走 session 级 extension host","subagent 有 Explore/Worker capability profile"]},{"id":"M5","title":"Kernel seams","status":"active","goal":"把 provider、tool、loop 的边界做成可测试、可扩展的 seam，而不破坏事件日志。","exit":["provider catalog and cross-provider selection","tool risk metadata","loop phases"]}],"layers":[{"id":"interface","name":"Interface","note":"CLI、TUI、事件流"},{"id":"engine","name":"Engine","note":"turn loop 与上下文投影"},{"id":"adapters","name":"Adapters","note":"模型、工具、沙箱"},{"id":"state","name":"State","note":"append-only 事件日志"},{"id":"engineering","name":"Engineering","note":"构建、看板、测试"}],"modules":[{"id":"cli","title":"CLI","layer":"interface","status":"active","summary":"参数解析、session/auth/provider 命令，niucode exec headless 入口（含 --json）、niucode tui 启动、离线 replay 与 fork。","contract":"niucode exec / niucode tui 启动运行；niucode session 管理日志；niucode replay 重建投影；niucode fork 复制前缀。不持有对话状态。","paths":["crates/niucode-cli/src/main.rs","crates/niucode-cli/src/session_ops.rs"],"notes":["CLI 只做参数与生命周期，不实现 turn 逻辑。","输出模式分 human 与 --json，后者从第一天就稳定。","exec/tui 暴露 --context-budget 与 --keep-recent-turns。","replay / fork 不调用 provider；fork 只读源文件。","exec --json 输出 protocol=1 的 JSONL 事件流。","裸 niucode 直接启动 TUI。"],"sources":[{"path":"crates/niucode-cli/src/main.rs","language":"rust","text":"use std::io::{BufRead, Write};\nuse std::path::{Path, PathBuf};\nuse std::sync::Arc;\n\nuse anyhow::{bail, Context, Result};\nuse clap::{Parser, Subcommand};\nuse futures_util::StreamExt;\nuse niucode_agent::{\n    project_history, run_with_history, AgentConfig, AgentEvent, ApprovalMode, ApprovalRequest,\n};\nuse niucode_auth::AuthStore;\nuse niucode_core::{now_ms, Event, SessionLog};\nuse niucode_extension::{discover_in, ExtensionHost};\nuse niucode_provider::{\n    ChatMessage, CompletionRequest, OpenAiConfig, OpenAiProvider, Preset, Provider, ReplayProvider,\n    StreamEvent, ThinkingMode,\n};\nuse niucode_tools::{NetworkMode, SandboxMode, SandboxPolicy, Toolbox};\nuse provider_factory::ProviderFactory;\nuse serde_json::json;\n\nuse crate::theme::{Theme, Tone};\n\nmod diff;\nmod editor;\nmod goal;\nmod init;\nmod inline;\nmod provider_factory;\nmod review;\nmod session_ops;\nmod skills;\nmod slash;\nmod theme;\nmod tui;\nmod workspace;\n\n#[derive(Debug, Parser)]\n#[command(\n    name = \"niucode\",\n    version,\n    about = \"Minimal, observable coding agent; starts the TUI when no subcommand is given\"\n)]\nstruct Cli {\n    #[command(subcommand)]\n    command: Option\u003cCommand\u003e,\n}\n\n#[derive(Debug, Subcommand)]\nenum WorktreeCommand {\n    /// Apply a patch produced by a Worker worktree\n    Apply {\n        /// Patch path printed in the Worker summary\n        #[arg(long)]\n        patch: PathBuf,\n        /// Only check whether the patch applies\n        #[arg(long)]\n        check: bool,\n    },\n}\n\n#[derive(Debug, Subcommand)]\nenum Command {\n    /// Inspect and create append-only session logs\n    Session {\n        #[command(subcommand)]\n        command: SessionCommand,\n    },\n    /// Replay a session offline and print per-turn projections\n    Replay {\n        /// Path to a .jsonl session file\n        path: PathBuf,\n    },\n    /// Copy a session prefix into a new session\n    Fork {\n        /// Path to the source .jsonl session file\n        path: PathBuf,\n        /// Event id to fork at, for example e000012\n        #[arg(long)]\n        at: String,\n        /// Directory for the new session file (defaults to the source directory)\n        #[arg(long)]\n        session_dir: Option\u003cPathBuf\u003e,\n    },\n    /// Apply a Worker worktree patch\n    Worktree {\n        #[command(subcommand)]\n        command: WorktreeCommand,\n    },\n    /// Inspect and test model providers\n    Provider {\n        #[command(subcommand)]\n        command: ProviderCommand,\n    },\n    /// Store API keys in the OS keyring or a 0600 file\n    Auth {\n        #[command(subcommand)]\n        command: AuthCommand,\n    },\n    /// Report or reclaim ~/.niucode storage (dry-run by default)\n    Gc {\n        /// Remove derived caches, old proposals, and old backups\n        #[arg(long)]\n        apply: bool,\n        /// Also delete old sessions (requires --yes)\n        #[arg(long)]\n        prune_sessions: bool,\n        /// Confirm destructive --prune-sessions\n        #[arg(long)]\n        yes: bool,\n    },\n    /// Run one coding task through the agent loop\n    Exec {\n        /// Task for the agent\n        prompt: String,\n        /// Provider preset: deepseek or openai\n        #[arg(long, default_value = \"deepseek\")]\n        preset: String,\n        /// Override the preset model\n        #[arg(long)]\n        model: Option\u003cString\u003e,\n        /// Maximum model turns per user request (0 = no hard cap)\n        #[arg(long, default_value_t = 0)]\n        max_steps: usize,\n        /// Approximate context budget in tokens before compaction (0 = auto)\n        #[arg(long, default_value_t = 0)]\n        context_budget: usize,\n        /// Recent user turns kept verbatim when compacting\n        #[arg(long, default_value_t = 3)]\n        keep_recent_turns: usize,\n        /// Disable DeepSeek thinking mode\n        #[arg(long)]\n        no_thinking: bool,\n        /// Working directory (defaults to cwd)\n        #[arg(long)]\n        cwd: Option\u003cPathBuf\u003e,\n        /// Directory for the session JSONL (defaults to ~/.niucode/sessions)\n        #[arg(long)]\n        session_dir: Option\u003cPathBuf\u003e,\n        /// Resume an existing session JSONL\n        #[arg(long)]\n        resume: Option\u003cPathBuf\u003e,\n        /// Record normalized provider turns to a fixture JSON\n        #[arg(long)]\n        record: Option\u003cPathBuf\u003e,\n        /// Replay normalized provider turns from a fixture JSON\n        #[arg(long)]\n        replay: Option\u003cPathBuf\u003e,\n        /// Sandbox: read-only, workspace-write, or full-access\n        #[arg(long, default_value = \"workspace-write\")]\n        sandbox: String,\n        /// Approval: ask, on-failure, or never\n        #[arg(long, default_value = \"on-failure\")]\n        approval: String,\n        /// Network: on or off\n        #[arg(long, default_value = \"off\")]\n        network: String,\n        /// Emit a stable JSONL event stream on stdout\n        #[arg(long)]\n        json: bool,\n        /// Explicitly allow subagent profile=inherit\n        #[arg(long)]\n        allow_subagent_inheritance: bool,\n        /// Completion condition; run the evaluator loop until met/impossible\n        #[arg(long)]\n        goal: Option\u003cString\u003e,\n        /// Maximum actor rounds for --goal\n        #[arg(long, default_value_t = 6)]\n        max_goal_turns: usize,\n    },\n    /// Start the interactive linear TUI\n    Tui {\n        /// Provider preset: deepseek or openai\n        #[arg(long, default_value = \"deepseek\")]\n        preset: String,\n        /// Override the preset model\n        #[arg(long)]\n        model: Option\u003cString\u003e,\n        /// Approximate context budget in tokens before compaction (0 = auto)\n        #[arg(long, default_value_t = 0)]\n        context_budget: usize,\n        /// Maximum model turns per user request (0 = no hard cap)\n        #[arg(long, default_value_t = 0)]\n        max_steps: usize,\n        /// Recent user turns kept verbatim when compacting\n        #[arg(long, default_value_t = 3)]\n        keep_recent_turns: usize,\n        /// Disable DeepSeek thinking mode\n        #[arg(long)]\n        no_thinking: bool,\n        /// Working directory (defaults to cwd)\n        #[arg(long)]\n        cwd: Option\u003cPathBuf\u003e,\n        /// Directory for the session JSONL (defaults to ~/.niucode/sessions)\n        #[arg(long)]\n        session_dir: Option\u003cPathBuf\u003e,\n        /// Resume an existing session JSONL\n        #[arg(long)]\n        resume: Option\u003cPathBuf\u003e,\n        /// Sandbox: read-only, workspace-write, or full-access\n","truncated":true},{"path":"crates/niucode-cli/src/session_ops.rs","language":"rust","text":"//! Offline session replay and fork.\n//!\n//! Replay is a pure projection over decoded events; it never constructs a\n//! provider. Fork copies a validated event prefix into a new append-only file\n//! and appends a provenance event.\n\nuse std::fmt::Write as _;\nuse std::path::{Path, PathBuf};\n\nuse anyhow::{bail, Result};\nuse niucode_agent::{estimate_context, project_history};\nuse niucode_core::{load, now_ms, Event, EventId, SessionLog};\nuse niucode_provider::ChatMessage;\nuse niucode_tools::Toolbox;\n\nuse crate::diff::clean_text;\n\n#[derive(Debug, Clone, PartialEq, Eq)]\npub struct ReplayTurn {\n    pub number: usize,\n    pub event: EventId,\n    pub user: String,\n    /// Number of decoded events projected for this request.\n    pub context_events: usize,\n    pub messages: usize,\n    pub tokens: usize,\n    pub digest: String,\n}\n\n#[derive(Debug, Clone, PartialEq, Eq)]\npub struct ReplayReport {\n    pub session: PathBuf,\n    pub events: usize,\n    pub warnings: Vec\u003cString\u003e,\n    pub turns: Vec\u003cReplayTurn\u003e,\n    pub compactions: usize,\n    pub instructions: usize,\n    pub final_messages: usize,\n    pub final_tokens: usize,\n    pub final_digest: String,\n}\n\n#[derive(Debug, Clone, PartialEq, Eq)]\npub struct ForkReport {\n    pub parent: PathBuf,\n    pub destination: PathBuf,\n    pub at: EventId,\n    pub copied: usize,\n    pub warnings: Vec\u003cString\u003e,\n}\n\n/// Rebuild the model projection at every user turn without provider calls.\npub fn replay(path: \u0026Path) -\u003e Result\u003cReplayReport\u003e {\n    let loaded = load(path)?;\n    let events = \u0026loaded.events;\n    let tools = Toolbox::specs();\n    let mut turns = Vec::new();\n    let mut compactions = 0_usize;\n    let mut instructions = 0_usize;\n\n    for (index, event) in events.iter().enumerate() {\n        match event {\n            Event::Compaction { .. } =\u003e compactions += 1,\n            Event::Instructions { .. } =\u003e instructions += 1,\n            _ =\u003e {}\n        }\n        if !matches!(event, Event::UserMessage { .. }) {\n            continue;\n        }\n\n        // Compaction and instruction events are appended after the user\n        // message and before the next provider request. Include them, but stop\n        // before the assistant response.\n        let end = events\n            .iter()\n            .enumerate()\n            .skip(index + 1)\n            .find(|(_, candidate)| matches!(candidate, Event::AssistantMessage { .. }))\n            .map(|(assistant, _)| assistant)\n            .unwrap_or(events.len());\n        let context = project_history(\u0026events[..end])?;\n        let tokens = estimate_context(\u0026context, \u0026tools);\n        turns.push(ReplayTurn {\n            number: turns.len() + 1,\n            event: EventId::from_index(index),\n            user: one_line(text_of(event), 120),\n            context_events: end,\n            messages: context.len(),\n            tokens,\n            digest: digest_messages(\u0026context),\n        });\n    }\n\n    let final_context = project_history(events)?;\n    let final_tokens = estimate_context(\u0026final_context, \u0026tools);\n    Ok(ReplayReport {\n        session: path.to_path_buf(),\n        events: events.len(),\n        warnings: loaded.warnings,\n        turns,\n        compactions,\n        instructions,\n        final_messages: final_context.len(),\n        final_tokens,\n        final_digest: digest_messages(\u0026final_context),\n    })\n}\n\n/// Copy the validated prefix through `at` into a new session file.\npub fn fork(source: \u0026Path, at: \u0026str, destination_dir: \u0026Path) -\u003e Result\u003cForkReport\u003e {\n    let at = EventId::parse(at).map_err(|message| anyhow::anyhow!(\"{message}\"))?;\n    let loaded = load(source)?;\n    let index = at.index();\n    if index \u003e= loaded.events.len() {\n        bail!(\n            \"event {at} does not exist; {} has {} decoded events\",\n            source.display(),\n            loaded.events.len()\n        );\n    }\n\n    let mut destination = SessionLog::create(destination_dir)?;\n    for event in \u0026loaded.events[..=index] {\n        destination.append(event)?;\n    }\n    destination.append(\u0026Event::Fork {\n        parent: source.display().to_string(),\n        parent_event: at.to_string(),\n        ts: now_ms(),\n    })?;\n\n    Ok(ForkReport {\n        parent: source.to_path_buf(),\n        destination: destination.path().to_path_buf(),\n        at,\n        copied: index + 1,\n        warnings: loaded.warnings,\n    })\n}\n\nfn text_of(event: \u0026Event) -\u003e \u0026str {\n    match event {\n        Event::UserMessage { text, .. } =\u003e text,\n        _ =\u003e \"\",\n    }\n}\n\nfn one_line(text: \u0026str, max_chars: usize) -\u003e String {\n    let cleaned = clean_text(text);\n    let mut rendered = String::new();\n    for (index, character) in cleaned.chars().enumerate() {\n        if index \u003e= max_chars {\n            rendered.push('…');\n            break;\n        }\n        rendered.push(match character {\n            '\\n' | '\\r' | '\\t' =\u003e ' ',\n            other =\u003e other,\n        });\n    }\n    rendered.trim().to_string()\n}\n\nfn digest_messages(messages: \u0026[ChatMessage]) -\u003e String {\n    let bytes = serde_json::to_vec(messages).unwrap_or_default();\n    let mut hash = 0xcbf2_9ce4_8422_2325_u64;\n    for byte in bytes {\n        hash ^= u64::from(byte);\n        hash = hash.wrapping_mul(0x0000_0100_0000_01b3);\n    }\n    let mut rendered = String::new();\n    let _ = write!(\u0026mut rendered, \"{hash:016x}\");\n    rendered\n}\n\n#[cfg(test)]\nmod tests {\n    use std::fs;\n    use std::path::PathBuf;\n    use std::sync::atomic::{AtomicU64, Ordering};\n    use std::time::{SystemTime, UNIX_EPOCH};\n\n    use niucode_core::Usage;\n\n    use super::*;\n\n    fn temp_dir(tag: \u0026str) -\u003e PathBuf {\n        static COUNTER: AtomicU64 = AtomicU64::new(0);\n        let sequence = COUNTER.fetch_add(1, Ordering::Relaxed);\n        let stamp = SystemTime::now()\n            .duration_since(UNIX_EPOCH)\n            .unwrap_or_default()\n            .as_nanos();\n        let directory = std::env::temp_dir().join(format!(\"niucode-fork-{tag}-{stamp}-{sequence}\"));\n        let _ = fs::remove_dir_all(\u0026directory);\n        fs::create_dir_all(\u0026directory).expect(\"create temp dir\");\n        directory\n    }\n\n    fn start(id: \u0026str) -\u003e Event {\n","truncated":true}]},{"id":"tui","title":"TUI","layer":"interface","status":"active","summary":"线性 TUI：Geek 风格块字 logo、自定义行编辑、slash 自动菜单、历史、符号化工具状态、单键审批、diff pager、输出折叠、缓存率、取消与会话复用。","contract":"只消费 AgentEvent 与 ApprovalRequest；调用 run_with_history；审批 a/d/s，Ctrl-C 取消当前 turn；审批 diff 用宽度感知 pager，不复制路径策略。","paths":["crates/niucode-cli/src/tui.rs","crates/niucode-cli/src/slash.rs","crates/niucode-cli/src/theme.rs","crates/niucode-cli/src/diff.rs","crates/niucode-cli/src/review.rs","crates/niucode-cli/src/editor.rs"],"notes":["线性会话输出；全屏布局未做，pager 只在审批时接管屏幕。","slash 命令：/init /clear /fork /status /session /last /help /exit；未知 /foo 不发给模型。","/clear 新建 session，/fork 复制前缀并切换，旧日志保留。","diff 渲染按终端宽度重排；工具输出超过 12 行/2 KB 折叠，:last 展开。","颜色只在 TTY 开启，遵循 NO_COLOR / CLICOLOR=0 / TERM=dumb。","非 TTY 时审批退化为逐行输入，方便管道测试。","Tab 补全 slash 命令并显示带说明的候选；唯一前缀显示内联 hint。","↑/↓ 历史，Ctrl-C 清空当前行，Ctrl-D 退出，Ctrl-L 清屏；非 TTY 退化为 read_line。","裸 niucode 直接进入 TUI。","M4-001: readable slash auto-menu replaces the rustyline ghost hint.","/plan toggles read-only plan mode; /goal persists as an event-backed objective label.","鼠标悬停/点击 slash 菜单；命令输入高亮；Ctrl-R/Ctrl-N/Ctrl-P 历史操作。","prompt 显示 plan/goal 徽标；/goal 设置后立即启动 goal run。","鼠标捕获只在 slash 菜单打开时启用；TerminalGuard 统一恢复终端状态。","--max-steps 默认 24；max-steps 错误给提升提示并保留已写文件。","/reload 重读 AGENTS.md；/clear 保留 plan/goal；/reset 全量重置；/resume 切换 session。","鼠标 hover 支持绝对行号与相对移动 fallback。","/model 切换当前 provider 内模型；/permissions 映射 ask/review/full-access/ci。","model_change / permission_change 事件随 resume 恢复；clear 保留、reset 清除。","/model 与 /permissions 使用参数下拉；裸命令 Enter 显示当前值。","默认 max-steps=0（256 安全 cap）；/compact 手动压缩，ContextOverflow 强制 compact。"],"sources":[{"path":"crates/niucode-cli/src/tui.rs","language":"rust","text":"//! Linear in-process TUI.\n//!\n//! It only consumes `AgentEvent`s and calls the same `run_with_history` entry\n//! point as headless exec. No loop internals are imported here.\n\nuse std::fs::File;\nuse std::io::{BufRead, BufReader, IsTerminal, Write};\nuse std::path::{Path, PathBuf};\nuse std::sync::Arc;\nuse std::time::{Duration, Instant, UNIX_EPOCH};\n\nuse anyhow::{bail, Context, Result};\nuse crossterm::cursor::{MoveTo, Show};\nuse crossterm::event::{\n    self, DisableBracketedPaste, DisableMouseCapture, Event as TerminalEvent, KeyCode, KeyEvent,\n    KeyModifiers,\n};\nuse crossterm::execute;\nuse crossterm::terminal::{self, Clear, ClearType, EnterAlternateScreen, LeaveAlternateScreen};\nuse niucode_agent::{\n    build_handoff, estimate_context, project_history, run_with_history, AgentConfig, AgentEvent,\n    ApprovalMode, ApprovalRequest, RunOutcome,\n};\nuse niucode_core::{load, now_ms, Event, EventId, SessionLog, Usage};\nuse niucode_provider::{ChatMessage, ModelSelection, Provider};\nuse niucode_tools::{NetworkMode, SandboxMode, SandboxPolicy, Toolbox};\nuse similar::TextDiff;\n\nuse crate::diff::{clean_text, render_plain};\nuse crate::editor::{mouse_events_seen, Input, LineEditor};\nuse crate::goal::{self, GoalStatus, MAX_GOAL_TURNS};\nuse crate::inline::InlineEditor;\nuse crate::provider_factory::{available_model_choices, provider_choices, ProviderFactory};\nuse crate::review::{review_diff, ApprovalChoice};\nuse crate::session_ops;\nuse crate::skills;\nuse crate::slash::{\n    self, Command as SlashCommand, CommandRegistry, GoalAction, Parsed as SlashParsed, PlanAction,\n};\nuse crate::theme::{self, Theme, Tone};\nuse crate::workspace::Workspace;\n\nconst TOOL_OUTPUT_FOLD_LINES: usize = 12;\nconst TOOL_OUTPUT_FOLD_BYTES: usize = 2_000;\nconst WIDE_BANNER: usize = 62;\n\nconst LOGO: [\u0026str; 6] = [\n    \"███╗   ██╗██╗██╗   ██╗ ██████╗ ██████╗ ██████╗ ███████╗\",\n    \"████╗  ██║██║██║   ██║██╔════╝██╔═══██╗██╔══██╗██╔════╝\",\n    \"██╔██╗ ██║██║██║   ██║██║     ██║   ██║██║  ██║█████╗\",\n    \"██║╚██╗██║██║██║   ██║██║     ██║   ██║██║  ██║██╔══╝\",\n    \"██║ ╚████║██║╚██████╔╝╚██████╗╚██████╔╝██████╔╝███████╗\",\n    \"╚═╝  ╚═══╝╚═╝ ╚═════╝  ╚═════╝ ╚═════╝ ╚═════╝ ╚══════╝\",\n];\n\nenum PromptEditor {\n    Linear(LineEditor),\n    Inline(InlineEditor),\n}\n\nimpl PromptEditor {\n    fn read_line(\n        \u0026mut self,\n        raw_prompt: \u0026str,\n        styled_prompt: \u0026str,\n        footer: \u0026str,\n        theme: Theme,\n    ) -\u003e std::io::Result\u003cInput\u003e {\n        match self {\n            Self::Linear(editor) =\u003e editor.read_line(raw_prompt, styled_prompt, theme),\n            Self::Inline(editor) =\u003e editor.read_line(raw_prompt, styled_prompt, footer, theme),\n        }\n    }\n\n    fn set_models(\u0026mut self, models: Vec\u003cString\u003e) {\n        match self {\n            Self::Linear(editor) =\u003e editor.set_models(models),\n            Self::Inline(editor) =\u003e editor.set_models(models),\n        }\n    }\n\n    fn set_current_model(\u0026mut self, model: impl Into\u003cString\u003e) {\n        match self {\n            Self::Linear(editor) =\u003e editor.set_current_model(model),\n            Self::Inline(editor) =\u003e editor.set_current_model(model),\n        }\n    }\n\n    fn set_cwd(\u0026mut self, cwd: PathBuf) {\n        match self {\n            Self::Linear(_) =\u003e {}\n            Self::Inline(editor) =\u003e editor.set_cwd(cwd),\n        }\n    }\n\n    fn set_permissions(\u0026mut self, permissions: Vec\u003c(String, String)\u003e) {\n        match self {\n            Self::Linear(editor) =\u003e editor.set_permissions(permissions),\n            Self::Inline(editor) =\u003e editor.set_permissions(permissions),\n        }\n    }\n\n    fn set_skills(\u0026mut self, skills: Vec\u003cString\u003e) {\n        match self {\n            Self::Linear(editor) =\u003e editor.set_skills(skills),\n            Self::Inline(editor) =\u003e editor.set_skills(skills),\n        }\n    }\n\n    fn clear_history(\u0026mut self) {\n        match self {\n            Self::Linear(editor) =\u003e editor.clear_history(),\n            Self::Inline(editor) =\u003e editor.clear_history(),\n        }\n    }\n}\n\nstruct ToolEcho {\n    name: String,\n    summary: String,\n    output: String,\n}\n\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\nenum PermissionProfile {\n    Ask,\n    Review,\n    FullAccess,\n    Ci,\n}\n\nimpl PermissionProfile {\n    const ALL: [Self; 4] = [Self::Ask, Self::Review, Self::FullAccess, Self::Ci];\n\n    fn as_str(self) -\u003e \u0026'static str {\n        match self {\n            Self::Ask =\u003e \"ask\",\n            Self::Review =\u003e \"review\",\n            Self::FullAccess =\u003e \"full-access\",\n            Self::Ci =\u003e \"ci\",\n        }\n    }\n\n    fn parse(value: \u0026str) -\u003e Option\u003cSelf\u003e {\n        match value\n            .trim()\n            .trim_start_matches(':')\n            .to_ascii_lowercase()\n            .as_str()\n        {\n            \"ask\" =\u003e Some(Self::Ask),\n            \"review\" =\u003e Some(Self::Review),\n            \"full-access\" | \"full\" =\u003e Some(Self::FullAccess),\n            \"ci\" =\u003e Some(Self::Ci),\n            _ =\u003e None,\n        }\n    }\n\n    fn apply(self, config: \u0026mut AgentConfig) {\n        match self {\n            Self::Ask =\u003e {\n                config.sandbox = SandboxPolicy::new(SandboxMode::WorkspaceWrite, NetworkMode::Off);\n                config.approval = ApprovalMode::Ask;\n                config.allow_unsandboxed = false;\n            }\n            Self::Review =\u003e {\n                config.sandbox = SandboxPolicy::new(SandboxMode::WorkspaceWrite, NetworkMode::Off);\n                config.approval = ApprovalMode::OnFailure;\n                config.allow_unsandboxed = false;\n            }\n            Self::FullAccess =\u003e {\n                config.sandbox = SandboxPolicy::new(SandboxMode::FullAccess, NetworkMode::On);\n                config.approval = ApprovalMode::Never;\n                config.allow_unsandboxed = false;\n            }\n            Self::Ci =\u003e {\n                config.sandbox = SandboxPolicy::new(SandboxMode::ReadOnly, NetworkMode::Off);\n                config.approval = ApprovalMode::Never;\n                config.allow_unsandboxed = false;\n            }\n        }\n    }\n\n    fn description(self) -\u003e \u0026'static str {\n        match self {\n            Self::Ask =\u003e \"workspace-write · network off · ask before risk\",\n            Self::Review =\u003e \"workspace-write · network off · review failures\",\n            Self::FullAccess =\u003e \"full-access · network on · no approval\",\n            Self::Ci =\u003e \"read-only · network off · no approval\",\n        }\n    }\n}\n\n#[derive(Debug, Clone, Default)]\nstruct SessionUiState {\n    plan_mode: bool,\n    goal: Option\u003cString\u003e,\n    goal_run: bool,\n    goal_turns: usize,\n    pending_prompt: Option\u003cString\u003e,\n","truncated":true},{"path":"crates/niucode-cli/src/slash.rs","language":"rust","text":"//! Slash-command parsing for the interactive TUI.\n\n/// Slash commands surfaced by completion and `/help`.\npub const COMMANDS: \u0026[(\u0026str, \u0026str)] = \u0026[\n    (\"/init\", \"propose AGENTS.md; /init apply writes it\"),\n    (\n        \"/clear\",\n        \"new conversation; keep plan/goal (old log is kept)\",\n    ),\n    (\n        \"/reset\",\n        \"new conversation + clear goal/plan/history + reload instructions\",\n    ),\n    (\n        \"/resume\",\n        \"resume a session by path or list recent sessions\",\n    ),\n    (\"/reload\", \"reload AGENTS.md instructions for the next turn\"),\n    (\"/model\", \"show or switch the runtime model\"),\n    (\"/skills\", \"list skills; trust/untrust project skills\"),\n    (\n        \"/permissions\",\n        \"show or switch the runtime permission profile\",\n    ),\n    (\"/plan\", \"enter or leave read-only plan mode\"),\n    (\"/goal\", \"set, run, stop, or clear the session goal\"),\n    (\"/fork\", \"fork the current session [event-id]\"),\n    (\"/status\", \"show model, sandbox, context, session and cache\"),\n    (\"/session\", \"show the current session path and event count\"),\n    (\"/last\", \"expand the most recent tool output\"),\n    (\"/help\", \"show this help\"),\n    (\"/exit\", \"leave the session\"),\n];\n\n#[derive(Debug, Clone, PartialEq, Eq)]\npub struct CommandSpec {\n    pub name: String,\n    pub description: String,\n}\n\n/// Built-in command metadata. Plugin commands can be appended later; the TUI\n/// menu, `/help`, and parsing should share this registry rather than keeping a\n/// second command table.\n#[derive(Debug, Clone, Default)]\npub struct CommandRegistry {\n    entries: Vec\u003cCommandSpec\u003e,\n}\n\nimpl CommandRegistry {\n    pub fn builtin() -\u003e Self {\n        Self {\n            entries: COMMANDS\n                .iter()\n                .map(|(name, description)| CommandSpec {\n                    name: (*name).to_string(),\n                    description: (*description).to_string(),\n                })\n                .collect(),\n        }\n    }\n\n    pub fn all(\u0026self) -\u003e \u0026[CommandSpec] {\n        \u0026self.entries\n    }\n\n    pub fn candidates(\u0026self, prefix: \u0026str) -\u003e Vec\u003c\u0026CommandSpec\u003e {\n        self.entries\n            .iter()\n            .filter(|spec| spec.name.starts_with(prefix))\n            .collect()\n    }\n}\n\n#[derive(Debug, Clone, PartialEq, Eq)]\npub enum Command {\n    Help,\n    Last,\n    Init { apply: bool },\n    Clear,\n    Reset,\n    Resume(Option\u003cString\u003e),\n    Reload,\n    Model(Option\u003cString\u003e),\n    Permissions(Option\u003cString\u003e),\n    Skills(Option\u003cString\u003e),\n    Tools,\n    Compact,\n    Plan(PlanAction),\n    Goal(GoalAction),\n    Fork(Option\u003cString\u003e),\n    Status,\n    Session,\n    Exit,\n}\n\n#[derive(Debug, Clone, PartialEq, Eq)]\npub enum PlanAction {\n    Enter,\n    Exit,\n    Approve,\n    Status,\n}\n\n#[derive(Debug, Clone, PartialEq, Eq)]\npub enum GoalAction {\n    Show,\n    Set(String),\n    Run,\n    Stop,\n    Clear,\n}\n\n#[derive(Debug, Clone, PartialEq, Eq)]\npub enum Parsed {\n    Command(Command),\n    Unknown(String),\n    Usage(String),\n    None,\n}\n\npub fn parse(input: \u0026str) -\u003e Parsed {\n    let trimmed = input.trim();\n    if matches!(trimmed, \"exit\" | \"quit\") {\n        return Parsed::Command(Command::Exit);\n    }\n    let (prefix, rest) = if let Some(rest) = trimmed.strip_prefix('/') {\n        ('/', rest)\n    } else if let Some(rest) = trimmed.strip_prefix(':') {\n        (':', rest)\n    } else {\n        return Parsed::None;\n    };\n\n    let (name, rest) = rest\n        .split_once(char::is_whitespace)\n        .map(|(name, rest)| (name, rest.trim()))\n        .unwrap_or((rest, \"\"));\n    let args = rest.split_whitespace().collect::\u003cVec\u003c_\u003e\u003e();\n\n    if name == \"init\" {\n        return match rest {\n            \"\" =\u003e Parsed::Command(Command::Init { apply: false }),\n            \"apply\" =\u003e Parsed::Command(Command::Init { apply: true }),\n            _ =\u003e Parsed::Usage(\"/init [apply]\".into()),\n        };\n    }\n\n    if name == \"skills\" {\n        return Parsed::Command(Command::Skills(if rest.is_empty() {\n            None\n        } else {\n            Some(rest.to_string())\n        }));\n    }\n\n    if name == \"goal\" {\n        let command = match rest {\n            \"\" =\u003e Command::Goal(GoalAction::Show),\n            \"run\" =\u003e Command::Goal(GoalAction::Run),\n            \"stop\" | \"pause\" | \"off\" =\u003e Command::Goal(GoalAction::Stop),\n            \"clear\" =\u003e Command::Goal(GoalAction::Clear),\n            text =\u003e Command::Goal(GoalAction::Set(text.to_string())),\n        };\n        return Parsed::Command(command);\n    }\n\n    let command = match name {\n        \"help\" | \"?\" =\u003e Command::Help,\n        \"last\" =\u003e Command::Last,\n        \"clear\" =\u003e Command::Clear,\n        \"reset\" =\u003e Command::Reset,\n        \"reload\" =\u003e Command::Reload,\n        \"resume\" =\u003e Command::Resume(if rest.is_empty() {\n            None\n        } else {\n            Some(rest.to_string())\n        }),\n        \"model\" =\u003e Command::Model(if rest.is_empty() {\n            None\n        } else {\n            Some(rest.to_string())\n        }),\n        \"permissions\" =\u003e Command::Permissions(if rest.is_empty() {\n            None\n        } else {\n            Some(rest.to_string())\n        }),\n        \"compact\" =\u003e Command::Compact,\n        \"plan\" =\u003e match rest {\n            \"\" =\u003e Command::Plan(PlanAction::Enter),\n            \"off\" | \"exit\" =\u003e Command::Plan(PlanAction::Exit),\n            \"approve\" =\u003e Command::Plan(PlanAction::Approve),\n            \"status\" =\u003e Command::Plan(PlanAction::Status),\n            _ =\u003e return Parsed::Usage(usage_plan()),\n        },\n        \"fork\" =\u003e Command::Fork(args.first().map(|arg| (*arg).to_string())),\n        \"tools\" =\u003e Command::Tools,\n        \"status\" =\u003e Command::Status,\n        \"session\" =\u003e Command::Session,\n        \"exit\" | \"quit\" | \"q\" =\u003e Command::Exit,\n","truncated":true},{"path":"crates/niucode-cli/src/theme.rs","language":"rust","text":"//! Small terminal theme used by the linear TUI and approval pager.\n//!\n//! Styling is intentionally dependency-free: ANSI SGR codes only, disabled for\n//! non-TTY output, `NO_COLOR`, `CLICOLOR=0`, and `TERM=dumb`.\n\nuse std::fmt::Display;\nuse std::io::IsTerminal;\n\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub struct Theme {\n    ansi: bool,\n}\n\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum Tone {\n    Accent,\n    Bright,\n    Success,\n    Danger,\n    Warning,\n    Muted,\n    Magenta,\n}\n\npub const PROMPT: \u0026str = \"▸\";\npub const ASSISTANT: \u0026str = \"◆\";\npub const THINKING: \u0026str = \"◇\";\npub const TOOL: \u0026str = \"»\";\npub const OK: \u0026str = \"✓\";\npub const ERR: \u0026str = \"✗\";\npub const WARN: \u0026str = \"!\";\npub const COMPACT: \u0026str = \"⇣\";\npub const TURN: \u0026str = \"╰─\";\npub const BRANCH: \u0026str = \"│\";\n\nimpl Theme {\n    pub fn detect_stdout() -\u003e Self {\n        Self::from_tty(std::io::stdout().is_terminal())\n    }\n\n    pub fn detect_stderr() -\u003e Self {\n        Self::from_tty(std::io::stderr().is_terminal())\n    }\n\n    pub fn from_tty(tty: bool) -\u003e Self {\n        let no_color = std::env::var_os(\"NO_COLOR\").is_some();\n        let dumb = std::env::var(\"TERM\").is_ok_and(|term| term == \"dumb\");\n        let clicolor_off = std::env::var(\"CLICOLOR\").is_ok_and(|value| value == \"0\");\n        Self {\n            ansi: tty \u0026\u0026 !no_color \u0026\u0026 !dumb \u0026\u0026 !clicolor_off,\n        }\n    }\n\n    #[cfg(test)]\n    pub fn plain() -\u003e Self {\n        Self { ansi: false }\n    }\n\n    #[cfg(test)]\n    fn ansi_forced() -\u003e Self {\n        Self { ansi: true }\n    }\n\n    pub fn is_ansi(self) -\u003e bool {\n        self.ansi\n    }\n\n    pub fn paint(self, tone: Tone, text: impl Display) -\u003e String {\n        if !self.ansi {\n            return text.to_string();\n        }\n        let code = match tone {\n            Tone::Accent =\u003e \"1;36\",\n            Tone::Bright =\u003e \"1;37\",\n            Tone::Success =\u003e \"1;32\",\n            Tone::Danger =\u003e \"1;31\",\n            Tone::Warning =\u003e \"1;33\",\n            Tone::Muted =\u003e \"2\",\n            Tone::Magenta =\u003e \"1;35\",\n        };\n        format!(\"\\x1b[{code}m{text}\\x1b[0m\")\n    }\n\n    pub fn dim(self, text: impl Display) -\u003e String {\n        self.paint(Tone::Muted, text)\n    }\n\n    pub fn accent(self, text: impl Display) -\u003e String {\n        self.paint(Tone::Accent, text)\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn plain_theme_emits_no_ansi() {\n        let theme = Theme { ansi: false };\n        assert_eq!(theme.accent(\"niucode\"), \"niucode\");\n        assert_eq!(theme.dim(\"meta\"), \"meta\");\n    }\n\n    #[test]\n    fn ansi_theme_wraps_and_resets() {\n        let theme = Theme::ansi_forced();\n        let painted = theme.paint(Tone::Success, \"ok\");\n        assert!(painted.starts_with(\"\\u{1b}[1;32m\"));\n        assert!(painted.ends_with(\"\\u{1b}[0m\"));\n        assert!(painted.contains(\"ok\"));\n    }\n\n    #[test]\n    fn non_tty_disables_ansi() {\n        assert!(!Theme::from_tty(false).is_ansi());\n    }\n\n    #[test]\n    fn symbols_are_single_line() {\n        for symbol in [PROMPT, ASSISTANT, THINKING, TOOL, OK, ERR, WARN, COMPACT] {\n            assert!(!symbol.contains('\\n'));\n            assert!(!symbol.is_empty());\n        }\n    }\n}\n","truncated":false},{"path":"crates/niucode-cli/src/diff.rs","language":"rust","text":"//! Width-aware rendering for structured change previews.\n//!\n//! This module is pure: it turns a `ChangePreview` into terminal rows. The\n//! approval pager and the headless fallback both render those rows, so layout\n//! and line-number alignment are tested without a terminal.\n\nuse niucode_tools::{ChangePreview, FilePreview, LineKind, PreviewBody, PreviewLine};\nuse unicode_width::{UnicodeWidthChar, UnicodeWidthStr};\n\nconst MIN_WIDTH: usize = 40;\nconst MIN_BODY_WIDTH: usize = 4;\n\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum RowKind {\n    File,\n    Hunk,\n    Context,\n    Add,\n    Remove,\n    Note,\n    Warning,\n}\n\n#[derive(Debug, Clone, PartialEq, Eq)]\npub struct Row {\n    pub kind: RowKind,\n    pub text: String,\n}\n\npub fn layout(preview: \u0026ChangePreview, width: usize) -\u003e Vec\u003cRow\u003e {\n    let width = width.max(MIN_WIDTH);\n    let mut rows = Vec::new();\n\n    if let Some(warning) = \u0026preview.warning {\n        rows.extend(wrap_prefixed(\"! \", warning, width, RowKind::Warning));\n    }\n\n    match \u0026preview.body {\n        PreviewBody::Diff { files } =\u003e {\n            for file in files {\n                rows.extend(file_rows(file, width));\n            }\n        }\n        PreviewBody::Command { command } =\u003e {\n            if command.is_empty() {\n                rows.push(note(\"(empty command)\"));\n            } else {\n                for (index, line) in command.lines().enumerate() {\n                    let prefix = if index == 0 { \"$ \" } else { \"  \" };\n                    rows.extend(wrap_prefixed(prefix, line, width, RowKind::Note));\n                }\n            }\n        }\n        PreviewBody::Note { message } =\u003e {\n            rows.extend(wrap_prefixed(\"! \", message, width, RowKind::Note));\n        }\n    }\n\n    if rows.is_empty() {\n        rows.push(note(\"(nothing to preview)\"));\n    }\n    rows\n}\n\n/// Render a preview without color, for headless approval and non-TTY input.\npub fn render_plain(preview: \u0026ChangePreview, width: usize) -\u003e String {\n    let mut rendered = String::new();\n    for row in layout(preview, width) {\n        rendered.push_str(\u0026row.text);\n        rendered.push('\\n');\n    }\n    rendered\n}\n\n/// Starting row of each file header, in display order.\npub fn file_starts(rows: \u0026[Row]) -\u003e Vec\u003cusize\u003e {\n    rows.iter()\n        .enumerate()\n        .filter_map(|(index, row)| (row.kind == RowKind::File).then_some(index))\n        .collect()\n}\n\npub fn display_width(text: \u0026str) -\u003e usize {\n    text.width()\n}\n\nfn file_rows(file: \u0026FilePreview, width: usize) -\u003e Vec\u003cRow\u003e {\n    let stats = format!(\"+{} -{}\", file.added, file.removed);\n    let path = clean_text(\u0026file.path);\n    let label = if file.is_new {\n        format!(\"{path} (new file)\")\n    } else {\n        path\n    };\n    let label_budget = width\n        .saturating_sub(2 + display_width(\u0026stats) + 2)\n        .max(MIN_BODY_WIDTH);\n    let label = fit_tail(\u0026label, label_budget);\n    let padding = width.saturating_sub(2 + display_width(\u0026label) + display_width(\u0026stats));\n    let header = format!(\"▎ {label}{}{stats}\", \" \".repeat(padding));\n\n    let mut rows = vec![Row {\n        kind: RowKind::File,\n        text: header,\n    }];\n\n    if file.hunks.is_empty() {\n        rows.push(Row {\n            kind: RowKind::Note,\n            text: \"  (no textual changes)\".to_string(),\n        });\n        return rows;\n    }\n\n    let (old_width, new_width) = line_number_widths(file);\n    for hunk in \u0026file.hunks {\n        rows.push(Row {\n            kind: RowKind::Hunk,\n            text: format!(\n                \"@@ -{} +{} @@\",\n                range_text(hunk.old_start, hunk.old_len),\n                range_text(hunk.new_start, hunk.new_len)\n            ),\n        });\n        for line in \u0026hunk.lines {\n            rows.extend(render_line(line, old_width, new_width, width));\n        }\n    }\n\n    rows\n}\n\nfn render_line(line: \u0026PreviewLine, old_width: usize, new_width: usize, width: usize) -\u003e Vec\u003cRow\u003e {\n    let sign = match line.kind {\n        LineKind::Context =\u003e ' ',\n        LineKind::Add =\u003e '+',\n        LineKind::Remove =\u003e '-',\n    };\n    let old = line\n        .old_line\n        .map(|line| line.to_string())\n        .unwrap_or_default();\n    let new = line\n        .new_line\n        .map(|line| line.to_string())\n        .unwrap_or_default();\n    let prefix = format!(\n        \"{old:\u003eold_width$} {new:\u003enew_width$} │ {sign} \",\n        old_width = old_width,\n        new_width = new_width\n    );\n    let continuation = format!(\n        \"{:\u003eold_width$} {:\u003enew_width$} │   \",\n        \"\",\n        \"\",\n        old_width = old_width,\n        new_width = new_width\n    );\n    let body_width = width\n        .saturating_sub(display_width(\u0026prefix))\n        .max(MIN_BODY_WIDTH);\n    let cleaned = clean_text(\u0026line.text);\n    let segments = wrap_text(\u0026cleaned, body_width);\n    let kind = match line.kind {\n        LineKind::Context =\u003e RowKind::Context,\n        LineKind::Add =\u003e RowKind::Add,\n        LineKind::Remove =\u003e RowKind::Remove,\n    };\n\n    segments\n        .into_iter()\n        .enumerate()\n        .map(|(index, segment)| Row {\n            kind,\n            text: if index == 0 {\n                format!(\"{prefix}{segment}\")\n            } else {\n                format!(\"{continuation}{segment}\")\n            },\n        })\n        .collect()\n}\n\nfn line_number_widths(file: \u0026FilePreview) -\u003e (usize, usize) {\n    let max_old = file\n        .hunks\n        .iter()\n        .flat_map(|hunk| \u0026hunk.lines)\n        .filter_map(|line| line.old_line)\n        .max()\n        .unwrap_or(0);\n    let max_new = file\n        .hunks\n        .iter()\n        .flat_map(|hunk| \u0026hunk.lines)\n        .filter_map(|line| line.new_line)\n        .max()\n        .unwrap_or(0);\n    (\n        max_old.to_string().len().max(2),\n","truncated":true},{"path":"crates/niucode-cli/src/review.rs","language":"rust","text":"//! Full-screen approval pager for structured diffs.\n//!\n//! This is an overlay for approval only; the session itself stays linear. The\n//! pager owns no session state and disappears after a decision.\n\nuse std::io::{self, Write};\n\nuse crossterm::cursor::{Hide, MoveTo, Show};\nuse crossterm::event::{self, Event, KeyCode, KeyEventKind, KeyModifiers};\nuse crossterm::queue;\nuse crossterm::style::{Attribute, Print, ResetColor, SetAttribute};\nuse crossterm::terminal::{self, Clear, ClearType, EnterAlternateScreen, LeaveAlternateScreen};\nuse niucode_agent::ApprovalRequest;\nuse niucode_tools::ChangePreview;\nuse unicode_width::UnicodeWidthChar;\n\nuse crate::diff::{self, file_starts, Row, RowKind};\nuse crate::theme::{Theme, Tone};\n\nconst MIN_WIDTH: usize = 40;\nconst MIN_HEIGHT: usize = 6;\n\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum ApprovalChoice {\n    Allow,\n    Deny,\n    Session,\n}\n\n/// Show a width-aware diff pager and return the user's decision.\n///\n/// `Ok(None)` mean
