s the terminal is too small, so the caller should fall back\n/// to a plain preview and the line-based prompt.\npub fn review_diff(\n    request: \u0026ApprovalRequest,\n    preview: \u0026ChangePreview,\n    theme: Theme,\n) -\u003e io::Result\u003cOption\u003cApprovalChoice\u003e\u003e {\n    let (columns, rows) = terminal::size()?;\n    let width = columns.saturating_sub(1) as usize;\n    let height = rows as usize;\n    if width \u003c MIN_WIDTH || height \u003c MIN_HEIGHT {\n        return Ok(None);\n    }\n\n    let _guard = ScreenGuard::enter()?;\n    let mut state = ReviewState::new(request, preview, width, height, theme);\n    let mut out = io::stdout();\n\n    loop {\n        state.draw(\u0026mut out)?;\n        match event::read()? {\n            Event::Key(key) if key.kind == KeyEventKind::Press =\u003e match key.code {\n                KeyCode::Char('a') | KeyCode::Char('A') =\u003e {\n                    return Ok(Some(ApprovalChoice::Allow));\n                }\n                KeyCode::Char('s') | KeyCode::Char('S') =\u003e {\n                    return Ok(Some(ApprovalChoice::Session));\n                }\n                KeyCode::Char('d')\n                | KeyCode::Char('D')\n                | KeyCode::Esc\n                | KeyCode::Char('q')\n                | KeyCode::Char('Q') =\u003e return Ok(Some(ApprovalChoice::Deny)),\n                KeyCode::Char('c') if key.modifiers.contains(KeyModifiers::CONTROL) =\u003e {\n                    return Ok(Some(ApprovalChoice::Deny));\n                }\n                KeyCode::Char('j') | KeyCode::Down =\u003e state.scroll_by(1),\n                KeyCode::Char('k') | KeyCode::Up =\u003e state.scroll_by(-1),\n                KeyCode::PageDown | KeyCode::Char(' ') =\u003e {\n                    state.scroll_by(state.body_height() as isize)\n                }\n                KeyCode::PageUp | KeyCode::Char('b') =\u003e {\n                    state.scroll_by(-(state.body_height() as isize))\n                }\n                KeyCode::Char('g') | KeyCode::Home =\u003e state.scroll = 0,\n                KeyCode::Char('G') | KeyCode::End =\u003e state.scroll = state.max_scroll(),\n                KeyCode::Char('n') | KeyCode::Char(']') =\u003e state.jump_file(1),\n                KeyCode::Char('p') | KeyCode::Char('[') =\u003e state.jump_file(-1),\n                _ =\u003e {}\n            },\n            Event::Resize(columns, rows) =\u003e {\n                let width = columns.saturating_sub(1) as usize;\n                let height = rows as usize;\n                if width \u003c MIN_WIDTH || height \u003c MIN_HEIGHT {\n                    return Ok(None);\n                }\n                state.relayout(width, height);\n            }\n            _ =\u003e {}\n        }\n    }\n}\n\nstruct ReviewState\u003c'a\u003e {\n    request: \u0026'a ApprovalRequest,\n    preview: \u0026'a ChangePreview,\n    rows: Vec\u003cRow\u003e,\n    file_starts: Vec\u003cusize\u003e,\n    width: usize,\n    height: usize,\n    scroll: usize,\n    theme: Theme,\n}\n\nimpl\u003c'a\u003e ReviewState\u003c'a\u003e {\n    fn new(\n        request: \u0026'a ApprovalRequest,\n        preview: \u0026'a ChangePreview,\n        width: usize,\n        height: usize,\n        theme: Theme,\n    ) -\u003e Self {\n        let rows = diff::layout(preview, width);\n        let file_starts = file_starts(\u0026rows);\n        Self {\n            request,\n            preview,\n            rows,\n            file_starts,\n            width,\n            height,\n            scroll: 0,\n            theme,\n        }\n    }\n\n    fn body_height(\u0026self) -\u003e usize {\n        self.height.saturating_sub(2)\n    }\n\n    fn max_scroll(\u0026self) -\u003e usize {\n        self.rows.len().saturating_sub(self.body_height())\n    }\n\n    fn clamp(\u0026mut self) {\n        self.scroll = self.scroll.min(self.max_scroll());\n    }\n\n    fn scroll_by(\u0026mut self, delta: isize) {\n        let target = self.scroll as isize + delta;\n        self.scroll = target.clamp(0, self.max_scroll() as isize) as usize;\n    }\n\n    fn current_file(\u0026self) -\u003e Option\u003cusize\u003e {\n        self.file_starts\n            .iter()\n            .rposition(|start| *start \u003c= self.scroll)\n    }\n\n    fn jump_file(\u0026mut self, delta: isize) {\n        if self.file_starts.is_empty() {\n            return;\n        }\n        let next = match self.current_file() {\n            Some(current) =\u003e {\n                (current as isize + delta).rem_euclid(self.file_starts.len() as isize) as usize\n            }\n            None if delta \u003e= 0 =\u003e 0,\n            None =\u003e self.file_starts.len() - 1,\n        };\n        self.scroll = self.file_starts[next];\n    }\n\n    fn relayout(\u0026mut self, width: usize, height: usize) {\n        let anchor = self.scroll;\n        self.width = width;\n        self.height = height;\n        self.rows = diff::layout(self.preview, width);\n        self.file_starts = file_starts(\u0026self.rows);\n        self.scroll = anchor.min(self.max_scroll());\n    }\n\n    fn draw(\u0026mut self, out: \u0026mut impl Write) -\u003e io::Result\u003c()\u003e {\n        self.clamp();\n        let width = self.width;\n\n        queue!(out, MoveTo(0, 0), Clear(ClearType::CurrentLine))?;\n        if self.theme.is_ansi() {\n            queue!(out, SetAttribute(Attribute::Reverse))?;\n        }\n        let title = format!(\n            \" approval · {} · +{} -{} \",\n            diff::clean_text(\u0026self.request.summary),\n            self.preview.added,\n            self.preview.removed\n        );\n        write!(out, \"{}\", pad_to(\u0026title, width))?;\n        if self.theme.is_ansi() {\n            queue!(out, SetAttribute(Attribute::Reset))?;\n        }\n\n        for offset in 0..self.body_height() {\n            queue!(\n                out,\n                MoveTo(0, (offset + 1) as u16),\n                Clear(ClearType::CurrentLine)\n            )?;\n            if let Some(row) = self.rows.get(self.scroll + offset) {\n                print_row(out, row, self.theme)?;\n","truncated":true},{"path":"crates/niucode-cli/src/editor.rs","language":"rust","text":"//! Minimal readline-style editor for the linear TUI.\n//!\n//! rustyline can list completions on Tab, but it cannot refresh a menu on every\n//! keystroke. Slash commands are a small, deterministic set, so a focused editor\n//! gives us the `/i -\u003e /init` menu without pulling a terminal UI framework in.\n\nuse std::io::{stdout, IsTerminal, Write};\nuse std::sync::atomic::{AtomicU64, Ordering};\n\nuse crossterm::cursor::{position, Hide, MoveLeft, MoveRight, MoveToColumn, MoveUp, Show};\nuse crossterm::event::{\n    self, DisableBracketedPaste, DisableMouseCapture, EnableBracketedPaste, EnableMouseCapture,\n    Event, KeyCode, KeyEventKind, KeyModifiers, MouseButton, MouseEventKind,\n};\nuse crossterm::execute;\nuse crossterm::terminal::{self, disable_raw_mode, enable_raw_mode, Clear, ClearType};\nuse unicode_width::{UnicodeWidthChar, UnicodeWidthStr};\n\nuse crate::slash::{CommandRegistry, CommandSpec};\nuse crate::theme::Theme;\n\nconst MAX_MENU_ROWS: usize = 6;\nconst MENU_NAME_WIDTH: usize = 10;\nconst MENU_PREFIX_WIDTH: usize = 2;\nstatic MOUSE_EVENTS: AtomicU64 = AtomicU64::new(0);\n\n/// Number of mouse events delivered to the line editor in this process.\npub fn mouse_events_seen() -\u003e u64 {\n    MOUSE_EVENTS.load(Ordering::Relaxed)\n}\n\n#[derive(Debug, Clone, PartialEq, Eq)]\npub enum Input {\n    Line(String),\n    Interrupted,\n    Eof,\n}\n\n#[derive(Clone)]\nstruct MenuItem {\n    insert: String,\n    name: String,\n    description: String,\n}\n\npub struct LineEditor {\n    registry: CommandRegistry,\n    history: Vec\u003cString\u003e,\n    models: Vec\u003cString\u003e,\n    current_model: String,\n    permissions: Vec\u003c(String, String)\u003e,\n    skills: Vec\u003cString\u003e,\n}\n\nimpl LineEditor {\n    pub fn new(registry: CommandRegistry) -\u003e Self {\n        Self {\n            registry,\n            history: Vec::new(),\n            models: Vec::new(),\n            current_model: String::new(),\n            permissions: Vec::new(),\n            skills: Vec::new(),\n        }\n    }\n\n    pub fn set_models(\u0026mut self, models: Vec\u003cString\u003e) {\n        self.models = models;\n    }\n\n    pub fn set_current_model(\u0026mut self, model: impl Into\u003cString\u003e) {\n        self.current_model = model.into();\n    }\n\n    pub fn set_permissions(\u0026mut self, permissions: Vec\u003c(String, String)\u003e) {\n        self.permissions = permissions;\n    }\n\n    pub fn set_skills(\u0026mut self, skills: Vec\u003cString\u003e) {\n        self.skills = skills;\n    }\n\n    pub fn clear_history(\u0026mut self) {\n        self.history.clear();\n    }\n\n    pub fn read_line(\n        \u0026mut self,\n        raw_prompt: \u0026str,\n        styled_prompt: \u0026str,\n        theme: Theme,\n    ) -\u003e std::io::Result\u003cInput\u003e {\n        if !std::io::stdin().is_terminal() || !std::io::stdout().is_terminal() {\n            return Err(std::io::Error::other(\"line editor requires a TTY\"));\n        }\n\n        let history_index = self.history.len();\n        let mut state = State {\n            registry: \u0026self.registry,\n            history: \u0026mut self.history,\n            models: \u0026self.models,\n            current_model: \u0026self.current_model,\n            permissions: \u0026self.permissions,\n            skills: \u0026self.skills,\n            history_index,\n            chars: Vec::new(),\n            cursor: 0,\n            selected: 0,\n            menu_open: false,\n            scroll: 0,\n            history_search: None,\n            history_query: None,\n            prompt_row: None,\n            mouse_failed: false,\n            mouse_captured: false,\n            mouse_anchor: None,\n            menu_navigated: false,\n            raw_prompt,\n            styled_prompt,\n            theme,\n        };\n\n        let _guard = TerminalGuard::enter()?;\n        state.run(\u0026mut stdout())\n    }\n}\n\npub(crate) struct TerminalGuard;\n\nimpl TerminalGuard {\n    pub(crate) fn enter() -\u003e std::io::Result\u003cSelf\u003e {\n        enable_raw_mode()?;\n        let mut out = stdout();\n        if let Err(error) = execute!(out, EnableBracketedPaste, Hide) {\n            let _ = disable_raw_mode();\n            return Err(error);\n        }\n        Ok(Self)\n    }\n}\n\nimpl Drop for TerminalGuard {\n    fn drop(\u0026mut self) {\n        let mut out = stdout();\n        let _ = execute!(out, DisableMouseCapture, DisableBracketedPaste, Show);\n        let _ = disable_raw_mode();\n    }\n}\n\nstruct State\u003c'a\u003e {\n    registry: \u0026'a CommandRegistry,\n    history: \u0026'a mut Vec\u003cString\u003e,\n    models: \u0026'a [String],\n    current_model: \u0026'a str,\n    permissions: \u0026'a [(String, String)],\n    skills: \u0026'a [String],\n    history_index: usize,\n    chars: Vec\u003cchar\u003e,\n    cursor: usize,\n    selected: usize,\n    menu_open: bool,\n    scroll: usize,\n    history_search: Option\u003cusize\u003e,\n    history_query: Option\u003cString\u003e,\n    prompt_row: Option\u003cu16\u003e,\n    mouse_failed: bool,\n    mouse_captured: bool,\n    mouse_anchor: Option\u003cu16\u003e,\n    menu_navigated: bool,\n    raw_prompt: \u0026'a str,\n    styled_prompt: \u0026'a str,\n    theme: Theme,\n}\n\nimpl State\u003c'_\u003e {\n    fn run(\u0026mut self, out: \u0026mut impl Write) -\u003e std::io::Result\u003cInput\u003e {\n        self.refresh_menu();\n        self.sync_mouse_capture(out)?;\n        self.render(out)?;\n\n        loop {\n            match event::read()? {\n                Event::Key(key) =\u003e {\n                    if key.kind == KeyEventKind::Release {\n                        continue;\n                    }\n                    if let Some(input) = self.handle_key(key, out)? {\n                        return Ok(input);\n                    }\n                    self.refresh_menu();\n                    self.sync_mouse_capture(out)?;\n                    self.render(out)?;\n                }\n                Event::Paste(text) =\u003e {\n                    let text = text.replace(['\\r', '\\n'], \" \");\n                    self.insert(\u0026text);\n                    self.refresh_menu();\n                    self.sync_mouse_capture(out)?;\n                    self.render(out)?;\n                }\n","truncated":true}]},{"id":"loop","title":"Agent Loop","layer":"engine","status":"active","summary":"最小 turn loop：流式文本、tool call 聚合、工具派发、事件落盘、上下文压缩、分层指令与并行只读 subagent。","contract":"run(provider, session, config, prompt, observer)；不解析 wire format，不实现工具；请求前按预算压缩；subagent 任务有独立日志与预算。","paths":["crates/niucode-agent/src/lib.rs","crates/niucode-agent/src/subagent.rs"],"notes":["assistant 消息先落盘，再落 tool_result。","max steps 到达时停止并报错，不静默退出。","Ctrl-C 通过 drop future 取消 provider/工具；bash 进程组被清理。","请求前检查上下文预算；压缩成功才追加 compaction 事件，失败保留原上下文。","subagent 只读、并行、每个任务独立 session；父 session 记录 spawn/result。","PlanMode/GoalSet/GoalCleared events are kernel-defined; plan/goal are injected into the system prompt, not a second state store."],"sources":[{"path":"crates/niucode-agent/src/lib.rs","language":"rust","text":"//! Minimal turn loop.\n//!\n//! The loop owns the conversation order, tool dispatch, and session events. It\n//! does not know about wire formats or concrete tools; those live in\n//! `niucode-provider` and `niucode-tools`.\n\nuse std::collections::BTreeMap;\nuse std::path::PathBuf;\nuse std::sync::Arc;\nuse std::time::Duration;\n\nuse anyhow::{bail, Result};\nuse futures_util::StreamExt;\nuse niucode_core::{now_ms, Event, SessionLog, ToolCall, Usage};\nuse niucode_provider::{ChatMessage, CompletionRequest, Provider, ProviderError, StreamEvent};\nuse niucode_tools::{ChangePreview, SandboxPolicy, Toolbox};\nuse serde_json::{json, Value};\n\nmod context;\nmod instructions;\nmod subagent;\n\nconst MAX_PROVIDER_RETRIES: usize = 3;\nconst MAX_TOOL_OUTPUT_BYTES: usize = 1_048_576;\nconst TOOL_OUTPUT_HEAD_BYTES: usize = 65_536;\nconst TOOL_OUTPUT_TAIL_BYTES: usize = 65_536;\nconst RETRY_BASE_MS: u64 = 250;\nconst MAX_RETRY_DELAY_SECS: u64 = 10;\nconst UNBOUNDED_SAFETY_TURNS: usize = 256;\n\nuse context::non_empty;\npub use context::{\n    build_handoff, estimate_context, project_history, ContextConfig, Handoff,\n    DEFAULT_COMPACT_AT_PERCENT, DEFAULT_CONTEXT_BUDGET, DEFAULT_KEEP_RECENT_TURNS,\n};\npub use instructions::{compose_system_prompt, load as load_instructions, Instructions};\n\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum ApprovalMode {\n    Ask,\n    OnFailure,\n    Never,\n}\n\nimpl ApprovalMode {\n    pub fn as_str(self) -\u003e \u0026'static str {\n        match self {\n            Self::Ask =\u003e \"ask\",\n            Self::OnFailure =\u003e \"on-failure\",\n            Self::Never =\u003e \"never\",\n        }\n    }\n}\n\n#[derive(Debug, Clone)]\npub struct ApprovalRequest {\n    pub tool: String,\n    pub summary: String,\n    /// Full structured preview for file-changing tools.\n    pub preview: Option\u003cChangePreview\u003e,\n}\n\n#[derive(Clone)]\npub struct AgentConfig {\n    pub provider: String,\n    pub model: String,\n    pub max_steps: usize,\n    pub system_prompt: String,\n    pub working_dir: PathBuf,\n    pub sandbox: SandboxPolicy,\n    pub approval: ApprovalMode,\n    pub allow_unsandboxed: bool,\n    pub context: ContextConfig,\n    /// Recompute the context budget from the selected model catalog on each turn.\n    pub context_budget_auto: bool,\n    /// When set, only these tool names are advertised and executable.\n    pub allowed_tools: Option\u003cVec\u003cString\u003e\u003e,\n    /// Read-only planning mode. The loop still runs, but the prompt tells the\n    /// model not to modify files; the TUI also narrows `allowed_tools`.\n    pub plan_mode: bool,\n    /// Active session goal / completion condition, injected into the system\n    /// prompt and preserved across compaction/resume.\n    pub goal: Option\u003cString\u003e,\n    /// Optional session-scoped sidecar host. External tools are merged into the\n    /// advertised tool list and dispatched after the built-ins.\n    pub extension_host: Option\u003cArc\u003cniucode_extension::ExtensionHost\u003e\u003e,\n    /// Shared W1 write lock. Parent and Worker subagents use the same lock so\n    /// mutating built-ins never race on one workspace.\n    pub write_lock: Option\u003cArc\u003ctokio::sync::Mutex\u003c()\u003e\u003e\u003e,\n    /// Optional workspace-relative path prefixes for write/edit. bash is not\n    /// path-scoped; it is serialized by `write_lock` instead.\n    pub write_scope: Option\u003cVec\u003cString\u003e\u003e,\n    /// Extra read-only roots (trusted skill bodies).\n    pub read_roots: Vec\u003cPathBuf\u003e,\n    /// Global workspace worktree root for isolated Worker subagents.\n    pub worktree_root: Option\u003cPathBuf\u003e,\n    /// Explicit opt-in for subagent `profile = \"inherit\"`. Off by default;\n    /// inherit still strips the nested `subagent` tool.\n    pub allow_subagent_inheritance: bool,\n}\n\nimpl AgentConfig {\n    pub fn new(model: impl Into\u003cString\u003e, working_dir: impl Into\u003cPathBuf\u003e) -\u003e Self {\n        let working_dir = working_dir.into();\n        let system_prompt = format!(\n            \"You are niucode, a minimal coding agent working inside {}.\\n\\\n             Use the provided tools to inspect and modify files. Read a file before editing it.\\n\\\n             Prefer small, verifiable changes and run tests with bash when useful.\\n\\\n             When the task is complete, reply with a concise summary of what changed and any remaining issues.\\n\\\n             Do not claim success you have not verified.\",\n            working_dir.display()\n        );\n\n        Self {\n            provider: \"deepseek\".into(),\n            model: model.into(),\n            // 0 means no user-facing hard cap. The loop still has a high\n            // safety ceiling; normal termination is the model's final answer.\n            max_steps: 0,\n            system_prompt,\n            working_dir,\n            sandbox: SandboxPolicy::default(),\n            approval: ApprovalMode::OnFailure,\n            allow_unsandboxed: false,\n            context: ContextConfig::default(),\n            context_budget_auto: false,\n            allowed_tools: None,\n            plan_mode: false,\n            goal: None,\n            extension_host: None,\n            write_lock: None,\n            write_scope: None,\n            read_roots: Vec::new(),\n            worktree_root: None,\n            allow_subagent_inheritance: false,\n        }\n    }\n}\n\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum LoopPhase {\n    Project,\n    Request,\n    Stream,\n    Tool,\n    Turn,\n    Done,\n}\n\nimpl LoopPhase {\n    pub fn as_str(self) -\u003e \u0026'static str {\n        match self {\n            Self::Project =\u003e \"project\",\n            Self::Request =\u003e \"request\",\n            Self::Stream =\u003e \"stream\",\n            Self::Tool =\u003e \"tool\",\n            Self::Turn =\u003e \"turn\",\n            Self::Done =\u003e \"done\",\n        }\n    }\n}\n\n#[derive(Debug, Clone)]\npub enum AgentEvent {\n    Phase(LoopPhase),\n    TextDelta(String),\n    ReasoningDelta(String),\n    ToolCall {\n        name: String,\n        input: Value,\n    },\n    ToolResult {\n        name: String,\n        ok: bool,\n        summary: String,\n        output: String,\n    },\n    TurnEnd {\n        usage: Usage,\n    },\n    Compaction {\n        replaced_events: usize,\n        before_tokens: usize,\n        after_tokens: usize,\n    },\n    Warning(String),\n}\n\n#[derive(Debug, Clone)]\npub struct RunOutcome {\n    pub turns: usize,\n    pub usage: Usage,\n    pub final_text: String,\n}\n\npub async fn run(\n    provider: \u0026dyn Provider,\n    session: \u0026mut SessionLog,\n    config: \u0026AgentConfig,\n    prompt: \u0026str,\n","truncated":true},{"path":"crates/niucode-agent/src/subagent.rs","language":"rust","text":"//! Read-only parallel subagents with independent session logs.\n\nuse std::path::{Path, PathBuf};\nuse std::process::Command;\nuse std::time::Duration;\n\nuse anyhow::{bail, Context, Result};\nuse futures_util::future::join_all;\nuse niucode_core::{now_ms, Event, SessionLog, ToolCall, Usage};\nuse niucode_provider::Provider;\nuse niucode_tools::{NetworkMode, SandboxMode, SandboxPolicy, ToolResult, Toolbox};\nuse serde_json::Value;\n\nuse crate::{run, AgentConfig, ApprovalMode};\n\nconst MAX_TASKS: usize = 4;\nconst MAX_STEPS: usize = 12;\nconst MAX_TIMEOUT_SECS: u64 = 600;\nconst MAX_PROMPT_CHARS: usize = 8_000;\nconst MAX_SUMMARY_CHARS: usize = 2_000;\nconst MAX_EVENT_TASK_CHARS: usize = 4_000;\nconst SUBAGENT_CONTEXT_BUDGET: usize = 16_000;\nconst SUBAGENT_TOOLS: [\u0026str; 3] = [\"read\", \"grep\", \"glob\"];\n\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\nenum SubagentProfile {\n    Explore,\n    Worker,\n    Inherit,\n}\n\nimpl SubagentProfile {\n    fn as_str(self) -\u003e \u0026'static str {\n        match self {\n            Self::Explore =\u003e \"explore\",\n            Self::Worker =\u003e \"worker\",\n            Self::Inherit =\u003e \"inherit\",\n        }\n    }\n}\n\nstruct TaskSpec {\n    prompt: String,\n    profile: SubagentProfile,\n    write_scope: Option\u003cVec\u003cString\u003e\u003e,\n    worktree: bool,\n    max_steps: usize,\n    timeout_secs: u64,\n}\n\nstruct SubagentOutcome {\n    ok: bool,\n    summary: String,\n    session: std::path::PathBuf,\n}\n\n/// Execute the `subagent` tool. Errors become an ordinary failed tool result.\npub async fn run_tool(\n    provider: \u0026dyn Provider,\n    parent_session: \u0026mut SessionLog,\n    parent_config: \u0026AgentConfig,\n    call: \u0026ToolCall,\n) -\u003e ToolResult {\n    match run_tasks(provider, parent_session, parent_config, call).await {\n        Ok(outcomes) =\u003e {\n            let ok = outcomes.iter().all(|outcome| outcome.ok);\n            ToolResult {\n                ok,\n                output: render_outcomes(\u0026outcomes),\n            }\n        }\n        Err(error) =\u003e ToolResult {\n            ok: false,\n            output: format!(\"error: {error:#}\"),\n        },\n    }\n}\n\nasync fn run_tasks(\n    provider: \u0026dyn Provider,\n    parent_session: \u0026mut SessionLog,\n    parent_config: \u0026AgentConfig,\n    call: \u0026ToolCall,\n) -\u003e Result\u003cVec\u003cSubagentOutcome\u003e\u003e {\n    let tasks = parse_tasks(\u0026call.input)?;\n    if tasks\n        .iter()\n        .any(|task| task.profile == SubagentProfile::Inherit)\n        \u0026\u0026 !parent_config.allow_subagent_inheritance\n    {\n        bail!(\n            \"subagent profile \\\"inherit\\\" requires --allow-subagent-inheritance (explicit opt-in)\"\n        );\n    }\n    let directory = parent_session\n        .path()\n        .parent()\n        .filter(|parent| !parent.as_os_str().is_empty())\n        .unwrap_or_else(|| Path::new(\".\"))\n        .join(format!(\"{}.subagents\", parent_session.id()));\n    std::fs::create_dir_all(\u0026directory)\n        .with_context(|| format!(\"create subagent session directory {}\", directory.display()))?;\n\n    let mut jobs = Vec::with_capacity(tasks.len());\n    for (index, task) in tasks.into_iter().enumerate() {\n        let id = format!(\"{}.{}\", call.id, index + 1);\n        let mut config = subagent_config(parent_config, \u0026task);\n        let worktree = if task.worktree {\n            match Worktree::create(parent_config, \u0026id) {\n                Some(worktree) =\u003e {\n                    config.working_dir = worktree.path.clone();\n                    config.write_lock = None;\n                    Some(worktree)\n                }\n                None =\u003e {\n                    eprintln!(\n                        \"warning: worktree unavailable; worker {id} uses the shared workspace\"\n                    );\n                    None\n                }\n            }\n        } else {\n            None\n        };\n        let mut session = SessionLog::create(\u0026directory)?;\n        session.append(\u0026Event::SessionStart {\n            id: id.clone(),\n            cwd: parent_config.working_dir.display().to_string(),\n            model: parent_config.model.clone(),\n            provider: parent_config.provider.clone(),\n            ts: now_ms(),\n        })?;\n        session.append(\u0026Event::Policy {\n            sandbox: config.sandbox.mode.as_str().into(),\n            approval: config.approval.as_str().into(),\n            network: config.sandbox.network.as_str().into(),\n            backend: config.sandbox.backend().into(),\n            ts: now_ms(),\n        })?;\n        let session_path = session.path().to_path_buf();\n        parent_session.append(\u0026Event::SubagentSpawn {\n            id: id.clone(),\n            call_id: call.id.clone(),\n            task: task.prompt.chars().take(MAX_EVENT_TASK_CHARS).collect(),\n            profile: task.profile.as_str().to_string(),\n            session: session_path.display().to_string(),\n            max_steps: task.max_steps as u64,\n            timeout_secs: task.timeout_secs,\n            context_budget: config.context.budget_tokens as u64,\n            ts: now_ms(),\n        })?;\n        jobs.push((id, task, session, session_path, config, worktree));\n    }\n\n    let futures = jobs.into_iter().map(\n        |(id, task, mut session, session_path, config, worktree)| async move {\n            let timeout_secs = task.timeout_secs;\n            let result = tokio::time::timeout(\n                Duration::from_secs(timeout_secs),\n                run(\n                    provider,\n                    \u0026mut session,\n                    \u0026config,\n                    \u0026task.prompt,\n                    \u0026mut |_| false,\n                    \u0026mut |_| {},\n                ),\n            )\n            .await;\n\n            let (ok, summary, turns, usage) = match result {\n                Ok(Ok(outcome)) =\u003e (\n                    true,\n                    outcome.final_text,\n                    outcome.turns as u64,\n                    outcome.usage,\n                ),\n                Ok(Err(error)) =\u003e {\n                    let _ = session.append(\u0026Event::SessionEnd { ts: now_ms() });\n                    (false, format!(\"error: {error:#}\"), 0, Usage::default())\n                }\n                Err(_) =\u003e {\n                    let _ = session.append(\u0026Event::SessionEnd { ts: now_ms() });\n                    (\n                        false,\n                        format!(\"timeout after {timeout_secs}s\"),\n                        0,\n                        Usage::default(),\n                    )\n                }\n            };\n\n            let patch = worktree.and_then(Worktree::finish);\n            let summary = match patch {\n                Some(patch) =\u003e format!(\n                    \"worktree patch: {}\\n\\n{}\",\n                    patch.display(),\n                    summarize(\u0026summary)\n                ),\n                None =\u003e summarize(\u0026summary),\n","truncated":true}]},{"id":"context","title":"Context","layer":"engine","status":"active","summary":"把全量事件日志投影成模型上下文：分层 AGENTS.md、token 估算、75% 预算触发、确定性 handoff、resume 回放与缓存命中率。","contract":"project_history(events) -\u003e Result\u003cVec\u003cChatMessage\u003e\u003e；build_handoff(events, keep_recent_turns) -\u003e Result\u003cHandoff\u003e；load(cwd) -\u003e Instructions；只读日志，压缩落成 compaction 事件。","paths":["crates/niucode-agent/src/context.rs","crates/niucode-agent/src/instructions.rs"],"notes":["日志是全量，上下文是投影；压缩只影响投影，不修改历史。","75% 预算触发确定性 handoff；保留最近 N 个 user turn，单 turn 长任务回退到 assistant 边界。","compaction.upto 是事件绝对下标；最后一个 compaction 生效。","AGENTS.md 每次 run 从 cwd 向上发现，近者优先，追加在稳定前缀之后。","instructions 事件记录 sources + digest；缓存命中率从 turn_end.usage 派生。"],"sources":[{"path":"crates/niucode-agent/src/context.rs","language":"rust","text":"//! Context projection, token estimation, and deterministic compaction.\n//!\n//! The event log is the truth. A projection is a lossy model context built from\n//! that log; compaction appends a new event and never rewrites history.\n\nuse std::collections::{BTreeSet, HashMap};\n\nuse anyhow::{bail, Result};\nuse niucode_core::{Event, ToolCall};\nuse niucode_provider::{ChatMessage, ToolSpec};\n\npub const DEFAULT_CONTEXT_BUDGET: usize = 64_000;\npub const DEFAULT_COMPACT_AT_PERCENT: u8 = 75;\npub const DEFAULT_KEEP_RECENT_TURNS: usize = 3;\n\nconst MIN_KEEP_EVENTS: usize = 8;\nconst MAX_ACTIONS: usize = 12;\nconst MAX_CHANGED_FILES: usize = 20;\nconst MAX_FAILURES: usize = 3;\nconst GOAL_CHARS: usize = 1_500;\nconst ASSISTANT_CHARS: usize = 1_000;\nconst FAILURE_CHARS: usize = 240;\nconst ACTION_CHARS: usize = 200;\n\n#[derive(Debug, Clone)]\npub struct ContextConfig {\n    /// Approximate model context window, in tokens.\n    pub budget_tokens: usize,\n    /// Compact when the estimate reaches this percentage of the budget.\n    pub compact_at_percent: u8,\n    /// Number of most recent user turns kept verbatim.\n    pub keep_recent_turns: usize,\n}\n\nimpl Default for ContextConfig {\n    fn default() -\u003e Self {\n        Self {\n            budget_tokens: DEFAULT_CONTEXT_BUDGET,\n            compact_at_percent: DEFAULT_COMPACT_AT_PERCENT,\n            keep_recent_turns: DEFAULT_KEEP_RECENT_TURNS,\n        }\n    }\n}\n\nimpl ContextConfig {\n    pub fn should_compact(\u0026self, estimated_tokens: usize) -\u003e bool {\n        if self.budget_tokens == 0 {\n            return false;\n        }\n        let percent = self.compact_at_percent.clamp(1, 100) as usize;\n        let threshold = self.budget_tokens.saturating_mul(percent).div_ceil(100);\n        estimated_tokens \u003e= threshold\n    }\n}\n\n#[derive(Debug, Clone, PartialEq, Eq)]\npub struct Handoff {\n    pub summary: String,\n    /// Absolute event index replaced by this summary: `events[..upto]`.\n    pub upto: usize,\n}\n\n/// Approximate tokens without a model-specific tokenizer.\n///\n/// ASCII text averages roughly four characters per token; non-ASCII characters\n/// are counted one token each. This is conservative enough for a budget guard,\n/// not a billing estimate.\npub fn estimate_text_tokens(text: \u0026str) -\u003e usize {\n    let mut ascii = 0_usize;\n    let mut other = 0_usize;\n    for character in text.chars() {\n        if character.is_ascii() {\n            ascii += 1;\n        } else {\n            other += 1;\n        }\n    }\n    ascii.div_ceil(4) + other\n}\n\npub fn estimate_message_tokens(message: \u0026ChatMessage) -\u003e usize {\n    let mut tokens = 4;\n    if let Some(content) = \u0026message.content {\n        tokens += estimate_text_tokens(content);\n    }\n    if let Some(reasoning) = \u0026message.reasoning_content {\n        tokens += estimate_text_tokens(reasoning);\n    }\n    if let Some(calls) = \u0026message.tool_calls {\n        for call in calls {\n            tokens += 4\n                + estimate_text_tokens(\u0026call.function.name)\n                + estimate_text_tokens(\u0026call.function.arguments);\n        }\n    }\n    if let Some(call_id) = \u0026message.tool_call_id {\n        tokens += estimate_text_tokens(call_id);\n    }\n    tokens\n}\n\npub fn estimate_tool_tokens(tool: \u0026ToolSpec) -\u003e usize {\n    8 + estimate_text_tokens(\u0026tool.function.name)\n        + estimate_text_tokens(\u0026tool.function.description)\n        + estimate_text_tokens(\u0026tool.function.parameters.to_string())\n}\n\npub fn estimate_context(messages: \u0026[ChatMessage], tools: \u0026[ToolSpec]) -\u003e usize {\n    let message_tokens = messages.iter().map(estimate_message_tokens).sum::\u003cusize\u003e();\n    let tool_tokens = tools.iter().map(estimate_tool_tokens).sum::\u003cusize\u003e();\n    message_tokens + tool_tokens\n}\n\n/// Rebuild provider messages from durable session events.\n///\n/// The last `compaction` event applies to `events[..upto]`: its summary is\n/// inserted at the cutoff, older compactions are ignored, and the compaction\n/// event itself is never projected at its physical position.\npub fn project_history(events: \u0026[Event]) -\u003e Result\u003cVec\u003cChatMessage\u003e\u003e {\n    let active_compaction = events\n        .iter()\n        .enumerate()\n        .rev()\n        .find(|(_, event)| matches!(event, Event::Compaction { .. }))\n        .and_then(|(index, event)| match event {\n            Event::Compaction { summary, upto, .. } =\u003e {\n                let cutoff = usize::try_from(*upto).unwrap_or(usize::MAX);\n                (!summary.is_empty() \u0026\u0026 cutoff \u003c= index).then_some((cutoff, summary.as_str()))\n            }\n            _ =\u003e None,\n        });\n\n    let (cutoff, summary) = active_compaction.unwrap_or((0, \"\"));\n    let mut messages = Vec::new();\n    let mut pending_tools: Vec\u003cString\u003e = Vec::new();\n\n    if !summary.is_empty() {\n        messages.push(ChatMessage::system(summary.to_string()));\n    }\n\n    for (index, event) in events.iter().enumerate() {\n        if index \u003c cutoff {\n            continue;\n        }\n        match event {\n            Event::SessionStart { .. }\n            | Event::TurnEnd { .. }\n            | Event::Policy { .. }\n            | Event::Approval { .. }\n            | Event::Fork { .. }\n            | Event::SubagentSpawn { .. }\n            | Event::SubagentResult { .. }\n            | Event::PlanMode { .. }\n            | Event::GoalSet { .. }\n            | Event::GoalCleared { .. }\n            | Event::GoalVerdict { .. }\n            | Event::ModelChange { .. }\n            | Event::PermissionChange { .. }\n            | Event::ExtensionMount { .. }\n            | Event::ExtensionUnmount { .. }\n            | Event::ExtensionError { .. }\n            | Event::Instructions { .. }\n            | Event::Compaction { .. }\n            | Event::InitProposal { .. }\n            | Event::SessionEnd { .. } =\u003e {}\n            Event::UserMessage { text, .. } =\u003e {\n                flush_pending_tools(\u0026mut messages, \u0026mut pending_tools);\n                messages.push(ChatMessage::user(text.clone()));\n            }\n            Event::AssistantMessage {\n                text,\n                reasoning,\n                tool_calls,\n                ..\n            } =\u003e {\n                messages.push(ChatMessage::assistant(\n                    non_empty(text.clone()),\n                    reasoning.clone().filter(|value| !value.is_empty()),\n                    tool_calls.clone(),\n                ));\n                pending_tools = tool_calls.iter().map(|call| call.id.clone()).collect();\n            }\n            Event::ToolResult {\n                call_id, output, ..\n            } =\u003e {\n                pending_tools.retain(|pending| pending != call_id);\n                messages.push(ChatMessage::tool(call_id.clone(), output.clone()));\n            }\n        }\n    }\n\n    flush_pending_tools(\u0026mut messages, \u0026mut pending_tools);\n    Ok(messages)\n}\n\n/// Build a deterministic handoff and choose the cutoff it summarizes.\n///\n/// Multi-turn sessions keep the last `keep_recent_turns` user turns verbatim.\n/// A single long turn falls back to keeping the tail after a safe assistant\n/// message instead, so one huge turn can still be compacted.\n","truncated":true},{"path":"crates/niucode-agent/src/instructions.rs","language":"rust","text":"//! Layered `AGENTS.md` discovery.\n//!\n//! Instructions are discovered from the working directory up to the filesystem\n//! root, nearest first. They are appended after the stable system prompt so the\n//! prefix stays cache-friendly and changes only when a file changes.\n\nuse std::fs;\nuse std::path::Path;\n\nconst MAX_FILE_BYTES: usize = 32 * 1024;\nconst MAX_TOTAL_BYTES: usize = 64 * 1024;\n\n#[derive(Debug, Clone, Default, PartialEq, Eq)]\npub struct Instructions {\n    /// Merged instruction text, empty when no `AGENTS.md` was found.\n    pub text: String,\n    /// Absolute paths that contributed text, nearest first.\n    pub sources: Vec\u003cString\u003e,\n    /// Stable FNV-1a digest of the merged text, used to explain cache changes.\n    pub digest: String,\n    /// Read or truncation problems worth surfacing.\n    pub warnings: Vec\u003cString\u003e,\n}\n\npub fn load(cwd: \u0026Path) -\u003e Instructions {\n    let mut instructions = Instructions::default();\n    let mut sections = Vec::new();\n    let mut total_bytes = 0_usize;\n    let mut omitted = false;\n\n    for directory in cwd.ancestors() {\n        let path = directory.join(\"AGENTS.md\");\n        if !path.is_file() {\n            continue;\n        }\n\n        let bytes = match fs::read(\u0026path) {\n            Ok(bytes) =\u003e bytes,\n            Err(error) =\u003e {\n                instructions\n                    .warnings\n                    .push(format!(\"cannot read {}: {error}\", path.display()));\n                continue;\n            }\n        };\n        if bytes.len() \u003e MAX_FILE_BYTES {\n            instructions.warnings.push(format!(\n                \"{} is larger than {MAX_FILE_BYTES} bytes; truncated\",\n                path.display()\n            ));\n        }\n        let bytes = \u0026bytes[..bytes.len().min(MAX_FILE_BYTES)];\n        let content = String::from_utf8_lossy(bytes).trim().to_string();\n        if content.is_empty() {\n            continue;\n        }\n\n        let section = format!(\"### {}\\n\\n{content}\\n\\n\", path.display());\n        if total_bytes + section.len() \u003e MAX_TOTAL_BYTES {\n            omitted = true;\n            break;\n        }\n        total_bytes += section.len();\n        instructions.sources.push(path.display().to_string());\n        sections.push(section);\n    }\n\n    if sections.is_empty() {\n        return instructions;\n    }\n\n    let mut text = String::new();\n    text.push_str(\"## Repository instructions\\n\\n\");\n    text.push_str(\n        \"The following AGENTS.md files apply to this workspace. Nearer files are listed first and take precedence when instructions conflict.\\n\\n\",\n    );\n    for section in sections {\n        text.push_str(\u0026section);\n    }\n    if omitted {\n        text.push_str(\n            \"_Additional AGENTS.md files were omitted because the instruction budget was exhausted._\\n\",\n        );\n    }\n\n    instructions.digest = digest(\u0026text);\n    instructions.text = text;\n    instructions\n}\n\n/// Compose the stable base prompt with discovered instructions.\npub fn compose_system_prompt(base: \u0026str, instructions: \u0026str) -\u003e String {\n    if instructions.is_empty() {\n        base.to_string()\n    } else {\n        format!(\"{base}\\n\\n{instructions}\")\n    }\n}\n\nfn digest(text: \u0026str) -\u003e String {\n    let mut hash = 0xcbf2_9ce4_8422_2325_u64;\n    for byte in text.as_bytes() {\n        hash ^= u64::from(*byte);\n        hash = hash.wrapping_mul(0x0000_0100_0000_01b3);\n    }\n    format!(\"{hash:016x}\")\n}\n\n#[cfg(test)]\nmod tests {\n    use std::fs;\n    use std::path::PathBuf;\n    use std::sync::atomic::{AtomicU64, Ordering};\n    use std::time::{SystemTime, UNIX_EPOCH};\n\n    use super::*;\n\n    fn temp_dir(tag: \u0026str) -\u003e PathBuf {\n        static COUNTER: AtomicU64 = AtomicU64::new(0);\n        let sequence = COUNTER.fetch_add(1, Ordering::Relaxed);\n        let stamp = SystemTime::now()\n            .duration_since(UNIX_EPOCH)\n            .unwrap_or_default()\n            .as_nanos();\n        let directory =\n            std::env::temp_dir().join(format!(\"niucode-instructions-{tag}-{stamp}-{sequence}\"));\n        let _ = fs::remove_dir_all(\u0026directory);\n        fs::create_dir_all(\u0026directory).expect(\"create temp dir\");\n        directory\n    }\n\n    #[test]\n    fn nearest_file_is_listed_first() {\n        let root = temp_dir(\"layers\");\n        let child = root.join(\"crates/app\");\n        fs::create_dir_all(\u0026child).expect(\"child\");\n        fs::write(root.join(\"AGENTS.md\"), \"root rule\\n\").expect(\"root rule\");\n        fs::write(child.join(\"AGENTS.md\"), \"child rule\\n\").expect(\"child rule\");\n\n        let loaded = load(\u0026child);\n        assert!(loaded.sources.len() \u003e= 2);\n        assert!(loaded.sources[0].ends_with(\"crates/app/AGENTS.md\"));\n        assert!(loaded.sources[1].ends_with(\"AGENTS.md\"));\n        let child_position = loaded.text.find(\"child rule\").expect(\"child\");\n        let root_position = loaded.text.find(\"root rule\").expect(\"root\");\n        assert!(child_position \u003c root_position);\n        assert_eq!(loaded.digest.len(), 16);\n\n        fs::remove_dir_all(root).expect(\"cleanup\");\n    }\n\n    #[test]\n    fn modifying_a_file_changes_the_digest() {\n        let directory = temp_dir(\"change\");\n        let path = directory.join(\"AGENTS.md\");\n        fs::write(\u0026path, \"first\\n\").expect(\"write\");\n        let first = load(\u0026directory);\n        fs::write(\u0026path, \"second\\n\").expect(\"rewrite\");\n        let second = load(\u0026directory);\n        assert_eq!(first.sources, second.sources);\n        assert_ne!(first.digest, second.digest);\n        assert!(second.text.contains(\"second\"));\n\n        fs::remove_dir_all(directory).expect(\"cleanup\");\n    }\n\n    #[test]\n    fn empty_files_are_not_sources() {\n        let directory = temp_dir(\"empty\");\n        let path = directory.join(\"AGENTS.md\");\n        assert!(!load(\u0026directory)\n            .sources\n            .contains(\u0026path.display().to_string()));\n        fs::write(\u0026path, \"  \\n\").expect(\"write\");\n        let loaded = load(\u0026directory);\n        assert!(!loaded.sources.contains(\u0026path.display().to_string()));\n\n        fs::remove_dir_all(directory).expect(\"cleanup\");\n    }\n}\n","truncated":false}]},{"id":"providers","title":"Providers","layer":"adapters","status":"active","summary":"OpenAI-compatible SSE 适配；DeepSeek preset 支持 thinking、reasoning_content 与 usage。","contract":"Provider::stream(request) -\u003e StreamEvent；错误分 Auth / ContextOverflow / Http / Network / Decode；不依赖 tools 或 UI。","paths":["crates/niucode-provider/src/lib.rs","crates/niucode-provider/src/openai.rs","crates/niucode-provider/src/sse.rs","crates/niucode-provider/src/scripted.rs","crates/niucode-provider/src/message.rs","crates/niucode-provider/src/error.rs"],"notes":["SSE 解析器按行缓冲，支持跨 chunk、多行 data 和缺失 [DONE]。","DeepSeek 带 tools 时，历史 reasoning_content 必须回传。","重试只在 turn 边界；流中断后不原地重放。"],"sources":[{"path":"crates/niucode-provider/src/lib.rs","language":"rust","text":"//! Provider boundary for niucode.\n//!\n//! The loop talks to a provider through [`Provider`] and consumes a stream of\n//! normalized [`StreamEvent`]s. Wire formats stay in this crate; `niucode-core`\n//! never sees SSE, HTTP, or provider-specific JSON.\n\nmod catalog;\nmod error;\nmod fixture;\nmod message;\nmod openai;\nmod scripted;\nmod sse;\n\npub use catalog::{\n    context_window, derived_context_budget, find_model, find_provider, providers, ModelDescriptor,\n    ModelSelection, ProviderDescriptor, DEFAULT_CONTEXT_WINDOW,\n};\npub use error::ProviderError;\npub use fixture::{RecordedEvent, RecordedFixture, RecordingProvider, ReplayProvider};\npub use message::{\n    ChatMessage, CompletionRequest, FunctionSpec, Role, ToolSpec, WireFunction, WireToolCall,\n};\npub use openai::{OpenAiConfig, OpenAiProvider, Preset, ReasoningEffort, ThinkingMode};\npub use scripted::ScriptedProvider;\npub use sse::SseParser;\n\nuse std::pin::Pin;\n\nuse futures_util::Stream;\nuse niucode_core::Usage;\n\n#[derive(Debug, Clone, PartialEq, Eq)]\npub struct ToolCallDelta {\n    pub index: u32,\n    pub id: Option\u003cString\u003e,\n    pub name: Option\u003cString\u003e,\n    pub arguments: String,\n}\n\n#[derive(Debug, Clone, PartialEq)]\npub enum StreamEvent {\n    TextDelta(String),\n    ReasoningDelta(String),\n    ToolCallDelta(ToolCallDelta),\n    Usage(Usage),\n    Done { finish_reason: Option\u003cString\u003e },\n}\n\npub type EventStream = Pin\u003cBox\u003cdyn Stream\u003cItem = Result\u003cStreamEvent, ProviderError\u003e\u003e + Send\u003e\u003e;\n\n#[async_trait::async_trait]\npub trait Provider: Send + Sync {\n    fn name(\u0026self) -\u003e \u0026str;\n    async fn stream(\u0026self, request: CompletionRequest) -\u003e Result\u003cEventStream, ProviderError\u003e;\n}\n","truncated":false},{"path":"crates/niucode-provider/src/openai.rs","language":"rust","text":"use std::time::Duration;\n\nuse futures_util::{StreamExt, TryStreamExt};\nuse reqwest::header::{ACCEPT, RETRY_AFTER};\nuse serde::Serialize;\nuse serde_json::{json, Map, Value};\nuse tokio_util::codec::{FramedRead, LinesCodec};\nuse tokio_util::io::StreamReader;\n\nuse crate::message::{ChatMessage, CompletionRequest, ToolSpec};\nuse crate::sse::SseParser;\nuse crate::{EventStream, Provider, ProviderError};\n\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum ThinkingMode {\n    Enabled,\n    Disabled,\n}\n\nimpl ThinkingMode {\n    pub fn as_str(self) -\u003e \u0026'static str {\n        match self {\n            Self::Enabled =\u003e \"enabled\",\n            Self::Disabled =\u003e \"disabled\",\n        }\n    }\n\n    pub fn parse(value: \u0026str) -\u003e Option\u003cSelf\u003e {\n        match value.trim().to_ascii_lowercase().as_str() {\n            \"enabled\" | \"on\" | \"true\" =\u003e Some(Self::Enabled),\n            \"disabled\" | \"off\" | \"false\" =\u003e Some(Self::Disabled),\n            _ =\u003e None,\n        }\n    }\n}\n\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum ReasoningEffort {\n    None,\n    Low,\n    High,\n    Max,\n}\n\nimpl ReasoningEffort {\n    pub fn as_str(self) -\u003e \u0026'static str {\n        match self {\n            Self::None =\u003e \"none\",\n            Self::Low =\u003e \"low\",\n            Self::High =\u003e \"high\",\n            Self::Max =\u003e \"max\",\n        }\n    }\n\n    pub fn parse(value: \u0026str) -\u003e Option\u003cSelf\u003e {\n        match value.trim().to_ascii_lowercase().as_str() {\n            \"none\" =\u003e Some(Self::None),\n            \"minimal\" | \"low\" =\u003e Some(Self::Low),\n            \"medium\" | \"high\" | \"xhigh\" =\u003e Some(Self::High),\n            \"max\" | \"ultra\" =\u003e Some(Self::Max),\n            _ =\u003e None,\n        }\n    }\n}\n\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum Preset {\n    DeepSeek,\n    OpenAi,\n}\n\nimpl Preset {\n    pub const ALL: [Self; 2] = [Self::DeepSeek, Self::OpenAi];\n\n    pub fn as_str(self) -\u003e \u0026'static str {\n        match self {\n            Self::DeepSeek =\u003e \"deepseek\",\n            Self::OpenAi =\u003e \"openai\",\n        }\n    }\n\n    pub fn parse(value: \u0026str) -\u003e Option\u003cSelf\u003e {\n        match value.trim().to_ascii_lowercase().as_str() {\n            \"deepseek\" =\u003e Some(Self::DeepSeek),\n            \"openai\" =\u003e Some(Self::OpenAi),\n            _ =\u003e None,\n        }\n    }\n\n    pub fn api_key_env(self) -\u003e \u0026'static str {\n        match self {\n            Self::DeepSeek =\u003e \"DEEPSEEK_API_KEY\",\n            Self::OpenAi =\u003e \"OPENAI_API_KEY\",\n        }\n    }\n\n    pub fn default_base_url(self) -\u003e \u0026'static str {\n        match self {\n            Self::DeepSeek =\u003e \"https://api.deepseek.com\",\n            Self::OpenAi =\u003e \"https://api.openai.com/v1\",\n        }\n    }\n\n    pub fn default_model(self) -\u003e \u0026'static str {\n        match self {\n            Self::DeepSeek =\u003e \"deepseek-flash\",\n            Self::OpenAi =\u003e \"gpt-4o-mini\",\n        }\n    }\n}\n\n#[derive(Debug, Clone)]\npub struct OpenAiConfig {\n    pub base_url: String,\n    pub api_key: String,\n    pub model: String,\n    /// DeepSeek-specific `thinking` control; `None` for plain OpenAI-compatible\n    /// providers.\n    pub thinking: Option\u003cThinkingMode\u003e,\n    pub reasoning_effort: Option\u003cReasoningEffort\u003e,\n    pub connect_timeout: Duration,\n}\n\nimpl OpenAiConfig {\n    pub fn new(\n        base_url: impl Into\u003cString\u003e,\n        api_key: impl Into\u003cString\u003e,\n        model: impl Into\u003cString\u003e,\n    ) -\u003e Self {\n        Self {\n            base_url: base_url.into(),\n            api_key: api_key.into(),\n            model: model.into(),\n            thinking: None,\n            reasoning_effort: None,\n            connect_timeout: Duration::from_secs(10),\n        }\n    }\n\n    pub fn with_thinking(mut self, mode: ThinkingMode) -\u003e Self {\n        self.thinking = Some(mode);\n        self\n    }\n\n    pub fn with_reasoning_effort(mut self, effort: ReasoningEffort) -\u003e Self {\n        self.reasoning_effort = Some(effort);\n        self\n    }\n\n    pub fn with_connect_timeout(mut self, timeout: Duration) -\u003e Self {\n        self.connect_timeout = timeout;\n        self\n    }\n\n    pub fn from_preset(preset: Preset) -\u003e Result\u003cSelf, ProviderError\u003e {\n        let mut config = Self::preset_config(preset)?;\n        config.api_key = required_env(preset.api_key_env())?;\n        Ok(config)\n    }\n\n    /// Preset settings without a credential. Callers using `niucode-auth` set\n    /// `api_key` after resolving env → keyring → file.\n    pub fn preset_config(preset: Preset) -\u003e Result\u003cSelf, ProviderError\u003e {\n        match preset {\n            Preset::DeepSeek =\u003e {\n                let base_url = std::env::var(\"DEEPSEEK_BASE_URL\")\n                    .ok()\n                    .filter(|value| !value.trim().is_empty())\n                    .unwrap_or_else(|| preset.default_base_url().into());\n                let model = std::env::var(\"DEEPSEEK_MODEL\")\n                    .ok()\n                    .filter(|value| !value.trim().is_empty())\n                    .unwrap_or_else(|| preset.default_model().into());\n                let thinking = match std::env::var(\"DEEPSEEK_THINKING\") {\n                    Ok(value) =\u003e Some(ThinkingMode::parse(\u0026value).ok_or_else(|| {\n                        ProviderError::Config(format!(\n                            \"DEEPSEEK_THINKING must be enabled or disabled, got {value:?}\"\n                        ))\n                    })?),\n                    Err(_) =\u003e Some(ThinkingMode::Enabled),\n                };\n                let reasoning_effort = match std::env::var(\"DEEPSEEK_REASONING_EFFORT\") {\n                    Ok(value) =\u003e Some(ReasoningEffort::parse(\u0026value).ok_or_else(|| {\n                        ProviderError::Config(format!(\n                            \"DEEPSEEK_REASONING_EFFORT must be none/low/high/max, got {value:?}\"\n                        ))\n                    })?),\n                    Err(_) =\u003e None,\n                };\n\n                Ok(Self {\n                    base_url,\n                    api_key: String::new(),\n                    model,\n                    thinking,\n                    reasoning_effort,\n                    connect_timeout: Duration::from_secs(10),\n                })\n            }\n            Preset::OpenAi =\u003e {\n","truncated":true},{"path":"crates/niucode-provider/src/sse.rs","language":"rust","text":"use niucode_core::Usage;\nuse serde::Deserialize;\n\nuse crate::{ProviderError, StreamEvent, ToolCallDelta};\n\n/// Incremental SSE decoder for OpenAI-compatible chat completion streams.\n///\n/// It accepts text chunks of arbitrary size, buffers partial lines, joins\n/// multi-line `data:` fields, ignores comments/keepalives, and turns each JSON\n/// payload into normalized [`StreamEvent`]s. `[DONE]` emits the final event.\n#[derive(Debug, Default)]\npub struct SseParser {\n    buffer: String,\n    data: Vec\u003cString\u003e,\n    finish_reason: Option\u003cString\u003e,\n    done: bool,\n}\n\nimpl SseParser {\n    pub fn push_str(\u0026mut self, chunk: \u0026str) -\u003e Result\u003cVec\u003cStreamEvent\u003e, ProviderError\u003e {\n        let mut events = Vec::new();\n        self.buffer.push_str(chunk);\n\n        while let Some(position) = self.buffer.find('\\n') {\n            let line = self.buffer[..position].trim_end_matches('\\r').to_string();\n            self.buffer.drain(..=position);\n            self.handle_line(\u0026line, \u0026mut events)?;\n        }\n\n        Ok(events)\n    }\n\n    /// Feed one complete line (without its trailing newline). Used by the\n    /// streaming HTTP path, which decodes lines before handing them over.\n    pub fn push_line(\u0026mut self, line: \u0026str) -\u003e Result\u003cVec\u003cStreamEvent\u003e, ProviderError\u003e {\n        let mut events = Vec::new();\n        self.handle_line(line.trim_end_matches('\\r'), \u0026mut events)?;\n        Ok(events)\n    }\n\n    /// Flush a trailing line and ensure a `Done` event is emitted exactly once.\n    pub fn finish(\u0026mut self) -\u003e Result\u003cVec\u003cStreamEvent\u003e, ProviderError\u003e {\n        let mut events = Vec::new();\n\n        if !self.buffer.is_empty() {\n            let line = std::mem::take(\u0026mut self.buffer);\n            self.handle_line(\u0026line, \u0026mut events)?;\n        }\n\n        self.dispatch(\u0026mut events)?;\n\n        if !self.done {\n            self.done = true;\n            events.push(StreamEvent::Done {\n                finish_reason: self.finish_reason.clone(),\n            });\n        }\n\n        Ok(events)\n    }\n\n    fn handle_line(\n        \u0026mut self,\n        line: \u0026str,\n        events: \u0026mut Vec\u003cStreamEvent\u003e,\n    ) -\u003e Result\u003c(), ProviderError\u003e {\n        if line.is_empty() {\n            self.dispatch(events)?;\n            return Ok(());\n        }\n\n        if line.starts_with(':') {\n            return Ok(());\n        }\n\n        if let Some(rest) = line.strip_prefix(\"data:\") {\n            let payload = rest.strip_prefix(' ').unwrap_or(rest);\n            if !payload.is_empty() {\n                self.data.push(payload.to_string());\n            }\n        }\n\n        // `event:`, `id:`, and `retry:` do not change the normalized payload.\n        Ok(())\n    }\n\n    fn dispatch(\u0026mut self, events: \u0026mut Vec\u003cStreamEvent\u003e) -\u003e Result\u003c(), ProviderError\u003e {\n        if self.data.is_empty() {\n            return Ok(());\n        }\n\n        let payload = self.data.join(\"\\n\");\n        self.data.clear();\n\n        if payload.trim() == \"[DONE]\" {\n            if !self.done {\n                self.done = true;\n                events.push(StreamEvent::Done {\n                    finish_reason: self.finish_reason.clone(),\n                });\n            }\n            return Ok(());\n        }\n\n        let chunk: WireChunk = serde_json::from_str(\u0026payload).map_err(|error| {\n            ProviderError::Decode(format!(\"{error}: {}\", truncate(\u0026payload, 240)))\n        })?;\n\n        if let Some(error) = chunk.error {\n            return Err(ProviderError::Decode(format!(\n                \"provider error: {}\",\n                truncate(\u0026error.message, 240)\n            )));\n        }\n\n        if let Some(usage) = chunk.usage {\n            events.push(StreamEvent::Usage(usage.into_usage()));\n        }\n\n        for choice in chunk.choices {\n            if let Some(reasoning) = choice.delta.reasoning_content {\n                if !reasoning.is_empty() {\n                    events.push(StreamEvent::ReasoningDelta(reasoning));\n                }\n            }\n\n            if let Some(content) = choice.delta.content {\n                if !content.is_empty() {\n                    events.push(StreamEvent::TextDelta(content));\n                }\n            }\n\n            if let Some(tool_calls) = choice.delta.tool_calls {\n                for (fallback, tool_call) in tool_calls.into_iter().enumerate() {\n                    let function = tool_call.function.unwrap_or_default();\n                    events.push(StreamEvent::ToolCallDelta(ToolCallDelta {\n                        index: tool_call.index.unwrap_or(fallback as u32),\n                        id: tool_call.id,\n                        name: function.name,\n                        arguments: function.arguments.unwrap_or_default(),\n                    }));\n                }\n            }\n\n            if let Some(reason) = choice.finish_reason {\n                self.finish_reason = Some(reason);\n            }\n        }\n\n        Ok(())\n    }\n}\n\n#[derive(Debug, Deserialize)]\nstruct WireChunk {\n    #[serde(default)]\n    choices: Vec\u003cWireChoice\u003e,\n    #[serde(default)]\n    usage: Option\u003cWireUsage\u003e,\n    #[serde(default)]\n    error: Option\u003cWireError\u003e,\n}\n\n#[derive(Debug, Deserialize)]\nstruct WireChoice {\n    #[serde(default)]\n    delta: WireDelta,\n    #[serde(default)]\n    finish_reason: Option\u003cString\u003e,\n}\n\n#[derive(Debug, Default, Deserialize)]\nstruct WireDelta {\n    #[serde(default)]\n    content: Option\u003cString\u003e,\n    #[serde(default)]\n    reasoning_content: Option\u003cString\u003e,\n    #[serde(default)]\n    tool_calls: Option\u003cVec\u003cWireToolCallDelta\u003e\u003e,\n}\n\n#[derive(Debug, Deserialize)]\nstruct WireToolCallDelta {\n    #[serde(default)]\n    index: Option\u003cu32\u003e,\n    #[serde(default)]\n    id: Option\u003cString\u003e,\n    #[serde(default)]\n    function: Option\u003cWireFunctionDelta\u003e,\n}\n\n#[derive(Debug, Default, Deserialize)]\nstruct WireFunctionDelta {\n    #[serde(default)]\n    name: Option\u003cString\u003e,\n    #[serde(default)]\n    arguments: Option\u003cString\u003e,\n}\n\n#[derive(Debug, Default, Deserialize)]\n","truncated":true},{"path":"crates/niucode-provider/src/scripted.rs","language":"rust","text":"use std::collections::VecDeque;\nuse std::sync::Mutex;\n\nuse futures_util::stream;\n\nuse crate::{CompletionRequest, EventStream, Provider, ProviderError, StreamEvent};\n\n/// Deterministic provider for tests and offline loop development.\n///\n/// Each `stream` call consumes one scripted turn. A turn is a sequence of\n/// normalized events, typically ending with `Done`.\npub struct ScriptedProvider {\n    name: String,\n    turns: Mutex\u003cVecDeque\u003cVec\u003cResult\u003cStreamEvent, ProviderError\u003e\u003e\u003e\u003e,\n    requests: Mutex\u003cVec\u003cCompletionRequest\u003e\u003e,\n}\n\nimpl ScriptedProvider {\n    pub fn new(events: Vec\u003cStreamEvent\u003e) -\u003e Self {\n        Self::from_turns(vec![events])\n    }\n\n    pub fn from_turns(turns: Vec\u003cVec\u003cStreamEvent\u003e\u003e) -\u003e Self {\n        let turns = turns\n            .into_iter()\n            .map(|turn| turn.into_iter().map(Ok).collect())\n            .collect();\n        Self::from_results(turns)\n    }\n\n    pub fn with_results(events: Vec\u003cResult\u003cStreamEvent, ProviderError\u003e\u003e) -\u003e Self {\n        Self::from_results(vec![events])\n    }\n\n    pub fn from_results(turns: Vec\u003cVec\u003cResult\u003cStreamEvent, ProviderError\u003e\u003e\u003e) -\u003e Self {\n        Self {\n            name: \"scripted\".into(),\n            turns: Mutex::new(turns.into()),\n            requests: Mutex::new(Vec::new()),\n        }\n    }\n\n    pub fn requests(\u0026self) -\u003e Vec\u003cCompletionRequest\u003e {\n        self.requests.lock().expect(\"scripted request lock\").clone()\n    }\n}\n\n#[async_trait::async_trait]\nimpl Provider for ScriptedProvider {\n    fn name(\u0026self) -\u003e \u0026str {\n        \u0026self.name\n    }\n\n    async fn stream(\u0026self, request: CompletionRequest) -\u003e Result\u003cEventStream, ProviderError\u003e {\n        self.requests\n            .lock()\n            .expect(\"scripted request lock\")\n            .push(request);\n\n        let events = self\n            .turns\n            .lock()\n            .expect(\"scripted turn lock\")\n            .pop_front()\n            .unwrap_or_default();\n\n        Ok(Box::pin(stream::iter(events)))\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use futures_util::StreamExt;\n\n    use super::*;\n    use crate::ChatMessage;\n\n    #[tokio::test]\n    async fn replays_turns_and_records_requests() {\n        let provider = ScriptedProvider::from_turns(vec![\n            vec![\n                StreamEvent::TextDelta(\"first\".into()),\n                StreamEvent::Done {\n                    finish_reason: Some(\"stop\".into()),\n                },\n            ],\n            vec![\n                StreamEvent::TextDelta(\"second\".into()),\n                StreamEvent::Done {\n                    finish_reason: Some(\"stop\".into()),\n                },\n            ],\n        ]);\n\n        for expected in [\"first\", \"second\"] {\n            let request = CompletionRequest::new(\"test\").with_message(ChatMessage::user(\"hi\"));\n            let mut events = provider.stream(request).await.expect(\"stream\");\n            let mut seen = Vec::new();\n            while let Some(event) = events.next().await {\n                seen.push(event.expect(\"event\"));\n            }\n            assert_eq!(seen[0], StreamEvent::TextDelta(expected.into()));\n        }\n\n        assert_eq!(provider.requests().len(), 2);\n        assert_eq!(provider.requests()[0].model, \"test\");\n    }\n}\n","truncated":false},{"path":"crates/niucode-provider/src/message.rs","language":"rust","text":"use niucode_core::ToolCall;\nuse serde::{Deserialize, Serialize};\nuse serde_json::Value;\n\n#[derive(Debug, Clone, Copy, PartialEq, Eq, Serialize, Deserialize)]\n#[serde(rename_all = \"lowercase\")]\npub enum Role {\n    System,\n    User,\n    Assistant,\n    Tool,\n}\n\n#[derive(Debug, Clone, PartialEq, Serialize, Deserialize)]\npub struct ChatMessage {\n    pub role: Role,\n    #[serde(skip_serializing_if = \"Option::is_none\")]\n    pub content: Option\u003cString\u003e,\n    /// DeepSeek extension. Must be echoed back when the request carries tools.\n    #[serde(skip_serializing_if = \"Option::is_none\")]\n    pub reasoning_content: Option\u003cString\u003e,\n    #[serde(skip_serializing_if = \"Option::is_none\")]\n    pub tool_calls: Option\u003cVec\u003cWireToolCall\u003e\u003e,\n    #[serde(skip_serializing_if = \"Option::is_none\")]\n    pub tool_call_id: Option\u003cString\u003e,\n}\n\nimpl ChatMessage {\n    pub fn system(text: impl Into\u003cString\u003e) -\u003e Self {\n        Self {\n            role: Role::System,\n            content: Some(text.into()),\n            reasoning_content: None,\n            tool_calls: None,\n            tool_call_id: None,\n        }\n    }\n\n    pub fn user(text: impl Into\u003cString\u003e) -\u003e Self {\n        Self {\n            role: Role::User,\n            content: Some(text.into()),\n            reasoning_content: None,\n            tool_calls: None,\n            tool_call_id: None,\n        }\n    }\n\n    pub fn assistant(\n        text: Option\u003cString\u003e,\n        reasoning: Option\u003cString\u003e,\n        tool_calls: Vec\u003cToolCall\u003e,\n    ) -\u003e Self {\n        let tool_calls = if tool_calls.is_empty() {\n            None\n        } else {\n            Some(\n                tool_calls\n                    .iter()\n                    .map(WireToolCall::from_tool_call)\n                    .collect(),\n            )\n        };\n\n        Self {\n            role: Role::Assistant,\n            content: text.filter(|value| !value.is_empty()),\n            reasoning_content: reasoning.filter(|value| !value.is_empty()),\n            tool_calls,\n            tool_call_id: None,\n        }\n    }\n\n    pub fn tool(call_id: impl Into\u003cString\u003e, output: impl Into\u003cString\u003e) -\u003e Self {\n        Self {\n            role: Role::Tool,\n            content: Some(output.into()),\n            reasoning_content: None,\n            tool_calls: None,\n            tool_call_id: Some(call_id.into()),\n        }\n    }\n}\n\n#[derive(Debug, Clone, PartialEq, Serialize, Deserialize)]\npub struct WireToolCall {\n    pub id: String,\n    #[serde(rename = \"type\")]\n    pub kind: String,\n    pub function: WireFunction,\n}\n\n#[derive(Debug, Clone, PartialEq, Serialize, Deserialize)]\npub struct WireFunction {\n    pub name: String,\n    pub arguments: String,\n}\n\nimpl WireToolCall {\n    pub fn from_tool_call(call: \u0026ToolCall) -\u003e Self {\n        let arguments = if call.input.is_null() {\n            \"{}\".to_string()\n        } else {\n            serde_json::to_string(\u0026call.input).unwrap_or_else(|_| \"{}\".to_string())\n        };\n\n        Self {\n            id: call.id.clone(),\n            kind: \"function\".into(),\n            function: WireFunction {\n                name: call.name.clone(),\n                arguments,\n            },\n        }\n    }\n}\n\n#[derive(Debug, Clone, PartialEq, Serialize)]\npub struct ToolSpec {\n    #[serde(rename = \"type\")]\n    pub kind: String,\n    pub function: FunctionSpec,\n}\n\n#[derive(Debug, Clone, PartialEq, Serialize)]\npub struct FunctionSpec {\n    pub name: String,\n    pub description: String,\n    pub parameters: Value,\n}\n\nimpl ToolSpec {\n    pub fn function(\n        name: impl Into\u003cString\u003e,\n        description: impl Into\u003cString\u003e,\n        parameters: Value,\n    ) -\u003e Self {\n        Self {\n            kind: \"function\".into(),\n            function: FunctionSpec {\n                name: name.into(),\n                description: description.into(),\n                parameters,\n            },\n        }\n    }\n}\n\n#[derive(Debug, Clone)]\npub struct CompletionRequest {\n    pub model: String,\n    pub messages: Vec\u003cChatMessage\u003e,\n    pub tools: Vec\u003cToolSpec\u003e,\n    pub temperature: Option\u003cf32\u003e,\n    pub max_tokens: Option\u003cu32\u003e,\n}\n\nimpl CompletionRequest {\n    pub fn new(model: impl Into\u003cString\u003e) -\u003e Self {\n        Self {\n            model: model.into(),\n            messages: Vec::new(),\n            tools: Vec::new(),\n            temperature: None,\n            max_tokens: None,\n        }\n    }\n\n    pub fn with_message(mut self, message: ChatMessage) -\u003e Self {\n        self.messages.push(message);\n        self\n    }\n\n    pub fn with_tool(mut self, tool: ToolSpec) -\u003e Self {\n        self.tools.push(tool);\n        self\n    }\n}\n","truncated":false},{"path":"crates/niucode-provider/src/error.rs","language":"rust","text":"use std::time::Duration;\n\nuse thiserror::Error;\n\n#[derive(Debug, Error)]\npub enum ProviderError {\n    #[error(\"missing API key for {provider}: set {env}\")]\n    MissingApiKey {\n        provider: \u0026'static str,\n        env: \u0026'static str,\n    },\n    #[error(\"provider config error: {0}\")]\n    Config(String),\n    #[error(\"authentication failed: {0}\")]\n    Auth(String),\n    #[error(\"context overflow: {0}\")]\n    ContextOverflow(String),\n    #[error(\"http {status}: {message}\")]\n    Http {\n        status: u16,\n        message: String,\n        retryable: bool,\n        retry_after: Option\u003cDuration\u003e,\n    },\n    #[error(\"network error: {0}\")]\n    Network(String),\n    #[error(\"stream decode error: {0}\")]\n    Decode(String),\n    #[error(\"provider cancelled\")]\n    Cancelled,\n}\n\nimpl ProviderError {\n    /// Whether the whole turn can be retried safely. Once a stream has started\n    /// producing output, retrying in place is not safe; the loop should start a\n    /// new turn instead.\n    pub fn is_retryable(\u0026self) -\u003e bool {\n        match self {\n            Self::Http { retryable, .. } =\u003e *retryable,\n            Self::Network(_) =\u003e true,\n            // A provider can return an error payload or a truncated SSE frame;\n            // this is often a transient upstream/proxy failure. The agent only\n            // retries when the stream has not emitted any event yet.\n            Self::Decode(_) =\u003e true,\n            _ =\u003e false,\n        }\n    }\n\n    pub fn retry_after(\u0026self) -\u003e Option\u003cDuration\u003e {\n        match self {\n            Self::Http { retry_after, .. } =\u003e *retry_after,\n            _ =\u003e None,\n        }\n    }\n\n    pub fn is_context_overflow(\u0026self) -\u003e bool {\n        matches!(self, Self::ContextOverflow(_))\n    }\n}\n","truncated":false}]},{"id":"tools","title":"Tools","layer":"adapters","status":"active","summary":"六个基础工具 + 只读 subagent 编排：read / write / edit / grep / glob / bash；路径限制、read-before-write、搜索预算、进程组超时与审批 diff。","contract":"Toolbox::execute(name, input) -\u003e ToolResult；preview -\u003e ChangePreview；subagent 由 agent loop 拦截；已有文件必须先 read。","paths":["crates/niucode-tools/src/lib.rs","crates/niucode-tools/src/preview.rs"],"notes":["grep / glob 使用 ignore + regex/globset，不依赖外部 rg。","bash 超时会杀进程组，尾部 20KB + 临时输出路径。","写操作串行；当前工具调用顺序执行。","preview 只读真实文件，不修改 observed/磁盘；执行时重新校验（TOCTOU）。","subagent 的 schema 在 tools，执行在 agent loop。"],"sources":[{"path":"crates/niucode-tools/src/lib.rs","language":"rust","text":"//! Workspace tools exposed to the model.\n//!\n//! The tool surface is deliberately small: `read`, `write`, `edit`, `grep`,\n//! `glob`, and `bash`. All file paths are resolved inside the working\n//! directory; `write`/`edit` require the file to have been observed by `read`\n//! first.\n\nuse std::collections::HashSet;\nuse std::fs;\nuse std::path::{Path, PathBuf};\nuse std::process::{Command as StdCommand, Stdio};\nuse std::sync::Mutex;\nuse std::time::{Duration, SystemTime, UNIX_EPOCH};\n\nuse anyhow::{bail, Context, Result};\nuse globset::GlobBuilder;\nuse ignore::WalkBuilder;\nuse niucode_provider::ToolSpec;\nuse regex::Regex;\nuse serde_json::{json, Value};\nuse similar::TextDiff;\nuse tokio::io::{AsyncRead, AsyncReadExt};\nuse tokio::process::Command;\nuse tokio::time::timeout;\n\nmod preview;\n\npub use preview::{\n    ChangePreview, FilePreview, LineKind, PreviewBody, PreviewHunk, PreviewLine,\n    PREVIEW_CONTEXT_LINES,\n};\n\nconst READ_MAX_LINES: usize = 2_000;\nconst READ_MAX_BYTES: usize = 50_000;\nconst BASH_MAX_BYTES: usize = 20_000;\nconst BASH_DEFAULT_TIMEOUT: u64 = 120;\nconst BASH_MAX_TIMEOUT: u64 = 600;\nconst BASH_CAPTURE_BYTES: usize = 8 * 1024 * 1024;\nconst SEARCH_MAX_RESULTS: usize = 200;\n\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum SandboxMode {\n    ReadOnly,\n    WorkspaceWrite,\n    FullAccess,\n}\n\nimpl SandboxMode {\n    pub fn as_str(self) -\u003e \u0026'static str {\n        match self {\n            Self::ReadOnly =\u003e \"read-only\",\n            Self::WorkspaceWrite =\u003e \"workspace-write\",\n            Self::FullAccess =\u003e \"full-access\",\n        }\n    }\n}\n\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum NetworkMode {\n    On,\n    Off,\n}\n\nimpl NetworkMode {\n    pub fn as_str(self) -\u003e \u0026'static str {\n        match self {\n            Self::On =\u003e \"on\",\n            Self::Off =\u003e \"off\",\n        }\n    }\n}\n\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub struct SandboxPolicy {\n    pub mode: SandboxMode,\n    pub network: NetworkMode,\n}\n\nimpl Default for SandboxPolicy {\n    fn default() -\u003e Self {\n        Self {\n            mode: SandboxMode::WorkspaceWrite,\n            network: NetworkMode::Off,\n        }\n    }\n}\n\nimpl SandboxPolicy {\n    pub fn new(mode: SandboxMode, network: NetworkMode) -\u003e Self {\n        Self { mode, network }\n    }\n\n    pub fn backend(self) -\u003e \u0026'static str {\n        if self.mode == SandboxMode::FullAccess \u0026\u0026 self.network == NetworkMode::On {\n            \"none\"\n        } else if sandbox_available() {\n            \"bwrap\"\n        } else {\n            \"unavailable\"\n        }\n    }\n}\n\npub fn sandbox_available() -\u003e bool {\n    StdCommand::new(\"bwrap\")\n        .arg(\"--version\")\n        .output()\n        .map(|output| output.status.success())\n        .unwrap_or(false)\n}\n\npub struct Toolbox {\n    cwd: PathBuf,\n    observed: Mutex\u003cHashSet\u003cPathBuf\u003e\u003e,\n    policy: SandboxPolicy,\n    allow_unsandboxed: bool,\n    read_roots: Vec\u003cPathBuf\u003e,\n}\n\nimpl Toolbox {\n    pub fn new(cwd: impl AsRef\u003cPath\u003e) -\u003e Result\u003cSelf\u003e {\n        Self::with_policy(cwd, SandboxPolicy::default())\n    }\n\n    pub fn with_policy(cwd: impl AsRef\u003cPath\u003e, policy: SandboxPolicy) -\u003e Result\u003cSelf\u003e {\n        Self::with_policy_and_fallback(cwd, policy, false)\n    }\n\n    pub fn with_policy_and_fallback(\n        cwd: impl AsRef\u003cPath\u003e,\n        policy: SandboxPolicy,\n        allow_unsandboxed: bool,\n    ) -\u003e Result\u003cSelf\u003e {\n        Self::with_policy_and_roots(cwd, policy, allow_unsandboxed, Vec::new())\n    }\n\n    pub fn with_policy_and_roots(\n        cwd: impl AsRef\u003cPath\u003e,\n        policy: SandboxPolicy,\n        allow_unsandboxed: bool,\n        read_roots: Vec\u003cPathBuf\u003e,\n    ) -\u003e Result\u003cSelf\u003e {\n        let cwd = cwd.as_ref().canonicalize().with_context(|| {\n            format!(\"canonicalize working directory {}\", cwd.as_ref().display())\n        })?;\n        if !cwd.is_dir() {\n            bail!(\"working directory is not a directory: {}\", cwd.display());\n        }\n\n        Ok(Self {\n            cwd,\n            observed: Mutex::new(HashSet::new()),\n            policy,\n            allow_unsandboxed,\n            read_roots,\n        })\n    }\n\n    pub fn cwd(\u0026self) -\u003e \u0026Path {\n        \u0026self.cwd\n    }\n\n    pub fn policy(\u0026self) -\u003e SandboxPolicy {\n        self.policy\n    }\n\n    pub fn allows_unsandboxed(\u0026self) -\u003e bool {\n        self.allow_unsandboxed\n    }\n\n    pub fn specs() -\u003e Vec\u003cToolSpec\u003e {\n        vec![\n            ToolSpec::function(\n                \"read\",\n                \"Read a UTF-8 text file inside the workspace. Returns line numbers. Read a file before editing or overwriting it.\",\n                json!({\n                    \"type\": \"object\",\n                    \"properties\": {\n                        \"path\": {\"type\": \"string\", \"description\": \"Workspace-relative path\"},\n                        \"offset\": {\"type\": \"integer\", \"description\": \"1-based first line to return\", \"minimum\": 1},\n                        \"limit\": {\"type\": \"integer\", \"description\": \"Maximum lines to return\", \"minimum\": 1, \"maximum\": READ_MAX_LINES}\n                    },\n                    \"required\": [\"path\"]\n                }),\n            ),\n            ToolSpec::function(\n                \"write\",\n                \"Create or fully overwrite a text file inside the workspace. Reading an existing file first is required.\",\n                json!({\n                    \"type\": \"object\",\n                    \"properties\": {\n                        \"path\": {\"type\": \"string\"},\n                        \"content\": {\"type\": \"string\"}\n                    },\n                    \"required\": [\"path\", \"content\"]\n                }),\n            ),\n            ToolSpec::function(\n                \"edit\",\n                \"Replace one exact, unique string in a file after reading it. Fails if the old string is missing or appears more than once.\",\n","truncated":true},{"path":"crates/niucode-tools/src/preview.rs","language":"rust","text":"//! Side-effect-free change previews for approval prompts.\n//!\n//! The tool layer owns path resolution and knows what `write` / `edit` will\n//! change, so it builds the structured diff. Clients render it; the agent loop\n//! only forwards the value.\n\nuse similar::{DiffTag, TextDiff};\n\nuse crate::{input_string, Toolbox};\n\n/// Number of unchanged context lines kept around each diff change.\npub const PREVIEW_CONTEXT_LINES: usize = 3;\n\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum LineKind {\n    Context,\n    Add,\n    Remove,\n}\n\n#[derive(Debug, Clone, PartialEq, Eq)]\npub struct PreviewLine {\n    pub kind: LineKind,\n    pub old_line: Option\u003cusize\u003e,\n    pub new_line: Option\u003cusize\u003e,\n    pub text: String,\n}\n\n#[derive(Debug, Clone, PartialEq, Eq)]\npub struct PreviewHunk {\n    pub old_start: usize,\n    pub old_len: usize,\n    pub new_start: usize,\n    pub new_len: usize,\n    pub lines: Vec\u003cPreviewLine\u003e,\n}\n\n#[derive(Debug, Clone, PartialEq, Eq)]\npub struct FilePreview {\n    pub path: String,\n    pub is_new: bool,\n    pub added: usize,\n    pub removed: usize,\n    pub hunks: Vec\u003cPreviewHunk\u003e,\n}\n\nimpl FilePreview {\n    /// Diff two in-memory texts. This does not touch the filesystem.\n    pub fn from_text(path: impl Into\u003cString\u003e, old: \u0026str, new: \u0026str, is_new: bool) -\u003e Self {\n        let diff = TextDiff::from_lines(old, new);\n        let mut hunks = Vec::new();\n        let mut added = 0;\n        let mut removed = 0;\n\n        for group in diff.grouped_ops(PREVIEW_CONTEXT_LINES) {\n            let Some(first) = group.first() else {\n                continue;\n            };\n            let Some(last) = group.last() else {\n                continue;\n            };\n\n            let (old_start, old_len) = header_range(first.old_range().start, last.old_range().end);\n            let (new_start, new_len) = header_range(first.new_range().start, last.new_range().end);\n            let mut lines = Vec::new();\n\n            for op in \u0026group {\n                match op.tag() {\n                    DiffTag::Equal =\u003e {\n                        let new_range = op.new_range();\n                        for (offset, old_index) in op.old_range().enumerate() {\n                            lines.push(PreviewLine {\n                                kind: LineKind::Context,\n                                old_line: Some(old_index + 1),\n                                new_line: Some(new_range.start + offset + 1),\n                                text: line_text(diff.old_slices()[old_index]),\n                            });\n                        }\n                    }\n                    DiffTag::Delete =\u003e {\n                        for old_index in op.old_range() {\n                            removed += 1;\n                            lines.push(PreviewLine {\n                                kind: LineKind::Remove,\n                                old_line: Some(old_index + 1),\n                                new_line: None,\n                                text: line_text(diff.old_slices()[old_index]),\n                            });\n                        }\n                    }\n                    DiffTag::Insert =\u003e {\n                        for new_index in op.new_range() {\n                            added += 1;\n                            lines.push(PreviewLine {\n                                kind: LineKind::Add,\n                                old_line: None,\n                                new_line: Some(new_index + 1),\n                                text: line_text(diff.new_slices()[new_index]),\n                            });\n                        }\n                    }\n                    DiffTag::Replace =\u003e {\n
