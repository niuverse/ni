(input),\n            \"bash\" =\u003e self.bash(input).await,\n            other =\u003e Err(anyhow::anyhow!(\"unknown tool {other:?}\")),\n        };\n\n        match result {\n            Ok(output) =\u003e ToolResult { ok: true, output },\n            Err(error) =\u003e ToolResult {\n                ok: false,\n                output: format!(\"error: {error:#}\"),\n            },\n        }\n    }\n\n    fn read(\u0026self, input: \u0026Value) -\u003e Result\u003cString\u003e {\n        let path = self.resolve_existing(input_string(input, \"path\")?)?;\n        let text = fs::read_to_string(\u0026path)\n            .with_context(|| format!(\"read {}\", self.display_path(\u0026path)))?;\n        self.mark_observed(\u0026path);\n\n        let offset = input\n            .get(\"offset\")\n            .and_then(Value::as_u64)\n            .unwrap_or(1)\n            .max(1) as usize;\n        let limit = input\n            .get(\"limit\")\n            .and_then(Value::as_u64)\n            .unwrap_or(READ_MAX_LINES as u64)\n            .clamp(1, READ_MAX_LINES as u64) as usize;\n\n        let lines = text.lines().collect::\u003cVec\u003c_\u003e\u003e();\n        let total = lines.len();\n        let start = offset.saturating_sub(1).min(total);\n        let mut output = String::new();\n        let mut shown = 0_usize;\n\n        for (index, line) in lines.iter().enumerate().skip(start).take(limit) {\n            let rendered = format!(\"{:\u003e5}  {line}\\n\", index + 1);\n            if output.len() + rendered.len() \u003e READ_MAX_BYTES {\n                break;\n            }\n            output.push_str(\u0026rendered);\n            shown += 1;\n        }\n\n        if shown == 0 {\n            output.push_str(\u0026format!(\"(no lines; file has {total} lines)\\n\"));\n        } else if start + shown \u003c total {\n            output.push_str(\u0026format!(\n                \"... ({} more lines; use offset to continue)\\n\",\n                total - (start + shown)\n            ));\n        }\n\n        Ok(output)\n    }\n\n    fn write(\u0026self, input: \u0026Value) -\u003e Result\u003cString\u003e {\n        let path = self.resolve_for_write(input_string(input, \"path\")?)?;\n        let content = input_string(input, \"content\")?;\n\n        if path.exists() {\n            if path.is_dir() {\n                bail!(\"{} is a directory\", self.display_path(\u0026path));\n            }\n            if !self.is_observed(\u0026path) {\n                bail!(\"read {} before writing it\", self.display_path(\u0026path));\n            }\n        }\n\n        let parent = path.parent().context(\"path has no parent\")?;\n        if !parent.exists() {\n            bail!(\n                \"parent directory does not exist: {}\",\n                self.display_path(parent)\n            );\n        }\n\n        fs::write(\u0026path, content).with_context(|| format!(\"write {}\", self.display_path(\u0026path)))?;\n        self.mark_observed(\u0026path);\n\n        Ok(format!(\n            \"wrote {} bytes to {}\",\n            content.len(),\n            self.display_path(\u0026path)\n        ))\n    }\n\n    fn edit(\u0026self, input: \u0026Value) -\u003e Result\u003cString\u003e {\n        let path = self.resolve_existing(input_string(input, \"path\")?)?;\n        if !self.is_observed(\u0026path) {\n            bail!(\"read {} before editing it\", self.display_path(\u0026path));\n","truncated":true}]},{"id":"sandbox","title":"Sandbox","layer":"adapters","status":"planned","summary":"sandbox / approval / network 三轴策略。","contract":"执行前返回 allow / ask / deny；bash 必须经过进程组与超时包装。","paths":["crates/ni-sandbox/src/lib.rs"],"notes":["进程内路径校验不是安全边界，bash 能绕过。","没有真沙箱时，变更型 bash 强制审批。"],"sources":[]},{"id":"session","title":"Session Log","layer":"state","status":"active","summary":"append-only JSONL 事件日志，resume 与 fork 的基础。","contract":"SessionLog::append 只追加；load 容忍坏尾行并报告 warning；日志是唯一真相。","paths":["crates/ni-core/src/session.rs","crates/ni-core/src/event.rs"],"notes":["每条事件立即 flush，进程崩溃最多丢最后一行。","内存状态是日志的 fold，不维护第二份真相。"],"sources":[{"path":"crates/ni-core/src/session.rs","language":"rust","text":"//! Append-only JSONL session storage.\n//!\n//! A session is a file of one JSON event per line. Appends are flushed\n//! immediately; loading tolerates a corrupt tail instead of discarding the\n//! whole session.\n\nuse std::fs::{self, File, OpenOptions};\nuse std::io::{BufRead, BufReader, BufWriter, Write};\nuse std::path::{Path, PathBuf};\nuse std::sync::atomic::{AtomicU64, Ordering};\n\nuse anyhow::{Context, Result};\n\nuse crate::event::{now_ms, Event};\n\nstatic SESSION_SEQ: AtomicU64 = AtomicU64::new(0);\n\n#[derive(Debug)]\npub struct LoadedSession {\n    pub events: Vec\u003cEvent\u003e,\n    /// Lines that could not be decoded. The rest of the session is still valid.\n    pub warnings: Vec\u003cString\u003e,\n}\n\n#[derive(Debug)]\npub struct SessionLog {\n    id: String,\n    path: PathBuf,\n    writer: BufWriter\u003cFile\u003e,\n}\n\nimpl SessionLog {\n    /// Create a new session file under `dir`.\n    pub fn create(dir: \u0026Path) -\u003e Result\u003cSelf\u003e {\n        fs::create_dir_all(dir)\n            .with_context(|| format!(\"create session directory {}\", dir.display()))?;\n\n        let seq = SESSION_SEQ.fetch_add(1, Ordering::Relaxed);\n        let id = format!(\"{}-{}-{}\", now_ms(), std::process::id(), seq);\n        let path = dir.join(format!(\"{id}.jsonl\"));\n        let file = OpenOptions::new()\n            .create_new(true)\n            .append(true)\n            .open(\u0026path)\n            .with_context(|| format!(\"create session file {}\", path.display()))?;\n\n        Ok(Self {\n            id,\n            path,\n            writer: BufWriter::new(file),\n        })\n    }\n\n    pub fn id(\u0026self) -\u003e \u0026str {\n        \u0026self.id\n    }\n\n    pub fn path(\u0026self) -\u003e \u0026Path {\n        \u0026self.path\n    }\n\n    /// Append one event and flush it to disk.\n    pub fn append(\u0026mut self, event: \u0026Event) -\u003e Result\u003c()\u003e {\n        serde_json::to_writer(\u0026mut self.writer, event).context(\"serialize session event\")?;\n        self.writer\n            .write_all(b\"\\n\")\n            .context(\"write session event\")?;\n        self.writer.flush().context(\"flush session event\")?;\n        Ok(())\n    }\n}\n\n/// Read a session, reporting undecodable lines as warnings.\npub fn load(path: \u0026Path) -\u003e Result\u003cLoadedSession\u003e {\n    let file = File::open(path).with_context(|| format!(\"open session file {}\", path.display()))?;\n    let reader = BufReader::new(file);\n\n    let mut events = Vec::new();\n    let mut warnings = Vec::new();\n\n    for (index, line) in reader.lines().enumerate() {\n        let line = line.with_context(|| format!(\"read line {}\", index + 1))?;\n        if line.trim().is_empty() {\n            continue;\n        }\n        match serde_json::from_str::\u003cEvent\u003e(\u0026line) {\n            Ok(event) =\u003e events.push(event),\n            Err(error) =\u003e warnings.push(format!(\"line {}: {error}\", index + 1)),\n        }\n    }\n\n    Ok(LoadedSession { events, warnings })\n}\n\n/// List session files in `dir`, sorted by name.\npub fn list(dir: \u0026Path) -\u003e Result\u003cVec\u003cPathBuf\u003e\u003e {\n    if !dir.is_dir() {\n        return Ok(Vec::new());\n    }\n\n    let mut paths = Vec::new();\n    for entry in\n        fs::read_dir(dir).with_context(|| format!(\"read session directory {}\", dir.display()))?\n    {\n        let entry = entry?;\n        let path = entry.path();\n        if path.extension().is_some_and(|ext| ext == \"jsonl\") {\n            paths.push(path);\n        }\n    }\n    paths.sort();\n    Ok(paths)\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use crate::event::{Event, ToolCall, Usage};\n\n    fn temp_dir(tag: \u0026str) -\u003e PathBuf {\n        static COUNTER: AtomicU64 = AtomicU64::new(0);\n        let n = COUNTER.fetch_add(1, Ordering::Relaxed);\n        let dir = std::env::temp_dir().join(format!(\"ni-core-{tag}-{}-{n}\", now_ms()));\n        let _ = fs::remove_dir_all(\u0026dir);\n        fs::create_dir_all(\u0026dir).expect(\"create temp dir\");\n        dir\n    }\n\n    #[test]\n    fn round_trip_preserves_events() {\n        let dir = temp_dir(\"roundtrip\");\n        let mut log = SessionLog::create(\u0026dir).expect(\"create log\");\n        let ts = now_ms();\n\n        let events = vec![\n            Event::SessionStart {\n                id: log.id().to_string(),\n                cwd: \"/tmp/project\".into(),\n                model: \"test-model\".into(),\n                ts,\n            },\n            Event::UserMessage {\n                text: \"fix the failing test\".into(),\n                ts,\n            },\n            Event::AssistantMessage {\n                text: \"reading the test\".into(),\n                reasoning: Some(\"need the failure output first\".into()),\n                tool_calls: vec![ToolCall {\n                    id: \"call-1\".into(),\n                    name: \"read\".into(),\n                    input: serde_json::json!({\"path\": \"src/lib.rs\"}),\n                }],\n                ts,\n            },\n            Event::ToolResult {\n                call_id: \"call-1\".into(),\n                ok: true,\n                output: \"fn main() {}\".into(),\n                ts,\n            },\n            Event::TurnEnd {\n                usage: Usage {\n                    input_tokens: 120,\n                    output_tokens: 30,\n                    cached_tokens: 80,\n                    reasoning_tokens: 10,\n                },\n                ts,\n            },\n        ];\n\n        for event in \u0026events {\n            log.append(event).expect(\"append\");\n        }\n\n        let loaded = load(log.path()).expect(\"load\");\n        assert_eq!(loaded.events, events);\n        assert!(loaded.warnings.is_empty());\n        assert_eq!(list(\u0026dir).expect(\"list\"), vec![log.path().to_path_buf()]);\n\n        fs::remove_dir_all(dir).expect(\"cleanup\");\n    }\n\n    #[test]\n    fn corrupt_tail_is_a_warning_not_a_failure() {\n        let dir = temp_dir(\"corrupt\");\n        let path = dir.join(\"session.jsonl\");\n        let good = serde_json::to_string(\u0026Event::UserMessage {\n            text: \"hello\".into(),\n            ts: 1,\n        })\n        .expect(\"serialize\");\n        fs::write(\u0026path, format!(\"{good}\\n{{ not json }}\\n\")).expect(\"write fixture\");\n\n        let loaded = load(\u0026path).expect(\"load\");\n        assert_eq!(loaded.events.len(), 1);\n        assert_eq!(loaded.warnings.len(), 1);\n        assert!(loaded.warnings[0].starts_with(\"line 2:\"));\n\n","truncated":true},{"path":"crates/ni-core/src/event.rs","language":"rust","text":"//! Durable session events.\n//!\n//! Events are the only representation of a session that survives the process.\n//! The in-memory conversation is a projection of these events; if something is\n//! not appended here, it does not exist after the process exits.\n\nuse std::time::{SystemTime, UNIX_EPOCH};\n\nuse serde::{Deserialize, Serialize};\n\n/// Milliseconds since the Unix epoch.\npub type Timestamp = u64;\n\n#[derive(Debug, Clone, PartialEq, Serialize, Deserialize)]\npub struct ToolCall {\n    pub id: String,\n    pub name: String,\n    #[serde(default)]\n    pub input: serde_json::Value,\n}\n\n#[derive(Debug, Clone, Default, PartialEq, Serialize, Deserialize)]\npub struct Usage {\n    #[serde(default)]\n    pub input_tokens: u64,\n    #[serde(default)]\n    pub output_tokens: u64,\n    #[serde(default)]\n    pub cached_tokens: u64,\n    #[serde(default)]\n    pub reasoning_tokens: u64,\n}\n\n#[derive(Debug, Clone, PartialEq, Serialize, Deserialize)]\n#[serde(tag = \"type\", rename_all = \"snake_case\")]\npub enum Event {\n    SessionStart {\n        id: String,\n        cwd: String,\n        model: String,\n        ts: Timestamp,\n    },\n    UserMessage {\n        text: String,\n        ts: Timestamp,\n    },\n    AssistantMessage {\n        #[serde(default)]\n        text: String,\n        #[serde(default, skip_serializing_if = \"Option::is_none\")]\n        reasoning: Option\u003cString\u003e,\n        #[serde(default)]\n        tool_calls: Vec\u003cToolCall\u003e,\n        ts: Timestamp,\n    },\n    ToolResult {\n        call_id: String,\n        ok: bool,\n        output: String,\n        ts: Timestamp,\n    },\n    TurnEnd {\n        #[serde(default)]\n        usage: Usage,\n        ts: Timestamp,\n    },\n    Compaction {\n        summary: String,\n        /// Number of events replaced by this compaction.\n        upto: u64,\n        ts: Timestamp,\n    },\n    SessionEnd {\n        ts: Timestamp,\n    },\n}\n\nimpl Event {\n    /// Stable name used in logs and tests.\n    pub fn kind(\u0026self) -\u003e \u0026'static str {\n        match self {\n            Self::SessionStart { .. } =\u003e \"session_start\",\n            Self::UserMessage { .. } =\u003e \"user_message\",\n            Self::AssistantMessage { .. } =\u003e \"assistant_message\",\n            Self::ToolResult { .. } =\u003e \"tool_result\",\n            Self::TurnEnd { .. } =\u003e \"turn_end\",\n            Self::Compaction { .. } =\u003e \"compaction\",\n            Self::SessionEnd { .. } =\u003e \"session_end\",\n        }\n    }\n\n    pub fn ts(\u0026self) -\u003e Timestamp {\n        match self {\n            Self::SessionStart { ts, .. }\n            | Self::UserMessage { ts, .. }\n            | Self::AssistantMessage { ts, .. }\n            | Self::ToolResult { ts, .. }\n            | Self::TurnEnd { ts, .. }\n            | Self::Compaction { ts, .. }\n            | Self::SessionEnd { ts } =\u003e *ts,\n        }\n    }\n}\n\npub fn now_ms() -\u003e Timestamp {\n    SystemTime::now()\n        .duration_since(UNIX_EPOCH)\n        .unwrap_or_default()\n        .as_millis() as Timestamp\n}\n","truncated":false}]},{"id":"dashboard","title":"Dashboard","layer":"engineering","status":"active","summary":"从 project.json、模块、卡片和 Markdown 生成 architecture-first 的离线单文件看板。","contract":"默认 Architecture；Work / Docs / Decisions 为二级视图；cargo xtask dashboard 可重复构建，--check 保证生成物不过期。","paths":["crates/xtask/src/main.rs","docs/dashboard/app.js","docs/dashboard/style.css","docs/dashboard/template.html"],"notes":["架构视图不显示进度装饰；模块状态只表示落地程度。","浏览器只读；改状态走仓库，避免第二个真相源。","不引入前端框架；单文件离线是硬约束。"],"sources":[{"path":"crates/xtask/src/main.rs","language":"rust","text":"mod load;\nmod model;\nmod render;\nmod validate;\n\nuse std::path::PathBuf;\n\nuse anyhow::{bail, Result};\n\nfn main() -\u003e Result\u003c()\u003e {\n    let mut args = std::env::args().skip(1);\n\n    match args.next().as_deref() {\n        Some(\"dashboard\") =\u003e {\n            let mut check = false;\n            for arg in args {\n                match arg.as_str() {\n                    \"--check\" =\u003e check = true,\n                    other =\u003e bail!(\"unknown argument `{other}`\\n\\n{}\", help_text()),\n                }\n            }\n            let root = find_root()?;\n            let dashboard = load::build(\u0026root)?;\n            render::write_dashboard(\u0026root, \u0026dashboard, check)\n        }\n        Some(\"-h\") | Some(\"--help\") | None =\u003e {\n            println!(\"{}\", help_text());\n            Ok(())\n        }\n        Some(other) =\u003e bail!(\"unknown xtask `{other}`\\n\\n{}\", help_text()),\n    }\n}\n\nfn find_root() -\u003e Result\u003cPathBuf\u003e {\n    let mut dir = std::env::current_dir()?;\n    loop {\n        if dir.join(\"docs/dashboard/project.json\").is_file() {\n            return Ok(dir);\n        }\n        if !dir.pop() {\n            bail!(\"could not find workspace root (docs/dashboard/project.json)\");\n        }\n    }\n}\n\nfn help_text() -\u003e String {\n    [\n        \"xtask\",\n        \"\",\n        \"  cargo xtask dashboard          build docs/index.html\",\n        \"  cargo xtask dashboard --check  fail if generated files are stale\",\n    ]\n    .join(\"\\n\")\n}\n","truncated":false},{"path":"docs/dashboard/app.js","language":"javascript","text":"(() =\u003e {\n  'use strict';\n\n  const DATA = JSON.parse(document.getElementById('ni-data').textContent);\n\n  const VIEWS = ['arch', 'work', 'docs', 'decisions'];\n  const VIEW_ALIASES = { board: 'work', timeline: 'decisions' };\n  const STATUS_COLUMNS = ['backlog', 'ready', 'doing', 'review', 'done'];\n  const STATUS_LABEL = {\n    backlog: 'Backlog',\n    ready: 'Ready',\n    doing: 'Doing',\n    review: 'Review',\n    done: 'Done',\n    blocked: 'Blocked',\n    planned: 'Planned',\n    active: 'Active',\n  };\n  const STATUS_COLORS = {\n    backlog: '#8c8478',\n    ready: '#3f6f9f',\n    doing: '#b7791f',\n    review: '#6f5aa8',\n    done: '#3f7d4f',\n    blocked: '#b42318',\n  };\n  const LAYER_COLORS = {\n    interface: '#4c7bd9',\n    engine: '#b57436',\n    adapters: '#8768bf',\n    state: '#5c8f4a',\n    engineering: '#8a8175',\n  };\n  const KIND_LABEL = { adr: 'ADR', doc: 'Doc', guide: 'Guide' };\n\n  const canvas = document.getElementById('canvas');\n  const details = document.getElementById('details');\n  const search = document.getElementById('search');\n  const themeButton = document.getElementById('theme-toggle');\n\n  const cardById = new Map(DATA.cards.map((card) =\u003e [card.id, card]));\n  const moduleById = new Map(DATA.modules.map((module) =\u003e [module.id, module]));\n  const docById = new Map(DATA.docs.map((doc) =\u003e [doc.id, doc]));\n  const milestoneById = new Map(DATA.milestones.map((milestone) =\u003e [milestone.id, milestone]));\n  const layerById = new Map(DATA.layers.map((layer) =\u003e [layer.id, layer]));\n\n  const state = {\n    view: 'arch',\n    milestone: currentMilestoneId(),\n    selection: null,\n    query: '',\n    sourceIndex: 0,\n  };\n\n  let edgeFrame = 0;\n\n  function currentMilestoneId() {\n    const active = DATA.milestones.find((milestone) =\u003e milestone.status === 'active');\n    return active ? active.id : 'all';\n  }\n\n  function normalizeView(view) {\n    return VIEW_ALIASES[view] || view;\n  }\n\n  function esc(value) {\n    return String(value ?? '').replace(/[\u0026\u003c\u003e\"']/g, (character) =\u003e ({\n      '\u0026': '\u0026amp;',\n      '\u003c': '\u0026lt;',\n      '\u003e': '\u0026gt;',\n      '\"': '\u0026quot;',\n      \"'\": '\u0026#39;',\n    }[character]));\n  }\n\n  function fmtDate(value) {\n    return value ? value.slice(5) : '—';\n  }\n\n  function docKind(kind) {\n    return KIND_LABEL[kind] || String(kind || 'doc').toUpperCase();\n  }\n\n  function layerColor(id) {\n    return LAYER_COLORS[id] || '#8a8175';\n  }\n\n  function layerName(id) {\n    const layer = layerById.get(id);\n    return layer ? layer.name : id;\n  }\n\n  function moduleTitle(id) {\n    const module = moduleById.get(id);\n    return module ? module.title : id;\n  }\n\n  function isCardSelected(id) {\n    return state.selection?.type === 'card' \u0026\u0026 state.selection.id === id;\n  }\n\n  function isModuleSelected(id) {\n    return state.selection?.type === 'module' \u0026\u0026 state.selection.id === id;\n  }\n\n  function isDocSelected(id) {\n    return state.selection?.type === 'doc' \u0026\u0026 state.selection.id === id;\n  }\n\n  function statusBadge(status) {\n    const label = STATUS_LABEL[status] || status;\n    return `\u003cspan class=\"badge badge-${esc(status)}\"\u003e\u003cspan class=\"dot\"\u003e\u003c/span\u003e${esc(label)}\u003c/span\u003e`;\n  }\n\n  function currentFocus() {\n    const milestone = DATA.milestones.find((item) =\u003e item.status === 'active');\n    if (!milestone) return null;\n    const cards = DATA.cards.filter((card) =\u003e card.milestone === milestone.id \u0026\u0026 card.status !== 'done');\n    const card = cards.find((item) =\u003e item.status === 'doing')\n      || cards.find((item) =\u003e item.status === 'ready')\n      || cards.find((item) =\u003e item.status === 'review')\n      || cards.find((item) =\u003e item.status === 'backlog');\n    return { milestone, card };\n  }\n\n  function relatedModules(id) {\n    const related = new Set();\n    DATA.relations.forEach((relation) =\u003e {\n      if (relation.from === id) related.add(relation.to);\n      if (relation.to === id) related.add(relation.from);\n    });\n    return related;\n  }\n\n  function cardMatches(card, query) {\n    if (!query) return true;\n    return [card.id, card.title, card.module, card.status, card.priority]\n      .filter(Boolean)\n      .join(' ')\n      .toLowerCase()\n      .includes(query);\n  }\n\n  function moduleMatches(module, query) {\n    if (!query) return true;\n    return [module.id, module.title, module.summary, module.layer, module.status]\n      .filter(Boolean)\n      .join(' ')\n      .toLowerCase()\n      .includes(query);\n  }\n\n  function docMatches(doc, query) {\n    if (!query) return true;\n    return [doc.id, doc.title, doc.kind, doc.status, doc.summary, doc.excerpt, doc.path]\n      .filter(Boolean)\n      .join(' ')\n      .toLowerCase()\n      .includes(query);\n  }\n\n  function eventMatches(event, query) {\n    if (!query) return true;\n    return [event.date, event.kind, event.title, event.detail, ...(event.refs || [])]\n      .filter(Boolean)\n      .join(' ')\n      .toLowerCase()\n      .includes(query);\n  }\n\n  function viewHead(kicker, title, subtitle, stats) {\n    return `\u003cdiv class=\"view-head\"\u003e\n      \u003cdiv\u003e\n        \u003cdiv class=\"kicker\"\u003e${esc(kicker)}\u003c/div\u003e\n        \u003ch1 class=\"view-title\"\u003e${esc(title)}\u003c/h1\u003e\n        ${subtitle ? `\u003cp class=\"view-sub\"\u003e${esc(subtitle)}\u003c/p\u003e` : ''}\n      \u003c/div\u003e\n      ${stats ? `\u003cdiv class=\"stats\"\u003e${stats}\u003c/div\u003e` : ''}\n    \u003c/div\u003e`;\n  }\n\n  function compareCards(a, b) {\n    const priority = { P0: 0, P1: 1, P2: 2 };\n    const pa = priority[a.priority] ?? 9;\n    const pb = priority[b.priority] ?? 9;\n    return pa - pb || a.id.localeCompare(b.id);\n  }\n\n  function renderTabs() {\n    document.querySelectorAll('.tab').forEach((tab) =\u003e {\n      const active = tab.dataset.view === state.view;\n      tab.classList.toggle('active', active);\n      if (active) tab.setAttribute('aria-current', 'page');\n      else tab.removeAttribute('aria-current');\n    });\n  }\n\n  function renderChrome() {\n    document.getElementById('project-status').textContent = DATA.project.status;\n    document.getElementById('module-count').textContent = DATA.modules.length;\n","truncated":true},{"path":"docs/dashboard/style.css","language":"css","text":":root {\n  --bg: #f4f2ee;\n  --surface: #fbfaf7;\n  --surface-2: #eeece6;\n  --ink: #1d1c19;\n  --muted: #6c675e;\n  --faint: #969084;\n  --line: #ded9cf;\n  --line-strong: #c8c1b4;\n  --accent: #2f5d50;\n  --accent-soft: rgba(47, 93, 80, 0.12);\n  --shadow: 0 1px 2px rgba(29, 28, 25, 0.05), 0 8px 24px rgba(29, 28, 25, 0.04);\n  --code-bg: #1e1d1a;\n  --code-ink: #e7e1d5;\n  --code-line: #302d28;\n  --code-muted: #6f6a5f;\n  --st-backlog: #8c8478;\n  --st-ready: #3f6f9f;\n  --st-doing: #b7791f;\n  --st-review: #6f5aa8;\n  --st-done: #3f7d4f;\n  --st-blocked: #b42318;\n  --sans: -apple-system, BlinkMacSystemFont, \"Segoe UI\", \"Noto Sans SC\", \"PingFang SC\", \"Hiragino Sans GB\", sans-serif;\n  --mono: ui-monospace, SFMono-Regular, \"SF Mono\", Menlo, Consolas, \"Liberation Mono\", monospace;\n}\n\n[data-theme=\"dark\"] {\n  --bg: #141412;\n  --surface: #1b1a17;\n  --surface-2: #23211d;\n  --ink: #eae6de;\n  --muted: #a8a094;\n  --faint: #8a8275;\n  --line: #2d2a25;\n  --line-strong: #4a453c;\n  --accent: #8fbfae;\n  --accent-soft: rgba(143, 191, 174, 0.12);\n  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.18);\n  --code-bg: #0e0e0d;\n  --code-ink: #ddd7ca;\n  --code-line: #2b2924;\n  --code-muted: #5f5a50;\n  --st-backlog: #9a9285;\n  --st-ready: #76a6d8;\n  --st-doing: #d3a04a;\n  --st-review: #a78fe0;\n  --st-done: #78b98a;\n  --st-blocked: #e06c61;\n}\n\n*,\n*::before,\n*::after {\n  box-sizing: border-box;\n}\n\nhtml,\nbody {\n  margin: 0;\n  height: 100%;\n}\n\nbody {\n  background: var(--bg);\n  color: var(--ink);\n  font-family: var(--sans);\n  font-size: 13px;\n  line-height: 1.5;\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n  overflow: hidden;\n}\n\nbutton {\n  font: inherit;\n  color: inherit;\n  background: none;\n  border: 0;\n  padding: 0;\n  cursor: pointer;\n}\n\na {\n  color: inherit;\n  text-decoration: none;\n}\n\ninput {\n  font: inherit;\n}\n\n::selection {\n  background: var(--accent-soft);\n}\n\n:focus-visible {\n  outline: 2px solid var(--accent);\n  outline-offset: 2px;\n}\n\n* {\n  scrollbar-width: thin;\n  scrollbar-color: var(--line-strong) transparent;\n}\n\n*::-webkit-scrollbar {\n  width: 8px;\n  height: 8px;\n}\n\n*::-webkit-scrollbar-thumb {\n  background: var(--line);\n  border: 2px solid transparent;\n  border-radius: 99px;\n  background-clip: padding-box;\n}\n\n/* ---------- top bar ---------- */\n\n.topbar {\n  height: 58px;\n  display: flex;\n  align-items: center;\n  gap: 22px;\n  padding: 0 18px;\n  border-bottom: 1px solid var(--line);\n  background: var(--surface);\n  position: relative;\n  z-index: 30;\n}\n\n.brand {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  min-width: 0;\n}\n\n.brand-mark {\n  width: 30px;\n  height: 30px;\n  border-radius: 8px;\n  background: var(--ink);\n  color: var(--bg);\n  display: grid;\n  place-items: center;\n  font-family: var(--mono);\n  font-size: 12px;\n  font-weight: 700;\n  letter-spacing: -0.06em;\n  flex: none;\n}\n\n.brand-tag {\n  font-size: 11px;\n  color: var(--muted);\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n}\n\n.tabs {\n  display: flex;\n  gap: 2px;\n  background: var(--surface-2);\n  border: 1px solid var(--line);\n  border-radius: 8px;\n  padding: 3px;\n  flex: none;\n}\n\n.tab {\n  padding: 5px 11px;\n  border-radius: 6px;\n  font-size: 11.5px;\n  color: var(--muted);\n  white-space: nowrap;\n  transition: color 0.12s ease, background 0.12s ease;\n}\n\n.tab:hover {\n  color: var(--ink);\n}\n\n.tab.active {\n  background: var(--surface);\n  color: var(--ink);\n  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);\n}\n\n.top-actions {\n  margin-left: auto;\n  display: flex;\n  align-items: center;\n  gap: 9px;\n}\n\n.search {\n  display: flex;\n  align-items: center;\n","truncated":true},{"path":"docs/dashboard/template.html","language":"html","text":"\u003c!doctype html\u003e\n\u003chtml lang=\"zh-CN\" data-theme=\"light\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\u003e\n\u003cmeta name=\"color-scheme\" content=\"light dark\"\u003e\n\u003cmeta name=\"description\" content=\"ni project dashboard: board, architecture, documents, timeline.\"\u003e\n\u003ctitle\u003eni · project dashboard\u003c/title\u003e\n\u003cstyle\u003e\n{{STYLE}}\n\u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\u003cheader class=\"topbar\"\u003e\n  \u003ca class=\"brand\" href=\"#/arch\" data-view=\"arch\" aria-label=\"ni dashboard\"\u003e\n    \u003cspan class=\"brand-mark\"\u003eni\u003c/span\u003e\n    \u003cspan class=\"brand-tag\"\u003eminimal, observable coding agent\u003c/span\u003e\n  \u003c/a\u003e\n\n  \u003cnav class=\"tabs\" aria-label=\"Views\"\u003e\n    \u003cbutton class=\"tab\" type=\"button\" data-view=\"arch\"\u003eArchitecture\u003c/button\u003e\n    \u003cbutton class=\"tab\" type=\"button\" data-view=\"work\"\u003eWork\u003c/button\u003e\n    \u003cbutton class=\"tab\" type=\"button\" data-view=\"docs\"\u003eDocs\u003c/button\u003e\n    \u003cbutton class=\"tab\" type=\"button\" data-view=\"decisions\"\u003eDecisions\u003c/button\u003e\n  \u003c/nav\u003e\n\n  \u003cdiv class=\"top-actions\"\u003e\n    \u003clabel class=\"search\" aria-label=\"Filter current view\"\u003e\n      \u003cspan class=\"search-key\"\u003e/\u003c/span\u003e\n      \u003cinput id=\"search\" type=\"search\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"Filter\"\u003e\n    \u003c/label\u003e\n    \u003cspan class=\"status-chip\" id=\"project-status\"\u003e\u003c/span\u003e\n    \u003cbutton class=\"icon-button\" id=\"theme-toggle\" type=\"button\" title=\"Toggle theme\" aria-label=\"Toggle theme\"\u003e◐\u003c/button\u003e\n  \u003c/div\u003e\n\u003c/header\u003e\n\n\u003cmain class=\"shell\"\u003e\n  \u003caside class=\"rail\" aria-label=\"Project navigation\"\u003e\n    \u003csection class=\"rail-section rail-map\"\u003e\n      \u003cdiv class=\"rail-head\"\u003e\u003ch2\u003eArchitecture\u003c/h2\u003e\u003cspan id=\"module-count\"\u003e\u003c/span\u003e\u003c/div\u003e\n      \u003cdiv id=\"map-nav\" class=\"map-nav\"\u003e\u003c/div\u003e\n    \u003c/section\u003e\n\n    \u003csection class=\"rail-section rail-docs\"\u003e\n      \u003cdiv class=\"rail-head\"\u003e\u003ch2\u003eDocuments\u003c/h2\u003e\u003cspan id=\"doc-count\"\u003e\u003c/span\u003e\u003c/div\u003e\n      \u003cdiv id=\"rail-docs\" class=\"rail-doc-list\"\u003e\u003c/div\u003e\n    \u003c/section\u003e\n\n    \u003cdiv class=\"rail-foot\" id=\"rail-foot\"\u003e\u003c/div\u003e\n  \u003c/aside\u003e\n\n  \u003csection class=\"canvas\" id=\"canvas\" aria-label=\"Project view\" tabindex=\"-1\"\u003e\u003c/section\u003e\n  \u003caside class=\"details\" id=\"details\" aria-label=\"Details\"\u003e\u003c/aside\u003e\n\u003c/main\u003e\n\n\u003cnoscript\u003e\n  \u003cp style=\"padding:24px;font-family:monospace\"\u003eThis dashboard needs JavaScript. Source files live in docs/dashboard/.\u003c/p\u003e\n\u003c/noscript\u003e\n\n\u003cscript id=\"ni-data\" type=\"application/json\"\u003e{{DATA}}\u003c/script\u003e\n\u003cscript\u003e\n{{APP}}\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n","truncated":false}]},{"id":"auth","title":"Auth","layer":"adapters","status":"active","summary":"凭证解析与安全存储：env → OS keyring → 0600 file。","contract":"AuthStore::resolve 只返回值与来源；不打印 key；provider 保持凭证无关。","paths":["crates/ni-auth/src/lib.rs","crates/ni-auth/src/file.rs","crates/ni-auth/src/keyring_store.rs","crates/ni-auth/src/error.rs"],"notes":["环境变量优先；keyring 不可用时回退 0600 文件。","文件写入使用 0600，状态会提示 insecure 权限。","不支持网页账号 cookie；账号 OAuth 需要独立 ADR。"],"sources":[{"path":"crates/ni-auth/src/lib.rs","language":"rust","text":"//! Credential resolution for ni.\n//!\n//! Resolution order is deliberately small: environment variable, then OS\n//! keyring, then a 0600 credentials file. Commands never print the secret.\n\nmod error;\nmod file;\nmod keyring_store;\n\npub use error::AuthError;\n\nuse std::env;\nuse std::fmt;\nuse std::path::{Path, PathBuf};\n\nuse file::FileStore;\n\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum Source {\n    Env,\n    Keyring,\n    File,\n}\n\nimpl Source {\n    pub fn as_str(self) -\u003e \u0026'static str {\n        match self {\n            Self::Env =\u003e \"env\",\n            Self::Keyring =\u003e \"keyring\",\n            Self::File =\u003e \"file\",\n        }\n    }\n}\n\nimpl fmt::Display for Source {\n    fn fmt(\u0026self, formatter: \u0026mut fmt::Formatter\u003c'_\u003e) -\u003e fmt::Result {\n        formatter.write_str(self.as_str())\n    }\n}\n\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum Storage {\n    Keyring,\n    File,\n}\n\nimpl fmt::Display for Storage {\n    fn fmt(\u0026self, formatter: \u0026mut fmt::Formatter\u003c'_\u003e) -\u003e fmt::Result {\n        match self {\n            Self::Keyring =\u003e formatter.write_str(\"OS keyring\"),\n            Self::File =\u003e formatter.write_str(\"0600 credentials file\"),\n        }\n    }\n}\n\n#[derive(Clone, PartialEq, Eq)]\npub struct SecretKey(String);\n\nimpl SecretKey {\n    pub fn expose(\u0026self) -\u003e \u0026str {\n        \u0026self.0\n    }\n}\n\nimpl fmt::Debug for SecretKey {\n    fn fmt(\u0026self, formatter: \u0026mut fmt::Formatter\u003c'_\u003e) -\u003e fmt::Result {\n        formatter.write_str(\"SecretKey(***)\")\n    }\n}\n\n#[derive(Debug)]\npub struct Resolved {\n    pub key: SecretKey,\n    pub source: Source,\n}\n\n#[derive(Debug, Clone)]\npub struct AuthStatus {\n    pub provider: String,\n    pub env: bool,\n    pub keyring: bool,\n    pub file: bool,\n    pub file_private: bool,\n    pub effective: Option\u003cSource\u003e,\n}\n\npub struct AuthStore {\n    file: FileStore,\n    keyring_enabled: bool,\n}\n\nimpl AuthStore {\n    pub fn new() -\u003e Result\u003cSelf, AuthError\u003e {\n        let directory = config_dir()?;\n        let keyring_enabled = !matches!(env::var(\"NI_AUTH_DISABLE_KEYRING\").as_deref(), Ok(\"1\"));\n\n        Ok(Self {\n            file: FileStore::new(directory.join(\"credentials.toml\")),\n            keyring_enabled,\n        })\n    }\n\n    /// Test/local helper: use a specific config directory and skip the keyring.\n    pub fn at(directory: \u0026Path) -\u003e Self {\n        Self {\n            file: FileStore::new(directory.join(\"credentials.toml\")),\n            keyring_enabled: false,\n        }\n    }\n\n    pub fn credentials_path(\u0026self) -\u003e \u0026Path {\n        self.file.path()\n    }\n\n    pub fn resolve(\u0026self, provider: \u0026str) -\u003e Result\u003cOption\u003cResolved\u003e, AuthError\u003e {\n        let env_value = env_var(provider).and_then(|name| env::var(name).ok());\n        self.resolve_with(provider, env_value)\n    }\n\n    pub fn resolve_with(\n        \u0026self,\n        provider: \u0026str,\n        env_value: Option\u003cString\u003e,\n    ) -\u003e Result\u003cOption\u003cResolved\u003e, AuthError\u003e {\n        if let Some(value) = env_value\n            .map(|value| value.trim().to_string())\n            .filter(|value| !value.is_empty())\n        {\n            return Ok(Some(Resolved {\n                key: SecretKey(value),\n                source: Source::Env,\n            }));\n        }\n\n        if self.keyring_enabled {\n            if let Some(value) = keyring_store::get(provider) {\n                return Ok(Some(Resolved {\n                    key: SecretKey(value),\n                    source: Source::Keyring,\n                }));\n            }\n        }\n\n        if let Some(value) = self.file.get(provider)? {\n            return Ok(Some(Resolved {\n                key: SecretKey(value),\n                source: Source::File,\n            }));\n        }\n\n        Ok(None)\n    }\n\n    pub fn status(\u0026self, provider: \u0026str) -\u003e Result\u003cAuthStatus, AuthError\u003e {\n        let env_value = env_var(provider).and_then(|name| env::var(name).ok());\n        self.status_with(provider, env_value)\n    }\n\n    pub fn status_with(\n        \u0026self,\n        provider: \u0026str,\n        env_value: Option\u003cString\u003e,\n    ) -\u003e Result\u003cAuthStatus, AuthError\u003e {\n        let env = env_value\n            .as_deref()\n            .map(|value| !value.trim().is_empty())\n            .unwrap_or(false);\n        let keyring = if self.keyring_enabled {\n            keyring_store::get(provider).is_some()\n        } else {\n            false\n        };\n        let file = self.file.get(provider)?.is_some();\n        let file_private = if file { self.file.is_private() } else { true };\n\n        let effective = if env {\n            Some(Source::Env)\n        } else if keyring {\n            Some(Source::Keyring)\n        } else if file {\n            Some(Source::File)\n        } else {\n            None\n        };\n\n        Ok(AuthStatus {\n            provider: provider.to_string(),\n            env,\n            keyring,\n            file,\n            file_private,\n            effective,\n        })\n    }\n\n    /// Store the key in the OS keyring, falling back to a 0600 file.\n    pub fn set(\u0026self, provider: \u0026str, api_key: \u0026str) -\u003e Result\u003cStorage, AuthError\u003e {\n        let api_key = api_key.trim();\n        if api_key.is_empty() {\n            return Err(AuthError::EmptyKey);\n","truncated":true},{"path":"crates/ni-auth/src/file.rs","language":"rust","text":"use std::collections::BTreeMap;\nuse std::fs;\nuse std::path::{Path, PathBuf};\n\nuse serde::{Deserialize, Serialize};\n\nuse crate::AuthError;\n\n#[derive(Debug, Default, Serialize, Deserialize)]\nstruct Credentials {\n    #[serde(default)]\n    providers: BTreeMap\u003cString, ProviderEntry\u003e,\n}\n\n#[derive(Debug, Serialize, Deserialize)]\nstruct ProviderEntry {\n    api_key: String,\n}\n\npub(crate) struct FileStore {\n    path: PathBuf,\n}\n\nimpl FileStore {\n    pub(crate) fn new(path: PathBuf) -\u003e Self {\n        Self { path }\n    }\n\n    pub(crate) fn path(\u0026self) -\u003e \u0026Path {\n        \u0026self.path\n    }\n\n    pub(crate) fn get(\u0026self, provider: \u0026str) -\u003e Result\u003cOption\u003cString\u003e, AuthError\u003e {\n        let credentials = self.read()?;\n        Ok(credentials\n            .providers\n            .get(provider)\n            .map(|entry| entry.api_key.trim().to_string())\n            .filter(|key| !key.is_empty()))\n    }\n\n    pub(crate) fn set(\u0026self, provider: \u0026str, api_key: \u0026str) -\u003e Result\u003c(), AuthError\u003e {\n        let mut credentials = self.read()?;\n        credentials.providers.insert(\n            provider.to_string(),\n            ProviderEntry {\n                api_key: api_key.to_string(),\n            },\n        );\n        self.write(\u0026credentials)\n    }\n\n    pub(crate) fn remove(\u0026self, provider: \u0026str) -\u003e Result\u003cbool, AuthError\u003e {\n        let mut credentials = self.read()?;\n        let removed = credentials.providers.remove(provider).is_some();\n        if removed {\n            self.write(\u0026credentials)?;\n        }\n        Ok(removed)\n    }\n\n    pub(crate) fn is_private(\u0026self) -\u003e bool {\n        #[cfg(unix)]\n        {\n            use std::os::unix::fs::PermissionsExt;\n            self.path\n                .metadata()\n                .map(|metadata| metadata.permissions().mode() \u0026 0o077 == 0)\n                .unwrap_or(true)\n        }\n        #[cfg(not(unix))]\n        {\n            true\n        }\n    }\n\n    fn read(\u0026self) -\u003e Result\u003cCredentials, AuthError\u003e {\n        if !self.path.exists() {\n            return Ok(Credentials::default());\n        }\n\n        let raw = fs::read_to_string(\u0026self.path)?;\n        if raw.trim().is_empty() {\n            return Ok(Credentials::default());\n        }\n\n        toml::from_str(\u0026raw).map_err(|_| AuthError::CorruptCredentials)\n    }\n\n    fn write(\u0026self, credentials: \u0026Credentials) -\u003e Result\u003c(), AuthError\u003e {\n        let parent = self.path.parent().ok_or(AuthError::NoConfigDir)?;\n        let existed = parent.exists();\n        fs::create_dir_all(parent)?;\n\n        #[cfg(unix)]\n        {\n            use std::os::unix::fs::PermissionsExt;\n            if !existed {\n                fs::set_permissions(parent, fs::Permissions::from_mode(0o700))?;\n            }\n        }\n\n        let data = toml::to_string_pretty(credentials).map_err(|_| AuthError::Serialize)?;\n        let temporary = self.path.with_extension(\"toml.tmp\");\n        fs::write(\u0026temporary, data)?;\n\n        #[cfg(unix)]\n        {\n            use std::os::unix::fs::PermissionsExt;\n            fs::set_permissions(\u0026temporary, fs::Permissions::from_mode(0o600))?;\n        }\n\n        fs::rename(\u0026temporary, \u0026self.path)?;\n\n        #[cfg(unix)]\n        {\n            use std::os::unix::fs::PermissionsExt;\n            fs::set_permissions(\u0026self.path, fs::Permissions::from_mode(0o600))?;\n        }\n\n        Ok(())\n    }\n}\n" ],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e三个 crate：\u003ccode\u003eni-core\u003c/code\u003e、\u003ccode\u003eni-cli\u003c/code\u003e、\u003ccode\u003extask\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e统一 edition、依赖版本和 workspace lint 入口。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ecargo xtask dashboard\u003c/code\u003e 作为仓库工具入口。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ecargo test --workspace\u003c/code\u003e 全绿。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ecargo xtask dashboard\u003c/code\u003e 可重复执行。\u003c/li\u003e\n\u003cli\u003e核心 crate 不依赖 CLI 或 UI。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003e先保持三个 crate。等 provider、tools、sandbox 真正落地后再拆，避免空 crate。\u003c/p\u003e\n","path":"docs/board/M0-001-workspace.md"},{"id":"M0-002","title":"事件模型与 JSONL 会话日志","status":"done","milestone":"M0","module":"session","size":"M","priority":"P0","updated":"2026-10-20","completed":"2026-10-20","depends_on":[],"docs":["adr-0002"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eEvent\u003c/code\u003e 枚举覆盖 session、user、assistant、tool result、turn end、compaction。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eSessionLog\u003c/code\u003e 只追加，每条事件立即 flush。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eload\u003c/code\u003e 逐行解码，坏行变成 warning，不丢整份历史。\u003c/li\u003e\n\u003cli\u003e单测覆盖 round-trip、坏尾行、空行。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n写入后重新加载，事件序列完全一致。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n最后一行损坏时，前面的历史仍可读。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003eni session show\u003c/code\u003e 能打印事件类型和数量。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003e时间戳统一为 Unix 毫秒。\u003ccode\u003ecompaction\u003c/code\u003e 记录被替换的事件数量，后续 resume 用它判断投影边界。\u003c/p\u003e\n","path":"docs/board/M0-002-session-log.md"},{"id":"M0-003","title":"离线项目看板 v0","status":"done","milestone":"M0","module":"dashboard","size":"L","priority":"P1","updated":"2026-10-20","completed":"2026-10-20","depends_on":["M0-001"],"docs":["readme"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e三栏壳：里程碑导航 / 画布 / 详情。\u003c/li\u003e\n\u003cli\u003e四个视图：Board、Architecture、Docs、Timeline。\u003c/li\u003e\n\u003cli\u003e数据源：\u003ccode\u003edocs/dashboard/project.json\u003c/code\u003e + 一卡一文件的 TOML frontmatter。\u003c/li\u003e\n\u003cli\u003e构建为单个 \u003ccode\u003edocs/index.html\u003c/code\u003e，无 CDN、无运行时 fetch，\u003ccode\u003efile://\u003c/code\u003e 可开。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e--check\u003c/code\u003e 校验引用、状态和生成物是否过期。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n双击 \u003ccode\u003edocs/index.html\u003c/code\u003e 能看到真实 M0 卡片。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n架构图展示模块状态和依赖箭头。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nADR 与架构文档能在右栏渲染。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003ecargo xtask dashboard --check\u003c/code\u003e 在生成物过期时失败。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003e浏览器只读，不提供拖拽回写。状态变更走仓库，避免看板变成第二个真相源。后续由 \u003ccode\u003eM0-010\u003c/code\u003e 改为 Architecture 优先。\u003c/p\u003e\n","path":"docs/board/M0-003-dashboard.md"},{"id":"M0-004","title":"CLI 骨架与会话命令","status":"done","milestone":"M0","module":"cli","size":"S","priority":"P0","updated":"2026-10-20","completed":"2026-10-20","depends_on":["M0-001","M0-002"],"docs":[],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eni\u003c/code\u003e 无参数时打印版本、状态、会话目录和下一步。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eni session new\u003c/code\u003e 创建会话并写入 \u003ccode\u003esession_start\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eni session show\u003c/code\u003e 打印事件时间线，\u003ccode\u003eni session list\u003c/code\u003e 列出文件。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003eni session new\u003c/code\u003e 输出可直接被脚本消费的路径。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003eni session show \u0026lt;path\u0026gt;\u003c/code\u003e 显示事件数与 warning。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n默认目录支持 \u003ccode\u003eNI_HOME\u003c/code\u003e / \u003ccode\u003eHOME\u003c/code\u003e 覆盖。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003eexec\u003c/code\u003e 子命令等 loop 落地后再加，避免先有一个假入口。\u003c/p\u003e\n","path":"docs/board/M0-004-cli.md"},{"id":"M0-005","title":"Provider trait 与 OpenAI-compatible SSE","status":"done","milestone":"M0","module":"providers","size":"L","priority":"P0","updated":"2026-10-20","completed":"2026-10-20","depends_on":["M0-002"],"docs":["provider","architecture"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e内部统一的 \u003ccode\u003eStreamEvent\u003c/code\u003e：text / reasoning / tool call / usage / done / error。\u003c/li\u003e\n\u003cli\u003e一个真实 provider 的 SSE 适配，优先 OpenAI-compatible。\u003c/li\u003e\n\u003cli\u003e错误分类：可重试、致命、上下文溢出。\u003c/li\u003e\n\u003cli\u003eusage 归一化，保留 cached 与 reasoning tokens。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n本地 SSE fixture 能解析出 text、reasoning、tool call、usage、done。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n429 / 5xx 分类为可重试，并读取 \u003ccode\u003eRetry-After\u003c/code\u003e；实际重试由 loop 在 turn 边界执行。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n上下文溢出返回独立错误类型，交给 compaction 处理。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nprovider 模块不依赖 tools 或 TUI。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nDeepSeek preset：\u003ccode\u003ethinking\u003c/code\u003e、\u003ccode\u003ereasoning_content\u003c/code\u003e、\u003ccode\u003edeepseek-flash\u003c/code\u003e / \u003ccode\u003edeepseek-v4-pro\u003c/code\u003e。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003e实现 \u003ccode\u003eni-provider\u003c/code\u003e：Provider trait、OpenAI-compatible SSE 客户端、DeepSeek preset、scripted provider，以及本地 TCP + SSE 测试（不访问网络）。录制的 DeepSeek SSE fixture 在 \u003ccode\u003ecrates/ni-provider/tests/fixtures/deepseek-tool-call.sse\u003c/code\u003e。当前环境没有 API key，所以没有做真实 DeepSeek 调用；\u003ccode\u003eni provider test --preset deepseek\u003c/code\u003e 可在配置 key 后验证。\u003c/p\u003e\n","path":"docs/board/M0-005-provider.md"},{"id":"M0-006","title":"文件工具：read / write / edit / grep / glob","status":"backlog","milestone":"M0","module":"tools","size":"L","priority":"P0","updated":"2026-10-20","completed":null,"depends_on":["M0-001"],"docs":["architecture"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e五个文件工具 + 一个注册表；JSON Schema 描述输入。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eread\u003c/code\u003e 返回行号，单次上限 2000 行 / 50KB，截断时给出续读方式。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eedit\u003c/code\u003e 用精确字符串替换，要求唯一匹配，返回小 diff。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003egrep\u003c/code\u003e / \u003ccode\u003eglob\u003c/code\u003e 结果有上限，并报告总数。\u003c/li\u003e\n\u003cli\u003eread-before-write 策略：未读过的文件拒绝写。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e非唯一 \u003ccode\u003eold_string\u003c/code\u003e 被拒绝，并提示增加上下文。\u003c/li\u003e\n\u003cli\u003e未读文件 \u003ccode\u003ewrite\u003c/code\u003e / \u003ccode\u003eedit\u003c/code\u003e 返回可操作的错误。\u003c/li\u003e\n\u003cli\u003e超大文件读取被截断，模型能按 offset 继续。\u003c/li\u003e\n\u003cli\u003e工具错误信息包含下一步建议，而不是裸错误码。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003e工具描述也是 prompt 表面，描述里写清楚何时用、何时不用、边界和示例。\u003c/p\u003e\n","path":"docs/board/M0-006-tools.md"},{"id":"M0-007","title":"Bash 工具：超时、进程组与输出预算","status":"backlog","milestone":"M0","module":"sandbox","size":"M","priority":"P0","updated":"2026-10-20","completed":null,"depends_on":["M0-006"],"docs":[],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e在工作目录执行命令，默认超时 120s。\u003c/li\u003e\n\u003cli\u003e启动时 \u003ccode\u003edetached\u003c/code\u003e，取消/超时对进程组发信号，不留孤儿。\u003c/li\u003e\n\u003cli\u003e只回尾部 20KB，完整输出写临时文件并把路径给模型。\u003c/li\u003e\n\u003cli\u003e变更型命令先过 approval 策略（M0 可以是占位实现）。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e超时后子进程及其派生的 \u003ccode\u003esleep\u003c/code\u003e 都被终止。\u003c/li\u003e\n\u003cli\u003e大输出不会撑爆上下文，模型能拿到完整输出路径。\u003c/li\u003e\n\u003cli\u003eCtrl-C 能中断正在跑的命令。\u003c/li\u003e\n\u003cli\u003e非零退出码、stderr 和超时是可区分的三种结果。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003ebash 是能力上限也是风险上限。没有真沙箱时，所有变更型 bash 强制审批。\u003c/p\u003e\n","path":"docs/board/M0-007-bash.md"},{"id":"M0-008","title":"Turn loop 与 ni exec","status":"backlog","milestone":"M0","module":"loop","size":"L","priority":"P0","updated":"2026-10-20","completed":null,"depends_on":["M0-005","M0-006","M0-007"],"docs":["architecture"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e一个 turn：project → stream → dispatch tools → append events。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eSessionRuntime\u003c/code\u003e 暴露 Command/Event 边界；CLI/TUI 不直接操作 loop 内部。\u003c/li\u003e\n\u003cli\u003e循环直到无 tool call、达到 max steps、被取消或 fatal error。\u003c/li\u003e\n\u003cli\u003e只读工具可并发，写工具串行。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eni exec \"\u0026lt;prompt\u0026gt;\"\u003c/code\u003e headless 入口，输出最终文本和 usage。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e用 scripted provider 修掉 fixture 仓库里的一个失败测试。\u003c/li\u003e\n\u003cli\u003e达到 max steps 时返回明确原因，不静默退出。\u003c/li\u003e\n\u003cli\u003e取消后不再发起 provider 请求或工具调用。\u003c/li\u003e\n\u003cli\u003e每个 turn 的 usage 落在 \u003ccode\u003eturn_end\u003c/code\u003e 事件里。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003eloop 不关心 provider wire format，也不实现工具逻辑。它只编排和记录。\u003c/p\u003e\n","path":"docs/board/M0-008-loop.md"},{"id":"M0-009","title":"Resume 与录制回放测试","status":"backlog","milestone":"M0","module":"session","size":"M","priority":"P1","updated":"2026-10-20","completed":null,"depends_on":["M0-008"],"docs":["adr-0002"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eni exec --resume \u0026lt;session\u0026gt;\u003c/code\u003e 从日志重建上下文继续。\u003c/li\u003e\n\u003cli\u003escripted provider：按预设返回 tool call 序列，完全离线。\u003c/li\u003e\n\u003cli\u003e录制 / 回放 provider 响应的 fixture 目录。\u003c/li\u003e\n\u003cli\u003egolden transcript 测试 loop 行为。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e中断后 resume，模型看到的历史与中断前一致。\u003c/li\u003e\n\u003cli\u003e回放同一 fixture 两次，事件序列一致。\u003c/li\u003e\n\u003cli\u003e工具执行后不重放整个 turn。\u003c/li\u003e\n\u003cli\u003e测试不访问网络、不烧 token。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003e测试的价值不在覆盖率，而在让 context / loop 的修改可以离线验证。\u003c/p\u003e\n","path":"docs/board/M0-009-resume.md"},{"id":"M0-010","title":"Architecture-first dashboard 改造","status":"done","milestone":"M0","module":"dashboard","size":"M","priority":"P1","updated":"2026-10-20","completed":"2026-10-20","depends_on":["M0-003"],"docs":["adr-0003"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e默认视图改为 Architecture，导航改为 Architecture / Work / Docs / Decisions。\u003c/li\u003e\n\u003cli\u003e架构视图移除进度条、完成率和卡片计数；左栏改为按层分组的模块导航。\u003c/li\u003e\n\u003cli\u003eWork 保留卡片和里程碑筛选，但不再展示进度统计。\u003c/li\u003e\n\u003cli\u003eDecisions 只收 ADR 与 \u003ccode\u003ekind = \"decision\"\u003c/code\u003e 事件。\u003c/li\u003e\n\u003cli\u003e模块聚焦：选中后高亮相关边、弱化无关模块；不做 zoom/pan。\u003c/li\u003e\n\u003cli\u003e视觉继续走 technical field guide，不引入前端框架。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n打开 \u003ccode\u003edocs/index.html\u003c/code\u003e 第一屏是架构图。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nArchitecture 页没有进度条、完成率、Kanban 统计。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nWork 仍可筛选里程碑、打开卡片详情。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nDecisions 只显示决策事件和 ADR。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n模块聚焦、源码/ADR 联读、明暗主题正常。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n单文件离线，\u003ccode\u003ecargo xtask dashboard --check\u003c/code\u003e 通过。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003e进度信息不是被删除，而是从第一屏移走：卡片仍在 \u003ccode\u003edocs/board/\u003c/code\u003e，Work 仍可查。看板重新成为架构阅读面。\u003c/p\u003e\n","path":"docs/board/M0-010-architecture-first.md"},{"id":"M0-011","title":"ni auth：keyring 与安全凭证解析","status":"done","milestone":"M0","module":"auth","size":"M","priority":"P1","updated":"2026-10-20","completed":"2026-10-20","depends_on":["M0-004"],"docs":["auth","adr-0005"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e新增 \u003ccode\u003eni-auth\u003c/code\u003e：凭证解析顺序 env → OS keyring → 0600 文件。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eni auth set \u0026lt;provider\u0026gt;\u003c/code\u003e 隐藏输入，或 \u003ccode\u003e--stdin\u003c/code\u003e 供脚本使用。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eni auth status\u003c/code\u003e 只显示来源，不打印密钥。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eni auth unset \u0026lt;provider\u0026gt;\u003c/code\u003e 清理 keyring 和文件。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eni provider test\u003c/code\u003e 通过 \u003ccode\u003eni-auth\u003c/code\u003e 取 key，不再只读环境变量。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003eDEEPSEEK_API_KEY\u003c/code\u003e 优先于 keyring 和文件。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nkeyring 可用时写入 keyring；不可用时回退 0600 文件。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n文件权限为 0600，状态对 insecure 权限给出警告。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n损坏的凭证文件返回无内容泄露的错误。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003estatus\u003c/code\u003e / \u003ccode\u003eprovider list\u003c/code\u003e 不打印密钥。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003eLinux 的 keyring 走 Secret Service（需要 DBus）；无桌面/容器环境可设置 \u003ccode\u003eNI_AUTH_DISABLE_KEYRING=1\u003c/code\u003e 强制文件。这个卡片只解决 API key 的登录体验；ChatGPT 账号 OAuth（SIWC）和 DeepSeek 网页账号不在范围内。\u003c/p\u003e\n","path":"docs/board/M0-011-auth.md"},{"id":"M0-012","title":"最小 ni exec 闭环","status":"done","milestone":"M0","module":"loop","size":"L","priority":"P0","updated":"2026-10-20","completed":"2026-10-20","depends_on":["M0-005"],"docs":["exec","architecture"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e新增 \u003ccode\u003eni-tools\u003c/code\u003e：\u003ccode\u003eread\u003c/code\u003e / \u003ccode\u003ewrite\u003c/code\u003e / \u003ccode\u003eedit\u003c/code\u003e / \u003ccode\u003ebash\u003c/code\u003e，路径限制、read-before-write、输出截断。\u003c/li\u003e\n\u003cli\u003e新增 \u003ccode\u003eni-agent\u003c/code\u003e：turn loop、流式文本、tool call 聚合、工具派发、事件落盘、max steps。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eni exec \"\u0026lt;task\u0026gt;\"\u003c/code\u003e：通过 \u003ccode\u003eni-auth\u003c/code\u003e 取 key，创建 session，流式输出。\u003c/li\u003e\n\u003cli\u003eSession 事件：\u003ccode\u003esession_start → user_message → assistant_message → turn_end → tool_result* → … → session_end\u003c/code\u003e。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n真实 DeepSeek \u003ccode\u003edeepseek-flash\u003c/code\u003e 文本响应成功。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n真实 DeepSeek tool call（read）成功，第二轮返回内容。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n本地 mock SSE 覆盖 text 与 tool 两条路径，不消耗 token。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n脚本化 provider 测试覆盖无工具完成、工具后继续、max steps。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n文件工具拒绝工作区外路径；已有文件必须先 read。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nusage / cached tokens 落在 \u003ccode\u003eturn_end\u003c/code\u003e。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003e这是最小闭环，不是安全闭环：\u003ccode\u003ebash\u003c/code\u003e 可执行任意命令，没有 approval/sandbox；\u003ccode\u003egrep\u003c/code\u003e/\u003ccode\u003eglob\u003c/code\u003e、进程组 kill、resume、compaction 仍未完成。真实 DeepSeek 测试在临时工作区执行，session 已清理。\u003c/p\u003e\n","path":"docs/board/M0-012-minimal-exec.md"},{"id":"M1-001","title":"流式 TUI 与取消","status":"backlog","milestone":"M1","module":"tui","size":"L","priority":"P1","updated":"2026-10-20","completed":null,"depends_on":["M0-008"],"docs":[],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e流式渲染文本、reasoning 折叠、工具调用状态。\u003c/li\u003e\n\u003cli\u003e审批提示：单键 allow / deny / allow-for-session。\u003c/li\u003e\n\u003cli\u003ediff 预览，先看再批。\u003c/li\u003e\n\u003cli\u003eCtrl-C 取消当前 turn，二次强制退出。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e首 token 到达即渲染，不等完整响应。\u003c/li\u003e\n\u003cli\u003e审批时终端不丢输入、不卡死。\u003c/li\u003e\n\u003cli\u003e取消后进程组被清理，session 留下明确事件。\u003c/li\u003e\n\u003cli\u003e窄终端（80 列）仍可读。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003eTUI 只消费事件流，不 import loop 内部。先做线性输出，再做花活。\u003c/p\u003e\n","path":"docs/board/M1-001-tui.md"},{"id":"M1-002","title":"Sandbox 三轴与原生隔离","status":"backlog","milestone":"M1","module":"sandbox","size":"L","priority":"P1","updated":"2026-10-20","completed":null,"depends_on":["M0-007"],"docs":[],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003esandbox\u003c/code\u003e：read-only / workspace-write / full-access。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eapproval\u003c/code\u003e：ask / on-failure / never。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003enetwork\u003c/code\u003e：on / off。\u003c/li\u003e\n\u003cli\u003eLinux 用 landlock + seccomp，macOS 用 seatbelt；先做一个平台。\u003c/li\u003e\n\u003cli\u003e路径策略与 shell 隔离分开实现，不假装进程内检查是安全边界。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eworkspace-write 下无法写工作区外路径。\u003c/li\u003e\n\u003cli\u003e网络关闭时子进程连接被拒绝。\u003c/li\u003e\n\u003cli\u003e逃逸尝试留下审计事件，而不是静默失败。\u003c/li\u003e\n\u003cli\u003e无沙箱平台明确降级到强制审批，并提示原因。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003e安全模型要能一句话解释清楚：能写哪、能连哪、什么时候问人。\u003c/p\u003e\n","path":"docs/board/M1-002-sandbox.md"},{"id":"M1-003","title":"Diff 预览与输出折叠","status":"backlog","milestone":"M1","module":"tui","size":"M","priority":"P2","updated":"2026-10-20","completed":null,"depends_on":["M1-001"],"docs":[],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e统一 diff 渲染：文件头、hunk、增删行、上下文折叠。\u003c/li\u003e\n\u003cli\u003e工具输出超过阈值时折叠，只显示摘要和\"展开\"提示。\u003c/li\u003e\n\u003cli\u003e审批前展示本次写入的完整 diff。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e大 diff 不刷屏，能按文件跳转。\u003c/li\u003e\n\u003cli\u003e行号与新增/删除标记对齐。\u003c/li\u003e\n\u003cli\u003e终端宽度变化后重排不破版。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003ediff 是审批体验的核心。模型说\"改好了\"不算，用户看到 diff 才算。\u003c/p\u003e\n","path":"docs/board/M1-003-diff.md"},{"id":"M2-001","title":"Compaction 与可执行 handoff","status":"backlog","milestone":"M2","module":"context","size":"L","priority":"P1","updated":"2026-10-20","completed":null,"depends_on":["M0-009"],"docs":["adr-0002"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e上下文到 75% 预算时触发压缩。\u003c/li\u003e\n\u003cli\u003e保留最近 N 轮原文和原始用户请求。\u003c/li\u003e\n\u003cli\u003e生成结构化 handoff：目标、已完成、改动文件、当前状态、下一步、约束。\u003c/li\u003e\n\u003cli\u003e压缩结果落成 \u003ccode\u003ecompaction\u003c/code\u003e 事件，resume 时按 \u003ccode\u003eupto\u003c/code\u003e 重建投影。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e压缩后继续任务，不重复已完成步骤。\u003c/li\u003e\n\u003cli\u003e压缩事件可回放，模型上下文与压缩时一致。\u003c/li\u003e\n\u003cli\u003e压缩失败时保留原上下文并提示，不丢历史。\u003c/li\u003e\n\u003cli\u003e长会话 token 成本可见地下降。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003e压缩不是\"总结对话\"，是给下一个 turn 或下一个 session 写可执行的交接单。\u003c/p\u003e\n","path":"docs/board/M2-001-compaction.md"},{"id":"M2-002","title":"AGENTS.md 分层发现与缓存指标","status":"backlog","milestone":"M2","module":"context","size":"M","priority":"P2","updated":"2026-10-20","completed":null,"depends_on":["M2-001"],"docs":[],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e从 cwd 向上发现 \u003ccode\u003eAGENTS.md\u003c/code\u003e，按距离合并，近者优先。\u003c/li\u003e\n\u003cli\u003esystem prompt 只保留稳定前缀；易变信息放末尾。\u003c/li\u003e\n\u003cli\u003e记录 cached / input tokens，按 turn 汇总命中率。\u003c/li\u003e\n\u003cli\u003e看板 Runs 视图读取 metrics JSONL。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e子目录规范能覆盖根目录规则。\u003c/li\u003e\n\u003cli\u003e修改 \u003ccode\u003eAGENTS.md\u003c/code\u003e 后下一 turn 生效，无需重启。\u003c/li\u003e\n\u003cli\u003e缓存命中率可在 session 事件里看到。\u003c/li\u003e\n\u003cli\u003e前缀变化导致缓存失效时能定位原因。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003e缓存命中率是 context 工程质量最直接的指标。没有指标就不要谈优化。\u003c/p\u003e\n","path":"docs/board/M2-002-agents-cache.md"},{"id":"M3-001","title":"Replay 与 fork","status":"backlog","milestone":"M3","module":"session","size":"M","priority":"P2","updated":"2026-10-20","completed":null,"depends_on":["M2-001"],"docs":["adr-0002"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eni replay \u0026lt;session\u0026gt;\u003c/code\u003e：按事件重建状态并校验投影。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eni fork \u0026lt;session\u0026gt; --at \u0026lt;event-id\u0026gt;\u003c/code\u003e：复制前缀，生成新 session。\u003c/li\u003e\n\u003cli\u003e事件 id 稳定，fork 后历史可追溯。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003ereplay 不调用模型，输出与原始 turn 的投影一致。\u003c/li\u003e\n\u003cli\u003efork 后原 session 不被修改。\u003c/li\u003e\n\u003cli\u003e坏尾行 fork 时被截断并提示。\u003c/li\u003e\n\u003cli\u003e事件 id 冲突检测。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003efork 是 subagent 和\"试另一条路\"的基础。先有可靠前缀复制，再谈并行。\u003c/p\u003e\n","path":"docs/board/M3-001-replay-fork.md"},{"id":"M3-002","title":"Subagent 与并行只读探索","status":"backlog","milestone":"M3","module":"loop","size":"L","priority":"P2","updated":"2026-10-20","completed":null,"depends_on":["M3-001","M1-002"],"docs":[],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e子 session 有独立日志，父 session 记录 spawn / result 事件。\u003c/li\u003e\n\u003cli\u003e只读探索可并行；写操作仍由主 session 串行。\u003c/li\u003e\n\u003cli\u003e子代理有独立步数、token 和超时预算。\u003c/li\u003e\n\u003cli\u003e结果返回摘要 + 完整日志路径，不把整个子上下文塞回父上下文。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e两个子代理并行跑互不污染事件日志。\u003c/li\u003e\n\u003cli\u003e子代理超时/失败不影响主 session 继续。\u003c/li\u003e\n\u003cli\u003e父上下文只增加一条结果摘要。\u003c/li\u003e\n\u003cli\u003e能追溯每个结论来自哪个子 session。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003esubagent 不是多 agent 框架，只是\"带独立日志的受限子运行\"。先证明单 agent 闭环可靠。\u003c/p\u003e\n","path":"docs/board/M3-002-subagents.md"}],"docs":[{"id":"architecture","title":"架构","kind":"doc","status":"living","order":10,"summary":"ni 的边界、数据流、事件生命周期与明确不做的事。","body_html":"\u003ch2\u003e一句话\u003c/h2\u003e\n\u003cp\u003eni 是一个围绕 \u003cstrong\u003eappend-only 事件日志\u003c/strong\u003e 构建的最小 coding agent harness：一个 turn 引擎、一层薄 provider 适配、工具面、三条安全轴。当前最小闭环是四个工具；完整目标仍是六个。\u003c/p\u003e\n\u003ch2\u003e设计约束\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e日志是唯一真相。\u003c/strong\u003e 内存里的对话是日志的投影。任何不落盘的状态，进程退出即不存在。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e上下文是产品。\u003c/strong\u003e 模型看到什么、按什么顺序看到、何时压缩，决定了 agent 的上限。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e工具少而锋利。\u003c/strong\u003e 每多一个工具，就多一份 schema、一类失败模式和一段 prompt。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eprovider 层要薄。\u003c/strong\u003e 只归一化够用的部分，不试图抹平所有 wire format 怪癖。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e安全边界要诚实。\u003c/strong\u003e 进程内路径校验不是沙箱；bash 能绕过的东西，不能假装它不能。\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e数据流\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003euser input\n   │\n   ▼\n CLI ──► loop ──► context.project(log, budget) ──► provider.stream\n            │                                          │\n            │                                     StreamEvent\n            │                                          ▼\n            │                                   assistant message\n            │                                          │\n            ├────────────── tool calls ◄───────────────┘\n            │                   │\n            │                   ├──► sandbox.guard\n            │                   └──► tools.dispatch (read-only 并发，写串行)\n            │\n            └──► session.append(every event, flush)\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e一个 turn 的边界是 \u003ccode\u003euser_message\u003c/code\u003e 到 \u003ccode\u003eturn_end\u003c/code\u003e。loop 只做四件事：投影、请求、派发、追加。它不解析 SSE，不实现工具，不渲染 UI。\u003c/p\u003e\n\u003ch2\u003e事件生命周期\u003c/h2\u003e\n\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e事件\u003c/th\u003e\u003cth\u003e何时写入\u003c/th\u003e\u003cth\u003e关键字段\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003esession_start\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e创建会话\u003c/td\u003e\u003ctd\u003eid、cwd、model\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003euser_message\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e用户输入\u003c/td\u003e\u003ctd\u003etext\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eassistant_message\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e一次模型响应结束\u003c/td\u003e\u003ctd\u003etext、reasoning、tool_calls\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003etool_result\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e每个工具执行完\u003c/td\u003e\u003ctd\u003ecall_id、ok、output\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eturn_end\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e一个 turn 结束\u003c/td\u003e\u003ctd\u003eusage（含 cached / reasoning）\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003ecompaction\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e上下文压缩\u003c/td\u003e\u003ctd\u003esummary、upto\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003esession_end\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e正常退出\u003c/td\u003e\u003ctd\u003ets\u003c/td\u003e\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e\u003ccode\u003ecompaction.upto\u003c/code\u003e 表示被摘要替换的事件数量。resume 时先加载全量事件，再按最后一个 compaction 截断投影；原始事件永远保留。\u003c/p\u003e\n\u003ch2\u003e模块边界\u003c/h2\u003e\n\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e层\u003c/th\u003e\u003cth\u003e模块\u003c/th\u003e\u003cth\u003e职责\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\n\u003ctr\u003e\u003ctd\u003eInterface\u003c/td\u003e\u003ctd\u003eCLI / TUI\u003c/td\u003e\u003ctd\u003e参数、生命周期、渲染；不持有对话状态\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eEngine\u003c/td\u003e\u003ctd\u003eLoop / Context\u003c/td\u003e\u003ctd\u003e编排、投影、压缩；不碰 wire format\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eAdapters\u003c/td\u003e\u003ctd\u003eProviders / Tools / Sandbox / Auth\u003c/td\u003e\u003ctd\u003e外部世界与凭证的适配；不依赖 UI\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eState\u003c/td\u003e\u003ctd\u003eSession\u003c/td\u003e\u003ctd\u003e追加、加载、容错；不解释业务\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eEngineering\u003c/td\u003e\u003ctd\u003eDashboard\u003c/td\u003e\u003ctd\u003e架构阅读面（默认 Architecture）；不参与运行时\u003c/td\u003e\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e依赖方向只能向下：Interface → Engine → Adapters / State。\u003ccode\u003eni-core\u003c/code\u003e 不依赖 \u003ccode\u003eni-cli\u003c/code\u003e，TUI 不 import loop 内部。\u003c/p\u003e\n\u003ch2\u003e工具面\u003c/h2\u003e\n\u003cp\u003e第一版只有六个：\u003ccode\u003eread\u003c/code\u003e、\u003ccode\u003ewrite\u003c/code\u003e、\u003ccode\u003eedit\u003c/code\u003e、\u003ccode\u003egrep\u003c/code\u003e、\u003ccode\u003eglob\u003c/code\u003e、\u003ccode\u003ebash\u003c/code\u003e。\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eread\u003c/code\u003e 带行号，单次上限约 2000 行 / 50KB，截断时给出续读方式。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eedit\u003c/code\u003e 用精确字符串替换，要求唯一匹配，返回小 diff；行号会漂移，不用行号。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ebash\u003c/code\u003e 只回尾部约 20KB，完整输出落临时文件；超时杀进程组，不留孤儿。\u003c/li\u003e\n\u003cli\u003e工具错误是 prompt 的一部分：写清楚\"为什么失败、下一步怎么做\"。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003ccode\u003ewrite\u003c/code\u003e / \u003ccode\u003eedit\u003c/code\u003e 前必须读过目标文件。这是策略层强制，不是提示词建议。\u003c/p\u003e\n\u003ch2\u003e上下文与压缩\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eproject(log, budget)\u003c/code\u003e 是全量日志到模型上下文的有损投影。\u003c/li\u003e\n\u003cli\u003esystem + tools + 历史前缀保持稳定，易变内容放末尾，以命中 provider 的 prompt cache。\u003c/li\u003e\n\u003cli\u003e到预算 75% 触发 compaction，保留最近 N 轮原文和原始请求，生成结构化 handoff：目标、已完成、改动文件、当前状态、下一步、约束。\u003c/li\u003e\n\u003cli\u003e压缩结果落成事件，不修改历史。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e安全\u003c/h2\u003e\n\u003cp\u003e三条正交的轴，不要揉成一个开关：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003esandbox\u003c/strong\u003e：read-only / workspace-write / full-access。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eapproval\u003c/strong\u003e：ask / on-failure / never。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003enetwork\u003c/strong\u003e：on / off。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e沙箱用平台原生能力（Linux landlock + seccomp，macOS seatbelt）。没有真沙箱的平台，明确降级为\"变更型 bash 强制审批\"，并告诉用户原因。\u003c/p\u003e\n\u003ch2\u003e明确不做\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e不做通用 agent framework，不为未知用例抽象。\u003c/li\u003e\n\u003cli\u003ev0 不做 MCP、插件系统、多 provider 全家桶、subagent、Web UI。\u003c/li\u003e\n\u003cli\u003e不做浏览器里可编辑的看板；状态变更走仓库。\u003c/li\u003e\n\u003cli\u003e不在 loop 里做 prompt 字符串拼接；prompt 是独立、可版本化的输入。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e开放问题\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ccode\u003eassistant_message\u003c/code\u003e 是否要保留 reasoning 原文，还是只保留摘要？不同 provider 的回传要求不同。\u003c/li\u003e\n\u003cli\u003ecompaction 的 handoff 由模型生成还是模板生成？前者灵活，后者稳定。\u003c/li\u003e\n\u003cli\u003e工具并行度：只读并发之外，是否允许不同文件的写并发？\u003c/li\u003e\n\u003cli\u003e事件 schema 的演进策略：加字段兼容，还是显式版本迁移？\u003c/li\u003e\n\u003c/ol\u003e\n","path":"docs/architecture.md","excerpt":"ni 的边界、数据流、事件生命周期与明确不做的事。"},{"id":"roadmap","title":"Roadmap 与学习路径","kind":"doc","status":"living","order":15,"summary":"从 M0 到可用 coding harness：组件地图、自研/用库边界，以及每个阶段应该真正学会的东西。","body_html":"\u003ch2\u003e目标\u003c/h2\u003e\n\u003cp\u003e不是“所有 agent 功能”，而是一个\u003cstrong\u003e可靠的单 agent coding harness\u003c/strong\u003e：\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e给一个真实 repo 和一个 issue，agent 能定位、修改、跑测试、给出 diff；失败能 resume；同一 fixture 可以离线回归。\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e平台层（MCP、插件、subagent、多 provider、长期记忆）不是“完整”的必要条件；先证明单 agent 闭环。\u003c/p\u003e\n\u003ch2\u003e组件地图\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eRuntime / loop\u003c/strong\u003e（M0-008）— 自研 Command/Event 与 turn 状态机；用 tokio。学会：画出命令/事件生命周期，说明取消发生在哪。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eProvider\u003c/strong\u003e（M0-005）— 自研流式归一化、SSE 映射、错误分类；用 reqwest。学会：解释重试边界和 token 账本。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eTools\u003c/strong\u003e（M0-006/007）— 自研注册表与六个工具；用 serde_json / ignore / globset。学会：证明工具输出不会撑爆上下文。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eContext\u003c/strong\u003e（M2-001/002）— 自研 projection、compaction、AGENTS.md 合并。学会：解释“日志全量、上下文有损”。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eState\u003c/strong\u003e（M0-002/009）— 自研 Event、JSONL、resume、fork；用 serde_json。学会：离线回放一次真实 turn。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eAuth\u003c/strong\u003e（M0-011）— 自研 env → keyring → 0600 文件的解析与回退；用 OS keyring。学会：解释密钥为什么不能进日志，以及 keyring 失败时如何安全降级。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSafety\u003c/strong\u003e（M1-002）— 自研策略与审批链；用 landlock/seccomp 或 bubblewrap。学会：演示一次拒绝写入/联网。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eClients\u003c/strong\u003e（M0-004 / M1-001 / M1.5）— 自研 CLI 命令和事件到视图的映射；用 clap / ratatui。学会：同一事件流渲染两种界面。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eObservability\u003c/strong\u003e（M2-002）— 自研 usage 事件、metrics JSONL。学会：定位一次慢 turn。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eEvaluation\u003c/strong\u003e（M0-009）— 自研 scripted provider、fixture、golden transcript。学会：同一输入两次回放行为一致。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e自研 / 用库的边界\u003c/h2\u003e\n\u003cp\u003e判断标准：\u003cstrong\u003e“这部分决定 agent 的行为质量吗？”\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e决定 → 自己写：loop、context、tool protocol、event log、approval、eval。\u003c/li\u003e\n\u003cli\u003e不决定 → 用库：HTTP、async runtime、CLI 解析、TUI 渲染、diff、glob、Markdown。\u003c/li\u003e\n\u003cli\u003e安全 → 策略自己写，OS 原语用库；不要手写 syscall。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e顺序\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003eM0   CLI 骨架 / 事件日志 / auth / dashboard / minimal exec\n     └─ M0-005 provider（scripted + OpenAI-compatible SSE）\n     └─ M0-006 文件工具\n     └─ M0-007 bash（超时、进程组、输出预算）\n     └─ M0-008 loop + ni exec（SessionRuntime 边界）\n     └─ M0-009 resume + fixture\nM1   TUI / approval / sandbox / diff\nM1.5 只读 Web Session Viewer（JSONL → turn/tool/diff）\nM2   compaction / AGENTS.md / cache 指标 / Runs 视图\nM3   replay / fork / subagent（视需要）\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e每个阶段都必须能离线测试，不能依赖真实 API 才能验证 loop。\u003c/p\u003e\n\u003ch2\u003e学习检查点\u003c/h2\u003e\n\u003cp\u003e完成一个阶段时，应该能回答：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eProvider\u003c/strong\u003e：SSE 的 delta 如何合并成一条 assistant message？什么错误可以在 turn 边界重试，什么不能？\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eTools\u003c/strong\u003e：工具输出如何截断？read-before-write 为什么必须是策略而不是提示词？两个写工具并发会发生什么？\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eLoop\u003c/strong\u003e：取消发生在 provider 流、工具执行、日志写入三个位置时，分别怎么处理？\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eEval\u003c/strong\u003e：如何在不烧 token 的情况下复现一个 turn？回放和真实调用差在哪？\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSandbox\u003c/strong\u003e：路径校验、shell 隔离、网络关闭分别能防住什么，防不住什么？\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eContext\u003c/strong\u003e：压缩后模型看到的历史和日志里的历史为什么可以不同？cache 前缀为什么不能随手改？\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eObservability\u003c/strong\u003e：一个 turn 变慢时，如何区分模型、工具和 harness 自身？\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eM0 完成定义\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eni exec \"\u0026lt;task\u0026gt;\"\u003c/code\u003e 能在真实 repo 里完成一个小修改并跑测试。\u003c/li\u003e\n\u003cli\u003esession 可 resume；坏尾行不丢历史。\u003c/li\u003e\n\u003cli\u003e工具有输出上限；bash 能超时杀进程组。\u003c/li\u003e\n\u003cli\u003e至少一个 scripted provider 的离线回归测试。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ecargo xtask dashboard --check\u003c/code\u003e 通过，架构图和 ADR 反映当前实现。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e明确后置\u003c/h2\u003e\n\u003cp\u003eMCP、插件系统、多 provider 全家桶、长期记忆、调度器、多人协作、Web 编辑架构图。等出现真实需求，再写 ADR。\u003c/p\u003e\n","path":"docs/roadmap.md","excerpt":"从 M0 到可用 coding harness：组件地图、自研/用库边界，以及每个阶段应该真正学会的东西。"},{"id":"adr-0001","title":"ADR-0001：Rust 作为核心语言","kind":"adr","status":"accepted","order":20,"summary":"性能优先不等于 loop 快几毫秒；Rust 换来的是启动、内存、分发和原生沙箱。","body_html":"\u003ch2\u003e状态\u003c/h2\u003e\n\u003cp\u003eAccepted · 2026-10-20\u003c/p\u003e\n\u003ch2\u003e背景\u003c/h2\u003e\n\u003cp\u003eni 是一个单二进制 CLI：长会话、流式子进程、沙箱、可能的多子代理。语言选型要在两端做取舍：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e运行时\u003c/strong\u003e：harness 自身耗时（SSE 解析、JSON、日志、调度）通常只占一个 turn 的 1–5ms，而模型 TTFT + 生成是 1–3s。换语言不会让 agent 明显变快。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e工程形态\u003c/strong\u003e：冷启动、常驻内存、单二进制分发、进程组/信号控制、原生沙箱，这些是 Rust 的真实优势。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e开发迭代\u003c/strong\u003e：Rust 的编译反馈和 async 设计摩擦，会让早期功能吞吐慢 1.5–2x；这是\"写功能慢\"，不是\"运行时慢\"。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e决策\u003c/h2\u003e\n\u003cp\u003e核心使用 Rust，workspace 拆分小 crate：\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003ecrates/\n  ni-core/       # 事件、会话、loop、context\n  ni-cli/        # 参数与生命周期\n  ni-provider/   # 后续：wire adapters\n  ni-tools/      # 后续：工具\n  ni-sandbox/    # 后续：策略与平台隔离\n  xtask/         # 仓库工具（看板构建）\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2\u003e后果\u003c/h2\u003e\n\u003ch3\u003e正向\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e单静态二进制，启动 2–10ms，无 runtime 依赖。\u003c/li\u003e\n\u003cli\u003e常驻内存低，多 session / 子代理时线性成本可控。\u003c/li\u003e\n\u003cli\u003e进程组、超时、信号、fd 管理语义明确，取消链路可靠。\u003c/li\u003e\n\u003cli\u003elandlock / seccomp / seatbelt 可直接调用，不需要 native addon 或外部包装进程。\u003c/li\u003e\n\u003cli\u003e事件、状态机、工具 schema 适合强类型，后期重构成本低。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e负向\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e编译反馈比 TS 慢一个数量级。\u003c/li\u003e\n\u003cli\u003easync 流式状态机在接口未定型时摩擦大。\u003c/li\u003e\n\u003cli\u003eOpenAI / Anthropic 的 Rust SDK 不如 TS/Python 成熟，SSE 和事件映射要自己写。\u003c/li\u003e\n\u003cli\u003eTUI 迭代比 Ink/React 慢。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e缓解\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eworkspace 拆小 crate，\u003ccode\u003eni-core\u003c/code\u003e 不依赖 CLI / TUI，增量编译范围小。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ebacon\u003c/code\u003e / \u003ccode\u003ecargo-watch\u003c/code\u003e + \u003ccode\u003ecargo check\u003c/code\u003e 作为内循环；链接器用 mold/lld。\u003c/li\u003e\n\u003cli\u003e控制 proc-macro 依赖，provider 边界允许 \u003ccode\u003eserde_json::Value\u003c/code\u003e，内部强类型。\u003c/li\u003e\n\u003cli\u003eheadless first，TUI last；loop / tools 用 scripted provider 离线测试。\u003c/li\u003e\n\u003cli\u003econtext 逻辑写成纯函数 + fixture，改 prompt 策略不需要重
