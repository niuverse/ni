ode\u003esession_start\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eniucode session show\u003c/code\u003e 打印事件时间线，\u003ccode\u003eniucode session list\u003c/code\u003e 列出文件。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003eniucode session new\u003c/code\u003e 输出可直接被脚本消费的路径。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003eniucode session show \u0026lt;path\u0026gt;\u003c/code\u003e 显示事件数与 warning。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n默认目录支持 \u003ccode\u003eNIUCODE_HOME\u003c/code\u003e / \u003ccode\u003eHOME\u003c/code\u003e 覆盖。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003eexec\u003c/code\u003e 子命令等 loop 落地后再加，避免先有一个假入口。\u003c/p\u003e\n","path":"docs/board/M0-004-cli.md"},{"id":"M0-005","title":"Provider trait 与 OpenAI-compatible SSE","status":"done","milestone":"M0","module":"providers","size":"L","priority":"P0","updated":"2026-10-20","completed":"2026-10-20","depends_on":["M0-002"],"docs":["provider","architecture"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e内部统一的 \u003ccode\u003eStreamEvent\u003c/code\u003e：text / reasoning / tool call / usage / done / error。\u003c/li\u003e\n\u003cli\u003e一个真实 provider 的 SSE 适配，优先 OpenAI-compatible。\u003c/li\u003e\n\u003cli\u003e错误分类：可重试、致命、上下文溢出。\u003c/li\u003e\n\u003cli\u003eusage 归一化，保留 cached 与 reasoning tokens。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n本地 SSE fixture 能解析出 text、reasoning、tool call、usage、done。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n429 / 5xx 分类为可重试，并读取 \u003ccode\u003eRetry-After\u003c/code\u003e；实际重试由 loop 在 turn 边界执行。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n上下文溢出返回独立错误类型，交给 compaction 处理。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nprovider 模块不依赖 tools 或 TUI。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nDeepSeek preset：\u003ccode\u003ethinking\u003c/code\u003e、\u003ccode\u003ereasoning_content\u003c/code\u003e、\u003ccode\u003edeepseek-flash\u003c/code\u003e / \u003ccode\u003edeepseek-v4-pro\u003c/code\u003e。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003e实现 \u003ccode\u003eniucode-provider\u003c/code\u003e：Provider trait、OpenAI-compatible SSE 客户端、DeepSeek preset、scripted provider，以及本地 TCP + SSE 测试（不访问网络）。录制的 DeepSeek SSE fixture 在 \u003ccode\u003ecrates/niucode-provider/tests/fixtures/deepseek-tool-call.sse\u003c/code\u003e。当前环境没有 API key，所以没有做真实 DeepSeek 调用；\u003ccode\u003eniucode provider test --preset deepseek\u003c/code\u003e 可在配置 key 后验证。\u003c/p\u003e\n","path":"docs/board/M0-005-provider.md"},{"id":"M0-006","title":"文件工具：read / write / edit / grep / glob","status":"done","milestone":"M0","module":"tools","size":"L","priority":"P0","updated":"2026-10-20","completed":"2026-10-20","depends_on":["M0-001"],"docs":["architecture","exec"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e五个文件工具 + 一个注册表；JSON Schema 描述输入。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eread\u003c/code\u003e 返回行号，单次上限 2000 行 / 50KB，截断时给出续读方式。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eedit\u003c/code\u003e 用精确字符串替换，要求唯一匹配，返回小 diff。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003egrep\u003c/code\u003e / \u003ccode\u003eglob\u003c/code\u003e 结果有上限，并报告总数。\u003c/li\u003e\n\u003cli\u003eread-before-write 策略：未读过的文件拒绝写。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n非唯一 \u003ccode\u003eold_string\u003c/code\u003e 被拒绝，并提示增加上下文。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n未读文件 \u003ccode\u003ewrite\u003c/code\u003e / \u003ccode\u003eedit\u003c/code\u003e 返回可操作的错误。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n超大文件读取被截断，模型能按 offset 继续。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003egrep\u003c/code\u003e / \u003ccode\u003eglob\u003c/code\u003e 有结果上限，尊重 \u003ccode\u003e.gitignore\u003c/code\u003e，跳过 \u003ccode\u003etarget\u003c/code\u003e / \u003ccode\u003e.git\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003eedit\u003c/code\u003e 返回 unified diff 预览。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003e五个文件工具已落地；\u003ccode\u003egrep\u003c/code\u003e/\u003ccode\u003eglob\u003c/code\u003e 用 \u003ccode\u003eignore\u003c/code\u003e + \u003ccode\u003eregex\u003c/code\u003e/\u003ccode\u003eglobset\u003c/code\u003e，不依赖外部 ripgrep。工具描述仍是 prompt 表面。\u003c/p\u003e\n","path":"docs/board/M0-006-tools.md"},{"id":"M0-007","title":"Bash 工具：超时、进程组与输出预算","status":"done","milestone":"M0","module":"tools","size":"M","priority":"P0","updated":"2026-10-20","completed":"2026-10-20","depends_on":["M0-006"],"docs":["exec"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e在工作目录执行命令，默认超时 120s。\u003c/li\u003e\n\u003cli\u003e启动时 \u003ccode\u003edetached\u003c/code\u003e，取消/超时对进程组发信号，不留孤儿。\u003c/li\u003e\n\u003cli\u003e只回尾部 20KB，完整输出写临时文件并把路径给模型。\u003c/li\u003e\n\u003cli\u003eapproval 推迟到 M1-002；M0 只保证进程组、超时和输出预算。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n超时后子进程及其派生的 \u003ccode\u003esleep\u003c/code\u003e 都被终止（独立进程组 + 组信号）。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n大输出不会撑爆上下文，模型能拿到临时输出路径（最多保留 8MB 捕获）。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nCtrl-C 能中断正在跑的命令并杀掉进程组。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n非零退出码、stderr 和超时是可区分的三种结果。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003ebash 是能力上限也是风险上限。M0 只做进程组/超时/输出预算；真正的 sandbox 和 approval 在 M1-002。\u003c/p\u003e\n","path":"docs/board/M0-007-bash.md"},{"id":"M0-008","title":"Turn loop 与 niucode exec","status":"done","milestone":"M0","module":"loop","size":"L","priority":"P0","updated":"2026-10-20","completed":"2026-10-20","depends_on":["M0-005","M0-006","M0-007"],"docs":["architecture","exec"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e一个 turn：project → stream → dispatch tools → append events。\u003c/li\u003e\n\u003cli\u003e当前是函数边界 \u003ccode\u003erun(provider, session, config, prompt, observer)\u003c/code\u003e；Command/Event 通道留给 TUI/Web 阶段（ADR-0004）。\u003c/li\u003e\n\u003cli\u003e循环直到无 tool call、达到 max steps、被取消或 fatal error。\u003c/li\u003e\n\u003cli\u003e只读工具可并发，写工具串行。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eniucode exec \"\u0026lt;prompt\u0026gt;\"\u003c/code\u003e headless 入口，输出最终文本和 usage。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n用 scripted provider 修掉 fixture 仓库里的一个失败测试（read → edit → bash → 汇总）。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n达到 max steps 时返回明确原因，不静默退出。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nCtrl-C 取消后 drop provider stream / 工具 future，进程组被清理。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n每个 turn 的 usage 落在 \u003ccode\u003eturn_end\u003c/code\u003e 事件里。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003eloop 不关心 provider wire format，也不实现工具逻辑。它只编排和记录。当前没有 Command/Event 队列；TUI/Web 接入时再包一层 SessionRuntime。\u003c/p\u003e\n","path":"docs/board/M0-008-loop.md"},{"id":"M0-009","title":"Resume 与录制回放测试","status":"done","milestone":"M0","module":"session","size":"M","priority":"P1","updated":"2026-10-20","completed":"2026-10-20","depends_on":["M0-008"],"docs":["adr-0002","exec"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eniucode exec --resume \u0026lt;session\u0026gt;\u003c/code\u003e 从日志重建上下文继续。\u003c/li\u003e\n\u003cli\u003escripted provider：按预设返回 tool call 序列，完全离线。\u003c/li\u003e\n\u003cli\u003e录制 / 回放 provider 响应的 fixture 目录。\u003c/li\u003e\n\u003cli\u003egolden transcript 测试 loop 行为。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003eniucode exec --resume \u0026lt;session\u0026gt;\u003c/code\u003e 从日志重建上下文继续；未指定 \u003ccode\u003e--cwd\u003c/code\u003e 时使用 session 的 cwd。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003e--record\u003c/code\u003e 把归一化 provider turn 写成 fixture；\u003ccode\u003e--replay\u003c/code\u003e 完全离线重放，不需要 key。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n回放同一 fixture 两次，事件序列一致。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\ngolden transcript 测试不访问网络、不烧 token。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n工具执行后 resume 不会重放已完成 turn。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003e实现 \u003ccode\u003eproject_history\u003c/code\u003e、\u003ccode\u003eSessionLog::open\u003c/code\u003e、\u003ccode\u003eRecordingProvider\u003c/code\u003e / \u003ccode\u003eReplayProvider\u003c/code\u003e 和 golden fixture。测试的价值不在覆盖率，而在让 context / loop 的修改可以离线验证。\u003c/p\u003e\n","path":"docs/board/M0-009-resume.md"},{"id":"M0-010","title":"Architecture-first dashboard 改造","status":"done","milestone":"M0","module":"dashboard","size":"M","priority":"P1","updated":"2026-10-20","completed":"2026-10-20","depends_on":["M0-003"],"docs":["adr-0003"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e默认视图改为 Architecture，导航改为 Architecture / Work / Docs / Decisions。\u003c/li\u003e\n\u003cli\u003e架构视图移除进度条、完成率和卡片计数；左栏改为按层分组的模块导航。\u003c/li\u003e\n\u003cli\u003eWork 保留卡片和里程碑筛选，但不再展示进度统计。\u003c/li\u003e\n\u003cli\u003eDecisions 只收 ADR 与 \u003ccode\u003ekind = \"decision\"\u003c/code\u003e 事件。\u003c/li\u003e\n\u003cli\u003e模块聚焦：选中后高亮相关边、弱化无关模块；不做 zoom/pan。\u003c/li\u003e\n\u003cli\u003e视觉继续走 technical field guide，不引入前端框架。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n打开 \u003ccode\u003edocs/index.html\u003c/code\u003e 第一屏是架构图。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nArchitecture 页没有进度条、完成率、Kanban 统计。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nWork 仍可筛选里程碑、打开卡片详情。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nDecisions 只显示决策事件和 ADR。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n模块聚焦、源码/ADR 联读、明暗主题正常。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n单文件离线，\u003ccode\u003ecargo xtask dashboard --check\u003c/code\u003e 通过。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003e进度信息不是被删除，而是从第一屏移走：卡片仍在 \u003ccode\u003edocs/board/\u003c/code\u003e，Work 仍可查。看板重新成为架构阅读面。\u003c/p\u003e\n","path":"docs/board/M0-010-architecture-first.md"},{"id":"M0-011","title":"niucode auth：keyring 与安全凭证解析","status":"done","milestone":"M0","module":"auth","size":"M","priority":"P1","updated":"2026-10-20","completed":"2026-10-20","depends_on":["M0-004"],"docs":["auth","adr-0005"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e新增 \u003ccode\u003eniucode-auth\u003c/code\u003e：凭证解析顺序 env → OS keyring → 0600 文件。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eniucode auth set \u0026lt;provider\u0026gt;\u003c/code\u003e 隐藏输入，或 \u003ccode\u003e--stdin\u003c/code\u003e 供脚本使用。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eniucode auth status\u003c/code\u003e 只显示来源，不打印密钥。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eniucode auth unset \u0026lt;provider\u0026gt;\u003c/code\u003e 清理 keyring 和文件。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eniucode provider test\u003c/code\u003e 通过 \u003ccode\u003eniucode-auth\u003c/code\u003e 取 key，不再只读环境变量。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003eDEEPSEEK_API_KEY\u003c/code\u003e 优先于 keyring 和文件。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nkeyring 可用时写入 keyring；不可用时回退 0600 文件。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n文件权限为 0600，状态对 insecure 权限给出警告。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n损坏的凭证文件返回无内容泄露的错误。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003estatus\u003c/code\u003e / \u003ccode\u003eprovider list\u003c/code\u003e 不打印密钥。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003eLinux 的 keyring 走 Secret Service（需要 DBus）；无桌面/容器环境可设置 \u003ccode\u003eNIUCODE_AUTH_DISABLE_KEYRING=1\u003c/code\u003e 强制文件。这个卡片只解决 API key 的登录体验；ChatGPT 账号 OAuth（SIWC）和 DeepSeek 网页账号不在范围内。\u003c/p\u003e\n","path":"docs/board/M0-011-auth.md"},{"id":"M0-012","title":"最小 niucode exec 闭环","status":"done","milestone":"M0","module":"loop","size":"L","priority":"P0","updated":"2026-10-20","completed":"2026-10-20","depends_on":["M0-005"],"docs":["exec","architecture"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e新增 \u003ccode\u003eniucode-tools\u003c/code\u003e：\u003ccode\u003eread\u003c/code\u003e / \u003ccode\u003ewrite\u003c/code\u003e / \u003ccode\u003eedit\u003c/code\u003e / \u003ccode\u003ebash\u003c/code\u003e，路径限制、read-before-write、输出截断。\u003c/li\u003e\n\u003cli\u003e新增 \u003ccode\u003eniucode-agent\u003c/code\u003e：turn loop、流式文本、tool call 聚合、工具派发、事件落盘、max steps。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eniucode exec \"\u0026lt;task\u0026gt;\"\u003c/code\u003e：通过 \u003ccode\u003eniucode-auth\u003c/code\u003e 取 key，创建 session，流式输出。\u003c/li\u003e\n\u003cli\u003eSession 事件：\u003ccode\u003esession_start → user_message → assistant_message → turn_end → tool_result* → … → session_end\u003c/code\u003e。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n真实 DeepSeek \u003ccode\u003edeepseek-flash\u003c/code\u003e 文本响应成功。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n真实 DeepSeek tool call（read）成功，第二轮返回内容。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n本地 mock SSE 覆盖 text 与 tool 两条路径，不消耗 token。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n脚本化 provider 测试覆盖无工具完成、工具后继续、max steps。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n文件工具拒绝工作区外路径；已有文件必须先 read。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nusage / cached tokens 落在 \u003ccode\u003eturn_end\u003c/code\u003e。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003e后续 M0-006/007/008 已补齐 grep/glob、进程组超时和取消。这是最小闭环，不是安全闭环：\u003ccode\u003ebash\u003c/code\u003e 可执行任意命令，没有 approval/sandbox；\u003ccode\u003egrep\u003c/code\u003e/\u003ccode\u003eglob\u003c/code\u003e、进程组 kill、resume、compaction 仍未完成。真实 DeepSeek 测试在临时工作区执行，session 已清理。\u003c/p\u003e\n","path":"docs/board/M0-012-minimal-exec.md"},{"id":"M1-001","title":"流式 TUI 与取消","status":"done","milestone":"M1","module":"tui","size":"L","priority":"P1","updated":"2026-10-20","completed":"2026-10-20","depends_on":["M0-008"],"docs":["tui","exec"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e流式渲染文本、reasoning 折叠、工具调用状态。\u003c/li\u003e\n\u003cli\u003e审批提示：单键 allow / deny / allow-for-session。\u003c/li\u003e\n\u003cli\u003ediff 预览，先看再批。\u003c/li\u003e\n\u003cli\u003eCtrl-C 取消当前 turn，二次强制退出。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n首 token 到达即渲染，不等完整响应。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n审批单键 a/d/s；非 TTY 退化为逐行输入，管道可测。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nCtrl-C 取消后进程组被清理，session 留下 \u003ccode\u003esession_end\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n窄终端（80 列）线性输出可读。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nreasoning 折叠为 \u003ccode\u003ethinking…\u003c/code\u003e，工具状态与 usage 可见。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n复用 session/history；每 turn 从日志重新投影。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003e先做线性 TUI：不 import loop 内部，只消费 AgentEvent；全屏布局、滚动区和完整 diff 留给 M1-003 之后。实现位于 \u003ccode\u003ecrates/niucode-cli/src/tui.rs\u003c/code\u003e。\u003c/p\u003e\n","path":"docs/board/M1-001-tui.md"},{"id":"M1-002","title":"Sandbox 三轴与原生隔离","status":"done","milestone":"M1","module":"sandbox","size":"L","priority":"P1","updated":"2026-10-20","completed":"2026-10-20","depends_on":["M0-007"],"docs":["adr-0006","exec"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003esandbox\u003c/code\u003e：read-only / workspace-write / full-access。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eapproval\u003c/code\u003e：ask / on-failure / never。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003enetwork\u003c/code\u003e：on / off。\u003c/li\u003e\n\u003cli\u003eLinux 第一后端用 bwrap namespace；landlock/seccomp 与 macOS seatbelt 后续补。\u003c/li\u003e\n\u003cli\u003e路径策略与 shell 隔离分开实现，不假装进程内检查是安全边界。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nworkspace-write 下无法写工作区外路径（bwrap 只读根 + cwd bind）。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n网络关闭时子进程连接被拒绝（network namespace）。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n逃逸尝试进入 tool_result / policy / approval 事件，不静默失败。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n无 bwrap 时 \u003ccode\u003enever\u003c/code\u003e 启动失败，\u003ccode\u003eon-failure\u003c/code\u003e/\u003ccode\u003eask\u003c/code\u003e 降级到逐工具审批并提示网络策略未执行。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003eread-only\u003c/code\u003e 同时拒绝文件工具 write/edit 和 bash 写入。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003efull-access + network=on\u003c/code\u003e 是显式 opt-out，默认不可达。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003e安全模型一句话：默认只能写 cwd、不能联网；要问人时逐工具问；full-access 必须显式选择。实现决策见 ADR-0006。\u003c/p\u003e\n","path":"docs/board/M1-002-sandbox.md"},{"id":"M1-003","title":"Diff 预览与输出折叠","status":"done","milestone":"M1","module":"tui","size":"M","priority":"P2","updated":"2026-10-20","completed":"2026-10-20","depends_on":["M1-001"],"docs":["adr-0007","tui"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e统一 diff 渲染：文件头、hunk、增删行、上下文折叠。\u003c/li\u003e\n\u003cli\u003e工具输出超过阈值时折叠，只显示摘要和\"展开\"提示。\u003c/li\u003e\n\u003cli\u003e审批前展示本次写入的完整 diff。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n大 diff 不刷屏，能按文件跳转。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n行号与新增/删除标记对齐。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n终端宽度变化后重排不破版。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003e工具层（\u003ccode\u003eniucode-tools/src/preview.rs\u003c/code\u003e）用真实文件内容生成结构化 \u003ccode\u003eChangePreview\u003c/code\u003e；loop 只转发，不再拼接预览字符串。\u003c/p\u003e\n\u003cp\u003e客户端分层：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eniucode-cli/src/diff.rs\u003c/code\u003e 负责宽度感知布局：文件头统计、\u003ccode\u003e@@\u003c/code\u003e hunk、old/new 双行号、\u003ccode\u003e+/-\u003c/code\u003e 标记、上下文半径 3、tab 展开、CJK 宽度和终端转义清洗。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eniucode-cli/src/review.rs\u003c/code\u003e 在 \u003ccode\u003e--approval ask\u003c/code\u003e 时提供 alternate-screen pager：\u003ccode\u003ej/k\u003c/code\u003e 滚动、PageUp/PageDown、\u003ccode\u003eg/G\u003c/code\u003e、\u003ccode\u003en/p\u003c/code\u003e 按文件跳转、resize 重排，\u003ccode\u003ea/d/s\u003c/code\u003e 决策。窄于 40 列或低于 6 行退回纯文本。\u003c/li\u003e\n\u003cli\u003e当前 \u003ccode\u003ewrite\u003c/code\u003e / \u003ccode\u003eedit\u003c/code\u003e 每次只改一个文件；pager 的多文件跳转已由布局和导航测试覆盖，等 patch 类工具接入后直接复用。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eniucode-cli/src/tui.rs\u003c/code\u003e 对超过 12 行或 2 KB 的工具输出折叠为摘要 + \u003ccode\u003e:last to expand\u003c/code\u003e；\u003ccode\u003e:last\u003c/code\u003e 重印最近一次完整输出。session 日志仍保留完整 output。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e离线覆盖：preview 结构、行号对齐、宽度边界、CJK、ANSI 清洗、pager 文件跳转、输出折叠。另用 PTY 跑过 allow / deny / resize / \u003ccode\u003e:last\u003c/code\u003e 四条真实交互路径。\u003c/p\u003e\n\u003cp\u003e决策见 ADR-0007。预览与执行存在 TOCTOU：预览只代表审批时刻，执行会重新读取并校验。\u003c/p\u003e\n","path":"docs/board/M1-003-diff.md"},{"id":"M2-001","title":"Compaction 与可执行 handoff","status":"done","milestone":"M2","module":"context","size":"L","priority":"P1","updated":"2026-10-20","completed":"2026-10-20","depends_on":["M0-009"],"docs":["adr-0002","adr-0008","exec"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e上下文到 75% 预算时触发压缩。\u003c/li\u003e\n\u003cli\u003e保留最近 N 轮原文和原始用户请求。\u003c/li\u003e\n\u003cli\u003e生成结构化 handoff：目标、已完成、改动文件、当前状态、下一步、约束。\u003c/li\u003e\n\u003cli\u003e压缩结果落成 \u003ccode\u003ecompaction\u003c/code\u003e 事件，resume 时按 \u003ccode\u003eupto\u003c/code\u003e 重建投影。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n压缩后继续任务，不重复已完成步骤。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n压缩事件可回放，模型上下文与压缩时一致。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n压缩失败时保留原上下文并提示，不丢历史。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n长会话 token 成本可见地下降。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003e实现位于 \u003ccode\u003ecrates/niucode-agent/src/context.rs\u003c/code\u003e（Context 属于 Engine，不放进 core，避免 core 依赖 provider 的 \u003ccode\u003eChatMessage\u003c/code\u003e）。\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eestimate_context\u003c/code\u003e：ASCII 约 4 字符/token，非 ASCII 1 字符/token，附带 tool schema 与消息固定开销。默认预算 64k，75% 触发；\u003ccode\u003eexec\u003c/code\u003e / \u003ccode\u003etui\u003c/code\u003e 暴露 \u003ccode\u003e--context-budget\u003c/code\u003e 和 \u003ccode\u003e--keep-recent-turns\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ebuild_handoff\u003c/code\u003e：从日志生成确定性交接单，包含 Goal、Previous request、Work completed、Changed files、Last assistant state、Recent failures、Constraints、Next step。没有额外模型调用。\u003c/li\u003e\n\u003cli\u003ecutoff 选择：多轮保留最近 N 个 user turn 原文；单个长 turn 回退到该 turn 内安全的 assistant 边界，避免切开 tool call 和 tool result。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ecompaction.upto\u003c/code\u003e 定义为绝对事件下标，摘要替换 \u003ccode\u003eevents[..upto]\u003c/code\u003e。\u003ccode\u003eproject_history\u003c/code\u003e 在 cutoff 处插入 system handoff，只使用最后一个 compaction，忽略旧的和非法 cutoff。\u003c/li\u003e\n\u003cli\u003e压缩前先构造候选投影并估算 after；只有 after \u0026lt; before 才追加 \u003ccode\u003ecompaction\u003c/code\u003e 事件，事件记录 \u003ccode\u003ebefore_tokens\u003c/code\u003e / \u003ccode\u003eafter_tokens\u003c/code\u003e。失败（无安全 cutoff、不收缩、写入失败）保留原上下文，通过 \u003ccode\u003eAgentEvent::Warning\u003c/code\u003e 提示，历史不受影响。\u003c/li\u003e\n\u003cli\u003e成功压缩时 loop 用同一份 \u003ccode\u003eproject_history\u003c/code\u003e 重建 \u003ccode\u003emessages\u003c/code\u003e，TUI / exec 显示 \u003ccode\u003ecompacted: N events · ~before → ~after tokens\u003c/code\u003e。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e测试覆盖：token 估算、75% 阈值、cutoff 选择、handoff 内容、最后一个 compaction 生效、非法/空摘要 compaction 忽略、单 turn 回退、压缩失败保留上下文、压缩事件的 resume 投影与 provider 请求一致。另用 PTY 跑过 TUI 两轮 compaction，并用 \u003ccode\u003eexec --resume\u003c/code\u003e 验证 headless 压缩通知、事件字段与 resumed 投影；\u003ccode\u003esession show\u003c/code\u003e 会打印 compaction 的 \u003ccode\u003eupto\u003c/code\u003e 和 token 估算。\u003c/p\u003e\n\u003cp\u003e决策见 ADR-0008。当前 handoff 是确定性模板，token 估算不是精确 tokenizer；两处都是明确的后续替换点。\u003c/p\u003e\n","path":"docs/board/M2-001-compaction.md"},{"id":"M2-002","title":"AGENTS.md 分层发现与缓存指标","status":"done","milestone":"M2","module":"context","size":"M","priority":"P2","updated":"2026-10-20","completed":"2026-10-20","depends_on":["M2-001"],"docs":["adr-0009","exec","tui"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e从 cwd 向上发现 \u003ccode\u003eAGENTS.md\u003c/code\u003e，按距离合并，近者优先。\u003c/li\u003e\n\u003cli\u003esystem prompt 只保留稳定前缀；易变信息放末尾。\u003c/li\u003e\n\u003cli\u003e记录 cached / input tokens，按 turn 汇总命中率。\u003c/li\u003e\n\u003cli\u003e缓存指标留在 session 事件；Runs 视图留给运行时 viewer（ADR-0009）。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n子目录规范能覆盖根目录规则。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n修改 \u003ccode\u003eAGENTS.md\u003c/code\u003e 后下一 turn 生效，无需重启。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n缓存命中率可在 session 事件里看到。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n前缀变化导致缓存失效时能定位原因。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003e实现位于 \u003ccode\u003ecrates/niucode-agent/src/instructions.rs\u003c/code\u003e。\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e每次 \u003ccode\u003erun_with_history\u003c/code\u003e 从 cwd 向上发现 \u003ccode\u003eAGENTS.md\u003c/code\u003e：cwd、父目录……根目录，近者先列并明确说明近者优先。\u003c/li\u003e\n\u003cli\u003e单文件上限 32 KiB，总上限 64 KiB；截断和读取失败通过 \u003ccode\u003eAgentEvent::Warning\u003c/code\u003e 提示。\u003c/li\u003e\n\u003cli\u003e指令追加在稳定的 base system prompt 之后；一次 run 内不重载，修改文件后下一次用户 turn 生效。\u003c/li\u003e\n\u003cli\u003e加载到文件时追加 \u003ccode\u003einstructions\u003c/code\u003e 事件，记录 sources 和合并文本的 FNV-1a digest。缓存命中率下降时可以对照 digest 判断是否是指令变化导致前缀失效。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eUsage::cache_hit_percent()\u003c/code\u003e 从 \u003ccode\u003eturn_end.usage\u003c/code\u003e 的 cached / input 派生；TUI 每个 turn 和 \u003ccode\u003edone\u003c/code\u003e 行显示 \u003ccode\u003ecache N%\u003c/code\u003e，exec 同样显示，\u003ccode\u003esession show\u003c/code\u003e 显示每 turn 的 \u003ccode\u003ein/out/cached/cache\u003c/code\u003e 以及 instructions 文件数和 digest。\u003c/li\u003e\n\u003cli\u003e没有写独立 metrics JSONL。离线项目看板保持 Architecture / Work / Docs / Decisions 四视图，不加入运行时 Runs；见 ADR-0009。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e测试覆盖：近者优先顺序、digest 变化、空文件忽略、修改 \u003ccode\u003eAGENTS.md\u003c/code\u003e 后第二个 turn 的 system prompt 更新且旧文本消失、instructions 事件落盘、缓存命中率计算。TUI / exec 的缓存显示也在 PTY 回归里检查。\u003c/p\u003e\n\u003cp\u003e决策见 ADR-0009。运行时 Runs / metrics 视图仍是后续工作，不在离线看板里硬塞。\u003c/p\u003e\n","path":"docs/board/M2-002-agents-cache.md"},{"id":"M3-001","title":"Replay 与 fork","status":"done","milestone":"M3","module":"session","size":"M","priority":"P2","updated":"2026-10-20","completed":"2026-10-20","depends_on":["M2-001"],"docs":["adr-0002","adr-0010","exec"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eniucode replay \u0026lt;session\u0026gt;\u003c/code\u003e：按事件重建状态并校验投影。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eniucode fork \u0026lt;session\u0026gt; --at \u0026lt;event-id\u0026gt;\u003c/code\u003e：复制前缀，生成新 session。\u003c/li\u003e\n\u003cli\u003e事件 id 稳定，fork 后历史可追溯。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nreplay 不调用模型，输出与原始 turn 的投影一致。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nfork 后原 session 不被修改。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n坏尾行 fork 时被截断并提示。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n事件 id 冲突检测。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003e事件 ID 定义为\u003cstrong\u003e解码事件的 1-based 序号\u003c/strong\u003e，显示为 \u003ccode\u003ee000012\u003c/code\u003e，解析接受 \u003ccode\u003ee12\u003c/code\u003e / \u003ccode\u003eE12\u003c/code\u003e / \u003ccode\u003e12\u003c/code\u003e。ID 不写进事件内容；append-only 保证序号稳定，\u003ccode\u003eload\u003c/code\u003e 跳过坏行，坏行不制造 ID。\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eniucode replay \u0026lt;session\u0026gt;\u003c/code\u003e 对每个 \u003ccode\u003euser_message\u003c/code\u003e 投影到“下一个 assistant 消息之前”，包含请求前追加的 compaction / instructions；输出 turn、消息数、估算 token 和投影 digest。没有构造 provider。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eniucode fork \u0026lt;session\u0026gt; --at \u0026lt;id\u0026gt;\u003c/code\u003e 校验 ID、复制 \u003ccode\u003eevents[0..=index]\u003c/code\u003e、在末尾追加 \u003ccode\u003eFork { parent, parent_event, ts }\u003c/code\u003e。不插入前缀事件，因此 \u003ccode\u003ecompaction.upto\u003c/code\u003e 保持有效；复制的 \u003ccode\u003esession_start\u003c/code\u003e 保留父 id，新身份由文件名和 fork 事件表达。\u003c/li\u003e\n\u003cli\u003e目标文件用 \u003ccode\u003eSessionLog::create\u003c/code\u003e 的 \u003ccode\u003ecreate_new\u003c/code\u003e 创建，不覆盖已有文件；源文件只读。fork 默认写到源 session 同目录，可用 \u003ccode\u003e--session-dir\u003c/code\u003e 覆盖。\u003c/li\u003e\n\u003cli\u003e坏尾行由 \u003ccode\u003eload\u003c/code\u003e 报告 warning；fork 只复制有效前缀，因此坏尾行被截断并提示。\u003c/li\u003e\n\u003cli\u003eID 唯一性由序号构造保证；命令检测非法/越界 ID 和目标文件创建冲突。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e实现位于 \u003ccode\u003ecrates/niucode-cli/src/session_ops.rs\u003c/code\u003e。测试覆盖：replay 在 user 后追加 compaction 的投影、fork 前缀与溯源事件、原文件字节不变、坏行跳过并 warning、compaction cutoff 在 fork 后仍有效、非法/越界 ID 拒绝。CLI 上跑过真实 session 的 replay 与 fork。\u003c/p\u003e\n\u003cp\u003e决策见 ADR-0010。当前 ID 不是内容哈希，也不是全局唯一；跨 session 合并时需要 \u003ccode\u003esession_id:event_id\u003c/code\u003e 命名空间。\u003c/p\u003e\n","path":"docs/board/M3-001-replay-fork.md"},{"id":"M3-002","title":"Subagent 与并行只读探索","status":"done","milestone":"M3","module":"loop","size":"L","priority":"P2","updated":"2026-10-20","completed":"2026-10-20","depends_on":["M3-001","M1-002"],"docs":["adr-0011","exec"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e子 session 有独立日志，父 session 记录 spawn / result 事件。\u003c/li\u003e\n\u003cli\u003e只读探索可并行；写操作仍由主 session 串行。\u003c/li\u003e\n\u003cli\u003e子代理有独立步数、token 和超时预算。\u003c/li\u003e\n\u003cli\u003e结果返回摘要 + 完整日志路径，不把整个子上下文塞回父上下文。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n两个子代理并行跑互不污染事件日志。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n子代理超时/失败不影响主 session 继续。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n父上下文只增加一条结果摘要。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n能追溯每个结论来自哪个子 session。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cp\u003e实现位于 \u003ccode\u003ecrates/niucode-agent/src/subagent.rs\u003c/code\u003e，工具 schema 在 \u003ccode\u003eniucode-tools\u003c/code\u003e，loop 在工具派发前拦截 \u003ccode\u003esubagent\u003c/code\u003e。\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003esubagent\u003c/code\u003e 接受 1–4 个任务；每个任务可指定 \u003ccode\u003eprompt\u003c/code\u003e、\u003ccode\u003emax_steps\u003c/code\u003e（默认 6，上限 12）、\u003ccode\u003etimeout_secs\u003c/code\u003e（默认 120，上限 600）。\u003c/li\u003e\n\u003cli\u003e子 agent 白名单只有 \u003ccode\u003eread\u003c/code\u003e / \u003ccode\u003egrep\u003c/code\u003e / \u003ccode\u003eglob\u003c/code\u003e；sandbox 为 read-only + network off，没有 write/edit/bash，也没有 \u003ccode\u003esubagent\u003c/code\u003e，不能递归。\u003c/li\u003e\n\u003cli\u003e每个任务一个独立 \u003ccode\u003eSessionLog\u003c/code\u003e，放在父 session 旁的 \u003ccode\u003e\u0026lt;parent-stem\u0026gt;.subagents/\u003c/code\u003e；子 \u003ccode\u003esession_start.id\u003c/code\u003e 等于 spawn id。\u003c/li\u003e\n\u003cli\u003e父 session 追加 \u003ccode\u003esubagent_spawn\u003c/code\u003e / \u003ccode\u003esubagent_result\u003c/code\u003e 事件，包含 id、call_id、任务、子日志路径、步数/超时/context budget、结果、turns 和 usage。\u003c/li\u003e\n\u003cli\u003e任务用 \u003ccode\u003efutures_util::future::join_all\u003c/code\u003e 并发跑；父 session 只在 spawn 前和 collect 后写入，没有跨 future 的 \u003ccode\u003e\u0026amp;mut SessionLog\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e父模型只收到一条 tool_result：每个任务的摘要 + 子日志路径；完整 transcript 留在子日志里。\u003c/li\u003e\n\u003cli\u003e子代理上下文预算为 \u003ccode\u003emin(parent_budget, 16k)\u003c/code\u003e；超时/失败会补 \u003ccode\u003esession_end\u003c/code\u003e 并返回 \u003ccode\u003eok=false\u003c/code\u003e，父 agent 继续。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e测试覆盖：并行 barrier（顺序执行会超时）、两个子日志互不污染、父请求只有一条 tool_result、子请求只看到三个只读工具、超时隔离、provider 错误隔离、父 session 可继续。决策见 ADR-0011。\u003c/p\u003e\n\u003cp\u003eM3 里程碑已随 replay/fork、subagent 与 \u003ccode\u003eexec --json\u003c/code\u003e 全部收口。\u003c/p\u003e\n","path":"docs/board/M3-002-subagents.md"},{"id":"M4-001","title":"CommandRegistry、TUI 自动菜单、/plan 与 /goal","status":"done","milestone":"M4","module":"tui","size":"L","priority":"P1","updated":"2026-10-20","completed":"2026-10-20","depends_on":["M3-002"],"docs":["adr-0014","tui"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e内置 slash 命令收敛到 CommandRegistry，命令元数据同时驱动菜单、帮助和解析。\u003c/li\u003e\n\u003cli\u003eTUI 输入层替换 rustyline：输入 \u003ccode\u003e/i\u003c/code\u003e 时在下方自动展示 \u003ccode\u003e/init\u003c/code\u003e 候选，支持 Tab/Enter 接受、↑↓ 选择。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e/plan\u003c/code\u003e 进入只读 plan mode；生成计划；\u003ccode\u003e/plan off\u003c/code\u003e / \u003ccode\u003e/plan approve\u003c/code\u003e 退出并恢复原 profile。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e/goal \u0026lt;condition\u0026gt;\u003c/code\u003e 设置会话目标并启动 goal run；\u003ccode\u003e/goal\u003c/code\u003e 查看；\u003ccode\u003e/goal stop\u003c/code\u003e 停止；\u003ccode\u003e/goal clear\u003c/code\u003e 清除；持久化到事件日志并随 resume 恢复。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e/goal run\u003c/code\u003e evaluator loop 不在本卡范围。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n输入 \u003ccode\u003e/i\u003c/code\u003e 自动出现 \u003ccode\u003e/init\u003c/code\u003e 候选；Tab/Enter 可接受，不误执行。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nCommandRegistry 驱动 \u003ccode\u003e/help\u003c/code\u003e 与补全候选，不再有第二份命令表。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003e/plan\u003c/code\u003e 只读；模型写入工具被 allowlist 挡住；退出恢复原 profile。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003e/goal\u003c/code\u003e 设置后进入 system prompt；压缩/resume 后仍存在。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n非 TTY 退化为逐行输入；PTY 测试覆盖自动菜单、plan、goal。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ecrates/niucode-cli/src/slash.rs\u003c/code\u003e：\u003ccode\u003eCommandRegistry\u003c/code\u003e 成为命令元数据来源；\u003ccode\u003e/help\u003c/code\u003e 和菜单共用，不再有第二份命令表。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ecrates/niucode-cli/src/editor.rs\u003c/code\u003e：替换 rustyline 的小型行编辑器。支持自动 slash 菜单、↑↓ 选择、Tab/Enter 接受、历史、光标/Home/End、Ctrl-A/E/U/K/W、Ctrl-C 清空、Ctrl-D 退出、Ctrl-L 清屏、bracketed paste。非 TTY 仍走逐行 fallback。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e/plan\u003c/code\u003e：\u003ccode\u003ePlanMode { active }\u003c/code\u003e 事件；plan 时 \u003ccode\u003eallowed_tools = read/grep/glob\u003c/code\u003e，system prompt 注入只读计划指令；\u003ccode\u003e/plan off\u003c/code\u003e / \u003ccode\u003e/plan approve\u003c/code\u003e 恢复；\u003ccode\u003e--plan\u003c/code\u003e 可在启动时直接进入。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e/goal\u003c/code\u003e：\u003ccode\u003eGoalSet\u003c/code\u003e / \u003ccode\u003eGoalCleared\u003c/code\u003e 事件；目标注入 system prompt；\u003ccode\u003eSessionUiState\u003c/code\u003e 从事件恢复，resume 保留；设置后立即启动 goal run。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e/status\u003c/code\u003e 显示 plan 与 goal；\u003ccode\u003e/init\u003c/code\u003e 在 plan mode 下拒绝。\u003c/li\u003e\n\u003cli\u003e测试：CommandRegistry/parse 单测、editor 菜单单测、SessionUiState 单测、agent plan/goal 集成测试（工具收窄、goal 注入、write 被 allowlist 拒绝）。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003erustyline\u003c/code\u003e 依赖已移除；TUI 不再有误导性的“假完成”hint。\u003c/li\u003e\n\u003c/ul\u003e\n","path":"docs/board/M4-001-command-registry-plan-goal.md"},{"id":"M4-002","title":"ExtensionHost v1 与 external tools","status":"done","milestone":"M4","module":"extensions","size":"L","priority":"P1","updated":"2026-10-20","completed":"2026-10-20","depends_on":["M4-001"],"docs":["adr-0013","exec"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003esession 级 ExtensionHost：\u003ccode\u003e\u0026lt;workspace\u0026gt;/.niucode/extensions/*.toml\u003c/code\u003e 发现 manifest。\u003c/li\u003e\n\u003cli\u003e一插件一 sidecar 进程；\u003ccode\u003einitialize\u003c/code\u003e / \u003ccode\u003etools/call\u003c/code\u003e / \u003ccode\u003eshutdown\u003c/code\u003e 的 line-delimited JSON-RPC。\u003c/li\u003e\n\u003cli\u003esidecar 环境变量清空（只保留解释器启动所需），不继承 API key。\u003c/li\u003e\n\u003cli\u003e每插件调用串行；超时/崩溃返回 tool error，不 panic 父 session。\u003c/li\u003e\n\u003cli\u003e父 session 追加 \u003ccode\u003eextension_mount\u003c/code\u003e / \u003ccode\u003eextension_unmount\u003c/code\u003e / \u003ccode\u003eextension_error\u003c/code\u003e。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n一个 Python sidecar 注册只读工具并可从主 session 调用。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n插件超时/错误返回 tool error，不影响父 session 继续。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n父 session 记录 mount/unmount provenance；工具结果走正常事件日志。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nsidecar 不继承凭证类环境变量。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e新 crate \u003ccode\u003eniucode-extension\u003c/code\u003e：manifest 解析、spawn、JSON-RPC 请求/响应、工具注册、超时、shutdown。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eniucode-agent\u003c/code\u003e：\u003ccode\u003eAgentConfig.extension_host\u003c/code\u003e 合并 specs；dispatch 在 built-ins/subagent 之后调用 host。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eniucode exec\u003c/code\u003e / \u003ccode\u003eniucode tui\u003c/code\u003e：启动时挂载，结束时 unmount；事件写入父 session。\u003c/li\u003e\n\u003cli\u003e测试：Python sidecar 注册/调用、built-in 重名拒绝、凭证 env 不泄漏、timeout 隔离、agent loop 调用 external tool、exec 端到端。\u003c/li\u003e\n\u003cli\u003ev1 是\u003cstrong\u003e可信本地 sidecar\u003c/strong\u003e：没有 worker pool、没有 bwrap 网络/能力隔离、没有 subagent 共享 host；这些统一进 M4-007。\u003c/li\u003e\n\u003c/ul\u003e\n","path":"docs/board/M4-002-extension-host.md"},{"id":"M4-003","title":"Subagent Explore/Worker capability profiles","status":"done","milestone":"M4","module":"loop","size":"M","priority":"P2","updated":"2026-10-20","completed":"2026-10-20","depends_on":["M4-002"],"docs":["adr-0014","adr-0011","exec"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eExplore：read-only + read/grep/glob + 只读 external tools。\u003c/li\u003e\n\u003cli\u003eWorker：workspace + read/write/edit/grep/glob/bash + 只读 external tools。\u003c/li\u003e\n\u003cli\u003eW1：父/子共享一个 write lock；write/edit 支持 \u003ccode\u003ewrite_scope\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003esubagent 不默认 full-access；mutating external tools 不进子 agent。\u003c/li\u003e\n\u003cli\u003etool schema 来自 registry view，不复制 host 进程。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nExplore/Worker 的 tool view 不同且可审计（spawn 事件记录 profile）。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nWorker 写操作共享全局写锁；write/edit path scope 生效。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n多个 subagent 共享 session extension host，只读外部工具可用。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nExplore 不能声明 \u003ccode\u003ewrite_scope\u003c/code\u003e，也不能看到 write/bash。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003esubagent\u003c/code\u003e schema 增加 \u003ccode\u003eprofile: explore|worker\u003c/code\u003e（默认 explore）和 Worker 的 \u003ccode\u003ewrite_scope\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eSubagentSpawn\u003c/code\u003e 增加 \u003ccode\u003eprofile\u003c/code\u003e（serde 默认，兼容旧日志）。\u003c/li\u003e\n\u003cli\u003eExplore：sandbox read-only/network off；allowlist \u003ccode\u003eread/grep/glob\u003c/code\u003e + \u003ccode\u003ehost.read_only_tools()\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003eWorker：继承父 sandbox；allowlist 加 \u003ccode\u003ewrite/edit/bash\u003c/code\u003e + \u003ccode\u003ehost.read_only_tools()\u003c/code\u003e；\u003ccode\u003ewrite_scope\u003c/code\u003e 校验 write/edit 路径。\u003c/li\u003e\n\u003cli\u003eW1：\u003ccode\u003eAgentConfig.write_lock: Option\u0026lt;Arc\u0026lt;tokio::sync::Mutex\u0026lt;()\u0026gt;\u0026gt;\u0026gt;\u003c/code\u003e，CLI/TUI 创建，父与 Worker 共享；dispatch 在 write/edit/bash 前持有。\u003c/li\u003e\n\u003cli\u003esidecar manifest 增加 \u003ccode\u003eread_only\u003c/code\u003e（默认 true）；\u003ccode\u003eExtensionHost::read_only_tools()\u003c/code\u003e 只暴露只读插件的工具给子 agent。\u003c/li\u003e\n\u003cli\u003e限制：bash 不受 \u003ccode\u003ewrite_scope\u003c/code\u003e 约束，只靠全局锁串行；Worker 在父 \u003ccode\u003eapproval=ask\u003c/code\u003e 下写会被子 agent 的拒绝式 approver 拒绝（安全默认）。mutating external tool 仍只属于主 session。\u003c/li\u003e\n\u003cli\u003e测试：Worker tool view/profile 事件、Explore + Python 只读插件工具、write_scope 前缀单测、原有并行/超时/错误隔离。\u003c/li\u003e\n\u003c/ul\u003e\n","path":"docs/board/M4-003-subagent-capability-profiles.md"},{"id":"M4-004","title":"Subagent full inheritance (explicit opt-in)","status":"done","milestone":"M4","module":"loop","size":"M","priority":"P2","updated":"2026-10-20","completed":"2026-10-20","depends_on":["M4-003"],"docs":["adr-0014","adr-0011","exec"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e允许自定义 subagent 继承父 session 的完整工具/插件集合，而不只是 profile。\u003c/li\u003e\n\u003cli\u003e必须显式 \u003ccode\u003e--allow-subagent-inheritance\u003c/code\u003e；默认关闭。\u003c/li\u003e\n\u003cli\u003e继承时仍剥离 \u003ccode\u003esubagent\u003c/code\u003e 工具，禁止嵌套；保留父 sandbox/approval/write lock/write_scope。\u003c/li\u003e\n\u003cli\u003e不改变默认 full-access 边界；inherit 的 access 来自父配置。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nfull inheritance 只能显式开启，默认关闭。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\ninherit 的 tool view 记录在 spawn profile，且不包含 \u003ccode\u003esubagent\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n继承父 sandbox/approval/write lock/plan mode；不默认放宽 full-access。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n无 flag 时返回明确错误，不启动子运行。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003esubagent\u003c/code\u003e schema 增加 \u003ccode\u003eprofile: \"inherit\"\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eAgentConfig.allow_subagent_inheritance\u003c/code\u003e（默认 false）；CLI \u003ccode\u003e--allow-subagent-inheritance\u003c/code\u003e 同时覆盖 \u003ccode\u003eexec\u003c/code\u003e 与 \u003ccode\u003etui\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003einherit：复制父 allowed_tools（或从 built-ins + extension specs 构造全集），再移除 \u003ccode\u003esubagent\u003c/code\u003e；共享父 sandbox/approval/plan_mode/write_lock/write_scope。\u003c/li\u003e\n\u003cli\u003espawn 事件 profile 记录 \u003ccode\u003einherit\u003c/code\u003e；无 flag 时 tool result 报错，父 agent 继续。\u003c/li\u003e\n\u003cli\u003e测试：默认拒绝 + 明确错误、显式允许后 tool view 包含 write/bash 但不含 subagent。\u003c/li\u003e\n\u003cli\u003e这是 C 的 v1：显式、可审计、不可递归；不等于默认给 subagent full-access。\u003c/li\u003e\n\u003c/ul\u003e\n","path":"docs/board/M4-004-subagent-full-inheritance.md"},{"id":"M4-005","title":"Goal run evaluator loop (TUI v1)","status":"done","milestone":"M4","module":"loop","size":"M","priority":"P2","updated":"2026-10-20","completed":"2026-10-20","depends_on":["M4-001"],"docs":["adr-0014","tui"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003e/goal \u0026lt;condition\u0026gt;\u003c/code\u003e 设置后立即启动；\u003ccode\u003e/goal run\u003c/code\u003e 可重新启动；最多 6 轮。\u003c/li\u003e\n\u003cli\u003e每轮结束用独立 evaluator 判断 met / not_met / impossible；evaluator 无工具、独立请求。\u003c/li\u003e\n\u003cli\u003everdict 写入 \u003ccode\u003egoal_verdict\u003c/code\u003e 事件；met 自动清除 goal，impossible/预算耗尽停止。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e/goal stop\u003c/code\u003e 停止；\u003ccode\u003e/goal clear\u003c/code\u003e 停止并清除；\u003ccode\u003e/goal\u003c/code\u003e 显示 run 状态。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nevaluator 不改变 permission profile，也不带工具。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n目标达成/不可能/预算耗尽都能停止并记录原因（TUI）。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003e/goal \u0026lt;condition\u0026gt;\u003c/code\u003e 自动续跑，PTY 端到端验证 not_met → met → clear。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nevaluator 返回未知/缺失 status 时停止，不继续烧 token。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e新增 \u003ccode\u003ecrates/niucode-cli/src/goal.rs\u003c/code\u003e：evaluator prompt、30s timeout、JSON verdict 解析（支持 fenced JSON）。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eGoalAction::Run/Stop\u003c/code\u003e；\u003ccode\u003eSessionUiState.goal_run/goal_turns/pending_prompt\u003c/code\u003e；Set 分支同时启动 run。\u003c/li\u003e\n\u003cli\u003e主循环支持 queued auto prompt；成功后调用 evaluator；\u003ccode\u003eGoalVerdict\u003c/code\u003e 事件；met 追加 \u003ccode\u003eGoalCleared\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e预算 \u003ccode\u003eMAX_GOAL_TURNS=6\u003c/code\u003e；plan mode 下拒绝 \u003ccode\u003e/goal run\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e测试：verdict 解析（met/not_met/impossible/非法）、\u003ccode\u003e/goal run\u003c/code\u003e 解析、PTY 端到端两轮 evaluator。\u003c/li\u003e\n\u003cli\u003eheadless \u003ccode\u003eexec --goal\u003c/code\u003e 与 JSON 退出码在 M4-008。\u003c/li\u003e\n\u003c/ul\u003e\n","path":"docs/board/M4-005-goal-run-loop.md"},{"id":"M4-006","title":"Worker worktree write isolation","status":"done","milestone":"M4","module":"tools","size":"M","priority":"P2","updated":"2026-10-20","completed":"2026-10-20","depends_on":["M4-003"],"docs":["adr-0026","tui"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eWorker \u003ccode\u003eworktree=true\u003c/code\u003e 使用全局 project worktrees 下的 detached git worktree。\u003c/li\u003e\n\u003cli\u003e结束后生成 patch，主 session review/apply。\u003c/li\u003e\n\u003cli\u003e非 git fallback 到共享 workspace + W1。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n两个 Worker worktree 独立，patch 分别包含各自修改。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n主 workspace 不被 Worker 直接修改。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\npatch 路径写入结果摘要；\u003ccode\u003eniucode worktree apply --patch\u003c/code\u003e 可 check/apply。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n非 git workspace 回退共享 workdir（返回 None）。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nworktree 清理。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e核心单测：两个 worktree、patch、parent 不变、非 git fallback。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003esubagent\u003c/code\u003e schema 增加 \u003ccode\u003eworktree\u003c/code\u003e；仅 Worker 可用。\u003c/li\u003e\n\u003cli\u003e未做：自动 merge/冲突处理、worktree 内 extension host 单独挂载、patch 二进制审查 UI。\u003c/li\u003e\n\u003c/ul\u003e\n","path":"docs/board/M4-006-worktree-isolation.md"},{"id":"M4-007","title":"Extension capability sandbox + worker pool","status":"done","milestone":"M4","module":"extensions","size":"L","priority":"P1","updated":"2026-10-20","completed":"2026-10-20","depends_on":["M4-002"],"docs":["adr-0025","adr-0013"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003emanifest capabilities（fs/network/subprocess）与 worker pool。\u003c/li\u003e\n\u003cli\u003ebwrap 默认无网络、只读 workspace；高风险能力显式授权。\u003c/li\u003e\n\u003cli\u003esubagent 共享 session host；mount 审计 capabilities/digest。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n默认 network off；越权网络调用失败（sidecar 测试）。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n默认 workspace 只读；\u003ccode\u003efs_write\u003c/code\u003e 才允许写（sidecar 测试）。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003eworkers=2\u003c/code\u003e 实际启动两个 worker，并发调用落到不同 worker。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003eextension_mount\u003c/code\u003e 记录 capabilities/digest/workers。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nsubagent 共享 host，不复制插件进程（既有 host 路径）。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n未知 capability 拒绝挂载。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003ebwrap bind \u003ccode\u003e/usr\u003c/code\u003e \u003ccode\u003e/bin\u003c/code\u003e \u003ccode\u003e/lib\u003c/code\u003e \u003ccode\u003e/lib64\u003c/code\u003e \u003ccode\u003e/etc\u003c/code\u003e、workspace、tmpfs \u003ccode\u003e/tmp\u003c/code\u003e；env clean。\u003c/li\u003e\n\u003cli\u003eworker index 通过 \u003ccode\u003eNIUCODE_EXTENSION_WORKER\u003c/code\u003e 注入，测试用 PID namespace 内 PID 不可区分。\u003c/li\u003e\n\u003cli\u003e未完成：manifest 签名/远程分发、\u003ccode\u003esubprocess\u003c/code\u003e 强隔离、动态 bind 白名单。\u003c/li\u003e\n\u003c/ul\u003e\n","path":"docs/board/M4-007-extension-isolation.md"},{"id":"M4-008","title":"Headless goal run (exec --goal)","status":"done","milestone":"M4","module":"loop","size":"M","priority":"P2","updated":"2026-10-20","completed":"2026-10-20","depends_on":["M4-005"],"docs":["adr-0023","exec"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eniucode exec --goal \u0026lt;condition\u0026gt; --max-goal-turns N\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e复用 actor/evaluator；not_met 继续，met/impossible/budget 终止。\u003c/li\u003e\n\u003cli\u003eJSON verdict 与稳定退出码。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nreplay fixture 覆盖 met / impossible / budget。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003e--json\u003c/code\u003e 输出 \u003ccode\u003egoal_verdict\u003c/code\u003e 与 \u003ccode\u003egoal_done\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n退出码 0 / 2 / 3；取消 130；错误 1。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nGoalSet/GoalVerdict/GoalCleared 写 session。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e离线 fixture：met 两轮、impossible、budget 两轮均通过。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e--max-goal-turns=0\u003c/code\u003e 显式拒绝。\u003c/li\u003e\n\u003cli\u003ecancellation 走同一 tokio select，cleanup 后返回 130。\u003c/li\u003e\n\u003c/ul\u003e\n","path":"docs/board/M4-008-headless-goal-run.md"},{"id":"M4-009","title":"TUI terminal-state hardening and max-steps control","status":"done","milestone":"M4","module":"tui","size":"S","priority":"P1","updated":"2026-10-20","completed":"2026-10-20","depends_on":["M4-001","M4-005"],"docs":["tui"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e鼠标捕获只在 slash 菜单打开时启用；菜单关闭/提交/退出后释放，恢复终端原生复制和拖拽。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eTerminalGuard\u003c/code\u003e 用 Drop 统一恢复 raw mode、bracketed paste、mouse capture 和 cursor。\u003c/li\u003e\n\u003cli\u003eTUI 增加 \u003ccode\u003e--max-steps\u003c/code\u003e，默认 24；max-steps 错误给出提升提示，不丢已写文件。\u003c/li\u003e\n\u003cli\u003e鼠标 cursor-position 查询失败时退化为相对 hover，不长时间卡住。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nmax-steps 后回到 prompt，可继续输入；不残留鼠标捕获。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n正常提交、slash 菜单、Ctrl-C、panic 路径都能释放终端状态。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nTUI 和 exec 的 max-steps 默认值一致，均可覆盖。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nPTY 回归覆盖菜单、resize、审批、max-steps 和 goal run。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eTerminalGuard::enter/drop\u003c/code\u003e；动态 \u003ccode\u003esync_mouse_capture\u003c/code\u003e；cursor 查询在菜单打开时、capture 前执行；失败后走相对 hover。\u003c/li\u003e\n\u003cli\u003eTUI 启动先发 \u003ccode\u003eDisableMouseCapture\u003c/code\u003e / \u003ccode\u003eDisableBracketedPaste\u003c/code\u003e / \u003ccode\u003eLeaveAlternateScreen\u003c/code\u003e / \u003ccode\u003eShow\u003c/code\u003e / \u003ccode\u003eResetColor\u003c/code\u003e，清掉上一次崩溃可能残留的终端模式。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003erun_tui --max-steps\u003c/code\u003e（当时默认 24）、\u003ccode\u003eexec --max-steps\u003c/code\u003e（当时默认 24）；M4-012 改为默认 0（256 安全 cap）。\u003c/li\u003e\n\u003cli\u003e复现：\u003ccode\u003etui --max-steps 1 --replay golden-read.json\u003c/code\u003e → \u003ccode\u003emax steps reached\u003c/code\u003e → 仍出现 prompt；鼠标使能只发生在 \u003ccode\u003e/\u003c/code\u003e 菜单，错误后立即释放。\u003c/li\u003e\n\u003cli\u003e2048 闭环项目在 \u003ccode\u003eniucode-proj/proj_00\u003c/code\u003e：16 个逻辑测试 + 11 个浏览器 e2e（移动、合并、计分、undo、胜负、键盘、触摸、tile containment）。\u003c/li\u003e\n\u003c/ul\u003e\n","path":"docs/board/M4-009-tui-terminal-hardening.md"},{"id":"M4-010","title":"Session lifecycle commands: reload/reset/resume","status":"done","milestone":"M4","module":"tui","size":"M","priority":"P2","updated":"2026-10-20","completed":"2026-10-20","depends_on":["M4-001","M4-009"],"docs":["tui"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003e/reload\u003c/code\u003e：重读 AGENTS.md，显示 sources/digest，下一次 turn 生效。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e/clear\u003c/code\u003e：新对话，保留 plan/goal，停止 goal run，保留输入历史。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e/reset\u003c/code\u003e：新对话 + 清 plan/goal/pending/输入历史 + reload instructions。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e/resume [path|id]\u003c/code\u003e：列最近 session 或切换到指定 session，恢复 history/plan/goal，停止 goal run。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e/resume\u003c/code\u003e 不改 cwd/model；不一致时警告。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n三条命令进入 CommandRegistry、自动补全和 \u003ccode\u003e/help\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003e/reset\u003c/code\u003e 与 \u003ccode\u003e/clear\u003c/code\u003e 的差异可观察、可测试。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003e/resume\u003c/code\u003e 能列出并切换 session，恢复投影状态。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nPTY 覆盖 reload → plan → goal → clear → reset → resume；无 panic。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eSessionUiState.clear_history\u003c/code\u003e 把 \u003ccode\u003e/reset\u003c/code\u003e 的输入历史清空请求传回行编辑器。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e/clear\u003c/code\u003e 将保留的 plan/goal 重新写入新 session 的 \u003ccode\u003ePlanMode\u003c/code\u003e / \u003ccode\u003eGoalSet\u003c/code\u003e 事件。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003erecent_sessions\u003c/code\u003e 按 mtime 取最近 8 个；\u003ccode\u003eresolve_session_path\u003c/code\u003e 支持相对当前目录、session 目录和省略 \u003ccode\u003e.jsonl\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e/reload\u003c/code\u003e 只处理 AGENTS.md；extension host 仍在 session 生命周期内，重启 TUI 才重新挂载。\u003c/li\u003e\n\u003c/ul\u003e\n","path":"docs/board/M4-010-session-lifecycle-commands.md"},{"id":"M4-011","title":"Runtime /model and /permissions","status":"done","milestone":"M4","module":"tui","size":"M","priority":"P2","updated":"2026-10-20","completed":"2026-10-20","depends_on":["M4-001","M4-010"],"docs":["adr-0015","tui"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003e/model\u003c/code\u003e 显示当前模型和建议；\u003ccode\u003e/model \u0026lt;name\u0026gt;\u003c/code\u003e 切换当前 provider 内的模型。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e/permissions\u003c/code\u003e 显示当前 policy；切换 ask/review/full-access/ci。\u003c/li\u003e\n\u003cli\u003e两者都写入事件，下一次 turn 生效；\u003ccode\u003e/resume\u003c/code\u003e 恢复，\u003ccode\u003e/clear\u003c/code\u003e 保留，\u003ccode\u003e/reset\u003c/code\u003e 清除。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e/status\u003c/code\u003e 显示生效 model 和 permission profile。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nmodel/permission 选择事件可 resume；clear/reset 语义明确。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003e/model\u003c/code\u003e 不允许跨 provider，避免 endpoint/auth 错配。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\npermission profile 映射到现有 sandbox/network/approval，不新增执行层。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nfull-access 有显式警告；\u003ccode\u003e/plan\u003c/code\u003e 仍是独立 mode。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nPTY 覆盖 model switch、provider guard、permissions、clear/reset/resume、status。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eModelChange { model }\u003c/code\u003e / \u003ccode\u003ePermissionChange { profile, sandbox, approval, network }\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ePermissionProfile::{Ask,Review,FullAccess,Ci}\u003c/code\u003e；\u003ccode\u003eapply\u003c/code\u003e 只改 AgentConfig 的既有字段。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eapply_runtime_config\u003c/code\u003e 在每个 turn 前应用 model/permission；goal 和 plan allowlist 仍在 TUI 层。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e/model\u003c/code\u003e 建议列表：\u003ccode\u003eNIUCODE_MODEL_CHOICES\u003c/code\u003e 或内置列表；无 virtual model/router。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e/model\u003c/code\u003e / \u003ccode\u003e/permissions\u003c/code\u003e 的参数以行编辑器下拉呈现；裸命令 Enter 显示当前值，方向键/鼠标/Tab 选择后填入。\u003c/li\u003e\n\u003cli\u003ePi 的 selection/dispatch 分离作为参考；v1 只记录选择，provider 继续使用 \u003ccode\u003eCompletionRequest.model\u003c/code\u003e。\u003c/li\u003e\n\u003c/ul\u003e\n","path":"docs/board/M4-011-runtime-model-permissions.md"},{"id":"M4-012","title":"Provider retry, unbounded turns, manual compact","status":"done","milestone":"M4","module":"loop","size":"M","priority":"P1","updated":"2026-10-20","completed":"2026-10-20","depends_on":["M4-005","M4-009"],"docs":["adr-0016","tui","exec"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e网络/stream decode/retryable HTTP 在流未产生事件时重试 3 次。\u003c/li\u003e\n\u003cli\u003eContextOverflow 强制 compact 后重试本轮。\u003c/li\u003e\n\u003cli\u003e默认 \u003ccode\u003emax_steps=0\u003c/code\u003e（无硬上限，256 安全 cap）；保留显式 \u003ccode\u003e--max-steps\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e/compact\u003c/code\u003e 手动压缩上下文；自动压缩仍按预算 75%。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n空流 Decode/Network 失败会重试并成功。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n已经输出 partial text 后失败不重放。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003e/compact\u003c/code\u003e 写入 compaction 事件并降低投影。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n默认 CLI 无 24-turn 截断；\u003ccode\u003e--max-steps\u003c/code\u003e 仍可显式限制。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nsubagent 走同一 loop 重试路径。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eMAX_PROVIDER_RETRIES=3\u003c/code\u003e，250ms→500ms→1s（或 Retry-After，上限 10s）。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eProviderError::Decode\u003c/code\u003e 加入 retryable；agent 以 \u003ccode\u003eemitted\u003c/code\u003e 保护安全点。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003emaybe_compact(..., force)\u003c/code\u003e；ContextOverflow 强制一次。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eAgentConfig::new\u003c/code\u003e / CLI 默认 max_steps=0；\u003ccode\u003eUNBOUNDED_SAFETY_TURNS=256\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e/compact\u003c/code\u003e 复用 \u003ccode\u003ebuild_handoff\u003c/code\u003e，不调用模型。\u003c/li\u003e\n\u003cli\u003e测试：resilience 两例、手动 compact PTY、现有全量回归。\u003c/li\u003e\n\u003c/ul\u003e\n","path":"docs/board/M4-012-provider-resilience-compaction.md"},{"id":"M5-001","title":"Provider seam and cross-provider model catalog","status":"done","milestone":"M5","module":"providers","size":"M","priority":"P0","updated":"2026-10-20","completed":"2026-10-20","depends_on":["M4-011"],"docs":["adr-0017","provider","tui"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e静态 ProviderDescriptor / ModelDescriptor catalog。\u003c/li\u003e\n\u003cli\u003ecanonical \u003ccode\u003eprovider/model\u003c/code\u003e；跨 provider \u003ccode\u003e/model\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e惰性凭据解析与运行时 ProviderFactory。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003emodel_change { provider, model }\u003c/code\u003e 原子事件。\u003c/li\u003e\n\u003cli\u003econtext budget 从模型 context window 派生；\u003ccode\u003e--context-budget 0\u003c/code\u003e = auto。\u003c/li\u003e\n\u003cli\u003eTUI 下拉、\u003ccode\u003e/status\u003c/code\u003e、\u003ccode\u003e/clear\u003c/code\u003e/\u003ccode\u003e/reset\u003c/code\u003e 的 provider 状态。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nDeepSeek/OpenAI catalog 与 canonical 选择解析。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nTUI 从 DeepSeek 切到 OpenAI 时重建 provider，不发起网络请求也可验证。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nmodel_change 记录 provider；/status 显示 provider/model。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n默认预算由模型窗口派生；显式 --context-budget 覆盖。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003e/model\u003c/code\u003e 下拉按凭据可用性过滤；无凭据 provider 不进入候选。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003eexec\u003c/code\u003e 的跨 provider \u003ccode\u003e--model provider/model\u003c/code\u003e 走同一 catalog/ProviderFactory。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003eSessionStart\u003c/code\u003e 写入 provider；resume 可从事件恢复。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eniucode-provider\u003c/code\u003e 新增 catalog、ModelSelection、derived_context_budget。\u003c/li\u003e\n\u003cli\u003eCLI 新增 ProviderFactory：惰性 AuthStore、按 provider 构造 OpenAiProvider、记录 wrapper 兼容。\u003c/li\u003e\n\u003cli\u003eTUI 的 run 接受 Arc\u003cdyn Provider\u003e + factory；切换失败不修改 state。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003econtext_budget_auto\u003c/code\u003e 只在 CLI 显式 0（默认）时开启；TUI 每 turn 重算。\u003c/li\u003e\n\u003cli\u003e跨 provider PTY：DeepSeek → OpenAI，\u003ccode\u003e/status\u003c/code\u003e 显示 \u003ccode\u003eopenai/gpt-4o\u003c/code\u003e 与 auto budget 108800。\u003c/li\u003e\n\u003cli\u003e凭据过滤 PTY：只有 DEEPSEEK_API_KEY 时 \u003ccode\u003e/model\u003c/code\u003e 不出现 openai 候选；SessionStart.provider=deepseek。\u003c/li\u003e\n\u003cli\u003e已知边界：exec 跨 provider 尚未做真实网络 e2e；静态 catalog 需随模型更新；SessionStart 旧日志 provider 为空。\u003c/li\u003e\n\u003c/ul\u003e\n","path":"docs/board/M5-001-provider-seam.md"},{"id":"M5-002","title":"Global per-project workspace and session index","status":"done","milestone":"M5","module":"workspace","size":"M","priority":"P1","updated":"2026-10-20","completed":"2026-10-20","depends_on":["M5-001"],"docs":["adr-0018","tui","exec"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003e~/.niucode/projects/\u0026lt;key\u0026gt;/\u003c/code\u003e：sessions / proposals / backups / extensions / cache / worktrees。\u003c/li\u003e\n\u003cli\u003e项目根零 \u003ccode\u003e.niucode\u003c/code\u003e；旧路径硬切。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eproject.toml\u003c/code\u003e canonical cwd / first_seen / last_seen。\u003c/li\u003e\n\u003cli\u003esession 标题从首条 user message 派生；\u003ccode\u003e/resume\u003c/code\u003e 当前项目，\u003ccode\u003e/resume --all\u003c/code\u003e 跨项目。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003econfig.toml\u003c/code\u003e 默认 provider/model/context，CLI 覆盖。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eniucode gc\u003c/code\u003e dry-run；显式清理。\u003c/li\u003e\n\u003cli\u003eToolResult 1 MiB 上限。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n工作区不创建项目 \u003ccode\u003e.niucode\u003c/code\u003e；project-key 稳定。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nsessions 写入项目目录；旧 flat sessions 不自动列出。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003e/resume\u003c/code\u003e 显示首条 prompt / provider / model / 相对时间；\u003ccode\u003e--all\u003c/code\u003e 跨项目。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003econfig.toml\u003c/code\u003e provider/model/context 默认生效，显式 CLI 优先。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003eniucode gc\u003c/code\u003e 默认只读；\u003ccode\u003e--apply\u003c/code\u003e 清 cache/旧 backups/proposals；session 需 \u003ccode\u003e--prune-sessions --yes\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nToolResult 1 MiB head/tail 截断。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n全局 extensions 目录挂载；项目 \u003ccode\u003e.niucode/extensions\u003c/code\u003e 不再读取。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eworkspace.rs\u003c/code\u003e 负责 global root、project key、project.toml、目录布局。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003esession_summary\u003c/code\u003e 读首条 user_message；\u003ccode\u003e/resume\u003c/code\u003e 最近 10 个、\u003ccode\u003e--all\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eniucode gc\u003c/code\u003e 默认 dry-run；\u003ccode\u003e--apply\u003c/code\u003e 保留最近 5 backups / 10 proposals，清 cache。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ecap_tool_output\u003c/code\u003e 1 MiB；单测覆盖 head/tail。\u003c/li\u003e\n\u003cli\u003e旧 sessions/extensions 不迁移；用户需手工处理。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e/resume\u003c/code\u003e 仍是文本列表，交互式 picker 留到 TUI inline 重写。\u003c/li\u003e\n\u003c/ul\u003e\n","path":"docs/board/M5-002-global-workspace.md"},{"id":"M5-003","title":"Inline ratatui input layer","status":"review","milestone":"M5","module":"tui","size":"L","priority":"P1","updated":"2026-10-20","completed":null,"depends_on":["M5-002"],"docs":["adr-0019","tui"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eratatui inline viewport 的 picker/help、input、footer。\u003c/li\u003e\n\u003cli\u003etranscript 保持原生 scrollback；不进入 alternate screen。\u003c/li\u003e\n\u003cli\u003epicker 鼠标捕获；linear fallback。\u003c/li\u003e\n\u003cli\u003e迁移期 \u003ccode\u003eNIUCODE_TUI_INLINE=1\u003c/code\u003e opt-in。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nratatui 0.30 + crossterm 0.28 backend 接入。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\ninline viewport 绘制 footer / input / picker。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\ncursor-position 不可用时自动回退 linear editor。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n多行输入（3 行可视）、Ctrl-J/Shift+Enter 换行。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n鼠标 picker hover/click；绝对坐标命中。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003e@\u003c/code\u003e 文件补全；根 \u003ccode\u003e.gitignore\u003c/code\u003e 基础过滤。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"/\u003e\n默认切换；Ghostty 当前因覆盖问题回退 linear，其他终端 inline。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nPTY 终端模拟器验证 hover 行命中；单元测试覆盖 cursor/gitignore。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003einline.rs\u003c/code\u003e 固定 8 行 viewport：5 行 picker/help + 2 行 input + 1 行 footer。\u003c/li\u003e\n\u003cli\u003e支持基本编辑、历史、slash/model/permissions picker；尚未完成鼠标、多行布局、Ctrl-R 完整行为。\u003c/li\u003e\n\u003cli\u003e非 Ghostty 默认 inline；Ghostty 暂时默认 linear；\u003ccode\u003eNIUCODE_TUI_INLINE=1\u003c/code\u003e 可强制。\u003c/li\u003e\n\u003cli\u003ePTY 终端模拟器验证 picker 行 hit-test；默认 3 行 / picker 6 行动态 viewport。\u003c/li\u003e\n\u003cli\u003e已知边界：长行不横向滚动；嵌套 \u003ccode\u003e.gitignore\u003c/code\u003e/negation 未完整支持；TestBackend 快照未覆盖。\u003c/li\u003e\n\u003c/ul\u003e\n","path":"docs/board/M5-003-inline-ratatui.md"},{"id":"M5-004","title":"Isolated /init proposal and apply","status":"done","milestone":"M5","module":"cli","size":"M","priority":"P1","updated":"2026-10-20","completed":"2026-10-20","depends_on":["M5-003"],"docs":["adr-0020","tui","architecture"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e独立只读 init session；8 turns / 120s。\u003c/li\u003e\n\u003cli\u003e工具白名单 read/grep/glob；无 subagent/extension。\u003c/li\u003e\n\u003cli\u003e固定章节 AGENTS.md；确定性 scan + 模型生成。\u003c/li\u003e\n\u003cli\u003eproposal 事件；\u003ccode\u003e/init apply\u003c/code\u003e 显式写入。\u003c/li\u003e\n\u003cli\u003e备份到全局 project backups；plan mode 只生成。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003einit_proposal { content, path }\u003c/code\u003e 事件；resume 恢复。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003e/init\u003c/code\u003e 预览（新文件全文 / 已有文件 unified diff）。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003e/init apply\u003c/code\u003e 走 Toolbox、read-before-write、policy。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n覆盖前备份 \u003ccode\u003ebacks/AGENTS-\u0026lt;ts\u0026gt;.md\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nplan mode 生成成功、apply 被拒绝。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n模型输出缺章节时回退到 scan 模板。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n软目标 100 行 / 6 KiB 警告。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003e/init apply\u003c/code\u003e 后再 reload instructions。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003ePTY + replay fixture：proposal/apply 成功；已有 AGENTS.md 的备份生成；plan mode apply 被拒绝。\u003c/li\u003e\n\u003cli\u003e单测覆盖 fallback 固定章节、fence 清理、required sections。\u003c/li\u003e\n\u003cli\u003e未做：模型生成内容的语义 diff 审查；init proposal 的 TUI 选择器/编辑器内联修订。\u003c/li\u003e\n\u003c/ul\u003e\n","path":"docs/board/M5-004-init-proposal.md"},{"id":"M5-005","title":"Compact inline area and visible reasoning","status":"done","milestone":"M5","module":"tui","size":"S","priority":"P1","updated":"2026-10-20","completed":"2026-10-20","depends_on":["M5-003"],"docs":["adr-0021","tui"],"blocked_reason":null,"body_html":"\u003ch2\u003e范围\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e默认底部区固定 3 行（输入 2 + footer）。\u003c/li\u003e\n\u003cli\u003epicker 打开时扩到 6 行，关闭恢复。\u003c/li\u003e\n\u003cli\u003ereasoning 实时显示，而不是只显示 thinking 标签。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n无 picker 时 \u003ccode\u003e2 input + 1 footer\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\npicker 打开时 \u003ccode\u003e3 picker + 2 input + footer\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003eReasoningDelta\u003c/code\u003e 文本可见、保留换行。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nanswer/tool 开始前关闭 reasoning 行。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nPTY + replay fixture 验证 reasoning 文本和 answer 都出现。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e记录\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003einline viewport 重建成 3/6 行；移除常驻 help 墙；不再在 Drop 里 MoveTo。\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eThink\u003c/code\u003e 标签保留，实际 reasoning 以 dim 流输出。\u003c/li\u003e\n\u003cli\u003e未做 reasoning 折叠/开关；长 reasoning 会占用 transcript。\u003c/li\u003e\n\u003c/ul\u003e\n","path":"docs/board/M5-005-tui-density.md"},{"id":"M5-006","title":"Stabilize inline TUI on Ghostty","status":"backlog","milestone":"M5","module":"tui","size":"M","priority":"P1","updated":"2026-10-20","completed":null,"depends_on":["M5-003","M5-005"],"docs":["adr-0022","adr-0019","tui"],"blocked_reason":null,"body_html":"\u003ch2\u003e问题\u003c/h2\u003e\n\u003cp\u003eGhostty 1.3.1 上 inline viewport 仍出现输入区/背景覆盖或错位；tmux 抓屏正常不能代表 Ghostty。\u003c/p\u003e\n\u003ch2\u003e验收\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"/\u003e\n在真实 Ghostty 中抓屏：提交前后、picker 展开/关闭、滚动多轮均不覆盖 transcript。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"/\u003e\n固定/动态 viewport 的 cursor/clear 语义有终端级回归测试。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"/\u003e\n通过后移除 Ghostty 默认 linear fallback。\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"/\u003e\n保持 \u003ccode\u003eNIUCODE_TUI_LINEAR=1\u003c/code\u003e 作为显式 fallback。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e备注\u003c/h2\u003e\n\u003cp\u003e当前 Ghostty 默认 linear；\u003ccode\u003eNIUCODE_TUI_INLINE=1\u003c/code\u003e 可强制 inline 复现。\n2026-10-21：linear 的 startup 重叠已单独修复——启动信息统一走 stdout、显式 flush、workspace 只打印 project key；不再出现 prompt 覆盖 workspace 行。\u003c/p\u003e\n","path":"docs/board/M5-006-ghostty-inline.md"},{"id":"M5-007","title":"Codex-compatible skills discovery and trust","status":"done","milestone":"M5","module":"cli","size":"M","priority":"P1","updated":"2026-10-20","completed":"2026-10-20","depends_on":["M5-002"],"docs":["adr-0024","tui"],"blocked_reason
